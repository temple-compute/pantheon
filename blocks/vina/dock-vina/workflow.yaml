kind: horus_workflow
name: Dock with AutoDock Vina
tasks:
- kind: horus_task
  id: dock_vina
  name: Dock with AutoDock Vina
  description: Dock each ligand into the box and score its poses.
  inputs:
  - id: vina_inputs
    name: Vina inputs
    kind: file
    path: vina_inputs.tar.gz
  - id: exhaustiveness
    name: Exhaustiveness
    kind: number
    path: params/exhaustiveness.txt
    value: 16
    min: 1
    max: 64
    step: 1
  - id: n_poses
    name: Poses per ligand
    kind: number
    path: params/n_poses.txt
    value: 9
    min: 1
    max: 20
    step: 1
  - id: cpus
    name: CPUs
    kind: number
    path: params/cpus.txt
    value: 2
    min: 1
    max: 128
    step: 1
  outputs:
  - id: docking_out
    name: Docking results
    kind: file
    path: results/docking_out.tar.gz
  resources:
    cpus: 2
    memory_gb: 4
    walltime: 01:00:00
  executor:
    kind: conda_python_environment
    conda: micromamba
    python_version: '3.11'
    channels:
    - conda-forge
    conda_requirements:
    - vina==1.2.7
    - numpy
  runtime:
    kind: python_script
    script: scripts/dock.py
    args: --inputs ${vina_inputs} --out ${docking_out} --exhaustiveness ${exhaustiveness} --n-poses ${n_poses} --cpu ${cpus}
  target:
    kind: local
