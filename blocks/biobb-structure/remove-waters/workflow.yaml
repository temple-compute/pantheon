kind: horus_workflow
name: Remove waters
tasks:
- kind: horus_task
  id: remove_waters
  name: Remove waters
  description: Strip crystal waters from a PDB file.
  inputs:
  - id: structure
    name: Structure
    kind: file
    path: examples/1aki.pdb
  outputs:
  - id: dry_structure
    name: Structure without waters
    kind: file
    path: results/dry.pdb
  executor:
    kind: conda_python_environment
    conda: micromamba
    python_version: '3.12'
    channels:
    - conda-forge
    - bioconda
    conda_requirements:
    - biobb_io==5.2.3
    - biobb_structure_utils==5.2.1
    - biobb_model==5.2.1
  runtime:
    kind: command
    command: remove_pdb_water --input_pdb_path ${structure} --output_pdb_path ${dry_structure}
  target:
    kind: local
