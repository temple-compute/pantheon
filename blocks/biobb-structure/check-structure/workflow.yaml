kind: horus_workflow
name: Check structure
tasks:
- kind: horus_task
  id: check_structure
  name: Check structure
  description: Report missing atoms, clashes, altlocs and other problems in a PDB file.
  inputs:
  - id: structure
    name: Structure
    kind: file
    path: examples/1aki.pdb
  outputs:
  - id: report
    name: Report
    kind: file
    path: results/report.json
  executor:
    kind: conda_python_environment
    conda: micromamba
    python_version: '3.12'
    channels:
    - conda-forge
    - bioconda
    conda_requirements:
    - biobb_io==5.2.3
    - biobb_structure_utils==5.2.1
    - biobb_model==5.2.1
  runtime:
    kind: command
    command: ln -sf ${structure} in_structure.pdb && structure_check --input_structure_path in_structure.pdb --output_summary_path ${report}
  target:
    kind: local
