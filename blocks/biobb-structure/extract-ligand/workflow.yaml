kind: horus_workflow
name: Extract ligand
tasks:
- kind: horus_task
  id: extract_ligand
  name: Extract ligand
  description: Pull a ligand out of a complex by its 3-letter code.
  inputs:
  - id: structure
    name: Complex
    kind: file
    path: examples/3htb.pdb
  - id: ligand_code
    name: Ligand code
    kind: string
    path: params/ligand_code.txt
    value: JZ4
    pattern: '[A-Za-z0-9]{1,3}'
    min_length: 1
    max_length: 3
  outputs:
  - id: ligand
    name: Ligand
    kind: file
    path: results/ligand.pdb
  executor:
    kind: conda_python_environment
    conda: micromamba
    python_version: '3.12'
    channels:
    - conda-forge
    - bioconda
    conda_requirements:
    - biobb_io==5.2.3
    - biobb_structure_utils==5.2.1
    - biobb_model==5.2.1
  runtime:
    kind: command
    command: ln -sf ${structure} in_structure.pdb && extract_heteroatoms --config '{"properties":{"heteroatoms":[{"name":"${ligand_code}"}]}}' --input_structure_path in_structure.pdb --output_heteroatom_path ${ligand}
  target:
    kind: local
