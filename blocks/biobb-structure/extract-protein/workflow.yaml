kind: horus_workflow
name: Extract protein
tasks:
- kind: horus_task
  id: extract_protein
  name: Extract protein
  description: Keep only the protein part of a structure.
  inputs:
  - id: structure
    name: Structure
    kind: file
    path: examples/3htb.pdb
  outputs:
  - id: protein
    name: Protein
    kind: file
    path: results/protein.pdb
  executor:
    kind: conda_python_environment
    conda: micromamba
    python_version: '3.12'
    channels:
    - conda-forge
    - bioconda
    conda_requirements:
    - biobb_io==5.2.3
    - biobb_structure_utils==5.2.1
    - biobb_model==5.2.1
  runtime:
    kind: command
    command: ln -sf ${structure} in_structure.pdb && extract_molecule --config '{"properties":{"molecule_type":"protein"}}' --input_structure_path in_structure.pdb --output_molecule_path ${protein}
  target:
    kind: local
