# Pinned to the openff-toolkit 0.19.0 showcase; solved on linux-64 (Oct 2026).
channels:
  - conda-forge
dependencies:
  - python=3.12
  - openff-toolkit=0.19.0
  - openff-interchange=0.5.5
  - openmm=8.6.1
  # CUDA 12 build: OpenMM JIT-compiles kernels, so the toolkit must not be newer
  # than the node driver (13.4 failed on the 13.2 driver of the tc-os GPU image).
  - cuda-version=12
  - openff-forcefields=2026.09.0
  - openff-amber-ff-ports=2025.09.0
  - pdbfixer=1.12
  - mdtraj=1.11.2
