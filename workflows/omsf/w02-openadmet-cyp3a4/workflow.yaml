kind: horus_workflow
name: OpenADMET CYP3A4 Inhibition Models

# --- reusable blocks -------------------------------------------------------
# Every openadmet step runs in one pinned conda env (conda_env.yaml), built
# once. Task working dirs are horus_workflow_results/<task>/<run>/, so
# ../../ puts the shared env at horus_workflow_results/.horus_conda_env. To use the official container instead, swap this
# anchor for `kind: docker` + `image: ghcr.io/openadmet/openadmet-models:main`
# (moving tag, see README).
_conda: &conda
  kind: conda_python_environment
  conda: micromamba # set to mamba/conda if that's what's on PATH
  environment_file: conda_env.yaml
  environment_dir: "../../.horus_conda_env"
  env:
    OADMET_NO_RICH_LOGGING: "1"
    MPLBACKEND: Agg

_shell: &shell
  kind: shell

_local: &local
  kind: local

# Full profile: Chemprop trains on GPU, so the whole train map goes here
# (a map runs every clone on one target). Fill in partition/account for your
# site and set the train task's `target: *gpu`.
_gpu: &gpu
  kind: slurm
  inner:
    kind: local
  partition: "" # <- set per site
  account: "" # <- set per site
  ntasks: 1
  cpus_per_task: 8
  mem: 32G
  gres: gpu:1
  time_limit: "12:00:00"

artifacts:
  - id: profile
    name: Run profile
    description: >-
      smoke: lgbm + rf, 2x2 CV, 50 trees, 2 threads per model, 2000 inference
      compounds (about 10 min on a laptop CPU). full: lgbm, rf, xgboost,
      catboost and chemprop with the upstream 5x5 CV, all 10k compounds
      (needs a GPU target for chemprop).
    kind: choice
    path: params/profile.txt
    options:
      - value: smoke
        label: Smoke (CPU, minutes)
      - value: full
        label: Full (upstream settings, GPU)
    value: smoke

tasks:
  - kind: horus_task
    id: fetch_data
    name: 1. Fetch CYP3A4 data
    description: >-
      Downloads the ChEMBL35 CYP3A4 IC50 aggregate (OpenADMET/data-catalogs)
      and the showcase's inference compounds (OpenADMET/openadmet-demos),
      both at pinned commits.
    outputs:
      - id: chembl_parquet
        name: ChEMBL35 CYP3A4 IC50 aggregate
        kind: file
        path: data/ChEMBL_IC50_CYP3A4_CHEMBL340_aggregated.parquet
      - id: compounds
        name: Compounds for inference
        kind: file
        path: data/compounds_for_inference.csv
    executor: *shell
    runtime:
      kind: command
      command: >-
        curl -fL --retry 3 -o ${chembl_parquet}.part
        https://raw.githubusercontent.com/OpenADMET/data-catalogs/65dd4ee35b16f532707d790ea4fa61d1fa46bbad/catalogs/activities/ChEMBL_pChEMBL_IC50/ChEMBL35_IC50/ChEMBL_IC50_CYP3A4_CHEMBL340_aggregated.parquet
        && mv ${chembl_parquet}.part ${chembl_parquet}
        && curl -fL --retry 3 -o ${compounds}.part
        https://raw.githubusercontent.com/OpenADMET/openadmet-demos/8b2c5f34ac892a3aa256d8564bd33c707fe9d11b/showcase/compounds_for_inference.csv
        && mv ${compounds}.part ${compounds}
    target: *local

  - kind: horus_task
    id: make_recipes
    name: 2. Clean data and write anvil recipes
    description: >-
      Adds the OPENADMET_* headers (showcase cells 9-13) and writes one
      cross-validation recipe per model for the selected profile, each in
      its own slot with a copy of the data.
    inputs:
      - id: chembl_parquet
        name: ChEMBL35 CYP3A4 IC50 aggregate
        kind: file
        path: data/ChEMBL_IC50_CYP3A4_CHEMBL340_aggregated.parquet
      - id: profile
        name: Run profile
        kind: choice
        path: params/profile.txt
        options:
          - value: smoke
          - value: full
        value: smoke
    outputs:
      - id: cleaned
        name: Cleaned CYP3A4 dataset
        kind: file
        path: data/cleaned_cyp3a4.csv
      - id: recipes
        name: Anvil recipes (one slot per model)
        kind: folder
        path: recipes/
    executor: *conda
    runtime:
      kind: python_script
      script: scripts/make_recipes.py
      args: >-
        --parquet ${chembl_parquet} --profile ${profile}
        --cleaned ${cleaned} --out ${recipes}
    target: *local

  # One clone per recipe slot. Smoke: 2 clones x 2 threads on the local CPU.
  # Full: switch `target` to *gpu (chemprop needs CUDA; the tree models run
  # on the allocation's CPUs).
  - kind: horus_map
    id: train
    name: 3. Train and cross-validate each model (parallel)
    description: >-
      Runs `openadmet anvil` on one recipe: featurize, train, test-set
      metrics and repeated k-fold cross-validation.
    over:
      input_id: recipes_in
      as: recipe
    max_concurrency: 2
    inputs:
      - id: recipes_in
        name: Anvil recipes
        kind: folder
        path: recipes/
    outputs:
      - id: trained
        name: Trained models
        description: One slot per model; <slot>/model is the anvil output.
        kind: folder
        path: trained/
    executor: *conda
    runtime:
      kind: command
      # anvil renames an existing --output-dir, so train into a fresh subdir.
      # Its sklearn warnings go to anvil.log; the tail is shown either way.
      command: >-
        rm -rf ${trained}/model &&
        { openadmet anvil --recipe-path ${recipe}/recipe.yaml
        --output-dir ${trained}/model > ${trained}/anvil.log 2>&1
        || { tail -n 40 ${trained}/anvil.log; exit 1; }; } &&
        grep -v Warning ${trained}/anvil.log | grep -v '^ ' | tail -n 8
    resources:
      cpus: 2
      memory_gb: 4
      gpus: 1
    target: *local

  - kind: horus_task
    id: compare
    name: 4. Compare models
    description: >-
      `openadmet compare` over every model's cross_validation_metrics.json:
      ANOVA, Levene, Tukey HSD and the PDF plots.
    inputs:
      - id: trained_in
        name: Trained models
        kind: folder
        path: trained/
    outputs:
      - id: comparisons
        name: Model comparison
        kind: folder
        path: results/comparisons/
    executor: *conda
    runtime:
      kind: python_script
      script: scripts/models.py
      args: compare --trained ${trained_in} --out ${comparisons}
    target: *local

  - kind: horus_task
    id: predict
    name: 5. Predict with the best model
    description: >-
      Picks the model with the highest mean CV R2 and runs `openadmet
      predict` on the inference compounds (first 2000 in smoke).
    inputs:
      - id: trained_in
        name: Trained models
        kind: folder
        path: trained/
      - id: compounds
        name: Compounds for inference
        kind: file
        path: data/compounds_for_inference.csv
      - id: profile
        name: Run profile
        kind: choice
        path: params/profile.txt
        options:
          - value: smoke
          - value: full
        value: smoke
    outputs:
      - id: predictions
        name: Predictions
        kind: file
        path: results/predictions.csv
    executor: *conda
    runtime:
      kind: python_script
      script: scripts/models.py
      args: >-
        predict --trained ${trained_in} --compounds ${compounds}
        --profile ${profile} --out ${predictions}
    target: *local

  - kind: horus_task
    id: report
    name: 6. Report
    description: One row of CV metrics per model, plus the top predicted CYP3A4 inhibitors.
    inputs:
      - id: trained_in
        name: Trained models
        kind: folder
        path: trained/
      - id: predictions
        name: Predictions
        kind: file
        path: results/predictions.csv
    outputs:
      - id: metrics
        name: CV metrics per model
        kind: file
        path: results/metrics.csv
      - id: top_predictions
        name: Top predicted inhibitors
        kind: file
        path: results/top_predictions.csv
    executor: *conda
    runtime:
      kind: python_script
      script: scripts/models.py
      args: >-
        report --trained ${trained_in} --predictions ${predictions}
        --out ${metrics} --top-out ${top_predictions}
    target: *local

edges:
  - source: fetch_data
    source_output: chembl_parquet
    target: make_recipes
    target_input: chembl_parquet
  - source: artifact-profile
    source_output: profile
    target: make_recipes
    target_input: profile
  - source: make_recipes
    source_output: recipes
    target: train
    target_input: recipes_in
  - source: train
    source_output: trained
    target: compare
    target_input: trained_in
  - source: train
    source_output: trained
    target: predict
    target_input: trained_in
  - source: fetch_data
    source_output: compounds
    target: predict
    target_input: compounds
  - source: artifact-profile
    source_output: profile
    target: predict
    target_input: profile
  - source: train
    source_output: trained
    target: report
    target_input: trained_in
  - source: predict
    source_output: predictions
    target: report
    target_input: predictions

orchestrator_target:
  kind: local
  working_directory: horus_workflow_results
