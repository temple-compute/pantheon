kind: horus_workflow
name: OpenADMET CYP3A4 Inhibition Models

# --- reusable blocks -------------------------------------------------------
# Every openadmet step runs in one pinned CPU-only conda env (conda_env.yaml),
# built once. Task working dirs are horus_workflow_results/<task>/<run>/, so
# ../../ puts the shared env at horus_workflow_results/.horus_conda_env. The
# executor reuses an existing env as is: after editing conda_env.yaml, delete
# that folder. To use the official container instead, see the README (docker
# or apptainer).
_conda: &conda
  kind: conda_python_environment
  conda: micromamba # set to mamba/conda if that's what's on PATH
  environment_file: conda_env.yaml
  environment_dir: "../../.horus_conda_env"
  env:
    OADMET_NO_RICH_LOGGING: "1"
    MPLBACKEND: Agg

_shell: &shell
  kind: shell

_local: &local
  kind: local

# To send the train map to a Slurm node (a map runs every clone on one
# target), fill in partition/account for your site and set the train task's
# `target: *slurm`. Keep cpus_per_task at 8 or change N_JOBS in
# scripts/make_recipes.py with it.
_slurm: &slurm
  kind: slurm
  inner:
    kind: local
  partition: "" # <- set per site
  account: "" # <- set per site
  ntasks: 1
  cpus_per_task: 8
  mem: 32G
  time_limit: "12:00:00"

artifacts:
  - id: dataset
    name: Training dataset (parquet)
    description: >-
      OpenADMET data-catalogs aggregated parquet, one row per compound, with
      OPENADMET_CANONICAL_SMILES (input) and pchembl_value_mean (regression
      target) columns. Default: ChEMBL35 CYP3A4 IC50 aggregate
      (OpenADMET/data-catalogs, pinned commit 65dd4ee).
    kind: file
    path: examples/ChEMBL_IC50_CYP3A4_CHEMBL340_aggregated.parquet
  - id: compounds
    name: Compounds to predict (CSV)
    description: >-
      CSV with SMILES in an OPENADMET_CANONICAL_SMILES column
      (OPENADMET_INCHIKEY is copied to the top list if present). Default: the
      showcase's 10,000 ZINC compounds (OpenADMET/openadmet-demos, pinned
      commit 8b2c5f3).
    kind: file
    path: examples/compounds_for_inference.csv
  - &models
    id: models
    name: Models
    description: >-
      Models to train, cross-validate, compare and pick the best from.
      Everything runs on CPU, where Chemprop takes hours, so it is not
      picked by default.
    kind: multichoice
    path: params/models.txt
    value: [lgbm, rf, xgboost, catboost]
    min_picks: 1
    options:
      - {value: lgbm, label: LightGBM}
      - {value: rf, label: Random forest}
      - {value: xgboost, label: XGBoost}
      - {value: catboost, label: CatBoost}
      - {value: chemprop, label: "Chemprop (GNN, slow on CPU)"}
  - id: cv_folds
    name: CV folds
    description: k of the repeated k-fold cross-validation (upstream 5).
    kind: number
    path: params/cv_folds.txt
    value: 5
    min: 2
    max: 10
    step: 1
  - id: cv_repeats
    name: CV repeats
    description: Repeats of the k-fold cross-validation (upstream 5).
    kind: number
    path: params/cv_repeats.txt
    value: 5
    min: 1
    max: 10
    step: 1

tasks:
  - kind: horus_task
    id: make_recipes
    name: 1. Clean data and write anvil recipes
    description: >-
      Adds the OPENADMET_* headers (showcase cells 9-13) and writes one
      cross-validation recipe per selected model, each in its own slot with
      a copy of the data.
    inputs:
      - id: dataset
        name: Training dataset (parquet)
        kind: file
        path: examples/ChEMBL_IC50_CYP3A4_CHEMBL340_aggregated.parquet
      - *models
      - id: cv_folds
        name: CV folds
        kind: number
        path: params/cv_folds.txt
      - id: cv_repeats
        name: CV repeats
        kind: number
        path: params/cv_repeats.txt
    outputs:
      - id: cleaned
        name: Cleaned CYP3A4 dataset
        kind: file
        path: data/cleaned_cyp3a4.csv
      - id: recipes
        name: Anvil recipes (one slot per model)
        kind: folder
        path: recipes/
    resources:
      cpus: 2
      memory_gb: 8
      walltime: "00:15:00"
    executor: *conda
    runtime:
      kind: python_script
      script: scripts/make_recipes.py
      args: >-
        --parquet ${dataset} --models ${models}
        --cv-folds ${cv_folds} --cv-repeats ${cv_repeats}
        --cleaned ${cleaned} --out ${recipes}
    target: *local

  # One clone per recipe slot, all models at once when the target has room:
  # a shared machine runs as many 8-CPU clones as its vCPUs allow.
  - kind: horus_map
    id: train
    name: 2. Train and cross-validate each model (parallel)
    description: >-
      Runs `openadmet anvil` on one recipe: featurize, train, test-set
      metrics and repeated k-fold cross-validation.
    over:
      input_id: recipes_in
      as: recipe
    max_concurrency: 5
    inputs:
      - id: recipes_in
        name: Anvil recipes
        kind: folder
        path: recipes/
    outputs:
      - id: trained
        name: Trained models
        description: One slot per model; <slot>/model is the anvil output.
        kind: folder
        path: trained/
    executor: *conda
    runtime:
      kind: command
      # anvil renames an existing --output-dir, so train into a fresh subdir.
      # Its sklearn warnings go to anvil.log; the tail is shown either way.
      command: >-
        rm -rf ${trained}/model &&
        { openadmet anvil --recipe-path ${recipe}/recipe.yaml
        --output-dir ${trained}/model > ${trained}/anvil.log 2>&1
        || { tail -n 40 ${trained}/anvil.log; exit 1; }; } &&
        grep -v Warning ${trained}/anvil.log | grep -v '^ ' | tail -n 8
    # One 8-CPU machine per clone (N_JOBS in make_recipes.py).
    resources:
      cpus: 8
      memory_gb: 8
      walltime: "12:00:00"
    target: *local

  - kind: horus_task
    id: compare
    name: 3. Compare models
    description: >-
      `openadmet compare` over every model's cross_validation_metrics.json:
      ANOVA, Levene, Tukey HSD and the PDF plots.
    inputs:
      - id: trained_in
        name: Trained models
        kind: folder
        path: trained/
    outputs:
      - id: comparisons
        name: Model comparison
        kind: folder
        path: results/comparisons/
    resources:
      cpus: 2
      memory_gb: 8
      walltime: "00:30:00"
    executor: *conda
    runtime:
      kind: python_script
      script: scripts/models.py
      args: compare --trained ${trained_in} --out ${comparisons}
    target: *local

  - kind: horus_task
    id: predict
    name: 4. Predict with the best model
    description: >-
      Picks the model with the highest mean CV R2 and runs `openadmet
      predict` on every inference compound.
    inputs:
      - id: trained_in
        name: Trained models
        kind: folder
        path: trained/
      - id: compounds
        name: Compounds to predict (CSV)
        kind: file
        path: examples/compounds_for_inference.csv
    outputs:
      - id: predictions
        name: Predictions
        kind: file
        path: results/predictions.csv
    resources:
      cpus: 4
      memory_gb: 16
      walltime: "02:00:00"
    executor: *conda
    runtime:
      kind: python_script
      script: scripts/models.py
      args: >-
        predict --trained ${trained_in} --compounds ${compounds}
        --out ${predictions}
    target: *local

  - kind: horus_task
    id: report
    name: 5. Report
    description: One row of CV metrics per model, plus the top predicted CYP3A4 inhibitors.
    inputs:
      - id: trained_in
        name: Trained models
        kind: folder
        path: trained/
      - id: predictions
        name: Predictions
        kind: file
        path: results/predictions.csv
    outputs:
      - id: metrics
        name: CV metrics per model
        kind: file
        path: results/metrics.csv
      - id: top_predictions
        name: Top predicted inhibitors
        kind: file
        path: results/top_predictions.csv
    executor: *conda
    runtime:
      kind: python_script
      script: scripts/models.py
      args: >-
        report --trained ${trained_in} --predictions ${predictions}
        --out ${metrics} --top-out ${top_predictions}
    target: *local

edges:
  - source: artifact-dataset
    source_output: dataset
    target: make_recipes
    target_input: dataset
  - source: artifact-models
    source_output: models
    target: make_recipes
    target_input: models
  - source: artifact-cv_folds
    source_output: cv_folds
    target: make_recipes
    target_input: cv_folds
  - source: artifact-cv_repeats
    source_output: cv_repeats
    target: make_recipes
    target_input: cv_repeats
  - source: make_recipes
    source_output: recipes
    target: train
    target_input: recipes_in
  - source: train
    source_output: trained
    target: compare
    target_input: trained_in
  - source: train
    source_output: trained
    target: predict
    target_input: trained_in
  - source: artifact-compounds
    source_output: compounds
    target: predict
    target_input: compounds
  - source: train
    source_output: trained
    target: report
    target_input: trained_in
  - source: predict
    source_output: predictions
    target: report
    target_input: predictions

orchestrator_target:
  kind: local
  working_directory: horus_workflow_results
