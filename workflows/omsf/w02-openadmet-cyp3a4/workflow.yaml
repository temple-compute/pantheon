kind: horus_workflow
name: OpenADMET CYP3A4 Inhibition Models

# --- reusable blocks -------------------------------------------------------
# Every openadmet step runs in one pinned conda env (conda_env.yaml, with a
# CUDA pytorch build that also runs on CPU), built once. Task working dirs are
# horus_workflow_results/<task>/<run>/, so ../../ puts the shared env at
# horus_workflow_results/.horus_conda_env. The executor reuses an existing env
# as is: after editing conda_env.yaml, delete that folder. On a host without a
# GPU the CUDA solve needs CONDA_OVERRIDE_CUDA=12.9 in the environment of
# `horus run` (see README). To use the official container instead, see the
# README (docker or apptainer).
_conda: &conda
  kind: conda_python_environment
  conda: micromamba # set to mamba/conda if that's what's on PATH
  environment_file: conda_env.yaml
  environment_dir: "../../.horus_conda_env"
  env:
    OADMET_NO_RICH_LOGGING: "1"
    MPLBACKEND: Agg

_shell: &shell
  kind: shell

_local: &local
  kind: local

# Chemprop trains on GPU. To send the train map to a Slurm GPU node (a map
# runs every clone on one target), fill in partition/account for your site
# and set the train task's `target: *gpu`. Keep cpus_per_task at 8 or change
# N_JOBS in scripts/make_recipes.py with it.
_gpu: &gpu
  kind: slurm
  inner:
    kind: local
  partition: "" # <- set per site
  account: "" # <- set per site
  ntasks: 1
  cpus_per_task: 8
  mem: 32G
  gres: gpu:1
  time_limit: "12:00:00"

artifacts:
  - id: dataset_url
    name: Training dataset URL
    description: >-
      OpenADMET data-catalogs aggregated parquet with one row per compound
      and the columns OPENADMET_CANONICAL_SMILES and pchembl_value_mean
      (the regression target). Default: ChEMBL35 CYP3A4 IC50 aggregate at a
      pinned commit. file:///abs/path works for a local file.
    kind: string
    path: params/dataset_url.txt
    value: https://raw.githubusercontent.com/OpenADMET/data-catalogs/65dd4ee35b16f532707d790ea4fa61d1fa46bbad/catalogs/activities/ChEMBL_pChEMBL_IC50/ChEMBL35_IC50/ChEMBL_IC50_CYP3A4_CHEMBL340_aggregated.parquet
  - id: inference_url
    name: Inference compounds URL
    description: >-
      CSV of compounds to predict, with the SMILES in an
      OPENADMET_CANONICAL_SMILES column (OPENADMET_INCHIKEY is copied to the
      top list if present). Default: the showcase's 10,000 ZINC compounds at
      a pinned commit. file:///abs/path works for a local file.
    kind: string
    path: params/inference_url.txt
    value: https://raw.githubusercontent.com/OpenADMET/openadmet-demos/8b2c5f34ac892a3aa256d8564bd33c707fe9d11b/showcase/compounds_for_inference.csv
  - id: models
    name: Models
    description: >-
      Comma list of the models to train and compare, from lgbm, rf, xgboost,
      catboost and chemprop.
    kind: string
    path: params/models.txt
    value: lgbm,rf,xgboost,catboost,chemprop
  - id: cv_folds
    name: CV folds
    description: k of the repeated k-fold cross-validation (integer >= 2, upstream 5).
    kind: number
    path: params/cv_folds.txt
    value: 5
  - id: cv_repeats
    name: CV repeats
    description: Repeats of the k-fold cross-validation (integer >= 1, upstream 5).
    kind: number
    path: params/cv_repeats.txt
    value: 5
  - id: accelerator
    name: Accelerator
    description: >-
      Device for Chemprop training and for `openadmet predict`: gpu or cpu.
      The tree models always run on CPU.
    kind: string
    path: params/accelerator.txt
    value: gpu

tasks:
  - kind: horus_task
    id: fetch_data
    name: 1. Fetch CYP3A4 data
    description: >-
      Downloads the ChEMBL35 CYP3A4 IC50 aggregate (OpenADMET/data-catalogs)
      and the showcase's inference compounds (OpenADMET/openadmet-demos),
      both at pinned commits by default.
    inputs:
      - id: dataset_url
        name: Training dataset URL
        kind: string
        path: params/dataset_url.txt
      - id: inference_url
        name: Inference compounds URL
        kind: string
        path: params/inference_url.txt
    outputs:
      - id: chembl_parquet
        name: ChEMBL35 CYP3A4 IC50 aggregate
        kind: file
        path: data/ChEMBL_IC50_CYP3A4_CHEMBL340_aggregated.parquet
      - id: compounds
        name: Compounds for inference
        kind: file
        path: data/compounds_for_inference.csv
    executor: *shell
    runtime:
      kind: command
      # The command runtime shell-quotes every substitution, so ${dataset_url}
      # needs no quotes of its own.
      command: >-
        curl -fL --retry 3 -o ${chembl_parquet}.part ${dataset_url}
        && mv ${chembl_parquet}.part ${chembl_parquet}
        && curl -fL --retry 3 -o ${compounds}.part ${inference_url}
        && mv ${compounds}.part ${compounds}
    target: *local

  - kind: horus_task
    id: make_recipes
    name: 2. Clean data and write anvil recipes
    description: >-
      Adds the OPENADMET_* headers (showcase cells 9-13) and writes one
      cross-validation recipe per selected model, each in its own slot with
      a copy of the data.
    inputs:
      - id: chembl_parquet
        name: ChEMBL35 CYP3A4 IC50 aggregate
        kind: file
        path: data/ChEMBL_IC50_CYP3A4_CHEMBL340_aggregated.parquet
      - id: models
        name: Models
        kind: string
        path: params/models.txt
      - id: cv_folds
        name: CV folds
        kind: number
        path: params/cv_folds.txt
      - id: cv_repeats
        name: CV repeats
        kind: number
        path: params/cv_repeats.txt
      - id: accelerator
        name: Accelerator
        kind: string
        path: params/accelerator.txt
    outputs:
      - id: cleaned
        name: Cleaned CYP3A4 dataset
        kind: file
        path: data/cleaned_cyp3a4.csv
      - id: recipes
        name: Anvil recipes (one slot per model)
        kind: folder
        path: recipes/
    executor: *conda
    runtime:
      kind: python_script
      script: scripts/make_recipes.py
      args: >-
        --parquet ${chembl_parquet} --models ${models}
        --cv-folds ${cv_folds} --cv-repeats ${cv_repeats}
        --accelerator ${accelerator} --cleaned ${cleaned} --out ${recipes}
    target: *local

  # One clone per recipe slot, all five default models at once. Chemprop needs
  # CUDA (accelerator gpu): run on a GPU host, or switch `target` to *gpu for
  # Slurm (the tree models then run on the allocation's CPUs).
  - kind: horus_map
    id: train
    name: 3. Train and cross-validate each model (parallel)
    description: >-
      Runs `openadmet anvil` on one recipe: featurize, train, test-set
      metrics and repeated k-fold cross-validation.
    over:
      input_id: recipes_in
      as: recipe
    max_concurrency: 5
    inputs:
      - id: recipes_in
        name: Anvil recipes
        kind: folder
        path: recipes/
    outputs:
      - id: trained
        name: Trained models
        description: One slot per model; <slot>/model is the anvil output.
        kind: folder
        path: trained/
    executor: *conda
    runtime:
      kind: command
      # anvil renames an existing --output-dir, so train into a fresh subdir.
      # Its sklearn warnings go to anvil.log; the tail is shown either way.
      command: >-
        rm -rf ${trained}/model &&
        { openadmet anvil --recipe-path ${recipe}/recipe.yaml
        --output-dir ${trained}/model > ${trained}/anvil.log 2>&1
        || { tail -n 40 ${trained}/anvil.log; exit 1; }; } &&
        grep -v Warning ${trained}/anvil.log | grep -v '^ ' | tail -n 8
    resources:
      cpus: 8
      memory_gb: 8
      gpus: 1
    target: *local

  - kind: horus_task
    id: compare
    name: 4. Compare models
    description: >-
      `openadmet compare` over every model's cross_validation_metrics.json:
      ANOVA, Levene, Tukey HSD and the PDF plots.
    inputs:
      - id: trained_in
        name: Trained models
        kind: folder
        path: trained/
    outputs:
      - id: comparisons
        name: Model comparison
        kind: folder
        path: results/comparisons/
    executor: *conda
    runtime:
      kind: python_script
      script: scripts/models.py
      args: compare --trained ${trained_in} --out ${comparisons}
    target: *local

  - kind: horus_task
    id: predict
    name: 5. Predict with the best model
    description: >-
      Picks the model with the highest mean CV R2 and runs `openadmet
      predict` on every inference compound.
    inputs:
      - id: trained_in
        name: Trained models
        kind: folder
        path: trained/
      - id: compounds
        name: Compounds for inference
        kind: file
        path: data/compounds_for_inference.csv
      - id: accelerator
        name: Accelerator
        kind: string
        path: params/accelerator.txt
    outputs:
      - id: predictions
        name: Predictions
        kind: file
        path: results/predictions.csv
    executor: *conda
    runtime:
      kind: python_script
      script: scripts/models.py
      args: >-
        predict --trained ${trained_in} --compounds ${compounds}
        --accelerator ${accelerator} --out ${predictions}
    target: *local

  - kind: horus_task
    id: report
    name: 6. Report
    description: One row of CV metrics per model, plus the top predicted CYP3A4 inhibitors.
    inputs:
      - id: trained_in
        name: Trained models
        kind: folder
        path: trained/
      - id: predictions
        name: Predictions
        kind: file
        path: results/predictions.csv
    outputs:
      - id: metrics
        name: CV metrics per model
        kind: file
        path: results/metrics.csv
      - id: top_predictions
        name: Top predicted inhibitors
        kind: file
        path: results/top_predictions.csv
    executor: *conda
    runtime:
      kind: python_script
      script: scripts/models.py
      args: >-
        report --trained ${trained_in} --predictions ${predictions}
        --out ${metrics} --top-out ${top_predictions}
    target: *local

edges:
  - source: artifact-dataset_url
    source_output: dataset_url
    target: fetch_data
    target_input: dataset_url
  - source: artifact-inference_url
    source_output: inference_url
    target: fetch_data
    target_input: inference_url
  - source: fetch_data
    source_output: chembl_parquet
    target: make_recipes
    target_input: chembl_parquet
  - source: artifact-models
    source_output: models
    target: make_recipes
    target_input: models
  - source: artifact-cv_folds
    source_output: cv_folds
    target: make_recipes
    target_input: cv_folds
  - source: artifact-cv_repeats
    source_output: cv_repeats
    target: make_recipes
    target_input: cv_repeats
  - source: artifact-accelerator
    source_output: accelerator
    target: make_recipes
    target_input: accelerator
  - source: make_recipes
    source_output: recipes
    target: train
    target_input: recipes_in
  - source: train
    source_output: trained
    target: compare
    target_input: trained_in
  - source: train
    source_output: trained
    target: predict
    target_input: trained_in
  - source: fetch_data
    source_output: compounds
    target: predict
    target_input: compounds
  - source: artifact-accelerator
    source_output: accelerator
    target: predict
    target_input: accelerator
  - source: train
    source_output: trained
    target: report
    target_input: trained_in
  - source: predict
    source_output: predictions
    target: report
    target_input: predictions

orchestrator_target:
  kind: local
  working_directory: horus_workflow_results
