<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a1c"/><stop offset="1" stop-color="#0c2f33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="64" y="64" rx="18" width="190" height="36" fill="#134e4a"/>
  <text x="159" y="89" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="18" fill="#99f6e4">W-38 · OMSF</text>
  <text x="64" y="190" font-family="DejaVu Sans" font-weight="bold" font-size="56" fill="#f0fdfa">CYP3A4 Inhibition</text>
  <text x="64" y="256" font-family="DejaVu Sans" font-weight="bold" font-size="56" fill="#f0fdfa">Models</text>
  <text x="64" y="316" font-family="DejaVu Sans" font-size="26" fill="#5eead4">OpenADMET · train, compare, predict</text>
  <text x="64" y="380" font-family="DejaVu Sans" font-size="21" fill="#a7c4c2">Tree models and Chemprop cross-validated</text>
  <text x="64" y="410" font-family="DejaVu Sans" font-size="21" fill="#a7c4c2">in parallel on ChEMBL IC50 data; the best</text>
  <text x="64" y="440" font-family="DejaVu Sans" font-size="21" fill="#a7c4c2">one ranks your compounds by pIC50.</text>
  <text x="64" y="566" font-family="DejaVu Sans" font-size="18" fill="#5f8784">PANTHEON · TEMPLE COMPUTE</text>
  <!-- CV R2 box plots per model -->
  <g font-family="DejaVu Sans" font-size="17" fill="#a7c4c2" text-anchor="middle">
    <line x1="700" y1="470" x2="1140" y2="470" stroke="#3f6f6b" stroke-width="2"/>
    <line x1="700" y1="140" x2="700" y2="470" stroke="#3f6f6b" stroke-width="2"/>
    <text x="680" y="150" text-anchor="end" font-size="15">R²</text>
    <g stroke="#fbbf24" stroke-width="3" fill="#78350f">
      <line x1="760" y1="200" x2="760" y2="310"/><rect x="735" y="222" width="50" height="62" rx="6"/>
    </g>
    <g stroke="#99f6e4" stroke-width="3" fill="#134e4a">
      <line x1="845" y1="225" x2="845" y2="335"/><rect x="820" y="248" width="50" height="62" rx="6"/>
      <line x1="930" y1="215" x2="930" y2="330"/><rect x="905" y="240" width="50" height="62" rx="6"/>
      <line x1="1015" y1="235" x2="1015" y2="345"/><rect x="990" y="258" width="50" height="60" rx="6"/>
    </g>
    <g stroke="#5f8784" stroke-width="3" fill="none" stroke-dasharray="6 5">
      <line x1="1100" y1="250" x2="1100" y2="370"/><rect x="1075" y="275" width="50" height="66" rx="6"/>
    </g>
    <g stroke="#f0fdfa" stroke-width="3">
      <line x1="735" y1="252" x2="785" y2="252"/><line x1="820" y1="280" x2="870" y2="280"/>
      <line x1="905" y1="270" x2="955" y2="270"/><line x1="990" y1="288" x2="1040" y2="288"/>
    </g>
    <text x="760" y="500" fill="#fbbf24" font-weight="bold">LGBM</text><text x="845" y="500">RF</text><text x="930" y="500">XGB</text>
    <text x="1015" y="500">CatB</text><text x="1100" y="500" fill="#5f8784">Chemprop</text>
    <text x="760" y="185" fill="#fbbf24" font-size="20" font-weight="bold">best</text>
    <text x="1100" y="525" fill="#5f8784" font-size="13">optional</text>
  </g>
  <!-- small molecule -->
  <g transform="translate(930,150) scale(0.7)" fill="none" stroke="#f0fdfa" stroke-width="5" stroke-linejoin="round">
    <polygon points="0,-34 29,-17 29,17 0,34 -29,17 -29,-17"/>
    <polygon points="58,-34 87,-17 87,17 58,34 29,17 29,-17"/>
    <line x1="87" y1="17" x2="116" y2="34"/><circle cx="124" cy="39" r="8" fill="#fb7185" stroke="none"/>
  </g>
</svg>
