<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1003"/><stop offset="1" stop-color="#3d2306"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.18"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fde68a"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="64" y="64" rx="18" width="190" height="36" fill="#78350f"/>
  <text x="159" y="89" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="18" fill="#fde68a">W-42 · OMICS</text>
  <text x="64" y="190" font-family="DejaVu Sans" font-weight="bold" font-size="56" fill="#fffbeb">Engin</text>
  <text x="64" y="256" font-family="DejaVu Sans" font-weight="bold" font-size="56" fill="#fffbeb">Strain-to-Scale</text>
  <text x="64" y="316" font-family="DejaVu Sans" font-size="26" fill="#fbbf24">host · route · next runs, with 90% bands</text>
  <text x="64" y="380" font-family="DejaVu Sans" font-size="21" fill="#c9b79a">Upload one project.yaml; three Engin</text>
  <text x="64" y="410" font-family="DejaVu Sans" font-size="21" fill="#c9b79a">stages run in parallel and merge into</text>
  <text x="64" y="440" font-family="DejaVu Sans" font-size="21" fill="#c9b79a">one decision brief.</text>
  <text x="64" y="566" font-family="DejaVu Sans" font-size="18" fill="#8a7550">PANTHEON · TEMPLE COMPUTE</text>
  <!-- host: rod-shaped cell -->
  <g transform="translate(760,170)">
    <rect x="-70" y="-34" width="140" height="68" rx="34" fill="none" stroke="#fbbf24" stroke-width="6"/>
    <path d="M-40,0 C-20,-18 0,18 20,0 S50,-10 45,6" fill="none" stroke="#fde68a" stroke-width="4"/>
    <text y="70" text-anchor="middle" font-family="DejaVu Sans" font-size="20" fill="#fde68a">which host?</text>
  </g>
  <!-- route: pathway nodes -->
  <g transform="translate(1000,170)" font-family="DejaVu Sans" font-size="18" fill="#1c1003">
    <circle cx="-70" cy="0" r="20" fill="#fbbf24"/><circle cx="0" cy="0" r="20" fill="#fbbf24"/><circle cx="70" cy="0" r="20" fill="#f59e0b"/>
    <line x1="-48" y1="0" x2="-24" y2="0" stroke="#fde68a" stroke-width="4" marker-end="url(#ar)"/>
    <line x1="22" y1="0" x2="46" y2="0" stroke="#fde68a" stroke-width="4" marker-end="url(#ar)"/>
    <text y="70" text-anchor="middle" font-size="20" fill="#fde68a">which route?</text>
  </g>
  <!-- process: bioreactor -->
  <g transform="translate(880,420)">
    <path d="M-60,-80 L-60,60 Q-60,90 -30,90 L30,90 Q60,90 60,60 L60,-80" fill="#3d2306" stroke="#fbbf24" stroke-width="6"/>
    <rect x="-70" y="-92" width="140" height="16" rx="6" fill="#fbbf24"/>
    <path d="M-56,0 Q-28,-14 0,0 T56,0 L56,60 Q56,86 30,86 L-30,86 Q-56,86 -56,60 Z" fill="#f59e0b" opacity="0.6"/>
    <line x1="0" y1="-76" x2="0" y2="50" stroke="#fde68a" stroke-width="5"/>
    <rect x="-24" y="44" width="48" height="10" rx="4" fill="#fde68a"/>
    <circle cx="-28" cy="30" r="5" fill="#fffbeb"/><circle cx="24" cy="18" r="4" fill="#fffbeb"/><circle cx="34" cy="50" r="5" fill="#fffbeb"/>
    <text x="0" y="128" text-anchor="middle" font-family="DejaVu Sans" font-size="20" fill="#fde68a">what to run next?</text>
  </g>
  <line x1="770" y1="260" x2="840" y2="320" stroke="#fde68a" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#ar)"/>
  <line x1="990" y1="260" x2="920" y2="320" stroke="#fde68a" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#ar)"/>
</svg>
