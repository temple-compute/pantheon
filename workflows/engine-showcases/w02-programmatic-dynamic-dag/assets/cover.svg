  <text x="164.0" y="89" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="18" fill="#e2e8f0">W-07 · ENGINE</text>
  <text x="64" y="190" font-family="DejaVu Sans" font-weight="bold" font-size="56" fill="#f8fafc">Programmatic</text>
  <text x="64" y="256" font-family="DejaVu Sans" font-weight="bold" font-size="56" fill="#f8fafc">Dynamic DAG</text>
  <text x="64" y="316" font-family="DejaVu Sans" font-size="26" fill="#94a3b8">add_task / expand at runtime</text>
  <text x="64" y="380" font-family="DejaVu Sans" font-size="21" fill="#94a3b8">A task reads its data and grows the</text>
  <text x="64" y="410" font-family="DejaVu Sans" font-size="21" fill="#94a3b8">rest of the DAG while it runs: one</text>
  <text x="64" y="440" font-family="DejaVu Sans" font-size="21" fill="#94a3b8">task per group it finds, then a fan-in.</text>
  <text x="64" y="566" font-family="DejaVu Sans" font-size="18" fill="#94a3b8" opacity="0.7">PANTHEON · TEMPLE COMPUTE</text>
