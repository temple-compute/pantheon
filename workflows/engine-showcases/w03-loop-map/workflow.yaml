kind: horus_workflow
name: Bounded Loop Map Showcase

artifacts:
  - id: iterations
    name: Iterations
    description: Number of clones to run, indices 0..N-1; the result is the sum of their squares.
    kind: number
    path: params/iterations.txt
    value: 5
    min: 1
    max: 100
    step: 1

tasks:
  # A bounded loop is a horus_map over a JSON list: `indices` writes
  # [0, 1, ..., N-1] and the map runs one clone per element. Iterating a
  # `json` artifact gives each clone a one-element JSON file holding its index.
  - kind: horus_task
    id: indices
    name: List the iteration indices
    description: Writes the JSON list [0, 1, ..., N-1] for the range map.
    inputs:
      - id: iterations
        name: Iterations
        kind: number
        path: params/iterations.txt
    outputs:
      - id: indices
        name: Iteration indices
        kind: json
        path: indices.json
    executor:
      kind: shell
    runtime:
      kind: command
      command: >-
        python3 -c "import json, sys; print(json.dumps(list(range(int(sys.argv[1])))))"
        ${iterations} > $indices
    target:
      kind: local

  - kind: horus_map
    id: iterate
    name: Square each iteration index (bounded range map)
    description: Fans out one clone per iteration index (0..N-1) and squares that index.
    over:
      input_id: indices
      as: idx
    max_concurrency: 0 # all clones at once
    inputs:
      - id: indices
        name: Iteration indices
        kind: json
        path: indices.json
    outputs:
      - id: squares
        name: Squared values
        kind: folder
        path: squares/
    runtime:
      kind: command
      command: 'n=$$(cat $idx); mkdir -p $squares && echo $$((n * n)) > $squares/square.txt'
    executor:
      kind: shell
    target:
      kind: local

  - kind: horus_task
    id: gather
    name: Sum the squares
    description: Sums every clone's squared value into a single total.
    inputs:
      - id: results
        name: Squared values
        kind: folder
        path: squares/
    outputs:
      - id: total
        name: Sum of squares
        kind: file
        path: results/total.txt
    executor:
      kind: shell
    runtime:
      kind: python_script
      script: scripts/sum_squares.py
      python: python3 # stdlib-only; use the target's python3
      args: --results ${results} --out ${total}
    target:
      kind: local

edges:
  - {source: artifact-iterations, source_output: iterations, target: indices, target_input: iterations}
  - {source: indices, source_output: indices, target: iterate, target_input: indices}
  - {source: iterate, source_output: squares, target: gather, target_input: results}

orchestrator_target:
  kind: local
  working_directory: horus_workflow_results
