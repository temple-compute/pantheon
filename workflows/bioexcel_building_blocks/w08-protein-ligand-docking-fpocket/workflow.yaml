kind: horus_workflow
name: Protein-Ligand Docking into an fpocket Cavity

_executor: &executor
  kind: conda_python_environment
  environment_dir: "../../.horus_conda_env" # one env per run, shared by all tasks
  conda: micromamba
  environment_file: conda_env.yaml

_docker_executor: &docker_executor
  kind: docker
  image: quay.io/biocontainers/biobb_vs:5.2.1--pyhdfd78af_0

artifacts:
  - id: pdb_id
    name: PDB ID
    description: RCSB PDB code to download (default 3HEC). Clear it to use the uploaded structure instead.
    kind: string
    path: params/pdb_id.txt
    value: 3HEC
    pattern: ([0-9][A-Za-z0-9]{3})?
    max_length: 4
  - id: structure
    name: Receptor upload (PDB)
    description: 'Structure used when PDB ID is empty. Default: examples/3hec.pdb (3HEC).'
    kind: file
    path: examples/3hec.pdb
  - id: ligand_code
    name: Ligand code (PDB CCD)
    description: PDB Chemical Component code of the ligand to dock, downloaded as an idealized SDF (default STI, imatinib). Clear it to dock the uploaded ligand instead.
    kind: string
    path: params/ligand_code.txt
    value: STI
    pattern: ([A-Za-z0-9]{1,3})?
    max_length: 3
  - id: ligand_sdf
    name: Ligand upload (SDF)
    description: '3D ligand structure used when the ligand code is empty. Default: examples/sti_ideal.sdf (imatinib).'
    kind: file
    path: examples/sti_ideal.sdf
  - id: babel_convert_pdb_to_pdbqt_config
    name: Ligand PDB→PDBQT config
    description: OpenBabel settings for converting the ligand from PDB to PDBQT and adding partial charges.
    kind: file
    path: configs/babel_convert_pdb_to_pdbqt.yaml

  - id: babel_convert_pdbqt_to_pdb_config
    name: Pose PDBQT→PDB config
    description: OpenBabel settings for converting the top docking pose from PDBQT back to PDB format.
    kind: file
    path: configs/babel_convert_pdbqt_to_pdb.yaml

  - id: babel_convert_sdf_to_pdb_config
    name: Ligand SDF→PDB config
    description: OpenBabel settings for converting the ligand from SDF to PDB format.
    kind: file
    path: configs/babel_convert_sdf_to_pdb.yaml

  - id: extract_model_pdbqt_config
    name: Pose extraction config
    description: Specifies which Vina docking pose (model 1) to extract from the docking output.
    kind: file
    path: configs/extract_model_pdbqt.yaml

  - id: fpocket_run_config
    name: fpocket run config
    description: Parameters controlling fpocket's cavity-detection run on the receptor.
    kind: file
    path: configs/fpocket_run.yaml

  - id: str_check_add_hydrogens_config
    name: Receptor protonation config
    description: Settings for adding hydrogens and preparing the receptor for docking.
    kind: file
    path: configs/str_check_add_hydrogens.yaml

  - id: min_druggability
    name: Minimum druggability
    description: Cavities with a lower fpocket druggability score are dropped.
    kind: number
    value: 0
    min: 0
    max: 1
    step: 0.05
    path: params/min_druggability.txt
  - id: min_volume
    name: Minimum cavity volume (Å³)
    description: Smaller cavities are dropped.
    kind: number
    value: 800
    min: 0
    max: 5000
    step: 50
    path: params/min_volume.txt
  - id: max_volume
    name: Maximum cavity volume (Å³)
    description: Larger cavities are dropped; keep it above min_volume.
    kind: number
    value: 2000
    min: 100
    max: 20000
    step: 100
    path: params/max_volume.txt
  - id: pocket
    name: fpocket pocket
    description: 'Pocket (by fpocket rank, after the cavity filter) that defines the docking box; inspect the fpocket output to choose one for a new receptor (3HEC: 6).'
    kind: number
    path: params/pocket.txt
    value: 6
    min: 1
    max: 50
    step: 1
  - id: box_offset_a
    name: Box padding (Å)
    description: Extra space added around the selected pocket on each side of the docking box.
    kind: number
    path: params/box_offset_a.txt
    value: 12
    min: 2
    max: 30
    step: 1
tasks:
  - kind: horus_task
    id: fetch_pdb
    name: Fetch (PDB ID) or load the uploaded receptor
    description: Downloads the PDB entry given in pdb_id, or copies the uploaded receptor when pdb_id is empty.
    inputs:
      - id: pdb_id
        name: PDB ID
        kind: string
        path: params/pdb_id.txt
      - id: structure
        name: Receptor upload (PDB)
        kind: file
        path: examples/3hec.pdb
    outputs:
      - id: download_pdb
        name: Downloaded receptor structure
        kind: file
        path: results/download.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        if [ -n ${pdb_id} ]; then pdb --config '{"properties":{"pdb_code":"${pdb_id}","filter":["ATOM","HETATM"]}}' --output_pdb_path ${download_pdb}; else cp ${structure} ${download_pdb}; fi
    target:
      kind: local

  - kind: horus_task
    id: extract_protein
    name: Extract protein structure (remove ligands, ions, water)
    description: Runs biobb extract_molecule to strip ligands, ions, and water, leaving only the protein structure.
    inputs:
      - id: download_pdb
        name: Downloaded receptor structure
        kind: file
        path: results/download.pdb
    outputs:
      - id: pdb_protein
        name: Protein-only structure
        kind: file
        path: results/pdb_protein.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        extract_molecule
        --input_structure_path ${download_pdb}
        --output_molecule_path ${pdb_protein}
    target:
      kind: local

  - kind: horus_task
    id: fpocket_run
    name: Compute protein cavities with fpocket
    description: Runs fpocket to detect candidate binding cavities on the receptor surface.
    inputs:
      - id: fpocket_run_config
        name: fpocket run config
        kind: file
        path: configs/fpocket_run.yaml
      - id: pdb_protein
        name: Protein-only structure
        kind: file
        path: results/pdb_protein.pdb
    outputs:
      - id: fpocket_all_pockets
        name: All detected pockets
        kind: file
        path: results/fpocket_all_pockets.zip
      - id: fpocket_summary
        name: Pocket summary
        kind: file
        path: results/fpocket_summary.json
    executor: *docker_executor
    runtime:
      kind: command
      command: >-
        fpocket_run
        --config ${fpocket_run_config}
        --input_pdb_path ${pdb_protein}
        --output_pockets_zip ${fpocket_all_pockets}
        --output_summary ${fpocket_summary}
    target:
      kind: local

  # biobb lower bounds are exclusive and must be >= 0, so the druggability window is only applied when
  # min_druggability > 0; at 0 cavities scoring 0.000 are kept, as with a volume-only filter.
  - kind: horus_task
    id: fpocket_filter
    name: Filter protein cavities by druggability and volume
    description: Keeps only the cavities whose fpocket druggability and volume fall inside the configured windows.
    inputs:
      - id: min_druggability
        name: Minimum druggability
        kind: number
        path: params/min_druggability.txt
      - id: min_volume
        name: Minimum cavity volume
        kind: number
        path: params/min_volume.txt
      - id: max_volume
        name: Maximum cavity volume
        kind: number
        path: params/max_volume.txt
      - id: fpocket_all_pockets
        name: All detected pockets
        kind: file
        path: results/fpocket_all_pockets.zip
      - id: fpocket_summary
        name: Pocket summary
        kind: file
        path: results/fpocket_summary.json
    outputs:
      - id: fpocket_filter_pockets
        name: Filtered pockets
        kind: file
        path: results/fpocket_filter_pockets.zip
    executor: *docker_executor
    runtime:
      kind: command
      command: >-
        d=; [ "$(awk 'BEGIN{print (${min_druggability}>0)}')" = 1 ] && d="\"druggability_score\":[${min_druggability},1],";
        fpocket_filter
        --config "{\"properties\":{$d\"volume\":[${min_volume},${max_volume}]}}"
        --input_pockets_zip ${fpocket_all_pockets}
        --input_summary ${fpocket_summary}
        --output_filter_pockets_zip ${fpocket_filter_pockets}
    target:
      kind: local

  - kind: horus_task
    id: fpocket_select
    name: Extract selected pocket cavity
    description: Extracts the selected cavity as PDB and PQR files for docking box generation.
    inputs:
      - id: fpocket_filter_pockets
        name: Filtered pockets
        kind: file
        path: results/fpocket_filter_pockets.zip
      - id: pocket
        name: fpocket pocket
        kind: number
        path: params/pocket.txt
    outputs:
      - id: fpocket_cavity
        name: Selected pocket cavity
        kind: file
        path: results/fpocket_cavity.pdb
      - id: fpocket_pocket
        name: Selected pocket (PQR)
        kind: file
        path: results/fpocket_pocket.pqr
    executor: *docker_executor
    runtime:
      kind: command
      command: >-
        fpocket_select --config '{"properties":{"pocket":${pocket}}}' --input_pockets_zip ${fpocket_filter_pockets} --output_pocket_pdb ${fpocket_cavity} --output_pocket_pqr ${fpocket_pocket}
    target:
      kind: local

  - kind: horus_task
    id: box
    name: Generate docking box around selected cavity
    description: Generates a docking box around the selected cavity with the configured padding.
    inputs:
      - id: fpocket_pocket
        name: Selected pocket (PQR)
        kind: file
        path: results/fpocket_pocket.pqr
      - id: box_offset_a
        name: Box padding (Å)
        kind: number
        path: params/box_offset_a.txt
    outputs:
      - id: output_box
        name: Docking box
        kind: file
        path: results/box.pdb
    executor: *docker_executor
    runtime:
      kind: command
      command: >-
        box --config '{"properties":{"offset":${box_offset_a},"box_coordinates":true}}' --input_pdb_path ${fpocket_pocket} --output_pdb_path ${output_box}
    target:
      kind: local

  - kind: horus_task
    id: ideal_sdf
    name: Fetch (ligand code) or load the uploaded ligand
    description: Downloads the idealized SDF of ligand_code from the PDB Chemical Component Dictionary, or copies the uploaded SDF when the code is empty.
    inputs:
      - id: ligand_code
        name: Ligand code (PDB CCD)
        kind: string
        path: params/ligand_code.txt
      - id: ligand_sdf
        name: Ligand upload (SDF)
        kind: file
        path: examples/sti_ideal.sdf
    outputs:
      - id: sdf_ideal
        name: Ligand SDF
        kind: file
        path: results/ideal.sdf
    executor: *executor
    runtime:
      kind: command
      command: >-
        if [ -n ${ligand_code} ]; then ideal_sdf --config '{"properties":{"ligand_code":"${ligand_code}"}}' --output_sdf_path ${sdf_ideal}; else cp ${ligand_sdf} ${sdf_ideal}; fi
    target:
      kind: local

  - kind: horus_task
    id: babel_convert_sdf_to_pdb
    name: Convert small molecule from SDF to PDB format
    description: Uses OpenBabel to convert the ligand from SDF to PDB format.
    inputs:
      - id: babel_convert_sdf_to_pdb_config
        name: Ligand SDF→PDB config
        kind: file
        path: configs/babel_convert_sdf_to_pdb.yaml
      - id: sdf_ideal
        name: Ligand SDF
        kind: file
        path: results/ideal.sdf
    outputs:
      - id: ligand_pdb
        name: Ligand PDB
        kind: file
        path: results/ligand.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        babel_convert
        --config ${babel_convert_sdf_to_pdb_config}
        --input_path ${sdf_ideal}
        --output_path ${ligand_pdb}
    target:
      kind: local

  - kind: horus_task
    id: babel_convert_pdb_to_pdbqt
    name: Prepare ligand for docking (PDB to PDBQT, add partial charges)
    description: Uses OpenBabel to convert the ligand from PDB to PDBQT format and add partial charges for docking.
    inputs:
      - id: babel_convert_pdb_to_pdbqt_config
        name: Ligand PDB→PDBQT config
        kind: file
        path: configs/babel_convert_pdb_to_pdbqt.yaml
      - id: ligand_pdb
        name: Ligand PDB
        kind: file
        path: results/ligand.pdb
    outputs:
      - id: prep_ligand
        name: Docking-ready ligand
        kind: file
        path: results/prep_ligand.pdbqt
    executor: *executor
    runtime:
      kind: command
      command: >-
        babel_convert
        --config ${babel_convert_pdb_to_pdbqt_config}
        --input_path ${ligand_pdb}
        --output_path ${prep_ligand}
    target:
      kind: local

  - kind: horus_task
    id: str_check_add_hydrogens
    name: Prepare receptor protein for docking (PDB to PDBQT, add charges)
    description: Adds hydrogens and converts the receptor to a docking-ready PDBQT structure.
    inputs:
      - id: str_check_add_hydrogens_config
        name: Receptor protonation config
        kind: file
        path: configs/str_check_add_hydrogens.yaml
      - id: pdb_protein
        name: Protein-only structure
        kind: file
        path: results/pdb_protein.pdb
    outputs:
      - id: prep_receptor
        name: Docking-ready receptor
        kind: file
        path: results/prep_receptor.pdbqt
    executor: *executor
    runtime:
      kind: command
      command: >-
        str_check_add_hydrogens
        --config ${str_check_add_hydrogens_config}
        --input_structure_path ${pdb_protein}
        --output_structure_path ${prep_receptor}
    target:
      kind: local

  - kind: horus_task
    id: autodock_vina_run
    name: Run AutoDock Vina docking
    description: Runs AutoDock Vina to dock the prepared ligand into the receptor within the generated docking box.
    inputs:
      - id: prep_ligand
        name: Docking-ready ligand
        kind: file
        path: results/prep_ligand.pdbqt
      - id: prep_receptor
        name: Docking-ready receptor
        kind: file
        path: results/prep_receptor.pdbqt
      - id: output_box
        name: Docking box
        kind: file
        path: results/box.pdb
    outputs:
      - id: output_vina_pdbqt
        name: Vina docking output
        kind: file
        path: results/output_vina.pdbqt
    resources:
      cpus: 8
      memory_gb: 16
      walltime: "02:00:00"
    executor: *docker_executor
    runtime:
      kind: command
      command: >-
        autodock_vina_run
        --input_ligand_pdbqt_path ${prep_ligand}
        --input_receptor_pdbqt_path ${prep_receptor}
        --input_box_path ${output_box}
        --output_pdbqt_path ${output_vina_pdbqt}
        --output_log_path output_vina.log
    target:
      kind: local

  - kind: horus_task
    id: extract_model_pdbqt
    name: Extract docking pose (model 1) from Vina output
    description: Extracts the top-ranked docking pose (model 1) from the Vina output.
    inputs:
      - id: extract_model_pdbqt_config
        name: Pose extraction config
        kind: file
        path: configs/extract_model_pdbqt.yaml
      - id: output_vina_pdbqt
        name: Vina docking output
        kind: file
        path: results/output_vina.pdbqt
    outputs:
      - id: output_pdbqt_model
        name: Top docking pose (PDBQT)
        kind: file
        path: results/output_model.pdbqt
    executor: *docker_executor
    runtime:
      kind: command
      command: >-
        extract_model_pdbqt
        --config ${extract_model_pdbqt_config}
        --input_pdbqt_path ${output_vina_pdbqt}
        --output_pdbqt_path ${output_pdbqt_model}
    target:
      kind: local

  - kind: horus_task
    id: babel_convert_pdbqt_to_pdb
    name: Convert docking pose from PDBQT to PDB format
    description: Uses OpenBabel to convert the top docking pose from PDBQT to PDB format.
    inputs:
      - id: babel_convert_pdbqt_to_pdb_config
        name: Pose PDBQT→PDB config
        kind: file
        path: configs/babel_convert_pdbqt_to_pdb.yaml
      - id: output_pdbqt_model
        name: Top docking pose (PDBQT)
        kind: file
        path: results/output_model.pdbqt
    outputs:
      - id: output_pdb_model
        name: Top docking pose (PDB)
        kind: file
        path: results/output_model.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        babel_convert
        --config ${babel_convert_pdbqt_to_pdb_config}
        --input_path ${output_pdbqt_model}
        --output_path ${output_pdb_model}
    target:
      kind: local

  - kind: horus_task
    id: cat_pdb
    name: Superpose ligand docking pose onto target protein structure
    description: Concatenates the receptor and ligand pose PDB files into the final protein-ligand complex structure.
    inputs:
      - id: pdb_protein
        name: Protein-only structure
        kind: file
        path: results/pdb_protein.pdb
      - id: output_pdb_model
        name: Top docking pose (PDB)
        kind: file
        path: results/output_model.pdb
    outputs:
      - id: output_structure
        name: Final complex structure
        kind: file
        path: results/output_structure.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        cat_pdb
        --input_structure1 ${pdb_protein}
        --input_structure2 ${output_pdb_model}
        --output_structure_path ${output_structure}
    target:
      kind: local

edges:
  - source: fetch_pdb
    source_output: download_pdb
    target: extract_protein
    target_input: download_pdb

  - source: extract_protein
    source_output: pdb_protein
    target: fpocket_run
    target_input: pdb_protein

  - source: extract_protein
    source_output: pdb_protein
    target: str_check_add_hydrogens
    target_input: pdb_protein

  - source: extract_protein
    source_output: pdb_protein
    target: cat_pdb
    target_input: pdb_protein

  - source: fpocket_run
    source_output: fpocket_all_pockets
    target: fpocket_filter
    target_input: fpocket_all_pockets

  - source: fpocket_run
    source_output: fpocket_summary
    target: fpocket_filter
    target_input: fpocket_summary

  - source: fpocket_filter
    source_output: fpocket_filter_pockets
    target: fpocket_select
    target_input: fpocket_filter_pockets

  - source: fpocket_select
    source_output: fpocket_pocket
    target: box
    target_input: fpocket_pocket

  - source: box
    source_output: output_box
    target: autodock_vina_run
    target_input: output_box

  - source: ideal_sdf
    source_output: sdf_ideal
    target: babel_convert_sdf_to_pdb
    target_input: sdf_ideal

  - source: babel_convert_sdf_to_pdb
    source_output: ligand_pdb
    target: babel_convert_pdb_to_pdbqt
    target_input: ligand_pdb

  - source: babel_convert_pdb_to_pdbqt
    source_output: prep_ligand
    target: autodock_vina_run
    target_input: prep_ligand

  - source: str_check_add_hydrogens
    source_output: prep_receptor
    target: autodock_vina_run
    target_input: prep_receptor

  - source: autodock_vina_run
    source_output: output_vina_pdbqt
    target: extract_model_pdbqt
    target_input: output_vina_pdbqt

  - source: extract_model_pdbqt
    source_output: output_pdbqt_model
    target: babel_convert_pdbqt_to_pdb
    target_input: output_pdbqt_model

  - source: babel_convert_pdbqt_to_pdb
    source_output: output_pdb_model
    target: cat_pdb
    target_input: output_pdb_model

  - source: artifact-babel_convert_pdb_to_pdbqt_config
    source_output: babel_convert_pdb_to_pdbqt_config
    target: babel_convert_pdb_to_pdbqt
    target_input: babel_convert_pdb_to_pdbqt_config

  - source: artifact-babel_convert_pdbqt_to_pdb_config
    source_output: babel_convert_pdbqt_to_pdb_config
    target: babel_convert_pdbqt_to_pdb
    target_input: babel_convert_pdbqt_to_pdb_config

  - source: artifact-babel_convert_sdf_to_pdb_config
    source_output: babel_convert_sdf_to_pdb_config
    target: babel_convert_sdf_to_pdb
    target_input: babel_convert_sdf_to_pdb_config

  - source: artifact-extract_model_pdbqt_config
    source_output: extract_model_pdbqt_config
    target: extract_model_pdbqt
    target_input: extract_model_pdbqt_config

  - source: artifact-fpocket_run_config
    source_output: fpocket_run_config
    target: fpocket_run
    target_input: fpocket_run_config

  - source: artifact-str_check_add_hydrogens_config
    source_output: str_check_add_hydrogens_config
    target: str_check_add_hydrogens
    target_input: str_check_add_hydrogens_config


  - source: artifact-pdb_id
    source_output: pdb_id
    target: fetch_pdb
    target_input: pdb_id
  - source: artifact-structure
    source_output: structure
    target: fetch_pdb
    target_input: structure
  - source: artifact-ligand_code
    source_output: ligand_code
    target: ideal_sdf
    target_input: ligand_code
  - source: artifact-ligand_sdf
    source_output: ligand_sdf
    target: ideal_sdf
    target_input: ligand_sdf
  - source: artifact-min_druggability
    source_output: min_druggability
    target: fpocket_filter
    target_input: min_druggability
  - source: artifact-min_volume
    source_output: min_volume
    target: fpocket_filter
    target_input: min_volume
  - source: artifact-max_volume
    source_output: max_volume
    target: fpocket_filter
    target_input: max_volume
  - source: artifact-pocket
    source_output: pocket
    target: fpocket_select
    target_input: pocket
  - source: artifact-box_offset_a
    source_output: box_offset_a
    target: box
    target_input: box_offset_a
orchestrator_target:
  kind: local
  working_directory: "./workflow_results"
