kind: horus_workflow
name: PMX Mutation Free Energy Calculations - Staphylococcal nuclease I10A

_executor: &executor
  kind: conda_python_environment
  environment_dir: "../.horus_conda_env"
  conda: micromamba
  environment_file: conda_env.yaml

_docker_executor_pmx: &docker_executor_pmx
  kind: docker
  image: quay.io/biocontainers/biobb_pmx:5.2.2--pyhdfd78af_0

artifacts:
  - id: gmx_energy_eq_stateA_config
    name: stateA energy extraction config
    description: Settings for extracting pressure and density from the stateA NPT equilibration energy file.
    kind: file
    path: configs/gmx_energy_eq_stateA.yaml

  - id: gmx_energy_eq_stateB_config
    name: stateB energy extraction config
    description: Settings for extracting pressure and density from the stateB NPT equilibration energy file.
    kind: file
    path: configs/gmx_energy_eq_stateB.yaml

  - id: gmx_energy_min_stateB_config
    name: stateB minimization energy config
    description: Settings for extracting potential energy from the stateB dummy-atom minimization run.
    kind: file
    path: configs/gmx_energy_min_stateB.yaml

  - id: gmx_trjconv_str_ens_stateA_config
    name: stateA snapshot extraction config
    description: Settings for extracting structural snapshots from the stateA equilibrium trajectory.
    kind: file
    path: configs/gmx_trjconv_str_ens_stateA.yaml

  - id: gmx_trjconv_str_ens_stateB_config
    name: stateB snapshot extraction config
    description: Settings for extracting structural snapshots from the stateB equilibrium trajectory.
    kind: file
    path: configs/gmx_trjconv_str_ens_stateB.yaml

  - id: grompp_eq_stateA_config
    name: stateA equilibration mdp config
    description: GROMACS mdp parameters for the stateA NPT equilibration run.
    kind: file
    path: configs/grompp_eq_stateA.yaml

  - id: grompp_eq_stateB_config
    name: stateB equilibration mdp config
    description: GROMACS mdp parameters for the stateB NPT equilibration run.
    kind: file
    path: configs/grompp_eq_stateB.yaml

  - id: grompp_min_stateB_config
    name: stateB minimization mdp config
    description: GROMACS mdp parameters for minimizing the stateB dummy atoms.
    kind: file
    path: configs/grompp_min_stateB.yaml

  - id: grompp_ti_stateA_config
    name: stateA TI mdp config
    description: GROMACS mdp parameters for the stateA fast thermodynamic integration run (WT to Mut).
    kind: file
    path: configs/grompp_ti_stateA.yaml

  - id: grompp_ti_stateB_config
    name: stateB TI mdp config
    description: GROMACS mdp parameters for the stateB fast thermodynamic integration run (Mut to WT).
    kind: file
    path: configs/grompp_ti_stateB.yaml

  - id: make_ndx_stateB_config
    name: stateB index group config
    description: Settings for defining the FREEZE index group covering the stateB dummy atoms.
    kind: file
    path: configs/make_ndx_stateB.yaml

  - id: pdb2gmx_stateA_config
    name: stateA topology config
    description: Protein topology settings for building the stateA GROMACS topology.
    kind: file
    path: configs/pdb2gmx_stateA.yaml

  - id: pdb2gmx_stateB_config
    name: stateB topology config
    description: Protein topology settings for building the stateB GROMACS topology.
    kind: file
    path: configs/pdb2gmx_stateB.yaml

  - id: pmxanalyse_config
    name: Free energy analysis config
    description: Free-energy estimator selection (CGI, BAR, Jarzynski) and analysis options.
    kind: file
    path: configs/pmxanalyse.yaml

  - id: pmxgentop_stateA_config
    name: stateA hybrid topology config
    description: Settings for generating the stateA hybrid dual-topology parameters.
    kind: file
    path: configs/pmxgentop_stateA.yaml

  - id: pmxgentop_stateB_config
    name: stateB hybrid topology config
    description: Settings for generating the stateB hybrid dual-topology parameters.
    kind: file
    path: configs/pmxgentop_stateB.yaml

  - id: pmxmutate_stateA_config
    name: stateA mutation config
    description: Mutation list (Ile10 to Ala) and force field settings for modeling the stateA mutant structure.
    kind: file
    path: configs/pmxmutate_stateA.yaml

  - id: pmxmutate_stateB_config
    name: stateB mutation config
    description: Mutation list (Ala10 to Ile) and force field settings for modeling the stateB mutant structure.
    kind: file
    path: configs/pmxmutate_stateB.yaml

  - id: dhdlA_zip
    name: stateA replicate dHdl bundle
    description: Bundle of pre-computed replicate dHdl work curves for the WT to Mut transition, used by the CGI, BAR, and Jarzynski estimators.
    kind: file
    path: pmx_tutorial/dhdlA.zip

  - id: dhdlB_zip
    name: stateB replicate dHdl bundle
    description: Bundle of pre-computed replicate dHdl work curves for the Mut to WT transition, used by the CGI, BAR, and Jarzynski estimators.
    kind: file
    path: pmx_tutorial/dhdlB.zip

  - id: stateA_tpr
    name: stateA run input file
    description: GROMACS run input (tpr) file for the wild-type (stateA) equilibrium trajectory.
    kind: file
    path: pmx_tutorial/stateA.tpr

  - id: stateA_traj
    name: stateA equilibrium trajectory
    description: Pre-equilibrated wild-type (stateA) trajectory (xtc).
    kind: file
    path: pmx_tutorial/stateA_1ns.xtc

  - id: stateB_tpr
    name: stateB run input file
    description: GROMACS run input (tpr) file for the mutant (stateB) equilibrium trajectory.
    kind: file
    path: pmx_tutorial/stateB.tpr

  - id: stateB_traj
    name: stateB equilibrium trajectory
    description: Pre-equilibrated mutant (stateB) trajectory (xtc).
    kind: file
    path: pmx_tutorial/stateB_1ns.xtc

tasks:
  # ── Extract snapshots from equilibrium trajectories ──────────────────────

  - kind: horus_task
    id: gmx_trjconv_str_ens_stateA
    name: Extract snapshots from stateA (WT) equilibrium trajectory
    description: Runs GROMACS gmx_trjconv to extract structural snapshots from the stateA (WT) equilibrium trajectory.
    inputs:
      - id: gmx_trjconv_str_ens_stateA_config
        name: stateA snapshot extraction config
        kind: file
        path: configs/gmx_trjconv_str_ens_stateA.yaml
      - id: stateA_traj
        name: stateA equilibrium trajectory
        kind: file
        path: pmx_tutorial/stateA_1ns.xtc
      - id: stateA_tpr
        name: stateA run input file
        kind: file
        path: pmx_tutorial/stateA.tpr
    outputs:
      - id: stateA_frames
        name: stateA snapshots
        description: Ensemble of structural snapshots extracted from the stateA equilibrium trajectory.
        kind: file
        path: results/stateA_frames.zip
    executor: *executor
    runtime:
      kind: command
      command: >-
        gmx_trjconv_str_ens
        --config ${gmx_trjconv_str_ens_stateA_config}
        --input_traj_path ${stateA_traj}
        --input_top_path ${stateA_tpr}
        --output_str_ens_path ${stateA_frames}
    target:
      kind: local

  - kind: horus_task
    id: gmx_trjconv_str_ens_stateB
    name: Extract snapshots from stateB (Mutant) equilibrium trajectory
    description: Runs GROMACS gmx_trjconv to extract structural snapshots from the stateB (Mutant) equilibrium trajectory.
    inputs:
      - id: gmx_trjconv_str_ens_stateB_config
        name: stateB snapshot extraction config
        kind: file
        path: configs/gmx_trjconv_str_ens_stateB.yaml
      - id: stateB_traj
        name: stateB equilibrium trajectory
        kind: file
        path: pmx_tutorial/stateB_1ns.xtc
      - id: stateB_tpr
        name: stateB run input file
        kind: file
        path: pmx_tutorial/stateB.tpr
    outputs:
      - id: stateB_frames
        name: stateB snapshots
        description: Ensemble of structural snapshots extracted from the stateB equilibrium trajectory.
        kind: file
        path: results/stateB_frames.zip
    executor: *executor
    runtime:
      kind: command
      command: >-
        gmx_trjconv_str_ens
        --config ${gmx_trjconv_str_ens_stateB_config}
        --input_traj_path ${stateB_traj}
        --input_top_path ${stateB_tpr}
        --output_str_ens_path ${stateB_frames}
    target:
      kind: local

  # ── Model mutated structures ──────────────────────────────────────────────

  - kind: horus_task
    id: pmxmutate_stateA
    name: Model stateA mutated structure (Ile10 -> Ala, WT->Mut)
    description: Runs pmx mutate to build the in-silico Ile10->Ala mutant structure for stateA (WT->Mut).
    inputs:
      - id: pmxmutate_stateA_config
        name: stateA mutation config
        kind: file
        path: configs/pmxmutate_stateA.yaml
      - id: stateA_frames
        name: stateA snapshots
        kind: file
        path: results/stateA_frames.zip
    outputs:
      - id: mutA_pdb
        name: stateA mutant structure
        kind: file
        path: results/mutA.pdb
    executor: *docker_executor_pmx
    runtime:
      kind: command
      command: >-
        pmxmutate
        --config ${pmxmutate_stateA_config}
        --input_structure_path ${stateA_frames}
        --output_structure_path ${mutA_pdb}
    target:
      kind: local

  - kind: horus_task
    id: pmxmutate_stateB
    name: Model stateB mutated structure (Ala10 -> Ile, Mut->WT)
    description: Runs pmx mutate to build the in-silico Ala10->Ile mutant structure for stateB (Mut->WT).
    inputs:
      - id: pmxmutate_stateB_config
        name: stateB mutation config
        kind: file
        path: configs/pmxmutate_stateB.yaml
      - id: stateB_frames
        name: stateB snapshots
        kind: file
        path: results/stateB_frames.zip
    outputs:
      - id: mutB_pdb
        name: stateB mutant structure
        kind: file
        path: results/mutB.pdb
    executor: *docker_executor_pmx
    runtime:
      kind: command
      command: >-
        pmxmutate
        --config ${pmxmutate_stateB_config}
        --input_structure_path ${stateB_frames}
        --output_structure_path ${mutB_pdb}
    target:
      kind: local

  # ── Build GROMACS topologies ──────────────────────────────────────────────

  - kind: horus_task
    id: pdb2gmx_stateA
    name: Build GROMACS topology for stateA (pdb2gmx)
    description: Runs GROMACS pdb2gmx to build the initial topology and structure for the stateA mutant.
    inputs:
      - id: pdb2gmx_stateA_config
        name: stateA topology config
        kind: file
        path: configs/pdb2gmx_stateA.yaml
      - id: mutA_pdb
        name: stateA mutant structure
        kind: file
        path: results/mutA.pdb
    outputs:
      - id: pdb2gmxA_gro
        name: stateA topology structure
        kind: file
        path: results/pdb2gmxA.gro
      - id: pdb2gmxA_top_zip
        name: stateA GROMACS topology
        kind: file
        path: results/pdb2gmxA_top.zip
    executor: *executor
    runtime:
      kind: command
      command: >-
        pdb2gmx
        --config ${pdb2gmx_stateA_config}
        --input_pdb_path ${mutA_pdb}
        --output_gro_path ${pdb2gmxA_gro}
        --output_top_zip_path ${pdb2gmxA_top_zip}
    target:
      kind: local

  - kind: horus_task
    id: pdb2gmx_stateB
    name: Build GROMACS topology for stateB (pdb2gmx)
    description: Runs GROMACS pdb2gmx to build the initial topology and structure for the stateB mutant.
    inputs:
      - id: pdb2gmx_stateB_config
        name: stateB topology config
        kind: file
        path: configs/pdb2gmx_stateB.yaml
      - id: mutB_pdb
        name: stateB mutant structure
        kind: file
        path: results/mutB.pdb
    outputs:
      - id: pdb2gmxB_gro
        name: stateB topology structure
        kind: file
        path: results/pdb2gmxB.gro
      - id: pdb2gmxB_top_zip
        name: stateB GROMACS topology
        kind: file
        path: results/pdb2gmxB_top.zip
    executor: *executor
    runtime:
      kind: command
      command: >-
        pdb2gmx
        --config ${pdb2gmx_stateB_config}
        --input_pdb_path ${mutB_pdb}
        --output_gro_path ${pdb2gmxB_gro}
        --output_top_zip_path ${pdb2gmxB_top_zip}
    target:
      kind: local

  # ── Generate hybrid topologies ────────────────────────────────────────────

  - kind: horus_task
    id: pmxgentop_stateA
    name: Generate hybrid topology for stateA (pmxgentop)
    description: Runs pmx gentop to convert the stateA topology into a hybrid dual-topology for alchemical simulation.
    inputs:
      - id: pmxgentop_stateA_config
        name: stateA hybrid topology config
        kind: file
        path: configs/pmxgentop_stateA.yaml
      - id: pdb2gmxA_top_zip
        name: stateA GROMACS topology
        kind: file
        path: results/pdb2gmxA_top.zip
    outputs:
      - id: pmxA_top_zip
        name: stateA hybrid topology
        description: Hybrid dual-topology files for stateA, combining the wild-type and mutant states for alchemical simulation.
        kind: file
        path: results/pmxA_top.zip
      - id: pmxA_top_log
        name: stateA hybrid topology log
        kind: file
        path: results/pmxA_top.log
    executor: *docker_executor_pmx
    runtime:
      kind: command
      command: >-
        pmxgentop
        --config ${pmxgentop_stateA_config}
        --input_top_zip_path ${pdb2gmxA_top_zip}
        --output_top_zip_path ${pmxA_top_zip}
        --output_log_path ${pmxA_top_log}
    target:
      kind: local

  - kind: horus_task
    id: pmxgentop_stateB
    name: Generate hybrid topology for stateB (pmxgentop)
    description: Runs pmx gentop to convert the stateB topology into a hybrid dual-topology for alchemical simulation.
    inputs:
      - id: pmxgentop_stateB_config
        name: stateB hybrid topology config
        kind: file
        path: configs/pmxgentop_stateB.yaml
      - id: pdb2gmxB_top_zip
        name: stateB GROMACS topology
        kind: file
        path: results/pdb2gmxB_top.zip
    outputs:
      - id: pmxB_top_zip
        name: stateB hybrid topology
        description: Hybrid dual-topology files for stateB, combining the wild-type and mutant states for alchemical simulation.
        kind: file
        path: results/pmxB_top.zip
      - id: pmxB_top_log
        name: stateB hybrid topology log
        kind: file
        path: results/pmxB_top.log
    executor: *docker_executor_pmx
    runtime:
      kind: command
      command: >-
        pmxgentop
        --config ${pmxgentop_stateB_config}
        --input_top_zip_path ${pdb2gmxB_top_zip}
        --output_top_zip_path ${pmxB_top_zip}
        --output_log_path ${pmxB_top_log}
    target:
      kind: local

  # ── Index file for stateB dummy atoms ────────────────────────────────────

  - kind: horus_task
    id: make_ndx_stateB
    name: Create FREEZE index for stateB dummy atoms (make_ndx)
    description: Runs GROMACS make_ndx to define a FREEZE index group covering the stateB dummy atoms introduced by the mutation.
    inputs:
      - id: make_ndx_stateB_config
        name: stateB index group config
        kind: file
        path: configs/make_ndx_stateB.yaml
      - id: pdb2gmxB_gro
        name: stateB topology structure
        kind: file
        path: results/pdb2gmxB.gro
    outputs:
      - id: indexB_ndx
        name: stateB FREEZE index
        description: Index group marking the stateB dummy atoms to freeze during energy minimization.
        kind: file
        path: results/indexB.ndx
    executor: *executor
    runtime:
      kind: command
      command: >-
        make_ndx
        --config ${make_ndx_stateB_config}
        --input_structure_path ${pdb2gmxB_gro}
        --output_ndx_path ${indexB_ndx}
    target:
      kind: local

  # ── Energy minimization of stateB dummy atoms ────────────────────────────

  - kind: horus_task
    id: grompp_min_stateB
    name: Compile stateB dummy-atom minimization run file (grompp)
    description: Runs GROMACS grompp to assemble the run input file for minimizing the stateB dummy atoms.
    inputs:
      - id: grompp_min_stateB_config
        name: stateB minimization mdp config
        kind: file
        path: configs/grompp_min_stateB.yaml
      - id: pdb2gmxB_gro
        name: stateB topology structure
        kind: file
        path: results/pdb2gmxB.gro
      - id: pmxB_top_zip
        name: stateB hybrid topology
        kind: file
        path: results/pmxB_top.zip
      - id: indexB_ndx
        name: stateB FREEZE index
        kind: file
        path: results/indexB.ndx
    outputs:
      - id: min_stateB_tpr
        name: stateB minimization run input
        kind: file
        path: results/em_stateB.tpr
    executor: *executor
    runtime:
      kind: command
      command: >-
        grompp
        --config ${grompp_min_stateB_config}
        --input_gro_path ${pdb2gmxB_gro}
        --input_top_zip_path ${pmxB_top_zip}
        --input_ndx_path ${indexB_ndx}
        --output_tpr_path ${min_stateB_tpr}
    target:
      kind: local

  - kind: horus_task
    id: mdrun_min_stateB
    name: Energy minimization of stateB dummy atoms (mdrun)
    description: Runs GROMACS mdrun to energy-minimize the stateB dummy atoms introduced by the mutation.
    inputs:
      - id: min_stateB_tpr
        name: stateB minimization run input
        kind: file
        path: results/em_stateB.tpr
    outputs:
      - id: min_stateB_gro
        name: stateB minimized structure
        kind: file
        path: results/emout_stateB.gro
      - id: min_stateB_edr
        name: stateB minimization energy file
        kind: file
        path: results/emout_stateB.edr
    executor: *executor
    runtime:
      kind: command
      command: >-
        mdrun
        --input_tpr_path ${min_stateB_tpr}
        --output_gro_path ${min_stateB_gro}
        --output_trr_path emout_stateB.trr
        --output_edr_path ${min_stateB_edr}
        --output_log_path emout_stateB.log
    target:
      kind: local

  - kind: horus_task
    id: gmx_energy_min_stateB
    name: Extract potential energy from stateB minimization (gmx_energy)
    description: Runs GROMACS gmx_energy to extract the potential energy profile from the stateB minimization.
    inputs:
      - id: gmx_energy_min_stateB_config
        name: stateB minimization energy config
        kind: file
        path: configs/gmx_energy_min_stateB.yaml
      - id: min_stateB_edr
        name: stateB minimization energy file
        kind: file
        path: results/emout_stateB.edr
    outputs:
      - id: min_stateB_ene_xvg
        name: stateB minimization energy profile
        kind: file
        path: results/min_ene_stateB.xvg
    executor: *executor
    runtime:
      kind: command
      command: >-
        gmx_energy
        --config ${gmx_energy_min_stateB_config}
        --input_energy_path ${min_stateB_edr}
        --output_xvg_path ${min_stateB_ene_xvg}
    target:
      kind: local

  # ── NPT equilibration ─────────────────────────────────────────────────────

  - kind: horus_task
    id: grompp_eq_stateA
    name: Compile stateA equilibration run file (grompp)
    description: Runs GROMACS grompp to assemble the run input file for the stateA NPT equilibration.
    inputs:
      - id: grompp_eq_stateA_config
        name: stateA equilibration mdp config
        kind: file
        path: configs/grompp_eq_stateA.yaml
      - id: pdb2gmxA_gro
        name: stateA topology structure
        kind: file
        path: results/pdb2gmxA.gro
      - id: pmxA_top_zip
        name: stateA hybrid topology
        kind: file
        path: results/pmxA_top.zip
    outputs:
      - id: eq_stateA_tpr
        name: stateA equilibration run input
        kind: file
        path: results/eqA_20ps.tpr
    executor: *executor
    runtime:
      kind: command
      command: >-
        grompp
        --config ${grompp_eq_stateA_config}
        --input_gro_path ${pdb2gmxA_gro}
        --input_top_zip_path ${pmxA_top_zip}
        --output_tpr_path ${eq_stateA_tpr}
    target:
      kind: local

  - kind: horus_task
    id: grompp_eq_stateB
    name: Compile stateB equilibration run file (grompp)
    description: Runs GROMACS grompp to assemble the run input file for the stateB NPT equilibration.
    inputs:
      - id: grompp_eq_stateB_config
        name: stateB equilibration mdp config
        kind: file
        path: configs/grompp_eq_stateB.yaml
      - id: min_stateB_gro
        name: stateB minimized structure
        kind: file
        path: results/emout_stateB.gro
      - id: pmxB_top_zip
        name: stateB hybrid topology
        kind: file
        path: results/pmxB_top.zip
    outputs:
      - id: eq_stateB_tpr
        name: stateB equilibration run input
        kind: file
        path: results/eqB_20ps.tpr
    executor: *executor
    runtime:
      kind: command
      command: >-
        grompp
        --config ${grompp_eq_stateB_config}
        --input_gro_path ${min_stateB_gro}
        --input_top_zip_path ${pmxB_top_zip}
        --output_tpr_path ${eq_stateB_tpr}
    target:
      kind: local

  - kind: horus_task
    id: mdrun_eq_stateA
    name: NPT equilibration for stateA (mdrun)
    description: Runs GROMACS mdrun to perform NPT equilibration of the stateA hybrid structure.
    inputs:
      - id: eq_stateA_tpr
        name: stateA equilibration run input
        kind: file
        path: results/eqA_20ps.tpr
    outputs:
      - id: eq_stateA_gro
        name: stateA equilibrated structure
        kind: file
        path: results/eqoutA.gro
      - id: eq_stateA_edr
        name: stateA equilibration energy file
        kind: file
        path: results/eqoutA.edr
    executor: *executor
    runtime:
      kind: command
      command: >-
        mdrun
        --input_tpr_path ${eq_stateA_tpr}
        --output_gro_path ${eq_stateA_gro}
        --output_trr_path eqoutA.trr
        --output_edr_path ${eq_stateA_edr}
        --output_log_path eqoutA.log
    target:
      kind: local

  - kind: horus_task
    id: mdrun_eq_stateB
    name: NPT equilibration for stateB (mdrun)
    description: Runs GROMACS mdrun to perform NPT equilibration of the stateB hybrid structure.
    inputs:
      - id: eq_stateB_tpr
        name: stateB equilibration run input
        kind: file
        path: results/eqB_20ps.tpr
    outputs:
      - id: eq_stateB_gro
        name: stateB equilibrated structure
        kind: file
        path: results/eqoutB.gro
      - id: eq_stateB_edr
        name: stateB equilibration energy file
        kind: file
        path: results/eqoutB.edr
    executor: *executor
    runtime:
      kind: command
      command: >-
        mdrun
        --input_tpr_path ${eq_stateB_tpr}
        --output_gro_path ${eq_stateB_gro}
        --output_trr_path eqoutB.trr
        --output_edr_path ${eq_stateB_edr}
        --output_log_path eqoutB.log
    target:
      kind: local

  - kind: horus_task
    id: gmx_energy_eq_stateA
    name: Extract pressure and density from stateA equilibration (gmx_energy)
    description: Runs GROMACS gmx_energy to extract the pressure and density profile from the stateA equilibration.
    inputs:
      - id: gmx_energy_eq_stateA_config
        name: stateA energy extraction config
        kind: file
        path: configs/gmx_energy_eq_stateA.yaml
      - id: eq_stateA_edr
        name: stateA equilibration energy file
        kind: file
        path: results/eqoutA.edr
    outputs:
      - id: eq_stateA_pd_xvg
        name: stateA pressure/density profile
        kind: file
        path: results/eqA_PD.xvg
    executor: *executor
    runtime:
      kind: command
      command: >-
        gmx_energy
        --config ${gmx_energy_eq_stateA_config}
        --input_energy_path ${eq_stateA_edr}
        --output_xvg_path ${eq_stateA_pd_xvg}
    target:
      kind: local

  - kind: horus_task
    id: gmx_energy_eq_stateB
    name: Extract pressure and density from stateB equilibration (gmx_energy)
    description: Runs GROMACS gmx_energy to extract the pressure and density profile from the stateB equilibration.
    inputs:
      - id: gmx_energy_eq_stateB_config
        name: stateB energy extraction config
        kind: file
        path: configs/gmx_energy_eq_stateB.yaml
      - id: eq_stateB_edr
        name: stateB equilibration energy file
        kind: file
        path: results/eqoutB.edr
    outputs:
      - id: eq_stateB_pd_xvg
        name: stateB pressure/density profile
        kind: file
        path: results/eqB_PD.xvg
    executor: *executor
    runtime:
      kind: command
      command: >-
        gmx_energy
        --config ${gmx_energy_eq_stateB_config}
        --input_energy_path ${eq_stateB_edr}
        --output_xvg_path ${eq_stateB_pd_xvg}
    target:
      kind: local

  # ── Thermodynamic integration (free energy) simulations ──────────────────

  - kind: horus_task
    id: grompp_ti_stateA
    name: Compile stateA thermodynamic integration run file (grompp)
    description: Runs GROMACS grompp to assemble the run input file for the stateA fast thermodynamic integration (WT->Mut) run.
    inputs:
      - id: grompp_ti_stateA_config
        name: stateA TI mdp config
        kind: file
        path: configs/grompp_ti_stateA.yaml
      - id: eq_stateA_gro
        name: stateA equilibrated structure
        kind: file
        path: results/eqoutA.gro
      - id: pmxA_top_zip
        name: stateA hybrid topology
        kind: file
        path: results/pmxA_top.zip
    outputs:
      - id: ti_stateA_tpr
        name: stateA TI run input
        kind: file
        path: results/tiA.tpr
    executor: *executor
    runtime:
      kind: command
      command: >-
        grompp
        --config ${grompp_ti_stateA_config}
        --input_gro_path ${eq_stateA_gro}
        --input_top_zip_path ${pmxA_top_zip}
        --output_tpr_path ${ti_stateA_tpr}
    target:
      kind: local

  - kind: horus_task
    id: grompp_ti_stateB
    name: Compile stateB thermodynamic integration run file (grompp)
    description: Runs GROMACS grompp to assemble the run input file for the stateB fast thermodynamic integration (Mut->WT) run.
    inputs:
      - id: grompp_ti_stateB_config
        name: stateB TI mdp config
        kind: file
        path: configs/grompp_ti_stateB.yaml
      - id: eq_stateB_gro
        name: stateB equilibrated structure
        kind: file
        path: results/eqoutB.gro
      - id: pmxB_top_zip
        name: stateB hybrid topology
        kind: file
        path: results/pmxB_top.zip
    outputs:
      - id: ti_stateB_tpr
        name: stateB TI run input
        kind: file
        path: results/tiB.tpr
    executor: *executor
    runtime:
      kind: command
      command: >-
        grompp
        --config ${grompp_ti_stateB_config}
        --input_gro_path ${eq_stateB_gro}
        --input_top_zip_path ${pmxB_top_zip}
        --output_tpr_path ${ti_stateB_tpr}
    target:
      kind: local

  - kind: horus_task
    id: mdrun_ti_stateA
    name: Thermodynamic integration simulation for stateA - WT->Mut (mdrun)
    description: Runs GROMACS mdrun to perform the fast non-equilibrium thermodynamic integration transition from WT to Mut, recording dH/dlambda work values.
    inputs:
      - id: ti_stateA_tpr
        name: stateA TI run input
        kind: file
        path: results/tiA.tpr
    outputs:
      - id: ti_stateA_gro
        name: stateA TI final structure
        kind: file
        path: results/tiA.gro
      - id: ti_stateA_dhdl
        name: stateA TI dHdl profile
        description: dH/dlambda work values recorded during the stateA (WT to Mut) TI transition; illustrative of the method, not the statistical sample used for the final estimate.
        kind: file
        path: results/tiA_dhdl.xvg
    executor: *executor
    runtime:
      kind: command
      command: >-
        mdrun
        --input_tpr_path ${ti_stateA_tpr}
        --output_gro_path ${ti_stateA_gro}
        --output_trr_path tiA.trr
        --output_edr_path tiA.edr
        --output_log_path tiA.log
        --output_dhdl_path ${ti_stateA_dhdl}
    target:
      kind: local

  - kind: horus_task
    id: mdrun_ti_stateB
    name: Thermodynamic integration simulation for stateB - Mut->WT (mdrun)
    description: Runs GROMACS mdrun to perform the fast non-equilibrium thermodynamic integration transition from Mut to WT, recording dH/dlambda work values.
    inputs:
      - id: ti_stateB_tpr
        name: stateB TI run input
        kind: file
        path: results/tiB.tpr
    outputs:
      - id: ti_stateB_gro
        name: stateB TI final structure
        kind: file
        path: results/tiB.gro
      - id: ti_stateB_dhdl
        name: stateB TI dHdl profile
        description: dH/dlambda work values recorded during the stateB (Mut to WT) TI transition; illustrative of the method, not the statistical sample used for the final estimate.
        kind: file
        path: results/tiB_dhdl.xvg
    executor: *executor
    runtime:
      kind: command
      command: >-
        mdrun
        --input_tpr_path ${ti_stateB_tpr}
        --output_gro_path ${ti_stateB_gro}
        --output_trr_path tiB.trr
        --output_edr_path tiB.edr
        --output_log_path tiB.log
        --output_dhdl_path ${ti_stateB_dhdl}
    target:
      kind: local

  # ── Free energy estimation ────────────────────────────────────────────────

  - kind: horus_task
    id: pmxanalyse
    name: Compute free energy (CGI / BAR / Jarzynski) from dhdl work values (pmxanalyse)
    description: Runs pmx analyse to estimate the mutation free energy (ddG) from the replicate dHdl work values using the CGI, BAR, and Jarzynski estimators.
    inputs:
      - id: pmxanalyse_config
        name: Free energy analysis config
        kind: file
        path: configs/pmxanalyse.yaml
      - id: dhdlA_zip
        name: stateA replicate dHdl bundle
        kind: file
        path: pmx_tutorial/dhdlA.zip
      - id: dhdlB_zip
        name: stateB replicate dHdl bundle
        kind: file
        path: pmx_tutorial/dhdlB.zip
    outputs:
      - id: pmx_result
        name: Free energy result
        description: Computed free-energy estimate and statistics from the CGI, BAR, and Jarzynski estimators.
        kind: file
        path: results/pmx.txt
      - id: pmx_work_plot
        name: Free energy work-distribution plot
        description: Work-distribution and convergence plots for the free-energy estimate.
        kind: file
        path: results/pmx.plots.png
    executor: *docker_executor_pmx
    runtime:
      kind: command
      command: >-
        pmxanalyse
        --config ${pmxanalyse_config}
        --input_a_xvg_zip_path ${dhdlA_zip}
        --input_b_xvg_zip_path ${dhdlB_zip}
        --output_result_path ${pmx_result}
        --output_work_plot_path ${pmx_work_plot}
    target:
      kind: local

edges:
  # gmx_trjconv_str_ens → pmxmutate
  - source: gmx_trjconv_str_ens_stateA
    source_output: stateA_frames
    target: pmxmutate_stateA
    target_input: stateA_frames

  - source: gmx_trjconv_str_ens_stateB
    source_output: stateB_frames
    target: pmxmutate_stateB
    target_input: stateB_frames

  # pmxmutate → pdb2gmx
  - source: pmxmutate_stateA
    source_output: mutA_pdb
    target: pdb2gmx_stateA
    target_input: mutA_pdb

  - source: pmxmutate_stateB
    source_output: mutB_pdb
    target: pdb2gmx_stateB
    target_input: mutB_pdb

  # pdb2gmx → pmxgentop
  - source: pdb2gmx_stateA
    source_output: pdb2gmxA_top_zip
    target: pmxgentop_stateA
    target_input: pdb2gmxA_top_zip

  - source: pdb2gmx_stateB
    source_output: pdb2gmxB_top_zip
    target: pmxgentop_stateB
    target_input: pdb2gmxB_top_zip

  # pdb2gmxB → make_ndx_stateB
  - source: pdb2gmx_stateB
    source_output: pdb2gmxB_gro
    target: make_ndx_stateB
    target_input: pdb2gmxB_gro

  # pdb2gmxB → grompp_min_stateB
  - source: pdb2gmx_stateB
    source_output: pdb2gmxB_gro
    target: grompp_min_stateB
    target_input: pdb2gmxB_gro

  # pmxgentopB → grompp_min_stateB
  - source: pmxgentop_stateB
    source_output: pmxB_top_zip
    target: grompp_min_stateB
    target_input: pmxB_top_zip

  # make_ndx_stateB → grompp_min_stateB
  - source: make_ndx_stateB
    source_output: indexB_ndx
    target: grompp_min_stateB
    target_input: indexB_ndx

  # grompp_min_stateB → mdrun_min_stateB
  - source: grompp_min_stateB
    source_output: min_stateB_tpr
    target: mdrun_min_stateB
    target_input: min_stateB_tpr

  # mdrun_min_stateB → gmx_energy_min_stateB
  - source: mdrun_min_stateB
    source_output: min_stateB_edr
    target: gmx_energy_min_stateB
    target_input: min_stateB_edr

  # pdb2gmxA → grompp_eq_stateA
  - source: pdb2gmx_stateA
    source_output: pdb2gmxA_gro
    target: grompp_eq_stateA
    target_input: pdb2gmxA_gro

  # pmxgentopA → grompp_eq_stateA
  - source: pmxgentop_stateA
    source_output: pmxA_top_zip
    target: grompp_eq_stateA
    target_input: pmxA_top_zip

  # mdrun_min_stateB (gro) → grompp_eq_stateB
  - source: mdrun_min_stateB
    source_output: min_stateB_gro
    target: grompp_eq_stateB
    target_input: min_stateB_gro

  # pmxgentopB → grompp_eq_stateB
  - source: pmxgentop_stateB
    source_output: pmxB_top_zip
    target: grompp_eq_stateB
    target_input: pmxB_top_zip

  # grompp_eq → mdrun_eq
  - source: grompp_eq_stateA
    source_output: eq_stateA_tpr
    target: mdrun_eq_stateA
    target_input: eq_stateA_tpr

  - source: grompp_eq_stateB
    source_output: eq_stateB_tpr
    target: mdrun_eq_stateB
    target_input: eq_stateB_tpr

  # mdrun_eq → gmx_energy_eq
  - source: mdrun_eq_stateA
    source_output: eq_stateA_edr
    target: gmx_energy_eq_stateA
    target_input: eq_stateA_edr

  - source: mdrun_eq_stateB
    source_output: eq_stateB_edr
    target: gmx_energy_eq_stateB
    target_input: eq_stateB_edr

  # mdrun_eq (gro) → grompp_ti
  - source: mdrun_eq_stateA
    source_output: eq_stateA_gro
    target: grompp_ti_stateA
    target_input: eq_stateA_gro

  - source: mdrun_eq_stateB
    source_output: eq_stateB_gro
    target: grompp_ti_stateB
    target_input: eq_stateB_gro

  # pmxgentop → grompp_ti
  - source: pmxgentop_stateA
    source_output: pmxA_top_zip
    target: grompp_ti_stateA
    target_input: pmxA_top_zip

  - source: pmxgentop_stateB
    source_output: pmxB_top_zip
    target: grompp_ti_stateB
    target_input: pmxB_top_zip

  # grompp_ti → mdrun_ti
  - source: grompp_ti_stateA
    source_output: ti_stateA_tpr
    target: mdrun_ti_stateA
    target_input: ti_stateA_tpr

  - source: grompp_ti_stateB
    source_output: ti_stateB_tpr
    target: mdrun_ti_stateB
    target_input: ti_stateB_tpr

  - source: artifact-gmx_energy_eq_stateA_config
    source_output: gmx_energy_eq_stateA_config
    target: gmx_energy_eq_stateA
    target_input: gmx_energy_eq_stateA_config

  - source: artifact-gmx_energy_eq_stateB_config
    source_output: gmx_energy_eq_stateB_config
    target: gmx_energy_eq_stateB
    target_input: gmx_energy_eq_stateB_config

  - source: artifact-gmx_energy_min_stateB_config
    source_output: gmx_energy_min_stateB_config
    target: gmx_energy_min_stateB
    target_input: gmx_energy_min_stateB_config

  - source: artifact-gmx_trjconv_str_ens_stateA_config
    source_output: gmx_trjconv_str_ens_stateA_config
    target: gmx_trjconv_str_ens_stateA
    target_input: gmx_trjconv_str_ens_stateA_config

  - source: artifact-gmx_trjconv_str_ens_stateB_config
    source_output: gmx_trjconv_str_ens_stateB_config
    target: gmx_trjconv_str_ens_stateB
    target_input: gmx_trjconv_str_ens_stateB_config

  - source: artifact-grompp_eq_stateA_config
    source_output: grompp_eq_stateA_config
    target: grompp_eq_stateA
    target_input: grompp_eq_stateA_config

  - source: artifact-grompp_eq_stateB_config
    source_output: grompp_eq_stateB_config
    target: grompp_eq_stateB
    target_input: grompp_eq_stateB_config

  - source: artifact-grompp_min_stateB_config
    source_output: grompp_min_stateB_config
    target: grompp_min_stateB
    target_input: grompp_min_stateB_config

  - source: artifact-grompp_ti_stateA_config
    source_output: grompp_ti_stateA_config
    target: grompp_ti_stateA
    target_input: grompp_ti_stateA_config

  - source: artifact-grompp_ti_stateB_config
    source_output: grompp_ti_stateB_config
    target: grompp_ti_stateB
    target_input: grompp_ti_stateB_config

  - source: artifact-make_ndx_stateB_config
    source_output: make_ndx_stateB_config
    target: make_ndx_stateB
    target_input: make_ndx_stateB_config

  - source: artifact-pdb2gmx_stateA_config
    source_output: pdb2gmx_stateA_config
    target: pdb2gmx_stateA
    target_input: pdb2gmx_stateA_config

  - source: artifact-pdb2gmx_stateB_config
    source_output: pdb2gmx_stateB_config
    target: pdb2gmx_stateB
    target_input: pdb2gmx_stateB_config

  - source: artifact-pmxanalyse_config
    source_output: pmxanalyse_config
    target: pmxanalyse
    target_input: pmxanalyse_config

  - source: artifact-pmxgentop_stateA_config
    source_output: pmxgentop_stateA_config
    target: pmxgentop_stateA
    target_input: pmxgentop_stateA_config

  - source: artifact-pmxgentop_stateB_config
    source_output: pmxgentop_stateB_config
    target: pmxgentop_stateB
    target_input: pmxgentop_stateB_config

  - source: artifact-pmxmutate_stateA_config
    source_output: pmxmutate_stateA_config
    target: pmxmutate_stateA
    target_input: pmxmutate_stateA_config

  - source: artifact-pmxmutate_stateB_config
    source_output: pmxmutate_stateB_config
    target: pmxmutate_stateB
    target_input: pmxmutate_stateB_config

  - source: artifact-dhdlA_zip
    source_output: dhdlA_zip
    target: pmxanalyse
    target_input: dhdlA_zip

  - source: artifact-dhdlB_zip
    source_output: dhdlB_zip
    target: pmxanalyse
    target_input: dhdlB_zip

  - source: artifact-stateA_tpr
    source_output: stateA_tpr
    target: gmx_trjconv_str_ens_stateA
    target_input: stateA_tpr

  - source: artifact-stateA_traj
    source_output: stateA_traj
    target: gmx_trjconv_str_ens_stateA
    target_input: stateA_traj

  - source: artifact-stateB_tpr
    source_output: stateB_tpr
    target: gmx_trjconv_str_ens_stateB
    target_input: stateB_tpr

  - source: artifact-stateB_traj
    source_output: stateB_traj
    target: gmx_trjconv_str_ens_stateB
    target_input: stateB_traj


orchestrator_target:
  kind: local
  working_directory: "./workflow_results"
