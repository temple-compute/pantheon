kind: horus_workflow
name: Protein-Ligand Docking with PDBe Binding Sites

_executor: &executor
  kind: conda_python_environment
  environment_dir: "../../.horus_conda_env" # one env per run, shared by all tasks
  conda: micromamba
  environment_file: conda_env.yaml

_docker_executor: &docker_executor
  kind: docker
  image: quay.io/biocontainers/biobb_vs:5.2.1--pyhdfd78af_0

artifacts:
  - id: pdb_id
    name: PDB ID
    description: 'RCSB PDB code of the receptor (default 3LFA, p38 MAP kinase). Required: the binding sites come from the PDBe annotations of this entry.'
    kind: string
    path: params/pdb_id.txt
    value: 3LFA
    pattern: '[0-9][A-Za-z0-9]{3}'
    min_length: 4
    max_length: 4
  - id: site_ligand
    name: Site ligand code
    description: Ligand whose PDBe-annotated binding site defines the docking box (default 1N1, dasatinib); the run fails with the list of available sites if this entry has none for it.
    kind: string
    path: params/site_ligand.txt
    value: 1N1
    pattern: '[A-Za-z0-9]{1,3}'
    min_length: 1
    max_length: 3
  - id: ligand_code
    name: Ligand code (PDB CCD)
    description: PDB Chemical Component code of the ligand to dock, downloaded as an idealized SDF (default 1N1, dasatinib). Clear it to dock the uploaded ligand instead.
    kind: string
    path: params/ligand_code.txt
    value: 1N1
    pattern: ([A-Za-z0-9]{1,3})?
    max_length: 3
  - id: ligand_sdf
    name: Ligand upload (SDF)
    description: '3D ligand structure used when the ligand code is empty. Default: examples/1n1_ideal.sdf (dasatinib).'
    kind: file
    path: examples/1n1_ideal.sdf
  - id: convert_pose_to_pdb_config
    name: Pose-to-PDB conversion config
    description: OpenBabel options for converting the top docking pose from PDBQT to PDB format.
    kind: file
    path: configs/convert_pose_to_pdb.yaml

  - id: convert_sdf_to_pdb_config
    name: Ligand SDF-to-PDB conversion config
    description: OpenBabel options for converting the ligand SDF file to PDB format.
    kind: file
    path: configs/convert_sdf_to_pdb.yaml

  - id: extract_docking_pose_config
    name: Docking pose extraction config
    description: Specifies which Vina pose (model 1) to extract from the docking output.
    kind: file
    path: configs/extract_docking_pose.yaml

  - id: prepare_ligand_pdbqt_config
    name: Ligand PDBQT preparation config
    description: OpenBabel options for converting the ligand PDB to PDBQT format for docking.
    kind: file
    path: configs/prepare_ligand_pdbqt.yaml

  - id: prepare_receptor_pdbqt_config
    name: Receptor PDBQT preparation config
    description: Protonation settings for converting the receptor structure to PDBQT format for docking.
    kind: file
    path: configs/prepare_receptor_pdbqt.yaml

  - id: box_offset_a
    name: Box padding (Å)
    description: Extra space added around the binding-site residues on each side of the docking box.
    kind: number
    path: params/box_offset_a.txt
    value: 12
    min: 2
    max: 30
    step: 1
tasks:
  - kind: horus_task
    id: download_pdb
    name: Download 3LFA structure from PDB (protein + ligand complex)
    description: Downloads the 3LFA protein-ligand complex structure from the PDB.
    inputs:
      - id: pdb_id
        name: PDB ID
        kind: string
        path: params/pdb_id.txt
    outputs:
      - id: downloaded_pdb
        name: Downloaded PDB structure
        kind: file
        path: results/download.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        pdb --config '{"properties":{"pdb_code":"${pdb_id}","filter":["ATOM","HETATM"]}}' --output_pdb_path ${downloaded_pdb}
    target:
      kind: local

  - kind: horus_task
    id: extract_protein
    name: Extract protein chain (remove ligands, water, ions)
    description: Removes ligands, waters, and ions from the downloaded structure to isolate the protein chain using biobb extract_molecule.
    inputs:
      - id: downloaded_pdb
        name: Downloaded PDB structure
        kind: file
        path: results/download.pdb
    outputs:
      - id: pdb_protein
        name: Extracted protein structure
        kind: file
        path: results/pdb_protein.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        extract_molecule
        --input_structure_path ${downloaded_pdb}
        --output_molecule_path ${pdb_protein}
    target:
      kind: local

  - kind: horus_task
    id: get_binding_sites
    name: Query PDBe REST-API for binding sites (residues.json)
    description: Queries the PDBe REST API for annotated ligand-binding site residues of the target structure.
    inputs:
      - id: pdb_id
        name: PDB ID
        kind: string
        path: params/pdb_id.txt
    outputs:
      - id: residues_json
        name: Binding site residues
        description: PDBe-annotated binding-site residues for 3LFA; used to populate resid_list in the cavity box config for the next run.
        kind: file
        path: results/residues.json
    executor: *executor # api_binding_site is biobb_io, not in the biobb_vs image
    runtime:
      kind: command
      command: >-
        api_binding_site --config '{"properties":{"pdb_code":"${pdb_id}"}}' --output_json_path ${residues_json}
    target:
      kind: local

  - kind: horus_task
    id: select_binding_site
    name: Select the binding site of site_ligand
    description: Picks the PDBe-annotated binding site of site_ligand from residues.json and writes the box_residues config with its residue numbers.
    inputs:
      - id: residues_json
        name: Binding site residues
        kind: file
        path: results/residues.json
      - id: site_ligand
        name: Site ligand code
        kind: string
        path: params/site_ligand.txt
      - id: box_offset_a
        name: Box padding (Å)
        kind: number
        path: params/box_offset_a.txt
    outputs:
      - id: box_config
        name: Selected binding site (box config)
        kind: file
        path: results/box_residues.json
    executor: *executor
    runtime:
      kind: python_script
      script: scripts/select_site.py
      args: >-
        --residues ${residues_json} --ligand ${site_ligand} --offset ${box_offset_a} --out ${box_config}
    target:
      kind: local
  - kind: horus_task
    id: generate_cavity_box
    name: Generate docking box around selected binding site cavity
    description: Builds an AutoDock Vina docking box around the selected binding-site cavity residues.
    inputs:
      - id: generate_cavity_box_config
        name: Selected binding site (box config)
        kind: file
        path: results/box_residues.json
      - id: downloaded_pdb
        name: Downloaded PDB structure
        kind: file
        path: results/download.pdb
    outputs:
      - id: output_box
        name: Docking box
        kind: file
        path: results/box.pdb
    executor: *docker_executor
    runtime:
      kind: command
      command: >-
        box_residues
        --config ${generate_cavity_box_config}
        --input_pdb_path ${downloaded_pdb}
        --output_pdb_path ${output_box}
    target:
      kind: local

  - kind: horus_task
    id: download_ligand_sdf
    name: Fetch (ligand code) or load the uploaded ligand
    description: Downloads the idealized SDF of ligand_code from the PDB Chemical Component Dictionary, or copies the uploaded SDF when the code is empty.
    inputs:
      - id: ligand_code
        name: Ligand code (PDB CCD)
        kind: string
        path: params/ligand_code.txt
      - id: ligand_sdf
        name: Ligand upload (SDF)
        kind: file
        path: examples/1n1_ideal.sdf
    outputs:
      - id: sdf_ideal
        name: Ligand ideal SDF
        kind: file
        path: results/ideal.sdf
    executor: *executor
    runtime:
      kind: command
      command: >-
        if [ -n ${ligand_code} ]; then ideal_sdf --config '{"properties":{"ligand_code":"${ligand_code}"}}' --output_sdf_path ${sdf_ideal}; else cp ${ligand_sdf} ${sdf_ideal}; fi
    target:
      kind: local

  - kind: horus_task
    id: convert_sdf_to_pdb
    name: Convert ligand SDF to PDB format (OpenBabel)
    description: Converts the ligand SDF file to PDB format using OpenBabel.
    inputs:
      - id: convert_sdf_to_pdb_config
        name: Ligand SDF-to-PDB conversion config
        kind: file
        path: configs/convert_sdf_to_pdb.yaml
      - id: sdf_ideal
        name: Ligand ideal SDF
        kind: file
        path: results/ideal.sdf
    outputs:
      - id: ligand_pdb
        name: Ligand PDB structure
        kind: file
        path: results/ligand.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        babel_convert
        --config ${convert_sdf_to_pdb_config}
        --input_path ${sdf_ideal}
        --output_path ${ligand_pdb}
    target:
      kind: local

  - kind: horus_task
    id: prepare_ligand_pdbqt
    name: Convert ligand PDB to PDBQT for AutoDock Vina (OpenBabel)
    description: Converts the ligand PDB file to PDBQT format for AutoDock Vina using OpenBabel.
    inputs:
      - id: prepare_ligand_pdbqt_config
        name: Ligand PDBQT preparation config
        kind: file
        path: configs/prepare_ligand_pdbqt.yaml
      - id: ligand_pdb
        name: Ligand PDB structure
        kind: file
        path: results/ligand.pdb
    outputs:
      - id: prep_ligand
        name: Prepared ligand PDBQT
        kind: file
        path: results/prep_ligand.pdbqt
    executor: *executor
    runtime:
      kind: command
      command: >-
        babel_convert
        --config ${prepare_ligand_pdbqt_config}
        --input_path ${ligand_pdb}
        --output_path ${prep_ligand}
    target:
      kind: local

  - kind: horus_task
    id: prepare_receptor_pdbqt
    name: Add hydrogens and convert receptor to PDBQT for AutoDock Vina
    description: Adds hydrogens and converts the receptor structure to PDBQT format for AutoDock Vina.
    inputs:
      - id: prepare_receptor_pdbqt_config
        name: Receptor PDBQT preparation config
        kind: file
        path: configs/prepare_receptor_pdbqt.yaml
      - id: pdb_protein
        name: Extracted protein structure
        kind: file
        path: results/pdb_protein.pdb
    outputs:
      - id: prep_receptor
        name: Prepared receptor PDBQT
        kind: file
        path: results/prep_receptor.pdbqt
    executor: *executor
    runtime:
      kind: command
      command: >-
        str_check_add_hydrogens
        --config ${prepare_receptor_pdbqt_config}
        --input_structure_path ${pdb_protein}
        --output_structure_path ${prep_receptor}
    target:
      kind: local

  - kind: horus_task
    id: run_docking
    name: Run AutoDock Vina protein-ligand docking
    description: Runs AutoDock Vina to dock the prepared ligand against the receptor within the generated cavity box.
    inputs:
      - id: prep_ligand
        name: Prepared ligand PDBQT
        kind: file
        path: results/prep_ligand.pdbqt
      - id: prep_receptor
        name: Prepared receptor PDBQT
        kind: file
        path: results/prep_receptor.pdbqt
      - id: output_box
        name: Docking box
        kind: file
        path: results/box.pdb
    outputs:
      - id: output_vina_pdbqt
        name: Vina docking poses (PDBQT)
        kind: file
        path: results/output_vina.pdbqt
      - id: output_vina_log
        name: Vina docking log
        description: Log of the docking run listing binding affinity scores for all generated poses.
        kind: file
        path: results/output_vina.log
    resources:
      cpus: 8
      memory_gb: 16
      walltime: "02:00:00"
    executor: *docker_executor
    runtime:
      kind: command
      command: >-
        autodock_vina_run
        --input_ligand_pdbqt_path ${prep_ligand}
        --input_receptor_pdbqt_path ${prep_receptor}
        --input_box_path ${output_box}
        --output_pdbqt_path ${output_vina_pdbqt}
        --output_log_path ${output_vina_log}
    target:
      kind: local

  - kind: horus_task
    id: extract_docking_pose
    name: Extract best docking pose (model 1) from Vina output
    description: Extracts the top-ranked (model 1) docking pose from the Vina output PDBQT.
    inputs:
      - id: extract_docking_pose_config
        name: Docking pose extraction config
        kind: file
        path: configs/extract_docking_pose.yaml
      - id: output_vina_pdbqt
        name: Vina docking poses (PDBQT)
        kind: file
        path: results/output_vina.pdbqt
    outputs:
      - id: output_pdbqt_model
        name: Top docking pose (PDBQT)
        kind: file
        path: results/output_model.pdbqt
    executor: *docker_executor
    runtime:
      kind: command
      command: >-
        extract_model_pdbqt
        --config ${extract_docking_pose_config}
        --input_pdbqt_path ${output_vina_pdbqt}
        --output_pdbqt_path ${output_pdbqt_model}
    target:
      kind: local

  - kind: horus_task
    id: convert_pose_to_pdb
    name: Convert docking pose PDBQT to PDB format (OpenBabel)
    description: Converts the extracted docking pose from PDBQT to PDB format using OpenBabel.
    inputs:
      - id: convert_pose_to_pdb_config
        name: Pose-to-PDB conversion config
        kind: file
        path: configs/convert_pose_to_pdb.yaml
      - id: output_pdbqt_model
        name: Top docking pose (PDBQT)
        kind: file
        path: results/output_model.pdbqt
    outputs:
      - id: output_pdb_model
        name: Top docking pose (PDB)
        kind: file
        path: results/output_model.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        babel_convert
        --config ${convert_pose_to_pdb_config}
        --input_path ${output_pdbqt_model}
        --output_path ${output_pdb_model}
    target:
      kind: local

  - kind: horus_task
    id: assemble_complex
    name: Merge receptor and docking pose into final protein-ligand complex PDB
    description: Merges the original receptor structure with the docked ligand pose into a final protein-ligand complex PDB.
    inputs:
      - id: downloaded_pdb
        name: Downloaded PDB structure
        kind: file
        path: results/download.pdb
      - id: output_pdb_model
        name: Top docking pose (PDB)
        kind: file
        path: results/output_model.pdb
    outputs:
      - id: output_structure
        name: Final protein-ligand complex
        description: The assembled receptor and top-ranked docked ligand pose, the workflow's final output structure.
        kind: file
        path: results/output_structure.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        cat_pdb
        --input_structure1 ${downloaded_pdb}
        --input_structure2 ${output_pdb_model}
        --output_structure_path ${output_structure}
    target:
      kind: local

edges:
  - source: download_pdb
    source_output: downloaded_pdb
    target: extract_protein
    target_input: downloaded_pdb

  - source: download_pdb
    source_output: downloaded_pdb
    target: generate_cavity_box
    target_input: downloaded_pdb

  - source: download_pdb
    source_output: downloaded_pdb
    target: assemble_complex
    target_input: downloaded_pdb

  - source: extract_protein
    source_output: pdb_protein
    target: prepare_receptor_pdbqt
    target_input: pdb_protein

  - source: generate_cavity_box
    source_output: output_box
    target: run_docking
    target_input: output_box

  - source: download_ligand_sdf
    source_output: sdf_ideal
    target: convert_sdf_to_pdb
    target_input: sdf_ideal

  - source: convert_sdf_to_pdb
    source_output: ligand_pdb
    target: prepare_ligand_pdbqt
    target_input: ligand_pdb

  - source: prepare_ligand_pdbqt
    source_output: prep_ligand
    target: run_docking
    target_input: prep_ligand

  - source: prepare_receptor_pdbqt
    source_output: prep_receptor
    target: run_docking
    target_input: prep_receptor

  - source: run_docking
    source_output: output_vina_pdbqt
    target: extract_docking_pose
    target_input: output_vina_pdbqt

  - source: extract_docking_pose
    source_output: output_pdbqt_model
    target: convert_pose_to_pdb
    target_input: output_pdbqt_model

  - source: convert_pose_to_pdb
    source_output: output_pdb_model
    target: assemble_complex
    target_input: output_pdb_model

  - source: artifact-convert_pose_to_pdb_config
    source_output: convert_pose_to_pdb_config
    target: convert_pose_to_pdb
    target_input: convert_pose_to_pdb_config

  - source: artifact-convert_sdf_to_pdb_config
    source_output: convert_sdf_to_pdb_config
    target: convert_sdf_to_pdb
    target_input: convert_sdf_to_pdb_config

  - source: artifact-extract_docking_pose_config
    source_output: extract_docking_pose_config
    target: extract_docking_pose
    target_input: extract_docking_pose_config

  - source: artifact-prepare_ligand_pdbqt_config
    source_output: prepare_ligand_pdbqt_config
    target: prepare_ligand_pdbqt
    target_input: prepare_ligand_pdbqt_config

  - source: artifact-prepare_receptor_pdbqt_config
    source_output: prepare_receptor_pdbqt_config
    target: prepare_receptor_pdbqt
    target_input: prepare_receptor_pdbqt_config


  - source: artifact-pdb_id
    source_output: pdb_id
    target: download_pdb
    target_input: pdb_id
  - source: artifact-pdb_id
    source_output: pdb_id
    target: get_binding_sites
    target_input: pdb_id
  - source: artifact-ligand_code
    source_output: ligand_code
    target: download_ligand_sdf
    target_input: ligand_code
  - source: artifact-ligand_sdf
    source_output: ligand_sdf
    target: download_ligand_sdf
    target_input: ligand_sdf
  - source: artifact-site_ligand
    source_output: site_ligand
    target: select_binding_site
    target_input: site_ligand
  - source: artifact-box_offset_a
    source_output: box_offset_a
    target: select_binding_site
    target_input: box_offset_a
  - source: get_binding_sites
    source_output: residues_json
    target: select_binding_site
    target_input: residues_json
  - source: select_binding_site
    source_output: box_config
    target: generate_cavity_box
    target_input: generate_cavity_box_config
orchestrator_target:
  kind: local
  working_directory: "./workflow_results"
