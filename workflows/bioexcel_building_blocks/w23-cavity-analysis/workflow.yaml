kind: horus_workflow
name: BioExcel Cavity Analysis

# Every task runs in one conda env: the two scripts call the BioBB python API
# in-process so a failing model can be caught per-model rather than killing the
# run. That also means fpocket comes from the env, not a container.
_executor: &executor
  kind: conda_python_environment
  environment_dir: "../.horus_conda_env_cavity"
  conda: micromamba # set to mamba/conda if that's what's on PATH
  environment_file: conda_env.yaml

artifacts:
  - id: structures
    name: Representative structures
    description: Folder of PDB models (MD cluster representatives, NMR models, or any conformational ensemble) to analyse.
    kind: folder
    path: examples/structures/

tasks:
  # Wraps each input PDB in its own folder, because the `analyze` map fans out
  # over *sub-directories* -- the engine copytree's the i-th child into each
  # clone, so a folder of loose files cannot be mapped over directly.
  - kind: horus_task
    id: prepare_models
    name: Wrap each structure into a mappable model folder
    description: Turns a folder of PDB files into one model_NNN folder per structure so the analysis stage can fan out over them.
    skip_if_complete: false
    inputs:
      - id: structures
        name: Representative structures
        kind: folder
        path: examples/structures/
    outputs:
      - id: models
        name: Model folders
        kind: folder
        path: models/
    executor: *executor
    runtime:
      kind: python_script
      script: scripts/prepare_models.py
      args: >-
        --structures ${structures}
        --out ${models}
    target:
      kind: local

  # The fan-out: one concurrent clone per model, each running the full
  # extract -> fpocket_run -> fpocket_filter -> filter_residue_com pipeline.
  # The template declares exactly one output (required by the engine), pinned
  # at analyze.gathered/<i>/. No `edges:` entries are needed for
  # prepare_models -> analyze -> summarize; the map block describes both the
  # fan-out and the fan-in and the loader synthesizes those edges.
  #
  # Add --residue-selection "resid 31 or resid 21" (MDAnalysis syntax) to keep
  # only the cavities near a site of interest; without it every cavity that
  # passes the score/druggability/volume windows is kept.
  - kind: horus_task
    id: analyze
    name: Detect and filter cavities on each model concurrently
    description: Fans out one clone per model, running fpocket detection, metric filtering, and the residue-proximity filter.
    map:
      over:
        source_task: prepare_models
        source_output: models
        item_input: model
      template:
        kind: horus_task
        inputs:
          - id: model
            name: One model
            kind: folder
            path: model/ # overwritten per-clone with its slice of models/
        outputs:
          - id: analyzed
            name: Model cavity results
            kind: folder
            path: analyzed/
        executor: *executor
        runtime:
          kind: python_script
          script: scripts/analyze_model.py
          args: >-
            --model ${model}
            --out ${analyzed}
            --score 0,1
            --druggability 0.2,1
            --volume 100,5000
            --distance-threshold 10
        target:
          kind: local
      gather:
        task: summarize
        input: results

  - kind: horus_task
    id: summarize
    name: Rank the models by their best cavity
    description: Collects every model's surviving cavities and writes the three sorted summaries (by volume, druggability, and score).
    inputs:
      # Fed by the map's fan-in: one folder holding every clone's output under
      # analyze.gathered/<i>/.
      - id: results
        name: Gathered cavity results
        kind: folder
        path: analyze.gathered/
    outputs:
      - id: summaries
        name: Sorted cavity summaries
        kind: folder
        path: results/
    executor: *executor
    runtime:
      kind: python_script
      script: scripts/summarize.py
      args: >-
        --results ${results}
        --out ${summaries}
    target:
      kind: local

edges:
  - source: artifact-structures
    source_output: structures
    target: prepare_models
    target_input: structures

orchestrator_target:
  kind: local
  working_directory: horus_workflow_results
