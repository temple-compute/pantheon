kind: horus_workflow
name: Protein-Ligand Docking with a Cluster90 Binding Site

_executor: &executor
  kind: conda_python_environment
  environment_dir: "../.horus_conda_env"
  conda: micromamba
  environment_file: conda_env.yaml

_docker_executor: &docker_executor
  kind: docker
  image: quay.io/biocontainers/biobb_vs:5.2.1--pyhdfd78af_0

artifacts:
  - id: pdb_id
    name: PDB ID
    description: 'RCSB PDB code of the receptor (default 3HEC, p38 MAP kinase). Required: the binding site is inferred from the PDB Cluster90 homologs of this entry.'
    kind: string
    path: params/pdb_id.txt
    value: 3HEC
    pattern: '[0-9][A-Za-z0-9]{3}'
    min_length: 4
    max_length: 4
  - id: site_ligand
    name: Site ligand code
    description: Ligand whose binding pose in the Cluster90 homologs defines the binding site (default STI, imatinib).
    kind: string
    path: params/site_ligand.txt
    value: STI
    pattern: '[A-Za-z0-9]{1,3}'
    min_length: 1
    max_length: 3
  - id: ligand_code
    name: Ligand code (PDB CCD)
    description: PDB Chemical Component code of the ligand to dock, downloaded as an idealized SDF (default STI, imatinib). Clear it to dock the uploaded ligand instead.
    kind: string
    path: params/ligand_code.txt
    value: STI
    pattern: ([A-Za-z0-9]{1,3})?
    max_length: 3
  - id: ligand_sdf
    name: Ligand upload (SDF)
    description: '3D ligand structure used when the ligand code is empty. Default: examples/sti_ideal.sdf (imatinib).'
    kind: file
    path: examples/sti_ideal.sdf
  - id: babel_convert_pdb2pdbqt_config
    name: Ligand PDB to PDBQT config
    description: Configuration for the OpenBabel conversion of the docking-ready ligand from PDB to PDBQT format.
    kind: file
    path: configs/babel_convert_pdb2pdbqt.yaml

  - id: babel_convert_pdbqt2pdb_config
    name: Docking pose PDBQT to PDB config
    description: Configuration for the OpenBabel conversion of the top docking pose from PDBQT back to PDB format.
    kind: file
    path: configs/babel_convert_pdbqt2pdb.yaml

  - id: babel_convert_sdf2pdb_config
    name: Ligand SDF to PDB config
    description: Configuration for the OpenBabel conversion of the Imatinib ligand from SDF to PDB format.
    kind: file
    path: configs/babel_convert_sdf2pdb.yaml

  - id: extract_model_pdbqt_config
    name: Pose extraction config
    description: Specifies which docking pose to extract from the AutoDock Vina output.
    kind: file
    path: configs/extract_model_pdbqt.yaml

  - id: str_check_add_hydrogens_config
    name: Receptor protonation config
    description: Protonation settings used when preparing the receptor structure for docking.
    kind: file
    path: configs/str_check_add_hydrogens.yaml

  - id: box_offset_a
    name: Box padding (Å)
    description: Extra space added around the binding site on each side of the docking box.
    kind: number
    path: params/box_offset_a.txt
    value: 12
    min: 2
    max: 30
    step: 1
tasks:
  - kind: horus_task
    id: create_results_folder
    name: Create results folder
    description: Creates the results output directory used by all downstream tasks.
    outputs:
      - id: results_dir
        name: Results directory
        kind: folder
        path: results
    executor: *executor
    runtime:
      kind: command
      command: mkdir -p ${results_dir}
    target:
      kind: local
  - kind: horus_task
    id: fetch_pdb
    name: Download the receptor from the PDB
    description: Runs the biobb `pdb` tool to fetch the pdb_id receptor structure from the RCSB PDB.
    inputs:
      - id: results_dir
        name: Results directory
        kind: folder
        path: results
      - id: pdb_id
        name: PDB ID
        kind: string
        path: params/pdb_id.txt
    outputs:
      - id: download_pdb
        name: Downloaded PDB structure
        kind: file
        path: results/download.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        pdb --config '{"properties":{"pdb_code":"${pdb_id}","filter":["ATOM","HETATM"]}}' --output_pdb_path ${download_pdb}
    target:
      kind: local

  - kind: horus_task
    id: extract_molecule
    name: Extract protein structure from downloaded PDB
    description: Runs the biobb `extract_molecule` tool to isolate the protein chain from the downloaded PDB file, discarding heteroatoms and ligands.
    inputs:
      - id: download_pdb
        name: Downloaded PDB structure
        kind: file
        path: results/download.pdb
    outputs:
      - id: pdb_protein
        name: Protein structure
        kind: file
        path: results/pdb_protein.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        extract_molecule
        --input_structure_path ${download_pdb}
        --output_molecule_path ${pdb_protein}
    target:
      kind: local

  - kind: horus_task
    id: pdb_cluster_zip
    name: Download the PDB Cluster90 collection
    description: Runs the biobb `pdb_cluster_zip` tool to download a zip of Cluster90 (90% sequence identity) homologous structures for the target.
    inputs:
      - id: results_dir
        name: Results directory
        kind: folder
        path: results
      - id: pdb_id
        name: PDB ID
        kind: string
        path: params/pdb_id.txt
    outputs:
      - id: pdb_cluster
        name: Cluster90 structure collection
        kind: file
        path: results/pdb_cluster.zip
    executor: *executor
    runtime:
      kind: command
      command: >-
        pdb_cluster_zip --config '{"properties":{"pdb_code":"${pdb_id}","filter":["ATOM","HETATM"],"cluster":90}}' --output_pdb_zip_path ${pdb_cluster}
    target:
      kind: local

  - kind: horus_task
    id: bindingsite
    name: Extract binding site from Cluster90 collection
    description: Runs the biobb `bindingsite` tool to infer the ligand binding site by analyzing where ligands cluster across the Cluster90 homologs.
    inputs:
      - id: pdb_protein
        name: Protein structure
        kind: file
        path: results/pdb_protein.pdb
      - id: pdb_cluster
        name: Cluster90 structure collection
        kind: file
        path: results/pdb_cluster.zip
      - id: site_ligand
        name: Site ligand code
        kind: string
        path: params/site_ligand.txt
    outputs:
      - id: output_bindingsite
        name: Binding site structure
        kind: file
        path: results/bindingsite.pdb
    executor: *docker_executor
    runtime:
      kind: command
      command: >-
        bindingsite --config '{"properties":{"ligand":"${site_ligand}","matrix_name":"BLOSUM62","gap_open":-10.0,"gap_extend":-0.5,"max_num_ligands":15,"radius":5}}' --input_pdb_path ${pdb_protein} --input_clusters_zip ${pdb_cluster} --output_pdb_path ${output_bindingsite}
    target:
      kind: local

  - kind: horus_task
    id: box
    name: Generate cavity box around binding site
    description: Runs the biobb `box` tool to generate a cavity box enclosing the binding site, used as the AutoDock Vina search space.
    inputs:
      - id: output_bindingsite
        name: Binding site structure
        kind: file
        path: results/bindingsite.pdb
      - id: box_offset_a
        name: Box padding (Å)
        kind: number
        path: params/box_offset_a.txt
    outputs:
      - id: output_box
        name: Docking box
        kind: file
        path: results/box.pdb
    executor: *docker_executor
    runtime:
      kind: command
      command: >-
        box --config '{"properties":{"offset":${box_offset_a},"box_coordinates":true}}' --input_pdb_path ${output_bindingsite} --output_pdb_path ${output_box}
    target:
      kind: local

  - kind: horus_task
    id: ideal_sdf
    name: Fetch (ligand code) or load the uploaded ligand
    description: Downloads the idealized SDF of ligand_code from the PDB Chemical Component Dictionary, or copies the uploaded SDF when the code is empty.
    inputs:
      - id: results_dir
        name: Results directory
        kind: folder
        path: results
      - id: ligand_code
        name: Ligand code (PDB CCD)
        kind: string
        path: params/ligand_code.txt
      - id: ligand_sdf
        name: Ligand upload (SDF)
        kind: file
        path: examples/sti_ideal.sdf
    outputs:
      - id: sdf_ideal
        name: Ligand SDF structure
        kind: file
        path: results/ideal.sdf
    executor: *executor
    runtime:
      kind: command
      command: >-
        if [ -n ${ligand_code} ]; then ideal_sdf --config '{"properties":{"ligand_code":"${ligand_code}"}}' --output_sdf_path ${sdf_ideal}; else cp ${ligand_sdf} ${sdf_ideal}; fi
    target:
      kind: local

  - kind: horus_task
    id: babel_convert_sdf2pdb
    name: Convert small molecule from SDF to PDB format
    description: Runs OpenBabel via the biobb `babel_convert` tool to convert the ligand structure from SDF to PDB format.
    inputs:
      - id: babel_convert_sdf2pdb_config
        name: Ligand SDF to PDB config
        kind: file
        path: configs/babel_convert_sdf2pdb.yaml
      - id: sdf_ideal
        name: Ligand SDF structure
        kind: file
        path: results/ideal.sdf
    outputs:
      - id: ligand_pdb
        name: Ligand PDB structure
        kind: file
        path: results/ligand.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        babel_convert
        --config ${babel_convert_sdf2pdb_config}
        --input_path ${sdf_ideal}
        --output_path ${ligand_pdb}
    target:
      kind: local

  - kind: horus_task
    id: babel_convert_pdb2pdbqt
    name: Prepare ligand for docking (PDB to PDBQT)
    description: Runs OpenBabel via the biobb `babel_convert` tool to convert the ligand from PDB to PDBQT format for AutoDock Vina.
    inputs:
      - id: babel_convert_pdb2pdbqt_config
        name: Ligand PDB to PDBQT config
        kind: file
        path: configs/babel_convert_pdb2pdbqt.yaml
      - id: ligand_pdb
        name: Ligand PDB structure
        kind: file
        path: results/ligand.pdb
    outputs:
      - id: prep_ligand
        name: Docking-ready ligand
        kind: file
        path: results/prep_ligand.pdbqt
    executor: *executor
    runtime:
      kind: command
      command: >-
        babel_convert
        --config ${babel_convert_pdb2pdbqt_config}
        --input_path ${ligand_pdb}
        --output_path ${prep_ligand}
    target:
      kind: local

  - kind: horus_task
    id: str_check_add_hydrogens
    name: Prepare receptor protein for docking (PDB to PDBQT)
    description: Runs the biobb `str_check_add_hydrogens` tool to protonate the receptor and convert it to PDBQT format for docking.
    inputs:
      - id: str_check_add_hydrogens_config
        name: Receptor protonation config
        kind: file
        path: configs/str_check_add_hydrogens.yaml
      - id: pdb_protein
        name: Protein structure
        kind: file
        path: results/pdb_protein.pdb
    outputs:
      - id: prep_receptor
        name: Docking-ready receptor
        kind: file
        path: results/prep_receptor.pdbqt
    executor: *executor
    runtime:
      kind: command
      command: >-
        str_check_add_hydrogens
        --config ${str_check_add_hydrogens_config}
        --input_structure_path ${pdb_protein}
        --output_structure_path ${prep_receptor}
    target:
      kind: local

  - kind: horus_task
    id: autodock_vina_run
    name: Run AutoDock Vina docking
    description: Runs AutoDock Vina to dock the prepared ligand against the prepared receptor within the generated docking box.
    inputs:
      - id: prep_ligand
        name: Docking-ready ligand
        kind: file
        path: results/prep_ligand.pdbqt
      - id: prep_receptor
        name: Docking-ready receptor
        kind: file
        path: results/prep_receptor.pdbqt
      - id: output_box
        name: Docking box
        kind: file
        path: results/box.pdb
    outputs:
      - id: output_vina_pdbqt
        name: Vina docking poses
        kind: file
        path: results/output_vina.pdbqt
      - id: output_vina_log
        name: Vina docking log
        kind: file
        path: results/output_vina.log
    resources:
      cpus: 8
      memory_gb: 16
      walltime: "02:00:00"
    executor: *docker_executor
    runtime:
      kind: command
      command: >-
        autodock_vina_run
        --input_ligand_pdbqt_path ${prep_ligand}
        --input_receptor_pdbqt_path ${prep_receptor}
        --input_box_path ${output_box}
        --output_pdbqt_path ${output_vina_pdbqt}
        --output_log_path ${output_vina_log}
    target:
      kind: local

  - kind: horus_task
    id: extract_model_pdbqt
    name: Extract top docking pose from Vina output
    description: Runs the biobb `extract_model_pdbqt` tool to extract a single ranked pose from the Vina output file.
    inputs:
      - id: extract_model_pdbqt_config
        name: Pose extraction config
        kind: file
        path: configs/extract_model_pdbqt.yaml
      - id: output_vina_pdbqt
        name: Vina docking poses
        kind: file
        path: results/output_vina.pdbqt
    outputs:
      - id: output_pdbqt_model
        name: Top docking pose (PDBQT)
        kind: file
        path: results/output_model.pdbqt
    executor: *docker_executor
    runtime:
      kind: command
      command: >-
        extract_model_pdbqt
        --config ${extract_model_pdbqt_config}
        --input_pdbqt_path ${output_vina_pdbqt}
        --output_pdbqt_path ${output_pdbqt_model}
    target:
      kind: local

  - kind: horus_task
    id: babel_convert_pdbqt2pdb
    name: Convert docking pose from PDBQT to PDB format
    description: Runs OpenBabel via the biobb `babel_convert` tool to convert the extracted docking pose from PDBQT to PDB format.
    inputs:
      - id: babel_convert_pdbqt2pdb_config
        name: Docking pose PDBQT to PDB config
        kind: file
        path: configs/babel_convert_pdbqt2pdb.yaml
      - id: output_pdbqt_model
        name: Top docking pose (PDBQT)
        kind: file
        path: results/output_model.pdbqt
    outputs:
      - id: output_pdb_model
        name: Top docking pose (PDB)
        kind: file
        path: results/output_model.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        babel_convert
        --config ${babel_convert_pdbqt2pdb_config}
        --input_path ${output_pdbqt_model}
        --output_path ${output_pdb_model}
    target:
      kind: local

  - kind: horus_task
    id: cat_pdb
    name: Combine protein and docked ligand into final structure
    description: Runs the biobb `cat_pdb` tool to concatenate the receptor protein and docked ligand pose into a single complex structure.
    inputs:
      - id: pdb_protein
        name: Protein structure
        kind: file
        path: results/pdb_protein.pdb
      - id: output_pdb_model
        name: Top docking pose (PDB)
        kind: file
        path: results/output_model.pdb
    outputs:
      - id: output_structure
        name: Final protein-ligand complex
        description: Assembled protein-ligand complex structure, the final output of the workflow.
        kind: file
        path: results/output_structure.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        cat_pdb
        --input_structure1 ${pdb_protein}
        --input_structure2 ${output_pdb_model}
        --output_structure_path ${output_structure}
    target:
      kind: local

edges:
  - source: fetch_pdb
    source_output: download_pdb
    target: extract_molecule
    target_input: download_pdb

  - source: extract_molecule
    source_output: pdb_protein
    target: bindingsite
    target_input: pdb_protein

  - source: extract_molecule
    source_output: pdb_protein
    target: str_check_add_hydrogens
    target_input: pdb_protein

  - source: extract_molecule
    source_output: pdb_protein
    target: cat_pdb
    target_input: pdb_protein

  - source: pdb_cluster_zip
    source_output: pdb_cluster
    target: bindingsite
    target_input: pdb_cluster

  - source: bindingsite
    source_output: output_bindingsite
    target: box
    target_input: output_bindingsite

  - source: box
    source_output: output_box
    target: autodock_vina_run
    target_input: output_box

  - source: ideal_sdf
    source_output: sdf_ideal
    target: babel_convert_sdf2pdb
    target_input: sdf_ideal

  - source: babel_convert_sdf2pdb
    source_output: ligand_pdb
    target: babel_convert_pdb2pdbqt
    target_input: ligand_pdb

  - source: babel_convert_pdb2pdbqt
    source_output: prep_ligand
    target: autodock_vina_run
    target_input: prep_ligand

  - source: str_check_add_hydrogens
    source_output: prep_receptor
    target: autodock_vina_run
    target_input: prep_receptor

  - source: autodock_vina_run
    source_output: output_vina_pdbqt
    target: extract_model_pdbqt
    target_input: output_vina_pdbqt

  - source: extract_model_pdbqt
    source_output: output_pdbqt_model
    target: babel_convert_pdbqt2pdb
    target_input: output_pdbqt_model

  - source: babel_convert_pdbqt2pdb
    source_output: output_pdb_model
    target: cat_pdb
    target_input: output_pdb_model

  - source: create_results_folder
    source_output: results_dir
    target: fetch_pdb
    target_input: results_dir

  - source: create_results_folder
    source_output: results_dir
    target: pdb_cluster_zip
    target_input: results_dir

  - source: create_results_folder
    source_output: results_dir
    target: ideal_sdf
    target_input: results_dir

  - source: artifact-babel_convert_pdb2pdbqt_config
    source_output: babel_convert_pdb2pdbqt_config
    target: babel_convert_pdb2pdbqt
    target_input: babel_convert_pdb2pdbqt_config

  - source: artifact-babel_convert_pdbqt2pdb_config
    source_output: babel_convert_pdbqt2pdb_config
    target: babel_convert_pdbqt2pdb
    target_input: babel_convert_pdbqt2pdb_config

  - source: artifact-babel_convert_sdf2pdb_config
    source_output: babel_convert_sdf2pdb_config
    target: babel_convert_sdf2pdb
    target_input: babel_convert_sdf2pdb_config

  - source: artifact-extract_model_pdbqt_config
    source_output: extract_model_pdbqt_config
    target: extract_model_pdbqt
    target_input: extract_model_pdbqt_config

  - source: artifact-str_check_add_hydrogens_config
    source_output: str_check_add_hydrogens_config
    target: str_check_add_hydrogens
    target_input: str_check_add_hydrogens_config


  - source: artifact-pdb_id
    source_output: pdb_id
    target: fetch_pdb
    target_input: pdb_id
  - source: artifact-pdb_id
    source_output: pdb_id
    target: pdb_cluster_zip
    target_input: pdb_id
  - source: artifact-site_ligand
    source_output: site_ligand
    target: bindingsite
    target_input: site_ligand
  - source: artifact-ligand_code
    source_output: ligand_code
    target: ideal_sdf
    target_input: ligand_code
  - source: artifact-ligand_sdf
    source_output: ligand_sdf
    target: ideal_sdf
    target_input: ligand_sdf
  - source: artifact-box_offset_a
    source_output: box_offset_a
    target: box
    target_input: box_offset_a
orchestrator_target:
  kind: local
  working_directory: "./workflow_results"
