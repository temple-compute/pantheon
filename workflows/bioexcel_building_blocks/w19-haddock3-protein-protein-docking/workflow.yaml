    inputs:
      - id: cx_ab_tidy_final_config
        name: Strict PDB tidy config
        kind: file
        path: configs/pdb_tidy_strict.yaml
      - id: cx_ab_tidy_final_in
        name: Reference complex antibody (chain/seg swapped)
        kind: file
        path: results/cx_ab_chainxseg.pdb
    outputs:
      - id: cx_antibody_final
        name: Reference complex antibody (final)
        kind: file
        path: results/reference_clean_antibody_final.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_tidy
        --config ${cx_ab_tidy_final_config}
        --input_file_path ${cx_ab_tidy_final_in}
        --output_file_path ${cx_antibody_final}
    target:
      kind: local

  # ── Reference complex antigen preparation ────────────────────────────────

  - kind: horus_task
    id: cx_ag_tidy
    name: Tidy reference complex PDB for antigen extraction (strict)
    description: Runs biobb_pdb_tidy to clean up PDB formatting of the reference complex antigen.
    inputs:
      - id: cx_ag_tidy_config
        name: Strict PDB tidy config
        kind: file
        path: configs/pdb_tidy_strict.yaml
      - id: cx_ag_tidy_in
        name: Raw reference complex structure
        kind: file
        path: results/reference_0.pdb
    outputs:
      - id: cx_ag_tidy_out
        name: Reference complex structure (tidied for antigen)
        kind: file
        path: results/cx_ag_tidy.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_tidy
        --config ${cx_ag_tidy_config}
        --input_file_path ${cx_ag_tidy_in}
        --output_file_path ${cx_ag_tidy_out}
    target:
      kind: local

  - kind: horus_task
    id: cx_ag_selchain
    name: Extract antigen chain from reference complex
    description: Runs biobb_pdb_selchain to extract the target chain from the reference complex antigen.
    inputs:
      - id: reference_antigen_chain
        name: Reference antigen chain
        kind: string
        path: params/reference_antigen_chain.txt
      - id: cx_ag_selchain_in
        name: Reference complex structure (tidied for antigen)
        kind: file
        path: results/cx_ag_tidy.pdb
    outputs:
      - id: cx_ag_selchain_out
        name: Reference complex antigen chain
        kind: file
        path: results/cx_ag_selchain.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_selchain
        --config '{"properties":{"chains":"${reference_antigen_chain}"}}'
        --input_file_path ${cx_ag_selchain_in}
        --output_file_path ${cx_ag_selchain_out}
    target:
      kind: local

  - kind: horus_task
    id: cx_ag_chain
    name: Rename reference antigen chain to B
    description: Runs biobb_pdb_chain to set the reference complex antigen chain identifier.
    inputs:
      - id: cx_ag_chain_config
        name: Antigen chain-B config
        kind: file
        path: configs/chain_B.yaml
      - id: cx_ag_chain_in
        name: Reference complex antigen chain
        kind: file
        path: results/cx_ag_selchain.pdb
    outputs:
      - id: cx_ag_chain_out
        name: Reference complex antigen (chain B)
        kind: file
        path: results/cx_ag_chain.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_chain
        --config ${cx_ag_chain_config}
        --input_file_path ${cx_ag_chain_in}
        --output_file_path ${cx_ag_chain_out}
    target:
      kind: local

  - kind: horus_task
    id: cx_ag_chainxseg
    name: Swap segment for chain identifier in reference complex antigen
    description: Runs biobb_pdb_chainxseg to copy the chain identifier into the segment ID for the reference complex antigen.
    inputs:
      - id: cx_ag_chainxseg_in
        name: Reference complex antigen (chain B)
        kind: file
        path: results/cx_ag_chain.pdb
    outputs:
      - id: cx_ag_chainxseg_out
        name: Reference complex antigen (chain/seg swapped)
        kind: file
        path: results/cx_ag_chainxseg.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_chainxseg
        --input_file_path ${cx_ag_chainxseg_in}
        --output_file_path ${cx_ag_chainxseg_out}
    target:
      kind: local

  - kind: horus_task
    id: cx_ag_delhetatm
    name: Remove HETATM from reference complex antigen
    description: Runs biobb_pdb_delhetatm to strip HETATM records from the reference complex antigen.
    inputs:
      - id: cx_ag_delhetatm_in
        name: Reference complex antigen (chain/seg swapped)
        kind: file
        path: results/cx_ag_chainxseg.pdb
    outputs:
      - id: cx_ag_delhetatm_out
        name: Reference complex antigen (no HETATM)
        kind: file
        path: results/cx_ag_delhetatm.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_delhetatm
        --input_file_path ${cx_ag_delhetatm_in}
        --output_file_path ${cx_ag_delhetatm_out}
    target:
      kind: local

  - kind: horus_task
    id: cx_ag_fixinsert
    name: Fix insertion codes in reference complex antigen
    description: Runs biobb_pdb_fixinsert to renumber residues with insertion codes in the reference complex antigen.
    inputs:
      - id: cx_ag_fixinsert_in
        name: Reference complex antigen (no HETATM)
        kind: file
        path: results/cx_ag_delhetatm.pdb
    outputs:
      - id: cx_ag_fixinsert_out
        name: Reference complex antigen (insertions fixed)
        kind: file
        path: results/cx_ag_fixinsert.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_fixinsert
        --input_file_path ${cx_ag_fixinsert_in}
        --output_file_path ${cx_ag_fixinsert_out}
    target:
      kind: local

  - kind: horus_task
    id: cx_ag_selaltloc
    name: Select alt-locs in reference complex antigen
    description: Runs biobb_pdb_selaltloc to keep only the highest-occupancy alternate location for each atom in the reference complex antigen.
    inputs:
      - id: cx_ag_selaltloc_in
        name: Reference complex antigen (insertions fixed)
        kind: file
        path: results/cx_ag_fixinsert.pdb
    outputs:
      - id: cx_ag_selaltloc_out
        name: Reference complex antigen (alt-locs resolved)
        kind: file
        path: results/cx_ag_selaltloc.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_selaltloc
        --input_file_path ${cx_ag_selaltloc_in}
        --output_file_path ${cx_ag_selaltloc_out}
    target:
      kind: local

  - kind: horus_task
    id: cx_ag_keepcoord
    name: Keep coordinates only in reference complex antigen
    description: Runs biobb_pdb_keepcoord to strip non-coordinate records from the reference complex antigen.
    inputs:
      - id: cx_ag_keepcoord_in
        name: Reference complex antigen (alt-locs resolved)
        kind: file
        path: results/cx_ag_selaltloc.pdb
    outputs:
      - id: cx_ag_keepcoord_out
        name: Reference complex antigen (coordinates only)
        kind: file
        path: results/cx_ag_keepcoord.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        python -m biobb_pdb_tools.pdb_tools.biobb_pdb_keepcoord
        --input_file_path ${cx_ag_keepcoord_in}
        --output_file_path ${cx_ag_keepcoord_out}
    target:
      kind: local

  - kind: horus_task
    id: cx_ag_tidy_final
    name: Final strict tidy of reference complex antigen
    description: Runs biobb_pdb_tidy to clean up PDB formatting of the reference complex antigen.
    inputs:
      - id: cx_ag_tidy_final_config
        name: Strict PDB tidy config
        kind: file
        path: configs/pdb_tidy_strict.yaml
      - id: cx_ag_tidy_final_in
        name: Reference complex antigen (coordinates only)
        kind: file
        path: results/cx_ag_keepcoord.pdb
    outputs:
      - id: cx_antigen_final
        name: Reference complex antigen (final)
        kind: file
        path: results/reference_clean_antigen_final.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_tidy
        --config ${cx_ag_tidy_final_config}
        --input_file_path ${cx_ag_tidy_final_in}
        --output_file_path ${cx_antigen_final}
    target:
      kind: local

  # ── Merge complex antibody + antigen to form reference complex ───────────

  - kind: horus_task
    id: cx_zip_AB
    name: Zip reference complex antibody and antigen PDBs for merge
    description: Zips the reference complex chain PDBs together so biobb_pdb_merge can combine them.
    inputs:
      - id: cx_antibody_final
        name: Reference complex antibody (final)
        kind: file
        path: results/reference_clean_antibody_final.pdb
      - id: cx_antigen_final
        name: Reference complex antigen (final)
        kind: file
        path: results/reference_clean_antigen_final.pdb
    outputs:
      - id: cx_HL_B_zip
        name: Reference complex antibody+antigen (zipped)
        kind: file
        path: results/reference_HL_B.zip
    executor: *executor
    runtime:
      kind: command
      command: >-
        zip -j ${cx_HL_B_zip} ${cx_antibody_final} ${cx_antigen_final}
    target:
      kind: local

  - kind: horus_task
    id: cx_merge
    name: Merge reference complex antibody and antigen chains
    description: Runs biobb_pdb_merge to merge the zipped chain PDBs into a single reference complex structure.
    inputs:
      - id: cx_HL_B_zip
        name: Reference complex antibody+antigen (zipped)
        kind: file
        path: results/reference_HL_B.zip
    outputs:
      - id: cx_clean_merge
        name: Reference complex merged structure
        kind: file
        path: results/reference_clean_merge.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_merge
        --input_file_path ${cx_HL_B_zip}
        --output_file_path ${cx_clean_merge}
    target:
      kind: local

  - kind: horus_task
    id: cx_tidy_final
    name: Final strict tidy of reference complex structure
    description: Runs biobb_pdb_tidy to clean up PDB formatting of the reference complex.
    inputs:
      - id: cx_tidy_final_config
        name: Strict PDB tidy config
        kind: file
        path: configs/pdb_tidy_strict.yaml
      - id: cx_tidy_final_in
        name: Reference complex merged structure
        kind: file
        path: results/reference_clean_merge.pdb
    outputs:
      - id: complex_prep
        name: Prepared reference complex structure
        kind: file
        path: results/reference_clean.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_tidy
        --config ${cx_tidy_final_config}
        --input_file_path ${cx_tidy_final_in}
        --output_file_path ${complex_prep}
    target:
      kind: local

  # ── Restraint generation ─────────────────────────────────────────────────

  - kind: horus_task
    id: write_ab_actpass
    name: Write antibody paratope active residues file
    description: Writes the antibody paratope active residues (paratope_residues) to a text file.
    inputs:
      - id: paratope_residues
        name: Paratope residues
        kind: string
        path: params/paratope_residues.txt
    outputs:
      - id: ab_actpass
        name: Antibody paratope active residues
        kind: file
        path: results/antibody_actpass.txt
    executor: *executor
    runtime:
      kind: command
      command: >-
        printf '%s\n\n' ${paratope_residues}
        > ${ab_actpass}
    target:
      kind: local

  - kind: horus_task
    id: passive_from_active
    name: Compute passive residues around antigen epitope
    description: Derives epitope passive residues on the antigen surrounding the active residues using haddock3_passive_from_active.
    inputs:
      - id: epitope_residues
        name: Epitope residues
        kind: string
        path: params/epitope_residues.txt
      - id: antigen_prep
        name: Prepared antigen structure
        kind: file
        path: results/antigen_clean.pdb
    outputs:
      - id: ag_actpass
        name: Antigen epitope passive residues
        kind: file
        path: results/antigen_actpass.txt
    executor: *executor
    runtime:
      kind: command
      command: >-
        haddock3_passive_from_active
        --config '{"properties":{"active_list":"${epitope_residues}"}}'
        --input_pdb_path ${antigen_prep}
        --output_actpass_path ${ag_actpass}
    target:
      kind: local

  - kind: horus_task
    id: actpass_to_ambig
    name: Convert active/passive residues to ambiguous restraints (AIR)
    description: Converts the antibody/antigen active-passive residue lists into an ambiguous interaction restraints (AIR) table using haddock3_actpass_to_ambig.
    inputs:
      - id: actpass_to_ambig_config
        name: Active/passive to AIR config
        description: Configuration for converting active/passive residue lists into an ambiguous interaction restraints (AIR) table.
        kind: file
        path: configs/actpass_to_ambig.yaml
      - id: ab_actpass
        name: Antibody paratope active residues
        kind: file
        path: results/antibody_actpass.txt
      - id: ag_actpass
        name: Antigen epitope passive residues
        kind: file
        path: results/antigen_actpass.txt
    outputs:
      - id: complex_tbl
        name: Ambiguous interaction restraints (AIR) table
        kind: file
        path: results/ambig-paratope-NMR-epitope.tbl
    executor: *executor
    runtime:
      kind: command
      command: >-
        haddock3_actpass_to_ambig
        --config ${actpass_to_ambig_config}
        --input_actpass1_path ${ab_actpass}
        --input_actpass2_path ${ag_actpass}
        --output_tbl_path ${complex_tbl}
    target:
      kind: local

  - kind: horus_task
    id: restrain_bodies
    name: Generate multi-body restraints to tie antibody chains
    description: Generates multi-body restraints tying the antibody H and L chains together using haddock3_restrain_bodies.
    inputs:
      - id: antibody_prep
        name: Prepared antibody structure
        kind: file
        path: results/antibody_clean.pdb
    outputs:
      - id: body_tbl
        name: Antibody multi-body restraints table
        kind: file
        path: results/antibody-unambig.tbl
    executor: *executor
    runtime:
      kind: command
      command: >-
        haddock3_restrain_bodies
        --input_structure_path ${antibody_prep}
        --output_tbl_path ${body_tbl}
    target:
      kind: local

  # ── HADDOCK docking pipeline ─────────────────────────────────────────────

  - kind: horus_task
    id: topology
    name: Build HADDOCK topology for both molecules
    description: Builds the HADDOCK3 topology for the antibody and antigen molecules.
    inputs:
      - id: antibody_prep
        name: Prepared antibody structure
        kind: file
        path: results/antibody_clean.pdb
      - id: antigen_prep
        name: Prepared antigen structure
        kind: file
        path: results/antigen_clean.pdb
    outputs:
      - id: mol1_top_zip
        name: Antibody topology (HADDOCK3)
        kind: file
        path: results/1_top_mol1.zip
      - id: mol2_top_zip
        name: Antigen topology (HADDOCK3)
        kind: file
        path: results/1_top_mol2.zip
      - id: haddock_wf_data
        name: HADDOCK3 workflow state
        kind: file
        path: results/haddock_wf_data
    executor: *executor
    runtime:
      kind: command
      command: >-
        topology
        --mol1_input_pdb_path ${antibody_prep}
        --mol2_input_pdb_path ${antigen_prep}
        --mol1_output_top_zip_path ${mol1_top_zip}
        --mol2_output_top_zip_path ${mol2_top_zip}
        --output_haddock_wf_data ${haddock_wf_data}
    target:
      kind: local

  - kind: horus_task
    id: rigid_body
    name: Rigid-body docking (rigidbody)
    description: Runs HADDOCK3 rigid-body sampling (number of models set by `rigid_body_models`) using the AIR and multi-body restraints.
    inputs:
      - id: rigid_body_models
        name: Rigid-body models
        kind: number
        path: params/rigid_body_models.txt
      - id: haddock_wf_data_in
        name: HADDOCK3 workflow state
        kind: file
        path: results/haddock_wf_data
      - id: complex_tbl
        name: Ambiguous interaction restraints (AIR) table
        kind: file
        path: results/ambig-paratope-NMR-epitope.tbl
      - id: body_tbl
        name: Antibody multi-body restraints table
        kind: file
        path: results/antibody-unambig.tbl
    outputs:
      - id: haddock_wf_data_rigid
        name: HADDOCK3 workflow state (post rigid-body)
        kind: file
        path: results/haddock_wf_data
      - id: docking_zip
        name: Rigid-body docking model ensemble
        kind: file
        path: results/2_docking.zip
    resources:
      cpus: 8
      memory_gb: 16
      walltime: "04:00:00"
    executor: *executor
    runtime:
      kind: command
      command: >-
        rigid_body
        --config '{"properties":{"cfg":{"sampling":${rigid_body_models},"clean":false}}}'
        --input_haddock_wf_data ${haddock_wf_data_in}
        --output_haddock_wf_data ${haddock_wf_data_rigid}
        --docking_output_zip_path ${docking_zip}
        --ambig_restraints_table_path ${complex_tbl}
        --unambig_restraints_table_path ${body_tbl}
    target:
      kind: local

  - kind: horus_task
    id: capri_eval_1
    name: CAPRI evaluation after rigid-body docking
    description: Scores the rigid-body docking models against the reference complex with CAPRI evaluation.
    inputs:
      - id: haddock_wf_data_in
        name: HADDOCK3 workflow state
        kind: file
        path: results/haddock_wf_data
      - id: complex_prep
        name: Prepared reference complex structure
        kind: file
        path: results/reference_clean.pdb
    outputs:
      - id: haddock_wf_data_capri1
        name: HADDOCK3 workflow state (post CAPRI eval 1)
        kind: file
        path: results/haddock_wf_data
      - id: caprieval1_zip
        name: CAPRI scores (rigid-body)
        kind: file
        path: results/3_caprieval.zip
    executor: *executor
    runtime:
      kind: command
      command: >-
        capri_eval
        --input_haddock_wf_data ${haddock_wf_data_in}
        --output_haddock_wf_data ${haddock_wf_data_capri1}
        --reference_pdb_path ${complex_prep}
        --output_evaluation_zip_path ${caprieval1_zip}
    target:
      kind: local

  - kind: horus_task
    id: sele_top
    name: Select the top-scoring rigid-body models
    description: Selects the top-8 scoring rigid-body models for refinement.
    inputs:
      - id: refine_top_models
        name: Models refined
        kind: number
        path: params/refine_top_models.txt
      - id: haddock_wf_data_in
        name: HADDOCK3 workflow state
        kind: file
        path: results/haddock_wf_data
    outputs:
      - id: haddock_wf_data_sele
        name: HADDOCK3 workflow state (post selection)
        kind: file
        path: results/haddock_wf_data
      - id: selection_zip
        name: Top-8 selected models
        kind: file
        path: results/4_selected.zip
    executor: *executor
    runtime:
      kind: command
      command: >-
        sele_top
        --config '{"properties":{"cfg":{"select":${refine_top_models}}}}'
        --input_haddock_wf_data ${haddock_wf_data_in}
        --output_haddock_wf_data ${haddock_wf_data_sele}
        --output_selection_zip_path ${selection_zip}
    target:
      kind: local

  - kind: horus_task
    id: flex_ref
    name: Flexible refinement of selected models
    description: Runs HADDOCK3 flexible refinement on the selected models using the AIR and multi-body restraints.
    inputs:
      - id: flex_ref_config
        name: Flexible refinement config
        description: Configuration controlling the HADDOCK3 flexible-refinement docking stage.
        kind: file
        path: configs/flex_ref.yaml
      - id: haddock_wf_data_in
        name: HADDOCK3 workflow state
        kind: file
        path: results/haddock_wf_data
      - id: complex_tbl
        name: Ambiguous interaction restraints (AIR) table
        kind: file
        path: results/ambig-paratope-NMR-epitope.tbl
      - id: body_tbl
        name: Antibody multi-body restraints table
        kind: file
        path: results/antibody-unambig.tbl
    outputs:
      - id: haddock_wf_data_flex
        name: HADDOCK3 workflow state (post flexible refinement)
        kind: file
        path: results/haddock_wf_data
      - id: flexref_zip
        name: Flexible refinement model ensemble
        kind: file
        path: results/5_flexref.zip
    resources:
      cpus: 8
      memory_gb: 16
      walltime: "08:00:00"
    executor: *executor
    runtime:
      kind: command
      command: >-
        flex_ref
        --config ${flex_ref_config}
        --input_haddock_wf_data ${haddock_wf_data_in}
        --output_haddock_wf_data ${haddock_wf_data_flex}
        --refinement_output_zip_path ${flexref_zip}
        --ambig_restraints_table_path ${complex_tbl}
        --unambig_restraints_table_path ${body_tbl}
    target:
      kind: local

  - kind: horus_task
    id: capri_eval_2
    name: CAPRI evaluation after flexible refinement
    description: Scores the flexibly refined models against the reference complex with CAPRI evaluation.
    inputs:
      - id: haddock_wf_data_in
        name: HADDOCK3 workflow state
        kind: file
        path: results/haddock_wf_data
      - id: complex_prep
        name: Prepared reference complex structure
        kind: file
        path: results/reference_clean.pdb
    outputs:
      - id: haddock_wf_data_capri2
        name: HADDOCK3 workflow state (post CAPRI eval 2)
        kind: file
        path: results/haddock_wf_data
      - id: caprieval2_zip
        name: CAPRI scores (flexible refinement)
        kind: file
        path: results/6_caprieval2.zip
    executor: *executor
    runtime:
      kind: command
      command: >-
        capri_eval
        --input_haddock_wf_data ${haddock_wf_data_in}
        --output_haddock_wf_data ${haddock_wf_data_capri2}
        --reference_pdb_path ${complex_prep}
        --output_evaluation_zip_path ${caprieval2_zip}
    target:
      kind: local

  - kind: horus_task
    id: em_ref
    name: Energy minimisation refinement of selected models
    description: Runs HADDOCK3 energy-minimisation refinement on the selected models using the AIR and multi-body restraints.
    inputs:
      - id: em_ref_config
        name: Energy minimisation config
        description: Configuration controlling the HADDOCK3 energy-minimisation refinement stage.
        kind: file
        path: configs/em_ref.yaml
      - id: haddock_wf_data_in
        name: HADDOCK3 workflow state
        kind: file
        path: results/haddock_wf_data
      - id: complex_tbl
        name: Ambiguous interaction restraints (AIR) table
        kind: file
        path: results/ambig-paratope-NMR-epitope.tbl
      - id: body_tbl
        name: Antibody multi-body restraints table
        kind: file
        path: results/antibody-unambig.tbl
    outputs:
      - id: haddock_wf_data_em
        name: HADDOCK3 workflow state (post energy minimisation)
        kind: file
        path: results/haddock_wf_data
      - id: emref_zip
        name: Energy-minimised model ensemble
        kind: file
        path: results/7_emref.zip
    resources:
      cpus: 8
      memory_gb: 16
      walltime: "04:00:00"
    executor: *executor
    runtime:
      kind: command
      command: >-
        em_ref
        --config ${em_ref_config}
        --input_haddock_wf_data ${haddock_wf_data_in}
        --output_haddock_wf_data ${haddock_wf_data_em}
        --refinement_output_zip_path ${emref_zip}
        --ambig_restraints_table_path ${complex_tbl}
        --unambig_restraints_table_path ${body_tbl}
    target:
      kind: local

  - kind: horus_task
    id: capri_eval_3
    name: CAPRI evaluation after energy minimisation
    description: Scores the energy-minimised models against the reference complex with CAPRI evaluation.
    inputs:
      - id: haddock_wf_data_in
        name: HADDOCK3 workflow state
        kind: file
        path: results/haddock_wf_data
      - id: complex_prep
        name: Prepared reference complex structure
        kind: file
        path: results/reference_clean.pdb
    outputs:
      - id: haddock_wf_data_capri3
        name: HADDOCK3 workflow state (post CAPRI eval 3)
        kind: file
        path: results/haddock_wf_data
      - id: caprieval3_zip
        name: CAPRI scores (energy minimisation)
        kind: file
        path: results/8_caprieval3.zip
    executor: *executor
    runtime:
      kind: command
      command: >-
        capri_eval
        --input_haddock_wf_data ${haddock_wf_data_in}
        --output_haddock_wf_data ${haddock_wf_data_capri3}
        --reference_pdb_path ${complex_prep}
        --output_evaluation_zip_path ${caprieval3_zip}
    target:
      kind: local

  - kind: horus_task
    id: clust_fcc
    name: Cluster refined models by FCC
    description: Clusters the refined models by fraction of common contacts (FCC).
    inputs:
      - id: clust_fcc_config
        name: FCC clustering config
        description: Configuration controlling the fraction-of-common-contacts (FCC) clustering thresholds.
        kind: file
        path: configs/clust_fcc.yaml
      - id: haddock_wf_data_in
        name: HADDOCK3 workflow state
        kind: file
        path: results/haddock_wf_data
    outputs:
      - id: haddock_wf_data_clust
        name: HADDOCK3 workflow state (post clustering)
        kind: file
        path: results/haddock_wf_data
      - id: clustfcc_zip
        name: FCC clusters
        kind: file
        path: results/9_clustfcc.zip
    executor: *executor
    runtime:
      kind: command
      command: >-
        clust_fcc
        --config ${clust_fcc_config}
        --input_haddock_wf_data ${haddock_wf_data_in}
        --output_haddock_wf_data ${haddock_wf_data_clust}
        --output_cluster_zip_path ${clustfcc_zip}
    target:
      kind: local

  - kind: horus_task
    id: sele_top_clusts
    name: Select the top models of each cluster
    description: Selects the top-4 scoring models from each FCC cluster.
    inputs:
      - id: models_per_cluster
        name: Models per cluster
        kind: number
        path: params/models_per_cluster.txt
      - id: haddock_wf_data_in
        name: HADDOCK3 workflow state
        kind: file
        path: results/haddock_wf_data
    outputs:
      - id: haddock_wf_data_seletop
        name: HADDOCK3 workflow state (post cluster selection)
        kind: file
        path: results/haddock_wf_data
      - id: seletopclusts_zip
        name: Top-4-per-cluster selected models
        kind: file
        path: results/10_seletopclusts.zip
    executor: *executor
    runtime:
      kind: command
      command: >-
        sele_top_clusts
        --config '{"properties":{"cfg":{"top_models":${models_per_cluster},"clean":false}}}'
        --input_haddock_wf_data ${haddock_wf_data_in}
        --output_haddock_wf_data ${haddock_wf_data_seletop}
        --output_selection_zip_path ${seletopclusts_zip}
    target:
      kind: local

  - kind: horus_task
    id: capri_eval_4
    name: Final CAPRI evaluation on cluster representatives
    description: Scores the final cluster representative models against the reference complex with CAPRI evaluation.
    inputs:
      - id: haddock_wf_data_in
        name: HADDOCK3 workflow state
        kind: file
        path: results/haddock_wf_data
      - id: complex_prep
        name: Prepared reference complex structure
        kind: file
        path: results/reference_clean.pdb
    outputs:
      - id: haddock_wf_data_capri4
        name: HADDOCK3 workflow state (post CAPRI eval 4)
        kind: file
        path: results/haddock_wf_data
      - id: caprieval4_zip
        name: CAPRI scores (cluster representatives)
        kind: file
        path: results/11_caprieval4.zip
    executor: *executor
    runtime:
      kind: command
      command: >-
        capri_eval
        --input_haddock_wf_data ${haddock_wf_data_in}
        --output_haddock_wf_data ${haddock_wf_data_capri4}
        --reference_pdb_path ${complex_prep}
        --output_evaluation_zip_path ${caprieval4_zip}
    target:
      kind: local

  - kind: horus_task
    id: contact_map
    name: Generate contact maps for cluster representatives
    description: Generates residue-residue contact maps for the final cluster representative models.
    inputs:
      - id: haddock_wf_data_in
        name: HADDOCK3 workflow state
        kind: file
        path: results/haddock_wf_data
    outputs:
      - id: haddock_wf_data_contact
        name: HADDOCK3 workflow state (post contact map)
        kind: file
        path: results/haddock_wf_data
      - id: contactmap_zip
        name: Contact maps (cluster representatives)
        kind: file
        path: results/12_contact_map.zip
    executor: *executor
    runtime:
      kind: command
      command: >-
        contact_map
        --input_haddock_wf_data ${haddock_wf_data_in}
        --output_haddock_wf_data ${haddock_wf_data_contact}
        --output_contactmap_zip_path ${contactmap_zip}
    target:
      kind: local

