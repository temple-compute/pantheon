kind: horus_workflow
name: HADDOCK3 Antibody-Antigen Docking

_executor: &executor
  kind: conda_python_environment
  environment_dir: "../../.horus_conda_env" # one env per run, shared by all tasks
  conda: micromamba
  environment_file: conda_env.yaml

artifacts:
  - id: rigid_body_models
    name: Rigid-body models
    description: Models sampled by rigid-body docking (the tutorial uses 10 for speed; HADDOCK
      production runs use 1000).
    kind: number
    min: 10
    max: 10000
    step: 10
    value: 10
    path: params/rigid_body_models.txt

  - id: refine_top_models
    name: Models refined
    description: Best rigid-body models passed to flexible and energy-minimisation refinement.
    kind: number
    min: 1
    max: 1000
    step: 1
    value: 8
    path: params/refine_top_models.txt

  - id: models_per_cluster
    name: Models per cluster
    description: Top models kept from each FCC cluster for the final evaluation.
    kind: number
    min: 1
    max: 50
    step: 1
    value: 4
    path: params/models_per_cluster.txt

  - id: antibody_pdb_id
    name: Antibody PDB ID
    description: RCSB PDB code of the antibody structure.
    kind: string
    path: params/antibody_pdb_id.txt
    value: '4G6K'
    pattern: '[0-9][A-Za-z0-9]{3}'
    max_length: 4

  - id: antigen_pdb_id
    name: Antigen PDB ID
    description: RCSB PDB code of the antigen structure.
    kind: string
    path: params/antigen_pdb_id.txt
    value: '4I1B'
    pattern: '[0-9][A-Za-z0-9]{3}'
    max_length: 4

  - id: reference_pdb_id
    name: Reference complex PDB ID
    description: RCSB PDB code of the known antibody-antigen complex used as the CAPRI reference.
    kind: string
    path: params/reference_pdb_id.txt
    value: '4G6M'
    pattern: '[0-9][A-Za-z0-9]{3}'
    max_length: 4

  - id: heavy_chain
    name: Heavy chain
    description: Chain ID of the antibody heavy chain, in both the antibody and the reference complex.
    kind: string
    path: params/heavy_chain.txt
    value: 'H'
    pattern: '[A-Za-z0-9]'
    max_length: 1

  - id: light_chain
    name: Light chain
    description: Chain ID of the antibody light chain, in both the antibody and the reference complex.
    kind: string
    path: params/light_chain.txt
    value: 'L'
    pattern: '[A-Za-z0-9]'
    max_length: 1

  - id: reference_antigen_chain
    name: Reference antigen chain
    description: Chain ID of the antigen in the reference complex.
    kind: string
    path: params/reference_antigen_chain.txt
    value: 'A'
    pattern: '[A-Za-z0-9]'
    max_length: 1

  - id: vh_range
    name: VH residue range
    description: Heavy-chain variable-domain residues kept, pdb_selres syntax (start:end, comma-separated ranges allowed).
    kind: string
    path: params/vh_range.txt
    value: '1:120'
    pattern: '[0-9]+:[0-9]+(,[0-9]+:[0-9]+)*'
    max_length: 64

  - id: vl_range
    name: VL residue range
    description: Light-chain variable-domain residues kept, pdb_selres syntax (start:end, comma-separated ranges allowed).
    kind: string
    path: params/vl_range.txt
    value: '1:107'
    pattern: '[0-9]+:[0-9]+(,[0-9]+:[0-9]+)*'
    max_length: 64

  - id: paratope_residues
    name: Paratope residues
    description: Antibody active (paratope) residues, space-separated, numbered after the heavy and light chains are merged and renumbered from 1.
    kind: string
    path: params/paratope_residues.txt
    value: '31 32 33 34 35 52 54 55 56 100 101 102 103 104 105 106 151 152 169 170 173 211 212 213 214 216'
    pattern: '[0-9]+( [0-9]+)*'
    max_length: 2000

  - id: epitope_residues
    name: Epitope residues
    description: Antigen active (epitope) residues, comma-separated; passive residues are derived around them.
    kind: string
    path: params/epitope_residues.txt
    value: '72,73,74,75,81,83,84,89,90,92,94,96,97,98,115,116,117'
    pattern: '[0-9]+(,[0-9]+)*'
    max_length: 2000

  - id: actpass_to_ambig_config
    name: Active/passive to AIR config
    description: Configuration for converting active/passive residue lists into an ambiguous interaction restraints (AIR) table.
    kind: file
    path: configs/actpass_to_ambig.yaml

  - id: ab_chain_config
    name: Antibody chain-A config
    description: Configuration setting the antibody chain identifier to A.
    kind: file
    path: configs/chain_A.yaml

  - id: ag_chain_config
    name: Antigen chain-B config
    description: Configuration setting the antigen chain identifier to B.
    kind: file
    path: configs/chain_B.yaml

  - id: clust_fcc_config
    name: FCC clustering config
    description: Configuration controlling the fraction-of-common-contacts (FCC) clustering thresholds.
    kind: file
    path: configs/clust_fcc.yaml

  - id: em_ref_config
    name: Energy minimisation config
    description: Configuration controlling the HADDOCK3 energy-minimisation refinement stage.
    kind: file
    path: configs/em_ref.yaml

  - id: flex_ref_config
    name: Flexible refinement config
    description: Configuration controlling the HADDOCK3 flexible-refinement docking stage.
    kind: file
    path: configs/flex_ref.yaml

  - id: ab_H_tidy_config
    name: Strict PDB tidy config
    description: Configuration for strict PDB tidying, reused across antibody, antigen, and reference-complex preparation steps.
    kind: file
    path: configs/pdb_tidy_strict.yaml

  - id: ab_reres_config
    name: Residue renumbering config
    description: Configuration controlling residue renumbering starting from 1.
    kind: file
    path: configs/reres_1.yaml

tasks:

  # ── Structure download ────────────────────────────────────────────────────

  - kind: horus_task
    id: fetch_antibody
    name: Download antibody structure from PDB
    description: Downloads the antibody structure (antibody_pdb_id) from the PDBe.
    inputs:
      - id: antibody_pdb_id
        name: Antibody PDB ID
        kind: string
        path: params/antibody_pdb_id.txt
    outputs:
      - id: ab_0_pdb
        name: Raw antibody structure
        kind: file
        path: results/antibody_0.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        pdb
        --config '{"properties":{"pdb_code":"${antibody_pdb_id}","filter":["ATOM","TER","END"]}}'
        --output_pdb_path ${ab_0_pdb}
    target:
      kind: local

  - kind: horus_task
    id: fetch_antigen
    name: Download antigen structure from PDB
    description: Downloads the antigen structure (antigen_pdb_id) from the PDBe.
    inputs:
      - id: antigen_pdb_id
        name: Antigen PDB ID
        kind: string
        path: params/antigen_pdb_id.txt
    outputs:
      - id: ag_0_pdb
        name: Raw antigen structure
        kind: file
        path: results/antigen_0.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        pdb
        --config '{"properties":{"pdb_code":"${antigen_pdb_id}","filter":["ATOM","TER","END"]}}'
        --output_pdb_path ${ag_0_pdb}
    target:
      kind: local

  - kind: horus_task
    id: fetch_complex
    name: Download reference complex structure from PDB
    description: Downloads the known antibody-antigen complex (reference_pdb_id) used as the CAPRI reference from the PDBe.
    inputs:
      - id: reference_pdb_id
        name: Reference complex PDB ID
        kind: string
        path: params/reference_pdb_id.txt
    outputs:
      - id: cx_0_pdb
        name: Raw reference complex structure
        kind: file
        path: results/reference_0.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        pdb
        --config '{"properties":{"pdb_code":"${reference_pdb_id}","filter":["ATOM","TER","END"]}}'
        --output_pdb_path ${cx_0_pdb}
    target:
      kind: local

  # ── Antibody H-chain preparation ─────────────────────────────────────────

  - kind: horus_task
    id: ab_H_tidy
    name: Tidy antibody PDB (strict, pre H-chain extraction)
    description: Runs biobb_pdb_tidy to clean up PDB formatting of the antibody H chain.
    inputs:
      - id: ab_H_tidy_config
        name: Strict PDB tidy config
        description: Configuration for strict PDB tidying, reused across antibody, antigen, and reference-complex preparation steps.
        kind: file
        path: configs/pdb_tidy_strict.yaml
      - id: ab_H_tidy_in
        name: Raw antibody structure
        kind: file
        path: results/antibody_0.pdb
    outputs:
      - id: ab_H_tidy_out
        name: Antibody H chain (tidied)
        kind: file
        path: results/ab_H_tidy.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_tidy
        --config ${ab_H_tidy_config}
        --input_file_path ${ab_H_tidy_in}
        --output_file_path ${ab_H_tidy_out}
    target:
      kind: local

  - kind: horus_task
    id: ab_H_selchain
    name: Extract heavy chain from antibody
    description: Runs biobb_pdb_selchain to extract the target chain from the antibody.
    inputs:
      - id: heavy_chain
        name: Heavy chain
        kind: string
        path: params/heavy_chain.txt
      - id: ab_H_selchain_in
        name: Antibody H chain (tidied)
        kind: file
        path: results/ab_H_tidy.pdb
    outputs:
      - id: ab_H_selchain_out
        name: Antibody H chain
        kind: file
        path: results/ab_H_selchain.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_selchain
        --config '{"properties":{"chains":"${heavy_chain}"}}'
        --input_file_path ${ab_H_selchain_in}
        --output_file_path ${ab_H_selchain_out}
    target:
      kind: local

  - kind: horus_task
    id: ab_H_delhetatm
    name: Remove HETATM records from antibody H chain
    description: Runs biobb_pdb_delhetatm to strip HETATM records from the antibody H chain.
    inputs:
      - id: ab_H_delhetatm_in
        name: Antibody H chain
        kind: file
        path: results/ab_H_selchain.pdb
    outputs:
      - id: ab_H_delhetatm_out
        name: Antibody H chain (no HETATM)
        kind: file
        path: results/ab_H_delhetatm.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_delhetatm
        --input_file_path ${ab_H_delhetatm_in}
        --output_file_path ${ab_H_delhetatm_out}
    target:
      kind: local

  - kind: horus_task
    id: ab_H_fixinsert
    name: Fix insertion codes in antibody H chain
    description: Runs biobb_pdb_fixinsert to renumber residues with insertion codes in the antibody H chain.
    inputs:
      - id: ab_H_fixinsert_in
        name: Antibody H chain (no HETATM)
        kind: file
        path: results/ab_H_delhetatm.pdb
    outputs:
      - id: ab_H_fixinsert_out
        name: Antibody H chain (insertions fixed)
        kind: file
        path: results/ab_H_fixinsert.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_fixinsert
        --input_file_path ${ab_H_fixinsert_in}
        --output_file_path ${ab_H_fixinsert_out}
    target:
      kind: local

  - kind: horus_task
    id: ab_H_selaltloc
    name: Select highest-occupancy alt-locs in antibody H chain
    description: Runs biobb_pdb_selaltloc to keep only the highest-occupancy alternate location for each atom in the antibody H chain.
    inputs:
      - id: ab_H_selaltloc_in
        name: Antibody H chain (insertions fixed)
        kind: file
        path: results/ab_H_fixinsert.pdb
    outputs:
      - id: ab_H_selaltloc_out
        name: Antibody H chain (alt-locs resolved)
        kind: file
        path: results/ab_H_selaltloc.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_selaltloc
        --input_file_path ${ab_H_selaltloc_in}
        --output_file_path ${ab_H_selaltloc_out}
    target:
      kind: local

  - kind: horus_task
    id: ab_H_keepcoord
    name: Remove non-coordinate records from antibody H chain
    description: Runs biobb_pdb_keepcoord to strip non-coordinate records from the antibody H chain.
    inputs:
      - id: ab_H_keepcoord_in
        name: Antibody H chain (alt-locs resolved)
        kind: file
        path: results/ab_H_selaltloc.pdb
    outputs:
      - id: ab_H_keepcoord_out
        name: Antibody H chain (coordinates only)
        kind: file
        path: results/ab_H_keepcoord.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        python -m biobb_pdb_tools.pdb_tools.biobb_pdb_keepcoord
        --input_file_path ${ab_H_keepcoord_in}
        --output_file_path ${ab_H_keepcoord_out}
    target:
      kind: local

  - kind: horus_task
    id: ab_H_selres
    name: Select VH domain residues from antibody H chain
    description: Runs biobb_pdb_selres to select the configured residue range from the antibody H chain.
    inputs:
      - id: vh_range
        name: VH residue range
        kind: string
        path: params/vh_range.txt
      - id: ab_H_selres_in
        name: Antibody H chain (coordinates only)
        kind: file
        path: results/ab_H_keepcoord.pdb
    outputs:
      - id: ab_H_selres_out
        name: Antibody VH domain
        kind: file
        path: results/ab_H_selres.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_selres
        --config '{"properties":{"selection":"${vh_range}"}}'
        --input_file_path ${ab_H_selres_in}
        --output_file_path ${ab_H_selres_out}
    target:
      kind: local

  - kind: horus_task
    id: ab_H_tidy_final
    name: Final tidy of antibody H-chain reduced structure
    description: Runs biobb_pdb_tidy to clean up PDB formatting of the antibody H chain.
    inputs:
      - id: ab_H_tidy_final_in
        name: Antibody VH domain
        kind: file
        path: results/ab_H_selres.pdb
    outputs:
      - id: ab_H_reduced
        name: Antibody H chain (reduced)
        kind: file
        path: results/antibody_H_reduced.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_tidy
        --input_file_path ${ab_H_tidy_final_in}
        --output_file_path ${ab_H_reduced}
    target:
      kind: local

  # ── Antibody L-chain preparation ─────────────────────────────────────────

  - kind: horus_task
    id: ab_L_tidy
    name: Tidy antibody PDB (strict, pre L-chain extraction)
    description: Runs biobb_pdb_tidy to clean up PDB formatting of the antibody L chain.
    inputs:
      - id: ab_L_tidy_config
        name: Strict PDB tidy config
        kind: file
        path: configs/pdb_tidy_strict.yaml
      - id: ab_L_tidy_in
        name: Raw antibody structure
        kind: file
        path: results/antibody_0.pdb
    outputs:
      - id: ab_L_tidy_out
        name: Antibody L chain (tidied)
        kind: file
        path: results/ab_L_tidy.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_tidy
        --config ${ab_L_tidy_config}
        --input_file_path ${ab_L_tidy_in}
        --output_file_path ${ab_L_tidy_out}
    target:
      kind: local

  - kind: horus_task
    id: ab_L_selchain
    name: Extract light chain from antibody
    description: Runs biobb_pdb_selchain to extract the target chain from the antibody.
    inputs:
      - id: light_chain
        name: Light chain
        kind: string
        path: params/light_chain.txt
      - id: ab_L_selchain_in
        name: Antibody L chain (tidied)
        kind: file
        path: results/ab_L_tidy.pdb
    outputs:
      - id: ab_L_selchain_out
        name: Antibody L chain
        kind: file
        path: results/ab_L_selchain.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_selchain
        --config '{"properties":{"chains":"${light_chain}"}}'
        --input_file_path ${ab_L_selchain_in}
        --output_file_path ${ab_L_selchain_out}
    target:
      kind: local

  - kind: horus_task
    id: ab_L_delhetatm
    name: Remove HETATM records from antibody L chain
    description: Runs biobb_pdb_delhetatm to strip HETATM records from the antibody L chain.
    inputs:
      - id: ab_L_delhetatm_in
        name: Antibody L chain
        kind: file
        path: results/ab_L_selchain.pdb
    outputs:
      - id: ab_L_delhetatm_out
        name: Antibody L chain (no HETATM)
        kind: file
        path: results/ab_L_delhetatm.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_delhetatm
        --input_file_path ${ab_L_delhetatm_in}
        --output_file_path ${ab_L_delhetatm_out}
    target:
      kind: local

  - kind: horus_task
    id: ab_L_fixinsert
    name: Fix insertion codes in antibody L chain
    description: Runs biobb_pdb_fixinsert to renumber residues with insertion codes in the antibody L chain.
    inputs:
      - id: ab_L_fixinsert_in
        name: Antibody L chain (no HETATM)
        kind: file
        path: results/ab_L_delhetatm.pdb
    outputs:
      - id: ab_L_fixinsert_out
        name: Antibody L chain (insertions fixed)
        kind: file
        path: results/ab_L_fixinsert.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_fixinsert
        --input_file_path ${ab_L_fixinsert_in}
        --output_file_path ${ab_L_fixinsert_out}
    target:
      kind: local

  - kind: horus_task
    id: ab_L_selaltloc
    name: Select highest-occupancy alt-locs in antibody L chain
    description: Runs biobb_pdb_selaltloc to keep only the highest-occupancy alternate location for each atom in the antibody L chain.
    inputs:
      - id: ab_L_selaltloc_in
        name: Antibody L chain (insertions fixed)
        kind: file
        path: results/ab_L_fixinsert.pdb
    outputs:
      - id: ab_L_selaltloc_out
        name: Antibody L chain (alt-locs resolved)
        kind: file
        path: results/ab_L_selaltloc.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_selaltloc
        --input_file_path ${ab_L_selaltloc_in}
        --output_file_path ${ab_L_selaltloc_out}
    target:
      kind: local

  - kind: horus_task
    id: ab_L_keepcoord
    name: Remove non-coordinate records from antibody L chain
    description: Runs biobb_pdb_keepcoord to strip non-coordinate records from the antibody L chain.
    inputs:
      - id: ab_L_keepcoord_in
        name: Antibody L chain (alt-locs resolved)
        kind: file
        path: results/ab_L_selaltloc.pdb
    outputs:
      - id: ab_L_keepcoord_out
        name: Antibody L chain (coordinates only)
        kind: file
        path: results/ab_L_keepcoord.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        python -m biobb_pdb_tools.pdb_tools.biobb_pdb_keepcoord
        --input_file_path ${ab_L_keepcoord_in}
        --output_file_path ${ab_L_keepcoord_out}
    target:
      kind: local

  - kind: horus_task
    id: ab_L_selres
    name: Select VL domain residues from antibody L chain
    description: Runs biobb_pdb_selres to select the configured residue range from the antibody L chain.
    inputs:
      - id: vl_range
        name: VL residue range
        kind: string
        path: params/vl_range.txt
      - id: ab_L_selres_in
        name: Antibody L chain (coordinates only)
        kind: file
        path: results/ab_L_keepcoord.pdb
    outputs:
      - id: ab_L_selres_out
        name: Antibody VL domain
        kind: file
        path: results/ab_L_selres.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_selres
        --config '{"properties":{"selection":"${vl_range}"}}'
        --input_file_path ${ab_L_selres_in}
        --output_file_path ${ab_L_selres_out}
    target:
      kind: local

  - kind: horus_task
    id: ab_L_tidy_final
    name: Final tidy of antibody L-chain reduced structure
    description: Runs biobb_pdb_tidy to clean up PDB formatting of the antibody L chain.
    inputs:
      - id: ab_L_tidy_final_in
        name: Antibody VL domain
        kind: file
        path: results/ab_L_selres.pdb
    outputs:
      - id: ab_L_reduced
        name: Antibody L chain (reduced)
        kind: file
        path: results/antibody_L_reduced.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_tidy
        --input_file_path ${ab_L_tidy_final_in}
        --output_file_path ${ab_L_reduced}
    target:
      kind: local

  # ── Merge antibody H+L and rename chain ──────────────────────────────────

  - kind: horus_task
    id: ab_zip_HL
    name: Zip antibody H and L chain PDBs for merge
    description: Zips the antibody chain PDBs together so biobb_pdb_merge can combine them.
    inputs:
      - id: ab_H_reduced
        name: Antibody H chain (reduced)
        kind: file
        path: results/antibody_H_reduced.pdb
      - id: ab_L_reduced
        name: Antibody L chain (reduced)
        kind: file
        path: results/antibody_L_reduced.pdb
    outputs:
      - id: ab_HL_zip
        name: Antibody H+L chains (zipped)
        kind: file
        path: results/antibody_HL.zip
    executor: *executor
    runtime:
      kind: command
      command: >-
        zip -j ${ab_HL_zip} ${ab_H_reduced} ${ab_L_reduced}
    target:
      kind: local

  - kind: horus_task
    id: ab_merge
    name: Merge antibody H and L chains into single PDB
    description: Runs biobb_pdb_merge to merge the zipped chain PDBs into a single antibody structure.
    inputs:
      - id: ab_HL_zip
        name: Antibody H+L chains (zipped)
        kind: file
        path: results/antibody_HL.zip
    outputs:
      - id: ab_clean_merge
        name: Antibody merged structure
        kind: file
        path: results/antibody_clean_merge.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_merge
        --input_file_path ${ab_HL_zip}
        --output_file_path ${ab_clean_merge}
    target:
      kind: local

  - kind: horus_task
    id: ab_reres
    name: Renumber antibody residues starting from 1
    description: Runs biobb_pdb_reres to renumber antibody residues starting from 1.
    inputs:
      - id: ab_reres_config
        name: Residue renumbering config
        description: Configuration controlling residue renumbering starting from 1.
        kind: file
        path: configs/reres_1.yaml
      - id: ab_reres_in
        name: Antibody merged structure
        kind: file
        path: results/antibody_clean_merge.pdb
    outputs:
      - id: ab_reres_out
        name: Antibody structure (renumbered)
        kind: file
        path: results/ab_reres.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        biobb_pdb_reres
        --config ${ab_reres_config}
        --input_file_path ${ab_reres_in}
        --output_file_path ${ab_reres_out}
    target:
      kind: local

  - kind: horus_task
    id: ab_chain
    name: Set antibody chain identifier to A
    description: Runs biobb_pdb_chain to set the antibody chain identifier.
    inputs:
      - id: ab_chain_config
