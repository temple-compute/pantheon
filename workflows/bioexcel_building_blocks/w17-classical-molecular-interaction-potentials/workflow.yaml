    target_input: cmip_run_mip_neutral_config

  - source: artifact-cmip_run_mip_pos_config
    source_output: cmip_run_mip_pos_config
    target: cmip_run_mip_pos
    target_input: cmip_run_mip_pos_config

  - source: artifact-cmip_run_rbd_box_config
    source_output: cmip_run_rbd_box_config
    target: cmip_run_rbd_box
    target_input: cmip_run_rbd_box_config

  - source: artifact-cmip_run_rbd_interaction_config
    source_output: cmip_run_rbd_interaction_config
    target: cmip_run_rbd_interaction
    target_input: cmip_run_rbd_interaction_config

  - source: artifact-cmip_titration_lysozyme_config
    source_output: cmip_titration_lysozyme_config
