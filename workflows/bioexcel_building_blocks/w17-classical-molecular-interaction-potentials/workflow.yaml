kind: horus_workflow
name: Molecular Interaction Potentials (CMIP)

_executor: &executor
  kind: conda_python_environment
  environment_dir: "../../.horus_conda_env" # one env per run, shared by all tasks
  conda: micromamba
  environment_file: conda_env.yaml

_docker_executor_amber: &docker_executor_amber
  kind: docker
  image: quay.io/biocontainers/biobb_amber:5.2.1--py312hc5e4ab4_0

_docker_executor_cmip: &docker_executor_cmip
  kind: docker
  image: quay.io/biocontainers/biobb_cmip:5.2.3--pyhdfd78af_0

artifacts:
  - id: pdb_id
    name: MIP protein PDB ID
    description: 4-character PDB code to download (default 1aki). Leave empty to use the uploaded
      protein instead.
    kind: string
    pattern: ([0-9][A-Za-z0-9]{3})?
    max_length: 4
    value: 1aki
    path: params/pdb_id.txt

  - id: structure
    name: MIP protein (PDB upload)
    description: 'PDB file used when pdb_id is empty. Default: 1AKI from the RCSB PDB.'
    kind: file
    path: examples/1aki.pdb

  - id: titration_waters
    name: Structural waters
    description: Water molecules placed by the CMIP titration.
    kind: number
    min: 0
    max: 500
    step: 1
    value: 20
    path: params/titration_waters.txt

  - id: titration_ions
    name: Ions per sign
    description: Positive and negative ions placed by the CMIP titration (same count each).
    kind: number
    min: 0
    max: 100
    step: 1
    value: 5
    path: params/titration_ions.txt

  - id: complex_pdb_id
    name: Protein-ligand complex PDB ID
    description: 4-character PDB code of the protein-ligand complex for case 2 (default 4hjo, EGFR-Erlotinib).
    kind: string
    pattern: '[0-9][A-Za-z0-9]{3}'
    max_length: 4
    value: 4hjo
    path: params/complex_pdb_id.txt

  - id: complex_ligand
    name: Ligand residue name
    description: Residue name of the ligand in the complex, extracted, parameterized and used as CMIP probe (default AQ4, Erlotinib).
    kind: string
    pattern: '[A-Z0-9]{1,3}'
    max_length: 3
    value: AQ4
    path: params/complex_ligand.txt

  - id: complex_ligand_charge
    name: Ligand net charge
    description: Net molecular charge of the ligand used by ACPype.
    kind: number
    min: -20
    max: 20
    step: 1
    value: 0
    path: params/complex_ligand_charge.txt

  - id: md_pdb
    name: Protein-protein MD structure
    description: 'AMBER structure of a two-chain complex for case 3; must match md_top. Default: the pre-run SARS-CoV-2 RBD-hACE2 structure.'
    kind: file
    path: Files/RBD-hACE2-ZN.pdb

  - id: md_top
    name: Protein-protein MD topology
    description: 'AMBER topology matching md_pdb for case 3. Default: the pre-run RBD-hACE2 topology.'
    kind: file
    path: Files/RBD-hACE2-ZN.top

  - id: partner_a_chain
    name: Partner A chain
    description: Chain of md_pdb used as the first interaction partner (default A, hACE2).
    kind: string
    pattern: '[A-Za-z0-9]'
    max_length: 1
    value: A
    path: params/partner_a_chain.txt

  - id: partner_b_chain
    name: Partner B chain
    description: Chain of md_pdb used as the second interaction partner (default B, RBD).
    kind: string
    pattern: '[A-Za-z0-9]'
    max_length: 1
    value: B
    path: params/partner_b_chain.txt

  - id: cmip_run_complex_box_config
    name: Complex grid box config
    kind: file
    path: configs/cmip_run_complex_box.yaml

  - id: cmip_run_egfr_interaction_config
    name: Protein-ligand interaction config
    kind: file
    path: configs/cmip_run_egfr_interaction.yaml

  - id: cmip_run_hace2_box_config
    name: Partner A grid box config
    kind: file
    path: configs/cmip_run_hace2_box.yaml

  - id: cmip_run_hace2_interaction_config
    name: Partner A interaction config
    kind: file
    path: configs/cmip_run_hace2_interaction.yaml

  - id: cmip_run_mip_neg_config
    name: Negative MIP config
    kind: file
    path: configs/cmip_run_mip_neg.yaml

  - id: cmip_run_mip_neutral_config
    name: Neutral MIP config
    kind: file
    path: configs/cmip_run_mip_neutral.yaml

  - id: cmip_run_mip_pos_config
    name: Positive MIP config
    kind: file
    path: configs/cmip_run_mip_pos.yaml

  - id: cmip_run_rbd_box_config
    name: Partner B grid box config
    kind: file
    path: configs/cmip_run_rbd_box.yaml

  - id: cmip_run_rbd_interaction_config
    name: Partner B interaction config
    kind: file
    path: configs/cmip_run_rbd_interaction.yaml

  - id: leap_gen_top_config
    name: AMBER topology config
    description: Configuration controlling tleap generation of the AMBER topology for the protein-ligand complex.
    kind: file
    path: configs/leap_gen_top.yaml

  - id: sander_mdrun_config
    name: AMBER minimization config
    description: Configuration controlling AMBER sander energy minimization parameters.
    kind: file
    path: configs/sander_mdrun.yaml

tasks:
  # ── Section 1: Protein MIPs ───────────────────────────────────────────────

  - kind: horus_task
    id: fetch_pdb_lysozyme
    name: Fetch or upload the MIP protein
    description: Downloads the PDB entry given in pdb_id, or copies the uploaded structure when pdb_id is empty.
    inputs:
      - id: structure
        name: MIP protein (PDB upload)
        kind: file
        path: examples/1aki.pdb
      - id: pdb_id
        name: MIP protein PDB ID
        kind: string
        path: params/pdb_id.txt
    outputs:
      - id: downloaded_pdb_lysozyme
        name: MIP protein structure
        kind: file
        path: results/protein.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        if [ -n ${pdb_id} ];
        then pdb --config '{"properties":{"pdb_code":"${pdb_id}","api_id":"pdbe"}}' --output_pdb_path ${downloaded_pdb_lysozyme};
        else cp ${structure} ${downloaded_pdb_lysozyme}; fi
    target:
      kind: local

  - kind: horus_task
    id: cmip_prepare_pdb_lysozyme
    name: Prepare the MIP protein for CMIP (add charges and elements)
    description: Assigns CMIP charges and element types to the MIP protein using cmip_prepare_pdb.
    inputs:
      - id: downloaded_pdb_lysozyme
        name: MIP protein structure
        kind: file
        path: results/protein.pdb
    outputs:
      - id: cmip_pdb_lysozyme
        name: MIP protein CMIP-ready structure
        kind: file
        path: results/protein.cmip.pdb
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_prepare_pdb
        --input_pdb_path ${downloaded_pdb_lysozyme}
        --output_cmip_pdb_path ${cmip_pdb_lysozyme}
    target:
      kind: local

  - kind: horus_task
    id: cmip_titration_lysozyme
    name: Compute structural water molecules and ion positions (titration)
    description: Runs CMIP titration to predict structural water and ion positions on the MIP protein.
    inputs:
      - id: titration_waters
        name: Structural waters
        kind: number
        path: params/titration_waters.txt
      - id: titration_ions
        name: Ions per sign
        kind: number
        path: params/titration_ions.txt
      - id: cmip_pdb_lysozyme
        name: MIP protein CMIP-ready structure
        kind: file
        path: results/protein.cmip.pdb
    outputs:
      - id: wat_ions_pdb
        name: Structural waters/ions
        kind: file
        path: results/protein.wat_ions.pdb
    resources:
      cpus: 2
      memory_gb: 8
      walltime: "01:00:00"
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_titration
        --config '{"properties":{"num_positive_ions":${titration_ions},"num_negative_ions":${titration_ions},"num_wats":${titration_waters}}}'
        --input_pdb_path ${cmip_pdb_lysozyme}
        --output_pdb_path ${wat_ions_pdb}
    target:
      kind: local

  - kind: horus_task
    id: cat_pdb_titration
    name: Add structural water molecules and ions to the MIP protein
    description: Merges the predicted structural waters/ions into the MIP protein using cat_pdb.
    inputs:
      - id: cmip_pdb_lysozyme
        name: MIP protein CMIP-ready structure
        kind: file
        path: results/protein.cmip.pdb
      - id: wat_ions_pdb
        name: Structural waters/ions
        kind: file
        path: results/protein.wat_ions.pdb
    outputs:
      - id: tit_pdb
        name: MIP protein with titration
        kind: file
        path: results/protein.tit.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        cat_pdb
        --input_structure1 ${cmip_pdb_lysozyme}
        --input_structure2 ${wat_ions_pdb}
        --output_structure_path ${tit_pdb}
    target:
      kind: local

  - kind: horus_task
    id: cmip_run_mip_pos
    name: Compute positive Molecular Interaction Potential (MIP+)
    description: Runs CMIP with a positive probe charge to compute the MIP grid over the MIP protein.
    inputs:
      - id: cmip_run_mip_pos_config
        name: Positive MIP config
        kind: file
        path: configs/cmip_run_mip_pos.yaml
      - id: cmip_pdb_lysozyme
        name: MIP protein CMIP-ready structure
        kind: file
        path: results/protein.cmip.pdb
    outputs:
      - id: mip_pos_log
        name: Positive MIP log
        kind: file
        path: results/protein.mip_pos.log
      - id: mip_pos_cube
        name: Positive MIP grid (cube)
        kind: file
        path: results/protein.mip_pos.cube
    resources:
      cpus: 2
      memory_gb: 8
      walltime: "01:00:00"
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_run
        --config ${cmip_run_mip_pos_config}
        --input_pdb_path ${cmip_pdb_lysozyme}
        --output_log_path ${mip_pos_log}
        --output_cube_path ${mip_pos_cube}
    target:
      kind: local

  - kind: horus_task
    id: cmip_run_mip_neg
    name: Compute negative Molecular Interaction Potential (MIP-)
    description: Runs CMIP with a negative probe charge to compute the MIP grid over the MIP protein.
    inputs:
      - id: cmip_run_mip_neg_config
        name: Negative MIP config
        kind: file
        path: configs/cmip_run_mip_neg.yaml
      - id: cmip_pdb_lysozyme
        name: MIP protein CMIP-ready structure
        kind: file
        path: results/protein.cmip.pdb
    outputs:
      - id: mip_neg_log
        name: Negative MIP log
        kind: file
        path: results/protein.mip_neg.log
      - id: mip_neg_cube
        name: Negative MIP grid (cube)
        kind: file
        path: results/protein.mip_neg.cube
    resources:
      cpus: 2
      memory_gb: 8
      walltime: "01:00:00"
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_run
        --config ${cmip_run_mip_neg_config}
        --input_pdb_path ${cmip_pdb_lysozyme}
        --output_log_path ${mip_neg_log}
        --output_cube_path ${mip_neg_cube}
    target:
      kind: local

  - kind: horus_task
    id: cmip_run_mip_neutral
    name: Compute neutral Molecular Interaction Potential (MIPn)
    description: Runs CMIP with an uncharged probe to compute the van der Waals MIP grid over the MIP protein.
    inputs:
      - id: cmip_run_mip_neutral_config
        name: Neutral MIP config
        kind: file
        path: configs/cmip_run_mip_neutral.yaml
      - id: cmip_pdb_lysozyme
        name: MIP protein CMIP-ready structure
        kind: file
        path: results/protein.cmip.pdb
    outputs:
      - id: mip_neutral_log
        name: Neutral MIP log
        kind: file
        path: results/protein.mip_neutral.log
      - id: mip_neutral_cube
        name: Neutral MIP grid (cube)
        kind: file
        path: results/protein.mip_neutral.cube
    resources:
      cpus: 2
      memory_gb: 8
      walltime: "01:00:00"
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_run
        --config ${cmip_run_mip_neutral_config}
        --input_pdb_path ${cmip_pdb_lysozyme}
        --output_log_path ${mip_neutral_log}
        --output_cube_path ${mip_neutral_cube}
    target:
      kind: local

  # ── Section 2: Protein-Ligand Interaction Energies ────────────────────────

  - kind: horus_task
    id: fetch_pdb_complex
    name: Download the protein-ligand complex from PDB
    description: Downloads the protein-ligand complex given in complex_pdb_id from the PDBe (ATOM and HETATM records).
    inputs:
      - id: complex_pdb_id
        name: Protein-ligand complex PDB ID
        kind: string
        path: params/complex_pdb_id.txt
    outputs:
      - id: complex_pdb
        name: Protein-ligand complex structure
        kind: file
        path: results/complex.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        pdb
        --config '{"properties":{"pdb_code":"${complex_pdb_id}","api_id":"pdbe","filter":["ATOM","HETATM"]}}'
        --output_pdb_path ${complex_pdb}
    target:
      kind: local

  - kind: horus_task
    id: remove_pdb_water
    name: Remove water molecules from the complex
    description: Strips crystallographic water molecules (HOH) from the protein-ligand complex.
    inputs:
      - id: complex_pdb
        name: Protein-ligand complex structure
        kind: file
        path: results/complex.pdb
    outputs:
      - id: nohoh_pdb
        name: Complex without water
        kind: file
        path: results/complex.noHOH.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        remove_pdb_water
        --input_pdb_path ${complex_pdb}
        --output_pdb_path ${nohoh_pdb}
    target:
      kind: local

  - kind: horus_task
    id: extract_heteroatoms
    name: Extract the ligand from the complex
    description: Extracts the ligand named in complex_ligand from the complex structure.
    inputs:
      - id: complex_ligand
        name: Ligand residue name
        kind: string
        path: params/complex_ligand.txt
      - id: nohoh_pdb
        name: Complex without water
        kind: file
        path: results/complex.noHOH.pdb
    outputs:
      - id: ligand_pdb
        name: Ligand structure
        kind: file
        path: results/ligand.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        extract_heteroatoms
        --config '{"properties":{"heteroatoms":[{"name":"${complex_ligand}"}]}}'
        --input_structure_path ${nohoh_pdb}
        --output_heteroatom_path ${ligand_pdb}
    target:
      kind: local

  - kind: horus_task
    id: reduce_add_hydrogens
    name: Add hydrogen atoms to the ligand
    description: Adds explicit hydrogen atoms to the ligand using reduce.
    inputs:
      - id: ligand_pdb
        name: Ligand structure
        kind: file
        path: results/ligand.pdb
    outputs:
      - id: ligand_h_pdb
        name: Ligand with hydrogens
        kind: file
        path: results/ligand.reduce.H.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        reduce_add_hydrogens
        --input_path ${ligand_pdb}
        --output_path ${ligand_h_pdb}
    target:
      kind: local

  - kind: horus_task
    id: acpype_params_ac
    name: Generate AMBER parameters for the ligand (ACPype)
    description: Generates GAFF/AMBER force field parameters for the ligand using ACPype with the given net charge.
    inputs:
      - id: complex_ligand
        name: Ligand residue name
        kind: string
        path: params/complex_ligand.txt
      - id: complex_ligand_charge
        name: Ligand net charge
        kind: number
        path: params/complex_ligand_charge.txt
      - id: ligand_h_pdb
        name: Ligand with hydrogens
        kind: file
        path: results/ligand.reduce.H.pdb
    outputs:
      - id: acpype_inpcrd
        name: Ligand AMBER coordinates
        kind: file
        path: results/ligand_params.inpcrd
      - id: acpype_frcmod
        name: Ligand force field modifications
        kind: file
        path: results/ligand_params.frcmod
      - id: acpype_lib
        name: Ligand AMBER library
        kind: file
        path: results/ligand_params.lib
      - id: acpype_prmtop
        name: Ligand AMBER topology
        kind: file
        path: results/ligand_params.prmtop
    executor: *executor
    runtime:
      kind: command
      command: >-
        acpype_params_ac
        --config '{"properties":{"basename":"${complex_ligand}params","charge":${complex_ligand_charge}}}'
        --input_path ${ligand_h_pdb}
        --output_path_inpcrd ${acpype_inpcrd}
        --output_path_frcmod ${acpype_frcmod}
        --output_path_lib ${acpype_lib}
        --output_path_prmtop ${acpype_prmtop}
    target:
      kind: local

  - kind: horus_task
    id: leap_gen_top
    name: Generate the AMBER topology of the complex (tleap)
    description: Builds the AMBER topology and coordinates for the full protein-ligand complex using tleap, incorporating the ligand parameters.
    inputs:
      - id: leap_gen_top_config
        name: AMBER topology config
        kind: file
        path: configs/leap_gen_top.yaml
      - id: nohoh_pdb
        name: Complex without water
        kind: file
        path: results/complex.noHOH.pdb
      - id: acpype_lib
        name: Ligand AMBER library
        kind: file
        path: results/ligand_params.lib
      - id: acpype_frcmod
        name: Ligand force field modifications
        kind: file
        path: results/ligand_params.frcmod
    outputs:
      - id: system_pdb
        name: Complex system structure (tleap)
        kind: file
        path: results/structure.leap.pdb
      - id: system_top
        name: Complex system topology
        kind: file
        path: results/structure.leap.prmtop
      - id: system_crd
        name: Complex system coordinates
        kind: file
        path: results/structure.leap.crd
    executor: *docker_executor_amber
    runtime:
      kind: command
      command: >-
        leap_gen_top
        --config ${leap_gen_top_config}
        --input_pdb_path ${nohoh_pdb}
        --input_lib_path ${acpype_lib}
        --input_frcmod_path ${acpype_frcmod}
        --output_pdb_path ${system_pdb}
        --output_top_path ${system_top}
        --output_crd_path ${system_crd}
    target:
      kind: local

  - kind: horus_task
    id: sander_mdrun
    name: Energy minimization of the complex (AMBER sander)
    description: Runs AMBER sander energy minimization on the protein-ligand system topology.
    inputs:
      - id: sander_mdrun_config
        name: AMBER minimization config
        kind: file
        path: configs/sander_mdrun.yaml
      - id: system_top
        name: Complex system topology
        kind: file
        path: results/structure.leap.prmtop
      - id: system_crd
        name: Complex system coordinates
        kind: file
        path: results/structure.leap.crd
    outputs:
      - id: amber_traj
        name: AMBER minimization trajectory
        kind: file
        path: results/structure.amber.crd
      - id: amber_rst
        name: AMBER minimization restart
        kind: file
        path: results/structure.amber.rst
      - id: amber_log
        name: AMBER minimization log
        kind: file
        path: results/structure.amber.log
    resources:
      cpus: 2
      memory_gb: 8
      walltime: "01:00:00"
    executor: *docker_executor_amber
    runtime:
      kind: command
      command: >-
        sander_mdrun
        --config ${sander_mdrun_config}
        --input_top_path ${system_top}
        --input_crd_path ${system_crd}
        --output_traj_path ${amber_traj}
        --output_rst_path ${amber_rst}
        --output_log_path ${amber_log}
    target:
      kind: local

  - kind: horus_task
    id: amber_to_pdb
    name: Convert minimized AMBER restart to PDB
    description: Converts the minimized AMBER restart coordinates back to PDB format using the system topology.
    inputs:
      - id: system_top
        name: Complex system topology
        kind: file
        path: results/structure.leap.prmtop
      - id: amber_rst
        name: AMBER minimization restart
        kind: file
        path: results/structure.amber.rst
    outputs:
      - id: min_pdb
        name: Minimized complex structure
        kind: file
        path: results/structure.amber-min.pdb
    executor: *docker_executor_amber
    runtime:
      kind: command
      command: >-
        amber_to_pdb
        --input_top_path ${system_top}
        --input_crd_path ${amber_rst}
        --output_pdb_path ${min_pdb}
    target:
      kind: local

  - kind: horus_task
    id: cmip_prepare_structure_complex
    name: Prepare the complex for CMIP using AMBER topology charges
    description: Transfers AMBER partial charges from the system topology onto the minimized complex structure for CMIP.
    inputs:
      - id: min_pdb
        name: Minimized complex structure
        kind: file
        path: results/structure.amber-min.pdb
      - id: system_top
        name: Complex system topology
        kind: file
        path: results/structure.leap.prmtop
    outputs:
      - id: cmip_complex_pdb
        name: Complex CMIP-ready structure
        kind: file
        path: results/complex.cmip.pdb
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_prepare_structure
        --input_pdb_path ${min_pdb}
        --input_topology_path ${system_top}
        --output_cmip_pdb_path ${cmip_complex_pdb}
    target:
      kind: local

  - kind: horus_task
    id: remove_ligand
    name: Extract the isolated protein (remove the ligand)
    description: Removes the ligand from the CMIP-ready complex to leave the isolated protein.
    inputs:
      - id: complex_ligand
        name: Ligand residue name
        kind: string
        path: params/complex_ligand.txt
      - id: cmip_complex_pdb
        name: Complex CMIP-ready structure
        kind: file
        path: results/complex.cmip.pdb
    outputs:
      - id: no_lig_pdb
        name: Isolated protein structure
        kind: file
        path: results/complex.noLIG.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        remove_ligand
        --config '{"properties":{"ligand":"${complex_ligand}"}}'
        --input_structure_path ${cmip_complex_pdb}
        --output_structure_path ${no_lig_pdb}
    target:
      kind: local

  - kind: horus_task
    id: cmip_ignore_residues_protein
    name: Mark protein residues as dielectric for CMIP interaction
    description: Flags every non-ligand residue of the CMIP-ready complex to be excluded from self-interaction so CMIP computes only ligand-protein energies.
    inputs:
      - id: complex_ligand
        name: Ligand residue name
        kind: string
        path: params/complex_ligand.txt
      - id: cmip_complex_pdb
        name: Complex CMIP-ready structure
        kind: file
        path: results/complex.cmip.pdb
    outputs:
      - id: prot_ignored_pdb
        name: Complex with protein masked
        kind: file
        path: results/complex.Prot_ignored.cmip.pdb
    executor: *docker_executor_cmip
    runtime:
      kind: command
      # residue_list = every residue number whose name is not the ligand (comma separated)
      command: >-
        RES=$(awk -v lig=${complex_ligand} '/^(ATOM|HETATM)/{r=substr($0,18,3);gsub(/ /,"",r);n=substr($0,23,5);gsub(/ /,"",n);if(r!=lig&&!(n in s)){s[n]=1;l=l (l==""?"":",") n}}END{print l}' ${cmip_complex_pdb})
        && cmip_ignore_residues
        --config "{\"properties\":{\"residue_list\":\"$RES\"}}"
        --input_cmip_pdb_path ${cmip_complex_pdb}
        --output_cmip_pdb_path ${prot_ignored_pdb}
    target:
      kind: local

  - kind: horus_task
    id: cmip_run_egfr_interaction
    name: Compute protein-ligand interaction energies
    description: Runs CMIP with the ligand as probe against the masked protein to compute interaction energies.
    inputs:
      - id: cmip_run_egfr_interaction_config
        name: Protein-ligand interaction config
        kind: file
        path: configs/cmip_run_egfr_interaction.yaml
      - id: prot_ignored_pdb
        name: Complex with protein masked
        kind: file
        path: results/complex.Prot_ignored.cmip.pdb
      - id: no_lig_pdb
        name: Isolated protein structure
        kind: file
        path: results/complex.noLIG.pdb
    outputs:
      - id: egfr_energies_log
        name: Protein-ligand interaction energies log
        kind: file
        path: results/complex.energies.log
      - id: egfr_byat_out
        name: Protein-ligand per-atom energies
        kind: file
        path: results/complex.ener.byat.out
    resources:
      cpus: 2
      memory_gb: 8
      walltime: "01:00:00"
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_run
        --config ${cmip_run_egfr_interaction_config}
        --input_pdb_path ${prot_ignored_pdb}
        --input_probe_pdb_path ${no_lig_pdb}
        --output_log_path ${egfr_energies_log}
        --output_byat_path ${egfr_byat_out}
    target:
      kind: local

  # ── Section 3: Protein-Protein Interaction Energies ───────────────────────

  - kind: horus_task
    id: cmip_prepare_structure_md
    name: Prepare the protein-protein MD structure for CMIP using MD topology charges
    description: Transfers AMBER partial charges from the MD topology onto the protein-protein structure for CMIP.
    inputs:
      - id: md_pdb
        name: Protein-protein MD structure
        kind: file
        path: Files/RBD-hACE2-ZN.pdb
      - id: md_top
        name: Protein-protein MD topology
        kind: file
        path: Files/RBD-hACE2-ZN.top
    outputs:
      - id: md_cmip_pdb
        name: Protein-protein CMIP-ready structure
        kind: file
        path: results/pp_complex.cmip.pdb
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_prepare_structure
        --input_pdb_path ${md_pdb}
        --input_topology_path ${md_top}
        --output_cmip_pdb_path ${md_cmip_pdb}
    target:
      kind: local

  - kind: horus_task
    id: extract_chain_hace2
    name: Extract the partner A chain
    description: Splits out the partner_a_chain chain from the protein-protein complex using extract_chain.
    inputs:
      - id: partner_a_chain
        name: Partner A chain
        kind: string
        path: params/partner_a_chain.txt
      - id: md_cmip_pdb
        name: Protein-protein CMIP-ready structure
        kind: file
        path: results/pp_complex.cmip.pdb
    outputs:
      - id: hace2_cmip_pdb
        name: Partner A chain structure
        kind: file
        path: results/partner_a.cmip.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        extract_chain
        --config '{"properties":{"chains":["${partner_a_chain}"],"permissive":true}}'
        --input_structure_path ${md_cmip_pdb}
        --output_structure_path ${hace2_cmip_pdb}
    target:
      kind: local

  - kind: horus_task
    id: extract_chain_rbd
    name: Extract the partner B chain
    description: Splits out the partner_b_chain chain from the protein-protein complex using extract_chain.
    inputs:
      - id: partner_b_chain
        name: Partner B chain
        kind: string
        path: params/partner_b_chain.txt
      - id: md_cmip_pdb
        name: Protein-protein CMIP-ready structure
        kind: file
        path: results/pp_complex.cmip.pdb
    outputs:
      - id: rbd_cmip_pdb
        name: Partner B chain structure
        kind: file
        path: results/partner_b.cmip.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        extract_chain
        --config '{"properties":{"chains":["${partner_b_chain}"],"permissive":true}}'
        --input_structure_path ${md_cmip_pdb}
        --output_structure_path ${rbd_cmip_pdb}
    target:
      kind: local

  - kind: horus_task
    id: cmip_run_rbd_box
    name: Compute 3D grid box enclosing partner B
    description: Runs CMIP in box-only mode to derive the grid dimensions enclosing the partner B monomer.
    inputs:
      - id: cmip_run_rbd_box_config
        name: Partner B grid box config
        kind: file
        path: configs/cmip_run_rbd_box.yaml
      - id: rbd_cmip_pdb
        name: Partner B chain structure
        kind: file
        path: results/partner_b.cmip.pdb
    outputs:
      - id: rbd_box_log
        name: Partner B grid box log
        kind: file
        path: results/partner_b.box.log
      - id: rbd_box_json
        name: Partner B grid box definition
        kind: file
        path: results/partner_b.box.json
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_run
        --config ${cmip_run_rbd_box_config}
        --input_pdb_path ${rbd_cmip_pdb}
        --output_log_path ${rbd_box_log}
        --output_json_box_path ${rbd_box_json}
    target:
      kind: local

  - kind: horus_task
    id: cmip_run_hace2_box
    name: Compute 3D grid box enclosing partner A
    description: Runs CMIP in box-only mode to derive the grid dimensions enclosing the partner A monomer.
    inputs:
      - id: cmip_run_hace2_box_config
        name: Partner A grid box config
        kind: file
        path: configs/cmip_run_hace2_box.yaml
      - id: hace2_cmip_pdb
        name: Partner A chain structure
        kind: file
        path: results/partner_a.cmip.pdb
    outputs:
      - id: hace2_box_log
        name: Partner A grid box log
        kind: file
        path: results/partner_a.box.log
      - id: hace2_box_json
        name: Partner A grid box definition
        kind: file
        path: results/partner_a.box.json
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_run
        --config ${cmip_run_hace2_box_config}
        --input_pdb_path ${hace2_cmip_pdb}
        --output_log_path ${hace2_box_log}
        --output_json_box_path ${hace2_box_json}
    target:
      kind: local

  - kind: horus_task
    id: cmip_run_complex_box
    name: Compute 3D grid box enclosing the protein-protein complex
    description: Runs CMIP in box-only mode to derive the grid dimensions enclosing the full protein-protein complex.
    inputs:
      - id: cmip_run_complex_box_config
        name: Complex grid box config
        kind: file
        path: configs/cmip_run_complex_box.yaml
      - id: md_cmip_pdb
        name: Protein-protein CMIP-ready structure
        kind: file
        path: results/pp_complex.cmip.pdb
    outputs:
      - id: complex_box_log
        name: Complex grid box log
        kind: file
        path: results/pp_complex.box.log
      - id: complex_box_json
        name: Complex grid box definition
        kind: file
        path: results/pp_complex.box.json
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_run
        --config ${cmip_run_complex_box_config}
        --input_pdb_path ${md_cmip_pdb}
        --output_log_path ${complex_box_log}
        --output_json_box_path ${complex_box_json}
    target:
      kind: local

  - kind: horus_task
    id: cmip_ignore_residues_rbd
    name: Mark partner B residues as dielectric for CMIP
    description: Flags the partner B chain residues to be excluded from self-interaction so CMIP computes only partner B-partner A cross energies.
    inputs:
      - id: partner_b_chain
        name: Partner B chain
        kind: string
        path: params/partner_b_chain.txt
      - id: md_cmip_pdb
        name: Protein-protein CMIP-ready structure
        kind: file
        path: results/pp_complex.cmip.pdb
    outputs:
      - id: rbd_ignored_pdb
        name: Complex with partner B masked
        kind: file
        path: results/pp_complex.partner_b_ignored.cmip.pdb
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_ignore_residues
        --config '{"properties":{"residue_list":"${partner_b_chain}:"}}'
        --input_cmip_pdb_path ${md_cmip_pdb}
        --output_cmip_pdb_path ${rbd_ignored_pdb}
    target:
      kind: local

  - kind: horus_task
    id: cmip_run_rbd_interaction
    name: Compute partner B interaction energies with partner A
    description: Runs CMIP with the partner B chain as probe against the masked complex to compute partner B-partner A interaction energies.
    inputs:
      - id: cmip_run_rbd_interaction_config
        name: Partner B interaction config
        kind: file
        path: configs/cmip_run_rbd_interaction.yaml
      - id: rbd_ignored_pdb
        name: Complex with partner B masked
        kind: file
        path: results/pp_complex.partner_b_ignored.cmip.pdb
      - id: rbd_cmip_pdb
        name: Partner B chain structure
        kind: file
        path: results/partner_b.cmip.pdb
      - id: rbd_box_json
        name: Partner B grid box definition
        kind: file
        path: results/partner_b.box.json
      - id: complex_box_json
        name: Complex grid box definition
        kind: file
        path: results/pp_complex.box.json
    outputs:
      - id: rbd_energies_log
        name: Partner B interaction energies log
        kind: file
        path: results/partner_b.energies.log
      - id: rbd_byat_out
        name: Partner B per-atom energies
        kind: file
        path: results/partner_b.energies.byat.out
      - id: rbd_energies_box_json
        name: Partner B interaction grid box output
        kind: file
        path: results/partner_b.energies.box.output.json
      - id: complex_energies_box_json
        name: Complex grid box output (partner B run)
        kind: file
        path: results/pp_complex.partner_b_run.box.output.json
    resources:
      cpus: 2
      memory_gb: 8
      walltime: "01:00:00"
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_run
        --config ${cmip_run_rbd_interaction_config}
        --input_pdb_path ${rbd_ignored_pdb}
        --input_probe_pdb_path ${rbd_cmip_pdb}
        --input_json_box_path ${rbd_box_json}
        --input_json_external_box_path ${complex_box_json}
        --output_log_path ${rbd_energies_log}
        --output_byat_path ${rbd_byat_out}
        --output_json_box_path ${rbd_energies_box_json}
        --output_json_external_box_path ${complex_energies_box_json}
    target:
      kind: local

  - kind: horus_task
    id: cmip_ignore_residues_hace2
    name: Mark partner A residues as dielectric for CMIP
    description: Flags the partner A chain residues to be excluded from self-interaction so CMIP computes only partner A-partner B cross energies.
    inputs:
      - id: partner_a_chain
        name: Partner A chain
        kind: string
        path: params/partner_a_chain.txt
      - id: md_cmip_pdb
        name: Protein-protein CMIP-ready structure
        kind: file
        path: results/pp_complex.cmip.pdb
    outputs:
      - id: hace2_ignored_pdb
        name: Complex with partner A masked
        kind: file
        path: results/pp_complex.partner_a_ignored.cmip.pdb
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_ignore_residues
        --config '{"properties":{"residue_list":"${partner_a_chain}:"}}'
        --input_cmip_pdb_path ${md_cmip_pdb}
        --output_cmip_pdb_path ${hace2_ignored_pdb}
    target:
      kind: local

  - kind: horus_task
    id: cmip_run_hace2_interaction
    name: Compute partner A interaction energies with partner B
    description: Runs CMIP with the partner A chain as probe against the masked complex to compute partner A-partner B interaction energies.
    inputs:
      - id: cmip_run_hace2_interaction_config
        name: Partner A interaction config
        kind: file
        path: configs/cmip_run_hace2_interaction.yaml
      - id: hace2_ignored_pdb
        name: Complex with partner A masked
        kind: file
        path: results/pp_complex.partner_a_ignored.cmip.pdb
      - id: hace2_cmip_pdb
        name: Partner A chain structure
        kind: file
        path: results/partner_a.cmip.pdb
      - id: hace2_box_json
        name: Partner A grid box definition
        kind: file
        path: results/partner_a.box.json
      - id: complex_box_json
        name: Complex grid box definition
        kind: file
        path: results/pp_complex.box.json
    outputs:
      - id: hace2_energies_log
        name: Partner A interaction energies log
        kind: file
        path: results/partner_a.energies.log
      - id: hace2_byat_out
        name: Partner A per-atom energies
        kind: file
        path: results/partner_a.energies.byat.out
      - id: hace2_energies_box_json
        name: Partner A interaction grid box output
        kind: file
        path: results/partner_a.energies.box.output.json
      - id: complex_2_energies_box_json
        name: Complex grid box output (partner A run)
        kind: file
        path: results/pp_complex.partner_a_run.box.output.json
    resources:
      cpus: 2
      memory_gb: 8
      walltime: "01:00:00"
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_run
        --config ${cmip_run_hace2_interaction_config}
        --input_pdb_path ${hace2_ignored_pdb}
        --input_probe_pdb_path ${hace2_cmip_pdb}
        --input_json_box_path ${hace2_box_json}
        --input_json_external_box_path ${complex_box_json}
        --output_log_path ${hace2_energies_log}
        --output_byat_path ${hace2_byat_out}
        --output_json_box_path ${hace2_energies_box_json}
        --output_json_external_box_path ${complex_2_energies_box_json}
    target:
      kind: local

edges:
  - source: artifact-structure
    source_output: structure
    target: fetch_pdb_lysozyme
    target_input: structure

  - source: artifact-pdb_id
    source_output: pdb_id
    target: fetch_pdb_lysozyme
    target_input: pdb_id

  - source: artifact-titration_waters
    source_output: titration_waters
    target: cmip_titration_lysozyme
    target_input: titration_waters

  - source: artifact-titration_ions
    source_output: titration_ions
    target: cmip_titration_lysozyme
    target_input: titration_ions

  # Protein MIP pipeline
  - source: fetch_pdb_lysozyme
    source_output: downloaded_pdb_lysozyme
    target: cmip_prepare_pdb_lysozyme
    target_input: downloaded_pdb_lysozyme

  - source: cmip_prepare_pdb_lysozyme
    source_output: cmip_pdb_lysozyme
    target: cmip_titration_lysozyme
    target_input: cmip_pdb_lysozyme

  - source: cmip_prepare_pdb_lysozyme
    source_output: cmip_pdb_lysozyme
    target: cat_pdb_titration
    target_input: cmip_pdb_lysozyme

  - source: cmip_prepare_pdb_lysozyme
    source_output: cmip_pdb_lysozyme
    target: cmip_run_mip_pos
    target_input: cmip_pdb_lysozyme

  - source: cmip_prepare_pdb_lysozyme
    source_output: cmip_pdb_lysozyme
    target: cmip_run_mip_neg
    target_input: cmip_pdb_lysozyme

  - source: cmip_prepare_pdb_lysozyme
    source_output: cmip_pdb_lysozyme
    target: cmip_run_mip_neutral
    target_input: cmip_pdb_lysozyme

  - source: cmip_titration_lysozyme
    source_output: wat_ions_pdb
    target: cat_pdb_titration
    target_input: wat_ions_pdb

  # Ordering-only: cases 2 and 3 share no data with case 1, so without these
  # they sit outside the trigger task's downstream scope and are never scheduled.
  - source: fetch_pdb_lysozyme
    target: fetch_pdb_complex

  - source: fetch_pdb_lysozyme
    target: cmip_prepare_structure_md

  # Protein-ligand pipeline
  - source: artifact-complex_pdb_id
    source_output: complex_pdb_id
    target: fetch_pdb_complex
    target_input: complex_pdb_id

  - source: artifact-complex_ligand
    source_output: complex_ligand
    target: extract_heteroatoms
    target_input: complex_ligand

  - source: artifact-complex_ligand
    source_output: complex_ligand
    target: acpype_params_ac
    target_input: complex_ligand

  - source: artifact-complex_ligand_charge
    source_output: complex_ligand_charge
    target: acpype_params_ac
    target_input: complex_ligand_charge

  - source: artifact-complex_ligand
    source_output: complex_ligand
    target: remove_ligand
    target_input: complex_ligand

  - source: artifact-complex_ligand
    source_output: complex_ligand
    target: cmip_ignore_residues_protein
    target_input: complex_ligand

  - source: fetch_pdb_complex
    source_output: complex_pdb
    target: remove_pdb_water
    target_input: complex_pdb

  - source: remove_pdb_water
    source_output: nohoh_pdb
    target: extract_heteroatoms
    target_input: nohoh_pdb

  - source: remove_pdb_water
    source_output: nohoh_pdb
    target: leap_gen_top
    target_input: nohoh_pdb

  - source: extract_heteroatoms
    source_output: ligand_pdb
    target: reduce_add_hydrogens
    target_input: ligand_pdb

  - source: reduce_add_hydrogens
    source_output: ligand_h_pdb
    target: acpype_params_ac
    target_input: ligand_h_pdb

  - source: acpype_params_ac
    source_output: acpype_lib
    target: leap_gen_top
    target_input: acpype_lib

  - source: acpype_params_ac
    source_output: acpype_frcmod
    target: leap_gen_top
    target_input: acpype_frcmod

  - source: leap_gen_top
    source_output: system_top
    target: sander_mdrun
    target_input: system_top

  - source: leap_gen_top
    source_output: system_crd
    target: sander_mdrun
    target_input: system_crd

  - source: leap_gen_top
    source_output: system_top
    target: amber_to_pdb
    target_input: system_top

  - source: sander_mdrun
    source_output: amber_rst
    target: amber_to_pdb
    target_input: amber_rst

  - source: amber_to_pdb
    source_output: min_pdb
    target: cmip_prepare_structure_complex
    target_input: min_pdb

  - source: leap_gen_top
    source_output: system_top
    target: cmip_prepare_structure_complex
    target_input: system_top

  - source: cmip_prepare_structure_complex
    source_output: cmip_complex_pdb
    target: remove_ligand
    target_input: cmip_complex_pdb

  - source: cmip_prepare_structure_complex
    source_output: cmip_complex_pdb
    target: cmip_ignore_residues_protein
    target_input: cmip_complex_pdb

  - source: remove_ligand
    source_output: no_lig_pdb
    target: cmip_run_egfr_interaction
    target_input: no_lig_pdb

  - source: cmip_ignore_residues_protein
    source_output: prot_ignored_pdb
    target: cmip_run_egfr_interaction
    target_input: prot_ignored_pdb

  # Protein-protein pipeline
  - source: cmip_prepare_structure_md
    source_output: md_cmip_pdb
    target: extract_chain_hace2
    target_input: md_cmip_pdb

  - source: cmip_prepare_structure_md
    source_output: md_cmip_pdb
    target: extract_chain_rbd
    target_input: md_cmip_pdb

  - source: cmip_prepare_structure_md
    source_output: md_cmip_pdb
    target: cmip_run_complex_box
    target_input: md_cmip_pdb

  - source: cmip_prepare_structure_md
    source_output: md_cmip_pdb
    target: cmip_ignore_residues_rbd
    target_input: md_cmip_pdb

  - source: cmip_prepare_structure_md
    source_output: md_cmip_pdb
    target: cmip_ignore_residues_hace2
    target_input: md_cmip_pdb

  - source: extract_chain_hace2
    source_output: hace2_cmip_pdb
    target: cmip_run_hace2_box
    target_input: hace2_cmip_pdb

  - source: extract_chain_hace2
    source_output: hace2_cmip_pdb
    target: cmip_run_hace2_interaction
    target_input: hace2_cmip_pdb

  - source: extract_chain_rbd
    source_output: rbd_cmip_pdb
    target: cmip_run_rbd_box
    target_input: rbd_cmip_pdb

  - source: extract_chain_rbd
    source_output: rbd_cmip_pdb
    target: cmip_run_rbd_interaction
    target_input: rbd_cmip_pdb

  - source: cmip_run_rbd_box
    source_output: rbd_box_json
    target: cmip_run_rbd_interaction
    target_input: rbd_box_json

  - source: cmip_run_hace2_box
    source_output: hace2_box_json
    target: cmip_run_hace2_interaction
    target_input: hace2_box_json

  - source: cmip_run_complex_box
    source_output: complex_box_json
    target: cmip_run_rbd_interaction
    target_input: complex_box_json

  - source: cmip_run_complex_box
    source_output: complex_box_json
    target: cmip_run_hace2_interaction
    target_input: complex_box_json

  - source: cmip_ignore_residues_rbd
    source_output: rbd_ignored_pdb
    target: cmip_run_rbd_interaction
    target_input: rbd_ignored_pdb

  - source: cmip_ignore_residues_hace2
    source_output: hace2_ignored_pdb
    target: cmip_run_hace2_interaction
    target_input: hace2_ignored_pdb

  - source: artifact-md_pdb
    source_output: md_pdb
    target: cmip_prepare_structure_md
    target_input: md_pdb

  - source: artifact-md_top
    source_output: md_top
    target: cmip_prepare_structure_md
    target_input: md_top

  - source: artifact-partner_a_chain
    source_output: partner_a_chain
    target: extract_chain_hace2
    target_input: partner_a_chain

  - source: artifact-partner_a_chain
    source_output: partner_a_chain
    target: cmip_ignore_residues_hace2
    target_input: partner_a_chain

  - source: artifact-partner_b_chain
    source_output: partner_b_chain
    target: extract_chain_rbd
    target_input: partner_b_chain

  - source: artifact-partner_b_chain
    source_output: partner_b_chain
    target: cmip_ignore_residues_rbd
    target_input: partner_b_chain

  - source: artifact-cmip_run_complex_box_config
    source_output: cmip_run_complex_box_config
    target: cmip_run_complex_box
