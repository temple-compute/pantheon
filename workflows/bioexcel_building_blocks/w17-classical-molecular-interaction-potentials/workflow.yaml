kind: horus_workflow
name: BioExcel CMIP - Classical Molecular Interaction Potentials

_executor: &executor
  kind: conda_python_environment
  environment_dir: "../.horus_conda_env"
  conda: micromamba
  environment_file: conda_env.yaml

_docker_executor_amber: &docker_executor_amber
  kind: docker
  image: quay.io/biocontainers/biobb_amber:5.2.1--py312hc5e4ab4_0

_docker_executor_cmip: &docker_executor_cmip
  kind: docker
  image: quay.io/biocontainers/biobb_cmip:5.2.3--pyhdfd78af_0

artifacts:
  - id: md_pdb
    name: RBD-hACE2 MD structure
    description: Pre-run AMBER MD structure of the RBD-hACE2 complex, bundled with the workflow (not generated by it).
    kind: file
    path: Files/RBD-hACE2-ZN.pdb

  - id: md_top
    name: RBD-hACE2 MD topology
    description: Pre-run AMBER topology of the RBD-hACE2 complex, bundled with the workflow (not generated by it).
    kind: file
    path: Files/RBD-hACE2-ZN.top

  - id: acpype_params_ac_config
    name: Ligand parameterization config
    kind: file
    path: configs/acpype_params_ac.yaml

  - id: cmip_ignore_residues_hace2_config
    name: hACE2 masking config
    kind: file
    path: configs/cmip_ignore_residues_hace2.yaml

  - id: cmip_ignore_residues_protein_config
    name: EGFR protein masking config
    kind: file
    path: configs/cmip_ignore_residues_protein.yaml

  - id: cmip_ignore_residues_rbd_config
    name: RBD masking config
    kind: file
    path: configs/cmip_ignore_residues_rbd.yaml

  - id: cmip_run_complex_box_config
    name: Complex grid box config
    kind: file
    path: configs/cmip_run_complex_box.yaml

  - id: cmip_run_egfr_interaction_config
    name: EGFR interaction config
    kind: file
    path: configs/cmip_run_egfr_interaction.yaml

  - id: cmip_run_hace2_box_config
    name: hACE2 grid box config
    kind: file
    path: configs/cmip_run_hace2_box.yaml

  - id: cmip_run_hace2_interaction_config
    name: hACE2 interaction config
    kind: file
    path: configs/cmip_run_hace2_interaction.yaml

  - id: cmip_run_mip_neg_config
    name: Negative MIP config
    kind: file
    path: configs/cmip_run_mip_neg.yaml

  - id: cmip_run_mip_neutral_config
    name: Neutral MIP config
    kind: file
    path: configs/cmip_run_mip_neutral.yaml

  - id: cmip_run_mip_pos_config
    name: Positive MIP config
    kind: file
    path: configs/cmip_run_mip_pos.yaml

  - id: cmip_run_rbd_box_config
    name: RBD grid box config
    kind: file
    path: configs/cmip_run_rbd_box.yaml

  - id: cmip_run_rbd_interaction_config
    name: RBD interaction config
    kind: file
    path: configs/cmip_run_rbd_interaction.yaml

  - id: cmip_titration_lysozyme_config
    name: Lysozyme titration config
    kind: file
    path: configs/cmip_titration_lysozyme.yaml

  - id: extract_chain_hace2_config
    name: hACE2 chain extraction config
    kind: file
    path: configs/extract_chain_hace2.yaml

  - id: extract_chain_rbd_config
    name: RBD chain extraction config
    kind: file
    path: configs/extract_chain_rbd.yaml

  - id: extract_heteroatoms_config
    name: Ligand extraction config
    kind: file
    path: configs/extract_heteroatoms.yaml

  - id: fetch_pdb_complex_config
    name: EGFR complex fetch config
    description: Configuration setting the PDB code (4HJO) for the EGFR-Erlotinib complex.
    kind: file
    path: configs/fetch_pdb_complex.yaml

  - id: fetch_pdb_lysozyme_config
    name: Lysozyme fetch config
    description: Configuration setting the PDB code (1AKI) for the Lysozyme structure.
    kind: file
    path: configs/fetch_pdb_lysozyme.yaml

  - id: leap_gen_top_config
    name: AMBER topology config
    description: Configuration controlling tleap generation of the AMBER system topology for the EGFR-Erlotinib complex.
    kind: file
    path: configs/leap_gen_top.yaml

  - id: remove_ligand_config
    name: Ligand removal config
    kind: file
    path: configs/remove_ligand.yaml

  - id: sander_mdrun_config
    name: AMBER minimization config
    description: Configuration controlling AMBER sander energy minimization parameters.
    kind: file
    path: configs/sander_mdrun.yaml

tasks:
  # ── Section 1: Lysozyme MIPs ──────────────────────────────────────────────

  - kind: horus_task
    id: fetch_pdb_lysozyme
    name: Download 1AKI Lysozyme structure from PDB
    description: Downloads the Lysozyme structure (PDB 1AKI) from the RCSB.
    inputs:
      - id: fetch_pdb_lysozyme_config
        name: Lysozyme fetch config
        kind: file
        path: configs/fetch_pdb_lysozyme.yaml
    outputs:
      - id: downloaded_pdb_lysozyme
        name: Lysozyme structure (1AKI)
        kind: file
        path: results/1aki.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        pdb
        --config ${fetch_pdb_lysozyme_config}
        --output_pdb_path ${downloaded_pdb_lysozyme}
    target:
      kind: local

  - kind: horus_task
    id: cmip_prepare_pdb_lysozyme
    name: Prepare Lysozyme PDB for CMIP (add charges and elements)
    description: Assigns CMIP charges and element types to the Lysozyme structure using cmip_prepare_pdb.
    inputs:
      - id: downloaded_pdb_lysozyme
        name: Lysozyme structure (1AKI)
        kind: file
        path: results/1aki.pdb
    outputs:
      - id: cmip_pdb_lysozyme
        name: Lysozyme CMIP-ready structure
        kind: file
        path: results/1aki.cmip.pdb
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_prepare_pdb
        --input_pdb_path ${downloaded_pdb_lysozyme}
        --output_cmip_pdb_path ${cmip_pdb_lysozyme}
    target:
      kind: local

  - kind: horus_task
    id: cmip_titration_lysozyme
    name: Compute structural water molecules and ion positions (titration)
    description: Runs CMIP titration to predict structural water and ion positions on the Lysozyme structure.
    inputs:
      - id: cmip_titration_lysozyme_config
        name: Lysozyme titration config
        kind: file
        path: configs/cmip_titration_lysozyme.yaml
      - id: cmip_pdb_lysozyme
        name: Lysozyme CMIP-ready structure
        kind: file
        path: results/1aki.cmip.pdb
    outputs:
      - id: wat_ions_pdb
        name: Structural waters/ions
        kind: file
        path: results/1aki.wat_ions.pdb
      - id: wat_ions_log
        name: Titration log
        kind: file
        path: results/1aki.wat_ions.log
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_titration
        --config ${cmip_titration_lysozyme_config}
        --input_pdb_path ${cmip_pdb_lysozyme}
        --output_pdb_path ${wat_ions_pdb}
        --output_log_path ${wat_ions_log}
    target:
      kind: local

  - kind: horus_task
    id: cat_pdb_titration
    name: Add structural water molecules and ions to Lysozyme PDB
    description: Merges the predicted structural waters/ions into the Lysozyme structure using cat_pdb.
    inputs:
      - id: cmip_pdb_lysozyme
        name: Lysozyme CMIP-ready structure
        kind: file
        path: results/1aki.cmip.pdb
      - id: wat_ions_pdb
        name: Structural waters/ions
        kind: file
        path: results/1aki.wat_ions.pdb
    outputs:
      - id: tit_pdb
        name: Lysozyme structure with titration
        kind: file
        path: results/1aki.tit.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        cat_pdb
        --input_structure1 ${cmip_pdb_lysozyme}
        --input_structure2 ${wat_ions_pdb}
        --output_structure_path ${tit_pdb}
    target:
      kind: local

  - kind: horus_task
    id: cmip_run_mip_pos
    name: Compute positive Molecular Interaction Potential (MIP+)
    description: Runs CMIP with a positive probe charge to compute the MIP grid over the Lysozyme structure.
    inputs:
      - id: cmip_run_mip_pos_config
        name: Positive MIP config
        kind: file
        path: configs/cmip_run_mip_pos.yaml
      - id: cmip_pdb_lysozyme
        name: Lysozyme CMIP-ready structure
        kind: file
        path: results/1aki.cmip.pdb
    outputs:
      - id: mip_pos_log
        name: Positive MIP log
        kind: file
        path: results/1aki.mip_pos.log
      - id: mip_pos_cube
        name: Positive MIP grid (cube)
        kind: file
        path: results/1aki.mip_pos.cube
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_run
        --config ${cmip_run_mip_pos_config}
        --input_pdb_path ${cmip_pdb_lysozyme}
        --output_log_path ${mip_pos_log}
        --output_cube_path ${mip_pos_cube}
    target:
      kind: local

  - kind: horus_task
    id: cmip_run_mip_neg
    name: Compute negative Molecular Interaction Potential (MIP-)
    description: Runs CMIP with a negative probe charge to compute the MIP grid over the Lysozyme structure.
    inputs:
      - id: cmip_run_mip_neg_config
        name: Negative MIP config
        kind: file
        path: configs/cmip_run_mip_neg.yaml
      - id: cmip_pdb_lysozyme
        name: Lysozyme CMIP-ready structure
        kind: file
        path: results/1aki.cmip.pdb
    outputs:
      - id: mip_neg_log
        name: Negative MIP log
        kind: file
        path: results/1aki.mip_neg.log
      - id: mip_neg_cube
        name: Negative MIP grid (cube)
        kind: file
        path: results/1aki.mip_neg.cube
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_run
        --config ${cmip_run_mip_neg_config}
        --input_pdb_path ${cmip_pdb_lysozyme}
        --output_log_path ${mip_neg_log}
        --output_cube_path ${mip_neg_cube}
    target:
      kind: local

  - kind: horus_task
    id: cmip_run_mip_neutral
    name: Compute neutral Molecular Interaction Potential (MIPn)
    description: Runs CMIP with an uncharged probe to compute the van der Waals MIP grid over the Lysozyme structure.
    inputs:
      - id: cmip_run_mip_neutral_config
        name: Neutral MIP config
        kind: file
        path: configs/cmip_run_mip_neutral.yaml
      - id: cmip_pdb_lysozyme
        name: Lysozyme CMIP-ready structure
        kind: file
        path: results/1aki.cmip.pdb
    outputs:
      - id: mip_neutral_log
        name: Neutral MIP log
        kind: file
        path: results/1aki.mip_neutral.log
      - id: mip_neutral_cube
        name: Neutral MIP grid (cube)
        kind: file
        path: results/1aki.mip_neutral.cube
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_run
        --config ${cmip_run_mip_neutral_config}
        --input_pdb_path ${cmip_pdb_lysozyme}
        --output_log_path ${mip_neutral_log}
        --output_cube_path ${mip_neutral_cube}
    target:
      kind: local

  # ── Section 2: Protein-Ligand Interaction Energies (EGFR + Erlotinib) ────

  - kind: horus_task
    id: fetch_pdb_complex
    name: Download 4HJO EGFR-Erlotinib complex structure from PDB
    description: Downloads the EGFR kinase domain bound to Erlotinib (PDB 4HJO) from the RCSB.
    inputs:
      - id: fetch_pdb_complex_config
        name: EGFR complex fetch config
        kind: file
        path: configs/fetch_pdb_complex.yaml
    outputs:
      - id: complex_pdb
        name: EGFR-Erlotinib complex structure (4HJO)
        kind: file
        path: results/4hjo.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        pdb
        --config ${fetch_pdb_complex_config}
        --output_pdb_path ${complex_pdb}
    target:
      kind: local

  - kind: horus_task
    id: remove_pdb_water
    name: Remove water molecules from EGFR complex structure
    description: Strips crystallographic water molecules (HOH) from the EGFR-Erlotinib complex.
    inputs:
      - id: complex_pdb
        name: EGFR-Erlotinib complex structure (4HJO)
        kind: file
        path: results/4hjo.pdb
    outputs:
      - id: nohoh_pdb
        name: EGFR complex without water
        kind: file
        path: results/4hjo.noHOH.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        remove_pdb_water
        --input_pdb_path ${complex_pdb}
        --output_pdb_path ${nohoh_pdb}
    target:
      kind: local

  - kind: horus_task
    id: extract_heteroatoms
    name: Extract Erlotinib (AQ4) ligand from complex
    description: Extracts the Erlotinib (AQ4) heteroatom ligand from the EGFR complex structure.
    inputs:
      - id: extract_heteroatoms_config
        name: Ligand extraction config
        kind: file
        path: configs/extract_heteroatoms.yaml
      - id: nohoh_pdb
        name: EGFR complex without water
        kind: file
        path: results/4hjo.noHOH.pdb
    outputs:
      - id: ligand_pdb
        name: Erlotinib ligand (AQ4)
        kind: file
        path: results/AQ4.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        extract_heteroatoms
        --config ${extract_heteroatoms_config}
        --input_structure_path ${nohoh_pdb}
        --output_heteroatom_path ${ligand_pdb}
    target:
      kind: local

  - kind: horus_task
    id: reduce_add_hydrogens
    name: Add hydrogen atoms to Erlotinib ligand
    description: Adds explicit hydrogen atoms to the Erlotinib ligand using reduce.
    inputs:
      - id: ligand_pdb
        name: Erlotinib ligand (AQ4)
        kind: file
        path: results/AQ4.pdb
    outputs:
      - id: ligand_h_pdb
        name: Erlotinib ligand with hydrogens
        kind: file
        path: results/AQ4.reduce.H.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        reduce_add_hydrogens
        --input_path ${ligand_pdb}
        --output_path ${ligand_h_pdb}
    target:
      kind: local

  - kind: horus_task
    id: acpype_params_ac
    name: Generate AMBER topology parameters for Erlotinib ligand (ACPype)
    description: Generates GAFF/AMBER force field parameters for the Erlotinib ligand using ACPype.
    inputs:
      - id: acpype_params_ac_config
        name: Ligand parameterization config
        kind: file
        path: configs/acpype_params_ac.yaml
      - id: ligand_h_pdb
        name: Erlotinib ligand with hydrogens
        kind: file
        path: results/AQ4.reduce.H.pdb
    outputs:
      - id: acpype_inpcrd
        name: Ligand AMBER coordinates
        kind: file
        path: results/AQ4params.inpcrd
      - id: acpype_frcmod
        name: Ligand force field modifications
        kind: file
        path: results/AQ4params.frcmod
      - id: acpype_lib
        name: Ligand AMBER library
        kind: file
        path: results/AQ4params.lib
      - id: acpype_prmtop
        name: Ligand AMBER topology
        kind: file
        path: results/AQ4params.prmtop
    executor: *executor
    runtime:
      kind: command
      command: >-
        acpype_params_ac
        --config ${acpype_params_ac_config}
        --input_path ${ligand_h_pdb}
        --output_path_inpcrd ${acpype_inpcrd}
        --output_path_frcmod ${acpype_frcmod}
        --output_path_lib ${acpype_lib}
        --output_path_prmtop ${acpype_prmtop}
    target:
      kind: local

  - kind: horus_task
    id: leap_gen_top
    name: Generate AMBER system topology for EGFR-Erlotinib complex (tleap)
    description: Builds the AMBER topology and coordinates for the full EGFR-Erlotinib complex using tleap, incorporating the ligand parameters.
    inputs:
      - id: leap_gen_top_config
        name: AMBER topology config
        kind: file
        path: configs/leap_gen_top.yaml
      - id: nohoh_pdb
        name: EGFR complex without water
        kind: file
        path: results/4hjo.noHOH.pdb
      - id: acpype_lib
        name: Ligand AMBER library
        kind: file
        path: results/AQ4params.lib
      - id: acpype_frcmod
        name: Ligand force field modifications
        kind: file
        path: results/AQ4params.frcmod
    outputs:
      - id: system_pdb
        name: EGFR system structure (tleap)
        kind: file
        path: results/structure.leap.pdb
      - id: system_top
        name: EGFR system topology
        kind: file
        path: results/structure.leap.prmtop
      - id: system_crd
        name: EGFR system coordinates
        kind: file
        path: results/structure.leap.crd
    executor: *docker_executor_amber
    runtime:
      kind: command
      command: >-
        leap_gen_top
        --config ${leap_gen_top_config}
        --input_pdb_path ${nohoh_pdb}
        --input_lib_path ${acpype_lib}
        --input_frcmod_path ${acpype_frcmod}
        --output_pdb_path ${system_pdb}
        --output_top_path ${system_top}
        --output_crd_path ${system_crd}
    target:
      kind: local

  - kind: horus_task
    id: sander_mdrun
    name: Energy minimization of EGFR-Erlotinib complex (AMBER sander)
    description: Runs AMBER sander energy minimization on the EGFR-Erlotinib system topology.
    inputs:
      - id: sander_mdrun_config
        name: AMBER minimization config
        kind: file
        path: configs/sander_mdrun.yaml
      - id: system_top
        name: EGFR system topology
        kind: file
        path: results/structure.leap.prmtop
      - id: system_crd
        name: EGFR system coordinates
        kind: file
        path: results/structure.leap.crd
    outputs:
      - id: amber_traj
        name: AMBER minimization trajectory
        kind: file
        path: results/structure.amber.crd
      - id: amber_rst
        name: AMBER minimization restart
        kind: file
        path: results/structure.amber.rst
      - id: amber_log
        name: AMBER minimization log
        kind: file
        path: results/structure.amber.log
    executor: *docker_executor_amber
    runtime:
      kind: command
      command: >-
        sander_mdrun
        --config ${sander_mdrun_config}
        --input_top_path ${system_top}
        --input_crd_path ${system_crd}
        --output_traj_path ${amber_traj}
        --output_rst_path ${amber_rst}
        --output_log_path ${amber_log}
    target:
      kind: local

  - kind: horus_task
    id: amber_to_pdb
    name: Convert minimized AMBER restart to PDB
    description: Converts the minimized AMBER restart coordinates back to PDB format using the system topology.
    inputs:
      - id: system_top
        name: EGFR system topology
        kind: file
        path: results/structure.leap.prmtop
      - id: amber_rst
        name: AMBER minimization restart
        kind: file
        path: results/structure.amber.rst
    outputs:
      - id: min_pdb
        name: Minimized EGFR complex structure
        kind: file
        path: results/structure.amber-min.pdb
    executor: *docker_executor_amber
    runtime:
      kind: command
      command: >-
        amber_to_pdb
        --input_top_path ${system_top}
        --input_crd_path ${amber_rst}
        --output_pdb_path ${min_pdb}
    target:
      kind: local

  - kind: horus_task
    id: cmip_prepare_structure_complex
    name: Prepare EGFR-Erlotinib complex for CMIP using AMBER topology charges
    description: Transfers AMBER partial charges from the system topology onto the minimized complex structure for CMIP.
    inputs:
      - id: min_pdb
        name: Minimized EGFR complex structure
        kind: file
        path: results/structure.amber-min.pdb
      - id: system_top
        name: EGFR system topology
        kind: file
        path: results/structure.leap.prmtop
    outputs:
      - id: cmip_complex_pdb
        name: EGFR complex CMIP-ready structure
        kind: file
        path: results/4hjo.cmip.pdb
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_prepare_structure
        --input_pdb_path ${min_pdb}
        --input_topology_path ${system_top}
        --output_cmip_pdb_path ${cmip_complex_pdb}
    target:
      kind: local

  - kind: horus_task
    id: remove_ligand
    name: Extract isolated EGFR protein structure (remove Erlotinib)
    description: Removes the Erlotinib ligand from the CMIP-ready complex to leave the isolated EGFR protein.
    inputs:
      - id: remove_ligand_config
        name: Ligand removal config
        kind: file
        path: configs/remove_ligand.yaml
      - id: cmip_complex_pdb
        name: EGFR complex CMIP-ready structure
        kind: file
        path: results/4hjo.cmip.pdb
    outputs:
      - id: no_lig_pdb
        name: Isolated EGFR protein structure
        kind: file
        path: results/4hjo.noLIG.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        remove_ligand
        --config ${remove_ligand_config}
        --input_structure_path ${cmip_complex_pdb}
        --output_structure_path ${no_lig_pdb}
    target:
      kind: local

  - kind: horus_task
    id: cmip_ignore_residues_protein
    name: Mark EGFR protein residues as dielectric for CMIP interaction
    description: Flags the EGFR protein residues to be excluded from self-interaction so CMIP computes only ligand-protein energies.
    inputs:
      - id: cmip_ignore_residues_protein_config
        name: EGFR protein masking config
        kind: file
        path: configs/cmip_ignore_residues_protein.yaml
      - id: cmip_complex_pdb
        name: EGFR complex CMIP-ready structure
        kind: file
        path: results/4hjo.cmip.pdb
    outputs:
      - id: prot_ignored_pdb
        name: EGFR complex with protein masked
        kind: file
        path: results/4hjo.Prot_ignored.cmip.pdb
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_ignore_residues
        --config ${cmip_ignore_residues_protein_config}
        --input_cmip_pdb_path ${cmip_complex_pdb}
        --output_cmip_pdb_path ${prot_ignored_pdb}
    target:
      kind: local

  - kind: horus_task
    id: cmip_run_egfr_interaction
    name: Compute EGFR-Erlotinib protein-ligand interaction energies
    description: Runs CMIP with the Erlotinib ligand as probe against the masked EGFR protein to compute interaction energies.
    inputs:
      - id: cmip_run_egfr_interaction_config
        name: EGFR interaction config
        kind: file
        path: configs/cmip_run_egfr_interaction.yaml
      - id: prot_ignored_pdb
        name: EGFR complex with protein masked
        kind: file
        path: results/4hjo.Prot_ignored.cmip.pdb
      - id: no_lig_pdb
        name: Isolated EGFR protein structure
        kind: file
        path: results/4hjo.noLIG.pdb
    outputs:
      - id: egfr_energies_log
        name: EGFR-Erlotinib interaction energies log
        kind: file
        path: results/4hjo.EGFR.energies.log
      - id: egfr_byat_out
        name: EGFR-Erlotinib per-atom energies
        kind: file
        path: results/4hjo.EGFR.ener.byat.out
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_run
        --config ${cmip_run_egfr_interaction_config}
        --input_pdb_path ${prot_ignored_pdb}
        --input_probe_pdb_path ${no_lig_pdb}
        --output_log_path ${egfr_energies_log}
        --output_byat_path ${egfr_byat_out}
    target:
      kind: local

  # ── Section 3: Protein-Protein Interaction Energies (RBD + hACE2) ─────────

  - kind: horus_task
    id: cmip_prepare_structure_md
    name: Prepare RBD-hACE2 MD structure for CMIP using MD topology charges
    description: Transfers AMBER partial charges from the pre-run MD topology onto the RBD-hACE2 structure for CMIP.
    inputs:
      - id: md_pdb
        name: RBD-hACE2 MD structure
        kind: file
        path: Files/RBD-hACE2-ZN.pdb
      - id: md_top
        name: RBD-hACE2 MD topology
        kind: file
        path: Files/RBD-hACE2-ZN.top
    outputs:
      - id: md_cmip_pdb
        name: RBD-hACE2 CMIP-ready structure
        kind: file
        path: results/RBD-hACE2-ZN.cmip.pdb
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_prepare_structure
        --input_pdb_path ${md_pdb}
        --input_topology_path ${md_top}
        --output_cmip_pdb_path ${md_cmip_pdb}
    target:
      kind: local

  - kind: horus_task
    id: extract_chain_hace2
    name: Extract hACE2 chain A from RBD-hACE2 complex
    description: Splits out chain A (hACE2) from the RBD-hACE2 complex using extract_chain.
    inputs:
      - id: extract_chain_hace2_config
        name: hACE2 chain extraction config
        kind: file
        path: configs/extract_chain_hace2.yaml
      - id: md_cmip_pdb
        name: RBD-hACE2 CMIP-ready structure
        kind: file
        path: results/RBD-hACE2-ZN.cmip.pdb
    outputs:
      - id: hace2_cmip_pdb
        name: hACE2 chain structure
        kind: file
        path: results/RBD-hACE2-ZN.hACE2.cmip.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        extract_chain
        --config ${extract_chain_hace2_config}
        --input_structure_path ${md_cmip_pdb}
        --output_structure_path ${hace2_cmip_pdb}
    target:
      kind: local

  - kind: horus_task
    id: extract_chain_rbd
    name: Extract RBD chain B from RBD-hACE2 complex
    description: Splits out chain B (RBD) from the RBD-hACE2 complex using extract_chain.
    inputs:
      - id: extract_chain_rbd_config
        name: RBD chain extraction config
        kind: file
        path: configs/extract_chain_rbd.yaml
      - id: md_cmip_pdb
        name: RBD-hACE2 CMIP-ready structure
        kind: file
        path: results/RBD-hACE2-ZN.cmip.pdb
    outputs:
      - id: rbd_cmip_pdb
        name: RBD chain structure
        kind: file
        path: results/RBD-hACE2-ZN.RBD.cmip.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        extract_chain
        --config ${extract_chain_rbd_config}
        --input_structure_path ${md_cmip_pdb}
        --output_structure_path ${rbd_cmip_pdb}
    target:
      kind: local

  - kind: horus_task
    id: cmip_run_rbd_box
    name: Compute 3D grid box enclosing the RBD monomer
    description: Runs CMIP in box-only mode to derive the grid dimensions enclosing the RBD monomer.
    inputs:
      - id: cmip_run_rbd_box_config
        name: RBD grid box config
        kind: file
        path: configs/cmip_run_rbd_box.yaml
      - id: rbd_cmip_pdb
        name: RBD chain structure
        kind: file
        path: results/RBD-hACE2-ZN.RBD.cmip.pdb
    outputs:
      - id: rbd_box_log
        name: RBD grid box log
        kind: file
        path: results/RBD.box.log
      - id: rbd_box_json
        name: RBD grid box definition
        kind: file
        path: results/RBD.box.json
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_run
        --config ${cmip_run_rbd_box_config}
        --input_pdb_path ${rbd_cmip_pdb}
        --output_log_path ${rbd_box_log}
        --output_json_box_path ${rbd_box_json}
    target:
      kind: local

  - kind: horus_task
    id: cmip_run_hace2_box
    name: Compute 3D grid box enclosing the hACE2 monomer
    description: Runs CMIP in box-only mode to derive the grid dimensions enclosing the hACE2 monomer.
    inputs:
      - id: cmip_run_hace2_box_config
        name: hACE2 grid box config
        kind: file
        path: configs/cmip_run_hace2_box.yaml
      - id: hace2_cmip_pdb
        name: hACE2 chain structure
        kind: file
        path: results/RBD-hACE2-ZN.hACE2.cmip.pdb
    outputs:
      - id: hace2_box_log
        name: hACE2 grid box log
        kind: file
        path: results/hACE2.box.log
      - id: hace2_box_json
        name: hACE2 grid box definition
        kind: file
        path: results/hACE2.box.json
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_run
        --config ${cmip_run_hace2_box_config}
        --input_pdb_path ${hace2_cmip_pdb}
        --output_log_path ${hace2_box_log}
        --output_json_box_path ${hace2_box_json}
    target:
      kind: local

  - kind: horus_task
    id: cmip_run_complex_box
    name: Compute 3D grid box enclosing the RBD-hACE2 complex
    description: Runs CMIP in box-only mode to derive the grid dimensions enclosing the full RBD-hACE2 complex.
    inputs:
      - id: cmip_run_complex_box_config
        name: Complex grid box config
        kind: file
        path: configs/cmip_run_complex_box.yaml
      - id: md_cmip_pdb
        name: RBD-hACE2 CMIP-ready structure
        kind: file
        path: results/RBD-hACE2-ZN.cmip.pdb
    outputs:
      - id: complex_box_log
        name: Complex grid box log
        kind: file
        path: results/COMPLEX.box.log
      - id: complex_box_json
        name: Complex grid box definition
        kind: file
        path: results/COMPLEX.box.json
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_run
        --config ${cmip_run_complex_box_config}
        --input_pdb_path ${md_cmip_pdb}
        --output_log_path ${complex_box_log}
        --output_json_box_path ${complex_box_json}
    target:
      kind: local

  - kind: horus_task
    id: cmip_ignore_residues_rbd
    name: Mark RBD residues (chain B) as dielectric for CMIP
    description: Flags the RBD chain residues to be excluded from self-interaction so CMIP computes only RBD-hACE2 cross energies.
    inputs:
      - id: cmip_ignore_residues_rbd_config
        name: RBD masking config
        kind: file
        path: configs/cmip_ignore_residues_rbd.yaml
      - id: md_cmip_pdb
        name: RBD-hACE2 CMIP-ready structure
        kind: file
        path: results/RBD-hACE2-ZN.cmip.pdb
    outputs:
      - id: rbd_ignored_pdb
        name: RBD-hACE2 structure with RBD masked
        kind: file
        path: results/RBD-hACE2-ZN.RBD_ignored.cmip.pdb
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_ignore_residues
        --config ${cmip_ignore_residues_rbd_config}
        --input_cmip_pdb_path ${md_cmip_pdb}
        --output_cmip_pdb_path ${rbd_ignored_pdb}
    target:
      kind: local

  - kind: horus_task
    id: cmip_run_rbd_interaction
    name: Compute RBD protein-protein interaction energies with hACE2
    description: Runs CMIP with the RBD chain as probe against the masked RBD-hACE2 complex to compute RBD-hACE2 interaction energies.
    inputs:
      - id: cmip_run_rbd_interaction_config
        name: RBD interaction config
        kind: file
        path: configs/cmip_run_rbd_interaction.yaml
      - id: rbd_ignored_pdb
        name: RBD-hACE2 structure with RBD masked
        kind: file
        path: results/RBD-hACE2-ZN.RBD_ignored.cmip.pdb
      - id: rbd_cmip_pdb
        name: RBD chain structure
        kind: file
        path: results/RBD-hACE2-ZN.RBD.cmip.pdb
      - id: rbd_box_json
        name: RBD grid box definition
        kind: file
        path: results/RBD.box.json
      - id: complex_box_json
        name: Complex grid box definition
        kind: file
        path: results/COMPLEX.box.json
    outputs:
      - id: rbd_energies_log
        name: RBD-hACE2 interaction energies log
        kind: file
        path: results/RBD.energies.log
      - id: rbd_byat_out
        name: RBD-hACE2 per-atom energies
        kind: file
        path: results/RBD.energies.byat.out
      - id: rbd_energies_box_json
        name: RBD interaction grid box output
        kind: file
        path: results/RBD.energies.box.output.json
      - id: complex_energies_box_json
        name: Complex grid box output (RBD run)
        kind: file
        path: results/COMPLEX.energies.box.output.json
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_run
        --config ${cmip_run_rbd_interaction_config}
        --input_pdb_path ${rbd_ignored_pdb}
        --input_probe_pdb_path ${rbd_cmip_pdb}
        --input_json_box_path ${rbd_box_json}
        --input_json_external_box_path ${complex_box_json}
        --output_log_path ${rbd_energies_log}
        --output_byat_path ${rbd_byat_out}
        --output_json_box_path ${rbd_energies_box_json}
        --output_json_external_box_path ${complex_energies_box_json}
    target:
      kind: local

  - kind: horus_task
    id: cmip_ignore_residues_hace2
    name: Mark hACE2 residues (chain A) as dielectric for CMIP
    description: Flags the hACE2 chain residues to be excluded from self-interaction so CMIP computes only hACE2-RBD cross energies.
    inputs:
      - id: cmip_ignore_residues_hace2_config
        name: hACE2 masking config
        kind: file
        path: configs/cmip_ignore_residues_hace2.yaml
      - id: md_cmip_pdb
        name: RBD-hACE2 CMIP-ready structure
        kind: file
        path: results/RBD-hACE2-ZN.cmip.pdb
    outputs:
      - id: hace2_ignored_pdb
        name: RBD-hACE2 structure with hACE2 masked
        kind: file
        path: results/RBD-hACE2-ZN.hACE2_ign.cmip.pdb
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_ignore_residues
        --config ${cmip_ignore_residues_hace2_config}
        --input_cmip_pdb_path ${md_cmip_pdb}
        --output_cmip_pdb_path ${hace2_ignored_pdb}
    target:
      kind: local

  - kind: horus_task
    id: cmip_run_hace2_interaction
    name: Compute hACE2 protein-protein interaction energies with RBD
    description: Runs CMIP with the hACE2 chain as probe against the masked RBD-hACE2 complex to compute hACE2-RBD interaction energies.
    inputs:
      - id: cmip_run_hace2_interaction_config
        name: hACE2 interaction config
        kind: file
        path: configs/cmip_run_hace2_interaction.yaml
      - id: hace2_ignored_pdb
        name: RBD-hACE2 structure with hACE2 masked
        kind: file
        path: results/RBD-hACE2-ZN.hACE2_ign.cmip.pdb
      - id: hace2_cmip_pdb
        name: hACE2 chain structure
        kind: file
        path: results/RBD-hACE2-ZN.hACE2.cmip.pdb
      - id: hace2_box_json
        name: hACE2 grid box definition
        kind: file
        path: results/hACE2.box.json
      - id: complex_box_json
        name: Complex grid box definition
        kind: file
        path: results/COMPLEX.box.json
    outputs:
      - id: hace2_energies_log
        name: hACE2-RBD interaction energies log
        kind: file
        path: results/hACE2.energies.log
      - id: hace2_byat_out
        name: hACE2-RBD per-atom energies
        kind: file
        path: results/hACE2.energies.byat.out
      - id: hace2_energies_box_json
        name: hACE2 interaction grid box output
        kind: file
        path: results/hACE2.energies.box.output.json
      - id: complex_2_energies_box_json
        name: Complex grid box output (hACE2 run)
        kind: file
        path: results/COMPLEX_2.energies.box.output.json
    executor: *docker_executor_cmip
    runtime:
      kind: command
      command: >-
        cmip_run
        --config ${cmip_run_hace2_interaction_config}
        --input_pdb_path ${hace2_ignored_pdb}
        --input_probe_pdb_path ${hace2_cmip_pdb}
        --input_json_box_path ${hace2_box_json}
        --input_json_external_box_path ${complex_box_json}
        --output_log_path ${hace2_energies_log}
        --output_byat_path ${hace2_byat_out}
        --output_json_box_path ${hace2_energies_box_json}
        --output_json_external_box_path ${complex_2_energies_box_json}
    target:
      kind: local

edges:
  # Lysozyme MIP pipeline
  - source: fetch_pdb_lysozyme
    source_output: downloaded_pdb_lysozyme
    target: cmip_prepare_pdb_lysozyme
    target_input: downloaded_pdb_lysozyme

  - source: cmip_prepare_pdb_lysozyme
    source_output: cmip_pdb_lysozyme
    target: cmip_titration_lysozyme
    target_input: cmip_pdb_lysozyme

  - source: cmip_prepare_pdb_lysozyme
    source_output: cmip_pdb_lysozyme
    target: cat_pdb_titration
    target_input: cmip_pdb_lysozyme

  - source: cmip_prepare_pdb_lysozyme
    source_output: cmip_pdb_lysozyme
    target: cmip_run_mip_pos
    target_input: cmip_pdb_lysozyme

  - source: cmip_prepare_pdb_lysozyme
    source_output: cmip_pdb_lysozyme
    target: cmip_run_mip_neg
    target_input: cmip_pdb_lysozyme

  - source: cmip_prepare_pdb_lysozyme
    source_output: cmip_pdb_lysozyme
    target: cmip_run_mip_neutral
    target_input: cmip_pdb_lysozyme

  - source: cmip_titration_lysozyme
    source_output: wat_ions_pdb
    target: cat_pdb_titration
    target_input: wat_ions_pdb

  # Protein-Ligand pipeline (EGFR + Erlotinib)
  - source: fetch_pdb_complex
    source_output: complex_pdb
    target: remove_pdb_water
    target_input: complex_pdb

  - source: remove_pdb_water
    source_output: nohoh_pdb
    target: extract_heteroatoms
    target_input: nohoh_pdb

  - source: remove_pdb_water
    source_output: nohoh_pdb
    target: leap_gen_top
    target_input: nohoh_pdb

  - source: extract_heteroatoms
    source_output: ligand_pdb
    target: reduce_add_hydrogens
    target_input: ligand_pdb

  - source: reduce_add_hydrogens
    source_output: ligand_h_pdb
    target: acpype_params_ac
    target_input: ligand_h_pdb

  - source: acpype_params_ac
    source_output: acpype_lib
    target: leap_gen_top
    target_input: acpype_lib

  - source: acpype_params_ac
    source_output: acpype_frcmod
    target: leap_gen_top
    target_input: acpype_frcmod

  - source: leap_gen_top
    source_output: system_top
    target: sander_mdrun
    target_input: system_top

  - source: leap_gen_top
    source_output: system_crd
    target: sander_mdrun
    target_input: system_crd

  - source: leap_gen_top
    source_output: system_top
    target: amber_to_pdb
    target_input: system_top

  - source: sander_mdrun
    source_output: amber_rst
    target: amber_to_pdb
    target_input: amber_rst

  - source: amber_to_pdb
    source_output: min_pdb
    target: cmip_prepare_structure_complex
    target_input: min_pdb

  - source: leap_gen_top
    source_output: system_top
    target: cmip_prepare_structure_complex
    target_input: system_top

  - source: cmip_prepare_structure_complex
    source_output: cmip_complex_pdb
    target: remove_ligand
    target_input: cmip_complex_pdb

  - source: cmip_prepare_structure_complex
    source_output: cmip_complex_pdb
    target: cmip_ignore_residues_protein
    target_input: cmip_complex_pdb

  - source: remove_ligand
    source_output: no_lig_pdb
    target: cmip_run_egfr_interaction
    target_input: no_lig_pdb

  - source: cmip_ignore_residues_protein
    source_output: prot_ignored_pdb
    target: cmip_run_egfr_interaction
    target_input: prot_ignored_pdb

  # Protein-Protein pipeline (RBD + hACE2)
  - source: cmip_prepare_structure_md
    source_output: md_cmip_pdb
    target: extract_chain_hace2
    target_input: md_cmip_pdb

  - source: cmip_prepare_structure_md
    source_output: md_cmip_pdb
    target: extract_chain_rbd
    target_input: md_cmip_pdb

  - source: cmip_prepare_structure_md
    source_output: md_cmip_pdb
    target: cmip_run_complex_box
    target_input: md_cmip_pdb

  - source: cmip_prepare_structure_md
    source_output: md_cmip_pdb
    target: cmip_ignore_residues_rbd
    target_input: md_cmip_pdb

  - source: cmip_prepare_structure_md
    source_output: md_cmip_pdb
    target: cmip_ignore_residues_hace2
    target_input: md_cmip_pdb

  - source: extract_chain_hace2
    source_output: hace2_cmip_pdb
    target: cmip_run_hace2_box
    target_input: hace2_cmip_pdb

  - source: extract_chain_hace2
    source_output: hace2_cmip_pdb
    target: cmip_run_hace2_interaction
    target_input: hace2_cmip_pdb

  - source: extract_chain_rbd
    source_output: rbd_cmip_pdb
    target: cmip_run_rbd_box
    target_input: rbd_cmip_pdb

  - source: extract_chain_rbd
    source_output: rbd_cmip_pdb
    target: cmip_run_rbd_interaction
    target_input: rbd_cmip_pdb

  - source: cmip_run_rbd_box
    source_output: rbd_box_json
    target: cmip_run_rbd_interaction
    target_input: rbd_box_json

  - source: cmip_run_hace2_box
    source_output: hace2_box_json
    target: cmip_run_hace2_interaction
    target_input: hace2_box_json

  - source: cmip_run_complex_box
    source_output: complex_box_json
    target: cmip_run_rbd_interaction
    target_input: complex_box_json

  - source: cmip_run_complex_box
    source_output: complex_box_json
    target: cmip_run_hace2_interaction
    target_input: complex_box_json

  - source: cmip_ignore_residues_rbd
    source_output: rbd_ignored_pdb
    target: cmip_run_rbd_interaction
    target_input: rbd_ignored_pdb

  - source: cmip_ignore_residues_hace2
    source_output: hace2_ignored_pdb
    target: cmip_run_hace2_interaction
    target_input: hace2_ignored_pdb

  - source: artifact-md_pdb
    source_output: md_pdb
    target: cmip_prepare_structure_md
    target_input: md_pdb

  - source: artifact-md_top
