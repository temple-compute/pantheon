kind: horus_workflow
name: Protein-Membrane MD Analysis

_executor: &executor
  kind: conda_python_environment
  environment_dir: "../../.horus_conda_env" # one env per run, shared by all tasks
  conda: micromamba
  environment_file: conda_env.yaml

_docker_executor_mem: &docker_executor_mem
  kind: docker
  image: quay.io/biocontainers/biobb_mem:5.2.2--pyhdfd78af_0

_target: &target
  kind: local

artifacts:
  - id: mddb_project
    name: MDDB project
    description: MDDB accession of a protein in a lipid bilayer (structure, trajectory and GROMACS
      .tpr are downloaded).
    kind: string
    pattern: '[A-Za-z0-9]+'
    max_length: 16
    value: A023K
    path: params/mddb_project.txt

  - id: frame_stride
    name: Frame stride
    description: Keep every Nth trajectory frame when downloading.
    kind: number
    min: 1
    max: 10000
    step: 1
    value: 1000
    path: params/frame_stride.txt

  - id: pore_frame_step
    name: Pore analysis frame step
    description: Analyse the channel pore radius every Nth downloaded frame (HOLE).
    kind: number
    min: 1
    max: 1000
    step: 1
    value: 20
    path: params/pore_frame_step.txt

  - id: lipid_resname
    name: Lipid residue name
    description: Residue name of the membrane lipid (default DPPC). Its phosphorus atoms (element P)
      are the headgroup selection for leaflets, z-positions, area per lipid and flip-flop; the
      GROMACS fit uses the index group of the same name.
    kind: string
    pattern: '[A-Za-z0-9]{1,4}'
    max_length: 4
    value: DPPC
    path: params/lipid_resname.txt

tasks:
  - kind: horus_task
    id: download_trajectory
    name: Download structure and trajectory from MDDB
    description: Fetches the structure, trajectory, and GROMACS topology of the MDDB entry.
    inputs:
      - id: mddb_project
        name: MDDB project
        kind: string
        path: params/mddb_project.txt
      - id: frame_stride
        name: Frame stride
        kind: number
        path: params/frame_stride.txt
    outputs:
      - id: downloaded_pdb
        name: Structure (PDB)
        kind: file
        path: results/structure.pdb
      - id: downloaded_xtc
        name: Trajectory (XTC)
        kind: file
        path: results/trajectory.xtc
      - id: downloaded_tpr
        name: Topology (TPR)
        kind: file
        path: results/topology.tpr
    executor: *executor
    runtime:
      kind: command
      command: >-
        mddb
        --config '{"properties":{"node_id":"irb-dev","project_id":"${mddb_project}","trj_format":"xtc","frames":"1:-1:${frame_stride}","extra_files":[["topology.tpr","${downloaded_tpr}"]]}}'
        --output_top_path ${downloaded_pdb}
        --output_trj_path ${downloaded_xtc}
    target: *target

  - kind: horus_task
    id: fit_membrane
    name: Fit trajectory to membrane normal (rot+trans, gmx_image)
    description: Rotates and translates the trajectory with GROMACS so the membrane normal aligns with the z-axis (xy-plane).
    inputs:
      - id: lipid_resname
        name: Lipid residue name
        kind: string
        path: params/lipid_resname.txt
      - id: downloaded_pdb
        name: Structure (PDB)
        kind: file
        path: results/structure.pdb
      - id: downloaded_xtc
        name: Trajectory (XTC)
        kind: file
        path: results/trajectory.xtc
    outputs:
      - id: memb_fit_xtc
        name: Membrane-fitted trajectory
        kind: file
        path: results/membrane_fit.xtc
    executor: *executor
    runtime:
      kind: command
      command: >-
        gmx_image
        --config '{"properties":{"fit_selection":"${lipid_resname}","output_selection":"System","center":false,"fit":"rot+trans"}}'
        --input_top_path ${downloaded_pdb}
        --input_traj_path ${downloaded_xtc}
        --output_traj_path ${memb_fit_xtc}
    target: *target

  - kind: horus_task
    id: fit_protein
    name: Fit trajectory to protein XY translation (transxy, gmx_image)
    description: Further translates the membrane-fitted trajectory with GROMACS to center the protein in the xy-plane.
    inputs:
      - id: downloaded_pdb
        name: Structure (PDB)
        kind: file
        path: results/structure.pdb
      - id: memb_fit_xtc
        name: Membrane-fitted trajectory
        kind: file
        path: results/membrane_fit.xtc
    outputs:
      - id: memb_fit_xy_xtc
        name: Protein-fitted trajectory
        kind: file
        path: results/protein_fit.xtc
    executor: *executor
    runtime:
      kind: command
      command: >-
        gmx_image
        --config '{"properties":{"fit_selection":"Backbone","output_selection":"System","center":false,"fit":"transxy"}}'
        --input_top_path ${downloaded_pdb}
        --input_traj_path ${memb_fit_xtc}
        --output_traj_path ${memb_fit_xy_xtc}
    target: *target

  - kind: horus_task
    id: identify_leaflets_fatslim
    name: Identify membrane leaflets with FATSLiM
    description: Identifies the upper and lower membrane leaflets using the FATSLiM fatslim_membranes tool.
    inputs:
      - id: lipid_resname
        name: Lipid residue name
        kind: string
        path: params/lipid_resname.txt
      - id: downloaded_pdb
        name: Structure (PDB)
        kind: file
        path: results/structure.pdb
      - id: downloaded_xtc
        name: Trajectory (XTC)
        kind: file
        path: results/trajectory.xtc
    outputs:
      - id: leaflets_ndx
        name: Leaflet index groups
        kind: file
        path: results/leaflets.ndx
    executor: *docker_executor_mem
    runtime:
      kind: command
      command: >-
        fatslim_membranes
        --config '{"properties":{"selection":"(resname ${lipid_resname} and element P)","cutoff":2.2,"ignore_no_box":true}}'
        --input_top_path ${downloaded_pdb}
        --input_traj_path ${downloaded_xtc}
        --output_ndx_path ${leaflets_ndx}
    target: *target

  - kind: horus_task
    id: assign_leaflets
    name: Assign leaflets per frame with Lipyphilic (lpp_assign_leaflets)
    description: Assigns each lipid to a leaflet on a per-frame basis using Lipyphilic.
    inputs:
      - id: lipid_resname
        name: Lipid residue name
        kind: string
        path: params/lipid_resname.txt
      - id: downloaded_pdb
        name: Structure (PDB)
        kind: file
        path: results/structure.pdb
      - id: memb_fit_xy_xtc
        name: Protein-fitted trajectory
        kind: file
        path: results/protein_fit.xtc
    outputs:
      - id: leaflets_data_csv
        name: Per-frame leaflet assignment
        kind: file
        path: results/leaflets_data.csv
    resources:
      cpus: 2
      memory_gb: 8
      walltime: "01:00:00"
    executor: *docker_executor_mem
    runtime:
      kind: command
      command: >-
        lpp_assign_leaflets
        --config '{"properties":{"lipid_sel":"(resname ${lipid_resname} and element P)","steps":1}}'
        --input_top_path ${downloaded_pdb}
        --input_traj_path ${memb_fit_xy_xtc}
        --output_leaflets_path ${leaflets_data_csv}
    target: *target

  - kind: horus_task
    id: compute_zpositions
    name: Compute lipid z-positions for whole membrane (lpp_zpositions)
    description: Computes per-leaflet lipid z-positions and bilayer thickness across the whole membrane using Lipyphilic.
    inputs:
      - id: lipid_resname
        name: Lipid residue name
        kind: string
        path: params/lipid_resname.txt
      - id: downloaded_pdb
        name: Structure (PDB)
        kind: file
        path: results/structure.pdb
      - id: memb_fit_xy_xtc
        name: Protein-fitted trajectory
        kind: file
        path: results/protein_fit.xtc
    outputs:
      - id: zpositions_csv
        name: Lipid z-positions (whole membrane)
        kind: file
        path: results/zpositions.csv
    resources:
      cpus: 2
      memory_gb: 8
      walltime: "01:00:00"
    executor: *docker_executor_mem
    runtime:
      kind: command
      command: >-
        lpp_zpositions
        --config '{"properties":{"lipid_sel":"(resname ${lipid_resname} and element P)","steps":1,"height_sel":"(resname ${lipid_resname} and element P)","ignore_no_box":true}}'
        --input_top_path ${downloaded_pdb}
        --input_traj_path ${memb_fit_xy_xtc}
        --output_positions_path ${zpositions_csv}
    target: *target

  - kind: horus_task
    id: compute_zpositions_around
    name: Compute lipid z-positions around protein region (lpp_zpositions)
    description: Computes per-leaflet lipid z-positions and bilayer thickness restricted to the lipids surrounding the protein using Lipyphilic.
    inputs:
      - id: lipid_resname
        name: Lipid residue name
        kind: string
        path: params/lipid_resname.txt
      - id: downloaded_pdb
        name: Structure (PDB)
        kind: file
        path: results/structure.pdb
      - id: memb_fit_xy_xtc
        name: Protein-fitted trajectory
        kind: file
        path: results/protein_fit.xtc
    outputs:
      - id: zpositions_around_csv
        name: Lipid z-positions (protein region)
        kind: file
        path: results/zpositions_around.csv
    resources:
      cpus: 2
      memory_gb: 8
      walltime: "01:00:00"
    executor: *docker_executor_mem
    runtime:
      kind: command
      command: >-
        lpp_zpositions
        --config '{"properties":{"lipid_sel":"(resname ${lipid_resname} and element P)","steps":1,"height_sel":"(resname ${lipid_resname} and element P) and (cyzone 50 70 -50 protein)","ignore_no_box":true}}'
        --input_top_path ${downloaded_pdb}
        --input_traj_path ${memb_fit_xy_xtc}
        --output_positions_path ${zpositions_around_csv}
    target: *target

  - kind: horus_task
    id: compute_order_parameters
    name: Compute deuterium order parameters of acyl tails (gorder_aa)
    description: Computes deuterium order parameters of the lipid acyl tails using gorder.
    inputs:
      - id: downloaded_tpr
        name: Topology (TPR)
        kind: file
        path: results/topology.tpr
      - id: downloaded_xtc
        name: Trajectory (XTC)
        kind: file
        path: results/trajectory.xtc
    outputs:
      - id: order_csv
        name: Deuterium order parameters
        kind: file
        path: results/order.csv
    resources:
      cpus: 2
      memory_gb: 8
      walltime: "01:00:00"
    executor: *docker_executor_mem
    runtime:
      kind: command
      command: >-
        gorder_aa
        --config '{"properties":{"handle_pbc":false}}'
        --input_top_path ${downloaded_tpr}
        --input_traj_path ${downloaded_xtc}
        --output_order_path ${order_csv}
    target: *target

  - kind: horus_task
    id: compute_area_per_lipid
    name: Compute area per lipid via 2D Voronoi tessellation (fatslim_apl)
    description: Computes the per-lipid membrane area using FATSLiM's 2D Voronoi tessellation.
    inputs:
      - id: lipid_resname
        name: Lipid residue name
        kind: string
        path: params/lipid_resname.txt
      - id: downloaded_pdb
        name: Structure (PDB)
        kind: file
        path: results/structure.pdb
      - id: memb_fit_xtc
        name: Membrane-fitted trajectory
        kind: file
        path: results/membrane_fit.xtc
    outputs:
      - id: apl_csv
        name: Area per lipid
        kind: file
        path: results/apl.csv
    resources:
      cpus: 2
      memory_gb: 8
      walltime: "01:00:00"
    executor: *docker_executor_mem
    runtime:
      kind: command
      command: >-
        fatslim_apl
        --config '{"properties":{"lipid_selection":"(resname ${lipid_resname} and element P)","protein_selection":"protein and not element H","ignore_no_box":true}}'
        --input_top_path ${downloaded_pdb}
        --input_traj_path ${memb_fit_xtc}
        --output_csv_path ${apl_csv}
    target: *target

  - kind: horus_task
    id: compute_density_profile
    name: Compute membrane density profile along z-axis (cpptraj_density)
    description: Computes the mass density profile along the membrane normal using cpptraj.
    inputs:
      - id: lipid_resname
        name: Lipid residue name
        kind: string
        path: params/lipid_resname.txt
      - id: downloaded_pdb
        name: Structure (PDB)
        kind: file
        path: results/structure.pdb
      - id: memb_fit_xy_xtc
        name: Protein-fitted trajectory
        kind: file
        path: results/protein_fit.xtc
    outputs:
      - id: density_dat
        name: Density profile
        kind: file
        path: results/density.dat
    executor: *docker_executor_mem
    runtime:
      kind: command
      # cpptraj reads only the first 3 characters of a PDB residue name (DPPC -> DPP);
      # @/P selects by element, so it does not depend on the force-field atom name.
      command: >-
        r=$$(printf %.3s ${lipid_resname});
        cpptraj_density
        --config '{"properties":{"mask":":'$$r' !:'$$r' :'$$r'@/P","steps":1}}'
        --input_top_path ${downloaded_pdb}
        --input_traj_path ${memb_fit_xy_xtc}
        --output_cpptraj_path ${density_dat}
    target: *target

  - kind: horus_task
    id: compute_pore_dimensions
    name: Compute channel pore radius profile (mda_hole)
    description: Computes the channel pore-radius profile through the protein using the MDAnalysis HOLE analysis.
    inputs:
      - id: pore_frame_step
        name: Pore analysis frame step
        kind: number
        path: params/pore_frame_step.txt
      - id: downloaded_pdb
        name: Structure (PDB)
        kind: file
        path: results/structure.pdb
      - id: memb_fit_xy_xtc
        name: Protein-fitted trajectory
        kind: file
        path: results/protein_fit.xtc
    outputs:
      - id: hole_vmd
        name: Pore VMD visualization
        kind: file
        path: results/hole.vmd
      - id: hole_profile_csv
        name: Pore radius profile
        kind: file
        path: results/hole_profile.csv
    resources:
      cpus: 2
      memory_gb: 8
      walltime: "01:00:00"
    executor: *docker_executor_mem
    runtime:
      kind: command
      command: >-
        mda_hole
        --config '{"properties":{"select":"protein","steps":${pore_frame_step},"sample":0.1}}'
        --input_top_path ${downloaded_pdb}
        --input_traj_path ${memb_fit_xy_xtc}
        --output_hole_path ${hole_vmd}
        --output_csv_path ${hole_profile_csv}
    target: *target

  - kind: horus_task
    id: compute_flip_flop
    name: Detect lipid flip-flop events across leaflets (lpp_flip_flop)
    description: Detects lipids that flip between leaflets over the trajectory using Lipyphilic.
    inputs:
      - id: lipid_resname
        name: Lipid residue name
        kind: string
        path: params/lipid_resname.txt
      - id: downloaded_pdb
        name: Structure (PDB)
        kind: file
        path: results/structure.pdb
      - id: memb_fit_xy_xtc
        name: Protein-fitted trajectory
        kind: file
        path: results/protein_fit.xtc
      - id: leaflets_data_csv
        name: Per-frame leaflet assignment
        kind: file
        path: results/leaflets_data.csv
    outputs:
      - id: flip_flop_csv
        name: Lipid flip-flop events
        kind: file
        path: results/flip_flop.csv
    resources:
      cpus: 2
      memory_gb: 8
      walltime: "01:00:00"
    executor: *docker_executor_mem
    runtime:
      kind: command
      command: >-
        lpp_flip_flop
        --config '{"properties":{"lipid_sel":"(resname ${lipid_resname} and element P)","steps":1,"frame_cutoff":2}}'
        --input_top_path ${downloaded_pdb}
        --input_traj_path ${memb_fit_xy_xtc}
        --input_leaflets_path ${leaflets_data_csv}
        --output_flip_flop_path ${flip_flop_csv}
    target: *target

edges:
  - source: artifact-mddb_project
    source_output: mddb_project
    target: download_trajectory
    target_input: mddb_project

  - source: artifact-frame_stride
    source_output: frame_stride
    target: download_trajectory
    target_input: frame_stride

  - source: artifact-pore_frame_step
    source_output: pore_frame_step
    target: compute_pore_dimensions
    target_input: pore_frame_step

  - source: artifact-lipid_resname
    source_output: lipid_resname
    target: fit_membrane
    target_input: lipid_resname

  - source: artifact-lipid_resname
    source_output: lipid_resname
    target: identify_leaflets_fatslim
    target_input: lipid_resname

  - source: artifact-lipid_resname
    source_output: lipid_resname
    target: assign_leaflets
    target_input: lipid_resname

  - source: artifact-lipid_resname
    source_output: lipid_resname
    target: compute_zpositions
    target_input: lipid_resname

  - source: artifact-lipid_resname
    source_output: lipid_resname
    target: compute_zpositions_around
    target_input: lipid_resname

  - source: artifact-lipid_resname
    source_output: lipid_resname
    target: compute_area_per_lipid
    target_input: lipid_resname

  - source: artifact-lipid_resname
    source_output: lipid_resname
    target: compute_density_profile
    target_input: lipid_resname

  - source: artifact-lipid_resname
    source_output: lipid_resname
    target: compute_flip_flop
    target_input: lipid_resname

  - source: download_trajectory
    source_output: downloaded_pdb
    target: fit_membrane
    target_input: downloaded_pdb

  - source: download_trajectory
    source_output: downloaded_xtc
    target: fit_membrane
    target_input: downloaded_xtc

  - source: download_trajectory
    source_output: downloaded_pdb
    target: fit_protein
    target_input: downloaded_pdb

  - source: fit_membrane
    source_output: memb_fit_xtc
    target: fit_protein
    target_input: memb_fit_xtc

  - source: download_trajectory
    source_output: downloaded_pdb
    target: identify_leaflets_fatslim
    target_input: downloaded_pdb

  - source: download_trajectory
    source_output: downloaded_xtc
    target: identify_leaflets_fatslim
    target_input: downloaded_xtc

  - source: download_trajectory
    source_output: downloaded_pdb
    target: assign_leaflets
    target_input: downloaded_pdb

  - source: fit_protein
    source_output: memb_fit_xy_xtc
    target: assign_leaflets
    target_input: memb_fit_xy_xtc

  - source: download_trajectory
    source_output: downloaded_pdb
    target: compute_zpositions
    target_input: downloaded_pdb

  - source: fit_protein
    source_output: memb_fit_xy_xtc
    target: compute_zpositions
    target_input: memb_fit_xy_xtc

  - source: download_trajectory
    source_output: downloaded_pdb
    target: compute_zpositions_around
    target_input: downloaded_pdb

  - source: fit_protein
    source_output: memb_fit_xy_xtc
    target: compute_zpositions_around
    target_input: memb_fit_xy_xtc

  - source: download_trajectory
    source_output: downloaded_tpr
    target: compute_order_parameters
    target_input: downloaded_tpr

  - source: download_trajectory
    source_output: downloaded_xtc
    target: compute_order_parameters
    target_input: downloaded_xtc

  - source: download_trajectory
    source_output: downloaded_pdb
    target: compute_area_per_lipid
    target_input: downloaded_pdb

  - source: fit_membrane
    source_output: memb_fit_xtc
    target: compute_area_per_lipid
    target_input: memb_fit_xtc

  - source: download_trajectory
    source_output: downloaded_pdb
    target: compute_density_profile
    target_input: downloaded_pdb

  - source: fit_protein
    source_output: memb_fit_xy_xtc
    target: compute_density_profile
    target_input: memb_fit_xy_xtc

  - source: download_trajectory
    source_output: downloaded_pdb
    target: compute_pore_dimensions
    target_input: downloaded_pdb

  - source: fit_protein
    source_output: memb_fit_xy_xtc
    target: compute_pore_dimensions
    target_input: memb_fit_xy_xtc

  - source: download_trajectory
    source_output: downloaded_pdb
    target: compute_flip_flop
    target_input: downloaded_pdb

  - source: fit_protein
    source_output: memb_fit_xy_xtc
    target: compute_flip_flop
    target_input: memb_fit_xy_xtc

  - source: assign_leaflets
    source_output: leaflets_data_csv
    target: compute_flip_flop
    target_input: leaflets_data_csv

orchestrator_target:
  kind: local
  working_directory: "./workflow_results"
