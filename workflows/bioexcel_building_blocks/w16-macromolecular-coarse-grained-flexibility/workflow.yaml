kind: horus_workflow
name: BioExcel FlexServ - Protein Conformational Dynamics (1A32)

_executor: &executor
  kind: conda_python_environment
  environment_dir: "../.horus_conda_env"
  conda: micromamba
  environment_file: conda_env.yaml

_docker_executor_flexserv: &docker_executor_flexserv
  kind: docker
  image: quay.io/biocontainers/biobb_flexserv:5.2.1--py310pl5321ha6fa2df_0

artifacts:
  - id: md_pcz
    name: MoDEL reference PCZ trajectory
    description: Pre-compressed 10 ns all-atom MD trajectory of 1A32 from the MoDEL database, used only as a comparison baseline in the similarity analyses.
    kind: file
    path: Files/1a32.MoDEL.pcz

  - id: bd_run_config
    name: BD run config
    description: Configuration for the Brownian Dynamics ensemble run (simulation time, write frequency).
    kind: file
    path: configs/bd_run.yaml

  - id: cpptraj_convert_proj1_config
    name: PC1 conversion config
    description: Configuration for converting the PC1 animation trajectory to XTC.
    kind: file
    path: configs/cpptraj_convert_proj1.yaml

  - id: cpptraj_rms_bd_config
    name: BD RMSD config
    description: Configuration for the RMSD/XTC conversion of the BD ensemble trajectory.
    kind: file
    path: configs/cpptraj_rms.yaml

  - id: extract_atoms_ca_config
    name: Cα extraction config
    description: Configuration for reducing the structure to a Cα-only coarse-grained model.
    kind: file
    path: configs/extract_atoms_ca.yaml

  - id: fetch_pdb_config
    name: PDB fetch config
    description: Configuration setting the PDB code (1A32) to download.
    kind: file
    path: configs/fetch_pdb.yaml

  - id: nma_run_config
    name: NMA run config
    description: Configuration for the Normal Mode Analysis ensemble run.
    kind: file
    path: configs/nma_run.yaml

  - id: pcz_animate_config
    name: PC1 animation config
    description: Configuration for animating the NMA PC1 mode.
    kind: file
    path: configs/pcz_animate.yaml

  - id: pcz_bfactor_all_config
    name: All-mode B-factor config
    description: Configuration for computing B-factors across all NMA principal components.
    kind: file
    path: configs/pcz_bfactor_all.yaml

  - id: pcz_bfactor_mode1_config
    name: PC1 B-factor config
    description: Configuration for computing B-factors from NMA principal component 1.
    kind: file
    path: configs/pcz_bfactor_mode1.yaml

  - id: pcz_bfactor_mode2_config
    name: PC2 B-factor config
    description: Configuration for computing B-factors from NMA principal component 2.
    kind: file
    path: configs/pcz_bfactor_mode2.yaml

  - id: pcz_bfactor_mode3_config
    name: PC3 B-factor config
    description: Configuration for computing B-factors from NMA principal component 3.
    kind: file
    path: configs/pcz_bfactor_mode3.yaml

  - id: pcz_bfactor_mode4_config
    name: PC4 B-factor config
    description: Configuration for computing B-factors from NMA principal component 4.
    kind: file
    path: configs/pcz_bfactor_mode4.yaml

  - id: pcz_bfactor_mode5_config
    name: PC5 B-factor config
    description: Configuration for computing B-factors from NMA principal component 5.
    kind: file
    path: configs/pcz_bfactor_mode5.yaml

  - id: pcz_collectivity_config
    name: Collectivity config
    description: Configuration for the collectivity-index calculation.
    kind: file
    path: configs/pcz_collectivity.yaml

  - id: pcz_evecs_config
    name: Eigenvector extraction config
    description: Configuration for extracting eigenvectors from the NMA PCZ file.
    kind: file
    path: configs/pcz_evecs.yaml

  - id: pcz_hinges_bfactor_config
    name: Hinge detection config (B-factor method)
    description: Configuration for hinge-point detection using the B-factor slope method.
    kind: file
    path: configs/pcz_hinges_bfactor.yaml

  - id: pcz_hinges_dyndom_config
    name: Hinge detection config (DynDom method)
    description: Configuration for hinge-point detection using the dynamic domain (DynDom) method.
    kind: file
    path: configs/pcz_hinges_dyndom.yaml

  - id: pcz_hinges_fcte_config
    name: Hinge detection config (force constant method)
    description: Configuration for hinge-point detection using the force-constant method.
    kind: file
    path: configs/pcz_hinges_fcte.yaml

  - id: pcz_stiffness_config
    name: Stiffness config
    description: Configuration for the apparent inter-residue stiffness calculation.
    kind: file
    path: configs/pcz_stiffness.yaml

  - id: pcz_zip_bd_config
    name: PCA compression config
    description: Configuration for PCA-compressing an ensemble trajectory into PCZ format.
    kind: file
    path: configs/pcz_zip.yaml

tasks:
  - kind: horus_task
    id: fetch_pdb
    name: Download 1A32 structure from PDB
    description: Downloads the Ribosomal Protein S15 structure (PDB 1A32) from the RCSB.
    inputs:
      - id: fetch_pdb_config
        name: PDB fetch config
        kind: file
        path: configs/fetch_pdb.yaml
    outputs:
      - id: downloaded_pdb
        name: Downloaded structure (1A32)
        kind: file
        path: results/1a32.pdb
    executor: *docker_executor_flexserv
    runtime:
      kind: command
      command: >-
        pdb
        --config ${fetch_pdb_config}
        --output_pdb_path ${downloaded_pdb}
    target:
      kind: local

  - kind: horus_task
    id: extract_atoms_ca
    name: Extract C-alpha atoms from structure
    description: Reduces the structure to a Cα-only coarse-grained representation using the biobb extract_atoms tool.
    inputs:
      - id: extract_atoms_ca_config
        name: Cα extraction config
        kind: file
        path: configs/extract_atoms_ca.yaml
      - id: downloaded_pdb
        name: Downloaded structure (1A32)
        kind: file
        path: results/1a32.pdb
    outputs:
      - id: ca_pdb
        name: Cα-reduced structure
        kind: file
        path: results/1a32_ca.pdb
    executor: *docker_executor_flexserv
    runtime:
      kind: command
      command: >-
        extract_atoms
        --config ${extract_atoms_ca_config}
        --input_structure_path ${downloaded_pdb}
        --output_structure_path ${ca_pdb}
    target:
      kind: local

  - kind: horus_task
    id: bd_run
    name: Run Brownian Dynamics (BD) conformational ensemble
    description: Generates a Brownian Dynamics conformational ensemble from the coarse-grained structure with FlexServ.
    inputs:
      - id: bd_run_config
        name: BD run config
        kind: file
        path: configs/bd_run.yaml
      - id: ca_pdb
        name: Cα-reduced structure
        kind: file
        path: results/1a32_ca.pdb
    outputs:
      - id: bd_crd
        name: BD ensemble trajectory
        kind: file
        path: results/bd_ensemble.mdcrd
      - id: bd_log
        name: BD run log
        kind: file
        path: results/bd_ensemble.log
    executor: *docker_executor_flexserv
    runtime:
      kind: command
      command: >-
        bd_run
        --config ${bd_run_config}
        --input_pdb_path ${ca_pdb}
        --output_crd_path ${bd_crd}
        --output_log_path ${bd_log}
    target:
      kind: local

  - kind: horus_task
    id: cpptraj_rms_bd
    name: Compute RMSD for BD ensemble trajectory
    description: Computes RMSD for the BD ensemble and converts the trajectory to XTC with cpptraj.
    inputs:
      - id: cpptraj_rms_bd_config
        name: BD RMSD config
        kind: file
        path: configs/cpptraj_rms.yaml
      - id: ca_pdb
        name: Cα-reduced structure
        kind: file
        path: results/1a32_ca.pdb
      - id: bd_crd
        name: BD ensemble trajectory
        kind: file
        path: results/bd_ensemble.mdcrd
    outputs:
      - id: bd_rmsd
        name: BD ensemble RMSD
        kind: file
        path: results/bd_ensemble_rmsd.dat
      - id: bd_xtc
        name: BD ensemble trajectory (XTC)
        kind: file
        path: results/bd_ensemble.xtc
    executor: *docker_executor_flexserv
    runtime:
      kind: command
      command: >-
        cpptraj_rms
        --config ${cpptraj_rms_bd_config}
        --input_top_path ${ca_pdb}
        --input_traj_path ${bd_crd}
        --output_cpptraj_path ${bd_rmsd}
        --output_traj_path ${bd_xtc}
        --input_exp_path ${ca_pdb}
    target:
      kind: local

  - kind: horus_task
    id: dmd_run
    name: Run Discrete Molecular Dynamics (DMD) conformational ensemble
    description: Generates a Discrete Molecular Dynamics conformational ensemble from the coarse-grained structure with FlexServ.
    inputs:
      - id: ca_pdb
        name: Cα-reduced structure
        kind: file
        path: results/1a32_ca.pdb
    outputs:
      - id: dmd_crd
        name: DMD ensemble trajectory
        kind: file
        path: results/dmd_ensemble.mdcrd
      - id: dmd_log
        name: DMD run log
        kind: file
        path: results/dmd_ensemble.log
    executor: *docker_executor_flexserv
    runtime:
      kind: command
      command: >-
        dmd_run
        --input_pdb_path ${ca_pdb}
        --output_crd_path ${dmd_crd}
        --output_log_path ${dmd_log}
    target:
      kind: local

  - kind: horus_task
    id: cpptraj_rms_dmd
    name: Compute RMSD for DMD ensemble trajectory
    description: Computes RMSD for the DMD ensemble and converts the trajectory to XTC with cpptraj.
    inputs:
      - id: cpptraj_rms_dmd_config
        name: DMD RMSD config
        kind: file
        path: configs/cpptraj_rms.yaml
      - id: ca_pdb
        name: Cα-reduced structure
        kind: file
        path: results/1a32_ca.pdb
      - id: dmd_crd
        name: DMD ensemble trajectory
        kind: file
        path: results/dmd_ensemble.mdcrd
    outputs:
      - id: dmd_rmsd
        name: DMD ensemble RMSD
        kind: file
        path: results/dmd_ensemble_rmsd.dat
      - id: dmd_xtc
        name: DMD ensemble trajectory (XTC)
        kind: file
        path: results/dmd_ensemble.xtc
    executor: *docker_executor_flexserv
    runtime:
      kind: command
      command: >-
        cpptraj_rms
        --config ${cpptraj_rms_dmd_config}
        --input_top_path ${ca_pdb}
        --input_traj_path ${dmd_crd}
        --output_cpptraj_path ${dmd_rmsd}
        --output_traj_path ${dmd_xtc}
        --input_exp_path ${ca_pdb}
    target:
      kind: local

  - kind: horus_task
    id: nma_run
    name: Run Normal Mode Analysis (NMA) conformational ensemble
    description: Generates a Normal Mode Analysis conformational ensemble from the coarse-grained structure with FlexServ.
    inputs:
      - id: nma_run_config
        name: NMA run config
        kind: file
        path: configs/nma_run.yaml
      - id: ca_pdb
        name: Cα-reduced structure
        kind: file
        path: results/1a32_ca.pdb
    outputs:
      - id: nma_crd
        name: NMA ensemble trajectory
        kind: file
        path: results/nma_ensemble.mdcrd
      - id: nma_log
        name: NMA run log
        kind: file
        path: results/nma_ensemble.log
    executor: *docker_executor_flexserv
    runtime:
      kind: command
      command: >-
        nma_run
        --config ${nma_run_config}
        --input_pdb_path ${ca_pdb}
        --output_crd_path ${nma_crd}
        --output_log_path ${nma_log}
    target:
      kind: local

  - kind: horus_task
    id: cpptraj_rms_nma
    name: Compute RMSD for NMA ensemble trajectory
    description: Computes RMSD for the NMA ensemble and converts the trajectory to XTC with cpptraj.
    inputs:
      - id: cpptraj_rms_nma_config
        name: NMA RMSD config
        kind: file
        path: configs/cpptraj_rms.yaml
      - id: ca_pdb
        name: Cα-reduced structure
        kind: file
        path: results/1a32_ca.pdb
      - id: nma_crd
        name: NMA ensemble trajectory
        kind: file
        path: results/nma_ensemble.mdcrd
    outputs:
      - id: nma_rmsd
        name: NMA ensemble RMSD
        kind: file
        path: results/nma_ensemble_rmsd.dat
      - id: nma_xtc
        name: NMA ensemble trajectory (XTC)
        kind: file
        path: results/nma_ensemble.xtc
    executor: *docker_executor_flexserv
    runtime:
      kind: command
      command: >-
        cpptraj_rms
        --config ${cpptraj_rms_nma_config}
        --input_top_path ${ca_pdb}
        --input_traj_path ${nma_crd}
        --output_cpptraj_path ${nma_rmsd}
        --output_traj_path ${nma_xtc}
        --input_exp_path ${ca_pdb}
    target:
      kind: local

  - kind: horus_task
    id: pcz_zip_bd
    name: Compress BD trajectory with PCA (PCZ format)
    description: Compresses the BD ensemble trajectory into PCZ format via PCA.
    inputs:
      - id: pcz_zip_bd_config
        name: PCA compression config
        kind: file
        path: configs/pcz_zip.yaml
      - id: ca_pdb
        name: Cα-reduced structure
        kind: file
        path: results/1a32_ca.pdb
      - id: bd_crd
        name: BD ensemble trajectory
        kind: file
        path: results/bd_ensemble.mdcrd
    outputs:
      - id: bd_pcz
        name: BD trajectory (PCZ)
        kind: file
        path: results/bd_ensemble.pcz
    executor: *docker_executor_flexserv
    runtime:
      kind: command
      command: >-
        pcz_zip
        --config ${pcz_zip_bd_config}
        --input_pdb_path ${ca_pdb}
        --input_crd_path ${bd_crd}
        --output_pcz_path ${bd_pcz}
    target:
      kind: local

  - kind: horus_task
    id: pcz_zip_dmd
    name: Compress DMD trajectory with PCA (PCZ format)
    description: Compresses the DMD ensemble trajectory into PCZ format via PCA.
    inputs:
      - id: pcz_zip_dmd_config
        name: PCA compression config
        kind: file
        path: configs/pcz_zip.yaml
      - id: ca_pdb
        name: Cα-reduced structure
        kind: file
        path: results/1a32_ca.pdb
      - id: dmd_crd
        name: DMD ensemble trajectory
        kind: file
        path: results/dmd_ensemble.mdcrd
    outputs:
      - id: dmd_pcz
        name: DMD trajectory (PCZ)
        kind: file
        path: results/dmd_ensemble.pcz
    executor: *docker_executor_flexserv
    runtime:
      kind: command
      command: >-
        pcz_zip
        --config ${pcz_zip_dmd_config}
        --input_pdb_path ${ca_pdb}
        --input_crd_path ${dmd_crd}
        --output_pcz_path ${dmd_pcz}
    target:
      kind: local

  - kind: horus_task
    id: pcz_zip_nma
    name: Compress NMA trajectory with PCA (PCZ format)
    description: Compresses the NMA ensemble trajectory into PCZ format via PCA.
    inputs:
      - id: pcz_zip_nma_config
        name: PCA compression config
        kind: file
        path: configs/pcz_zip.yaml
      - id: ca_pdb
        name: Cα-reduced structure
        kind: file
        path: results/1a32_ca.pdb
      - id: nma_crd
        name: NMA ensemble trajectory
        kind: file
        path: results/nma_ensemble.mdcrd
    outputs:
      - id: nma_pcz
        name: NMA trajectory (PCZ)
        kind: file
        path: results/nma_ensemble.pcz
    executor: *docker_executor_flexserv
    runtime:
      kind: command
      command: >-
        pcz_zip
        --config ${pcz_zip_nma_config}
        --input_pdb_path ${ca_pdb}
        --input_crd_path ${nma_crd}
        --output_pcz_path ${nma_pcz}
    target:
      kind: local

  - kind: horus_task
    id: pcz_unzip_bd
    name: Decompress BD PCZ trajectory back to CRD
    description: Decompresses the BD PCZ trajectory back to CRD format for quality-check comparisons.
    inputs:
      - id: bd_pcz
        name: BD trajectory (PCZ)
        kind: file
        path: results/bd_ensemble.pcz
    outputs:
      - id: bd_crd_uncompressed
        name: Decompressed BD trajectory
        kind: file
        path: results/bd_ensemble_uncompressed.crd
    executor: *docker_executor_flexserv
    runtime:
      kind: command
      command: >-
        pcz_unzip
        --input_pcz_path ${bd_pcz}
        --output_crd_path ${bd_crd_uncompressed}
    target:
      kind: local

  - kind: horus_task
    id: pcz_unzip_dmd
    name: Decompress DMD PCZ trajectory back to CRD
    description: Decompresses the DMD PCZ trajectory back to CRD format for quality-check comparisons.
    inputs:
      - id: dmd_pcz
        name: DMD trajectory (PCZ)
        kind: file
        path: results/dmd_ensemble.pcz
    outputs:
      - id: dmd_crd_uncompressed
        name: Decompressed DMD trajectory
        kind: file
        path: results/dmd_ensemble_uncompressed.crd
    executor: *docker_executor_flexserv
    runtime:
      kind: command
      command: >-
        pcz_unzip
        --input_pcz_path ${dmd_pcz}
        --output_crd_path ${dmd_crd_uncompressed}
    target:
      kind: local

  - kind: horus_task
    id: pcz_unzip_nma
    name: Decompress NMA PCZ trajectory back to CRD
    description: Decompresses the NMA PCZ trajectory back to CRD format for quality-check comparisons.
    inputs:
      - id: nma_pcz
        name: NMA trajectory (PCZ)
        kind: file
        path: results/nma_ensemble.pcz
    outputs:
      - id: nma_crd_uncompressed
        name: Decompressed NMA trajectory
        kind: file
        path: results/nma_ensemble_uncompressed.crd
    executor: *docker_executor_flexserv
    runtime:
      kind: command
      command: >-
        pcz_unzip
        --input_pcz_path ${nma_pcz}
        --output_crd_path ${nma_crd_uncompressed}
    target:
      kind: local

  - kind: horus_task
    id: cpptraj_rms_bd_uncompressed
    name: Compute RMSD for decompressed BD trajectory
    description: Computes RMSD for the decompressed BD trajectory to check PCA-compression quality.
    inputs:
      - id: cpptraj_rms_bd_unc_config
        name: Decompressed BD RMSD config
        kind: file
        path: configs/cpptraj_rms.yaml
      - id: ca_pdb
        name: Cα-reduced structure
        kind: file
        path: results/1a32_ca.pdb
      - id: bd_crd_uncompressed
        name: Decompressed BD trajectory
        kind: file
        path: results/bd_ensemble_uncompressed.crd
    outputs:
      - id: bd_uncompressed_rmsd
        name: Decompressed BD trajectory RMSD
        kind: file
        path: results/bd_ensemble_uncompressed.rmsd.dat
      - id: bd_xtc_uncompressed
        name: Decompressed BD trajectory (XTC)
        kind: file
        path: results/bd_ensemble_uncompressed.xtc
    executor: *docker_executor_flexserv
    runtime:
      kind: command
      command: >-
        cpptraj_rms
        --config ${cpptraj_rms_bd_unc_config}
        --input_top_path ${ca_pdb}
        --input_traj_path ${bd_crd_uncompressed}
        --output_cpptraj_path ${bd_uncompressed_rmsd}
        --output_traj_path ${bd_xtc_uncompressed}
        --input_exp_path ${ca_pdb}
    target:
      kind: local

  - kind: horus_task
    id: cpptraj_rms_dmd_uncompressed
    name: Compute RMSD for decompressed DMD trajectory
    description: Computes RMSD for the decompressed DMD trajectory to check PCA-compression quality.
    inputs:
      - id: cpptraj_rms_dmd_unc_config
        name: Decompressed DMD RMSD config
        kind: file
        path: configs/cpptraj_rms.yaml
      - id: ca_pdb
        name: Cα-reduced structure
        kind: file
        path: results/1a32_ca.pdb
      - id: dmd_crd_uncompressed
        name: Decompressed DMD trajectory
        kind: file
        path: results/dmd_ensemble_uncompressed.crd
    outputs:
      - id: dmd_uncompressed_rmsd
        name: Decompressed DMD trajectory RMSD
        kind: file
        path: results/dmd_ensemble_uncompressed.rmsd.dat
      - id: dmd_xtc_uncompressed
        name: Decompressed DMD trajectory (XTC)
        kind: file
        path: results/dmd_ensemble_uncompressed.xtc
    executor: *docker_executor_flexserv
    runtime:
      kind: command
      command: >-
        cpptraj_rms
        --config ${cpptraj_rms_dmd_unc_config}
        --input_top_path ${ca_pdb}
        --input_traj_path ${dmd_crd_uncompressed}
        --output_cpptraj_path ${dmd_uncompressed_rmsd}
        --output_traj_path ${dmd_xtc_uncompressed}
        --input_exp_path ${ca_pdb}
    target:
      kind: local

  - kind: horus_task
    id: cpptraj_rms_nma_uncompressed
    name: Compute RMSD for decompressed NMA trajectory
    description: Computes RMSD for the decompressed NMA trajectory to check PCA-compression quality.
    inputs:
      - id: cpptraj_rms_nma_unc_config
        name: Decompressed NMA RMSD config
        kind: file
        path: configs/cpptraj_rms.yaml
      - id: ca_pdb
        name: Cα-reduced structure
        kind: file
        path: results/1a32_ca.pdb
      - id: nma_crd_uncompressed
        name: Decompressed NMA trajectory
        kind: file
        path: results/nma_ensemble_uncompressed.crd
    outputs:
      - id: nma_uncompressed_rmsd
        name: Decompressed NMA trajectory RMSD
        kind: file
        path: results/nma_ensemble_uncompressed.rmsd.dat
      - id: nma_xtc_uncompressed
        name: Decompressed NMA trajectory (XTC)
        kind: file
        path: results/nma_ensemble_uncompressed.xtc
    executor: *docker_executor_flexserv
    runtime:
      kind: command
      command: >-
        cpptraj_rms
        --config ${cpptraj_rms_nma_unc_config}
        --input_top_path ${ca_pdb}
        --input_traj_path ${nma_crd_uncompressed}
        --output_cpptraj_path ${nma_uncompressed_rmsd}
        --output_traj_path ${nma_xtc_uncompressed}
        --input_exp_path ${ca_pdb}
    target:
      kind: local

  - kind: horus_task
    id: pcz_info
    name: Extract PCA information from NMA PCZ file
    description: Extracts PCA report data (eigenvalues, variance, dimensionality) from the NMA PCZ file.
    inputs:
      - id: nma_pcz
        name: NMA trajectory (PCZ)
        kind: file
        path: results/nma_ensemble.pcz
    outputs:
      - id: pcz_report
        name: PCA report
        kind: file
        path: results/pcz_report.json
    executor: *docker_executor_flexserv
    runtime:
      kind: command
      command: >-
        pcz_info
        --input_pcz_path ${nma_pcz}
        --output_json_path ${pcz_report}
    target:
      kind: local

  - kind: horus_task
    id: pcz_evecs
    name: Extract eigenvectors from NMA PCZ file
    description: Extracts eigenvectors for the NMA PC1 mode from the PCZ file.
    inputs:
      - id: pcz_evecs_config
        name: Eigenvector extraction config
        kind: file
        path: configs/pcz_evecs.yaml
      - id: nma_pcz
        name: NMA trajectory (PCZ)
        kind: file
        path: results/nma_ensemble.pcz
    outputs:
      - id: pcz_evecs_report
        name: Eigenvector report
        kind: file
        path: results/pcz_evecs.json
    executor: *docker_executor_flexserv
    runtime:
      kind: command
      command: >-
