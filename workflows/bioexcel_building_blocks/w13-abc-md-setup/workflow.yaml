kind: horus_workflow
name: BioExcel AMBER ABC Setup - Drew-Dickerson Dodecamer DNA

_executor: &executor
  kind: conda_python_environment
  environment_dir: "../.horus_conda_env"
  conda: micromamba
  environment_file: conda_env.yaml


_docker_executor: &docker_executor
  kind: docker
  image: quay.io/biocontainers/biobb_amber:5.2.1--py312hc5e4ab4_0

_target: &target
  kind: local

artifacts:
  - id: md_mdin
    name: MD production mdin
    description: AMBER sander input file for the free MD production run.
    kind: file
    path: ABCix_config_files/md.in

  - id: step1_mdin
    name: Equilibration step 1 mdin
    description: AMBER sander input file for equilibration step 1.
    kind: file
    path: ABCix_config_files/step1.in

  - id: step10_mdin
    name: Equilibration step 10 mdin
    description: AMBER sander input file for equilibration step 10.
    kind: file
    path: ABCix_config_files/step10.in

  - id: step2_mdin
    name: Equilibration step 2 mdin
    description: AMBER sander input file for equilibration step 2.
    kind: file
    path: ABCix_config_files/step2.in

  - id: step3_mdin
    name: Equilibration step 3 mdin
    description: AMBER sander input file for equilibration step 3.
    kind: file
    path: ABCix_config_files/step3.in

  - id: step4_mdin
    name: Equilibration step 4 mdin
    description: AMBER sander input file for equilibration step 4.
    kind: file
    path: ABCix_config_files/step4.in

  - id: step5_mdin
    name: Equilibration step 5 mdin
    description: AMBER sander input file for equilibration step 5.
    kind: file
    path: ABCix_config_files/step5.in

  - id: step6_mdin
    name: Equilibration step 6 mdin
    description: AMBER sander input file for equilibration step 6.
    kind: file
    path: ABCix_config_files/step6.in

  - id: step7_mdin
    name: Equilibration step 7 mdin
    description: AMBER sander input file for equilibration step 7.
    kind: file
    path: ABCix_config_files/step7.in

  - id: step8_mdin
    name: Equilibration step 8 mdin
    description: AMBER sander input file for equilibration step 8.
    kind: file
    path: ABCix_config_files/step8.in

  - id: step9_mdin
    name: Equilibration step 9 mdin
    description: AMBER sander input file for equilibration step 9.
    kind: file
    path: ABCix_config_files/step9.in

  - id: dna_pdb
    name: DNA starting structure (PDB)
    description: Initial Drew-Dickerson dodecamer DNA structure.
    kind: file
    path: CGCGAATTCGCG.pdb

  - id: cpptraj_randomize_ions_config
    name: Ion randomization config
    description: Parameters for randomizing ion positions with cpptraj.
    kind: file
    path: configs/cpptraj_randomize_ions.yaml

  - id: leap_add_ions_config
    name: Ion addition config
    description: Parameters for adding ions at 100 mM with leap.
    kind: file
    path: configs/leap_add_ions.yaml

  - id: leap_gen_top_config
    name: Topology generation config
    description: Parameters for building the DNA system topology with leap.
    kind: file
    path: configs/leap_gen_top.yaml

  - id: leap_solvate_config
    name: Solvation config
    description: Parameters for building the solvent box with leap.
    kind: file
    path: configs/leap_solvate.yaml

  - id: process_eq1_config
    name: Eq1 energy extraction config
    description: Parameters for extracting minimization energy from the eq1 log.
    kind: file
    path: configs/process_eq1.yaml

  - id: process_eq10_config
    name: Eq10 energy extraction config
    description: Parameters for extracting pressure and density from the eq10 log.
    kind: file
    path: configs/process_eq10.yaml

  - id: process_eq2_config
    name: Eq2 energy extraction config
    description: Parameters for extracting temperature from the eq2 log.
    kind: file
    path: configs/process_eq2.yaml

  - id: process_eq3_config
    name: Eq3 energy extraction config
    description: Parameters for extracting minimization energy from the eq3 log.
    kind: file
    path: configs/process_eq3.yaml

  - id: process_eq4_config
    name: Eq4 energy extraction config
    description: Parameters for extracting minimization energy from the eq4 log.
    kind: file
    path: configs/process_eq4.yaml

  - id: process_eq5_config
    name: Eq5 energy extraction config
    description: Parameters for extracting minimization energy from the eq5 log.
    kind: file
    path: configs/process_eq5.yaml

  - id: process_eq6_config
    name: Eq6 energy extraction config
    description: Parameters for extracting pressure and density from the eq6 log.
    kind: file
    path: configs/process_eq6.yaml

  - id: process_eq7_config
    name: Eq7 energy extraction config
    description: Parameters for extracting pressure and density from the eq7 log.
    kind: file
    path: configs/process_eq7.yaml

  - id: process_eq8_config
    name: Eq8 energy extraction config
    description: Parameters for extracting pressure and density from the eq8 log.
    kind: file
    path: configs/process_eq8.yaml

  - id: process_eq9_config
    name: Eq9 energy extraction config
