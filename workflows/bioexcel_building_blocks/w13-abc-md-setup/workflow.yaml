        --input_top_path ${top_4fs}
        --input_mdin_path ${step2_mdin}
        --input_crd_path ${eq1_rst}
        --input_ref_path ${eq1_rst}
        --output_traj_path ${eq2_traj}
        --output_rst_path ${eq2_rst}
        --output_log_path ${eq2_log}
        --output_mdinfo_path ${eq2_mdinfo}
    target: *target

  - kind: horus_task
