    path: configs/process_eq9.yaml

  - id: sander_eq1_config
    name: Eq1 sander config
    description: Parameters for equilibration step 1 (minimization with restraints).
    kind: file
    path: configs/sander_eq1.yaml

  - id: sander_eq10_config
    name: Eq10 sander config
    description: Parameters for equilibration step 10 (npt production equilibration).
    kind: file
    path: configs/sander_eq10.yaml

  - id: sander_eq2_config
    name: Eq2 sander config
    description: Parameters for equilibration step 2 (heating with restraints).
    kind: file
    path: configs/sander_eq2.yaml

  - id: sander_eq3_config
    name: Eq3 sander config
    description: Parameters for equilibration step 3 (minimization with restraints).
    kind: file
    path: configs/sander_eq3.yaml

  - id: sander_eq4_config
    name: Eq4 sander config
    description: Parameters for equilibration step 4 (minimization with restraints).
    kind: file
    path: configs/sander_eq4.yaml

  - id: sander_eq5_config
    name: Eq5 sander config
    description: Parameters for equilibration step 5 (minimization without restraints).
    kind: file
    path: configs/sander_eq5.yaml

  - id: sander_eq6_config
    name: Eq6 sander config
    description: Parameters for equilibration step 6 (npt with restraints).
    kind: file
    path: configs/sander_eq6.yaml

  - id: sander_eq7_config
    name: Eq7 sander config
    description: Parameters for equilibration step 7 (npt with restraints).
    kind: file
    path: configs/sander_eq7.yaml

  - id: sander_eq8_config
    name: Eq8 sander config
    description: Parameters for equilibration step 8 (npt with backbone restraints).
    kind: file
    path: configs/sander_eq8.yaml

  - id: sander_eq9_config
    name: Eq9 sander config
    description: Parameters for equilibration step 9 (npt without restraints).
    kind: file
    path: configs/sander_eq9.yaml

  - id: sander_md_config
    name: MD production sander config
    description: Parameters for the free MD production run.
    kind: file
    path: configs/sander_md.yaml

tasks:
  - kind: horus_task
    id: leap_gen_top
    name: Create DNA system topology (leap)
    description: Builds the DNA system topology and initial coordinates with LEaP.
    inputs:
      - id: leap_gen_top_config
        name: Topology generation config
        description: Parameters for building the DNA system topology with leap.
        kind: file
        path: configs/leap_gen_top.yaml
      - id: dna_pdb
        name: DNA starting structure (PDB)
        description: Initial Drew-Dickerson dodecamer DNA structure.
        kind: file
        path: CGCGAATTCGCG.pdb
    outputs:
      - id: leap_pdb
        name: DNA structure (leap)
        kind: file
        path: results/structure.leap.pdb
      - id: leap_top
        name: DNA topology (leap)
        kind: file
        path: results/structure.leap.top
      - id: leap_crd
        name: DNA coordinates (leap)
        kind: file
        path: results/structure.leap.crd
    executor: *docker_executor
    runtime:
      kind: command
      command: >-
        leap_gen_top
        --config ${leap_gen_top_config}
        --input_pdb_path ${dna_pdb}
        --output_pdb_path ${leap_pdb}
        --output_top_path ${leap_top}
        --output_crd_path ${leap_crd}
    target: *target

  - kind: horus_task
    id: leap_solvate
    name: Create solvent box and solvate DNA system (leap)
    description: Builds an explicit solvent box around the DNA system with LEaP.
    inputs:
      - id: leap_solvate_config
        name: Solvation config
        description: Parameters for building the solvent box with leap.
        kind: file
        path: configs/leap_solvate.yaml
      - id: leap_pdb
        name: DNA structure (leap)
        kind: file
        path: results/structure.leap.pdb
    outputs:
      - id: solv_pdb
        name: Solvated structure
        kind: file
        path: results/structure.solv.pdb
      - id: solv_top
        name: Solvated topology
        kind: file
        path: results/structure.solv.parmtop
      - id: solv_crd
        name: Solvated coordinates
        kind: file
        path: results/structure.solv.crd
    executor: *docker_executor
    runtime:
      kind: command
      command: >-
        leap_solvate
        --config ${leap_solvate_config}
        --input_pdb_path ${leap_pdb}
        --output_pdb_path ${solv_pdb}
        --output_top_path ${solv_top}
        --output_crd_path ${solv_crd}
    target: *target

  - kind: horus_task
    id: leap_add_ions
    name: Add ions at 100 mM concentration (leap)
    description: Neutralizes and adds ions at 100 mM concentration with LEaP.
    inputs:
      - id: leap_add_ions_config
        name: Ion addition config
        description: Parameters for adding ions at 100 mM with leap.
        kind: file
        path: configs/leap_add_ions.yaml
      - id: solv_pdb
        name: Solvated structure
        kind: file
        path: results/structure.solv.pdb
    outputs:
      - id: ions_pdb
        name: Ionized structure
        kind: file
        path: results/structure.ions.pdb
      - id: ions_top
        name: Ionized topology
        kind: file
        path: results/structure.ions.parmtop
      - id: ions_crd
        name: Ionized coordinates
        kind: file
        path: results/structure.ions.crd
    executor: *docker_executor
    runtime:
      kind: command
      command: >-
        leap_add_ions
        --config ${leap_add_ions_config}
        --input_pdb_path ${solv_pdb}
        --output_pdb_path ${ions_pdb}
        --output_top_path ${ions_top}
        --output_crd_path ${ions_crd}
    target: *target

  - kind: horus_task
    id: cpptraj_randomize_ions
    name: Randomize ion positions (cpptraj)
    description: Randomizes ion positions to avoid artifacts from LEaP placement.
    inputs:
      - id: cpptraj_randomize_ions_config
        name: Ion randomization config
        description: Parameters for randomizing ion positions with cpptraj.
        kind: file
        path: configs/cpptraj_randomize_ions.yaml
      - id: ions_top
        name: Ionized topology
        kind: file
        path: results/structure.ions.parmtop
      - id: ions_crd
        name: Ionized coordinates
        kind: file
        path: results/structure.ions.crd
    outputs:
      - id: rand_ions_crd
        name: Randomized-ion coordinates
        kind: file
        path: results/structure.randIons.crd
      - id: rand_ions_pdb
        name: Randomized-ion structure
        kind: file
        path: results/structure.randIons.pdb
    executor: *docker_executor
    runtime:
      kind: command
      command: >-
        cpptraj_randomize_ions
        --config ${cpptraj_randomize_ions_config}
        --input_top_path ${ions_top}
        --input_crd_path ${ions_crd}
        --output_pdb_path ${rand_ions_pdb}
        --output_crd_path ${rand_ions_crd}
    target: *target

  - kind: horus_task
    id: parmed_hmassrepartition
    name: Hydrogen mass repartitioning for 4 fs timestep (parmed)
    description: Repartitions hydrogen masses so a 4 fs timestep is stable.
    inputs:
      - id: ions_top
        name: Ionized topology
        kind: file
        path: results/structure.ions.parmtop
    outputs:
      - id: top_4fs
        name: 4 fs-timestep topology
        kind: file
        path: results/structure.leap.4fs.top
    executor: *docker_executor
    runtime:
      kind: command
      command: >-
        parmed_hmassrepartition
        --input_top_path ${ions_top}
        --output_top_path ${top_4fs}
    target: *target

  - kind: horus_task
    id: sander_eq1
    name: Equilibration step 1 - Minimization with restraints (sander)
    description: Runs equilibration step 1 (minimization with restraints) with sander.
    inputs:
      - id: sander_eq1_config
        name: Eq1 sander config
        description: Parameters for equilibration step 1 (minimization with restraints).
        kind: file
        path: configs/sander_eq1.yaml
      - id: top_4fs
        name: 4 fs-timestep topology
        kind: file
        path: results/structure.leap.4fs.top
      - id: step1_mdin
        name: Equilibration step 1 mdin
        description: AMBER sander input file for equilibration step 1.
        kind: file
        path: ABCix_config_files/step1.in
      - id: rand_ions_crd
        name: Randomized-ion coordinates
        kind: file
        path: results/structure.randIons.crd
    outputs:
      - id: eq1_traj
        name: Eq1 trajectory
        kind: file
        path: results/sander.eq1.nc
      - id: eq1_rst
        name: Eq1 restart
        kind: file
        path: results/sander.eq1.ncrst
      - id: eq1_log
        name: Eq1 log
        kind: file
        path: results/sander.eq1.log
      - id: eq1_mdinfo
        name: Eq1 run info
        kind: file
        path: results/sander.eq1.mdinfo
    executor: *docker_executor
    runtime:
      kind: command
      command: >-
        sander_mdrun
        --config ${sander_eq1_config}
        --input_top_path ${top_4fs}
        --input_mdin_path ${step1_mdin}
        --input_crd_path ${rand_ions_crd}
        --input_ref_path ${rand_ions_crd}
        --output_traj_path ${eq1_traj}
        --output_rst_path ${eq1_rst}
        --output_log_path ${eq1_log}
        --output_mdinfo_path ${eq1_mdinfo}
    target: *target

  - kind: horus_task
    id: process_eq1
    name: Extract eq1 minimization energy (process_minout)
    description: Extracts minimization energy from the eq1 sander log.
    inputs:
      - id: process_eq1_config
        name: Eq1 energy extraction config
        description: Parameters for extracting minimization energy from the eq1 log.
        kind: file
        path: configs/process_eq1.yaml
      - id: eq1_log
        name: Eq1 log
        kind: file
        path: results/sander.eq1.log
    outputs:
      - id: eq1_dat
        name: Eq1 minimization energy (dat)
        kind: file
        path: results/sander.eq1.energy.dat
    executor: *docker_executor
    runtime:
      kind: command
      command: >-
        process_minout
        --config ${process_eq1_config}
        --input_log_path ${eq1_log}
        --output_dat_path ${eq1_dat}
    target: *target

  - kind: horus_task
    id: sander_eq2
    name: Equilibration step 2 - Heating with restraints (sander)
    description: Runs equilibration step 2 (heating with restraints) with sander.
    inputs:
      - id: sander_eq2_config
        name: Eq2 sander config
        description: Parameters for equilibration step 2 (heating with restraints).
        kind: file
        path: configs/sander_eq2.yaml
      - id: top_4fs
        name: 4 fs-timestep topology
        kind: file
        path: results/structure.leap.4fs.top
      - id: step2_mdin
        name: Equilibration step 2 mdin
        description: AMBER sander input file for equilibration step 2.
        kind: file
        path: ABCix_config_files/step2.in
      - id: eq1_rst
        name: Eq1 restart
        kind: file
        path: results/sander.eq1.ncrst
    outputs:
      - id: eq2_traj
        name: Eq2 trajectory
        kind: file
        path: results/sander.eq2.nc
      - id: eq2_rst
        name: Eq2 restart
        kind: file
