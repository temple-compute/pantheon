kind: horus_workflow
name: DNA Helical Parameters Analysis

_docker_executor: &docker_executor
  kind: docker
  image: quay.io/biocontainers/biobb_dna:5.2.1--pyhdfd78af_0

artifacts:
  - id: traj
    name: MD trajectory
    description: Stripped molecular dynamics trajectory of the DNA system.
    kind: file
    path: TRAJ/structure.stripped.nc

  - id: top
    name: Topology
    description: Stripped topology matching the trajectory.
    kind: file
    path: TRAJ/structure.stripped.top

  - &sequence
    id: sequence
    name: DNA sequence (strand 1, 5'->3')
    description: >-
      Sequence of the first strand in the trajectory, 5' to 3'; sets the
      Curves+ strand ranges and labels every helical parameter. Default: the
      Drew-Dickerson dodecamer CGCGAATTCGCG.
    kind: string
    path: params/sequence.txt
    value: CGCGAATTCGCG
    pattern: '[ACGT]{5,200}'

  - &bp_step
    id: bp_step
    name: Base-pair step / base pair index
    description: >-
      Position whose time series feed the stiffness, bimodality and
      helical-parameter correlation tasks: base-pair step i (bases i, i+1)
      for shift/slide/rise/tilt/roll/twist and base pair i for
      shear/stretch/stagger/buckle/propel/opening. Valid from 2 to the
      sequence length minus 2. Default 3.
    kind: number
    path: params/bp_step.txt
    value: 3
    min: 2
    max: 10
    step: 1

tasks:
  # ── Step 1: Curves+ ─────────────────────────────────────────────────────────
  - kind: horus_task
    id: curves
    name: Run Curves+ helical parameter extraction
    description: Runs Curves+ to extract raw helical parameters from the trajectory.
    inputs:
      - *sequence
      - id: traj
        name: MD trajectory
        description: Stripped molecular dynamics trajectory of the DNA system.
        kind: file
        path: TRAJ/structure.stripped.nc
      - id: top
        name: Topology
        description: Stripped topology matching the trajectory.
        kind: file
        path: TRAJ/structure.stripped.top
    outputs:
      - id: curves_lis
        name: Curves+ output (lis)
        kind: file
        path: results/curves.out.lis
      - id: curves_cda
        name: Curves+ output (cda)
        kind: file
        path: results/curves.out.cda
    resources:
      cpus: 2
      memory_gb: 8
      walltime: "02:00:00"
    executor: *docker_executor
    runtime:
      kind: command
      command: >-
        N=$$(printf %s ${sequence} | wc -c) &&
        biobb_curves
        --config "{\"properties\":{\"s1range\":\"1:$$N\",\"s2range\":\"$$((2*$$N)):$$(($$N+1))\"}}"
        --input_struc_path ${traj}
        --input_top_path ${top}
        --output_lis_path ${curves_lis}
        --output_cda_path ${curves_cda}
    target:
      kind: local

  # ── Step 2: Canal ────────────────────────────────────────────────────────────
  - kind: horus_task
    id: canal
    name: Run Canal to generate time series and histograms
    description: Runs Canal to split the Curves+ output into one time series per helical parameter.
    inputs:
      - id: curves_cda
        name: Curves+ output (cda)
        kind: file
        path: results/curves.out.cda
      - id: curves_lis
        name: Curves+ output (lis)
        kind: file
        path: results/curves.out.lis
    outputs:
