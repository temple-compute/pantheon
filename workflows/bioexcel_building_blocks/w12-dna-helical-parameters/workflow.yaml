        kind: file
        path: results/canal_out/canal_output_slide.ser
      - id: canal_tilt_ser
        name: Tilt series (tilt.ser)
        description: Canal per-frame time series for tilt.
        kind: file
        path: results/canal_out/canal_output_tilt.ser
      - id: canal_shear_ser
        name: Shear series (shear.ser)
        description: Canal per-frame time series for shear.
        kind: file
        path: results/canal_out/canal_output_shear.ser
      - id: canal_stretch_ser
        name: Stretch series (stretch.ser)
        description: Canal per-frame time series for stretch.
        kind: file
        path: results/canal_out/canal_output_stretch.ser
      - id: canal_stagger_ser
        name: Stagger series (stagger.ser)
        description: Canal per-frame time series for stagger.
        kind: file
        path: results/canal_out/canal_output_stagger.ser
      - id: canal_buckle_ser
        name: Buckle series (buckle.ser)
        description: Canal per-frame time series for buckle.
        kind: file
        path: results/canal_out/canal_output_buckle.ser
      - id: canal_propel_ser
        name: Propeller series (propel.ser)
        description: Canal per-frame time series for propeller.
        kind: file
        path: results/canal_out/canal_output_propel.ser
      - id: canal_opening_ser
        name: Opening series (opening.ser)
        description: Canal per-frame time series for opening.
        kind: file
        path: results/canal_out/canal_output_opening.ser
      - id: canal_inclin_ser
