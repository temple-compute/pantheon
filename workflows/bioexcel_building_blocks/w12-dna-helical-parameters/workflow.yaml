        description: Canal per-frame time series for y-displacement.
        kind: file
        path: results/canal_out/canal_output_ydisp.ser
      - id: canal_majd_ser
        name: Major groove depth series (majd.ser)
        description: Canal per-frame time series for major groove depth.
        kind: file
        path: results/canal_out/canal_output_majd.ser
      - id: canal_majw_ser
        name: Major groove width series (majw.ser)
        description: Canal per-frame time series for major groove width.
        kind: file
        path: results/canal_out/canal_output_majw.ser
      - id: canal_mind_ser
        name: Minor groove depth series (mind.ser)
        description: Canal per-frame time series for minor groove depth.
        kind: file
        path: results/canal_out/canal_output_mind.ser
      - id: canal_minw_ser
        name: Minor groove width series (minw.ser)
        description: Canal per-frame time series for minor groove width.
        kind: file
        path: results/canal_out/canal_output_minw.ser
      - id: canal_alphaC_ser
        name: Alpha torsion (Crick strand) series (alphaC.ser)
        description: Canal per-frame time series for alpha torsion (crick strand).
        kind: file
        path: results/canal_out/canal_output_alphaC.ser
      - id: canal_alphaW_ser
        name: Alpha torsion (Watson strand) series (alphaW.ser)
        description: Canal per-frame time series for alpha torsion (watson strand).
        kind: file
        path: results/canal_out/canal_output_alphaW.ser
      - id: canal_betaC_ser
        name: Beta torsion (Crick strand) series (betaC.ser)
        description: Canal per-frame time series for beta torsion (crick strand).
        kind: file
        path: results/canal_out/canal_output_betaC.ser
      - id: canal_betaW_ser
        name: Beta torsion (Watson strand) series (betaW.ser)
        description: Canal per-frame time series for beta torsion (watson strand).
        kind: file
        path: results/canal_out/canal_output_betaW.ser
      - id: canal_gammaC_ser
        name: Gamma torsion (Crick strand) series (gammaC.ser)
        description: Canal per-frame time series for gamma torsion (crick strand).
        kind: file
        path: results/canal_out/canal_output_gammaC.ser
      - id: canal_gammaW_ser
        name: Gamma torsion (Watson strand) series (gammaW.ser)
        description: Canal per-frame time series for gamma torsion (watson strand).
        kind: file
        path: results/canal_out/canal_output_gammaW.ser
      - id: canal_deltaC_ser
        name: Delta torsion (Crick strand) series (deltaC.ser)
        description: Canal per-frame time series for delta torsion (crick strand).
        kind: file
        path: results/canal_out/canal_output_deltaC.ser
      - id: canal_deltaW_ser
        name: Delta torsion (Watson strand) series (deltaW.ser)
        description: Canal per-frame time series for delta torsion (watson strand).
        kind: file
        path: results/canal_out/canal_output_deltaW.ser
      - id: canal_epsilC_ser
        name: Epsilon torsion (Crick strand) series (epsilC.ser)
        description: Canal per-frame time series for epsilon torsion (crick strand).
        kind: file
        path: results/canal_out/canal_output_epsilC.ser
      - id: canal_epsilW_ser
        name: Epsilon torsion (Watson strand) series (epsilW.ser)
        description: Canal per-frame time series for epsilon torsion (watson strand).
        kind: file
        path: results/canal_out/canal_output_epsilW.ser
      - id: canal_zetaC_ser
        name: Zeta torsion (Crick strand) series (zetaC.ser)
        description: Canal per-frame time series for zeta torsion (crick strand).
        kind: file
        path: results/canal_out/canal_output_zetaC.ser
      - id: canal_zetaW_ser
        name: Zeta torsion (Watson strand) series (zetaW.ser)
        description: Canal per-frame time series for zeta torsion (watson strand).
        kind: file
        path: results/canal_out/canal_output_zetaW.ser
      - id: canal_chiC_ser
        name: Chi torsion (Crick strand) series (chiC.ser)
        description: Canal per-frame time series for chi torsion (crick strand).
        kind: file
        path: results/canal_out/canal_output_chiC.ser
      - id: canal_chiW_ser
        name: Chi torsion (Watson strand) series (chiW.ser)
        description: Canal per-frame time series for chi torsion (watson strand).
        kind: file
        path: results/canal_out/canal_output_chiW.ser
      - id: canal_phaseC_ser
        name: Sugar phase angle (Crick strand) series (phaseC.ser)
        description: Canal per-frame time series for sugar phase angle (crick strand).
        kind: file
        path: results/canal_out/canal_output_phaseC.ser
      - id: canal_phaseW_ser
        name: Sugar phase angle (Watson strand) series (phaseW.ser)
        description: Canal per-frame time series for sugar phase angle (watson strand).
        kind: file
        path: results/canal_out/canal_output_phaseW.ser
    executor: *docker_executor
    runtime:
      kind: command
      command: >-
        biobb_canal
        --config ${canal_config}
        --input_cda_file ${curves_cda}
        --input_lis_file ${curves_lis}
        --output_zip_path ${canal_zip}
        && unzip -o ${canal_zip} -d results/canal_out
    target:
      kind: local

  # ── Averages: Base Pair Step parameters ─────────────────────────────────────
  - kind: horus_task
    id: avg_rise
    name: Average helical parameters - Rise
    description: Computes the trajectory average and distribution plot for rise.
    inputs:
      - id: avg_rise_config
        name: Rise averaging config
        description: Averaging parameters for the rise helical parameter.
        kind: file
        path: configs/avg_rise.yaml
      - id: canal_rise_ser
        name: Rise series (rise.ser)
        description: Canal per-frame time series for rise.
        kind: file
        path: results/canal_out/canal_output_rise.ser
    outputs:
      - id: avg_rise_csv
        name: Rise averages (CSV)
        kind: file
        path: results/rise.averages.csv
      - id: avg_rise_jpg
        name: Rise averages plot
        kind: file
        path: results/rise.averages.jpg
    executor: *docker_executor
    runtime:
      kind: command
      command: >-
        dna_averages
        --config ${avg_rise_config}
        --input_ser_path ${canal_rise_ser}
        --output_csv_path ${avg_rise_csv}
        --output_jpg_path ${avg_rise_jpg}
    target:
      kind: local

  - kind: horus_task
    id: avg_roll
    name: Average helical parameters - Roll
    description: Computes the trajectory average and distribution plot for roll.
