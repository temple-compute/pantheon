tasks:
  # ── Step 1: Curves+ ─────────────────────────────────────────────────────────
  - kind: horus_task
    id: curves
    name: Run Curves+ helical parameter extraction
    description: Runs Curves+ to extract raw helical parameters from the trajectory.
    inputs:
      - id: curves_config
        name: Curves+ config
        description: Parameters for the Curves+ helical parameter extraction run.
        kind: file
        path: configs/curves.yaml
      - id: traj
        name: MD trajectory
        description: Stripped molecular dynamics trajectory of the DNA system.
        kind: file
        path: TRAJ/structure.stripped.nc
      - id: top
        name: Topology
        description: Stripped topology matching the trajectory.
        kind: file
        path: TRAJ/structure.stripped.top
    outputs:
      - id: curves_lis
        name: Curves+ output (lis)
        kind: file
        path: results/curves.out.lis
      - id: curves_cda
        name: Curves+ output (cda)
        kind: file
        path: results/curves.out.cda
    executor: *docker_executor
    runtime:
      kind: command
      command: >-
        biobb_curves
        --config ${curves_config}
        --input_struc_path ${traj}
        --input_top_path ${top}
        --output_lis_path ${curves_lis}
        --output_cda_path ${curves_cda}
    target:
      kind: local

  # ── Step 2: Canal ────────────────────────────────────────────────────────────
  - kind: horus_task
    id: canal
    name: Run Canal to generate time series and histograms
    description: Runs Canal to split the Curves+ output into one time series per helical parameter.
    inputs:
      - id: canal_config
        name: Canal config
        description: Parameters for extracting per-parameter time series from Curves+ output.
        kind: file
        path: configs/canal.yaml
      - id: curves_cda
        name: Curves+ output (cda)
        kind: file
        path: results/curves.out.cda
      - id: curves_lis
        name: Curves+ output (lis)
        kind: file
        path: results/curves.out.lis
    outputs:
      - id: canal_zip
        name: Canal output (zip)
        description: Packed per-parameter time series produced by Canal.
        kind: file
        path: results/canal.out.zip
      - id: canal_rise_ser
        name: Rise series (rise.ser)
        description: Canal per-frame time series for rise.
        kind: file
        path: results/canal_out/canal_output_rise.ser
      - id: canal_roll_ser
        name: Roll series (roll.ser)
        description: Canal per-frame time series for roll.
        kind: file
        path: results/canal_out/canal_output_roll.ser
      - id: canal_twist_ser
        name: Twist series (twist.ser)
        description: Canal per-frame time series for twist.
        kind: file
        path: results/canal_out/canal_output_twist.ser
      - id: canal_shift_ser
        name: Shift series (shift.ser)
        description: Canal per-frame time series for shift.
        kind: file
        path: results/canal_out/canal_output_shift.ser
      - id: canal_slide_ser
        name: Slide series (slide.ser)
