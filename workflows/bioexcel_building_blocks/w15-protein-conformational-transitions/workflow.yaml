kind: horus_workflow
name: Protein Conformational Transitions (GOdMD)

_executor: &executor
  kind: conda_python_environment
  environment_dir: "../.horus_conda_env"
  conda: micromamba
  environment_file: conda_env.yaml

artifacts:
  - id: origin_pdb_id
    name: Origin structure PDB ID
    description: 4-character PDB code to download (default 1ake). Leave empty to use the uploaded
      origin structure instead.
    kind: string
    pattern: ([0-9][A-Za-z0-9]{3})?
    max_length: 4
    value: 1ake
    path: params/origin_pdb_id.txt

  - id: origin_structure
    name: Origin structure (PDB upload)
    description: 'PDB file used when origin_pdb_id is empty. Default: 1AKE from the RCSB PDB.'
    kind: file
    path: examples/1ake.pdb

  - id: target_pdb_id
    name: Target structure PDB ID
    description: 4-character PDB code to download (default 4ake). Leave empty to use the uploaded
      target structure instead.
    kind: string
    pattern: ([0-9][A-Za-z0-9]{3})?
    max_length: 4
    value: 4ake
    path: params/target_pdb_id.txt

  - id: target_structure
    name: Target structure (PDB upload)
    description: 'PDB file used when target_pdb_id is empty. Default: 4AKE from the RCSB PDB.'
    kind: file
    path: examples/4ake.pdb

  - id: origin_chain
    name: Origin chain
    description: Chain of the origin structure to use.
    kind: string
    pattern: '[A-Za-z0-9]'
    max_length: 1
    value: A
    path: params/origin_chain.txt

  - id: target_chain
    name: Target chain
    description: Chain of the target structure to use.
    kind: string
    pattern: '[A-Za-z0-9]'
    max_length: 1
    value: A
    path: params/target_chain.txt

  - id: ligand_to_remove
    name: Ligand to remove
    description: Residue name of the ligand removed from the origin structure (AP5 in 1AKE).
    kind: string
    pattern: '[A-Za-z0-9]{1,3}'
    max_length: 3
    value: AP5
    path: params/ligand_to_remove.txt

  - id: temperature_k
    name: GOdMD temperature (K)
    description: Simulation temperature of the discrete MD run.
    kind: number
    min: 200
    max: 600
    step: 10
    value: 400
    path: params/temperature_k.txt

  - id: cpptraj_convert_config
    name: Trajectory conversion config
    description: Configuration controlling how cpptraj converts the GoDMD trajectory to XTC format.
    kind: file
    path: configs/cpptraj_convert.yaml

  - id: godmd_prep_config
    name: GoDMD prep config
    description: Configuration controlling the EMBOSS alignment used to compute the origin-target residue mapping.
    kind: file
    path: configs/godmd_prep.yaml

tasks:
  - kind: horus_task
    id: fetch_pdb_origin
    name: Fetch or upload the origin structure
    description: Downloads the closed-state adenylate kinase structure (PDB 1AKE) from the RCSB.
    inputs:
      - id: origin_structure
        name: Origin structure (PDB upload)
        kind: file
        path: examples/1ake.pdb
      - id: origin_pdb_id
        name: Origin structure PDB ID
        kind: string
        path: params/origin_pdb_id.txt
    outputs:
      - id: origin_pdb
        name: Origin structure (1AKE)
        kind: file
        path: results/1ake.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        if [ -n ${origin_pdb_id} ];
        then pdb --config '{"properties":{"pdb_code":"${origin_pdb_id}","filter":false}}' --output_pdb_path ${origin_pdb};
        else cp ${origin_structure} ${origin_pdb}; fi
    target:
      kind: local

  - kind: horus_task
    id: fetch_pdb_target
    name: Fetch or upload the target structure
    description: Downloads the open-state adenylate kinase structure (PDB 4AKE) from the RCSB.
    inputs:
      - id: target_structure
        name: Target structure (PDB upload)
        kind: file
        path: examples/4ake.pdb
      - id: target_pdb_id
        name: Target structure PDB ID
        kind: string
        path: params/target_pdb_id.txt
    outputs:
      - id: target_pdb
        name: Target structure (4AKE)
        kind: file
        path: results/4ake.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        if [ -n ${target_pdb_id} ];
        then pdb --config '{"properties":{"pdb_code":"${target_pdb_id}","filter":false}}' --output_pdb_path ${target_pdb};
        else cp ${target_structure} ${target_pdb}; fi
    target:
      kind: local

  - kind: horus_task
    id: extract_chain_origin
    name: Extract the origin chain
    description: Extracts chain A from the origin structure using the biobb extract_chain tool.
    inputs:
      - id: origin_chain
        name: Origin chain
        kind: string
        path: params/origin_chain.txt
      - id: origin_pdb
        name: Origin structure (1AKE)
        kind: file
        path: results/1ake.pdb
    outputs:
      - id: origin_chain_pdb
        name: Origin chain A structure
        kind: file
        path: results/1ake.chains.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        extract_chain
        --config '{"properties":{"chains":["${origin_chain}"]}}'
        --input_structure_path ${origin_pdb}
        --output_structure_path ${origin_chain_pdb}
    target:
      kind: local

  - kind: horus_task
    id: extract_chain_target
    name: Extract the target chain
    description: Extracts chain A from the target structure using the biobb extract_chain tool.
    inputs:
      - id: target_chain
        name: Target chain
        kind: string
        path: params/target_chain.txt
      - id: target_pdb
        name: Target structure (4AKE)
        kind: file
        path: results/4ake.pdb
    outputs:
      - id: target_chain_pdb
        name: Target chain A structure
        kind: file
        path: results/4ake.chains.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        extract_chain
        --config '{"properties":{"chains":["${target_chain}"]}}'
        --input_structure_path ${target_pdb}
        --output_structure_path ${target_chain_pdb}
    target:
      kind: local

  - kind: horus_task
    id: remove_molecules_origin
    name: Remove the bound ligand from the origin structure
    description: Strips the AP5 inhibitor ligand/heteroatom from the origin structure using the biobb remove_molecules tool.
    inputs:
      - id: ligand_to_remove
        name: Ligand to remove
        kind: string
        path: params/ligand_to_remove.txt
      - id: origin_chain_pdb
        name: Origin chain A structure
        kind: file
        path: results/1ake.chains.pdb
    outputs:
      - id: origin_nolig_pdb
        name: Origin structure without ligand
        kind: file
        path: results/1ake.chains.nolig.pdb
    executor: *executor
    runtime:
      kind: command
      command: >-
        remove_molecules
        --config '{"properties":{"molecules":[{"name":"${ligand_to_remove}"}]}}'
        --input_structure_path ${origin_chain_pdb}
        --output_molecules_path ${origin_nolig_pdb}
    target:
      kind: local

  - kind: horus_task
    id: godmd_prep
    name: Compute residue mapping between origin and target (EMBOSS water alignment)
    description: Aligns the origin and target sequences with the EMBOSS water tool to compute the residue mapping GoDMD needs.
    inputs:
      - id: godmd_prep_config
        name: GoDMD prep config
        kind: file
        path: configs/godmd_prep.yaml
      - id: origin_nolig_pdb
        name: Origin structure without ligand
        kind: file
        path: results/1ake.chains.nolig.pdb
      - id: target_chain_pdb
        name: Target chain A structure
        kind: file
        path: results/4ake.chains.pdb
    outputs:
      - id: origin_aln
        name: Origin sequence alignment
        kind: file
        path: results/1ake.aln
      - id: target_aln
        name: Target sequence alignment
        kind: file
        path: results/4ake.aln
    executor: *executor
    runtime:
      kind: command
      command: >-
        godmd_prep
        --config ${godmd_prep_config}
        --input_pdb_orig_path ${origin_nolig_pdb}
        --input_pdb_target_path ${target_chain_pdb}
        --output_aln_orig_path ${origin_aln}
        --output_aln_target_path ${target_aln}
    target:
      kind: local

  - kind: horus_task
    id: godmd_run
    name: Run the GOdMD transition simulation (origin → target)
    description: Runs the GoDMD discrete-molecular-dynamics/Maxwell-Demon simulation to generate the transition trajectory from the closed to the open state.
    inputs:
      - id: temperature_k
        name: GOdMD temperature (K)
        kind: number
        path: params/temperature_k.txt
      - id: origin_nolig_pdb
        name: Origin structure without ligand
        kind: file
        path: results/1ake.chains.nolig.pdb
      - id: target_chain_pdb
        name: Target chain A structure
        kind: file
        path: results/4ake.chains.pdb
      - id: origin_aln
        name: Origin sequence alignment
        kind: file
        path: results/1ake.aln
      - id: target_aln
        name: Target sequence alignment
        kind: file
        path: results/4ake.aln
    outputs:
      - id: godmd_trj
        name: GoDMD trajectory (mdcrd)
        kind: file
        path: results/1ake-4ake.godmd.mdcrd
      - id: godmd_pdb
        name: GoDMD reference structure
        kind: file
        path: results/1ake-4ake.godmd.pdb
    resources:
      cpus: 2
      memory_gb: 8
      walltime: "04:00:00"
    executor: *executor
    runtime:
      kind: command
      command: >-
        godmd_run
        --config '{"properties":{"godmdin":{"temp":${temperature_k}}}}'
        --input_pdb_orig_path ${origin_nolig_pdb}
        --input_pdb_target_path ${target_chain_pdb}
        --input_aln_orig_path ${origin_aln}
        --input_aln_target_path ${target_aln}
        --output_log_path 1ake-4ake.godmd.log
        --output_ene_path 1ake-4ake.godmd.ene.out
        --output_trj_path ${godmd_trj}
        --output_pdb_path ${godmd_pdb}
    target:
      kind: local

  - kind: horus_task
    id: cpptraj_convert
    name: Convert GoDMD trajectory from mdcrd to XTC format
    description: Converts the raw GoDMD mdcrd trajectory to XTC format for visualization using cpptraj.
    inputs:
      - id: cpptraj_convert_config
        name: Trajectory conversion config
        kind: file
        path: configs/cpptraj_convert.yaml
      - id: godmd_pdb
        name: GoDMD reference structure
        kind: file
        path: results/1ake-4ake.godmd.pdb
      - id: godmd_trj
        name: GoDMD trajectory (mdcrd)
        kind: file
        path: results/1ake-4ake.godmd.mdcrd
    outputs:
      - id: godmd_trj_xtc
        name: GoDMD trajectory (XTC)
        kind: file
        path: results/1ake-4ake.godmd.xtc
    executor: *executor
    runtime:
      kind: command
      command: >-
        cpptraj_convert
        --config ${cpptraj_convert_config}
        --input_top_path ${godmd_pdb}
        --input_traj_path ${godmd_trj}
        --output_cpptraj_path ${godmd_trj_xtc}
    target:
      kind: local

edges:
  - source: artifact-target_structure
    source_output: target_structure
    target: fetch_pdb_target
    target_input: target_structure

  - source: artifact-target_pdb_id
    source_output: target_pdb_id
    target: fetch_pdb_target
    target_input: target_pdb_id

  - source: artifact-origin_structure
    source_output: origin_structure
    target: fetch_pdb_origin
    target_input: origin_structure

  - source: artifact-origin_pdb_id
    source_output: origin_pdb_id
    target: fetch_pdb_origin
    target_input: origin_pdb_id

  - source: artifact-origin_chain
    source_output: origin_chain
    target: extract_chain_origin
    target_input: origin_chain

  - source: artifact-target_chain
    source_output: target_chain
    target: extract_chain_target
    target_input: target_chain

  - source: artifact-ligand_to_remove
    source_output: ligand_to_remove
    target: remove_molecules_origin
    target_input: ligand_to_remove

  - source: artifact-temperature_k
    source_output: temperature_k
    target: godmd_run
    target_input: temperature_k

  - source: fetch_pdb_origin
    source_output: origin_pdb
    target: extract_chain_origin
    target_input: origin_pdb

  - source: fetch_pdb_target
    source_output: target_pdb
    target: extract_chain_target
    target_input: target_pdb

  - source: extract_chain_origin
    source_output: origin_chain_pdb
    target: remove_molecules_origin
    target_input: origin_chain_pdb

  - source: extract_chain_target
    source_output: target_chain_pdb
    target: godmd_prep
    target_input: target_chain_pdb

  - source: extract_chain_target
    source_output: target_chain_pdb
    target: godmd_run
    target_input: target_chain_pdb

  - source: remove_molecules_origin
    source_output: origin_nolig_pdb
    target: godmd_prep
    target_input: origin_nolig_pdb

  - source: remove_molecules_origin
    source_output: origin_nolig_pdb
    target: godmd_run
    target_input: origin_nolig_pdb

  - source: godmd_prep
    source_output: origin_aln
    target: godmd_run
    target_input: origin_aln

  - source: godmd_prep
    source_output: target_aln
    target: godmd_run
    target_input: target_aln

  - source: godmd_run
    source_output: godmd_trj
    target: cpptraj_convert
    target_input: godmd_trj

  - source: godmd_run
    source_output: godmd_pdb
    target: cpptraj_convert
    target_input: godmd_pdb

  - source: artifact-cpptraj_convert_config
    source_output: cpptraj_convert_config
    target: cpptraj_convert
    target_input: cpptraj_convert_config

  - source: artifact-godmd_prep_config
    source_output: godmd_prep_config
    target: godmd_prep
    target_input: godmd_prep_config


orchestrator_target:
  kind: local
  working_directory: "./workflow_results"
