<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05170d"/><stop offset="1" stop-color="#0b3a20"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.2"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="64" y="64" rx="18" width="270" height="36" fill="#14532d"/>
  <text x="199" y="89" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="18" fill="#bbf7d0">W-43 · BIOINFORMATICS</text>
  <text x="64" y="190" font-family="DejaVu Sans" font-weight="bold" font-size="56" fill="#f0fdf4">Influenza</text>
  <text x="64" y="256" font-family="DejaVu Sans" font-weight="bold" font-size="56" fill="#f0fdf4">Segments Starter</text>
  <text x="64" y="316" font-family="DejaVu Sans" font-size="26" fill="#4ade80">FASTA → QC → protein → report</text>
  <text x="64" y="380" font-family="DejaVu Sans" font-size="21" fill="#a7c4b0">Upload segment FASTA and metadata;</text>
  <text x="64" y="410" font-family="DejaVu Sans" font-size="21" fill="#a7c4b0">get per-segment QC, longest-ORF</text>
  <text x="64" y="440" font-family="DejaVu Sans" font-size="21" fill="#a7c4b0">proteins and a sample × segment grid.</text>
  <text x="64" y="566" font-family="DejaVu Sans" font-size="18" fill="#5f8770">PANTHEON · TEMPLE COMPUTE</text>
  <!-- eight genome segments, longest to shortest, with a QC tick or cross -->
  <g font-family="DejaVu Sans" font-size="18" fill="#bbf7d0">
    <text x="690" y="132">PB2</text><rect x="750" y="114" width="360" height="22" rx="11" fill="#4ade80"/>
    <text x="690" y="182">PB1</text><rect x="750" y="164" width="360" height="22" rx="11" fill="#4ade80"/>
    <text x="690" y="232">PA</text><rect x="750" y="214" width="340" height="22" rx="11" fill="#4ade80"/>
    <text x="690" y="282">HA</text><rect x="750" y="264" width="270" height="22" rx="11" fill="#facc15"/>
    <text x="690" y="332">NP</text><rect x="750" y="314" width="240" height="22" rx="11" fill="#4ade80"/>
    <text x="690" y="382">NA</text><rect x="750" y="364" width="220" height="22" rx="11" fill="#f87171"/>
    <text x="690" y="432">MP</text><rect x="750" y="414" width="155" height="22" rx="11" fill="#4ade80"/>
    <text x="690" y="482">NS</text><rect x="750" y="464" width="135" height="22" rx="11" fill="#4ade80"/>
  </g>
  <!-- ambiguous bases on HA, truncation on NA -->
  <g fill="#05170d"><rect x="880" y="268" width="6" height="14"/><rect x="900" y="268" width="6" height="14"/><rect x="935" y="268" width="6" height="14"/></g>
  <g font-family="DejaVu Sans" font-weight="bold" font-size="22">
    <text x="1130" y="133" fill="#4ade80">✓</text><text x="1130" y="183" fill="#4ade80">✓</text>
    <text x="1130" y="233" fill="#4ade80">✓</text><text x="1130" y="283" fill="#facc15">N</text>
    <text x="1130" y="333" fill="#4ade80">✓</text><text x="1130" y="383" fill="#f87171">✗</text>
    <text x="1130" y="433" fill="#4ade80">✓</text><text x="1130" y="483" fill="#4ade80">✓</text>
  </g>
  <text x="750" y="540" font-family="DejaVu Sans Mono" font-size="20" fill="#86efac">ATG AAG GCA → M K A …</text>
</svg>
