kind: horus_workflow
name: Tiny LLM From Scratch - TinyStories Pretrain & Sample

_executor: &executor
  kind: conda_python_environment
  environment_dir: "../.horus_conda_env"
  conda: micromamba
  environment_file: conda_env.yaml

_shell: &shell
  kind: shell

artifacts:
  - id: prepare_tinystories_script
    name: TinyStories prep script
    path: scripts/prepare_tinystories.py
    kind: file

tasks:
  - kind: horus_task
    id: clone_repo
    name: Clone train-llm-from-scratch
    description: Shallow-clones the training repo so its scripts/src modules are on disk.
    outputs:
      - id: repo_dir
        name: Repository checkout
        kind: folder
        path: repo
    executor: *shell
    runtime:
      kind: command
      command: >-
        git clone --depth 1
        https://github.com/FareedKhan-dev/train-llm-from-scratch.git
        $repo_dir
    target:
      kind: local

  - kind: horus_task
    id: prepare_tinystories_train
    name: Prepare TinyStories train split
    description: >-
      Downloads TinyStories from Hugging Face and batch-tokenizes it into a
      flat-token HDF5, capped to a small doc count for a fast tiny run.
    inputs:
      - id: repo_dir
        name: Repository checkout
        kind: folder
        path: repo
      - id: prepare_tinystories_script
        name: TinyStories prep script
        kind: file
        path: scripts/prepare_tinystories.py
    outputs:
      - id: tinystories_train_h5
        name: TinyStories train tokens
        kind: file
        path: data/tinystories_train.h5
    executor: *executor
    runtime:
      kind: command
      command: >-
        HF_HOME=data/hf_cache python $prepare_tinystories_script
        --split train
        --max_docs 20000
        --out $tinystories_train_h5
    target:
      kind: local

  - kind: horus_task
    id: prepare_tinystories_val
    name: Prepare TinyStories validation split
    description: >-
      Downloads the TinyStories validation split and batch-tokenizes it into a
      flat-token HDF5, capped to a small doc count for a fast tiny run.
    inputs:
      - id: repo_dir
        name: Repository checkout
        kind: folder
        path: repo
      - id: prepare_tinystories_script
        name: TinyStories prep script
        kind: file
        path: scripts/prepare_tinystories.py
    outputs:
      - id: tinystories_val_h5
        name: TinyStories validation tokens
        kind: file
        path: data/tinystories_val.h5
    executor: *executor
    runtime:
      kind: command
      command: >-
        HF_HOME=data/hf_cache python $prepare_tinystories_script
        --split validation
        --max_docs 2000
        --out $tinystories_val_h5
    target:
      kind: local

  - kind: horus_task
    id: train_pretrain_tiny
    name: Pretrain tiny model on TinyStories
    description: >-
      Trains the from-scratch decoder-only Transformer on tokenized TinyStories,
      using the repo's smoke-scale model/step-count config for a fast local run.
    inputs:
      - id: repo_dir
        name: Repository checkout
        kind: folder
        path: repo
      - id: tinystories_train_h5
        name: TinyStories train tokens
        kind: file
        path: data/tinystories_train.h5
      - id: tinystories_val_h5
        name: TinyStories validation tokens
        kind: file
        path: data/tinystories_val.h5
    outputs:
      - id: pretrained_ckpt
        name: Pretrained tiny checkpoint
        kind: file
        path: ckpts/tinystories_pretrained.pt
      - id: pretrain_log
        name: Pretraining metrics log
        kind: file
        path: logs/pretrain.jsonl
    executor: *executor
    runtime:
      kind: command
      command: >-
        PYTHONPATH=${repo_dir} python ${repo_dir}/scripts/pretrain_base.py
        --config ${repo_dir}/configs/smoke/pretrain.json
        --train_path $tinystories_train_h5
        --dev_path $tinystories_val_h5
        --out_ckpt $pretrained_ckpt
        --ckpt_dir ckpts
        --log_dir logs
    target:
      kind: local

  - kind: horus_task
    id: sample_story
    name: Sample a story from the pretrained model
    description: >-
      Runs raw (non-chat) greedy generation from the pretrained checkpoint to
      spot-check that it learned to continue a story prompt.
    inputs:
      - id: repo_dir
        name: Repository checkout
        kind: folder
        path: repo
      - id: pretrained_ckpt
        name: Pretrained tiny checkpoint
        kind: file
        path: ckpts/tinystories_pretrained.pt
    outputs:
      - id: sample_story_txt
        name: Sample generated story
        kind: file
        path: samples/tinystories_sample.txt
    executor: *executor
    runtime:
      kind: command
      command: >-
        PYTHONPATH=${repo_dir} python ${repo_dir}/scripts/chat.py
        --ckpt $pretrained_ckpt
        --raw
        --greedy
        --prompt "Once upon a time,"
        --max_new_tokens 200
        > $sample_story_txt
    target:
      kind: local

edges:
  - source: clone_repo
    source_output: repo_dir
    target: prepare_tinystories_train
    target_input: repo_dir

  - source: clone_repo
    source_output: repo_dir
    target: prepare_tinystories_val
    target_input: repo_dir

  - source: clone_repo
    source_output: repo_dir
    target: train_pretrain_tiny
    target_input: repo_dir

  - source: prepare_tinystories_train
    source_output: tinystories_train_h5
    target: train_pretrain_tiny
    target_input: tinystories_train_h5

  - source: prepare_tinystories_val
    source_output: tinystories_val_h5
    target: train_pretrain_tiny
    target_input: tinystories_val_h5

  - source: clone_repo
    source_output: repo_dir
    target: sample_story
    target_input: repo_dir

  - source: train_pretrain_tiny
    source_output: pretrained_ckpt
    target: sample_story
    target_input: pretrained_ckpt

  - source: artifact-prepare_tinystories_script
    source_output: prepare_tinystories_script
    target: prepare_tinystories_train
    target_input: prepare_tinystories_script

  - source: artifact-prepare_tinystories_script
    source_output: prepare_tinystories_script
    target: prepare_tinystories_val
    target_input: prepare_tinystories_script

orchestrator_target:
  kind: local
  working_directory: "./workflow_results"
