<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120a24"/><stop offset="1" stop-color="#2a1450"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.25"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pk" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="64" y="64" rx="18" width="300" height="36" fill="#3b1f6e"/>
  <text x="214" y="89" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="18" fill="#c4b5fd">W-33 · DRUG DISCOVERY</text>
  <text x="64" y="190" font-family="DejaVu Sans" font-weight="bold" font-size="56" fill="#f5f3ff">Cryptic Pocket</text>
  <text x="64" y="256" font-family="DejaVu Sans" font-weight="bold" font-size="56" fill="#f5f3ff">Discovery</text>
  <text x="64" y="316" font-family="DejaVu Sans" font-size="26" fill="#a78bfa">Lacuna · ensemble pocket search</text>
  <text x="64" y="380" font-family="DejaVu Sans" font-size="21" fill="#b8b0d0">Upload a structure or fetch it by PDB ID;</text>
  <text x="64" y="410" font-family="DejaVu Sans" font-size="21" fill="#b8b0d0">find the pockets that only open across a</text>
  <text x="64" y="440" font-family="DejaVu Sans" font-size="21" fill="#b8b0d0">conformational ensemble, ranked.</text>
  <text x="64" y="566" font-family="DejaVu Sans" font-size="18" fill="#7c6f9c">PANTHEON · TEMPLE COMPUTE</text>
  <!-- three conformers: pocket closed -> open -->
  <g font-family="DejaVu Sans" font-size="16" fill="#c4b5fd" text-anchor="middle">
    <g transform="translate(730,320)">
      <path d="M-70,80 C-90,0 -60,-80 0,-85 C60,-80 90,0 70,80 Z" fill="#3b1f6e" stroke="#a78bfa" stroke-width="4"/>
      <path d="M-30,-82 C-10,-70 10,-70 30,-82" fill="none" stroke="#c4b5fd" stroke-width="4"/>
      <text y="120">closed</text>
    </g>
    <g transform="translate(890,320)">
      <path d="M-70,80 C-90,0 -60,-80 -20,-85 C-10,-50 10,-50 20,-85 C60,-80 90,0 70,80 Z" fill="#3b1f6e" stroke="#a78bfa" stroke-width="4"/>
      <circle cy="-60" r="22" fill="url(#pk)"/>
      <text y="120">opening</text>
    </g>
    <g transform="translate(1050,320)">
      <path d="M-70,80 C-90,0 -60,-80 -35,-85 C-25,-20 25,-20 35,-85 C60,-80 90,0 70,80 Z" fill="#3b1f6e" stroke="#a78bfa" stroke-width="4"/>
      <circle cy="-45" r="38" fill="url(#pk)"/>
      <circle cy="-45" r="7" fill="#fbbf24"/>
      <text y="120">open</text>
    </g>
  </g>
</svg>
