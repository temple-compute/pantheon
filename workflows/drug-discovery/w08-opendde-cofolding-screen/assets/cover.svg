<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120a24"/><stop offset="1" stop-color="#2a1450"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.25"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="64" y="64" rx="18" width="300" height="36" fill="#3b1f6e"/>
  <text x="214" y="89" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="18" fill="#c4b5fd">W-36 · DRUG DISCOVERY</text>
  <text x="64" y="190" font-family="DejaVu Sans" font-weight="bold" font-size="56" fill="#f5f3ff">OpenDDE</text>
  <text x="64" y="256" font-family="DejaVu Sans" font-weight="bold" font-size="56" fill="#f5f3ff">Co-folding Screen</text>
  <text x="64" y="316" font-family="DejaVu Sans" font-size="26" fill="#a78bfa">All-atom protein–ligand co-folding</text>
  <text x="64" y="380" font-family="DejaVu Sans" font-size="21" fill="#b8b0d0">Upload a protein sequence and a SMILES</text>
  <text x="64" y="410" font-family="DejaVu Sans" font-size="21" fill="#b8b0d0">library; OpenDDE co-folds each complex</text>
  <text x="64" y="440" font-family="DejaVu Sans" font-size="21" fill="#b8b0d0">and ranks them by interface confidence.</text>
  <text x="64" y="566" font-family="DejaVu Sans" font-size="18" fill="#7c6f9c">PANTHEON · TEMPLE COMPUTE</text>
  <!-- sequence strip -->
  <g font-family="DejaVu Sans Mono" font-size="20" fill="#7c6f9c">
    <text x="700" y="140">MTEYKLVVVGAGGVGKSALT</text>
  </g>
  <path d="M790,155 L790,190" stroke="#c4b5fd" stroke-width="3" stroke-dasharray="5 5"/>
  <!-- folded helices around ligand -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M700,260 q15,-25 30,0 q15,25 30,0 q15,-25 30,0 q15,25 30,0" stroke="#a78bfa" stroke-width="14"/>
    <path d="M840,260 C900,250 930,300 900,350" stroke="#c4b5fd" stroke-width="12"/>
    <path d="M900,350 q-25,15 0,30 q25,15 0,30 q-25,15 0,30" stroke="#a78bfa" stroke-width="14"/>
    <path d="M900,440 C860,480 760,480 720,440 C690,410 700,360 730,340" stroke="#7c3aed" stroke-width="12"/>
    <path d="M730,340 l20,-10 l20,10 l20,-10" stroke="#ddd6fe" stroke-width="8"/>
  </g>
  <g transform="translate(810,375)" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linejoin="round">
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11"/>
    <line x1="19" y1="11" x2="38" y2="22"/><circle cx="44" cy="25" r="6" fill="#fbbf24" stroke="none"/>
  </g>
  <!-- confidence badge -->
  <rect x="990" y="250" width="160" height="90" rx="16" fill="#120a24" stroke="#fbbf24" stroke-width="2"/>
  <text x="1070" y="285" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#c4b5fd">ipTM</text>
  <text x="1070" y="322" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="32" fill="#fbbf24">0.87</text>
</svg>
