kind: horus_workflow
name: DrugFlow Generate + Boltz-2 Affinity

artifacts:
  - id: protein
    name: Target protein
    description: Target protein structure (PDB) defining the system to design against.
    path: examples/kras.pdb
    kind: file

  - id: ref_ligand
    name: Reference ligand
    description: Reference ligand (SDF) whose binding site defines the pocket DrugFlow
      designs into.
    path: examples/kras_ref_ligand.sdf
    kind: file

tasks:
  - kind: horus_task
    id: download_checkpoint
    name: Download the DrugFlow checkpoint
    description: Downloads the DrugFlow model checkpoint (~170 MB) from Zenodo so the workflow is self-contained. Skipped once the checkpoint file is present.
    outputs:
      - id: checkpoint
        name: DrugFlow checkpoint
        description: DrugFlow model checkpoint (.ckpt) downloaded from Zenodo.
        kind: file
        path: drugflow.ckpt
    executor:
      kind: shell
    runtime:
      # Downloaded to a .part file and moved into place only on success: a
      # half-finished download left at ${checkpoint} would satisfy
      # skip_if_complete and be reused as a corrupt checkpoint forever.
      kind: command
      command: >-
        curl -fL --retry 3 -o ${checkpoint}.part
        https://zenodo.org/records/14919171/files/drugflow.ckpt
        && mv ${checkpoint}.part ${checkpoint}
    target:
      kind: local

  - kind: horus_task
    id: fetch_source
    name: Fetch the DrugFlow source
    description: Clones DrugFlow at a pinned commit. The conda environment provides the dependencies but not the code, which is not published as a package.
    outputs:
      - id: drugflow_src
        name: DrugFlow source tree
        description: DrugFlow repository checked out at the pinned commit.
        kind: folder
        path: drugflow_src/
    executor:
      kind: shell
    runtime:
      kind: command
      command: >-
        git init -q ${drugflow_src}
        && git -C ${drugflow_src} fetch -q --depth 1
        https://github.com/LPDI-EPFL/DrugFlow.git
        ed6841677ccf3590000624baa757b61ce0bb20aa
        && git -C ${drugflow_src} checkout -q FETCH_HEAD
    target:
      kind: local

  - kind: horus_task
    id: generate
    name: Generate pocket molecules with DrugFlow
    description: Runs DrugFlow's generate.py to propose novel molecules for the reference pocket.
    inputs:
      - id: drugflow_src
        name: DrugFlow source tree
        description: DrugFlow repository checked out by the fetch_source stage.
        kind: folder
        path: drugflow_src/
      - id: protein
        name: Target protein
        description: Target protein structure (PDB) defining the system to design against.
        kind: file
        path: examples/kras.pdb
      - id: ref_ligand
        name: Reference ligand
        description: Reference ligand (SDF) whose binding site defines the pocket DrugFlow designs into.
        kind: file
        path: examples/kras_ref_ligand.sdf
      - id: checkpoint
        name: DrugFlow checkpoint
        description: DrugFlow model checkpoint downloaded by the download_checkpoint stage.
        kind: file
        path: drugflow.ckpt
    outputs:
      - id: samples
        name: Generated molecules
        description: SDF of the molecules DrugFlow generated for the pocket.
        kind: file
        path: results/samples.sdf
    executor:
      # The .sif ships DrugFlow's dependencies, not its code: src/generate.py
      # comes from the fetch_source clone, so the repo has to be visible inside
      # the container. The executor auto-binds every artifact's parent dir at
      # its own path, which covers it. Build the image with
      # boltz-drugflow/examples/build_drugflow_sif.sh; there is no build step
      # here. Set nv: false and --device cpu below for a CPU-only run.
      kind: singularity
      image: /scratch/molbiomed/CHANGEME/drugflow.sif
      nv: true
    runtime:
      # `cd` is required: src/generate.py does `from src... import ...`, so the
      # repo root has to be the working directory. Every ${...} resolves to an
      # absolute path that is valid both inside and outside the container
      # (Singularity does no path translation), so the inputs and output are
      # unaffected by it. Do not also set the executor's working_dir/--pwd.
      kind: command
      command: >-
        cd ${drugflow_src} && python src/generate.py
        --protein ${protein} --ref_ligand ${ref_ligand}
        --checkpoint ${checkpoint} --output ${samples}
        --n_samples 10 --batch_size 32 --pocket_distance_cutoff 8.0
        --device cuda:0 --seed 42
    resources:
      gpus: 1
      cpus: 8
    target:
      kind: slurm
      inner:
        kind: local
      gres: gpu:1
      time_limit: "02:00:00"

  - kind: horus_task
    id: prepare_inputs
    name: Build Boltz-2 affinity inputs
    description: Extracts the target sequence from the PDB and writes one Boltz affinity YAML per generated molecule into a single input folder, plus a name-to-SMILES JSON map used by the ranking stage.
    inputs:
      - id: protein
        name: Target protein
        description: Target protein structure (PDB) used to extract the sequence.
        kind: file
        path: examples/kras.pdb
      - id: samples
        name: Generated molecules
        description: SDF produced by the generate stage.
        kind: file
        path: results/samples.sdf
    outputs:
      - id: boltz_inputs
        name: Boltz-2 input folder
        description: Folder holding one Boltz affinity YAML per molecule.
        kind: folder
        path: results/boltz_inputs/
      - id: smiles
        name: Molecule name to SMILES map
        description: JSON map from molecule name to canonical SMILES, joined against by the ranking stage.
        kind: file
        path: results/smiles.json
    executor:
      kind: uv_python_environment
      python: "3.11"
      requirements:
        - rdkit
        - biopython
    runtime:
      kind: python_script
      script: scripts/prepare_inputs.py
      args: >-
        --protein ${protein} --sdf ${samples}
        --out ${boltz_inputs} --smiles-map ${smiles}
    target:
      kind: local

  - kind: horus_task
    id: predict
    name: Boltz-2 affinity
    description: Runs Boltz-2 affinity prediction on every generated molecule in a single call.
    inputs:
      - id: boltz_inputs
        name: Boltz-2 input folder
        description: Folder holding one Boltz affinity YAML per molecule.
        kind: folder
        path: results/boltz_inputs/
    outputs:
      - id: predictions
        name: Boltz-2 predictions
        description: Boltz-2 output folder holding one affinity_*.json per molecule.
        kind: folder
        path: results/predictions/
    executor:
      kind: uv_python_environment
      python: "3.11"
      requirements:
        - boltz
    runtime:
      kind: command
      command: >-
        boltz predict ${boltz_inputs} --out_dir ${predictions} --use_msa_server
        --accelerator cpu --devices 1 --diffusion_samples 1
        --seed 42 --override
    target:
      kind: local

  - kind: horus_task
    id: rank
    name: Build the ΔG table
    description: Walks the Boltz-2 predictions, converts each affinity to an approximate ΔG and writes a CSV sorted best-first.
    inputs:
      - id: predictions
        name: Boltz-2 predictions
        description: Boltz-2 output folder holding one affinity_*.json per molecule.
        kind: folder
        path: results/predictions/
      - id: smiles
        name: Molecule name to SMILES map
        description: JSON map from molecule name to canonical SMILES.
        kind: file
        path: results/smiles.json
    outputs:
      - id: deltag_table
        name: ΔG table
        description: CSV of molecule, SMILES, predicted affinity and approximate ΔG, ranked best-first.
        kind: file
        path: results/deltaG_table.csv
    executor:
      kind: shell
    runtime:
      kind: python_script
      script: scripts/rank.py
      python: python3           # stdlib-only; use the target's python3
      args: --predictions ${predictions} --smiles ${smiles} --out ${deltag_table}
    target:
      kind: local

edges:
  - source: download_checkpoint
    source_output: checkpoint
    target: generate
    target_input: checkpoint
  - source: fetch_source
    source_output: drugflow_src
    target: generate
    target_input: drugflow_src
  - source: generate
    source_output: samples
    target: prepare_inputs
    target_input: samples
  - source: prepare_inputs
    source_output: boltz_inputs
    target: predict
    target_input: boltz_inputs
  - source: prepare_inputs
    source_output: smiles
    target: rank
    target_input: smiles
  - source: predict
    source_output: predictions
    target: rank
    target_input: predictions

  - source: artifact-protein
    source_output: protein
    target: generate
    target_input: protein

  - source: artifact-protein
    source_output: protein
    target: prepare_inputs
    target_input: protein

  - source: artifact-ref_ligand
    source_output: ref_ligand
    target: generate
    target_input: ref_ligand


orchestrator_target:
  kind: local
  working_directory: horus_workflow_results
