        RAW= FASTP= BBDUK=; . ${up}/*.job; . ${dbs}/refs.env
        rm -rf ${stats_short} && mkdir -p ${stats_short} && cd ${stats_short}
        cp ${up}/*.job .
        ln -s ${aln}/$$prefix.bam ${up}/$$prefix.bam.bai ${dbs}/$$host_fasta .
        samtools \
            stats \
            --threads ${task.resources.cpus} \
            --reference $$host_fasta \
            $$prefix.bam \
            > $${prefix}.stats
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # ---------------------------------------------------------------- long reads
  - kind: horus_map
    id: porechop
    name: PORECHOP_ABI
    over: {input_id: j_long, as: job}
    max_concurrency: 16
    inputs: [*j_long, *a_reads]
    outputs: [*a_porechop]
    resources: *medium
    executor: *x_porechop_abi
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        RAW=${reads} PORECHOP= NANOQ=; . ${job}
        rm -rf ${porechop} && mkdir -p ${porechop} && cd ${porechop}
        cp ${job} porechop-$$(basename ${job}).job
        ln -s $${reads[0]} .
        porechop_abi \
            --input $$(basename $${reads[0]}) \
             \
            --threads ${task.resources.cpus} \
             \
            --output $${prefix}_porechop_abi.fastq.gz \
            | tee $${prefix}_porechop_abi.log
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: nanoq
    name: NANOQ
    over: {input_id: porechop, as: up}
    chain: true
    max_concurrency: 16
    inputs: [*a_porechop]
    outputs: [*a_nanoq]
    resources: *low
    executor: *x_nanoq
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        RAW= PORECHOP=$$(mktemp -d) NANOQ=; ln -s ${up} $$PORECHOP/0; . ${up}/*.job
        rm -rf ${nanoq} && mkdir -p ${nanoq} && cd ${nanoq}
        cp ${up}/*.job .
        ln -s $${porechop_reads[0]} .
        nanoq -i $$(basename $${porechop_reads[0]}) \
            -vv --min-len 1000 --min-qual 7 \
            -r $${prefix}_filtered.stats \
            -o $${prefix}_filtered.fastq.gz
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: fastqc_long
    name: LONGREAD_PREPROCESSING:FASTQC_PROCESSED
    over: {input_id: nanoq, as: up}
    chain: true
    max_concurrency: 16
    inputs: [*a_nanoq]
    outputs: [*a_fastqc_long]
    resources: *low
    executor: *x_fastqc
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        RAW= PORECHOP= NANOQ=$$(mktemp -d); ln -s ${up} $$NANOQ/0; . ${up}/*.job
        rm -rf ${fastqc_long} && mkdir -p ${fastqc_long} && cd ${fastqc_long}
        cp ${up}/*.job .
        f=$${nanoq_reads[0]}; new=$${prefix}_processed.$${f##*.}
        printf "%s %s\n" $$f $$new | while read old_name new_name; do
            [ -f "$${new_name}" ] || ln -s $$old_name $$new_name
        done
        fastqc \
            --quiet \
            --threads ${task.resources.cpus} \
            --memory $$(( ${task.resources.memory_gb} * 1024 / ${task.resources.cpus} )) \
            $$new
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: minimap2_index
    name: MINIMAP2_INDEX
    inputs: [*a_dbs]
    outputs: [*a_minimap2_index]
    resources: *low
    executor: *x_minimap2
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${dbs}/refs.env
        rm -rf ${minimap2_index} && mkdir -p ${minimap2_index} && cd ${minimap2_index}
        ln -s ${dbs}/$$host_fasta .
        minimap2 \
            -t ${task.resources.cpus} \
            -d $${host_fasta%.*}.mmi \
            -x map-ont \
            $$host_fasta
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: minimap2_align
    name: MINIMAP2_ALIGN
    over: {input_id: nanoq, as: up}
    chain: true
    max_concurrency: 16
    inputs: [*a_nanoq, *a_minimap2_index]
    outputs: [*a_minimap2_align]
    resources: *high
    executor: *x_minimap2_samtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        RAW= PORECHOP= NANOQ=$$(mktemp -d); ln -s ${up} $$NANOQ/0; . ${up}/*.job
        rm -rf ${minimap2_align} && mkdir -p ${minimap2_align} && cd ${minimap2_align}
        cp ${up}/*.job .
        mmi=$$(cd ${minimap2_index} && ls *.mmi)
        ln -s $${nanoq_reads[0]} ${minimap2_index}/$$mmi .
         \
        minimap2 \
             \
            -t ${task.resources.cpus} \
            $$mmi \
            $$(basename $${nanoq_reads[0]}) \
             \
             \
            -a | samtools sort -@ $$(( ${task.resources.cpus} - 1 )) -o $${prefix}.bam##idx##$${prefix}.bam.bai --write-index
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: stats_long
    name: LONGREAD_HOSTREMOVAL:SAMTOOLS_STATS
    over: {input_id: minimap2_align, as: up}
    chain: true
    max_concurrency: 16
    inputs: [*a_minimap2_align, *a_dbs]
    outputs: [*a_stats_long]
    resources: *single
    executor: *x_samtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        RAW= PORECHOP= NANOQ=; . ${up}/*.job; . ${dbs}/refs.env
        rm -rf ${stats_long} && mkdir -p ${stats_long} && cd ${stats_long}
        cp ${up}/*.job .
        ln -s ${up}/$$prefix.bam ${up}/$$prefix.bam.bai ${dbs}/$$host_fasta .
        samtools \
            stats \
            --threads ${task.resources.cpus} \
            --reference $$host_fasta \
            $$prefix.bam \
            > $${prefix}.stats
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: samtools_view
    name: SAMTOOLS_VIEW
    over: {input_id: minimap2_align, as: up}
    chain: true
    max_concurrency: 16
    inputs: [*a_minimap2_align]
    outputs: [*a_samtools_view]
    resources: *low
    executor: *x_samtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        RAW= PORECHOP= NANOQ=; . ${up}/*.job
        rm -rf ${samtools_view} && mkdir -p ${samtools_view} && cd ${samtools_view}
        cp ${up}/*.job .
        ln -s ${up}/$$prefix.bam .
        # Note: --threads value represents *additional* CPUs to allocate (total CPUs = 1 + --threads).
        samtools \
            view \
            --threads $$(( ${task.resources.cpus} - 1 )) \
             \
             \
            -f 4 \
            -o $${prefix}.unmapped.bam##idx##$${prefix}.unmapped.bam.bai --write-index \
            $$prefix.bam \

        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: samtools_fastq
    name: SAMTOOLS_FASTQ
    over: {input_id: samtools_view, as: up}
    chain: true
    max_concurrency: 16
    inputs: [*a_samtools_view]
    outputs: [*a_samtools_fastq]
    resources: *low
    executor: *x_samtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        RAW= PORECHOP= NANOQ=; . ${up}/*.job
        rm -rf ${samtools_fastq} && mkdir -p ${samtools_fastq} && cd ${samtools_fastq}
        cp ${up}/*.job .
        ln -s ${up}/$$prefix.unmapped.bam .
        # Note: --threads value represents *additional* CPUs to allocate (total CPUs = 1 + --threads).
        samtools \
            fastq \
             \
            --threads $$(( ${task.resources.cpus} - 1 )) \
            -0 $${prefix}.unmapped_other.fastq.gz \
            $$prefix.unmapped.bam \
            -1 $${prefix}.unmapped_1.fastq.gz -s $${prefix}.unmapped_singleton.fastq.gz
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # ---------------------------------------------------------------- run merging
  - kind: horus_map
    id: merge_runs
    name: MERGE_RUNS
    over: {input_id: j_merge, as: job}
    max_concurrency: 16
    inputs: [*j_merge, *a_bowtie2_align, *a_samtools_fastq]
    outputs: [*a_merge_runs]
    resources: *single
    executor: *x_coreutils
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        BT2=${bowtie2_align} SFQ=${samtools_fastq}; . ${job}
        rm -rf ${merge_runs} && mkdir -p ${merge_runs} && cd ${merge_runs}
        ln -s "$${reads[@]}" .
        cat $$(for f in "$${reads[@]}"; do basename $$f; done) > $${prefix}.merged.fastq.gz
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # ---------------------------------------------------------------- profiling
  # Each job file has reads=(...) and db=(...); both are linked in under their names.
  - kind: horus_map
    id: kraken2
    name: KRAKEN2_KRAKEN2
    over: {input_id: j_kraken2, as: job}
    max_concurrency: 16
    inputs: [*j_kraken2, *a_merge_runs, *a_bowtie2_align, *a_samtools_fastq, *a_reads, *a_untar, *a_dbs]
    outputs: [*a_kraken2]
    resources: *high
    executor: *x_kraken2
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        MERGE=${merge_runs} BT2=${bowtie2_align} SFQ=${samtools_fastq} RAW=${reads} UNTAR=${untar} DBS=${dbs}; . ${job}
        rm -rf ${kraken2} && mkdir -p ${kraken2} && cd ${kraken2}
        cp ${job} kraken2-$$(basename ${job}).job
        ln -s "$${reads[@]}" "$${db[@]}" .
        kraken2 \
            --db $$(basename $${db[0]}) \
            --threads ${task.resources.cpus} \
            --report $${prefix}.kraken2.report.txt \
            --gzip-compressed \
            --unclassified-out $${prefix}.unclassified.fastq \
            --classified-out $${prefix}.classified.fastq \
            --output /dev/null \
             \
            $$args \
            $$(basename $${reads[0]})
        pigz -p ${task.resources.cpus} *.fastq
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # errorStrategy 'ignore' in conf/base.config: a failure drops the sample's
  # Bracken outputs and the run goes on.
  - kind: horus_map
    id: bracken
    name: BRACKEN_BRACKEN
    over: {input_id: kraken2, as: up}
    chain: true
    drop_exit_codes: [10]
    max_concurrency: 16
    inputs: [*j_bracken, *a_kraken2, *a_untar, *a_dbs]
    outputs: [*a_bracken]
    resources: *low
    executor: *x_bracken
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        KRAKEN2=$$(mktemp -d) UNTAR=${untar} DBS=${dbs}; ln -s ${up} $$KRAKEN2/0; n=$$(basename ${up}/*.job .job); n=$${n#kraken2-}
        case $$n in *_bracken) ;; *) exit 10 ;; esac  # a Kraken2-only item
        . ${j_bracken}/$${n%_bracken}
        rm -rf ${bracken} && mkdir -p ${bracken} && cd ${bracken}
        ln -s "$${report[@]}" "$${db[@]}" .
        d=$$(basename $${db[0]}); r=$$(basename $${report[0]})
        bracken \
            $$args \
            -d "$$d" \
            -i "$$r" \
            -o "$${prefix}.tsv" \
            -w "$${prefix}.kraken2.report_bracken.txt" \
            || { echo "BRACKEN_BRACKEN failed (exit $$?), ignored" >&2; rm -f $${prefix}.tsv $${prefix}.kraken2.report_bracken.txt; }
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: centrifuge
    name: CENTRIFUGE_CENTRIFUGE
    over: {input_id: j_centrifuge, as: job}
    max_concurrency: 16
    inputs: [*j_centrifuge, *a_merge_runs, *a_bowtie2_align, *a_samtools_fastq, *a_reads, *a_untar, *a_dbs]
    outputs: [*a_centrifuge]
    resources: *high
    executor: *x_centrifuge
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        MERGE=${merge_runs} BT2=${bowtie2_align} SFQ=${samtools_fastq} RAW=${reads} UNTAR=${untar} DBS=${dbs}; . ${job}
        rm -rf ${centrifuge} && mkdir -p ${centrifuge} && cd ${centrifuge}
        cp ${job} centrifuge-$$(basename ${job}).job
        ln -s "$${reads[@]}" "$${db[@]}" .
        ## we add "-no-name ._" to ensure silly Mac OSX metafiles files aren't included
        db_name=`find -L $$(basename $${db[0]}) -name "*.1.cf" -not -name "._*"  | sed 's/\.1.cf$$//'`

        ## make a directory for placing the pipe files in somewhere other than default /tmp
        ## otherwise get pipefile name clashes when multiple centrifuge runs on same node
        ## use /tmp at the same time
        mkdir ./temp

        centrifuge \
            -x $$db_name \
            --temp-directory ./temp \
            -p ${task.resources.cpus} \
            -U $$(basename $${reads[0]}) \
            --report-file $${prefix}.report.txt \
            -S $${prefix}.results.txt \
            --un-gz $${prefix}.unmapped.fastq.gz \
            --al-gz $${prefix}.mapped.fastq.gz \
            $$args
        rm -rf temp
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # errorStrategy: exit 255 is ignored (conf/base.config).
  - kind: horus_map
    id: ckreport
    name: CENTRIFUGE_KREPORT
    over: {input_id: centrifuge, as: up}
    chain: true
    max_concurrency: 16
    inputs: [*a_centrifuge, *a_untar, *a_dbs]
    outputs: [*a_ckreport]
    resources: *single
    executor: *x_centrifuge
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        MERGE= BT2= SFQ= RAW= UNTAR=${untar} DBS=${dbs}; . ${up}/*.job
        rm -rf ${ckreport} && mkdir -p ${ckreport} && cd ${ckreport}
        cp ${up}/*.job .
        ln -s ${up}/$${prefix}.results.txt "$${db[@]}" .
        db_name=`find -L $$(basename $${db[0]}) -name "*.1.cf" -not -name "._*"  | sed 's/\.1.cf$$//'`
        rc=0
        centrifuge-kreport \
            $$args \
            -x $$db_name \
            $${prefix}.results.txt > $${prefix}.txt || rc=$$?
        if [ $$rc -eq 255 ]; then echo "CENTRIFUGE_KREPORT exit 255, ignored" >&2; rm -f $${prefix}.txt; elif [ $$rc -ne 0 ]; then exit $$rc; fi
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: metaphlan
    name: METAPHLAN_METAPHLAN
    over: {input_id: j_metaphlan, as: job}
    max_concurrency: 16
    inputs: [*j_metaphlan, *a_merge_runs, *a_bowtie2_align, *a_samtools_fastq, *a_reads, *a_untar, *a_dbs]
    outputs: [*a_metaphlan]
    resources: *medium
    executor: *x_metaphlan
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        MERGE=${merge_runs} BT2=${bowtie2_align} SFQ=${samtools_fastq} RAW=${reads} UNTAR=${untar} DBS=${dbs}; . ${job}
        rm -rf ${metaphlan} && mkdir -p ${metaphlan} && cd ${metaphlan}
        ln -s "$${reads[@]}" "$${db[@]}" .
        r=$$(basename $${reads[0]}); d=$$(basename $${db[0]})
        case $$r in
            *.fastq*|*.fq*) input_type="--input_type fastq" ;;
            *.fasta*|*.fna*|*.fa*) input_type="--input_type fasta" ;;
            *) input_type="--input_type sam" ;;
        esac
        BT2_DB=`find -L "$$d" -name "*rev.1.bt2*" -exec dirname {} \;`
        BT2_DB_INDEX=`find -L $$d -name "*.rev.1.bt2*" | sed 's/\.rev.1.bt2.*$$//' | sed 's/.*\///'`

        metaphlan \
            --nproc ${task.resources.cpus} \
            $$input_type \
            $$r \
            $$args \
            --bowtie2out $${prefix}.bowtie2out.txt \
            -s $${prefix}.sam \
            --bowtie2db $$BT2_DB \
            --index $$BT2_DB_INDEX \
            --biom $${prefix}.biom \
            --output_file $${prefix}_profile.txt
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

