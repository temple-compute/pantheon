        cat > /tmp/.command.sh <<'NF'
        RAW= FASTP=$$(mktemp -d) BBDUK=; ln -s ${up} $$FASTP/0; . ${up}/*.job
        rm -rf ${bbduk} && mkdir -p ${bbduk} && cd ${bbduk}
        cp ${up}/*.job .
        ln -s $${fastp_reads[0]} .
        bbduk.sh \
