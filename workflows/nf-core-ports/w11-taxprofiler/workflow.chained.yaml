  samtools: &x_samtools {kind: docker, user: host, image: "quay.io/biocontainers/samtools:1.22.1--h96c455f_0"}
  minimap2: &x_minimap2 {kind: docker, user: host, image: "quay.io/biocontainers/minimap2:2.29--h577a1d6_0"}
  minimap2_samtools: &x_minimap2_samtools {kind: docker, user: host, image: "community.wave.seqera.io/library/minimap2_samtools:33bb43c18d22e29c"}
  kraken2: &x_kraken2 {kind: docker, user: host, image: "community.wave.seqera.io/library/kraken2_coreutils_pigz:45764814c4bb5bf3"}
  bracken: &x_bracken {kind: docker, user: host, image: "community.wave.seqera.io/library/bracken:3.1--22a4e66ce04c5e01"}
  centrifuge: &x_centrifuge {kind: docker, user: host, image: "quay.io/biocontainers/centrifuge:1.0.4.2--hdcf5f25_0"}
  metaphlan: &x_metaphlan {kind: docker, user: host, image: "quay.io/biocontainers/metaphlan:4.1.1--pyhdfd78af_0"}
