  - kind: horus_map
    id: diamond
    name: DIAMOND_BLASTX
    over: {input_id: j_diamond, as: job}
    max_concurrency: 16
    inputs: [*j_diamond, *a_merge_runs, *a_bowtie2_align, *a_samtools_fastq, *a_reads, *a_untar, *a_dbs]
    outputs: [*a_diamond]
    resources: *high
    executor: *x_diamond
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        MERGE=${merge_runs} BT2=${bowtie2_align} SFQ=${samtools_fastq} RAW=${reads} UNTAR=${untar} DBS=${dbs}; . ${job}
        rm -rf ${diamond} && mkdir -p ${diamond} && cd ${diamond}
        ln -s "$${reads[@]}" "$${db[@]}" .
        fasta=$$(basename $${reads[0]})
        is_compressed=false; fasta_name=$$fasta
        case $$fasta in *.gz) is_compressed=true; fasta_name=$${fasta%.gz} ;; esac
        if [ "$$is_compressed" == "true" ]; then
            gzip -c -d $$fasta > $$fasta_name
        fi

        DB=`find -L ./ -name "*.dmnd" | sed 's/\.dmnd$$//'`

        diamond \
            blastx \
            --threads ${task.resources.cpus} \
            --db $$DB \
            --query $$fasta_name \
            --outfmt 102  \
            $$args \
            --out $${prefix}.tsv \
            --log

        mv diamond.log $${prefix}.log
        [ "$$is_compressed" == "true" ] && rm $$fasta_name
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

