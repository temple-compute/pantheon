    target: *target

  # ---------------------------------------------------------------- short-read host removal
  - kind: horus_task
    id: bowtie2_build
    name: BOWTIE2_BUILD
    inputs: [*a_dbs]
    outputs: [*a_bowtie2_build]
    resources: *high
    executor: *x_bowtie2
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${dbs}/refs.env
        rm -rf ${bowtie2_build} && mkdir -p ${bowtie2_build} && cd ${bowtie2_build}
        ln -s ${dbs}/$$host_fasta .
        mkdir bowtie2
        bowtie2-build  --threads ${task.resources.cpus} $$host_fasta bowtie2/$${host_fasta%.*}
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: bowtie2_align
    name: BOWTIE2_ALIGN
    over: {input_id: bbduk, as: up}
    chain: true
    max_concurrency: 16
    inputs: [*a_bbduk, *a_bowtie2_build]
    outputs: [*a_bowtie2_align]
    resources: *high
    executor: *x_bowtie2
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        RAW= FASTP= BBDUK=$$(mktemp -d); ln -s ${up} $$BBDUK/0; . ${up}/*.job
        rm -rf ${bowtie2_align} && mkdir -p ${bowtie2_align} && cd ${bowtie2_align}
        cp ${up}/*.job .
        ln -s $${bbduk_reads[0]} ${bowtie2_build}/bowtie2 .
        INDEX=`find -L ./ -name "*.rev.1.bt2" | sed "s/\.rev.1.bt2$$//"`
        [ -z "$$INDEX" ] && INDEX=`find -L ./ -name "*.rev.1.bt2l" | sed "s/\.rev.1.bt2l$$//"`
        [ -z "$$INDEX" ] && echo "Bowtie2 index files not found" 1>&2 && exit 1
        bowtie2 \
            -x $$INDEX \
            -U $$(basename $${bbduk_reads[0]}) \
            --threads ${task.resources.cpus} \
            --un-gz $${prefix}.unmapped.fastq.gz \
             \
            2>| >(tee $${prefix}.bowtie2.log >&2) \
            | samtools sort  --threads ${task.resources.cpus}  -o $${prefix}.bam -
        if [ -f $${prefix}.unmapped.fastq.1.gz ]; then
            mv $${prefix}.unmapped.fastq.1.gz $${prefix}.unmapped_1.fastq.gz
        fi
        if [ -f $${prefix}.unmapped.fastq.2.gz ]; then
            mv $${prefix}.unmapped.fastq.2.gz $${prefix}.unmapped_2.fastq.gz
        fi
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: samtools_index
    name: SAMTOOLS_INDEX
    over: {input_id: bowtie2_align, as: up}
    chain: true
    max_concurrency: 16
    inputs: [*a_bowtie2_align]
    outputs: [*a_samtools_index]
    resources: *low
    executor: *x_samtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        RAW= FASTP= BBDUK=; . ${up}/*.job
        rm -rf ${samtools_index} && mkdir -p ${samtools_index} && cd ${samtools_index}
        cp ${up}/*.job .
        ln -s ${up}/$$prefix.bam .
        samtools \
            index \
            -@ ${task.resources.cpus} \
             \
            $$prefix.bam
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: stats_short
    name: SHORTREAD_HOSTREMOVAL:SAMTOOLS_STATS
    over: {input_id: samtools_index, as: up}
    chain: true
    zip: [{input_id: bowtie2_align, as: aln}]
    max_concurrency: 16
    inputs: [*a_bowtie2_align, *a_samtools_index, *a_dbs]
    outputs: [*a_stats_short]
    resources: *single
    executor: *x_samtools
    runtime:
