    over: {input_id: j_taxpasta_merge, as: job}
    max_concurrency: 16
    inputs: [*j_taxpasta_merge, *a_kraken2, *a_bracken, *a_ckreport, *a_metaphlan, *a_kaijutable, *a_diamond, *a_ganon_report, *a_kmcp_profile]
    outputs: [*a_taxpasta_merge]
    resources: *single
    executor: *x_taxpasta
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        KRAKEN2=${kraken2} BRACKEN=${bracken} CKREPORT=${ckreport} METAPHLAN=${metaphlan} KAIJUTABLE=${kaijutable}
        DIAMOND=${diamond} GANONREPORT=${ganon_report} KMCPPROFILE=${kmcp_profile}; . ${job}
        rm -rf ${taxpasta_merge} && mkdir -p ${taxpasta_merge} && cd ${taxpasta_merge}
        ln -s "$${profiles[@]}" .
        taxpasta merge \
            --profiler $$profiler \
            --output $${prefix}.tsv \
             \
             \
             \
            $$(for f in "$${profiles[@]}"; do basename $$f; done)
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: taxpasta_standardise
    name: TAXPASTA_STANDARDISE
    over: {input_id: j_taxpasta_standardise, as: job}
    max_concurrency: 16
    inputs: [*j_taxpasta_standardise, *a_kraken2, *a_bracken, *a_ckreport, *a_metaphlan, *a_kaijutable, *a_diamond, *a_ganon_report, *a_kmcp_profile]
    outputs: [*a_taxpasta_standardise]
    resources: *single
    executor: *x_taxpasta
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        KRAKEN2=${kraken2} BRACKEN=${bracken} CKREPORT=${ckreport} METAPHLAN=${metaphlan} KAIJUTABLE=${kaijutable}
        DIAMOND=${diamond} GANONREPORT=${ganon_report} KMCPPROFILE=${kmcp_profile}; . ${job}
        rm -rf ${taxpasta_standardise} && mkdir -p ${taxpasta_standardise} && cd ${taxpasta_standardise}
        ln -s "$${profiles[@]}" .
        taxpasta standardise \
            --profiler $$profiler \
            --output $${prefix}.tsv \
             \
             \
            $$(basename $${profiles[0]})
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: bracken_combined
    name: BRACKEN_COMBINEBRACKENOUTPUTS
    over: {input_id: j_bracken_combine, as: job}
    max_concurrency: 16
    inputs: [*j_bracken_combine, *a_bracken]
    outputs: [*a_bracken_combined]
    resources: *low
    executor: *x_bracken
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        BRACKEN=${bracken}; . ${job}
        rm -rf ${bracken_combined} && mkdir -p ${bracken_combined} && cd ${bracken_combined}
        ln -s "$${profiles[@]}" .
        combine_bracken_outputs.py \
             \
            --files $$(for f in "$${profiles[@]}"; do basename $$f; done) \
            -o $${prefix}.txt
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # groupTuple(sort: { -it.size() }): largest report first. errorStrategy:
  # exit 255 and 1 are ignored (conf/base.config).
  - kind: horus_map
    id: centrifuge_combined
    name: KRAKENTOOLS_COMBINEKREPORTS_CENTRIFUGE
    over: {input_id: j_centrifuge_combine, as: job}
    max_concurrency: 16
    inputs: [*j_centrifuge_combine, *a_ckreport]
    outputs: [*a_centrifuge_combined]
    resources: *single
    executor: *x_krakentools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        CKREPORT=${ckreport}; . ${job}
        rm -rf ${centrifuge_combined} && mkdir -p ${centrifuge_combined} && cd ${centrifuge_combined}
        ln -s "$${profiles[@]}" .
        rc=0
        combine_kreports.py \
            -r $$(ls -S -L $$(for f in "$${profiles[@]}"; do basename $$f; done)) \
            -o $${prefix}.txt \
             || rc=$$?
        if [ $$rc -eq 255 ] || [ $$rc -eq 1 ]; then echo "combine_kreports exit $$rc, ignored" >&2; rm -f $${prefix}.txt; elif [ $$rc -ne 0 ]; then exit $$rc; fi
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: kaiju_combined
    name: KAIJU_KAIJU2TABLE_COMBINED
    over: {input_id: j_kaiju_combine, as: job}
    max_concurrency: 16
    inputs: [*j_kaiju_combine, *a_kaiju, *a_untar, *a_dbs]
    outputs: [*a_kaiju_combined]
    resources: *single
    executor: *x_kaiju
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        KAIJU=${kaiju} UNTAR=${untar} DBS=${dbs}; . ${job}
        rm -rf ${kaiju_combined} && mkdir -p ${kaiju_combined} && cd ${kaiju_combined}
        ln -s "$${profiles[@]}" "$${db[@]}" .
        d=$$(basename $${db[0]})
        dbnodes=`find -L $$d -name "*nodes.dmp"`
        dbnames=`find -L $$d -name "*names.dmp"`
        kaiju2table    \
            -t $$dbnodes \
            -n $$dbnames \
            -r species \
            -o $${prefix}.txt \
            $$(for f in "$${profiles[@]}"; do basename $$f; done)
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: kraken2_combined
    name: KRAKENTOOLS_COMBINEKREPORTS_KRAKEN
    over: {input_id: j_kraken2_combine, as: job}
    max_concurrency: 16
    inputs: [*j_kraken2_combine, *a_kraken2]
    outputs: [*a_kraken2_combined]
    resources: *single
    executor: *x_krakentools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        KRAKEN2=${kraken2}; . ${job}
        rm -rf ${kraken2_combined} && mkdir -p ${kraken2_combined} && cd ${kraken2_combined}
        ln -s "$${profiles[@]}" .
        combine_kreports.py \
            -r $$(ls -S -L $$(for f in "$${profiles[@]}"; do basename $$f; done)) \
            -o $${prefix}.txt \

        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: metaphlan_combined
    name: METAPHLAN_MERGEMETAPHLANTABLES
    over: {input_id: j_metaphlan_combine, as: job}
    max_concurrency: 16
    inputs: [*j_metaphlan_combine, *a_metaphlan]
    outputs: [*a_metaphlan_combined]
    resources: *single
    executor: *x_metaphlan
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        METAPHLAN=${metaphlan}; . ${job}
        rm -rf ${metaphlan_combined} && mkdir -p ${metaphlan_combined} && cd ${metaphlan_combined}
        ln -s "$${profiles[@]}" .
        merge_metaphlan_tables.py \
             \
            -o $${prefix}.txt \
            $$(for f in "$${profiles[@]}"; do basename $$f; done)
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: ganon_combined
    name: GANON_TABLE
    over: {input_id: j_ganon_combine, as: job}
    max_concurrency: 16
    inputs: [*j_ganon_combine, *a_ganon_report]
    outputs: [*a_ganon_combined]
    resources: *single
    executor: *x_ganon
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        GANONREPORT=${ganon_report}; . ${job}
        rm -rf ${ganon_combined} && mkdir -p ${ganon_combined} && cd ${ganon_combined}
        ln -s "$${profiles[@]}" .
        ganon \
            table \
            --input $$(for f in "$${profiles[@]}"; do basename $$f; done) \
            --output-file $${prefix}.txt \

        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: sylph_combined
    name: SYLPHTAX_MERGE
    over: {input_id: j_sylph_combine, as: job}
    max_concurrency: 16
    inputs: [*j_sylph_combine, *a_sylphtax]
    outputs: [*a_sylph_combined]
    resources: *single
    executor: *x_sylphtax
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        shopt -s nullglob
        SYLPHTAX=${sylphtax}; . ${job}
        rm -rf ${sylph_combined} && mkdir -p ${sylph_combined} && cd ${sylph_combined}
        # empty sylph reports were filtered out before SYLPHTAX_TAXPROF
        ln -s "$${profiles[@]}" .
        export SYLPH_TAXONOMY_CONFIG="/tmp/config.json"
        sylph-tax \
            merge \
            $$(for f in "$${profiles[@]}"; do basename $$f; done) \
            --column relative_abundance \
            --output $${prefix}.tsv
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # ---------------------------------------------------------------- MultiQC
  # The files the pipeline sends to MULTIQC (ch_multiqc_files), one per
  # numbered folder as stageAs: "?/*" does. The software versions, workflow
  # summary and methods description come from Nextflow run metadata and are
  # left out.
  - kind: horus_task
    id: multiqc
    name: MULTIQC
    inputs:
      - *a_nfcore
      - *a_fastqc_raw
      - *a_fastp
      - *a_fastqc_short
      - *a_porechop
      - *a_nanoq
      - *a_fastqc_long
      - *a_nonpareil_curvesr
      - *a_bbduk
      - *a_bowtie2_align
      - *a_stats_short
      - *a_stats_long
      - *a_kraken2
      - *a_ckreport
      - *a_metaphlan
      - *a_kaijutable
      - *a_diamond
      - *a_kmcp_profile
      - *a_centrifuge_combined
      - *a_kaiju_combined
      - *a_kraken2_combined
      - *a_metaphlan_combined
      - *a_ganon_combined
      # not read: MULTIQC waits on every process through the versions topic
      - *a_nonpareil_curve
      - *a_nonpareil_set
      - *a_samtools_fastq
      - *a_merge_runs
      - *a_bracken_combined
      - *a_sylph_combined
      - *a_melon
      - *a_metacache
      - *a_krona
      - *a_taxpasta_merge
      - *a_taxpasta_standardise
    outputs: [*a_multiqc]
    resources: *single
    executor: *x_multiqc
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${multiqc} && mkdir -p ${multiqc} && cd ${multiqc}
        i=0
        for f in \
            ${fastqc_raw}/*/*.zip ${fastp}/*/*.fastp.json ${fastqc_short}/*/*.zip \
            ${porechop}/*/*.log ${nanoq}/*/*.stats ${fastqc_long}/*/*.zip \
            ${nonpareil_curvesr}/*.json ${bbduk}/*/*.log ${bowtie2_align}/*/*.log \
            ${stats_short}/*/*.stats ${stats_long}/*/*.stats \
            ${kraken2}/*/*.kraken2.report.txt ${ckreport}/*/*.txt ${metaphlan}/*/*_profile.txt \
            ${kaijutable}/*/*.txt ${diamond}/*/*.log ${kmcp_profile}/*/*.profile \
            ${centrifuge_combined}/*/*.txt ${kaiju_combined}/*/*.txt ${kraken2_combined}/*/*.txt \
            ${metaphlan_combined}/*/*.txt ${ganon_combined}/*/*.txt; do
            [ -e "$$f" ] || continue
            i=$$((i + 1)); mkdir $$i; ln -s $$f $$i/
        done
        i=$$((i + 1)); mkdir $$i; ln -s ${nfcore}/assets/multiqc_config.yml $$i/
        multiqc \
            --force \
             \
            --config $$i/multiqc_config.yml \
             \
             \
             \
             \
            .
        find . -type l -delete
        find . -mindepth 1 -maxdepth 1 -type d -name '[0-9]*' -empty -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

