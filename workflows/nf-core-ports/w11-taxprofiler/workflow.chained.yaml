  multiqc: &x_multiqc {kind: docker, user: host, image: "community.wave.seqera.io/library/multiqc:1.34--db7c73dae76bc9e6"}

# Labels after the test profile's resourceLimits (trace.txt cpus / memory).
_res:
  single: &single {cpus: 1, memory_gb: 1, walltime: "04:00:00"}
  low: &low {cpus: 2, memory_gb: 12, walltime: "04:00:00"}
  medium: &medium {cpus: 4, memory_gb: 15, walltime: "06:00:00"}
  high: &high {cpus: 4, memory_gb: 15, walltime: "06:00:00"}

