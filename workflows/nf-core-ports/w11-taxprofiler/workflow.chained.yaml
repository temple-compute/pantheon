kind: horus_workflow
name: nf-core taxprofiler chained

# Chained variant of workflow.yaml (scripts/chain.py writes it): same
# commands and outputs. Each map that follows another map over the same jobs
# sets `chain: true`, so an item's next step starts as soon as its own
# previous step is done, not when the whole map is: the short-read chain
# (fastp, BBDuk, bowtie2, samtools), the long-read chain (porechop_abi,
# nanoq, minimap2, samtools) and each profiler's own steps (Centrifuge
# kreport, kaiju2table, ganon report, KMCP profile, sylph-tax, Bracken). A
# chain head copies its job file into its slot; a chained map sources it from
# the previous slot (${up}). Bracken chains on Kraken2 and drops the Kraken2
# items that are not Bracken jobs (exit 10, drop_exit_codes). Steps that
# gather many items (run merging, the profilers, Krona, taxpasta, MultiQC)
# still wait for their whole inputs. Needs horus-runtime 0.9.0 or later.


# Native port of nf-core/taxprofiler 2.0.1, the route `-profile test,docker`
# runs: FastQC, fastp with pair merging, porechop_abi + nanoq, Nonpareil,
# BBDuk, bowtie2 and minimap2 host removal, run merging, Kraken2, Bracken,
# Centrifuge, MetaPhlAn, Kaiju, DIAMOND, ganon, KMCP, sylph, Melon, MetaCache,
# Krona, taxpasta and MultiQC. Images, rendered command lines (ext.args from
# conf/modules.config and conf/test.config) and per-process cpus/memory are the
# executed ones; the test profile caps every process at 4 cpus / 15 GB.
#
# Every command runs under `bash -C -e -u -o pipefail`, the pipeline's
# process.shell: the script is written to /tmp/.command.sh and run with bash,
# as .command.run does. Inputs are linked into the output folder under the
# names Nextflow stages them with, and the links are removed afterwards.
#
# The pipeline's Groovy channel logic (which runs get which preprocessing,
# run merging, the (sample, database) pairs per profiler, the Krona and
# taxpasta groups) depends only on the two sheets, so scripts/plan.py decides
# it up front and writes one folder of job files per process family. Each
# per-sample or per-group process is a horus_map over its job folder. A job
# file is bash: values plus arrays of globs rooted at upper-case variables
# that the command sets to its input folders before sourcing it.
#
# capacity: memory-based admission like Nextflow's local executor. The key is
# the target's location_id (local://<hostname>).

capacity:
  local://ubuntu-awow:
    cpus: 16
    memory_gb: 31
max_concurrency: 36

_target: &target
  kind: local

# Run on a remote node instead: point every task at this anchor.
# _target: &target
#   kind: ssh
#   host: bench-node.example.org
#   username: ubuntu
#   working_directory: /home/ubuntu/horus

# Containers (.command.run docker lines); `user: host` runs them as the
# calling user, as nf-core's `-u $(id -u):$(id -g)` does.
_img:
  coreutils: &x_coreutils {kind: docker, user: host, image: "community.wave.seqera.io/library/coreutils_grep_gzip_lbzip2_pruned:838ba80435a629f8"}
  fastqc: &x_fastqc {kind: docker, user: host, image: "quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0"}
  fastp: &x_fastp {kind: docker, user: host, image: "community.wave.seqera.io/library/fastp:0.24.0--62c97b06e8447690"}
  porechop_abi: &x_porechop_abi {kind: docker, user: host, image: "quay.io/biocontainers/porechop_abi:0.5.0--py310h590eda1_0"}
  nanoq: &x_nanoq {kind: docker, user: host, image: "quay.io/biocontainers/nanoq:0.10.0--h031d066_2"}
  nonpareil: &x_nonpareil {kind: docker, user: host, image: "quay.io/biocontainers/nonpareil:3.5.5--r43hdcf5f25_0"}
