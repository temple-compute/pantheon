  - kind: horus_map
    id: bbduk
    name: BBMAP_BBDUK
    over: {input_id: fastp, as: up}
    chain: true
    max_concurrency: 16
    inputs: [*a_fastp]
    outputs: [*a_bbduk]
    resources: *medium
    executor: *x_bbmap
    runtime:
      kind: command
