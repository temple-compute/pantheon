artifacts:
  - <<: *a_samplesheet
    description: >-
      nf-core/taxprofiler samplesheet (sample,run_accession,instrument_platform,
      fastq_1,fastq_2,fasta). Reads may be URLs or paths relative to the
      samplesheet; rows sharing a sample are runs of one sample. Default: the
      test profile samplesheet (7 runs, 6 samples).
  - <<: *a_databases
    description: >-
      Database sheet (tool,db_name,db_params,db_type,db_path). Default: the test
      profile's database_v2.1.csv.
  - <<: *a_nfcore
    description: nf-core/taxprofiler 2.0.1 MultiQC config (MIT).
  - <<: *a_mirror
    description: >-
      Folder searched for each input file by name before downloading it (e.g. a
      local copy of the test data). Empty downloads everything.
    value: ""
    pattern: '[^"`$\\]*'
  - <<: *a_host_ref
    description: "--hostremoval_reference (plain fasta)"
    value: "https://raw.githubusercontent.com/nf-core/test-datasets/modules/data/genomics/homo_sapiens/genome/genome.fasta"
    pattern: '[^"`$\\]*'
  - <<: *a_sylph_tax
    description: "--sylph_taxonomy"
    value: "https://raw.githubusercontent.com/nf-core/test-datasets/taxprofiler/data/database/sylph/test_taxonomy.tsv.gz"
    pattern: '[^"`$\\]*'

tasks:
  # ---------------------------------------------------------------- inputs and plan
  - kind: horus_task
    id: plan
    name: Stage inputs and plan the run
    description: Downloads reads and databases and writes the job lists the pipeline's channel logic yields.
    inputs: [*a_samplesheet, *a_databases, *a_mirror, *a_host_ref, *a_sylph_tax]
    outputs:
      - *a_reads
      - *a_dbs
      - *j_untar
      - *j_raw_qc
      - *j_short
      - *j_long
      - *j_merge
      - *j_kraken2
      - *j_bracken
      - *j_centrifuge
      - *j_metaphlan
      - *j_kaiju
      - *j_diamond
      - *j_ganon
      - *j_kmcp
      - *j_sylph
      - *j_melon
      - *j_metacache
      - *j_kreport2krona
      - *j_krona
      - *j_taxpasta_merge
      - *j_taxpasta_standardise
      - *j_bracken_combine
      - *j_centrifuge_combine
      - *j_kaiju_combine
      - *j_kraken2_combine
      - *j_metaphlan_combine
      - *j_ganon_combine
      - *j_sylph_combine
    executor: {kind: shell}
    runtime:
      kind: python_script
      script: scripts/plan.py
      python: python3 # stdlib only
      args: >-
        --samplesheet ${samplesheet} --databases ${databases} --mirror ${input_mirror}
        --hostremoval-reference ${hostremoval_reference} --sylph-taxonomy ${sylph_taxonomy}
        --reads ${reads} --dbs ${dbs} --jobs ${j_untar}/..
    target: *target

  - kind: horus_map
    id: untar
    name: UNTAR
    over: {input_id: j_untar, as: job}
    max_concurrency: 16
    inputs: [*j_untar, *a_dbs]
    outputs: [*a_untar]
    resources: *single
    executor: *x_coreutils
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        DBS=${dbs}; . ${job}
        rm -rf ${untar} && mkdir -p ${untar} && cd ${untar}
        ln -s $${archive[0]} .
        archive=$$(basename $${archive[0]})
        mkdir $$prefix

        ## Ensures --strip-components only applied when top level of tar contents is a directory
        ## If just files or multiple directories, place all in prefix
        if [[ $$(tar -taf $$archive | grep -o -P "^.*?\/" | uniq | wc -l) -eq 1 ]]; then
            tar \
                -C $$prefix --strip-components 1 \
                -xavf \
                 \
                $$archive \

        else
            tar \
                -C $$prefix \
                -xavf \
                 \
                $$archive \

        fi
        rm $$archive
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # ---------------------------------------------------------------- read QC
  - kind: horus_map
    id: fastqc_raw
    name: FASTQC
    over: {input_id: j_raw_qc, as: job}
    max_concurrency: 16
    inputs: [*j_raw_qc, *a_reads]
    outputs: [*a_fastqc_raw]
    resources: *low
    executor: *x_fastqc
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        RAW=${reads}; . ${job}
        rm -rf ${fastqc_raw} && mkdir -p ${fastqc_raw} && cd ${fastqc_raw}
        # the module links reads as <prefix>.<ext> (one file) or <prefix>_<n>.<ext>
        n=$${#reads[@]}; i=0; rename_to=""; renamed_files=""
        for f in "$${reads[@]}"; do
            i=$$((i + 1))
            if [ $$n -eq 1 ]; then new=$$prefix.$${f##*.}; else new=$${prefix}_$$i.$${f##*.}; fi
            rename_to="$$rename_to $$f $$new"; renamed_files="$$renamed_files $$new"
        done
        printf "%s %s\n" $$rename_to | while read old_name new_name; do
            [ -f "$${new_name}" ] || ln -s $$old_name $$new_name
        done
        fastqc \
            --quiet \
            --threads ${task.resources.cpus} \
            --memory $$(( ${task.resources.memory_gb} * 1024 / ${task.resources.cpus} )) \
            $$renamed_files
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: fastp
    name: FASTP
    over: {input_id: j_short, as: job}
    max_concurrency: 16
    inputs: [*j_short, *a_reads]
    outputs: [*a_fastp]
    resources: *medium
    executor: *x_fastp
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        RAW=${reads} FASTP= BBDUK=; . ${job}
        rm -rf ${fastp} && mkdir -p ${fastp} && cd ${fastp}
        cp ${job} fastp-$$(basename ${job}).job
        ln -s "$${reads[@]}" .
        set -- $$(for f in "$${reads[@]}"; do basename $$f; done)
        if [ $$single_end = true ]; then
        # FASTP_SINGLE
        [ ! -f  $${prefix}.fastq.gz ] && ln -sf $$1 $${prefix}.fastq.gz
        fastp \
            --in1 $${prefix}.fastq.gz \
            --out1 $${prefix}.fastp.fastq.gz \
            --thread ${task.resources.cpus} \
            --json $${prefix}.fastp.json \
            --html $${prefix}.fastp.html \
             \
             \
            --length_required 15 \
            2>| >(tee $${prefix}.fastp.log >&2)
        else
        # FASTP_PAIRED, with shortread_qc_mergepairs
        [ ! -f  $${prefix}_1.fastq.gz ] && ln -sf $$1 $${prefix}_1.fastq.gz
        [ ! -f  $${prefix}_2.fastq.gz ] && ln -sf $$2 $${prefix}_2.fastq.gz
        fastp \
            --in1 $${prefix}_1.fastq.gz \
            --in2 $${prefix}_2.fastq.gz \
            --out1 $${prefix}_1.fastp.fastq.gz \
            --out2 $${prefix}_2.fastp.fastq.gz \
            --json $${prefix}.fastp.json \
            --html $${prefix}.fastp.html \
             \
             \
            -m --merged_out $${prefix}.merged.fastq.gz \
            --thread ${task.resources.cpus} \
            --detect_adapter_for_pe \
            --detect_adapter_for_pe --length_required 15 \
            2>| >(tee $${prefix}.fastp.log >&2)
        fi
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: fastqc_short
    name: SHORTREAD_PREPROCESSING:FASTQC_PROCESSED
    over: {input_id: fastp, as: up}
    chain: true
    max_concurrency: 16
    inputs: [*a_fastp]
    outputs: [*a_fastqc_short]
    resources: *low
    executor: *x_fastqc
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        RAW= FASTP=$$(mktemp -d) BBDUK=; ln -s ${up} $$FASTP/0; . ${up}/*.job
        rm -rf ${fastqc_short} && mkdir -p ${fastqc_short} && cd ${fastqc_short}
        cp ${up}/*.job .
        f=$${fastp_reads[0]}; new=$${prefix}_processed.$${f##*.}
        printf "%s %s\n" $$f $$new | while read old_name new_name; do
            [ -f "$${new_name}" ] || ln -s $$old_name $$new_name
        done
        fastqc \
            --quiet \
            --threads ${task.resources.cpus} \
            --memory $$(( ${task.resources.memory_gb} * 1024 / ${task.resources.cpus} )) \
            $$new
        find . -type l -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
