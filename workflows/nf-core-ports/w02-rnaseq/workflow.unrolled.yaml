    kind: folder
    path: results/fq_lint/bbsplit/0/
  - id: decide_py
    name: Decision script
    kind: file
    path: scripts/decide.py
  - id: stranded_threshold
    name: Stranded threshold
    kind: number
    path: params/stranded_threshold.json
  - id: unstranded_threshold
    name: Unstranded threshold
