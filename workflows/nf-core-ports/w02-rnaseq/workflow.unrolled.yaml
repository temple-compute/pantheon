  - id: qualimap_sort_4
    name: Name-sorted BAM
    kind: folder
    path: work/qualimap_sort/4/
  - id: genome
    name: Genome plus additional fasta
    kind: folder
    path: work/genome/genome/
  outputs:
  - id: qualimap_4
    name: Qualimap
    kind: folder
    path: results/star_salmon/qualimap/4/
  resources:
    cpus: 4
    memory_gb: 15
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/qualimap:2.3--hdfd78af_0
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      . ${qualimap_sort_4}/meta.env
      rm -rf ${qualimap_4} && mkdir -p ${qualimap_4} && cd ${qualimap_4} && cp ${qualimap_sort_4}/meta.env .
      g=$$(cd ${genome}/out && ls *.gtf); ln -s ${genome}/out/$$g $$g
      ln -s ${qualimap_sort_4}/$$id.namesorted.bam .
      case $$strandedness in forward) p=strand-specific-forward ;; reverse) p=strand-specific-reverse ;; *) p=non-strand-specific ;; esac
      if [ $$single_end = true ]; then paired_end=""; else paired_end="-pe"; fi
      unset DISPLAY
      mkdir -p tmp
      export _JAVA_OPTIONS=-Djava.io.tmpdir=./tmp
      qualimap \
          --java-mem-size=$$(( ${task.resources.memory_gb} * 1024 * 8 / 10 ))M \
          rnaseq \
          --sorted -p $$p \
          -bam $$id.namesorted.bam \
          -gtf $$g \
          $$paired_end \
          -outdir $$id
      rm -r $$g $$id.namesorted.bam tmp
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
