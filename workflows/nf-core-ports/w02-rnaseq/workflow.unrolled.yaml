    name: DESeq2 QC (STAR Salmon)
    kind: folder
    path: results/star_salmon/deseq2_qc/
  resources:
    cpus: 4
    memory_gb: 15
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: community.wave.seqera.io/library/r-base_r-optparse_r-ggplot2_r-rcolorbrewer_pruned:9e75394d0bc21987
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      rm -rf ${ss_deseq2} && mkdir -p ${ss_deseq2} && cd ${ss_deseq2}
      ln -s ${ss_tximport}/salmon.merged.gene_counts_length_scaled.tsv .
      ln -s ${nfcore}/assets/deseq2_pca_header.txt . && ln -s ${nfcore}/assets/deseq2_clustering_header.txt .
      export PATH=${nfcore}/bin:$$PATH
      deseq2_qc.r \
          --count_file salmon.merged.gene_counts_length_scaled.tsv \
          --outdir ./ \
          --cores ${task.resources.cpus} \
          --outprefix deseq2 \
          --id_col 1 --sample_suffix '' --count_col 3 --vst TRUE

      if [ -f "R_sessionInfo.log" ]; then
          # Handle PCA files
          sed "s/deseq2_pca/star_salmon_deseq2_pca/g" <deseq2_pca_header.txt > pca_header.tmp
          sed -i -e "s/DESeq2 PCA/STAR_SALMON DESeq2 PCA/g" pca_header.tmp
          cat pca_header.tmp *.pca.vals.txt > star_salmon.pca.vals_mqc.tsv
          rm pca_header.tmp

          # Handle clustering files
          sed "s/deseq2_clustering/star_salmon_deseq2_clustering/g" <deseq2_clustering_header.txt > clustering_header.tmp
          sed -i -e "s/DESeq2 sample/STAR_SALMON DESeq2 sample/g" clustering_header.tmp
          cat clustering_header.tmp *.sample.dists.txt > star_salmon.sample.dists_mqc.tsv
          rm clustering_header.tmp
      fi
      rm salmon.merged.gene_counts_length_scaled.tsv deseq2_pca_header.txt deseq2_clustering_header.txt
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
