    image: community.wave.seqera.io/library/multiqc:1.35--c17fb751507e9dfc
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      rm -rf ${mqc_inputs}
      python ${decide_py} multiqc --samplesheet ${samplesheet} --samples ${samples} --reads ${reads} \
          --strand $$(dirname ${set_strandedness_0}) --map-pass $$(dirname ${filter_mapped_0}) --infer-experiment $$(dirname ${rseqc_infer_0}) \
          --trimgalore $$(dirname ${trimgalore_0}) --star $$(dirname ${star_align_0}) \
          --min-trimmed-reads ${min_trimmed_reads} --min-mapped-reads ${min_mapped_reads} --assets ${nfcore}/assets \
          --stranded-threshold ${stranded_threshold} --unstranded-threshold ${unstranded_threshold} --out ${mqc_inputs}
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
