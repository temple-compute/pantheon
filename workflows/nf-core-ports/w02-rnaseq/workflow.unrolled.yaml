    image: community.wave.seqera.io/library/htslib_samtools:1.24--d697cfb9dce007cd
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      . ${markdup_0}/meta.env
      rm -rf ${qualimap_sort_0} && mkdir -p ${qualimap_sort_0} && cd ${qualimap_sort_0} && cp ${markdup_0}/meta.env .
