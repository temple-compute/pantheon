- kind: horus_task
  id: cov_fw_0
  name: BEDTOOLS_GENOMECOV_FW[0]
  inputs:
  - id: markdup_0
    name: MarkDuplicates
    kind: folder
    path: results/star_salmon/markdup/0/
  outputs:
  - id: cov_fw_0
    name: Coverage forward
    kind: folder
    path: work/bedgraph/forward/0/
  resources:
    cpus: 1
    memory_gb: 6
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: community.wave.seqera.io/library/bedtools_coreutils:a623c13f66d5262b
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      . ${markdup_0}/meta.env
      case $$strandedness in forward | reverse) ;; *) exit 10 ;; esac  # unstranded: drop
      rm -rf ${cov_fw_0} && mkdir -p ${cov_fw_0} && cd ${cov_fw_0} && cp ${markdup_0}/meta.env .
      ln -s ${markdup_0}/$$id.markdup.sorted.bam .
      if [ $$strandedness = reverse ]; then prefix=$$id.reverse; args="-split -du -strand - -bg"
      else prefix=$$id.forward; args="-split -du -strand + -bg"; fi
      bedtools \
          genomecov \
          -ibam $$id.markdup.sorted.bam \
          $$args \
          | LC_ALL=C sort --parallel=${task.resources.cpus} --buffer-size=$$(( ${task.resources.memory_gb} / 2 ))G -k1,1 -k2,2n \
          > $$prefix.bedGraph
      rm $$id.markdup.sorted.bam
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
