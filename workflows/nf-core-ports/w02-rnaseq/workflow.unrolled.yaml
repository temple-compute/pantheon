- kind: horus_task
  id: salmon_quant_0
  name: QUANTIFY_PSEUDO_ALIGNMENT SALMON_QUANT[0]
  inputs:
  - id: bbsplit_0
    name: BBSplit
    kind: folder
    path: results/bbsplit/0/
  - id: set_strandedness_0
    name: Samples with strandedness
    kind: folder
    path: work/set_strandedness/0/
  - id: salmon_idx
    name: Salmon index
    kind: folder
    path: work/genome/salmon_index/
  - id: genome
    name: Genome plus additional fasta
    kind: folder
    path: work/genome/genome/
  outputs:
  - id: salmon_quant_0
    name: Salmon pseudo-alignment quant
    kind: folder
    path: results/salmon/quant/0/
  resources:
    cpus: 4
    memory_gb: 15
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: community.wave.seqera.io/library/salmon:2.7.0--74784226202c61b9
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      . ${set_strandedness_0}/meta.env
      rm -rf ${salmon_quant_0} && mkdir -p ${salmon_quant_0} && cd ${salmon_quant_0} && cp ${set_strandedness_0}/meta.env .
      g=$$(cd ${genome}/out && ls *.gtf); ln -s ${genome}/out/$$g $$g
      idx=$$(cd ${salmon_idx} && ls); ln -s ${salmon_idx}/$$idx $$idx
      case $$strandedness in forward) s=SF ;; reverse) s=SR ;; *) s=U ;; esac
      if [ $$single_end = true ]; then
          libtype=$$s; fqs="$${id}_primary.fastq.gz"; input_reads="-r $$fqs"
      else
          libtype=I$$s; [ $$s = U ] && libtype=IU
          fqs="$${id}_primary_1.fastq.gz $${id}_primary_2.fastq.gz"; input_reads="-1 $${id}_primary_1.fastq.gz -2 $${id}_primary_2.fastq.gz"
      fi
      for f in $$fqs; do ln -s ${bbsplit_0}/$$f .; done
      salmon quant \
          --geneMap $$g \
          --threads ${task.resources.cpus} \
          --index $$idx \
          $$input_reads \
          --libType=$$libtype \
          -o $$id

      if [ -f $$id/aux_info/meta_info.json ]; then
          cp $$id/aux_info/meta_info.json "$${id}_meta_info.json"
      fi
      if [ -f $$id/lib_format_counts.json ]; then
          cp $$id/lib_format_counts.json "$${id}_lib_format_counts.json"
      fi
      rm $$g $$idx $$fqs
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
