      . ${cat_fastq_0}/meta.env
      rm -rf ${fastqc_raw_0} && mkdir -p ${fastqc_raw_0} && cd ${fastqc_raw_0} && cp ${cat_fastq_0}/meta.env .
      if [ $$merged = true ]; then
          if [ $$single_end = true ]; then set -- ${cat_fastq_0}/$${id}.merged.fastq.gz
          else set -- ${cat_fastq_0}/$${id}_1.merged.fastq.gz ${cat_fastq_0}/$${id}_2.merged.fastq.gz; fi
      else
