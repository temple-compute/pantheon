    memory_gb: 6
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: community.wave.seqera.io/library/multiqc:1.35--c17fb751507e9dfc
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      rm -rf ${multiqc} && mkdir -p ${multiqc} && cd ${multiqc}
      n=0
      stage() { for f in "$$@"; do [ -e "$$f" ] || continue; n=$$((n + 1)); mkdir $$n; ln -s "$${f%/}" $$n/; echo "$$(basename "$${f%/}")" >> multiqc_inputs.txt; done; }
      stage ${nfcore}/assets/multiqc_config.yml ${mqc_inputs}/multiqc_sample_merge.yml
      stage $$(dirname ${fastqc_raw_0})/*/*_fastqc.zip
      stage $$(dirname ${trimgalore_0})/*/*_trimming_report.txt $$(dirname ${trimgalore_0})/*/*_trimming_report.json $$(dirname ${trimgalore_0})/*/*_fastqc.zip
      stage $$(dirname ${bbsplit_0})/*/*.stats.txt
      stage $$(dirname ${fastqc_filtered_0})/*/*_fastqc.zip
      stage $$(dirname ${star_align_0})/*/*.Log.final.out
      stage $$(dirname ${salmon_quant_0})/*/*/
      stage $$(dirname ${md_stats_0})/*/*.stats $$(dirname ${md_flagstat_0})/*/*.flagstat $$(dirname ${md_idxstats_0})/*/*.idxstats $$(dirname ${markdup_0})/*/*.metrics.txt
      stage $$(dirname ${biotype_0})/*/*.biotype_counts_mqc.tsv
      stage $$(dirname ${qualimap_0})/*/*/
      stage $$(dirname ${dupradar_0})/*/*_dup_intercept_mqc.txt $$(dirname ${dupradar_0})/*/*_duprateExpDensCurve_mqc.txt
      stage $$(dirname ${rseqc_bamstat_0})/*/*.bam_stat.txt $$(dirname ${rseqc_infer_0})/*/*.infer_experiment.txt $$(dirname ${rseqc_innerdist_0})/*/*.inner_distance_freq.txt
      stage $$(dirname ${rseqc_junc_annot_0})/*/*.junction_annotation.log $$(dirname ${rseqc_junc_sat_0})/*/*.junctionSaturation_plot.r
      stage $$(dirname ${rseqc_readdist_0})/*/*.read_distribution.txt $$(dirname ${rseqc_readdup_0})/*/*.pos.DupRate.xls
      stage ${ss_deseq2}/*_mqc.tsv ${ps_deseq2}/*_mqc.tsv
      stage ${mqc_inputs}/*_mqc.json ${mqc_inputs}/fail_*_mqc.tsv
      ln -s ${mqc_inputs}/name_replacement.txt name_replacement.txt
      multiqc \
          --force \
           \
          --config 1/multiqc_config.yml --config 2/multiqc_sample_merge.yml \
          --filename multiqc_report.html \
           \
          --replace-names name_replacement.txt \
           \
          .
      rm -r name_replacement.txt $$(seq 1 $$n)
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
