      cat > /tmp/.command1.sh <<'NF'
      # RSEQC_BAMSTAT
      id=$$(basename ${sample}); . ${sample}
      rm -rf ${rseqc}/rseqc_bamstat && mkdir -p ${rseqc}/rseqc_bamstat && cd ${rseqc}/rseqc_bamstat
      ln -s ${markdup}/*/$$id.markdup.sorted.bam . && ln -s ${markdup_chain}/*/md_index/$$id.markdup.sorted.bam.bai .
      bam_stat.py \
          -i $$id.markdup.sorted.bam \
           \
          > $$id.bam_stat.txt
      rm $$id.markdup.sorted.bam $$id.markdup.sorted.bam.bai
      NF
      cat > /tmp/.command2.sh <<'NF'
      # RSEQC_INFEREXPERIMENT
      id=$$(basename ${sample}); . ${sample}
      rm -rf ${rseqc}/rseqc_infer && mkdir -p ${rseqc}/rseqc_infer && cd ${rseqc}/rseqc_infer
      bed=$$(cd ${gene_bed} && ls *.bed); ln -s ${gene_bed}/$$bed $$bed
      ln -s ${markdup}/*/$$id.markdup.sorted.bam . && ln -s ${markdup_chain}/*/md_index/$$id.markdup.sorted.bam.bai .
      infer_experiment.py \
          -i $$id.markdup.sorted.bam \
          -r $$bed \
           \
          > $$id.infer_experiment.txt
      rm $$bed $$id.markdup.sorted.bam $$id.markdup.sorted.bam.bai
      NF
