  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      rm -rf ${multiqc} && mkdir -p ${multiqc} && cd ${multiqc}
      n=0
      stage() { for f in "$$@"; do [ -e "$$f" ] || continue; n=$$((n + 1)); mkdir $$n; ln -s "$${f%/}" $$n/; echo "$$(basename "$${f%/}")" >> multiqc_inputs.txt; done; }
      stage ${nfcore}/assets/multiqc_config.yml ${mqc_inputs}/multiqc_sample_merge.yml
      stage ${fastqc_raw}/*/*_fastqc.zip
      stage ${trimgalore}/*/*_trimming_report.txt ${trimgalore}/*/*_trimming_report.json ${trimgalore}/*/*_fastqc.zip
      stage ${bbsplit}/*/*.stats.txt
      stage ${fastqc_filtered}/*/*_fastqc.zip
      stage ${star_align}/*/*.Log.final.out
      stage ${salmon_quant}/*/*/
      stage ${markdup_chain}/*/md_stats/*.stats ${markdup_chain}/*/md_flagstat/*.flagstat ${markdup_chain}/*/md_idxstats/*.idxstats ${markdup}/*/*.metrics.txt
      stage ${biotype}/*/*.biotype_counts_mqc.tsv
      stage ${qualimap}/*/*/
      stage ${dupradar}/*/*_dup_intercept_mqc.txt ${dupradar}/*/*_duprateExpDensCurve_mqc.txt
      stage ${rseqc}/*/rseqc_bamstat/*.bam_stat.txt ${rseqc}/*/rseqc_infer/*.infer_experiment.txt ${rseqc}/*/rseqc_innerdist/*.inner_distance_freq.txt
      stage ${rseqc}/*/rseqc_junc_annot/*.junction_annotation.log ${rseqc}/*/rseqc_junc_sat/*.junctionSaturation_plot.r
      stage ${rseqc}/*/rseqc_readdist/*.read_distribution.txt ${rseqc}/*/rseqc_readdup/*.pos.DupRate.xls
      stage ${ss_deseq2}/*_mqc.tsv ${ps_deseq2}/*_mqc.tsv
      stage ${mqc_inputs}/*_mqc.json ${mqc_inputs}/fail_*_mqc.tsv
      ln -s ${mqc_inputs}/name_replacement.txt name_replacement.txt
      multiqc \
          --force \
           \
          --config 1/multiqc_config.yml --config 2/multiqc_sample_merge.yml \
          --filename multiqc_report.html \
           \
          --replace-names name_replacement.txt \
           \
          .
      rm -r name_replacement.txt $$(seq 1 $$n)
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
