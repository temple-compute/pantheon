# Generated by scripts/gen_tuned.py from workflow.yaml; do not edit by hand.
# Same images and commands as workflow.yaml, with same-image per-sample stages chained:
# 54 tasks (28 maps) instead of 71 (45 maps).
kind: horus_workflow
name: nf-core rnaseq tuned
capacity:
  local://ubuntu-awow:
    cpus: 16
    memory_gb: 31
max_concurrency: 16
artifacts:
- id: samplesheet
  name: Samplesheet
  kind: file
  path: examples/samplesheet.csv
  description: 'nf-core/rnaseq samplesheet (sample,fastq_1,fastq_2,strandedness). Reads may be URLs or paths relative to the samplesheet; rows sharing a sample are runs of one sample. Default: the test profile samplesheet (7 runs, 5 samples).'
- id: nfcore
  name: nf-core/rnaseq files
  kind: folder
  path: nfcore/
  description: nf-core/rnaseq 3.27.0 assets, bin/deseq2_qc.r and module templates (MIT).
- id: decide_py
  name: Decision script
  kind: file
  path: scripts/decide.py
  description: The pipeline's Groovy-side decisions as a script.
- id: input_mirror
  name: Local input mirror
  kind: string
  path: params/input_mirror.txt
  description: Folder searched for each input file by name before downloading it (e.g. a local copy of the test data). Empty downloads everything.
  value: ''
  pattern: '[^"`$\\]*'
- id: fasta_url
  name: Genome fasta
  kind: string
  path: params/fasta_url.txt
  pattern: '[^"`$\\]*'
  description: --fasta
  value: https://raw.githubusercontent.com/nf-core/test-datasets/626c8fab639062eade4b10747e919341cbf9b41a/reference/genome.fasta
- id: gtf_url
  name: GTF
  kind: string
  path: params/gtf_url.txt
  pattern: '[^"`$\\]*'
  description: --gtf (gzipped or plain)
  value: https://raw.githubusercontent.com/nf-core/test-datasets/626c8fab639062eade4b10747e919341cbf9b41a/reference/genes_with_empty_tid.gtf.gz
- id: transcript_fasta_url
  name: Transcript fasta
  kind: string
  path: params/transcript_fasta_url.txt
  pattern: '[^"`$\\]*'
  description: --transcript_fasta
  value: https://raw.githubusercontent.com/nf-core/test-datasets/626c8fab639062eade4b10747e919341cbf9b41a/reference/transcriptome.fasta
- id: additional_fasta_url
  name: Additional fasta
  kind: string
  path: params/additional_fasta_url.txt
  pattern: '[^"`$\\]*'
  description: --additional_fasta (gzipped or plain)
  value: https://raw.githubusercontent.com/nf-core/test-datasets/626c8fab639062eade4b10747e919341cbf9b41a/reference/gfp.fa.gz
- id: bbsplit_fasta_list_url
  name: BBSplit fasta list
  kind: string
  path: params/bbsplit_fasta_list_url.txt
  pattern: '[^"`$\\]*'
  description: --bbsplit_fasta_list (name,fasta rows)
  value: https://raw.githubusercontent.com/nf-core/test-datasets/626c8fab639062eade4b10747e919341cbf9b41a/reference/bbsplit_fasta_list.txt
- id: salmon_index_url
  name: Salmon index
  kind: string
  path: params/salmon_index_url.txt
  pattern: '[^"`$\\]*'
  description: --salmon_index (.tar.gz)
  value: https://raw.githubusercontent.com/nf-core/test-datasets/cad884e7fbe5617dcd55bdd07d9ddf65b54febe4/reference/salmon_2.7.0.tar.gz
- id: min_trimmed_reads
  name: Min trimmed reads
  kind: number
  path: params/min_trimmed_reads.json
  value: 10000
  min: 0
  description: --min_trimmed_reads
- id: min_mapped_reads
  name: Min mapped reads
  kind: number
  path: params/min_mapped_reads.json
  value: 5
  min: 0
  max: 100
  description: --min_mapped_reads (STAR uniquely mapped %)
- id: stranded_threshold
  name: Stranded threshold
  kind: number
  path: params/stranded_threshold.json
  value: 0.8
  min: 0.5
  max: 1
  description: --stranded_threshold
- id: unstranded_threshold
  name: Unstranded threshold
  kind: number
  path: params/unstranded_threshold.json
  value: 0.1
  min: 0
  max: 1
  description: --unstranded_threshold
tasks:
- kind: horus_task
  id: fetch_reference
  name: Fetch reference files
  description: Downloads the genome, GTF, transcriptome, GFP fasta, BBSplit fastas and Salmon index (or copies them from the mirror).
  inputs:
  - id: input_mirror
    name: Local input mirror
    kind: string
    path: params/input_mirror.txt
  - id: fasta_url
    name: Genome fasta
    kind: string
    path: params/fasta_url.txt
  - id: gtf_url
    name: GTF
    kind: string
    path: params/gtf_url.txt
  - id: transcript_fasta_url
    name: Transcript fasta
    kind: string
    path: params/transcript_fasta_url.txt
  - id: additional_fasta_url
    name: Additional fasta
    kind: string
    path: params/additional_fasta_url.txt
  - id: bbsplit_fasta_list_url
    name: BBSplit fasta list
    kind: string
    path: params/bbsplit_fasta_list_url.txt
  - id: salmon_index_url
    name: Salmon index
    kind: string
    path: params/salmon_index_url.txt
  outputs:
  - id: reference
    name: Reference files
    kind: folder
    path: work/reference/
  executor:
    kind: shell
  runtime:
    kind: python_script
    script: scripts/stage_inputs.py
    python: python3
    args: reference --fasta ${fasta_url} --gtf ${gtf_url} --transcript_fasta ${transcript_fasta_url} --additional_fasta ${additional_fasta_url} --bbsplit_fasta_list ${bbsplit_fasta_list_url} --salmon_index ${salmon_index_url} --mirror ${input_mirror} --out ${reference}
  target:
    kind: local
- kind: horus_task
  id: stage_samples
  name: Split the samplesheet into samples
  description: Fetches each sample's reads and writes one meta file per sample, merging runs as the samplesheet check does.
  inputs:
  - id: samplesheet
    name: Samplesheet
    kind: file
    path: examples/samplesheet.csv
  - id: input_mirror
    name: Local input mirror
    kind: string
    path: params/input_mirror.txt
  outputs:
  - id: reads
    name: Reads
    kind: folder
    path: work/reads/
  - id: samples
    name: Samples
    kind: folder
    path: work/samples/
  - id: multi_run
    name: Multi-run samples
    kind: folder
    path: work/multi_run/
  executor:
    kind: shell
  runtime:
    kind: python_script
    script: scripts/stage_inputs.py
    python: python3
    args: samples --samplesheet ${samplesheet} --mirror ${input_mirror} --reads ${reads} --samples ${samples} --multi-run ${multi_run}
  target:
    kind: local
- kind: horus_task
  id: add_fasta
  name: GUNZIP_ADDITIONAL_FASTA
  inputs:
  - id: reference
    name: Reference files
    kind: folder
    path: work/reference/
  outputs:
  - id: add_fasta
    name: Additional fasta
    kind: folder
    path: work/genome/additional_fasta/
  resources:
    cpus: 1
    memory_gb: 6
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: community.wave.seqera.io/library/coreutils_grep_gzip_lbzip2_pruned:838ba80435a629f8
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      . ${reference}/refs.env
      rm -rf ${add_fasta} && mkdir -p ${add_fasta} && cd ${add_fasta}
      f=$$ref_additional_fasta
      ln -s ${reference}/$$f $$f
      case $$f in
      *.gz)
      # Not calling gunzip itself because it creates files
      # with the original group ownership rather than the
      # default one for that user / the work directory
      gzip \
          -cd \
           \
          $$f \
          > $${f%.gz}
      ;;
      *) cp $$f $$f.tmp ;;
      esac
      rm $$f
      [ -e $$f.tmp ] && mv $$f.tmp $$f || true
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: salmon_idx
  name: UNTAR_SALMON_INDEX
  inputs:
  - id: reference
    name: Reference files
    kind: folder
    path: work/reference/
  outputs:
  - id: salmon_idx
    name: Salmon index
    kind: folder
    path: work/genome/salmon_index/
  resources:
    cpus: 1
    memory_gb: 6
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: community.wave.seqera.io/library/coreutils_grep_gzip_lbzip2_pruned:838ba80435a629f8
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      . ${reference}/refs.env
      rm -rf ${salmon_idx} && mkdir -p ${salmon_idx} && cd ${salmon_idx}
      f=$$ref_salmon_index
      ln -s ${reference}/$$f $$f
      prefix=$${f%.gz}; prefix=$${prefix%.tgz}; prefix=$${prefix%.tar}
      mkdir $$prefix

      ## Ensures --strip-components only applied when top level of tar contents is a directory
      ## If just files or multiple directories, place all in prefix
      if [[ $$(tar -taf $$f | grep -o -P "^.*?\/" | uniq | wc -l) -eq 1 ]]; then
          tar \
              -C $$prefix --strip-components 1 \
              -xavf \
               \
              $$f \
              --no-same-owner
      else
          tar \
              -C $$prefix \
              -xavf \
               \
              $$f \
              --no-same-owner
      fi
      rm $$f
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: gtf
  name: GUNZIP_GTF
  inputs:
  - id: reference
    name: Reference files
    kind: folder
    path: work/reference/
  outputs:
  - id: gtf
    name: GTF
    kind: folder
    path: work/genome/gtf/
  resources:
    cpus: 1
    memory_gb: 6
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: community.wave.seqera.io/library/coreutils_grep_gzip_lbzip2_pruned:838ba80435a629f8
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      . ${reference}/refs.env
      rm -rf ${gtf} && mkdir -p ${gtf} && cd ${gtf}
      f=$$ref_gtf
      ln -s ${reference}/$$f $$f
      case $$f in
      *.gz)
      # Not calling gunzip itself because it creates files
      # with the original group ownership rather than the
      # default one for that user / the work directory
      gzip \
          -cd \
           \
          $$f \
          > $${f%.gz}
      ;;
      *) cp $$f $$f.tmp ;;
      esac
      rm $$f
      [ -e $$f.tmp ] && mv $$f.tmp $$f || true
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: gtf_filtered
  name: CUSTOM_GTFFILTER
  inputs:
  - id: reference
    name: Reference files
    kind: folder
    path: work/reference/
  - id: gtf
    name: GTF
    kind: folder
    path: work/genome/gtf/
  - id: nfcore
    name: nf-core/rnaseq files
    kind: folder
    path: nfcore/
  outputs:
  - id: gtf_filtered
    name: Filtered GTF
    kind: folder
    path: work/genome/gtf_filtered/
  resources:
    cpus: 1
    memory_gb: 6
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: community.wave.seqera.io/library/python:3.14.5--dc8358b3c5eeb927
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      . ${reference}/refs.env
      rm -rf ${gtf_filtered} && mkdir -p ${gtf_filtered} && cd ${gtf_filtered}
      g=$$(cd ${gtf} && ls)
      ln -s ${reference}/$$ref_fasta $$ref_fasta
      ln -s ${gtf}/$$g $$g
      NF_ARGS= NF_FASTA=$$ref_fasta NF_GTF=$$g NF_OUT=$${g%.gtf}.filtered.gtf \
      NF_PROCESS=NFCORE_RNASEQ:PREPARE_GENOME_REFERENCES:CUSTOM_GTFFILTER \
          /usr/bin/env python ${nfcore}/templates/gtffilter.py
      rm $$ref_fasta $$g
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: genome
  name: CUSTOM_CATADDITIONALFASTA
  inputs:
  - id: reference
    name: Reference files
    kind: folder
    path: work/reference/
  - id: add_fasta
    name: Additional fasta
    kind: folder
    path: work/genome/additional_fasta/
  - id: gtf_filtered
    name: Filtered GTF
    kind: folder
    path: work/genome/gtf_filtered/
  - id: nfcore
    name: nf-core/rnaseq files
    kind: folder
    path: nfcore/
  outputs:
  - id: genome
    name: Genome plus additional fasta
    kind: folder
    path: work/genome/genome/
  resources:
    cpus: 1
    memory_gb: 6
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/python:3.12
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      . ${reference}/refs.env
      rm -rf ${genome} && mkdir -p ${genome} && cd ${genome}
      add=$$(cd ${add_fasta} && ls)
      g=$$(cd ${gtf_filtered} && ls *.gtf)
      ln -s ${reference}/$$ref_fasta $$ref_fasta
      ln -s ${add_fasta}/$$add $$add
      ln -s ${gtf_filtered}/$$g $$g
      # ext.prefix: "<fasta.baseName>_<add_fasta.baseName>"
      NF_FASTA=$$ref_fasta NF_ADD_FASTA=$$add NF_GTF=$$g NF_BIOTYPE=gene_biotype \
      NF_PREFIX=$${ref_fasta%.*}_$${add%.*} \
      NF_PROCESS=NFCORE_RNASEQ:PREPARE_GENOME_REFERENCES:CUSTOM_CATADDITIONALFASTA \
          /usr/bin/env python3 ${nfcore}/templates/fasta2gtf.py
      rm $$ref_fasta $$add $$g
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: faidx
  name: SAMTOOLS_FAIDX
  inputs:
  - id: genome
    name: Genome plus additional fasta
    kind: folder
    path: work/genome/genome/
  outputs:
  - id: faidx
    name: Fasta index
    kind: folder
    path: work/genome/faidx/
  resources:
    cpus: 1
    memory_gb: 6
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: community.wave.seqera.io/library/htslib_samtools:1.24--d697cfb9dce007cd
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      rm -rf ${faidx} && mkdir -p ${faidx} && cd ${faidx}
      fa=$$(cd ${genome}/out && ls *.fasta)
      ln -s ${genome}/out/$$fa $$fa
      samtools \
          faidx \
          $$fa \


      cut -f 1,2 $$fa.fai > $$fa.sizes
      rm $$fa
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: gene_bed
  name: EAUTILS_GTF2BED
  inputs:
  - id: genome
    name: Genome plus additional fasta
    kind: folder
    path: work/genome/genome/
  - id: nfcore
    name: nf-core/rnaseq files
    kind: folder
    path: nfcore/
  outputs:
  - id: gene_bed
    name: Gene BED
    kind: folder
    path: work/genome/gene_bed/
  resources:
    cpus: 2
    memory_gb: 12
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/perl:5.26.2
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      rm -rf ${gene_bed} && mkdir -p ${gene_bed} && cd ${gene_bed}
      g=$$(cd ${genome}/out && ls *.gtf)
      ln -s ${genome}/out/$$g $$g
      NF_ARGS= NF_GTF=$$g NF_PREFIX=$${g%.gtf} NF_PROCESS=NFCORE_RNASEQ:PREPARE_GENOME_REFERENCES:EAUTILS_GTF2BED \
          /usr/bin/env perl ${nfcore}/templates/gtf2bed.pl
      rm $$g
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: bbsplit_idx
  name: PREPARE_GENOME_INDICES BBMAP_BBSPLIT
  inputs:
  - id: reference
    name: Reference files
    kind: folder
    path: work/reference/
  - id: genome
    name: Genome plus additional fasta
    kind: folder
    path: work/genome/genome/
  outputs:
  - id: bbsplit_idx
    name: BBSplit index
    kind: folder
    path: work/genome/bbsplit_index/
  resources:
    cpus: 4
    memory_gb: 15
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: community.wave.seqera.io/library/bbmap_pigz:07416fe99b090fa9
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      rm -rf ${bbsplit_idx} && mkdir -p ${bbsplit_idx} && cd ${bbsplit_idx}
      . ${reference}/refs.env
      fa=$$(cd ${genome}/out && ls *.fasta)
      ln -s ${genome}/out/$$fa $$fa
      refs=""
      while IFS=, read -r name file; do
          ln -s ${reference}/$$file $$file
          refs="$$refs ref_$$name=$$file"
      done < ${reference}/$$ref_bbsplit_fasta_list
      # If using a pre-built index, create writable structure: symlink all files except
      # summary.txt (which we copy to modify). When we stage in the index files the time
      # stamps get disturbed, which bbsplit doesn't like. Fix the time stamps in summaries.
      if [ "false" == "true" ]; then
          :
      fi

      # Run BBSplit

      bbsplit.sh \
          -Xmx$$(( ${task.resources.memory_gb} * 1024 * 8 / 10 ))M \
          ref_primary=$$fa$$refs path=bbsplit_build \
          threads=${task.resources.cpus} \
           \
           \
           \
          build=1 2>| >(tee genome_transcriptome.log >&2)

      # Summary files will have an absolute path that will make the index
      # impossible to use in other processes - fix paths and rename atomically
      if [ -d bbsplit_build/ref/genome ]; then
          find bbsplit_build/ref/genome -name summary.txt | while read -r summary_file; do
              sed "s|^source.*|source\t$$(grep '^source' "$$summary_file" | cut -f2- -d$$'\t' | sed 's|.*/bbsplit_build|bbsplit_index|')|" "$$summary_file" > $${summary_file}.tmp && mv $${summary_file}.tmp $${summary_file}
          done
          mv bbsplit_build bbsplit_index
      fi
      rm $$fa
      while IFS=, read -r name file; do rm $$file; done < ${reference}/$$ref_bbsplit_fasta_list
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: star_idx
  name: STAR_GENOMEGENERATE
  inputs:
  - id: genome
    name: Genome plus additional fasta
    kind: folder
    path: work/genome/genome/
  outputs:
  - id: star_idx
    name: STAR index
    kind: folder
    path: work/genome/star_index/
  resources:
    cpus: 4
    memory_gb: 15
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: community.wave.seqera.io/library/htslib_samtools_star_gawk:ae438e9a604351a4
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      rm -rf ${star_idx} && mkdir -p ${star_idx} && cd ${star_idx}
      fa=$$(cd ${genome}/out && ls *.fasta)
      g=$$(cd ${genome}/out && ls *.gtf)
      ln -s ${genome}/out/$$fa $$fa
      ln -s ${genome}/out/$$g $$g
      samtools faidx $$fa
      NUM_BASES=`gawk '{sum = sum + $$2}END{if ((log(sum)/log(2))/2 - 1 > 14) {printf "%.0f", 14} else {printf "%.0f", (log(sum)/log(2))/2 - 1}}' $$fa.fai`

      mkdir star
      STAR \
          --runMode genomeGenerate \
          --genomeDir star/ \
          --genomeFastaFiles $$fa \
          --sjdbGTFfile $$g \
          --runThreadN ${task.resources.cpus} \
          --genomeSAindexNbases $$NUM_BASES \
          --limitGenomeGenerateRAM $$(( ${task.resources.memory_gb} * 1024 * 1024 * 1024 - 100000000 )) \

      rm $$fa $$g
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_map
  id: cat_fastq
  name: CAT_FASTQ
  description: Concatenates the runs of samples sequenced more than once.
  over:
    input_id: multi_run
    as: sample
  max_concurrency: 16
  inputs:
  - id: multi_run
    name: Multi-run samples
    kind: folder
    path: work/multi_run/
  - id: reads
    name: Reads
    kind: folder
    path: work/reads/
  outputs:
  - id: cat_fastq
    name: Merged runs
    kind: folder
    path: work/cat_fastq/
  resources:
    cpus: 1
    memory_gb: 6
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: community.wave.seqera.io/library/coreutils_grep_gzip_lbzip2_pruned:838ba80435a629f8
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      id=$$(basename ${sample}); . ${sample}
      rm -rf ${cat_fastq} && mkdir -p ${cat_fastq} && cd ${cat_fastq}
      d=${reads}/$$id
      case $$(head -n 1 $$d/reads.txt) in *.gz) compress= ;; *) compress='| gzip' ;; esac
      if [ $$single_end = true ]; then
          eval "cat $$(sed "s#^#$$d/#" $$d/reads.txt | tr '\n' ' ') $$compress > $${id}.merged.fastq.gz"
      else
          eval "cat $$(awk -v d=$$d 'NR % 2 == 1 {printf "%s/%s ", d, $$0}' $$d/reads.txt) $$compress > $${id}_1.merged.fastq.gz"
          eval "cat $$(awk -v d=$$d 'NR % 2 == 0 {printf "%s/%s ", d, $$0}' $$d/reads.txt) $$compress > $${id}_2.merged.fastq.gz"
      fi
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_map
  id: lint_raw
  name: FQ_LINT
  over:
    input_id: samples
    as: sample
  max_concurrency: 16
  inputs:
  - id: samples
    name: Samples
    kind: folder
    path: work/samples/
  - id: reads
    name: Reads
    kind: folder
    path: work/reads/
  - id: cat_fastq
    name: Merged runs
    kind: folder
    path: work/cat_fastq/
  outputs:
  - id: lint_raw
    name: fq lint raw
    kind: folder
    path: results/fq_lint/raw/
  resources:
    cpus: 2
    memory_gb: 12
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/fq:0.12.0--h9ee0642_0
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      id=$$(basename ${sample}); . ${sample}
      rm -rf ${lint_raw} && mkdir -p ${lint_raw} && cd ${lint_raw}
      if [ $$merged = true ]; then
          if [ $$single_end = true ]; then ln -s ${cat_fastq}/*/$${id}.merged.fastq.gz .
          else ln -s ${cat_fastq}/*/$${id}_1.merged.fastq.gz ${cat_fastq}/*/$${id}_2.merged.fastq.gz .; fi
          fqs=$$(ls *.merged.fastq.gz | tr '\n' ' ')
      else
          fqs=$$(tr '\n' ' ' < ${reads}/$$id/reads.txt)
          for f in $$fqs; do ln -s ${reads}/$$id/$$f $$f; done
      fi
      fq lint \
          --disable-validator P001 \
          $${fqs% } > $${id}.fq_lint.txt
      rm $$fqs
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_map
  id: fastqc_raw
  name: FASTQC
  over:
    input_id: samples
    as: sample
  max_concurrency: 16
  inputs:
  - id: samples
    name: Samples
    kind: folder
    path: work/samples/
  - id: reads
    name: Reads
    kind: folder
    path: work/reads/
  - id: cat_fastq
    name: Merged runs
    kind: folder
    path: work/cat_fastq/
  - id: lint_raw
    name: fq lint raw
    kind: folder
    path: results/fq_lint/raw/
  outputs:
  - id: fastqc_raw
    name: FastQC raw
    kind: folder
    path: results/fastqc/raw/
  resources:
    cpus: 2
    memory_gb: 12
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      id=$$(basename ${sample}); . ${sample}
      rm -rf ${fastqc_raw} && mkdir -p ${fastqc_raw} && cd ${fastqc_raw}
      if [ $$merged = true ]; then
          if [ $$single_end = true ]; then set -- ${cat_fastq}/*/$${id}.merged.fastq.gz
          else set -- ${cat_fastq}/*/$${id}_1.merged.fastq.gz ${cat_fastq}/*/$${id}_2.merged.fastq.gz; fi
      else
          set -- $$(sed "s#^#${reads}/$$id/#" ${reads}/$$id/reads.txt)
      fi
      pairs=""; names=""; i=0
      for f in "$$@"; do
          i=$$((i + 1))
          mkdir -p $$i && ln -s $$f $$i/
          if [ $$# -eq 1 ]; then new=$${id}_raw.$${f##*.}; else new=$${id}_raw_$$i.$${f##*.}; fi
          pairs="$$pairs $$i/$$(basename $$f) $$new"; names="$$names $$new"
      done
      mem=$$(( ${task.resources.memory_gb} * 1024 / ${task.resources.cpus} ))
      [ $$mem -gt 10000 ] && mem=10000
      [ $$mem -lt 100 ] && mem=100
      printf "%s %s\n" $$pairs | while read old_name new_name; do
          [ -f "$${new_name}" ] || ln -s $$old_name $$new_name
      done

      fastqc \
          --quiet \
          --threads ${task.resources.cpus} \
          --memory $$mem \
          $${names# }
      rm $$names; rm -r $$(seq 1 $$#)
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_map
  id: trimgalore
  name: TRIMGALORE
  over:
    input_id: samples
    as: sample
  max_concurrency: 16
  inputs:
  - id: samples
    name: Samples
    kind: folder
    path: work/samples/
  - id: reads
    name: Reads
    kind: folder
    path: work/reads/
  - id: cat_fastq
    name: Merged runs
    kind: folder
    path: work/cat_fastq/
  - id: lint_raw
    name: fq lint raw
    kind: folder
    path: results/fq_lint/raw/
  outputs:
  - id: trimgalore
    name: TrimGalore
    kind: folder
    path: results/trimgalore/
  resources:
    cpus: 4
    memory_gb: 4
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: community.wave.seqera.io/library/trim-galore:2.3.0--6a38a479b4972363
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      id=$$(basename ${sample}); . ${sample}
      rm -rf ${trimgalore} && mkdir -p ${trimgalore} && cd ${trimgalore}
      if [ $$merged = true ]; then
          if [ $$single_end = true ]; then set -- ${cat_fastq}/*/$${id}.merged.fastq.gz
          else set -- ${cat_fastq}/*/$${id}_1.merged.fastq.gz ${cat_fastq}/*/$${id}_2.merged.fastq.gz; fi
      else
          set -- $$(sed "s#^#${reads}/$$id/#" ${reads}/$$id/reads.txt)
      fi
      # --cores: task.cpus - 4 (paired) or - 3 (single), clamped to 1..8
      cores=$$(( ${task.resources.cpus} - 4 ))
      [ $$single_end = true ] && cores=$$(( ${task.resources.cpus} - 3 ))
      [ $$cores -lt 1 ] && cores=1
      [ $$cores -gt 8 ] && cores=8
      for f in "$$@"; do ln -s $$f $$(basename $$f); done
      if [ $$single_end = true ]; then
      [ ! -f  $${id}_trimmed.fastq.gz ] && ln -s $$(basename $$1) $${id}_trimmed.fastq.gz
      trim_galore \
          --fastqc_args '-t ${task.resources.cpus}' \
          --cores $$cores \
          --gzip \
          $${id}_trimmed.fastq.gz
      rm $${id}_trimmed.fastq.gz
      else
      [ ! -f  $${id}_trimmed_1.fastq.gz ] && ln -s $$(basename $$1) $${id}_trimmed_1.fastq.gz
      [ ! -f  $${id}_trimmed_2.fastq.gz ] && ln -s $$(basename $$2) $${id}_trimmed_2.fastq.gz
      trim_galore \
          --fastqc_args '-t ${task.resources.cpus}' \
          --cores $$cores \
          --paired \
          --gzip \
          $${id}_trimmed_1.fastq.gz \
          $${id}_trimmed_2.fastq.gz
      rm $${id}_trimmed_1.fastq.gz $${id}_trimmed_2.fastq.gz
      fi
      for f in "$$@"; do rm $$(basename $$f); done
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
