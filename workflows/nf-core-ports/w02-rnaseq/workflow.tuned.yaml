      # RSEQC_INNERDISTANCE
      id=$$(basename ${sample}); . ${sample}
      rm -rf ${rseqc}/rseqc_innerdist && mkdir -p ${rseqc}/rseqc_innerdist && cd ${rseqc}/rseqc_innerdist
      bed=$$(cd ${gene_bed} && ls *.bed); ln -s ${gene_bed}/$$bed $$bed
      ln -s ${markdup}/*/$$id.markdup.sorted.bam . && ln -s ${markdup_chain}/*/md_index/$$id.markdup.sorted.bam.bai .
      if [ $$single_end = true ]; then
      echo "inner_distance.py doesn't support single-end data" > $$id.inner_distance.txt
      else
      inner_distance.py \
          -i $$id.markdup.sorted.bam \
          -r $$bed \
          -o $$id \
           \
          > stdout.txt
      head -n 2 stdout.txt > $$id.inner_distance_mean.txt
      fi
