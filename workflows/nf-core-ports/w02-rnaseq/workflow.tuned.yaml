      # RSEQC_READDISTRIBUTION
      id=$$(basename ${sample}); . ${sample}
      rm -rf ${rseqc}/rseqc_readdist && mkdir -p ${rseqc}/rseqc_readdist && cd ${rseqc}/rseqc_readdist
      bed=$$(cd ${gene_bed} && ls *.bed); ln -s ${gene_bed}/$$bed $$bed
      ln -s ${markdup}/*/$$id.markdup.sorted.bam . && ln -s ${markdup_chain}/*/md_index/$$id.markdup.sorted.bam.bai .
      read_distribution.py \
           \
          -i $$id.markdup.sorted.bam \
          -r $$bed \
          > $$id.read_distribution.txt
      rm $$bed $$id.markdup.sorted.bam $$id.markdup.sorted.bam.bai
      NF
      cat > /tmp/.command7.sh <<'NF'
      # RSEQC_READDUPLICATION
      id=$$(basename ${sample}); . ${sample}
      rm -rf ${rseqc}/rseqc_readdup && mkdir -p ${rseqc}/rseqc_readdup && cd ${rseqc}/rseqc_readdup
      ln -s ${markdup}/*/$$id.markdup.sorted.bam . && ln -s ${markdup_chain}/*/md_index/$$id.markdup.sorted.bam.bai .
      read_duplication.py \
          -i $$id.markdup.sorted.bam \
          -o $$id \

      rm $$id.markdup.sorted.bam $$id.markdup.sorted.bam.bai
      NF
      mkdir -p ${rseqc}
      bash -C -e -u -o pipefail /tmp/.command1.sh && bash -C -e -u -o pipefail /tmp/.command2.sh && bash -C -e -u -o pipefail /tmp/.command3.sh && bash -C -e -u -o pipefail /tmp/.command4.sh && bash -C -e -u -o pipefail /tmp/.command5.sh && bash -C -e -u -o pipefail /tmp/.command6.sh && bash -C -e -u -o pipefail /tmp/.command7.sh
  target:
    kind: local
