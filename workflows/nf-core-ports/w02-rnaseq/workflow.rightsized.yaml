artifacts:
- id: samplesheet
  name: Samplesheet
  kind: file
  path: examples/samplesheet.csv
  description: 'nf-core/rnaseq samplesheet (sample,fastq_1,fastq_2,strandedness).
    Reads may be URLs or paths relative to the samplesheet; rows sharing a sample
    are runs of one sample. Default: the test profile samplesheet (7 runs, 5 samples).'
- id: nfcore
  name: nf-core/rnaseq files
  kind: folder
  path: nfcore/
  description: nf-core/rnaseq 3.27.0 assets, bin/deseq2_qc.r and module templates
    (MIT).
- id: decide_py
  name: Decision script
  kind: file
  path: scripts/decide.py
  description: The pipeline's Groovy-side decisions as a script.
- id: input_mirror
  name: Local input mirror
  kind: string
  path: params/input_mirror.txt
  description: Folder searched for each input file by name before downloading it (e.g.
    a local copy of the test data). Empty downloads everything.
  value: ''
  pattern: '[^"`$\\]*'
- id: fasta_url
  name: Genome fasta
  kind: string
  path: params/fasta_url.txt
  pattern: '[^"`$\\]*'
