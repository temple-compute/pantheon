  min: 0
  max: 1
  description: --unstranded_threshold
tasks:
- kind: horus_task
  id: fetch_reference
  name: Fetch reference files
  description: Downloads the genome, GTF, transcriptome, GFP fasta, BBSplit fastas
    and Salmon index (or copies them from the mirror).
  inputs:
  - *id001
  - id: fasta_url
    name: Genome fasta
    kind: string
    path: params/fasta_url.txt
  - id: gtf_url
    name: GTF
    kind: string
    path: params/gtf_url.txt
  - id: transcript_fasta_url
    name: Transcript fasta
    kind: string
    path: params/transcript_fasta_url.txt
  - id: additional_fasta_url
    name: Additional fasta
    kind: string
    path: params/additional_fasta_url.txt
  - id: bbsplit_fasta_list_url
    name: BBSplit fasta list
    kind: string
    path: params/bbsplit_fasta_list_url.txt
  - id: salmon_index_url
    name: Salmon index
    kind: string
    path: params/salmon_index_url.txt
  outputs:
  - *id002
  executor:
    kind: shell
  runtime:
    kind: python_script
    script: scripts/stage_inputs.py
    python: python3
    args: reference --fasta ${fasta_url} --gtf ${gtf_url} --transcript_fasta ${transcript_fasta_url}
      --additional_fasta ${additional_fasta_url} --bbsplit_fasta_list ${bbsplit_fasta_list_url}
      --salmon_index ${salmon_index_url} --mirror ${input_mirror} --out ${reference}
  target:
    ref: small
- kind: horus_task
  id: stage_samples
  name: Split the samplesheet into samples
  description: Fetches each sample's reads and writes one meta file per sample, merging
    runs as the samplesheet check does.
  inputs:
  - *id003
  - *id001
  outputs:
  - *id004
  - *id005
  - *id006
  executor:
    kind: shell
  runtime:
    kind: python_script
    script: scripts/stage_inputs.py
    python: python3
    args: samples --samplesheet ${samplesheet} --mirror ${input_mirror} --reads ${reads}
      --samples ${samples} --multi-run ${multi_run}
  target:
    ref: small
- kind: horus_task
  id: add_fasta
  name: GUNZIP_ADDITIONAL_FASTA
  inputs:
  - *id002
  outputs:
  - *id007
  resources:
    cpus: 1
    memory_gb: 2
    walltime: 01:00:00
  executor: *id008
  runtime:
    kind: command
    command: "cat > /tmp/.command.sh <<'NF'\n. ${reference}/refs.env\nrm -rf ${add_fasta}\
      \ && mkdir -p ${add_fasta} && cd ${add_fasta}\nf=$$ref_additional_fasta\nln\
      \ -s ${reference}/$$f $$f\ncase $$f in\n*.gz)\n# Not calling gunzip itself because\
      \ it creates files\n# with the original group ownership rather than the\n# default\
      \ one for that user / the work directory\ngzip \\\n    -cd \\\n     \\\n   \
      \ $$f \\\n    > $${f%.gz}\n;;\n*) cp $$f $$f.tmp ;;\nesac\nrm $$f\n[ -e $$f.tmp\
      \ ] && mv $$f.tmp $$f || true\nNF\nexec bash -C -e -u -o pipefail /tmp/.command.sh\n"
  target:
    ref: small
- kind: horus_task
  id: salmon_idx
  name: UNTAR_SALMON_INDEX
  inputs:
  - *id002
  outputs:
  - *id009
  resources:
    cpus: 1
    memory_gb: 2
    walltime: 01:00:00
  executor: *id008
  runtime:
    kind: command
    command: "cat > /tmp/.command.sh <<'NF'\n. ${reference}/refs.env\nrm -rf ${salmon_idx}\
      \ && mkdir -p ${salmon_idx} && cd ${salmon_idx}\nf=$$ref_salmon_index\nln -s\
      \ ${reference}/$$f $$f\nprefix=$${f%.gz}; prefix=$${prefix%.tgz}; prefix=$${prefix%.tar}\n\
      mkdir $$prefix\n\n## Ensures --strip-components only applied when top level\
      \ of tar contents is a directory\n## If just files or multiple directories,\
      \ place all in prefix\nif [[ $$(tar -taf $$f | grep -o -P \"^.*?\\/\" | uniq\
