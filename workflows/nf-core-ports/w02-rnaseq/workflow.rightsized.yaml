      \ n=$$((n + 1)); mkdir $$n; ln -s \"$${f%/}\" $$n/; echo \"$$(basename \"$${f%/}\"\
      )\" >> multiqc_inputs.txt; done; }\nstage ${nfcore}/assets/multiqc_config.yml\
      \ ${mqc_inputs}/multiqc_sample_merge.yml\nstage ${fastqc_raw}/*/*_fastqc.zip\n\
      stage ${trimgalore}/*/*_trimming_report.txt ${trimgalore}/*/*_trimming_report.json\
      \ ${trimgalore}/*/*_fastqc.zip\nstage ${bbsplit}/*/*.stats.txt\nstage ${fastqc_filtered}/*/*_fastqc.zip\n\
      stage ${star_align}/*/*.Log.final.out\nstage ${salmon_quant}/*/*/\nstage ${md_stats}/*/*.stats\
      \ ${md_flagstat}/*/*.flagstat ${md_idxstats}/*/*.idxstats ${markdup}/*/*.metrics.txt\n\
      stage ${biotype}/*/*.biotype_counts_mqc.tsv\nstage ${qualimap}/*/*/\nstage ${dupradar}/*/*_dup_intercept_mqc.txt\
      \ ${dupradar}/*/*_duprateExpDensCurve_mqc.txt\nstage ${rseqc_bamstat}/*/*.bam_stat.txt\
      \ ${rseqc_infer}/*/*.infer_experiment.txt ${rseqc_innerdist}/*/*.inner_distance_freq.txt\n\
      stage ${rseqc_junc_annot}/*/*.junction_annotation.log ${rseqc_junc_sat}/*/*.junctionSaturation_plot.r\n\
      stage ${rseqc_readdist}/*/*.read_distribution.txt ${rseqc_readdup}/*/*.pos.DupRate.xls\n\
      stage ${ss_deseq2}/*_mqc.tsv ${ps_deseq2}/*_mqc.tsv\nstage ${mqc_inputs}/*_mqc.json\
      \ ${mqc_inputs}/fail_*_mqc.tsv\nln -s ${mqc_inputs}/name_replacement.txt name_replacement.txt\n\
      multiqc \\\n    --force \\\n     \\\n    --config 1/multiqc_config.yml --config\
      \ 2/multiqc_sample_merge.yml \\\n    --filename multiqc_report.html \\\n   \
      \  \\\n    --replace-names name_replacement.txt \\\n     \\\n    .\nrm -r name_replacement.txt\
      \ $$(seq 1 $$n)\nNF\nexec bash -C -e -u -o pipefail /tmp/.command.sh\n"
