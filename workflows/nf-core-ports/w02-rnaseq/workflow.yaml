kind: horus_workflow
name: nf-core rnaseq

# Native port of nf-core/rnaseq 3.27.0, the route `-profile test,docker` runs:
# TrimGalore, BBSplit, STAR + Salmon (star_salmon) and Salmon pseudo-alignment,
# Picard MarkDuplicates, StringTie, featureCounts biotypes, Qualimap, dupRadar,
# RSeQC, bigWigs and MultiQC. Preseq and RSeQC TIN are off, as in the
# pipeline defaults. Images, rendered command lines (ext.args from
# conf/modules/*.config) and per-process cpus/memory are the executed ones;
# the test profile caps every process at 4 cpus / 15 GB.
#
# Every command runs under `bash -C -e -u -o pipefail`, the pipeline's
# process.shell: the wave images link /bin/sh to dash, so each command writes
# its script to /tmp/.command.sh and runs that with bash, as .command.run does.
#
# Per-sample processes are horus_map stages over a folder of meta files
# (one per sample, named by sample id, bash-sourceable: single_end,
# strandedness, ...). Map slots are numbered, so every output file carries
# the sample id and a downstream stage finds its inputs as
# <upstream>/*/<id>.<suffix>. The pipeline's Groovy filters (min trimmed
# reads, auto strandedness, min mapped reads, stranded-only bigWigs) are
# decision tasks (scripts/decide.py) that write the next sample list.
#
# capacity: memory-based admission like Nextflow's local executor. The key
# is the target's location_id (local://<hostname>); set it to the host that
# runs the tasks, or the gate does not apply.

capacity:
  local://ubuntu-awow:
    cpus: 16
    memory_gb: 31
max_concurrency: 16

_target: &target
  kind: local

# Run on a remote node instead: point every task at this anchor.
# _target: &target
#   kind: ssh
#   host: bench-node.example.org
#   username: ubuntu
#   working_directory: /home/ubuntu/horus

# Containers (.command.run docker lines); `user: host` runs them as the
# calling user, as nf-core's `-u $(id -u):$(id -g)` does.
_img:
  coreutils: &coreutils {kind: docker, user: host, image: "community.wave.seqera.io/library/coreutils_grep_gzip_lbzip2_pruned:838ba80435a629f8"}
  python314: &python314 {kind: docker, user: host, image: "community.wave.seqera.io/library/python:3.14.5--dc8358b3c5eeb927"}
  python312: &python312 {kind: docker, user: host, image: "quay.io/biocontainers/python:3.12"}
  python31212: &python31212 {kind: docker, user: host, image: "quay.io/biocontainers/python:3.12.12"}
  python310: &python310 {kind: docker, user: host, image: "quay.io/biocontainers/python:3.10.4"}
  perl: &perl {kind: docker, user: host, image: "quay.io/biocontainers/perl:5.26.2"}
  samtools: &samtools {kind: docker, user: host, image: "community.wave.seqera.io/library/htslib_samtools:1.24--d697cfb9dce007cd"}
  star: &star {kind: docker, user: host, image: "community.wave.seqera.io/library/htslib_samtools_star_gawk:ae438e9a604351a4"}
  bbmap: &bbmap {kind: docker, user: host, image: "community.wave.seqera.io/library/bbmap_pigz:07416fe99b090fa9"}
  fq: &fq {kind: docker, user: host, image: "quay.io/biocontainers/fq:0.12.0--h9ee0642_0"}
  trimgalore: &trimgalore {kind: docker, user: host, image: "community.wave.seqera.io/library/trim-galore:2.3.0--6a38a479b4972363"}
  fastqc: &fastqc {kind: docker, user: host, image: "quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0"}
  salmon: &salmon {kind: docker, user: host, image: "community.wave.seqera.io/library/salmon:2.7.0--74784226202c61b9"}
  picard: &picard {kind: docker, user: host, image: "community.wave.seqera.io/library/picard:3.5.0--842d4c70c98af9b4"}
  stringtie: &stringtie {kind: docker, user: host, image: "community.wave.seqera.io/library/stringtie:3.0.3--e8043d00caecd051"}
  bedtools: &bedtools {kind: docker, user: host, image: "community.wave.seqera.io/library/bedtools_coreutils:a623c13f66d5262b"}
  bedclip: &bedclip {kind: docker, user: host, image: "quay.io/biocontainers/ucsc-bedclip:482--h0b57e2e_0"}
  bigwig: &bigwig {kind: docker, user: host, image: "quay.io/biocontainers/ucsc-bedgraphtobigwig:482--hdc0a859_0"}
  subread: &subread {kind: docker, user: host, image: "quay.io/biocontainers/subread:2.1.1--h577a1d6_0"}
  qualimap: &qualimap {kind: docker, user: host, image: "quay.io/biocontainers/qualimap:2.3--hdfd78af_0"}
  dupradar: &dupradar {kind: docker, user: host, image: "community.wave.seqera.io/library/bioconductor-dupradar:1.38.0--831da16eb40a64ab"}
  rseqc: &rseqc {kind: docker, user: host, image: "community.wave.seqera.io/library/rseqc_r-base:2e29d2dfda9cef15"}
  tximeta: &tximeta {kind: docker, user: host, image: "community.wave.seqera.io/library/bioconductor-tximeta_jq:78bccd386c46a07c"}
  se: &se {kind: docker, user: host, image: "quay.io/biocontainers/bioconductor-summarizedexperiment:1.32.0--r43hdfd78af_0"}
  deseq2: &deseq2 {kind: docker, user: host, image: "community.wave.seqera.io/library/r-base_r-optparse_r-ggplot2_r-rcolorbrewer_pruned:9e75394d0bc21987"}
  multiqc: &multiqc {kind: docker, user: host, image: "community.wave.seqera.io/library/multiqc:1.35--c17fb751507e9dfc"}

# Labels after the test profile's resourceLimits (trace.txt cpus / memory).
_res:
  single: &single {cpus: 1, memory_gb: 6, walltime: "01:00:00"}
  low: &low {cpus: 2, memory_gb: 12, walltime: "01:00:00"}
  high: &high {cpus: 4, memory_gb: 15, walltime: "01:00:00"}
  trimgalore: &res_trimgalore {cpus: 4, memory_gb: 4, walltime: "01:00:00"}

