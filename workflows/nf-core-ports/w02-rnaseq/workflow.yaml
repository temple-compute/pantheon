  # featureCounts biotype QC runs only when the GTF has gene_biotype on exon
  # rows (refs.env biotype_qc, from biotypeQcUsable); otherwise the slot
  # stays empty.
  - kind: horus_map
    id: featurecounts
    name: SUBREAD_FEATURECOUNTS
    over: {input_id: map_pass, as: sample}
    max_concurrency: 16
    inputs: [*a_map_pass, *a_markdup, *a_genome, *a_reference]
    outputs: [*a_featurecounts]
    resources: *high
    executor: *subread
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        . ${reference}/refs.env
        rm -rf ${featurecounts} && mkdir -p ${featurecounts} && cd ${featurecounts}
        [ $$biotype_qc = true ] || exit 0
        g=$$(cd ${genome}/out && ls *.gtf); ln -s ${genome}/out/$$g $$g
        ln -s ${markdup}/*/$$id.markdup.sorted.bam .
        case $$strandedness in forward) s=1 ;; reverse) s=2 ;; *) s=0 ;; esac
        if [ $$single_end = true ]; then paired_end=""; else paired_end="-p"; fi
        featureCounts \
            -B -C -g gene_biotype -t exon \
            $$paired_end \
            -T ${task.resources.cpus} \
            -a $$g \
            -s $$s \
            -o $$id.featureCounts.tsv \
            $$id.markdup.sorted.bam
        rm $$g $$id.markdup.sorted.bam
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

