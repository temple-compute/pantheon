        id=$$(basename ${sample}); . ${sample}
        rm -rf ${cov_rev} && mkdir -p ${cov_rev} && cd ${cov_rev}
        ln -s ${markdup}/*/$$id.markdup.sorted.bam .
        if [ $$strandedness = reverse ]; then prefix=$$id.forward; args="-split -du -strand + -bg"
        else prefix=$$id.reverse; args="-split -du -strand - -bg"; fi
        bedtools \
            genomecov \
            -ibam $$id.markdup.sorted.bam \
            $$args \
            | LC_ALL=C sort --parallel=${task.resources.cpus} --buffer-size=$$(( ${task.resources.memory_gb} / 2 ))G -k1,1 -k2,2n \
