artifacts:
  - <<: *a_samplesheet
    description: >-
      nf-core/rnaseq samplesheet (sample,fastq_1,fastq_2,strandedness). Reads may
      be URLs or paths relative to the samplesheet; rows sharing a sample are runs
      of one sample. Default: the test profile samplesheet (7 runs, 5 samples).
  - <<: *a_nfcore
    description: nf-core/rnaseq 3.27.0 assets, bin/deseq2_qc.r and module templates (MIT).
  - <<: *a_decide
    description: The pipeline's Groovy-side decisions as a script.
  - <<: *a_mirror
    description: >-
      Folder searched for each input file by name before downloading it (e.g. a
      local copy of the test data). Empty downloads everything.
    value: ""
    pattern: '[^"`$\\]*'
  - {id: fasta_url, name: Genome fasta, kind: string, path: params/fasta_url.txt, pattern: '[^"`$\\]*', description: "--fasta", value: "https://raw.githubusercontent.com/nf-core/test-datasets/626c8fab639062eade4b10747e919341cbf9b41a/reference/genome.fasta"}
  - {id: gtf_url, name: GTF, kind: string, path: params/gtf_url.txt, pattern: '[^"`$\\]*', description: "--gtf (gzipped or plain)", value: "https://raw.githubusercontent.com/nf-core/test-datasets/626c8fab639062eade4b10747e919341cbf9b41a/reference/genes_with_empty_tid.gtf.gz"}
  - {id: transcript_fasta_url, name: Transcript fasta, kind: string, path: params/transcript_fasta_url.txt, pattern: '[^"`$\\]*', description: "--transcript_fasta", value: "https://raw.githubusercontent.com/nf-core/test-datasets/626c8fab639062eade4b10747e919341cbf9b41a/reference/transcriptome.fasta"}
  - {id: additional_fasta_url, name: Additional fasta, kind: string, path: params/additional_fasta_url.txt, pattern: '[^"`$\\]*', description: "--additional_fasta (gzipped or plain)", value: "https://raw.githubusercontent.com/nf-core/test-datasets/626c8fab639062eade4b10747e919341cbf9b41a/reference/gfp.fa.gz"}
  - {id: bbsplit_fasta_list_url, name: BBSplit fasta list, kind: string, path: params/bbsplit_fasta_list_url.txt, pattern: '[^"`$\\]*', description: "--bbsplit_fasta_list (name,fasta rows)", value: "https://raw.githubusercontent.com/nf-core/test-datasets/626c8fab639062eade4b10747e919341cbf9b41a/reference/bbsplit_fasta_list.txt"}
  - {id: salmon_index_url, name: Salmon index, kind: string, path: params/salmon_index_url.txt, pattern: '[^"`$\\]*', description: "--salmon_index (.tar.gz)", value: "https://raw.githubusercontent.com/nf-core/test-datasets/cad884e7fbe5617dcd55bdd07d9ddf65b54febe4/reference/salmon_2.7.0.tar.gz"}
  - {<<: *a_min_trimmed, value: 10000, min: 0, description: "--min_trimmed_reads"}
  - {<<: *a_min_mapped, value: 5, min: 0, max: 100, description: "--min_mapped_reads (STAR uniquely mapped %)"}
  - {<<: *a_stranded_t, value: 0.8, min: 0.5, max: 1, description: "--stranded_threshold"}
  - {<<: *a_unstranded_t, value: 0.1, min: 0, max: 1, description: "--unstranded_threshold"}

tasks:
  # ---------------------------------------------------------------- inputs
  - kind: horus_task
    id: fetch_reference
    name: Fetch reference files
    description: Downloads the genome, GTF, transcriptome, GFP fasta, BBSplit fastas and Salmon index (or copies them from the mirror).
    inputs:
      - *a_mirror
      - {id: fasta_url, name: Genome fasta, kind: string, path: params/fasta_url.txt}
      - {id: gtf_url, name: GTF, kind: string, path: params/gtf_url.txt}
      - {id: transcript_fasta_url, name: Transcript fasta, kind: string, path: params/transcript_fasta_url.txt}
      - {id: additional_fasta_url, name: Additional fasta, kind: string, path: params/additional_fasta_url.txt}
      - {id: bbsplit_fasta_list_url, name: BBSplit fasta list, kind: string, path: params/bbsplit_fasta_list_url.txt}
      - {id: salmon_index_url, name: Salmon index, kind: string, path: params/salmon_index_url.txt}
    outputs: [*a_reference]
    executor: {kind: shell}
    runtime:
      kind: python_script
      script: scripts/stage_inputs.py
      python: python3 # stdlib only
      args: >-
        reference --fasta ${fasta_url} --gtf ${gtf_url} --transcript_fasta ${transcript_fasta_url}
        --additional_fasta ${additional_fasta_url} --bbsplit_fasta_list ${bbsplit_fasta_list_url}
        --salmon_index ${salmon_index_url} --mirror ${input_mirror} --out ${reference}
    target: *target

  - kind: horus_task
    id: stage_samples
    name: Split the samplesheet into samples
    description: Fetches each sample's reads and writes one meta file per sample, merging runs as the samplesheet check does.
    inputs: [*a_samplesheet, *a_mirror]
    outputs: [*a_reads, *a_samples, *a_multi_run]
    executor: {kind: shell}
    runtime:
      kind: python_script
      script: scripts/stage_inputs.py
      python: python3 # stdlib only
      args: samples --samplesheet ${samplesheet} --mirror ${input_mirror} --reads ${reads} --samples ${samples} --multi-run ${multi_run}
    target: *target

  # ---------------------------------------------------------------- genome
  - kind: horus_task
    id: add_fasta
    name: GUNZIP_ADDITIONAL_FASTA
    inputs: [*a_reference]
    outputs: [*a_add_fasta]
    resources: *single
    executor: *coreutils
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${reference}/refs.env
        rm -rf ${add_fasta} && mkdir -p ${add_fasta} && cd ${add_fasta}
        f=$$ref_additional_fasta
        ln -s ${reference}/$$f $$f
        case $$f in
        *.gz)
        # Not calling gunzip itself because it creates files
        # with the original group ownership rather than the
        # default one for that user / the work directory
        gzip \
            -cd \
             \
            $$f \
            > $${f%.gz}
        ;;
        *) cp $$f $$f.tmp ;;
        esac
        rm $$f
        [ -e $$f.tmp ] && mv $$f.tmp $$f || true
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: salmon_idx
    name: UNTAR_SALMON_INDEX
    inputs: [*a_reference]
    outputs: [*a_salmon_idx]
    resources: *single
    executor: *coreutils
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${reference}/refs.env
        rm -rf ${salmon_idx} && mkdir -p ${salmon_idx} && cd ${salmon_idx}
        f=$$ref_salmon_index
        ln -s ${reference}/$$f $$f
        prefix=$${f%.gz}; prefix=$${prefix%.tgz}; prefix=$${prefix%.tar}
        mkdir $$prefix

        ## Ensures --strip-components only applied when top level of tar contents is a directory
        ## If just files or multiple directories, place all in prefix
        if [[ $$(tar -taf $$f | grep -o -P "^.*?\/" | uniq | wc -l) -eq 1 ]]; then
            tar \
                -C $$prefix --strip-components 1 \
                -xavf \
                 \
                $$f \
                --no-same-owner
        else
            tar \
                -C $$prefix \
                -xavf \
                 \
                $$f \
                --no-same-owner
        fi
        rm $$f
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: gtf
    name: GUNZIP_GTF
    inputs: [*a_reference]
    outputs: [*a_gtf]
    resources: *single
    executor: *coreutils
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${reference}/refs.env
        rm -rf ${gtf} && mkdir -p ${gtf} && cd ${gtf}
        f=$$ref_gtf
        ln -s ${reference}/$$f $$f
        case $$f in
        *.gz)
        # Not calling gunzip itself because it creates files
        # with the original group ownership rather than the
        # default one for that user / the work directory
        gzip \
            -cd \
             \
            $$f \
            > $${f%.gz}
        ;;
        *) cp $$f $$f.tmp ;;
        esac
        rm $$f
        [ -e $$f.tmp ] && mv $$f.tmp $$f || true
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: gtf_filtered
    name: CUSTOM_GTFFILTER
    inputs: [*a_reference, *a_gtf, *a_nfcore]
    outputs: [*a_gtf_filtered]
    resources: *single
    executor: *python314
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${reference}/refs.env
        rm -rf ${gtf_filtered} && mkdir -p ${gtf_filtered} && cd ${gtf_filtered}
        g=$$(cd ${gtf} && ls)
        ln -s ${reference}/$$ref_fasta $$ref_fasta
        ln -s ${gtf}/$$g $$g
        NF_ARGS= NF_FASTA=$$ref_fasta NF_GTF=$$g NF_OUT=$${g%.gtf}.filtered.gtf \
        NF_PROCESS=NFCORE_RNASEQ:PREPARE_GENOME_REFERENCES:CUSTOM_GTFFILTER \
            /usr/bin/env python ${nfcore}/templates/gtffilter.py
        rm $$ref_fasta $$g
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: genome
    name: CUSTOM_CATADDITIONALFASTA
    inputs: [*a_reference, *a_add_fasta, *a_gtf_filtered, *a_nfcore]
    outputs: [*a_genome]
    resources: *single
    executor: *python312
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${reference}/refs.env
        rm -rf ${genome} && mkdir -p ${genome} && cd ${genome}
        add=$$(cd ${add_fasta} && ls)
        g=$$(cd ${gtf_filtered} && ls *.gtf)
        ln -s ${reference}/$$ref_fasta $$ref_fasta
        ln -s ${add_fasta}/$$add $$add
        ln -s ${gtf_filtered}/$$g $$g
        # ext.prefix: "<fasta.baseName>_<add_fasta.baseName>"
        NF_FASTA=$$ref_fasta NF_ADD_FASTA=$$add NF_GTF=$$g NF_BIOTYPE=gene_biotype \
        NF_PREFIX=$${ref_fasta%.*}_$${add%.*} \
        NF_PROCESS=NFCORE_RNASEQ:PREPARE_GENOME_REFERENCES:CUSTOM_CATADDITIONALFASTA \
            /usr/bin/env python3 ${nfcore}/templates/fasta2gtf.py
        rm $$ref_fasta $$add $$g
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: faidx
    name: SAMTOOLS_FAIDX
    inputs: [*a_genome]
    outputs: [*a_faidx]
    resources: *single
    executor: *samtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${faidx} && mkdir -p ${faidx} && cd ${faidx}
        fa=$$(cd ${genome}/out && ls *.fasta)
        ln -s ${genome}/out/$$fa $$fa
        samtools \
            faidx \
            $$fa \


        cut -f 1,2 $$fa.fai > $$fa.sizes
        rm $$fa
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: gene_bed
    name: EAUTILS_GTF2BED
    inputs: [*a_genome, *a_nfcore]
    outputs: [*a_gene_bed]
    resources: *low
    executor: *perl
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${gene_bed} && mkdir -p ${gene_bed} && cd ${gene_bed}
        g=$$(cd ${genome}/out && ls *.gtf)
        ln -s ${genome}/out/$$g $$g
        NF_ARGS= NF_GTF=$$g NF_PREFIX=$${g%.gtf} NF_PROCESS=NFCORE_RNASEQ:PREPARE_GENOME_REFERENCES:EAUTILS_GTF2BED \
            /usr/bin/env perl ${nfcore}/templates/gtf2bed.pl
        rm $$g
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: bbsplit_idx
    name: PREPARE_GENOME_INDICES BBMAP_BBSPLIT
    inputs: [*a_reference, *a_genome]
    outputs: [*a_bbsplit_idx]
    resources: *high
    executor: *bbmap
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${bbsplit_idx} && mkdir -p ${bbsplit_idx} && cd ${bbsplit_idx}
        . ${reference}/refs.env
        fa=$$(cd ${genome}/out && ls *.fasta)
        ln -s ${genome}/out/$$fa $$fa
        refs=""
        while IFS=, read -r name file; do
            ln -s ${reference}/$$file $$file
            refs="$$refs ref_$$name=$$file"
        done < ${reference}/$$ref_bbsplit_fasta_list
        # If using a pre-built index, create writable structure: symlink all files except
        # summary.txt (which we copy to modify). When we stage in the index files the time
        # stamps get disturbed, which bbsplit doesn't like. Fix the time stamps in summaries.
        if [ "false" == "true" ]; then
            :
        fi

        # Run BBSplit

        bbsplit.sh \
            -Xmx$$(( ${task.resources.memory_gb} * 1024 * 8 / 10 ))M \
            ref_primary=$$fa$$refs path=bbsplit_build \
            threads=${task.resources.cpus} \
             \
             \
             \
            build=1 2>| >(tee genome_transcriptome.log >&2)

        # Summary files will have an absolute path that will make the index
        # impossible to use in other processes - fix paths and rename atomically
        if [ -d bbsplit_build/ref/genome ]; then
            find bbsplit_build/ref/genome -name summary.txt | while read -r summary_file; do
                sed "s|^source.*|source\t$$(grep '^source' "$$summary_file" | cut -f2- -d$$'\t' | sed 's|.*/bbsplit_build|bbsplit_index|')|" "$$summary_file" > $${summary_file}.tmp && mv $${summary_file}.tmp $${summary_file}
            done
            mv bbsplit_build bbsplit_index
        fi
        rm $$fa
        while IFS=, read -r name file; do rm $$file; done < ${reference}/$$ref_bbsplit_fasta_list
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: star_idx
    name: STAR_GENOMEGENERATE
    inputs: [*a_genome]
    outputs: [*a_star_idx]
    resources: *high
    executor: *star
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${star_idx} && mkdir -p ${star_idx} && cd ${star_idx}
        fa=$$(cd ${genome}/out && ls *.fasta)
        g=$$(cd ${genome}/out && ls *.gtf)
        ln -s ${genome}/out/$$fa $$fa
        ln -s ${genome}/out/$$g $$g
        samtools faidx $$fa
        NUM_BASES=`gawk '{sum = sum + $$2}END{if ((log(sum)/log(2))/2 - 1 > 14) {printf "%.0f", 14} else {printf "%.0f", (log(sum)/log(2))/2 - 1}}' $$fa.fai`

        mkdir star
        STAR \
            --runMode genomeGenerate \
            --genomeDir star/ \
            --genomeFastaFiles $$fa \
            --sjdbGTFfile $$g \
            --runThreadN ${task.resources.cpus} \
            --genomeSAindexNbases $$NUM_BASES \
            --limitGenomeGenerateRAM $$(( ${task.resources.memory_gb} * 1024 * 1024 * 1024 - 100000000 )) \

        rm $$fa $$g
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # ---------------------------------------------------- reads QC and trimming
  - kind: horus_map
    id: cat_fastq
    name: CAT_FASTQ
    description: Concatenates the runs of samples sequenced more than once.
    over: {input_id: multi_run, as: sample}
    max_concurrency: 16
    inputs: [*a_multi_run, *a_reads]
    outputs: [*a_cat_fastq]
    resources: *single
    executor: *coreutils
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${cat_fastq} && mkdir -p ${cat_fastq} && cd ${cat_fastq}
        d=${reads}/$$id
        case $$(head -n 1 $$d/reads.txt) in *.gz) compress= ;; *) compress='| gzip' ;; esac
        if [ $$single_end = true ]; then
            eval "cat $$(sed "s#^#$$d/#" $$d/reads.txt | tr '\n' ' ') $$compress > $${id}.merged.fastq.gz"
        else
            eval "cat $$(awk -v d=$$d 'NR % 2 == 1 {printf "%s/%s ", d, $$0}' $$d/reads.txt) $$compress > $${id}_1.merged.fastq.gz"
            eval "cat $$(awk -v d=$$d 'NR % 2 == 0 {printf "%s/%s ", d, $$0}' $$d/reads.txt) $$compress > $${id}_2.merged.fastq.gz"
        fi
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: lint_raw
    name: FQ_LINT
    over: {input_id: samples, as: sample}
    max_concurrency: 16
    inputs: [*a_samples, *a_reads, *a_cat_fastq]
    outputs: [*a_lint_raw]
    resources: *low
    executor: *fq
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${lint_raw} && mkdir -p ${lint_raw} && cd ${lint_raw}
        if [ $$merged = true ]; then
            if [ $$single_end = true ]; then ln -s ${cat_fastq}/*/$${id}.merged.fastq.gz .
            else ln -s ${cat_fastq}/*/$${id}_1.merged.fastq.gz ${cat_fastq}/*/$${id}_2.merged.fastq.gz .; fi
            fqs=$$(ls *.merged.fastq.gz | tr '\n' ' ')
        else
            fqs=$$(tr '\n' ' ' < ${reads}/$$id/reads.txt)
            for f in $$fqs; do ln -s ${reads}/$$id/$$f $$f; done
        fi
        fq lint \
            --disable-validator P001 \
            $${fqs% } > $${id}.fq_lint.txt
        rm $$fqs
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # FASTQC: reads are linked as <id>_raw.gz (one file) or <id>_raw_<n>.gz,
  # as the module does, so report names match. --memory is task memory (MB)
  # over threads, clamped to FastQC's 100-10000 range. Waits for FQ_LINT
  # (the pipeline joins reads with the lint result).
  - kind: horus_map
    id: fastqc_raw
    name: FASTQC
    over: {input_id: samples, as: sample}
    max_concurrency: 16
    inputs: [*a_samples, *a_reads, *a_cat_fastq, *a_lint_raw]
    outputs: [*a_fastqc_raw]
    resources: *low
    executor: *fastqc
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${fastqc_raw} && mkdir -p ${fastqc_raw} && cd ${fastqc_raw}
        if [ $$merged = true ]; then
            if [ $$single_end = true ]; then set -- ${cat_fastq}/*/$${id}.merged.fastq.gz
            else set -- ${cat_fastq}/*/$${id}_1.merged.fastq.gz ${cat_fastq}/*/$${id}_2.merged.fastq.gz; fi
        else
            set -- $$(sed "s#^#${reads}/$$id/#" ${reads}/$$id/reads.txt)
        fi
        pairs=""; names=""; i=0
        for f in "$$@"; do
            i=$$((i + 1))
            mkdir -p $$i && ln -s $$f $$i/
            if [ $$# -eq 1 ]; then new=$${id}_raw.$${f##*.}; else new=$${id}_raw_$$i.$${f##*.}; fi
            pairs="$$pairs $$i/$$(basename $$f) $$new"; names="$$names $$new"
        done
        mem=$$(( ${task.resources.memory_gb} * 1024 / ${task.resources.cpus} ))
        [ $$mem -gt 10000 ] && mem=10000
        [ $$mem -lt 100 ] && mem=100
        printf "%s %s\n" $$pairs | while read old_name new_name; do
            [ -f "$${new_name}" ] || ln -s $$old_name $$new_name
        done

        fastqc \
            --quiet \
            --threads ${task.resources.cpus} \
            --memory $$mem \
            $${names# }
        rm $$names; rm -r $$(seq 1 $$#)
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: trimgalore
    name: TRIMGALORE
    over: {input_id: samples, as: sample}
    max_concurrency: 16
    inputs: [*a_samples, *a_reads, *a_cat_fastq, *a_lint_raw]
    outputs: [*a_trimgalore]
    resources: *res_trimgalore
    executor: *trimgalore
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${trimgalore} && mkdir -p ${trimgalore} && cd ${trimgalore}
        if [ $$merged = true ]; then
            if [ $$single_end = true ]; then set -- ${cat_fastq}/*/$${id}.merged.fastq.gz
            else set -- ${cat_fastq}/*/$${id}_1.merged.fastq.gz ${cat_fastq}/*/$${id}_2.merged.fastq.gz; fi
        else
            set -- $$(sed "s#^#${reads}/$$id/#" ${reads}/$$id/reads.txt)
        fi
        # --cores: task.cpus - 4 (paired) or - 3 (single), clamped to 1..8
        cores=$$(( ${task.resources.cpus} - 4 ))
        [ $$single_end = true ] && cores=$$(( ${task.resources.cpus} - 3 ))
        [ $$cores -lt 1 ] && cores=1
        [ $$cores -gt 8 ] && cores=8
        for f in "$$@"; do ln -s $$f $$(basename $$f); done
        if [ $$single_end = true ]; then
        [ ! -f  $${id}_trimmed.fastq.gz ] && ln -s $$(basename $$1) $${id}_trimmed.fastq.gz
        trim_galore \
            --fastqc_args '-t ${task.resources.cpus}' \
            --cores $$cores \
            --gzip \
            $${id}_trimmed.fastq.gz
        rm $${id}_trimmed.fastq.gz
        else
        [ ! -f  $${id}_trimmed_1.fastq.gz ] && ln -s $$(basename $$1) $${id}_trimmed_1.fastq.gz
        [ ! -f  $${id}_trimmed_2.fastq.gz ] && ln -s $$(basename $$2) $${id}_trimmed_2.fastq.gz
        trim_galore \
            --fastqc_args '-t ${task.resources.cpus}' \
            --cores $$cores \
            --paired \
            --gzip \
            $${id}_trimmed_1.fastq.gz \
            $${id}_trimmed_2.fastq.gz
        rm $${id}_trimmed_1.fastq.gz $${id}_trimmed_2.fastq.gz
        fi
        for f in "$$@"; do rm $$(basename $$f); done
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: filter_trimmed
    name: Filter samples by trimmed reads
    description: Drops samples under min_trimmed_reads after trimming and branches the auto-strandedness samples.
    inputs: [*a_samples, *a_trimgalore, *a_min_trimmed]
    outputs: [*a_trim_pass, *a_auto_strand, *a_trim_status]
    executor: {kind: shell}
    runtime:
      kind: python_script
      script: scripts/decide.py
      python: python3 # stdlib only
      args: >-
        trimmed --samples ${samples} --trimgalore ${trimgalore} --min-trimmed-reads ${min_trimmed_reads}
        --pass ${trim_pass} --auto ${auto_strand} --status ${trim_status}
    target: *target

  - kind: horus_map
    id: lint_trimmed
    name: FQ_LINT_AFTER_TRIMMING
    over: {input_id: trim_pass, as: sample}
    max_concurrency: 16
    inputs: [*a_trim_pass, *a_trimgalore]
    outputs: [*a_lint_trimmed]
    resources: *low
    executor: *fq
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${lint_trimmed} && mkdir -p ${lint_trimmed} && cd ${lint_trimmed}
        if [ $$single_end = true ]; then fqs="$${id}_trimmed_trimmed.fq.gz"
        else fqs="$${id}_trimmed_1_val_1.fq.gz $${id}_trimmed_2_val_2.fq.gz"; fi
        for f in $$fqs; do ln -s ${trimgalore}/*/$$f .; done
        fq lint \
            --disable-validator P001 \
            $$fqs > $${id}.fq_lint.txt
        rm $$fqs
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # BBSPLIT: the module's pre-built index branch, verbatim. index_writable/
  # (links into the index) is removed afterwards: nothing reads it.
  - kind: horus_map
    id: bbsplit
    name: BBMAP_BBSPLIT
    over: {input_id: trim_pass, as: sample}
    max_concurrency: 16
    inputs: [*a_trim_pass, *a_trimgalore, *a_bbsplit_idx, *a_lint_trimmed]
    outputs: [*a_bbsplit]
    resources: *high
    executor: *bbmap
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${bbsplit} && mkdir -p ${bbsplit} && cd ${bbsplit}
        ln -s ${bbsplit_idx}/bbsplit_index input_index
        if [ $$single_end = true ]; then
            fqs="$${id}_trimmed_trimmed.fq.gz"; fastq_in="in=$$fqs"; fastq_out="basename=$${id}_%.fastq.gz"
        else
            fqs="$${id}_trimmed_1_val_1.fq.gz $${id}_trimmed_2_val_2.fq.gz"
            fastq_in="in=$${id}_trimmed_1_val_1.fq.gz in2=$${id}_trimmed_2_val_2.fq.gz"; fastq_out="basename=$${id}_%_#.fastq.gz"
        fi
        for f in $$fqs; do ln -s ${trimgalore}/*/$$f .; done
        # If using a pre-built index, create writable structure: symlink all files except
        # summary.txt (which we copy to modify). When we stage in the index files the time
        # stamps get disturbed, which bbsplit doesn't like. Fix the time stamps in summaries.
        if [ "true" == "true" ]; then
            find input_index/ref -type f | while read -r f; do
                target="index_writable/$${f#input_index/}"
                mkdir -p "$$(dirname "$$target")"
                [[ $$(basename "$$f") == "summary.txt" ]] && cp "$$f" "$$target" || ln -s "$$(realpath "$$f")" "$$target"
            done
            find index_writable/ref/genome -name summary.txt | while read -r summary_file; do
                src=$$(grep '^source' "$$summary_file" | cut -f2- -d$$'\t' | sed 's|.*/ref/|index_writable/ref/|')
                mod=$$(echo "System.out.println(java.nio.file.Files.getLastModifiedTime(java.nio.file.Paths.get(\"$$src\")).toMillis());" | jshell -J-Djdk.lang.Process.launchMechanism=vfork - 2>/dev/null | grep -oE '^[0-9]{12,14}$$')
                sed -e 's|bbsplit_index/ref|index_writable/ref|' -e "s|^last modified.*|last modified\t$$mod|" "$$summary_file" > $${summary_file}.tmp && mv $${summary_file}.tmp $${summary_file}
            done
        fi

        # Run BBSplit

        bbsplit.sh \
            -Xmx$$(( ${task.resources.memory_gb} * 1024 * 8 / 10 ))M \
            path=index_writable \
            threads=${task.resources.cpus} \
            $$fastq_in \
            $$fastq_out \
            refstats=$${id}.stats.txt \
            build=1 ambiguous2=all maxindel=150000 ow=f 2>| >(tee $${id}.log >&2)

        rm -r input_index index_writable $$fqs
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: lint_bbsplit
    name: FQ_LINT_AFTER_BBSPLIT
    over: {input_id: trim_pass, as: sample}
    max_concurrency: 16
    inputs: [*a_trim_pass, *a_bbsplit]
    outputs: [*a_lint_bbsplit]
    resources: *low
    executor: *fq
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${lint_bbsplit} && mkdir -p ${lint_bbsplit} && cd ${lint_bbsplit}
        if [ $$single_end = true ]; then fqs="$${id}_primary.fastq.gz"
        else fqs="$${id}_primary_1.fastq.gz $${id}_primary_2.fastq.gz"; fi
        for f in $$fqs; do ln -s ${bbsplit}/*/$$f .; done
        fq lint \
            --disable-validator P001 \
            $$fqs > $${id}.fq_lint.txt
        rm $$fqs
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: fastqc_filtered
    name: FASTQC_FILTERED
    over: {input_id: trim_pass, as: sample}
    max_concurrency: 16
    inputs: [*a_trim_pass, *a_bbsplit, *a_lint_bbsplit]
    outputs: [*a_fastqc_filtered]
    resources: *low
    executor: *fastqc
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${fastqc_filtered} && mkdir -p ${fastqc_filtered} && cd ${fastqc_filtered}
        if [ $$single_end = true ]; then
            mkdir 1 && ln -s ${bbsplit}/*/$${id}_primary.fastq.gz 1/
            pairs="1/$${id}_primary.fastq.gz $${id}_filtered.gz"; names="$${id}_filtered.gz"
        else
            mkdir 1 2 && ln -s ${bbsplit}/*/$${id}_primary_1.fastq.gz 1/ && ln -s ${bbsplit}/*/$${id}_primary_2.fastq.gz 2/
            pairs="1/$${id}_primary_1.fastq.gz $${id}_filtered_1.gz 2/$${id}_primary_2.fastq.gz $${id}_filtered_2.gz"
            names="$${id}_filtered_1.gz $${id}_filtered_2.gz"
        fi
        mem=$$(( ${task.resources.memory_gb} * 1024 / ${task.resources.cpus} ))
        [ $$mem -gt 10000 ] && mem=10000
        [ $$mem -lt 100 ] && mem=100
        printf "%s %s\n" $$pairs | while read old_name new_name; do
            [ -f "$${new_name}" ] || ln -s $$old_name $$new_name
        done

        fastqc \
            --quiet \
            --threads ${task.resources.cpus} \
            --memory $$mem \
            $$names
        rm -r $$names 1; rm -rf 2
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # ------------------------------------------------------- strandedness auto
  - kind: horus_map
    id: subsample
    name: FQ_SUBSAMPLE
    over: {input_id: auto_strand, as: sample}
    max_concurrency: 16
    inputs: [*a_auto_strand, *a_bbsplit, *a_lint_bbsplit]
    outputs: [*a_subsample]
    resources: *single
    executor: *fq
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${subsample} && mkdir -p ${subsample} && cd ${subsample}
        prefix=$${id}.subsampled
        if [ $$single_end = true ]; then
            fqs="$${id}_primary.fastq.gz"; out1="--r1-dst $$prefix.fastq.gz"; out2=""
        else
            fqs="$${id}_primary_1.fastq.gz $${id}_primary_2.fastq.gz"
            out1="--r1-dst $${prefix}_R1.fastq.gz"; out2="--r2-dst $${prefix}_R2.fastq.gz"
        fi
        for f in $$fqs; do ln -s ${bbsplit}/*/$$f .; done
        fq subsample \
            --record-count 1000000 --seed 1 \
            $$fqs \
            $$out1 \
            $$out2
        rm $$fqs
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: salmon_strand
    name: FASTQ_SUBSAMPLE_FQ_SALMON SALMON_QUANT
    over: {input_id: auto_strand, as: sample}
    max_concurrency: 16
    inputs: [*a_auto_strand, *a_subsample, *a_salmon_idx, *a_genome]
    outputs: [*a_salmon_strand]
    resources: *high
    executor: *salmon
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${salmon_strand} && mkdir -p ${salmon_strand} && cd ${salmon_strand}
        g=$$(cd ${genome}/out && ls *.gtf); ln -s ${genome}/out/$$g $$g
        idx=$$(cd ${salmon_idx} && ls); ln -s ${salmon_idx}/$$idx $$idx
        if [ $$single_end = true ]; then fqs="$${id}.subsampled.fastq.gz"; input_reads="-r $$fqs"
        else fqs="$${id}.subsampled_R1.fastq.gz $${id}.subsampled_R2.fastq.gz"; input_reads="-1 $${id}.subsampled_R1.fastq.gz -2 $${id}.subsampled_R2.fastq.gz"; fi
        for f in $$fqs; do ln -s ${subsample}/*/$$f .; done
        salmon quant \
            --geneMap $$g \
            --threads ${task.resources.cpus} \
            --index $$idx \
            $$input_reads \
            --skipQuant \
            -o $$id

        if [ -f $$id/aux_info/meta_info.json ]; then
            cp $$id/aux_info/meta_info.json "$${id}_meta_info.json"
        fi
        if [ -f $$id/lib_format_counts.json ]; then
            cp $$id/lib_format_counts.json "$${id}_lib_format_counts.json"
        fi
        rm $$g $$idx $$fqs
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: set_strandedness
    name: Set strandedness
    description: Turns Salmon's lib_format_counts.json into forward / reverse / unstranded for the auto samples. Waits for FQ_LINT_AFTER_BBSPLIT, as the pipeline joins reads with its result.
    inputs: [*a_trim_pass, *a_salmon_strand, *a_lint_bbsplit, *a_stranded_t, *a_unstranded_t]
    outputs: [*a_strand_pass]
    executor: {kind: shell}
    runtime:
      kind: python_script
      script: scripts/decide.py
      python: python3 # stdlib only
      args: >-
        strandedness --samples ${trim_pass} --salmon ${salmon_strand} --stranded-threshold ${stranded_threshold}
        --unstranded-threshold ${unstranded_threshold} --out ${strand_pass}
    target: *target

  # ------------------------------------------------------- STAR and Salmon
  - kind: horus_map
    id: star_align
    name: STAR_ALIGN
    over: {input_id: strand_pass, as: sample}
    max_concurrency: 16
    inputs: [*a_strand_pass, *a_bbsplit, *a_star_idx, *a_genome]
    outputs: [*a_star_align]
    resources: *high
    executor: *star
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${star_align} && mkdir -p ${star_align} && cd ${star_align}
        g=$$(cd ${genome}/out && ls *.gtf); ln -s ${genome}/out/$$g $$g
        ln -s ${star_idx}/star star
        if [ $$single_end = true ]; then
            mkdir input1 && ln -s ${bbsplit}/*/$${id}_primary.fastq.gz input1/
            reads="input1/$${id}_primary.fastq.gz "
        else
            mkdir input1 input2 && ln -s ${bbsplit}/*/$${id}_primary_1.fastq.gz input1/ && ln -s ${bbsplit}/*/$${id}_primary_2.fastq.gz input2/
            reads="input1/$${id}_primary_1.fastq.gz input2/$${id}_primary_2.fastq.gz"
        fi
        STAR \
            --genomeDir star \
            --readFilesIn $$reads \
            --runThreadN ${task.resources.cpus} \
            --outFileNamePrefix $$id. \
             \
            --sjdbGTFfile $$g \
             \
            --quantMode TranscriptomeSAM --outSAMtype BAM Unsorted --outSAMattributes NH HI AS NM MD --readFilesCommand zcat --twopassMode Basic --runRNGseed 0 --outFilterMultimapNmax 20 --alignSJDBoverhangMin 1 --outSAMstrandField intronMotif --quantTranscriptomeSAMoutput BanSingleEnd --outSAMattrRGline "ID:$$id" "SM:$$id"



        if [ -f $$id.Unmapped.out.mate1 ]; then
            mv $$id.Unmapped.out.mate1 $$id.unmapped_1.fastq
            gzip $$id.unmapped_1.fastq
        fi
        if [ -f $$id.Unmapped.out.mate2 ]; then
            mv $$id.Unmapped.out.mate2 $$id.unmapped_2.fastq
            gzip $$id.unmapped_2.fastq
        fi
        rm -r $$g star input1; rm -rf input2
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: salmon_quant
    name: QUANTIFY_PSEUDO_ALIGNMENT SALMON_QUANT
    over: {input_id: strand_pass, as: sample}
    max_concurrency: 16
    inputs: [*a_strand_pass, *a_bbsplit, *a_salmon_idx, *a_genome]
    outputs: [*a_salmon_quant]
    resources: *high
    executor: *salmon
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${salmon_quant} && mkdir -p ${salmon_quant} && cd ${salmon_quant}
        g=$$(cd ${genome}/out && ls *.gtf); ln -s ${genome}/out/$$g $$g
        idx=$$(cd ${salmon_idx} && ls); ln -s ${salmon_idx}/$$idx $$idx
        case $$strandedness in forward) s=SF ;; reverse) s=SR ;; *) s=U ;; esac
        if [ $$single_end = true ]; then
            libtype=$$s; fqs="$${id}_primary.fastq.gz"; input_reads="-r $$fqs"
        else
            libtype=I$$s; [ $$s = U ] && libtype=IU
            fqs="$${id}_primary_1.fastq.gz $${id}_primary_2.fastq.gz"; input_reads="-1 $${id}_primary_1.fastq.gz -2 $${id}_primary_2.fastq.gz"
        fi
        for f in $$fqs; do ln -s ${bbsplit}/*/$$f .; done
        salmon quant \
            --geneMap $$g \
            --threads ${task.resources.cpus} \
            --index $$idx \
            $$input_reads \
            --libType=$$libtype \
            -o $$id

        if [ -f $$id/aux_info/meta_info.json ]; then
            cp $$id/aux_info/meta_info.json "$${id}_meta_info.json"
        fi
        if [ -f $$id/lib_format_counts.json ]; then
            cp $$id/lib_format_counts.json "$${id}_lib_format_counts.json"
        fi
        rm $$g $$idx $$fqs
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: salmon_bam
    name: QUANTIFY_BAM_SALMON SALMON_QUANT
    over: {input_id: strand_pass, as: sample}
    max_concurrency: 16
    inputs: [*a_strand_pass, *a_star_align, *a_reference, *a_genome]
    outputs: [*a_salmon_bam]
    resources: *high
    executor: *salmon
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        . ${reference}/refs.env
        rm -rf ${salmon_bam} && mkdir -p ${salmon_bam} && cd ${salmon_bam}
        g=$$(cd ${genome}/out && ls *.gtf); ln -s ${genome}/out/$$g $$g
        tx=$$ref_transcript_fasta; ln -s ${reference}/$$tx $$tx
        ln -s ${star_align}/*/$$id.Aligned.toTranscriptome.out.bam .
        case $$strandedness in forward) s=SF ;; reverse) s=SR ;; *) s=U ;; esac
        if [ $$single_end = true ]; then libtype=$$s; else libtype=I$$s; [ $$s = U ] && libtype=IU; fi
        salmon quant \
            --geneMap $$g \
            --threads ${task.resources.cpus} \
            -t $$tx \
            -a $$id.Aligned.toTranscriptome.out.bam \
            --libType=$$libtype \
            -o $$id

        if [ -f $$id/aux_info/meta_info.json ]; then
            cp $$id/aux_info/meta_info.json "$${id}_meta_info.json"
        fi
        if [ -f $$id/lib_format_counts.json ]; then
            cp $$id/lib_format_counts.json "$${id}_lib_format_counts.json"
        fi
        rm $$g $$tx $$id.Aligned.toTranscriptome.out.bam
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: sort
    name: SAMTOOLS_SORT
    over: {input_id: strand_pass, as: sample}
    max_concurrency: 16
    inputs: [*a_strand_pass, *a_star_align, *a_genome, *a_faidx]
    outputs: [*a_sort]
    resources: *high
    executor: *samtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${sort} && mkdir -p ${sort} && cd ${sort}
        fa=$$(cd ${genome}/out && ls *.fasta); ln -s ${genome}/out/$$fa $$fa; ln -s ${faidx}/$$fa.fai $$fa.fai
        mkdir 1 && ln -s ${star_align}/*/$$id.Aligned.out.bam 1/
        samtools cat 1/$$id.Aligned.out.bam | samtools sort \
             \
            -T $$id.sorted \
            --threads ${task.resources.cpus} \
            --reference $$fa \
            -o $$id.sorted.bam \
             \
            -
        rm -r $$fa $$fa.fai 1
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: sort_index
    name: BAM_SORT_STATS_SAMTOOLS SAMTOOLS_INDEX
    over: {input_id: strand_pass, as: sample}
    max_concurrency: 16
    inputs: [*a_strand_pass, *a_sort]
    outputs: [*a_sort_index]
    resources: *low
    executor: *samtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${sort_index} && mkdir -p ${sort_index} && cd ${sort_index}
        ln -s ${sort}/*/$$id.sorted.bam .
        samtools \
            index \
            -@ ${task.resources.cpus} \
             \
            $$id.sorted.bam
        rm $$id.sorted.bam
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: sort_flagstat
    name: BAM_SORT_STATS_SAMTOOLS SAMTOOLS_FLAGSTAT
    over: {input_id: strand_pass, as: sample}
    max_concurrency: 16
    inputs: [*a_strand_pass, *a_sort, *a_sort_index]
    outputs: [*a_sort_flagstat]
    resources: *single
    executor: *samtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${sort_flagstat} && mkdir -p ${sort_flagstat} && cd ${sort_flagstat}
        ln -s ${sort}/*/$$id.sorted.bam . && ln -s ${sort_index}/*/$$id.sorted.bam.bai .
        samtools \
            flagstat \
            --threads ${task.resources.cpus} \
            $$id.sorted.bam \
            > $$id.sorted.bam.flagstat
        rm $$id.sorted.bam $$id.sorted.bam.bai
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: sort_idxstats
    name: BAM_SORT_STATS_SAMTOOLS SAMTOOLS_IDXSTATS
    over: {input_id: strand_pass, as: sample}
    max_concurrency: 16
    inputs: [*a_strand_pass, *a_sort, *a_sort_index]
    outputs: [*a_sort_idxstats]
    resources: *single
    executor: *samtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${sort_idxstats} && mkdir -p ${sort_idxstats} && cd ${sort_idxstats}
        ln -s ${sort}/*/$$id.sorted.bam . && ln -s ${sort_index}/*/$$id.sorted.bam.bai .
        # Note: --threads value represents *additional* CPUs to allocate (total CPUs = 1 + --threads).
        samtools \
            idxstats \
            --threads $$(( ${task.resources.cpus} - 1 )) \
            $$id.sorted.bam \
            > $$id.sorted.bam.idxstats
        rm $$id.sorted.bam $$id.sorted.bam.bai
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: sort_stats
    name: BAM_SORT_STATS_SAMTOOLS SAMTOOLS_STATS
    over: {input_id: strand_pass, as: sample}
    max_concurrency: 16
    inputs: [*a_strand_pass, *a_sort, *a_sort_index, *a_genome, *a_faidx]
    outputs: [*a_sort_stats]
    resources: *single
    executor: *samtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${sort_stats} && mkdir -p ${sort_stats} && cd ${sort_stats}
        fa=$$(cd ${genome}/out && ls *.fasta); ln -s ${genome}/out/$$fa $$fa; ln -s ${faidx}/$$fa.fai $$fa.fai
        ln -s ${sort}/*/$$id.sorted.bam . && ln -s ${sort_index}/*/$$id.sorted.bam.bai .
        samtools \
            stats \
             \
            --threads ${task.resources.cpus} \
            --reference $$fa \
            $$id.sorted.bam \
            > $$id.sorted.bam.stats
        rm $$fa $$fa.fai $$id.sorted.bam $$id.sorted.bam.bai
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: filter_mapped
    name: Filter samples by mapping rate
    description: Drops BAMs under min_mapped_reads uniquely mapped (STAR Log.final.out) and lists the stranded samples for the per-strand bigWigs.
    inputs: [*a_strand_pass, *a_star_align, *a_sort_index, *a_min_mapped, *a_nfcore]
    outputs: [*a_map_pass, *a_stranded_pass, *a_map_status]
    executor: {kind: shell}
    runtime:
      kind: python_script
      script: scripts/decide.py
      python: python3 # stdlib only
      args: >-
        mapped --samples ${strand_pass} --star ${star_align} --min-mapped-reads ${min_mapped_reads}
        --status-header ${nfcore}/assets/sample_status_header.txt
        --pass ${map_pass} --stranded ${stranded_pass} --status ${map_status}
    target: *target

  # ------------------------------------------------------- markdup and QC
  - kind: horus_map
    id: markdup
    name: PICARD_MARKDUPLICATES
    over: {input_id: map_pass, as: sample}
    max_concurrency: 16
    inputs: [*a_map_pass, *a_sort, *a_genome, *a_faidx]
    outputs: [*a_markdup]
    resources: *high
    executor: *picard
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${markdup} && mkdir -p ${markdup} && cd ${markdup}
        fa=$$(cd ${genome}/out && ls *.fasta); ln -s ${genome}/out/$$fa $$fa; ln -s ${faidx}/$$fa.fai $$fa.fai
        ln -s ${sort}/*/$$id.sorted.bam .
        picard \
            -Xmx$$(( ${task.resources.memory_gb} * 1024 * 8 / 10 ))M \
            MarkDuplicates \
            --ASSUME_SORTED true --REMOVE_DUPLICATES false --VALIDATION_STRINGENCY LENIENT --TMP_DIR tmp \
            --INPUT $$id.sorted.bam \
            --OUTPUT $$id.markdup.sorted.bam \
            --REFERENCE_SEQUENCE $$fa \
            --METRICS_FILE $$id.markdup.sorted.metrics.txt
        rm $$fa $$fa.fai $$id.sorted.bam
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: md_index
    name: BAM_MARKDUPLICATES_PICARD SAMTOOLS_INDEX
    over: {input_id: map_pass, as: sample}
    max_concurrency: 16
    inputs: [*a_map_pass, *a_markdup]
    outputs: [*a_md_index]
    resources: *low
    executor: *samtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${md_index} && mkdir -p ${md_index} && cd ${md_index}
        ln -s ${markdup}/*/$$id.markdup.sorted.bam .
        samtools \
            index \
            -@ ${task.resources.cpus} \
             \
            $$id.markdup.sorted.bam
        rm $$id.markdup.sorted.bam
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: md_flagstat
    name: BAM_MARKDUPLICATES_PICARD SAMTOOLS_FLAGSTAT
    over: {input_id: map_pass, as: sample}
    max_concurrency: 16
    inputs: [*a_map_pass, *a_markdup, *a_md_index]
    outputs: [*a_md_flagstat]
    resources: *single
    executor: *samtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${md_flagstat} && mkdir -p ${md_flagstat} && cd ${md_flagstat}
        ln -s ${markdup}/*/$$id.markdup.sorted.bam . && ln -s ${md_index}/*/$$id.markdup.sorted.bam.bai .
        samtools \
            flagstat \
            --threads ${task.resources.cpus} \
            $$id.markdup.sorted.bam \
            > $$id.markdup.sorted.bam.flagstat
        rm $$id.markdup.sorted.bam $$id.markdup.sorted.bam.bai
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: md_idxstats
    name: BAM_MARKDUPLICATES_PICARD SAMTOOLS_IDXSTATS
    over: {input_id: map_pass, as: sample}
    max_concurrency: 16
    inputs: [*a_map_pass, *a_markdup, *a_md_index]
    outputs: [*a_md_idxstats]
    resources: *single
    executor: *samtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${md_idxstats} && mkdir -p ${md_idxstats} && cd ${md_idxstats}
        ln -s ${markdup}/*/$$id.markdup.sorted.bam . && ln -s ${md_index}/*/$$id.markdup.sorted.bam.bai .
        # Note: --threads value represents *additional* CPUs to allocate (total CPUs = 1 + --threads).
        samtools \
            idxstats \
            --threads $$(( ${task.resources.cpus} - 1 )) \
            $$id.markdup.sorted.bam \
            > $$id.markdup.sorted.bam.idxstats
        rm $$id.markdup.sorted.bam $$id.markdup.sorted.bam.bai
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: md_stats
    name: BAM_MARKDUPLICATES_PICARD SAMTOOLS_STATS
    over: {input_id: map_pass, as: sample}
    max_concurrency: 16
    inputs: [*a_map_pass, *a_markdup, *a_md_index, *a_genome, *a_faidx]
    outputs: [*a_md_stats]
    resources: *single
    executor: *samtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${md_stats} && mkdir -p ${md_stats} && cd ${md_stats}
        fa=$$(cd ${genome}/out && ls *.fasta); ln -s ${genome}/out/$$fa $$fa; ln -s ${faidx}/$$fa.fai $$fa.fai
        ln -s ${markdup}/*/$$id.markdup.sorted.bam . && ln -s ${md_index}/*/$$id.markdup.sorted.bam.bai .
        samtools \
            stats \
             \
            --threads ${task.resources.cpus} \
            --reference $$fa \
            $$id.markdup.sorted.bam \
            > $$id.markdup.sorted.bam.stats
        rm $$fa $$fa.fai $$id.markdup.sorted.bam $$id.markdup.sorted.bam.bai
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: stringtie
    name: STRINGTIE_STRINGTIE
    over: {input_id: map_pass, as: sample}
    max_concurrency: 16
    inputs: [*a_map_pass, *a_markdup, *a_genome]
    outputs: [*a_stringtie]
    resources: *high
    executor: *stringtie
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${stringtie} && mkdir -p ${stringtie} && cd ${stringtie}
        g=$$(cd ${genome}/out && ls *.gtf); ln -s ${genome}/out/$$g $$g
        ln -s ${markdup}/*/$$id.markdup.sorted.bam .
        case $$strandedness in forward) args="--fr -v" ;; reverse) args="--rf -v" ;; *) args="-v" ;; esac
        stringtie \
            -o $$id.transcripts.gtf \
            -e \
             \
            -G $$g \
            -A $$id.gene.abundance.txt \
            -C $$id.coverage.gtf \
            -b $$id.ballgown \
            -p ${task.resources.cpus} \
            $$id.markdup.sorted.bam \
            $$args
        rm $$g $$id.markdup.sorted.bam
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # BEDTOOLS_GENOMECOV_FW / _REV run on stranded samples only; for a reverse
  # library FW writes <id>.reverse.bedGraph and REV <id>.forward.bedGraph
  # (conf/modules/bigwig.config).
  - kind: horus_map
    id: cov_fw
    name: BEDTOOLS_GENOMECOV_FW
    over: {input_id: stranded_pass, as: sample}
    max_concurrency: 16
    inputs: [*a_stranded_pass, *a_markdup]
    outputs: [*a_cov_fw]
    resources: *single
    executor: *bedtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${cov_fw} && mkdir -p ${cov_fw} && cd ${cov_fw}
        ln -s ${markdup}/*/$$id.markdup.sorted.bam .
        if [ $$strandedness = reverse ]; then prefix=$$id.reverse; args="-split -du -strand - -bg"
        else prefix=$$id.forward; args="-split -du -strand + -bg"; fi
        bedtools \
            genomecov \
            -ibam $$id.markdup.sorted.bam \
            $$args \
            | LC_ALL=C sort --parallel=${task.resources.cpus} --buffer-size=$$(( ${task.resources.memory_gb} / 2 ))G -k1,1 -k2,2n \
            > $$prefix.bedGraph
        rm $$id.markdup.sorted.bam
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: cov_rev
    name: BEDTOOLS_GENOMECOV_REV
