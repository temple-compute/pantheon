- kind: horus_task
  id: mqc_inputs
  name: Build MultiQC inputs
  description: name_replacement.txt, multiqc_sample_merge.yml, the strandedness check sections and fail_* tables, which the pipeline builds in Groovy. The fail tables are rebuilt from the TrimGalore and STAR reports, since a dropped sample leaves no slot.
  inputs:
  - *a_decide_py
  - *a_samplesheet
  - *a_samples
  - *a_reads
  - *a_set_strandedness
  - *a_filter_mapped
  - *a_rseqc_infer
  - *a_trimgalore
  - *a_star_align
  - *a_min_trimmed_reads
  - *a_min_mapped_reads
  - *a_nfcore
  - *a_stranded_threshold
  - *a_unstranded_threshold
  outputs:
  - *a_mqc_inputs
  resources: *res_single
  executor: *img_multiqc
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      rm -rf ${mqc_inputs}
      python ${decide_py} multiqc --samplesheet ${samplesheet} --samples ${samples} --reads ${reads} \
          --strand ${set_strandedness} --map-pass ${filter_mapped} --infer-experiment ${rseqc_infer} \
          --trimgalore ${trimgalore} --star ${star_align} \
          --min-trimmed-reads ${min_trimmed_reads} --min-mapped-reads ${min_mapped_reads} --assets ${nfcore}/assets \
          --stranded-threshold ${stranded_threshold} --unstranded-threshold ${unstranded_threshold} --out ${mqc_inputs}
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target: *t_local
- kind: horus_task
  id: multiqc
  name: MULTIQC
  inputs:
  - *a_mqc_inputs
  - *a_nfcore
  - *a_fastqc_raw
  - *a_trimgalore
  - *a_star_align
  - *a_salmon_quant
  - *a_md_stats
  - *a_md_flagstat
  - *a_md_idxstats
  - *a_markdup
  - *a_biotype
  - *a_qualimap
  - *a_dupradar
  - *a_rseqc_bamstat
  - *a_rseqc_infer
  - *a_rseqc_innerdist
  - *a_rseqc_junc_annot
  - *a_rseqc_junc_sat
  - *a_rseqc_readdist
  - *a_rseqc_readdup
  - *a_ss_deseq2
  - *a_ps_deseq2
  - *a_stringtie
  - *a_bigwig_fw
  - *a_bigwig_rev
  - *a_bigwig_both
  - *a_sort_flagstat
  - *a_sort_idxstats
  - *a_sort_stats
  - *a_ss_se_gene
  - *a_ss_se_tx
  - *a_ps_se_gene
  - *a_ps_se_tx
  outputs:
  - *a_multiqc
  resources: *res_single
  executor: *img_multiqc
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      rm -rf ${multiqc} && mkdir -p ${multiqc} && cd ${multiqc}
      n=0
      stage() { for f in "$$@"; do [ -e "$$f" ] || continue; n=$$((n + 1)); mkdir $$n; ln -s "$${f%/}" $$n/; echo "$$(basename "$${f%/}")" >> multiqc_inputs.txt; done; }
      stage ${nfcore}/assets/multiqc_config.yml ${mqc_inputs}/multiqc_sample_merge.yml
      stage ${fastqc_raw}/*/*_fastqc.zip
      stage ${trimgalore}/*/*_trimming_report.txt ${trimgalore}/*/*_trimming_report.json ${trimgalore}/*/*_fastqc.zip
      stage ${star_align}/*/*.Log.final.out
      stage ${salmon_quant}/*/*/
      stage ${md_stats}/*/*.stats ${md_flagstat}/*/*.flagstat ${md_idxstats}/*/*.idxstats ${markdup}/*/*.metrics.txt
      stage ${biotype}/*/*.biotype_counts_mqc.tsv
      stage ${qualimap}/*/*/
      stage ${dupradar}/*/*_dup_intercept_mqc.txt ${dupradar}/*/*_duprateExpDensCurve_mqc.txt
      stage ${rseqc_bamstat}/*/*.bam_stat.txt ${rseqc_infer}/*/*.infer_experiment.txt ${rseqc_innerdist}/*/*.inner_distance_freq.txt
      stage ${rseqc_junc_annot}/*/*.junction_annotation.log ${rseqc_junc_sat}/*/*.junctionSaturation_plot.r
      stage ${rseqc_readdist}/*/*.read_distribution.txt ${rseqc_readdup}/*/*.pos.DupRate.xls
      stage ${ss_deseq2}/*_mqc.tsv ${ps_deseq2}/*_mqc.tsv
      stage ${mqc_inputs}/*_mqc.json ${mqc_inputs}/fail_*_mqc.tsv
      ln -s ${mqc_inputs}/name_replacement.txt name_replacement.txt
      multiqc \
          --force \
           \
          --config 1/multiqc_config.yml --config 2/multiqc_sample_merge.yml \
          --filename multiqc_report.html \
           \
          --replace-names name_replacement.txt \
           \
          .
      rm -r name_replacement.txt $$(seq 1 $$n)
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target: *t_compute
