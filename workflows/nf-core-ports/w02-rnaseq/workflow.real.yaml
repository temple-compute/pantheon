- kind: horus_map
  id: star_align
  name: STAR_ALIGN
  over: {input_id: lint_trimmed, as: sample}
  chain: true
  zip:
  - {input_id: trimgalore, as: trim}
  max_concurrency: 200
  inputs:
  - *a_lint_trimmed
  - *a_trimgalore
  - *a_star_idx
  - *a_genome
  outputs:
  - *a_star_align
  resources: *res_high
  executor: *img_star
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      . ${sample}/meta.env
      rm -rf ${star_align} && mkdir -p ${star_align} && cd ${star_align} && cp ${sample}/meta.env .
      g=$$(cd ${genome}/out && ls *.gtf); ln -s ${genome}/out/$$g $$g
      ln -s ${star_idx}/star star
      if [ $$single_end = true ]; then
          mkdir input1 && ln -s ${trim}/$${id}_trimmed_trimmed.fq.gz input1/
          reads="input1/$${id}_trimmed_trimmed.fq.gz "
      else
          mkdir input1 input2 && ln -s ${trim}/$${id}_trimmed_1_val_1.fq.gz input1/ && ln -s ${trim}/$${id}_trimmed_2_val_2.fq.gz input2/
          reads="input1/$${id}_trimmed_1_val_1.fq.gz input2/$${id}_trimmed_2_val_2.fq.gz"
      fi
      STAR \
          --genomeDir star \
          --readFilesIn $$reads \
          --runThreadN ${task.resources.cpus} \
          --outFileNamePrefix $$id. \
           \
          --sjdbGTFfile $$g \
           \
          --quantMode TranscriptomeSAM --outSAMtype BAM Unsorted --outSAMattributes NH HI AS NM MD --readFilesCommand zcat --twopassMode Basic --runRNGseed 0 --outFilterMultimapNmax 20 --alignSJDBoverhangMin 1 --outSAMstrandField intronMotif --quantTranscriptomeSAMoutput BanSingleEnd --outSAMattrRGline "ID:$$id" "SM:$$id"



      if [ -f $$id.Unmapped.out.mate1 ]; then
          mv $$id.Unmapped.out.mate1 $$id.unmapped_1.fastq
          gzip $$id.unmapped_1.fastq
      fi
      if [ -f $$id.Unmapped.out.mate2 ]; then
          mv $$id.Unmapped.out.mate2 $$id.unmapped_2.fastq
          gzip $$id.unmapped_2.fastq
      fi
      rm -r $$g star input1; rm -rf input2
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target: *t_highmem
- kind: horus_map
  id: salmon_quant
  name: QUANTIFY_PSEUDO_ALIGNMENT SALMON_QUANT
  over: {input_id: lint_trimmed, as: sample}
  chain: true
  zip:
  - {input_id: set_strandedness, as: strand}
  - {input_id: trimgalore, as: trim}
  max_concurrency: 200
  inputs:
  - *a_lint_trimmed
  - *a_trimgalore
  - *a_set_strandedness
  - *a_salmon_idx
  - *a_genome
  outputs:
  - *a_salmon_quant
  resources: *res_medium
  executor: *img_salmon
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      . ${strand}/meta.env
      rm -rf ${salmon_quant} && mkdir -p ${salmon_quant} && cd ${salmon_quant} && cp ${strand}/meta.env .
      g=$$(cd ${genome}/out && ls *.gtf); ln -s ${genome}/out/$$g $$g
      idx=$$(cd ${salmon_idx} && ls); ln -s ${salmon_idx}/$$idx $$idx
      case $$strandedness in forward) s=SF ;; reverse) s=SR ;; *) s=U ;; esac
      if [ $$single_end = true ]; then
          libtype=$$s; fqs="$${id}_trimmed_trimmed.fq.gz"; input_reads="-r $$fqs"
      else
          libtype=I$$s; [ $$s = U ] && libtype=IU
          fqs="$${id}_trimmed_1_val_1.fq.gz $${id}_trimmed_2_val_2.fq.gz"; input_reads="-1 $${id}_trimmed_1_val_1.fq.gz -2 $${id}_trimmed_2_val_2.fq.gz"
      fi
      for f in $$fqs; do ln -s ${trim}/$$f .; done
      salmon quant \
          --geneMap $$g \
          --threads ${task.resources.cpus} \
          --index $$idx \
          $$input_reads \
          --libType=$$libtype \
          -o $$id

      if [ -f $$id/aux_info/meta_info.json ]; then
          cp $$id/aux_info/meta_info.json "$${id}_meta_info.json"
      fi
      if [ -f $$id/lib_format_counts.json ]; then
          cp $$id/lib_format_counts.json "$${id}_lib_format_counts.json"
      fi
      rm $$g $$idx $$fqs
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target: *t_compute
