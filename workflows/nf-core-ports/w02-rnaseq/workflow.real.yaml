- &a_ss_se_tx {id: ss_se_tx, name: Transcript SummarizedExperiment (STAR Salmon), kind: folder, path: results/star_salmon/se_transcript/}
- &a_ss_deseq2 {id: ss_deseq2, name: DESeq2 QC (STAR Salmon), kind: folder, path: results/star_salmon/deseq2_qc/}
- &a_ps_tx2gene {id: ps_tx2gene, name: tx2gene (Salmon), kind: folder, path: results/salmon/tx2gene/}
- &a_ps_tximport {id: ps_tximport, name: tximport (Salmon), kind: folder, path: results/salmon/tximport/}
- &a_ps_se_gene {id: ps_se_gene, name: Gene SummarizedExperiment (Salmon), kind: folder, path: results/salmon/se_gene/}
- &a_ps_se_tx {id: ps_se_tx, name: Transcript SummarizedExperiment (Salmon), kind: folder, path: results/salmon/se_transcript/}
- &a_ps_deseq2 {id: ps_deseq2, name: DESeq2 QC (Salmon), kind: folder, path: results/salmon/deseq2_qc/}
- &a_mqc_inputs {id: mqc_inputs, name: Generated MultiQC inputs, kind: folder, path: work/multiqc_inputs/}
- &a_multiqc {id: multiqc, name: MultiQC report, kind: folder, path: results/multiqc/star_salmon/}
- &a_fasta_path {id: fasta_path, name: Genome fasta, kind: string, path: params/fasta_path.txt}
- &a_gtf_path {id: gtf_path, name: GTF, kind: string, path: params/gtf_path.txt}
- &a_transcript_fasta_path {id: transcript_fasta_path, name: Transcript fasta, kind: string, path: params/transcript_fasta_path.txt}
- &a_gene_bed_path {id: gene_bed_path, name: Gene BED, kind: string, path: params/gene_bed_path.txt}
- &a_star_index_path {id: star_index_path, name: STAR index, kind: string, path: params/star_index_path.txt}
- &a_salmon_index_path {id: salmon_index_path, name: Salmon index, kind: string, path: params/salmon_index_path.txt}
- &a_featurecounts_group_type {id: featurecounts_group_type, name: featureCounts group type, kind: string, path: params/featurecounts_group_type.txt}
artifacts:
- id: samplesheet
  name: Samplesheet
  kind: file
  path: examples/samplesheet.csv
  description: nf-core/rnaseq samplesheet (sample,fastq_1,fastq_2,strandedness). Reads may be URLs, paths relative to the samplesheet, or absolute local paths (linked, not copied); rows sharing a sample are runs of one sample.
- {id: nfcore, name: nf-core/rnaseq files, kind: folder, path: nfcore/, description: 'nf-core/rnaseq 3.27.0 assets, bin/deseq2_qc.r and module templates (MIT).'}
- {id: decide_py, name: Decision script, kind: file, path: scripts/decide.py, description: The pipeline's Groovy-side decisions as a script.}
- id: input_mirror
  name: Local input mirror
  kind: string
  path: params/input_mirror.txt
  description: Folder searched for each input file by name before downloading it (e.g. a local copy of the test data). Empty downloads everything.
  value: ''
  pattern: '[^"`$\\]*'
- id: fasta_path
  name: Genome fasta
  kind: string
  path: params/fasta_path.txt
  description: --fasta (plain, on the cluster's shared filesystem)
  value: /fsx/data/ref/genome.fa
  pattern: '[^"`$\\]*'
- {id: gtf_path, name: GTF, kind: string, path: params/gtf_path.txt, description: --gtf (plain), value: /fsx/data/ref/genes.gtf, pattern: '[^"`$\\]*'}
- id: transcript_fasta_path
  name: Transcript fasta
  kind: string
  path: params/transcript_fasta_path.txt
  description: --transcript_fasta (plain)
  value: /fsx/prep/outdir/genome/genome.transcripts.fa
  pattern: '[^"`$\\]*'
- id: gene_bed_path
  name: Gene BED
  kind: string
  path: params/gene_bed_path.txt
  description: --gene_bed (plain)
  value: /fsx/prep/outdir/genome/genes.filtered.bed
  pattern: '[^"`$\\]*'
- id: star_index_path
  name: STAR index
  kind: string
  path: params/star_index_path.txt
  description: --star_index (directory)
  value: /fsx/prep/outdir/genome/index/star
  pattern: '[^"`$\\]*'
- id: salmon_index_path
  name: Salmon index
  kind: string
  path: params/salmon_index_path.txt
  description: --salmon_index (directory)
  value: /fsx/prep/outdir/genome/index/salmon
  pattern: '[^"`$\\]*'
- id: featurecounts_group_type
  name: featureCounts group type
  kind: string
  path: params/featurecounts_group_type.txt
  description: --featurecounts_group_type (biotype attribute)
  value: gene_type
  pattern: '[A-Za-z0-9_]+'
- {id: min_trimmed_reads, name: Min trimmed reads, kind: number, path: params/min_trimmed_reads.json, value: 10000, min: 0, description: --min_trimmed_reads}
- id: min_mapped_reads
  name: Min mapped reads
  kind: number
  path: params/min_mapped_reads.json
  value: 5
  min: 0
  max: 100
  description: --min_mapped_reads (STAR uniquely mapped %)
- {id: stranded_threshold, name: Stranded threshold, kind: number, path: params/stranded_threshold.json, value: 0.8, min: 0.5, max: 1, description: --stranded_threshold}
- {id: unstranded_threshold, name: Unstranded threshold, kind: number, path: params/unstranded_threshold.json, value: 0.1, min: 0, max: 1, description: --unstranded_threshold}
tasks:
- kind: horus_task
  id: link_reference
  name: Link the given references
  description: 'Stands in for the reference prep the given files make unnecessary: links them where those steps wrote, and writes refs.env (file names, biotype_qc).'
  inputs:
  - *a_fasta_path
  - *a_gtf_path
  - *a_transcript_fasta_path
  - *a_gene_bed_path
  - *a_star_index_path
  - *a_salmon_index_path
  - *a_featurecounts_group_type
  outputs:
  - *a_reference
  - *a_gtf
  - *a_gene_bed
  - *a_star_idx
  - *a_salmon_idx
  executor: {kind: shell}
  runtime:
    kind: command
    command: |
      set -eu
      rm -rf ${reference} ${gtf} ${gene_bed} ${star_idx} ${salmon_idx}
      mkdir -p ${reference} ${gtf} ${gene_bed} ${star_idx} ${salmon_idx}
      for f in "${fasta_path}" "${gtf_path}" "${transcript_fasta_path}" "${gene_bed_path}"; do
          case $$f in *.gz) echo "$$f: gzipped references need the GUNZIP steps this variant drops" >&2; exit 1 ;; esac
          test -f "$$f"
      done
      test -d "${star_index_path}" && test -d "${salmon_index_path}"
      ln -s "${fasta_path}" "${transcript_fasta_path}" ${reference}/
      ln -s "${gtf_path}" ${gtf}/
      ln -s "${gene_bed_path}" ${gene_bed}/
      ln -s "${star_index_path}" ${star_idx}/star
      ln -s "${salmon_index_path}" ${salmon_idx}/
      # biotypeQcUsable: the biotype attribute on an exon row of the raw GTF
      biotype_qc=$$(awk -F '\t' -v b="${featurecounts_group_type}" \
          '$$3 == "exon" { n = split($$NF, w, " "); for (i = 1; i <= n; i++) if (w[i] == b) { print "true"; exit } }' "${gtf_path}")
      printf 'ref_fasta=%s\nref_gtf=%s\nref_transcript_fasta=%s\nbiotype_qc=%s\n' \
          "$$(basename "${fasta_path}")" "$$(basename "${gtf_path}")" "$$(basename "${transcript_fasta_path}")" \
          "$${biotype_qc:-false}" > ${reference}/refs.env
  target: *t_local
- kind: horus_task
  id: stage_samples
  name: Split the samplesheet into samples
  description: Fetches each sample's reads and writes one meta file per sample, merging runs as the samplesheet check does.
  inputs:
  - *a_samplesheet
  - *a_input_mirror
  outputs:
  - *a_reads
  - *a_samples
  - *a_multi_run
  executor: {kind: shell}
  runtime:
    kind: python_script
    script: scripts/stage_inputs.py
    python: python3
    args: samples --samplesheet ${samplesheet} --mirror ${input_mirror} --reads ${reads} --samples ${samples} --multi-run ${multi_run}
  target: *t_local
- kind: horus_task
  id: gtf_filtered
  name: CUSTOM_GTFFILTER
  inputs:
  - *a_reference
  - *a_gtf
  - *a_nfcore
  outputs:
  - *a_gtf_filtered
  resources: *res_single
  executor: *img_python314
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      . ${reference}/refs.env
      rm -rf ${gtf_filtered} && mkdir -p ${gtf_filtered} && cd ${gtf_filtered}
      g=$$(cd ${gtf} && ls)
      ln -s ${reference}/$$ref_fasta $$ref_fasta
      ln -s ${gtf}/$$g $$g
      NF_ARGS= NF_FASTA=$$ref_fasta NF_GTF=$$g NF_OUT=$${g%.gtf}.filtered.gtf \
      NF_PROCESS=NFCORE_RNASEQ:PREPARE_GENOME_REFERENCES:CUSTOM_GTFFILTER \
          /usr/bin/env python ${nfcore}/templates/gtffilter.py
      rm $$ref_fasta $$g
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target: *t_compute
- kind: horus_task
  id: link_genome
  name: Link genome and filtered GTF
  description: 'genome/out/ as CUSTOM_CATADDITIONALFASTA left it, without an additional fasta: the genome and the CUSTOM_GTFFILTER output.'
  inputs:
  - *a_reference
  - *a_gtf_filtered
  outputs:
  - *a_genome
  executor: {kind: shell}
  runtime:
    kind: command
    command: |
      set -eu
      rm -rf ${genome} && mkdir -p ${genome}/out
      . ${reference}/refs.env
      g=$$(cd ${gtf_filtered} && ls *.gtf)
      ln -s ${reference}/$$ref_fasta ${genome}/out/$$ref_fasta
      ln -s ${gtf_filtered}/$$g ${genome}/out/$$g
  target: *t_local
- kind: horus_task
  id: faidx
  name: SAMTOOLS_FAIDX
  inputs:
  - *a_reference
  outputs:
  - *a_faidx
  resources: *res_single
  executor: *img_samtools
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      rm -rf ${faidx} && mkdir -p ${faidx} && cd ${faidx}
      . ${reference}/refs.env; fa=$$ref_fasta
      ln -s ${reference}/$$fa $$fa
      samtools \
          faidx \
          $$fa \


      cut -f 1,2 $$fa.fai > $$fa.sizes
      rm $$fa
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target: *t_compute
- kind: horus_map
  id: cat_fastq
  name: CAT_FASTQ
  description: Writes each sample's meta.env, the head of the chain, and concatenates the runs of samples sequenced more than once.
  over: {input_id: samples, as: sample}
  max_concurrency: 200
  inputs:
  - *a_samples
  - *a_reads
  outputs:
  - *a_cat_fastq
  resources: *res_single
  executor: *img_coreutils
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      id=$$(basename ${sample}); . ${sample}
      rm -rf ${cat_fastq} && mkdir -p ${cat_fastq} && cd ${cat_fastq}
      { echo id=$$id; cat ${sample}; } > meta.env
      [ $$merged = true ] || exit 0
      d=${reads}/$$id
      case $$(head -n 1 $$d/reads.txt) in *.gz) compress= ;; *) compress='| gzip' ;; esac
      if [ $$single_end = true ]; then
          eval "cat $$(sed "s#^#$$d/#" $$d/reads.txt | tr '\n' ' ') $$compress > $${id}.merged.fastq.gz"
      else
          eval "cat $$(awk -v d=$$d 'NR % 2 == 1 {printf "%s/%s ", d, $$0}' $$d/reads.txt) $$compress > $${id}_1.merged.fastq.gz"
          eval "cat $$(awk -v d=$$d 'NR % 2 == 0 {printf "%s/%s ", d, $$0}' $$d/reads.txt) $$compress > $${id}_2.merged.fastq.gz"
      fi
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target: *t_local
- kind: horus_map
  id: lint_raw
  name: FQ_LINT
  over: {input_id: cat_fastq, as: sample}
  chain: true
  max_concurrency: 200
  inputs:
  - *a_cat_fastq
  - *a_reads
  outputs:
  - *a_lint_raw
  resources: *res_low
  executor: *img_fq
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      . ${sample}/meta.env
      rm -rf ${lint_raw} && mkdir -p ${lint_raw} && cd ${lint_raw} && cp ${sample}/meta.env .
      if [ $$merged = true ]; then
          if [ $$single_end = true ]; then ln -s ${sample}/$${id}.merged.fastq.gz .
          else ln -s ${sample}/$${id}_1.merged.fastq.gz ${sample}/$${id}_2.merged.fastq.gz .; fi
          fqs=$$(ls *.merged.fastq.gz | tr '\n' ' ')
      else
          fqs=$$(tr '\n' ' ' < ${reads}/$$id/reads.txt)
          for f in $$fqs; do ln -s ${reads}/$$id/$$f $$f; done
      fi
      fq lint \
          --disable-validator P001 \
          $${fqs% } > $${id}.fq_lint.txt
      rm $$fqs
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target: *t_compute
- kind: horus_map
  id: fastqc_raw
  name: FASTQC
  over: {input_id: cat_fastq, as: sample}
  chain: true
  zip:
  - {input_id: lint_raw, as: lint}
  max_concurrency: 200
  inputs:
  - *a_cat_fastq
  - *a_lint_raw
  - *a_reads
  outputs:
  - *a_fastqc_raw
  resources: *res_low
  executor: *img_fastqc
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      . ${sample}/meta.env
      rm -rf ${fastqc_raw} && mkdir -p ${fastqc_raw} && cd ${fastqc_raw} && cp ${sample}/meta.env .
      if [ $$merged = true ]; then
          if [ $$single_end = true ]; then set -- ${sample}/$${id}.merged.fastq.gz
          else set -- ${sample}/$${id}_1.merged.fastq.gz ${sample}/$${id}_2.merged.fastq.gz; fi
      else
          set -- $$(sed "s#^#${reads}/$$id/#" ${reads}/$$id/reads.txt)
      fi
      pairs=""; names=""; i=0
      for f in "$$@"; do
          i=$$((i + 1))
          mkdir -p $$i && ln -s $$f $$i/
          if [ $$# -eq 1 ]; then new=$${id}_raw.$${f##*.}; else new=$${id}_raw_$$i.$${f##*.}; fi
          pairs="$$pairs $$i/$$(basename $$f) $$new"; names="$$names $$new"
      done
      mem=$$(( ${task.resources.memory_gb} * 1024 / ${task.resources.cpus} ))
      [ $$mem -gt 10000 ] && mem=10000
      [ $$mem -lt 100 ] && mem=100
      printf "%s %s\n" $$pairs | while read old_name new_name; do
          [ -f "$${new_name}" ] || ln -s $$old_name $$new_name
      done

      fastqc \
          --quiet \
          --threads ${task.resources.cpus} \
          --memory $$mem \
          $${names# }
      rm $$names; rm -r $$(seq 1 $$#)
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target: *t_compute
- kind: horus_map
  id: trimgalore
  name: TRIMGALORE
  over: {input_id: cat_fastq, as: sample}
  chain: true
  zip:
  - {input_id: lint_raw, as: lint}
  max_concurrency: 200
  inputs:
  - *a_cat_fastq
  - *a_lint_raw
  - *a_reads
  outputs:
  - *a_trimgalore
  resources: *res_trimgalore
  executor: *img_trimgalore
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      . ${sample}/meta.env
      rm -rf ${trimgalore} && mkdir -p ${trimgalore} && cd ${trimgalore} && cp ${sample}/meta.env .
      if [ $$merged = true ]; then
          if [ $$single_end = true ]; then set -- ${sample}/$${id}.merged.fastq.gz
          else set -- ${sample}/$${id}_1.merged.fastq.gz ${sample}/$${id}_2.merged.fastq.gz; fi
      else
          set -- $$(sed "s#^#${reads}/$$id/#" ${reads}/$$id/reads.txt)
      fi
      # --cores: task.cpus - 4 (paired) or - 3 (single), clamped to 1..8
      cores=$$(( ${task.resources.cpus} - 4 ))
      [ $$single_end = true ] && cores=$$(( ${task.resources.cpus} - 3 ))
      [ $$cores -lt 1 ] && cores=1
      [ $$cores -gt 8 ] && cores=8
      for f in "$$@"; do ln -s $$f $$(basename $$f); done
      if [ $$single_end = true ]; then
      [ ! -f  $${id}_trimmed.fastq.gz ] && ln -s $$(basename $$1) $${id}_trimmed.fastq.gz
      trim_galore \
          --fastqc_args '-t ${task.resources.cpus}' \
          --cores $$cores \
          --gzip \
          $${id}_trimmed.fastq.gz
      rm $${id}_trimmed.fastq.gz
      else
      [ ! -f  $${id}_trimmed_1.fastq.gz ] && ln -s $$(basename $$1) $${id}_trimmed_1.fastq.gz
      [ ! -f  $${id}_trimmed_2.fastq.gz ] && ln -s $$(basename $$2) $${id}_trimmed_2.fastq.gz
      trim_galore \
          --fastqc_args '-t ${task.resources.cpus}' \
          --cores $$cores \
          --paired \
          --gzip \
          $${id}_trimmed_1.fastq.gz \
          $${id}_trimmed_2.fastq.gz
      rm $${id}_trimmed_1.fastq.gz $${id}_trimmed_2.fastq.gz
      fi
      for f in "$$@"; do rm $$(basename $$f); done
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target: *t_compute
- kind: horus_map
  id: filter_trimmed
  name: Filter samples by trimmed reads
  description: Drops a sample under min_trimmed_reads after trimming (exit 10).
  over: {input_id: trimgalore, as: sample}
  chain: true
  drop_exit_codes: [10]
  max_concurrency: 200
  inputs:
  - *a_trimgalore
  - *a_decide_py
  - *a_min_trimmed_reads
  outputs:
  - *a_filter_trimmed
  executor: {kind: shell}
  runtime: {kind: command, command: 'python3 ${decide_py} trim-item --slot ${sample} --min-trimmed-reads ${min_trimmed_reads} --out ${filter_trimmed}'}
  target: *t_local
- kind: horus_map
  id: lint_trimmed
  name: FQ_LINT_AFTER_TRIMMING
  over: {input_id: filter_trimmed, as: sample}
  chain: true
  zip:
  - {input_id: trimgalore, as: trim}
  max_concurrency: 200
  inputs:
  - *a_filter_trimmed
  - *a_trimgalore
  outputs:
  - *a_lint_trimmed
  resources: *res_low
  executor: *img_fq
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      . ${sample}/meta.env
      rm -rf ${lint_trimmed} && mkdir -p ${lint_trimmed} && cd ${lint_trimmed} && cp ${sample}/meta.env .
      if [ $$single_end = true ]; then fqs="$${id}_trimmed_trimmed.fq.gz"
      else fqs="$${id}_trimmed_1_val_1.fq.gz $${id}_trimmed_2_val_2.fq.gz"; fi
      for f in $$fqs; do ln -s ${trim}/$$f .; done
      fq lint \
          --disable-validator P001 \
          $$fqs > $${id}.fq_lint.txt
      rm $$fqs
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target: *t_compute
- kind: horus_map
  id: subsample
  name: FQ_SUBSAMPLE
  over: {input_id: lint_trimmed, as: sample}
  chain: true
  zip:
  - {input_id: trimgalore, as: trim}
  max_concurrency: 200
  inputs:
  - *a_lint_trimmed
  - *a_trimgalore
  outputs:
  - *a_subsample
  resources: *res_single
  executor: *img_fq
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      . ${sample}/meta.env
      rm -rf ${subsample} && mkdir -p ${subsample} && cd ${subsample} && cp ${sample}/meta.env .
      [ $$strandedness = auto ] || exit 0  # set in the samplesheet: pass through
      prefix=$${id}.subsampled
      if [ $$single_end = true ]; then
          fqs="$${id}_trimmed_trimmed.fq.gz"; out1="--r1-dst $$prefix.fastq.gz"; out2=""
      else
          fqs="$${id}_trimmed_1_val_1.fq.gz $${id}_trimmed_2_val_2.fq.gz"
          out1="--r1-dst $${prefix}_R1.fastq.gz"; out2="--r2-dst $${prefix}_R2.fastq.gz"
      fi
      for f in $$fqs; do ln -s ${trim}/$$f .; done
      fq subsample \
          --record-count 1000000 --seed 1 \
          $$fqs \
          $$out1 \
          $$out2
      rm $$fqs
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target: *t_local
- kind: horus_map
  id: salmon_strand
  name: FASTQ_SUBSAMPLE_FQ_SALMON SALMON_QUANT
  over: {input_id: subsample, as: sample}
  chain: true
  max_concurrency: 200
  inputs:
  - *a_subsample
  - *a_salmon_idx
  - *a_genome
  outputs:
  - *a_salmon_strand
  resources: *res_medium
  executor: *img_salmon
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      . ${sample}/meta.env
      rm -rf ${salmon_strand} && mkdir -p ${salmon_strand} && cd ${salmon_strand} && cp ${sample}/meta.env .
      [ $$strandedness = auto ] || exit 0  # set in the samplesheet: pass through
      g=$$(cd ${genome}/out && ls *.gtf); ln -s ${genome}/out/$$g $$g
      idx=$$(cd ${salmon_idx} && ls); ln -s ${salmon_idx}/$$idx $$idx
      if [ $$single_end = true ]; then fqs="$${id}.subsampled.fastq.gz"; input_reads="-r $$fqs"
      else fqs="$${id}.subsampled_R1.fastq.gz $${id}.subsampled_R2.fastq.gz"; input_reads="-1 $${id}.subsampled_R1.fastq.gz -2 $${id}.subsampled_R2.fastq.gz"; fi
      for f in $$fqs; do ln -s ${sample}/$$f .; done
      salmon quant \
          --geneMap $$g \
          --threads ${task.resources.cpus} \
          --index $$idx \
          $$input_reads \
          --skipQuant \
          -o $$id

      if [ -f $$id/aux_info/meta_info.json ]; then
          cp $$id/aux_info/meta_info.json "$${id}_meta_info.json"
      fi
      if [ -f $$id/lib_format_counts.json ]; then
          cp $$id/lib_format_counts.json "$${id}_lib_format_counts.json"
      fi
      rm $$g $$idx $$fqs
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target: *t_local
- kind: horus_map
  id: set_strandedness
  name: Set strandedness
  description: Turns Salmon's lib_format_counts.json into forward / reverse / unstranded for an auto sample. Waits for FQ_LINT_AFTER_TRIMMING, as the pipeline joins reads with its result.
  over: {input_id: salmon_strand, as: sample}
  chain: true
  zip:
  - {input_id: lint_trimmed, as: lint}
  max_concurrency: 200
  inputs:
  - *a_salmon_strand
  - *a_lint_trimmed
