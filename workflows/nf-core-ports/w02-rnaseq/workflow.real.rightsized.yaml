    name: featureCounts group type
    kind: string
    path: params/featurecounts_group_type.txt
  outputs:
  - id: featurecounts
    name: featureCounts
    kind: folder
    path: results/star_salmon/featurecounts/
  resources:
    cpus: 2
    memory_gb: 2
    walltime: 08:00:00
  executor:
    kind: apptainer
    image: /fsx/sif/depot.galaxyproject.org-singularity-subread-2.1.1--h577a1d6_0.img
    binds:
