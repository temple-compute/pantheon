  executor:
    kind: apptainer
    image: /fsx/sif/depot.galaxyproject.org-singularity-qualimap-2.3--hdfd78af_0.img
    binds:
      /fsx: /fsx
    env:
      PYTHONNOUSERSITE: '1'
      R_PROFILE_USER: /.Rprofile
      R_ENVIRON_USER: /.Renviron
      JULIA_DEPOT_PATH: /usr/local/share/julia
    extra_args:
    - --cleanenv
    - --no-home
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      . ${sample}/meta.env
      rm -rf ${qualimap} && mkdir -p ${qualimap} && cd ${qualimap} && cp ${sample}/meta.env .
      g=$$(cd ${genome}/out && ls *.gtf); ln -s ${genome}/out/$$g $$g
      ln -s ${sample}/$$id.namesorted.bam .
      case $$strandedness in forward) p=strand-specific-forward ;; reverse) p=strand-specific-reverse ;; *) p=non-strand-specific ;; esac
      if [ $$single_end = true ]; then paired_end=""; else paired_end="-pe"; fi
      unset DISPLAY
      mkdir -p tmp
      export _JAVA_OPTIONS=-Djava.io.tmpdir=./tmp
      qualimap \
          --java-mem-size=$$(( ${task.resources.memory_gb} * 1024 * 8 / 10 ))M \
          rnaseq \
          --sorted -p $$p \
          -bam $$id.namesorted.bam \
          -gtf $$g \
          $$paired_end \
          -outdir $$id
      rm -r $$g $$id.namesorted.bam tmp
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target:
    kind: slurm
    partition: compute
    working_directory: '@SLURM_DIR@'
    inner:
      kind: local
