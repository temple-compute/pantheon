kind: horus_workflow
name: nf-core rnaseq real
max_concurrency: 200
cache: fast
artifacts:
- id: samplesheet
  name: Samplesheet
  kind: file
  path: examples/samplesheet.csv
  description: nf-core/rnaseq samplesheet (sample,fastq_1,fastq_2,strandedness). Reads may be URLs, paths relative to the samplesheet, or absolute local paths (linked, not copied); rows sharing a sample are runs of one sample.
- id: nfcore
  name: nf-core/rnaseq files
  kind: folder
  path: nfcore/
  description: nf-core/rnaseq 3.27.0 assets, bin/deseq2_qc.r and module templates (MIT).
- id: decide_py
  name: Decision script
  kind: file
  path: scripts/decide.py
  description: The pipeline's Groovy-side decisions as a script.
- id: input_mirror
  name: Local input mirror
  kind: string
  path: params/input_mirror.txt
  description: Folder searched for each input file by name before downloading it (e.g. a local copy of the test data). Empty downloads everything.
  value: ''
  pattern: '[^"`$\\]*'
- id: fasta_path
  name: Genome fasta
  kind: string
  path: params/fasta_path.txt
  description: --fasta (plain, on the cluster's shared filesystem)
  value: /fsx/data/ref/genome.fa
  pattern: '[^"`$\\]*'
- id: gtf_path
  name: GTF
  kind: string
  path: params/gtf_path.txt
  description: --gtf (plain)
  value: /fsx/data/ref/genes.gtf
  pattern: '[^"`$\\]*'
- id: transcript_fasta_path
  name: Transcript fasta
  kind: string
  path: params/transcript_fasta_path.txt
  description: --transcript_fasta (plain)
  value: /fsx/prep/outdir/genome/genome.transcripts.fa
  pattern: '[^"`$\\]*'
- id: gene_bed_path
  name: Gene BED
  kind: string
  path: params/gene_bed_path.txt
  description: --gene_bed (plain)
  value: /fsx/prep/outdir/genome/genes.filtered.bed
  pattern: '[^"`$\\]*'
- id: star_index_path
  name: STAR index
  kind: string
  path: params/star_index_path.txt
  description: --star_index (directory)
  value: /fsx/prep/outdir/genome/index/star
  pattern: '[^"`$\\]*'
- id: salmon_index_path
  name: Salmon index
  kind: string
  path: params/salmon_index_path.txt
  description: --salmon_index (directory)
  value: /fsx/prep/outdir/genome/index/salmon
  pattern: '[^"`$\\]*'
- id: featurecounts_group_type
  name: featureCounts group type
  kind: string
  path: params/featurecounts_group_type.txt
  description: --featurecounts_group_type (biotype attribute)
  value: gene_type
  pattern: '[A-Za-z0-9_]+'
- id: min_trimmed_reads
  name: Min trimmed reads
  kind: number
  path: params/min_trimmed_reads.json
  value: 10000
  min: 0
  description: --min_trimmed_reads
- id: min_mapped_reads
  name: Min mapped reads
  kind: number
  path: params/min_mapped_reads.json
  value: 5
  min: 0
  max: 100
  description: --min_mapped_reads (STAR uniquely mapped %)
- id: stranded_threshold
  name: Stranded threshold
  kind: number
  path: params/stranded_threshold.json
  value: 0.8
  min: 0.5
  max: 1
  description: --stranded_threshold
- id: unstranded_threshold
  name: Unstranded threshold
  kind: number
  path: params/unstranded_threshold.json
  value: 0.1
  min: 0
  max: 1
  description: --unstranded_threshold
tasks:
- kind: horus_task
  id: link_reference
  name: Link the given references
  description: 'Stands in for the reference prep the given files make unnecessary: links them where those steps wrote, and writes refs.env (file names, biotype_qc).'
  inputs:
  - id: fasta_path
    name: Genome fasta
    kind: string
    path: params/fasta_path.txt
  - id: gtf_path
    name: GTF
    kind: string
    path: params/gtf_path.txt
  - id: transcript_fasta_path
    name: Transcript fasta
    kind: string
    path: params/transcript_fasta_path.txt
  - id: gene_bed_path
    name: Gene BED
    kind: string
    path: params/gene_bed_path.txt
  - id: star_index_path
    name: STAR index
    kind: string
    path: params/star_index_path.txt
  - id: salmon_index_path
    name: Salmon index
    kind: string
    path: params/salmon_index_path.txt
  - id: featurecounts_group_type
    name: featureCounts group type
    kind: string
    path: params/featurecounts_group_type.txt
  outputs:
  - id: reference
    name: Reference files
    kind: folder
    path: work/reference/
  - id: gtf
    name: GTF
    kind: folder
    path: work/genome/gtf/
  - id: gene_bed
    name: Gene BED
    kind: folder
    path: work/genome/gene_bed/
  - id: star_idx
    name: STAR index
    kind: folder
    path: work/genome/star_index/
  - id: salmon_idx
    name: Salmon index
    kind: folder
    path: work/genome/salmon_index/
  executor:
    kind: shell
  runtime:
    kind: command
    command: |
      set -eu
      rm -rf ${reference} ${gtf} ${gene_bed} ${star_idx} ${salmon_idx}
      mkdir -p ${reference} ${gtf} ${gene_bed} ${star_idx} ${salmon_idx}
      for f in "${fasta_path}" "${gtf_path}" "${transcript_fasta_path}" "${gene_bed_path}"; do
          case $$f in *.gz) echo "$$f: gzipped references need the GUNZIP steps this variant drops" >&2; exit 1 ;; esac
          test -f "$$f"
      done
      test -d "${star_index_path}" && test -d "${salmon_index_path}"
      ln -s "${fasta_path}" "${transcript_fasta_path}" ${reference}/
      ln -s "${gtf_path}" ${gtf}/
      ln -s "${gene_bed_path}" ${gene_bed}/
      ln -s "${star_index_path}" ${star_idx}/star
      ln -s "${salmon_index_path}" ${salmon_idx}/
      # biotypeQcUsable: the biotype attribute on an exon row of the raw GTF
      biotype_qc=$$(awk -F '\t' -v b="${featurecounts_group_type}" \
          '$$3 == "exon" { n = split($$NF, w, " "); for (i = 1; i <= n; i++) if (w[i] == b) { print "true"; exit } }' "${gtf_path}")
      printf 'ref_fasta=%s\nref_gtf=%s\nref_transcript_fasta=%s\nbiotype_qc=%s\n' \
          "$$(basename "${fasta_path}")" "$$(basename "${gtf_path}")" "$$(basename "${transcript_fasta_path}")" \
          "$${biotype_qc:-false}" > ${reference}/refs.env
  target:
    kind: local
- kind: horus_task
  id: stage_samples
  name: Split the samplesheet into samples
  description: Fetches each sample's reads and writes one meta file per sample, merging runs as the samplesheet check does.
  inputs:
  - id: samplesheet
    name: Samplesheet
    kind: file
    path: examples/samplesheet.csv
  - id: input_mirror
    name: Local input mirror
    kind: string
    path: params/input_mirror.txt
  outputs:
  - id: reads
    name: Reads
    kind: folder
    path: work/reads/
  - id: samples
    name: Samples
    kind: folder
    path: work/samples/
  - id: multi_run
    name: Multi-run samples
    kind: folder
    path: work/multi_run/
  executor:
    kind: shell
  runtime:
    kind: python_script
    script: scripts/stage_inputs.py
    python: python3
    args: samples --samplesheet ${samplesheet} --mirror ${input_mirror} --reads ${reads} --samples ${samples} --multi-run ${multi_run}
  target:
    kind: local
- kind: horus_task
  id: gtf_filtered
  name: CUSTOM_GTFFILTER
  inputs:
  - id: reference
    name: Reference files
    kind: folder
    path: work/reference/
  - id: gtf
    name: GTF
    kind: folder
    path: work/genome/gtf/
  - id: nfcore
    name: nf-core/rnaseq files
    kind: folder
    path: nfcore/
  outputs:
  - id: gtf_filtered
    name: Filtered GTF
    kind: folder
    path: work/genome/gtf_filtered/
  resources:
    cpus: 1
    memory_gb: 2
    walltime: 04:00:00
  executor:
    kind: apptainer
    image: /fsx/sif/community-cr-prod.seqera.io-docker-registry-v2-blobs-sha256-18-1841daa69f98a0b0ffcb8f545070c8350a75febb167202136eab0990131d31c0-data.img
    binds:
      /fsx: /fsx
    env:
      PYTHONNOUSERSITE: '1'
      R_PROFILE_USER: /.Rprofile
      R_ENVIRON_USER: /.Renviron
      JULIA_DEPOT_PATH: /usr/local/share/julia
    extra_args:
    - --cleanenv
    - --no-home
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      . ${reference}/refs.env
      rm -rf ${gtf_filtered} && mkdir -p ${gtf_filtered} && cd ${gtf_filtered}
      g=$$(cd ${gtf} && ls)
      ln -s ${reference}/$$ref_fasta $$ref_fasta
      ln -s ${gtf}/$$g $$g
      NF_ARGS= NF_FASTA=$$ref_fasta NF_GTF=$$g NF_OUT=$${g%.gtf}.filtered.gtf \
      NF_PROCESS=NFCORE_RNASEQ:PREPARE_GENOME_REFERENCES:CUSTOM_GTFFILTER \
          /usr/bin/env python ${nfcore}/templates/gtffilter.py
      rm $$ref_fasta $$g
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target:
    kind: slurm
    partition: compute
    working_directory: '@SLURM_DIR@'
    inner:
      kind: local
- kind: horus_task
  id: link_genome
  name: Link genome and filtered GTF
  description: 'genome/out/ as CUSTOM_CATADDITIONALFASTA left it, without an additional fasta: the genome and the CUSTOM_GTFFILTER output.'
  inputs:
  - id: reference
    name: Reference files
    kind: folder
    path: work/reference/
  - id: gtf_filtered
    name: Filtered GTF
    kind: folder
    path: work/genome/gtf_filtered/
  outputs:
  - id: genome
    name: Genome plus additional fasta
    kind: folder
    path: work/genome/genome/
  executor:
    kind: shell
  runtime:
    kind: command
    command: |
      set -eu
      rm -rf ${genome} && mkdir -p ${genome}/out
      . ${reference}/refs.env
      g=$$(cd ${gtf_filtered} && ls *.gtf)
      ln -s ${reference}/$$ref_fasta ${genome}/out/$$ref_fasta
      ln -s ${gtf_filtered}/$$g ${genome}/out/$$g
  target:
    kind: local
- kind: horus_task
  id: faidx
  name: SAMTOOLS_FAIDX
  inputs:
  - id: reference
    name: Reference files
    kind: folder
    path: work/reference/
  outputs:
  - id: faidx
    name: Fasta index
    kind: folder
    path: work/genome/faidx/
  resources:
    cpus: 1
    memory_gb: 2
    walltime: 04:00:00
  executor:
    kind: apptainer
    image: /fsx/sif/community-cr-prod.seqera.io-docker-registry-v2-blobs-sha256-e9-e994bf4eb3731150511a14f5706b7bdfd64df1b6d40898fff334286c027e0859-data.img
    binds:
      /fsx: /fsx
    env:
      PYTHONNOUSERSITE: '1'
      R_PROFILE_USER: /.Rprofile
      R_ENVIRON_USER: /.Renviron
      JULIA_DEPOT_PATH: /usr/local/share/julia
    extra_args:
    - --cleanenv
    - --no-home
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      rm -rf ${faidx} && mkdir -p ${faidx} && cd ${faidx}
      . ${reference}/refs.env; fa=$$ref_fasta
      ln -s ${reference}/$$fa $$fa
      samtools \
          faidx \
          $$fa \


      cut -f 1,2 $$fa.fai > $$fa.sizes
      rm $$fa
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target:
    kind: slurm
    partition: compute
    working_directory: '@SLURM_DIR@'
    inner:
      kind: local
- kind: horus_map
  id: cat_fastq
  name: CAT_FASTQ
  description: Writes each sample's meta.env, the head of the chain, and concatenates the runs of samples sequenced more than once.
  over:
    input_id: samples
    as: sample
  max_concurrency: 200
  inputs:
  - id: samples
    name: Samples
    kind: folder
    path: work/samples/
  - id: reads
    name: Reads
    kind: folder
    path: work/reads/
  outputs:
  - id: cat_fastq
    name: Merged runs
    kind: folder
    path: work/cat_fastq/
  resources:
    cpus: 1
    memory_gb: 2
    walltime: 04:00:00
  executor:
    kind: apptainer
    image: /fsx/sif/community-cr-prod.seqera.io-docker-registry-v2-blobs-sha256-52-52ccce28d2ab928ab862e25aae26314d69c8e38bd41ca9431c67ef05221348aa-data.img
    binds:
      /fsx: /fsx
    env:
      PYTHONNOUSERSITE: '1'
      R_PROFILE_USER: /.Rprofile
      R_ENVIRON_USER: /.Renviron
      JULIA_DEPOT_PATH: /usr/local/share/julia
    extra_args:
    - --cleanenv
    - --no-home
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      id=$$(basename ${sample}); . ${sample}
      rm -rf ${cat_fastq} && mkdir -p ${cat_fastq} && cd ${cat_fastq}
      { echo id=$$id; cat ${sample}; } > meta.env
      [ $$merged = true ] || exit 0
      d=${reads}/$$id
      case $$(head -n 1 $$d/reads.txt) in *.gz) compress= ;; *) compress='| gzip' ;; esac
      if [ $$single_end = true ]; then
          eval "cat $$(sed "s#^#$$d/#" $$d/reads.txt | tr '\n' ' ') $$compress > $${id}.merged.fastq.gz"
      else
          eval "cat $$(awk -v d=$$d 'NR % 2 == 1 {printf "%s/%s ", d, $$0}' $$d/reads.txt) $$compress > $${id}_1.merged.fastq.gz"
          eval "cat $$(awk -v d=$$d 'NR % 2 == 0 {printf "%s/%s ", d, $$0}' $$d/reads.txt) $$compress > $${id}_2.merged.fastq.gz"
      fi
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target:
    kind: slurm
    partition: compute
    working_directory: '@SLURM_DIR@'
    inner:
      kind: local
- kind: horus_map
  id: lint_raw
  name: FQ_LINT
  over:
    input_id: cat_fastq
    as: sample
  chain: true
  max_concurrency: 200
  inputs:
  - id: cat_fastq
    name: Merged runs
    kind: folder
    path: work/cat_fastq/
  - id: reads
    name: Reads
    kind: folder
    path: work/reads/
  outputs:
  - id: lint_raw
    name: fq lint raw
    kind: folder
    path: results/fq_lint/raw/
  resources:
    cpus: 1
    memory_gb: 2
    walltime: 04:00:00
  executor:
    kind: apptainer
    image: /fsx/sif/depot.galaxyproject.org-singularity-fq-0.12.0--h9ee0642_0.img
    binds:
      /fsx: /fsx
    env:
      PYTHONNOUSERSITE: '1'
      R_PROFILE_USER: /.Rprofile
      R_ENVIRON_USER: /.Renviron
      JULIA_DEPOT_PATH: /usr/local/share/julia
    extra_args:
    - --cleanenv
    - --no-home
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      . ${sample}/meta.env
      rm -rf ${lint_raw} && mkdir -p ${lint_raw} && cd ${lint_raw} && cp ${sample}/meta.env .
      if [ $$merged = true ]; then
          if [ $$single_end = true ]; then ln -s ${sample}/$${id}.merged.fastq.gz .
          else ln -s ${sample}/$${id}_1.merged.fastq.gz ${sample}/$${id}_2.merged.fastq.gz .; fi
          fqs=$$(ls *.merged.fastq.gz | tr '\n' ' ')
      else
          fqs=$$(tr '\n' ' ' < ${reads}/$$id/reads.txt)
          for f in $$fqs; do ln -s ${reads}/$$id/$$f $$f; done
      fi
      fq lint \
          --disable-validator P001 \
          $${fqs% } > $${id}.fq_lint.txt
      rm $$fqs
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target:
    kind: slurm
    partition: compute
    working_directory: '@SLURM_DIR@'
    inner:
      kind: local
- kind: horus_map
  id: fastqc_raw
  name: FASTQC
  over:
    input_id: cat_fastq
    as: sample
  chain: true
  zip:
  - input_id: lint_raw
    as: lint
  max_concurrency: 200
  inputs:
  - id: cat_fastq
    name: Merged runs
    kind: folder
    path: work/cat_fastq/
  - id: lint_raw
    name: fq lint raw
    kind: folder
    path: results/fq_lint/raw/
  - id: reads
    name: Reads
    kind: folder
    path: work/reads/
  outputs:
  - id: fastqc_raw
    name: FastQC raw
    kind: folder
    path: results/fastqc/raw/
  resources:
    cpus: 2
    memory_gb: 6
    walltime: 04:00:00
  executor:
    kind: apptainer
    image: /fsx/sif/depot.galaxyproject.org-singularity-fastqc-0.12.1--hdfd78af_0.img
    binds:
      /fsx: /fsx
    env:
      PYTHONNOUSERSITE: '1'
      R_PROFILE_USER: /.Rprofile
      R_ENVIRON_USER: /.Renviron
      JULIA_DEPOT_PATH: /usr/local/share/julia
    extra_args:
    - --cleanenv
    - --no-home
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      . ${sample}/meta.env
      rm -rf ${fastqc_raw} && mkdir -p ${fastqc_raw} && cd ${fastqc_raw} && cp ${sample}/meta.env .
      if [ $$merged = true ]; then
          if [ $$single_end = true ]; then set -- ${sample}/$${id}.merged.fastq.gz
          else set -- ${sample}/$${id}_1.merged.fastq.gz ${sample}/$${id}_2.merged.fastq.gz; fi
      else
          set -- $$(sed "s#^#${reads}/$$id/#" ${reads}/$$id/reads.txt)
      fi
      pairs=""; names=""; i=0
      for f in "$$@"; do
          i=$$((i + 1))
          mkdir -p $$i && ln -s $$f $$i/
          if [ $$# -eq 1 ]; then new=$${id}_raw.$${f##*.}; else new=$${id}_raw_$$i.$${f##*.}; fi
          pairs="$$pairs $$i/$$(basename $$f) $$new"; names="$$names $$new"
      done
      mem=$$(( ${task.resources.memory_gb} * 1024 / ${task.resources.cpus} ))
      [ $$mem -gt 10000 ] && mem=10000
      [ $$mem -lt 100 ] && mem=100
      printf "%s %s\n" $$pairs | while read old_name new_name; do
          [ -f "$${new_name}" ] || ln -s $$old_name $$new_name
      done

      fastqc \
          --quiet \
          --threads ${task.resources.cpus} \
          --memory $$mem \
          $${names# }
      rm $$names; rm -r $$(seq 1 $$#)
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target:
    kind: slurm
    partition: compute
    working_directory: '@SLURM_DIR@'
    inner:
      kind: local
