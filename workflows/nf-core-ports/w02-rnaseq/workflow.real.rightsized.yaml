    kind: folder
    path: nfcore/
  outputs:
  - id: ps_deseq2
    name: DESeq2 QC (Salmon)
    kind: folder
    path: results/salmon/deseq2_qc/
  resources:
    cpus: 1
    memory_gb: 2
    walltime: 08:00:00
  executor:
    kind: apptainer
    image: /fsx/sif/community-cr-prod.seqera.io-docker-registry-v2-blobs-sha256-1d-1d425b12748ce54c44c01a535a1ef5867a6e16cbf62c43151012e893444b1673-data.img
    binds:
      /fsx: /fsx
    env:
      PYTHONNOUSERSITE: '1'
      R_PROFILE_USER: /.Rprofile
      R_ENVIRON_USER: /.Renviron
      JULIA_DEPOT_PATH: /usr/local/share/julia
    extra_args:
    - --cleanenv
    - --no-home
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      rm -rf ${ps_deseq2} && mkdir -p ${ps_deseq2} && cd ${ps_deseq2}
      ln -s ${ps_tximport}/salmon.merged.gene_counts_length_scaled.tsv .
      ln -s ${nfcore}/assets/deseq2_pca_header.txt . && ln -s ${nfcore}/assets/deseq2_clustering_header.txt .
      export PATH=${nfcore}/bin:$$PATH
      deseq2_qc.r \
          --count_file salmon.merged.gene_counts_length_scaled.tsv \
          --outdir ./ \
          --cores ${task.resources.cpus} \
          --outprefix deseq2 \
          --id_col 1 --sample_suffix '' --count_col 3 --vst TRUE

      if [ -f "R_sessionInfo.log" ]; then
          # Handle PCA files
          sed "s/deseq2_pca/salmon_deseq2_pca/g" <deseq2_pca_header.txt > pca_header.tmp
          sed -i -e "s/DESeq2 PCA/SALMON DESeq2 PCA/g" pca_header.tmp
          cat pca_header.tmp *.pca.vals.txt > salmon.pca.vals_mqc.tsv
          rm pca_header.tmp

          # Handle clustering files
          sed "s/deseq2_clustering/salmon_deseq2_clustering/g" <deseq2_clustering_header.txt > clustering_header.tmp
          sed -i -e "s/DESeq2 sample/SALMON DESeq2 sample/g" clustering_header.tmp
          cat clustering_header.tmp *.sample.dists.txt > salmon.sample.dists_mqc.tsv
          rm clustering_header.tmp
      fi
      rm salmon.merged.gene_counts_length_scaled.tsv deseq2_pca_header.txt deseq2_clustering_header.txt
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
