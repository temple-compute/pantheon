artifacts:
- id: samplesheet
  name: Samplesheet
  kind: file
  path: examples/samplesheet_full.csv
  description: 'nf-core/scrnaseq samplesheet (sample,fastq_1,fastq_2,expected_cells,seq_center). Reads may be URLs or paths relative to the samplesheet; rows sharing a sample are runs of one sample. Default: the test_full samplesheet (nf-core/test-datasets scrnaseq samplesheet_2.0_full.csv, pbmc8k, 2 lanes).'
- {id: nfcore, name: nf-core/scrnaseq files, kind: folder, path: nfcore/, description: 'nf-core/scrnaseq 4.2.0 assets, bin script and module templates (MIT).'}
- {id: stage_py, name: Stage script, kind: file, path: scripts/stage_samples.py, description: Splits the samplesheet into sample folders.}
- id: fasta_url
  name: Genome fasta
  kind: string
  path: params/fasta_url.txt
  pattern: '[^"`$\\]*'
  description: --fasta (iGenomes GRCh38 genome.fa; URL or file:// path)
  value: https://ngi-igenomes.s3.eu-west-1.amazonaws.com/igenomes/Homo_sapiens/NCBI/GRCh38/Sequence/WholeGenomeFasta/genome.fa
- id: gtf_url
  name: GTF
  kind: string
  path: params/gtf_url.txt
  pattern: '[^"`$\\]*'
  description: --gtf (iGenomes GRCh38 genes.gtf; URL or file:// path)
  value: https://ngi-igenomes.s3.eu-west-1.amazonaws.com/igenomes/Homo_sapiens/NCBI/GRCh38/Annotation/Genes/genes.gtf
- id: star_index_url
  name: STAR index
  kind: string
  path: params/star_index_url.txt
  pattern: '[^"`$\\]*'
  description: --star_index (iGenomes GRCh38 STARIndex/, a STAR 2.6 index; URL of the folder)
  value: https://ngi-igenomes.s3.eu-west-1.amazonaws.com/igenomes/Homo_sapiens/NCBI/GRCh38/Sequence/STARIndex
tasks:
- kind: horus_task
  id: fetch_reference
  name: Link Fetch reference files
  description: Links the prebuilt files instead of building them.
  inputs: []
  outputs:
  - *a_reference
  executor: {kind: shell}
  runtime:
    kind: command
    command: |
      set -eu
      test -e /fsx/data/scrnaseq/igenomes/Homo_sapiens/NCBI/GRCh38/Sequence/WholeGenomeFasta/genome.fa
      test -e /fsx/data/scrnaseq/igenomes/Homo_sapiens/NCBI/GRCh38/Annotation/Genes/genes.gtf
      test -e /fsx/data/scrnaseq/igenomes/Homo_sapiens/NCBI/GRCh38/Sequence/STARIndex
      rm -rf ${reference} && mkdir -p ${reference}
      ln -s /fsx/data/scrnaseq/igenomes/Homo_sapiens/NCBI/GRCh38/Sequence/WholeGenomeFasta/genome.fa ${reference}/genome.fa
      ln -s /fsx/data/scrnaseq/igenomes/Homo_sapiens/NCBI/GRCh38/Annotation/Genes/genes.gtf ${reference}/genes.gtf
      ln -s /fsx/data/scrnaseq/igenomes/Homo_sapiens/NCBI/GRCh38/Sequence/STARIndex ${reference}/STARIndex
  target: *t_local
- kind: horus_task
  id: stage_samples
  name: Split the samplesheet into samples
  description: Fetches each sample's reads into samples/<id>/ with reads.txt and meta.env, merging runs of one sample.
  inputs:
  - *a_samplesheet
  - *a_stage_py
  outputs:
  - *a_samples
  executor: {kind: shell}
  runtime: {kind: command, command: 'python3 ${stage_py} --samplesheet ${samplesheet} --out ${samples}'}
  target: *t_local
- kind: horus_task
  id: gtf_filter
  name: GTF_GENE_FILTER
  inputs:
  - *a_reference
  - *a_nfcore
  outputs:
  - *a_gtf_filtered
  resources: *res_r2_12_04h
  executor: *img_python
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      rm -rf ${gtf_filtered} && mkdir -p ${gtf_filtered} && cd ${gtf_filtered}
      fa=$$(cd ${reference} && ls *.fa *.fasta 2>/dev/null || true)
      gtf=$$(cd ${reference} && ls *.gtf)
      ln -s ${reference}/$$fa $$fa
      ln -s ${reference}/$$gtf $$gtf
      python ${nfcore}/bin/filter_gtf_for_genes_in_genome.py \
          --gtf $$gtf \
          --fasta $$fa \
          -o $${fa%.*}_genes.gtf
      rm $$fa $$gtf
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target: *t_compute
- kind: horus_task
  id: star_idx
  name: STAR_GENOMEPARAMS_UPGRADE
  inputs:
  - *a_reference
  outputs:
  - *a_star_idx
  resources: *res_r1_6_04h
  executor: *img_gawk
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      rm -rf ${star_idx} && mkdir -p ${star_idx} && cd ${star_idx}
      ln -s ${reference}/STARIndex input_index
      mkdir -p star
      for f in input_index/*; do
          name=$$(basename "$$f")
          if [ "$$name" = "genomeParameters.txt" ]; then
              continue
          fi
          ln -s "$$(readlink -f "$$f")" "star/$$name"
      done

      awk -F'\t' -v OFS='\t' '
          $$1 == "versionGenome" && $$2 == "20201" {
              print "versionGenome", "2.7.4a"
              seen_upgraded = 1
              next
          }
          $$1 == "genomeType"          { seen_genomeType = 1 }
          $$1 == "genomeTransformType" { seen_transformType = 1 }
          $$1 == "genomeTransformVCF"  { seen_transformVCF = 1 }
          { print }
          END {
              if (seen_upgraded) {
                  if (!seen_genomeType)    print "genomeType", "Full"
                  if (!seen_transformType) print "genomeTransformType", "None"
                  if (!seen_transformVCF)  print "genomeTransformVCF", "-"
              }
          }
      ' "input_index/genomeParameters.txt" > star/genomeParameters.txt
      rm input_index
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target: *t_compute
- kind: horus_map
  id: fastqc
  name: FASTQC
  over: {input_id: samples, as: sample}
  max_concurrency: 200
  inputs:
  - *a_samples
  outputs:
  - *a_fastqc
  resources: *res_r2_12_24h
  executor: *img_fastqc
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      id=$$(basename ${sample})
      rm -rf ${fastqc} && mkdir -p ${fastqc} && cd ${fastqc}
      set -- $$(cat ${sample}/reads.txt)
      pairs=""; names=""; i=0
      for f in "$$@"; do
          i=$$((i + 1))
          mkdir -p $$i && ln -s ${sample}/$$f $$i/
          if [ $$# -eq 1 ]; then new=$${id}.gz; else new=$${id}_$$i.gz; fi
          pairs="$$pairs $$i/$$f $$new"; names="$$names $$new"
      done
      mem=$$(( ${task.resources.memory_gb} * 1024 / ${task.resources.cpus} ))
      [ $$mem -gt 10000 ] && mem=10000
      [ $$mem -lt 100 ] && mem=100
      printf "%s %s\n" $$pairs | while read old_name new_name; do
          [ -f "$${new_name}" ] || ln -s $$old_name $$new_name
      done

      fastqc \
          --quiet \
          --threads ${task.resources.cpus} \
          --memory $$mem \
          $${names# }
      rm $$names; rm -r $$(seq 1 $$#)
      # Java's prefs dir: with no passwd entry for the user, user.home is "?".
      rm -rf ./'?'
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target: *t_compute
- kind: horus_map
  id: star_align
  name: STAR_ALIGN
  over: {input_id: samples, as: sample}
  max_concurrency: 200
  inputs:
  - *a_samples
  - *a_star_idx
  - *a_gtf_filtered
  - *a_nfcore
  outputs:
  - *a_star_align
  resources: *res_r8_58_16h
  executor: *img_star
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      prefix=$$(basename ${sample})
      expected_cells=; seq_center=; . ${sample}/meta.env
      rm -rf ${star_align} && mkdir -p ${star_align} && cd ${star_align}
      # reads.collate(2).transpose(): R1s are forward, R2s reverse.
      forward=""; reverse=""; i=0
      for f in $$(cat ${sample}/reads.txt); do
          ln -s ${sample}/$$f $$f
          i=$$((i + 1))
          if [ $$((i % 2)) -eq 1 ]; then forward="$$forward,$$f"; else reverse="$$reverse,$$f"; fi
      done
      gtf=$$(cd ${gtf_filtered} && ls *.gtf)
      ln -s ${gtf_filtered}/$$gtf $$gtf
      ln -s ${star_idx}/star star
      whitelist=10x_V2_barcode_whitelist.txt.gz
      ln -s ${nfcore}/assets/whitelist/$$whitelist $$whitelist
      if [ -n "$$seq_center" ]; then rg=(ID:$$prefix "CN:$$seq_center" "SM:$$prefix"); else rg=(ID:$$prefix "SM:$$prefix"); fi
      cell_filter=(); [ -n "$$expected_cells" ] && cell_filter=(--soloCellFilter CellRanger2.2 $$expected_cells 0.99 10)

      if [[ $$whitelist == *.gz ]]; then
          gzip -cdf $$whitelist > whitelist.uncompressed.txt
      else
          cp $$whitelist whitelist.uncompressed.txt
      fi

      STAR \
          --genomeDir star \
          --readFilesIn $${reverse#,} $${forward#,} \
          --runThreadN ${task.resources.cpus} \
          --outFileNamePrefix $$prefix. \
          --soloCBwhitelist whitelist.uncompressed.txt \
          --soloType CB_UMI_Simple \
          --soloFeatures Gene \
          --soloUMIlen 10 \
          --sjdbGTFfile $$gtf \
          --outSAMattrRGline "$${rg[@]}" \
          "$${cell_filter[@]}" \
          --readFilesCommand zcat --runDirPerm All_RWX --outWigType bedGraph --twopassMode Basic --outSAMtype BAM SortedByCoordinate --limitBAMsortRAM $$(( ${task.resources.memory_gb} * 1073741824 )) \

      if [ -f $$prefix.Unmapped.out.mate1 ]; then
          mv $$prefix.Unmapped.out.mate1 $$prefix.unmapped_1.fastq
          gzip $$prefix.unmapped_1.fastq
      fi
      if [ -f $$prefix.Unmapped.out.mate2 ]; then
          mv $$prefix.Unmapped.out.mate2 $$prefix.unmapped_2.fastq
          gzip $$prefix.unmapped_2.fastq
      fi

      if [ -d $$prefix.Solo.out ]; then
          find $$prefix.Solo.out \( -name "*.tsv" -o -name "*.mtx" \) -exec gzip {} \;
      fi

      if [ -d $$prefix.Solo.out/Velocyto ]; then
          mv $$prefix.Solo.out/Velocyto/raw $$prefix.Solo.out/Velocyto/velocyto_raw
          mv $$prefix.Solo.out/Velocyto/filtered $$prefix.Solo.out/Velocyto/velocyto_filtered
      fi
      # Keep what publishDir keeps (the module's declared outputs).
      rm -f $$(cat ${sample}/reads.txt) $$gtf star $$whitelist whitelist.uncompressed.txt $$prefix.Signal.*.bg
      rm -rf $$prefix._STARgenome $$prefix._STARpass1
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target: *t_highmem
- kind: horus_task
  id: list_matrices
  name: Matrix types
  description: One CONCAT_H5AD item per input type, raw, filtered and cellbender_filter.
  inputs:
  - *a_star_align
  outputs:
  - *a_concat_items
  executor: {kind: shell}
  runtime:
    kind: command
    command: |
      set -eu
      rm -rf ${concat_items} && mkdir -p ${concat_items}
      for t in raw filtered cellbender_filter; do
        printf 'id=combined\ninput_type=%s\n' $$t > ${concat_items}/combined_$$t
      done
  target: *t_local
- kind: horus_map
  id: mtx
  name: MTX_TO_H5AD
  over: {input_id: star_align, as: sample}
  chain: true
  max_concurrency: 200
  inputs:
  - *a_star_align
  - *a_nfcore
  outputs:
  - *a_mtx
  resources: *res_r6_36_08h
  executor: *img_scanpy
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      solo=$$(cd ${sample} && ls -d *.Solo.out)
      id=$${solo%.Solo.out}
      rm -rf ${mtx} && mkdir -p ${mtx} && cd ${mtx}
      for input_type in raw filtered; do
      ln -s ${sample}/$$solo/Gene/$$input_type $$input_type
      NF_ID=$$id NF_INPUT_TYPE=$$input_type NF_PROCESS=NFCORE_SCRNASEQ:SCRNASEQ:MTX_TO_H5AD \
          python ${nfcore}/templates/mtx_to_h5ad_star.py
      rm -rf $$input_type $$id versions.yml metrics_* preprocessing_* tmp
      done
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target: *t_compute
- kind: horus_map
  id: cellbender
  name: CELLBENDER_REMOVEBACKGROUND
  over: {input_id: mtx, as: sample}
  chain: true
  max_concurrency: 200
  inputs:
  - *a_mtx
  outputs:
  - *a_cellbender
  resources: *res_r6_36_08h
  executor: *img_cellbender_webcolors
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      h5ad=$$(cd ${sample} && ls *_raw_matrix.h5ad)
      prefix=$${h5ad%_raw_matrix.h5ad}
      rm -rf ${cellbender} && mkdir -p ${cellbender}/work && cd ${cellbender}/work
      ln -s ${sample}/$$h5ad $$h5ad
      TMPDIR=. cellbender remove-background \
           \
          --cpu-threads ${task.resources.cpus} \
          --estimator-multiple-cpu \
           \
          --input $$h5ad \
          --output $$prefix.h5
      # Keep the module's declared outputs (the report is optional).
      for f in $$prefix.h5 $${prefix}_filtered.h5 $${prefix}_posterior.h5 $${prefix}_cell_barcodes.csv \
          $${prefix}_metrics.csv $${prefix}_report.html $$prefix.pdf $$prefix.log ckpt.tar.gz; do
          if [ -e $$f ]; then mv $$f ..; fi
      done
      cd .. && rm -rf work
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target: *t_compute
- kind: horus_map
  id: barcodes
  name: ANNDATA_BARCODES
  over: {input_id: cellbender, as: cb}
  chain: true
  zip:
  - {input_id: mtx, as: sample}
  max_concurrency: 200
  inputs:
  - *a_cellbender
  - *a_mtx
  - *a_nfcore
  outputs:
  - *a_cb_h5ad
  resources: *res_r1_6_04h
  executor: *img_anndata_pandas_python_pyyaml
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      h5ad=$$(cd ${sample} && ls *_raw_matrix.h5ad)
      id=$${h5ad%_raw_matrix.h5ad}
      rm -rf ${cb_h5ad} && mkdir -p ${cb_h5ad} && cd ${cb_h5ad}
      ln -s ${sample}/$$h5ad $$h5ad
      ln -s ${cb}/$${id}_cell_barcodes.csv $${id}_cell_barcodes.csv
      NF_H5AD=$$h5ad NF_BARCODES=$${id}_cell_barcodes.csv NF_PREFIX=$${id}_cellbender_filter_matrix \
      NF_PROCESS=NFCORE_SCRNASEQ:SCRNASEQ:H5AD_REMOVEBACKGROUND_BARCODES_CELLBENDER_ANNDATA:ANNDATA_BARCODES \
          python3 ${nfcore}/templates/barcodes.py
      rm $$h5ad $${id}_cell_barcodes.csv versions.yml
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target: *t_compute
- kind: horus_map
  id: concat
  name: CONCAT_H5AD
  over: {input_id: concat_items, as: item}
  max_concurrency: 200
  inputs:
  - *a_concat_items
  - *a_mtx
  - *a_cb_h5ad
  - *a_samplesheet
  - *a_nfcore
  outputs:
  - *a_concat
  resources: *res_r6_36_08h
  executor: *img_scanpy
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.$$$$.sh <<'NF'
      . ${item}
      rm -rf ${concat} && mkdir -p ${concat} && cd ${concat}
      # raw and filtered come from mtx, cellbender_filter from cb_h5ad.
      shopt -s nullglob
      links=$$(for d in ${mtx} ${cb_h5ad}; do for f in $$d/*/*_$${input_type}_matrix.h5ad; do echo $$f; done; done)
      shopt -u nullglob
      for f in $$links; do ln -s $$f .; done
      sheet=$$(basename ${samplesheet})
      ln -s ${samplesheet} $$sheet
      NF_ID=$$id NF_INPUT_TYPE=$$input_type NF_SAMPLESHEET=$$sheet \
      NF_PROCESS=NFCORE_SCRNASEQ:SCRNASEQ:H5AD_CONVERSION:CONCAT_H5AD \
          python ${nfcore}/templates/concat_h5ad.py
      for f in $$links; do rm $$(basename $$f); done
      rm -rf $$sheet versions.yml metrics_* preprocessing_* tmp
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.$$$$.sh
  target: *t_compute
- kind: horus_map
  id: convert
  name: ANNDATAR_CONVERT
  over: {input_id: mtx, as: sample}
  chain: true
  max_concurrency: 200
  inputs:
  - *a_mtx
  - *a_nfcore
  outputs:
