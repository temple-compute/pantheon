        write.table(df, file = "overall_summary.tsv", quote=FALSE, col.names=TRUE, row.names=FALSE, sep="	")

        writeLines(c("\"NFCORE_AMPLISEQ:AMPLISEQ:MERGE_STATS_DECONTAM\":", paste0("    R: ", paste0(R.Version()[c("major","minor")], collapse = ".")) ), "versions.yml")
