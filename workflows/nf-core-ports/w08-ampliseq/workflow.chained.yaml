        fi

        qiime diversity core-metrics-phylogenetic \
            --m-metadata-file metadata.tsv \
            --i-phylogeny rooted-tree.qza \
            --i-table filtered-table.qza \
            --p-sampling-depth $$mindepth \
            --output-dir diversity_core \
            --p-n-jobs-or-threads 4 \
