        export XDG_CACHE_HOME="./xqcache"
        export MPLCONFIGDIR="./mplconfigdir"
        export NUMBA_CACHE_DIR="./numbacache"

        # Sum data at the specified level
        qiime taxa collapse \
            --i-table "@col@.qza" \
            --i-taxonomy "taxonomy.qza" \
            --p-level @level@ \
            --o-collapsed-table "lvl@level@-@col@.qza"

        # Extract summarised table and output a file with the number of taxa
        qiime tools export \
            --input-path "lvl@level@-@col@.qza" \
            --output-path exported/
        biom convert \
            -i exported/feature-table.biom \
            -o "lvl@level@-@col@.feature-table.tsv" \
            --to-tsv

        if [ $$(grep -v '^#' -c "lvl@level@-@col@.feature-table.tsv") -lt 2 ]; then
            mkdir differentials
            echo @level@ > differentials/"WARNING Summing your data at taxonomic level @level@ produced less than two rows (taxa), ANCOMBC can't proceed -- did you specify a bad reference taxonomy?".txt
            mkdir da_barplot
            echo @level@ > da_barplot/"WARNING Summing your data at taxonomic level @level@ produced less than two rows (taxa), ANCOMBC can't proceed -- did you specify a bad reference taxonomy?".txt
