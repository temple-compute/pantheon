            write.table(paste(quality_scores, sep='\n'), file = "@direction@_preprocessed_QualityScores.txt", row.names = FALSE, col.names = FALSE, quote = FALSE, na = '')

            #aggregate data for each sequencing cycle
            df <- data.frame(Cycle=character(), Count=character(), Median=character(), stringsAsFactors=FALSE)
            cycles <- sort(unique(data$$Cycle))
            for (cycle in cycles) {
                subdata <- data[data[, "Cycle"] == cycle, ]
                score <- list()
                #convert to list to calculate median
                for (j in 1:nrow(subdata)) {score <- unlist(c(score, rep(subdata$$Score[j], subdata$$Count[j])))}
                temp = data.frame(Cycle=cycle, Count=sum(subdata$$Count), Median=median(score), stringsAsFactors=FALSE)
                df <- rbind(df, temp)
            }

            #write output
            write.table( t(df), file = paste0("@direction@_preprocessed_qual_stats",".tsv"), sep = "	", row.names = TRUE, col.names = FALSE, quote = FALSE)
            pdf(paste0("@direction@_preprocessed_qual_stats",".pdf"))
            plot
            dev.off()
            svg(paste0("@direction@_preprocessed_qual_stats",".svg"))
            plot
            dev.off()

            write.table(paste0('plotQualityProfile	, n = 5e+04, aggregate = TRUE
        max_files	',max_files), file = "@direction@_preprocessed_plotQualityProfile.args.txt", row.names = FALSE, col.names = FALSE, quote = FALSE, na = '')
            writeLines(c("\"NFCORE_AMPLISEQ:AMPLISEQ:DADA2_PREPROCESSING:DADA2_QUALITY2\":", paste0("    R: ", paste0(R.Version()[c("major","minor")], collapse = ".")),paste0("    dada2: ", packageVersion("dada2")),paste0("    ShortRead: ", packageVersion("ShortRead")) ), "versions.yml")
        NF
        sed -i "s|@direction@|$$direction|g" /tmp/.command.sh
        Rscript /tmp/.command.sh
        while read -r f; do rm -f "$$f"; done < /tmp/.staged
    target: *target

  - kind: horus_map
    id: dada2_err
    name: DADA2_ERR
    over: {input_id: runs, as: run_item}
    max_concurrency: 16
    inputs: [*a_runs, *a_dada2_filtntrim, *a_nfcore]
    outputs: [*a_dada2_err]
    resources: {cpus: 4, memory_gb: 6, walltime: "01:00:00"}
    executor: *dada2
    runtime:
      kind: command
      command: |
        set -eu
        export PYTHONNOUSERSITE=1 R_PROFILE_USER=/.Rprofile R_ENVIRON_USER=/.Renviron JULIA_DEPOT_PATH=/usr/local/share/julia
        export PATH="$$PATH:${nfcore}/bin"
        : > /tmp/.staged
        lnas() { d=$$1; shift; if [ $$# -ne 1 ] || [ ! -e "$$1" ]; then echo "stage $$d: need one input, got: $$*" >&2; exit 1; fi; mkdir -p "$$(dirname "$$d")"; ln -s "$$1" "$$d"; echo "$$d" >> /tmp/.staged; }
        lnk() { ld=$$1; shift; for lf in "$$@"; do lnas "$$ld/$${lf##*/}" "$$lf"; done; }
        . ${run_item}
        rm -rf ${dada2_err} && mkdir -p ${dada2_err} && cd ${dada2_err}
        for s in $$samples; do lnk . ${dada2_filtntrim}/*/$${s}_1.filt.fastq.gz ${dada2_filtntrim}/*/$${s}_2.filt.fastq.gz; done
        cat > /tmp/.command.sh <<'NF'
        #!/usr/bin/env Rscript
        suppressPackageStartupMessages(library(dada2))
        set.seed(100) # Initialize random number generator for reproducibility



        fnFs <- list.files(".", pattern = "_1.filt.fastq.gz", full.names = TRUE)
        fnRs <- sub("_1.filt.fastq.gz", "_2.filt.fastq.gz", fnFs)

        sink(file = "@run@.err.log")
        errF <- learnErrors(fnFs, nbases = 1e8, nreads = NULL, randomize = TRUE, MAX_CONSIST = 10, OMEGA_C = 0,qualityType = "Auto",errorEstimationFunction = loessErrfun, multithread = 4, verbose = TRUE)
        saveRDS(errF, "@run@_1.err.rds")
        errR <- learnErrors(fnRs, nbases = 1e8, nreads = NULL, randomize = TRUE, MAX_CONSIST = 10, OMEGA_C = 0,qualityType = "Auto",errorEstimationFunction = loessErrfun, multithread = 4, verbose = TRUE)
        saveRDS(errR, "@run@_2.err.rds")
        sink(file = NULL)

        pdf("@run@_1.err.pdf")
        plotErrors(errF, nominalQ = TRUE)
        dev.off()
        svg("@run@_1.err.svg")
        plotErrors(errF, nominalQ = TRUE)
        dev.off()

        pdf("@run@_2.err.pdf")
        plotErrors(errR, nominalQ = TRUE)
        dev.off()
        svg("@run@_2.err.svg")
        plotErrors(errR, nominalQ = TRUE)
        dev.off()

        sink(file = "@run@_1.err.convergence.txt")
        dada2:::checkConvergence(errF)
        sink(file = NULL)

        sink(file = "@run@_2.err.convergence.txt")
        dada2:::checkConvergence(errR)
        sink(file = NULL)

        write.table('learnErrors	nbases = 1e8, nreads = NULL, randomize = TRUE, MAX_CONSIST = 10, OMEGA_C = 0,qualityType = "Auto",errorEstimationFunction = loessErrfun', file = "learnErrors.args.txt", row.names = FALSE, col.names = FALSE, quote = FALSE, na = '')
        writeLines(c("\"NFCORE_AMPLISEQ:AMPLISEQ:DADA2_ERR\":", paste0("    R: ", paste0(R.Version()[c("major","minor")], collapse = ".")),paste0("    dada2: ", packageVersion("dada2")) ), "versions.yml")
        NF
        sed -i "s|@run@|$$run|g" /tmp/.command.sh
        Rscript /tmp/.command.sh
        while read -r f; do rm -f "$$f"; done < /tmp/.staged
        cp ${run_item} meta.env
    target: *target

  - kind: horus_map
    id: dada2_denoising
    name: DADA2_DENOISING
    over: {input_id: dada2_err, as: run_item}
    chain: true
    max_concurrency: 16
    inputs: [*a_dada2_err, *a_dada2_filtntrim, *a_nfcore]
    outputs: [*a_dada2_denoising]
    resources: {cpus: 4, memory_gb: 15, walltime: "01:00:00"}
    executor: *dada2
    runtime:
      kind: command
      command: |
        set -eu
        export PYTHONNOUSERSITE=1 R_PROFILE_USER=/.Rprofile R_ENVIRON_USER=/.Renviron JULIA_DEPOT_PATH=/usr/local/share/julia
        export PATH="$$PATH:${nfcore}/bin"
        : > /tmp/.staged
        lnas() { d=$$1; shift; if [ $$# -ne 1 ] || [ ! -e "$$1" ]; then echo "stage $$d: need one input, got: $$*" >&2; exit 1; fi; mkdir -p "$$(dirname "$$d")"; ln -s "$$1" "$$d"; echo "$$d" >> /tmp/.staged; }
        lnk() { ld=$$1; shift; for lf in "$$@"; do lnas "$$ld/$${lf##*/}" "$$lf"; done; }
        . ${run_item}/meta.env
        rm -rf ${dada2_denoising} && mkdir -p ${dada2_denoising} && cd ${dada2_denoising}
        lnas "$${run}_2.err.rds" ${run_item}/$${run}_2.err.rds
        lnas "$${run}_1.err.rds" ${run_item}/$${run}_1.err.rds
        for s in $$samples; do lnk filtered ${dada2_filtntrim}/*/$${s}_1.filt.fastq.gz ${dada2_filtntrim}/*/$${s}_2.filt.fastq.gz; done
        cat > /tmp/.command.sh <<'NF'
        #!/usr/bin/env Rscript
        suppressPackageStartupMessages(library(dada2))

        errF <- readRDS("@run@_1.err.rds")
        errR <- readRDS("@run@_2.err.rds")

        filtFs <- list.files("./filtered/", pattern = "_1.filt.fastq.gz", full.names = TRUE)
        filtRs <- sub("_1.filt.fastq.gz", "_2.filt.fastq.gz", filtFs)

        #denoising
        sink(file = "@run@.dada.log")
        if ("Auto" == "Auto") {
            # Avoid using memory-inefficient derepFastq() if not necessary
            dadaFs <- dada(filtFs, err = errF, selfConsist = FALSE, priors = character(0), DETECT_SINGLETONS = FALSE, GAPLESS = TRUE, GAP_PENALTY = -8, GREEDY = TRUE, KDIST_CUTOFF = 0.42, MATCH = 5, MAX_CLUST = 0, MAX_CONSIST = 10, MIN_ABUNDANCE = 1, MIN_FOLD = 1, MIN_HAMMING = 1, MISMATCH = -4, OMEGA_A = 1e-40, OMEGA_C = 1e-40, OMEGA_P = 1e-4, PSEUDO_ABUNDANCE = Inf, PSEUDO_PREVALENCE = 2, SSE = 2, USE_KMERS = TRUE, USE_QUALS = TRUE, VECTORIZED_ALIGNMENT = TRUE,BAND_SIZE = 16, HOMOPOLYMER_GAP_PENALTY = NULL,pool = FALSE, multithread = 4)
            dadaRs <- dada(filtRs, err = errR, selfConsist = FALSE, priors = character(0), DETECT_SINGLETONS = FALSE, GAPLESS = TRUE, GAP_PENALTY = -8, GREEDY = TRUE, KDIST_CUTOFF = 0.42, MATCH = 5, MAX_CLUST = 0, MAX_CONSIST = 10, MIN_ABUNDANCE = 1, MIN_FOLD = 1, MIN_HAMMING = 1, MISMATCH = -4, OMEGA_A = 1e-40, OMEGA_C = 1e-40, OMEGA_P = 1e-4, PSEUDO_ABUNDANCE = Inf, PSEUDO_PREVALENCE = 2, SSE = 2, USE_KMERS = TRUE, USE_QUALS = TRUE, VECTORIZED_ALIGNMENT = TRUE,BAND_SIZE = 16, HOMOPOLYMER_GAP_PENALTY = NULL,pool = FALSE, multithread = 4)
        } else {
            derepFs <- derepFastq(filtFs, qualityType="Auto")
            dadaFs <- dada(derepFs, err = errF, selfConsist = FALSE, priors = character(0), DETECT_SINGLETONS = FALSE, GAPLESS = TRUE, GAP_PENALTY = -8, GREEDY = TRUE, KDIST_CUTOFF = 0.42, MATCH = 5, MAX_CLUST = 0, MAX_CONSIST = 10, MIN_ABUNDANCE = 1, MIN_FOLD = 1, MIN_HAMMING = 1, MISMATCH = -4, OMEGA_A = 1e-40, OMEGA_C = 1e-40, OMEGA_P = 1e-4, PSEUDO_ABUNDANCE = Inf, PSEUDO_PREVALENCE = 2, SSE = 2, USE_KMERS = TRUE, USE_QUALS = TRUE, VECTORIZED_ALIGNMENT = TRUE,BAND_SIZE = 16, HOMOPOLYMER_GAP_PENALTY = NULL,pool = FALSE, multithread = 4)
            derepRs <- derepFastq(filtRs, qualityType="Auto")
            dadaRs <- dada(derepRs, err = errR, selfConsist = FALSE, priors = character(0), DETECT_SINGLETONS = FALSE, GAPLESS = TRUE, GAP_PENALTY = -8, GREEDY = TRUE, KDIST_CUTOFF = 0.42, MATCH = 5, MAX_CLUST = 0, MAX_CONSIST = 10, MIN_ABUNDANCE = 1, MIN_FOLD = 1, MIN_HAMMING = 1, MISMATCH = -4, OMEGA_A = 1e-40, OMEGA_C = 1e-40, OMEGA_P = 1e-4, PSEUDO_ABUNDANCE = Inf, PSEUDO_PREVALENCE = 2, SSE = 2, USE_KMERS = TRUE, USE_QUALS = TRUE, VECTORIZED_ALIGNMENT = TRUE,BAND_SIZE = 16, HOMOPOLYMER_GAP_PENALTY = NULL,pool = FALSE, multithread = 4)
        }
        saveRDS(dadaFs, "@run@_1.dada.rds")
        saveRDS(dadaRs, "@run@_2.dada.rds")
        sink(file = NULL)

        # merge
        if ("merge" == "consensus") {
            mergers <- mergePairs(dadaFs, filtFs, dadaRs, filtRs, homo_gap = NULL, endsfree = TRUE, vec = FALSE, propagateCol = character(0), trimOverhang = FALSE, returnRejects = TRUE,justConcatenate = FALSE, match = 1, mismatch = -64, gap = -64, minOverlap = 12, maxMismatch = 0, justConcatenate = FALSE, verbose=TRUE)
            concats <- mergePairs(dadaFs, filtFs, dadaRs, filtRs, homo_gap = NULL, endsfree = TRUE, vec = FALSE, propagateCol = character(0), trimOverhang = FALSE, returnRejects = TRUE,justConcatenate = FALSE, match = 1, mismatch = -64, gap = -64, minOverlap = 12, maxMismatch = 0, justConcatenate = TRUE, verbose=TRUE)

            # in case there is only one sample in the entire run
            if (is.data.frame(mergers)) {
                mergers <- list(sample = mergers)
                concats <- list(sample = concats)
            }

            # define the overlap threshold to decide if concatenation or not
            min_overlap_obs <- lapply(mergers, function(X) {
                mergers_accepted <- X[["accept"]]
                if (sum(mergers_accepted) > 0) {
                    min_overlap_obs <- X[["nmatch"]][mergers_accepted] + X[["nmismatch"]][mergers_accepted]
                    rep(min_overlap_obs, X[["abundance"]][mergers_accepted])
                } else {
                    NA
                }
            })

            min_overlap_obs <- Reduce(c, min_overlap_obs)
            min_overlap_obs <- min_overlap_obs[!is.na(min_overlap_obs)]
            min_overlap_obs <- quantile(min_overlap_obs, 0.001)

            for (x in names(mergers)) {
                to_concat <- !mergers[[x]][["accept"]] & (mergers[[x]][["nmismatch"]] + mergers[[x]][["nmatch"]]) < min_overlap_obs

                if (sum(to_concat) > 0) {
                    mergers[[x]][to_concat, ] <- concats[[x]][to_concat, ]
                    # filter out unaccepted non concatenated sequences
                    mergers[[x]] <- mergers[[x]][mergers[[x]][["accept"]], ]
                }

            }

            # if one sample, need to convert back to df for next steps

            if(length(mergers) == 1) {
                mergers <- mergers[[1]]
            }

        } else {
            mergers <- mergePairs(dadaFs, filtFs, dadaRs, filtRs, homo_gap = NULL, endsfree = TRUE, vec = FALSE, propagateCol = character(0), trimOverhang = FALSE, returnRejects = TRUE,justConcatenate = FALSE, match = 1, mismatch = -64, gap = -64, minOverlap = 12, maxMismatch = 0, verbose=TRUE)
        }

        saveRDS(mergers, "@run@.mergers.rds")

        # make table
        seqtab <- makeSequenceTable(mergers)
        saveRDS(seqtab, "@run@.seqtab.rds")

        write.table('dada	selfConsist = FALSE, priors = character(0), DETECT_SINGLETONS = FALSE, GAPLESS = TRUE, GAP_PENALTY = -8, GREEDY = TRUE, KDIST_CUTOFF = 0.42, MATCH = 5, MAX_CLUST = 0, MAX_CONSIST = 10, MIN_ABUNDANCE = 1, MIN_FOLD = 1, MIN_HAMMING = 1, MISMATCH = -4, OMEGA_A = 1e-40, OMEGA_C = 1e-40, OMEGA_P = 1e-4, PSEUDO_ABUNDANCE = Inf, PSEUDO_PREVALENCE = 2, SSE = 2, USE_KMERS = TRUE, USE_QUALS = TRUE, VECTORIZED_ALIGNMENT = TRUE,BAND_SIZE = 16, HOMOPOLYMER_GAP_PENALTY = NULL,pool = FALSE', file = "dada.args.txt", row.names = FALSE, col.names = FALSE, quote = FALSE, na = '')
        write.table('mergePairs	homo_gap = NULL, endsfree = TRUE, vec = FALSE, propagateCol = character(0), trimOverhang = FALSE, returnRejects = TRUE,justConcatenate = FALSE, match = 1, mismatch = -64, gap = -64, minOverlap = 12, maxMismatch = 0', file = "mergePairs.args.txt", row.names = FALSE, col.names = FALSE, quote = FALSE, na = '')
        writeLines(c("\"NFCORE_AMPLISEQ:AMPLISEQ:DADA2_DENOISING\":", paste0("    R: ", paste0(R.Version()[c("major","minor")], collapse = ".")),paste0("    dada2: ", packageVersion("dada2")) ), "versions.yml")
        NF
        sed -i "s|@run@|$$run|g" /tmp/.command.sh
        Rscript /tmp/.command.sh
        while read -r f; do rm -f "$$f"; done < /tmp/.staged
        rmdir filtered && cp ${run_item}/meta.env .
    target: *target

  - kind: horus_map
    id: dada2_rmchimera
    name: DADA2_RMCHIMERA
    over: {input_id: dada2_denoising, as: run_item}
    chain: true
    max_concurrency: 16
    inputs: [*a_dada2_denoising, *a_nfcore]
    outputs: [*a_dada2_rmchimera]
    resources: {cpus: 4, memory_gb: 6, walltime: "01:00:00"}
    executor: *dada2
    runtime:
      kind: command
      command: |
        set -eu
        export PYTHONNOUSERSITE=1 R_PROFILE_USER=/.Rprofile R_ENVIRON_USER=/.Renviron JULIA_DEPOT_PATH=/usr/local/share/julia
        export PATH="$$PATH:${nfcore}/bin"
        : > /tmp/.staged
        lnas() { d=$$1; shift; if [ $$# -ne 1 ] || [ ! -e "$$1" ]; then echo "stage $$d: need one input, got: $$*" >&2; exit 1; fi; mkdir -p "$$(dirname "$$d")"; ln -s "$$1" "$$d"; echo "$$d" >> /tmp/.staged; }
        lnk() { ld=$$1; shift; for lf in "$$@"; do lnas "$$ld/$${lf##*/}" "$$lf"; done; }
        . ${run_item}/meta.env; set -- $$samples; nsamples=$$#; first=$$1
        rm -rf ${dada2_rmchimera} && mkdir -p ${dada2_rmchimera} && cd ${dada2_rmchimera}
        lnas "$${run}.seqtab.rds" ${run_item}/$${run}.seqtab.rds
        cat > /tmp/.command.sh <<'NF'
        #!/usr/bin/env Rscript
        suppressPackageStartupMessages(library(dada2))

        seqtab = readRDS("@run@.seqtab.rds")

        #remove chimera
        seqtab.nochim <- removeBimeraDenovo(seqtab, method="consensus", minSampleFraction = 0.9, ignoreNNegatives = 1, minFoldParentOverAbundance = 2, minParentAbundance = 8, allowOneOff = FALSE, minOneOffParentDistance = 4, maxShift = 16, multithread=4, verbose=TRUE)
        if ( @nsamples@ == 1 ) { rownames(seqtab.nochim) <- "@first@" }
        saveRDS(seqtab.nochim,"@run@.ASVtable.rds")

        write.table('removeBimeraDenovo	method="consensus", minSampleFraction = 0.9, ignoreNNegatives = 1, minFoldParentOverAbundance = 2, minParentAbundance = 8, allowOneOff = FALSE, minOneOffParentDistance = 4, maxShift = 16', file = "removeBimeraDenovo.args.txt", row.names = FALSE, col.names = FALSE, quote = FALSE, na = '')
        writeLines(c("\"NFCORE_AMPLISEQ:AMPLISEQ:DADA2_RMCHIMERA\":", paste0("    R: ", paste0(R.Version()[c("major","minor")], collapse = ".")),paste0("    dada2: ", packageVersion("dada2")) ), "versions.yml")
        NF
        sed -i "s|@run@|$$run|g" /tmp/.command.sh
        sed -i "s|@nsamples@|$$nsamples|g" /tmp/.command.sh
        sed -i "s|@first@|$$first|g" /tmp/.command.sh
        Rscript /tmp/.command.sh
        while read -r f; do rm -f "$$f"; done < /tmp/.staged
        cp ${run_item}/meta.env .
    target: *target

  - kind: horus_map
    id: dada2_stats
    name: DADA2_STATS
    over: {input_id: dada2_rmchimera, as: run_item}
    chain: true
    zip: [{input_id: dada2_denoising, as: den}]
    max_concurrency: 16
    inputs: [*a_dada2_rmchimera, *a_dada2_denoising, *a_dada2_filtntrim, *a_nfcore]
    outputs: [*a_dada2_stats]
    resources: {cpus: 2, memory_gb: 3, walltime: "01:00:00"}
    executor: *dada2
    runtime:
      kind: command
      command: |
        set -eu
        export PYTHONNOUSERSITE=1 R_PROFILE_USER=/.Rprofile R_ENVIRON_USER=/.Renviron JULIA_DEPOT_PATH=/usr/local/share/julia
        export PATH="$$PATH:${nfcore}/bin"
        : > /tmp/.staged
        lnas() { d=$$1; shift; if [ $$# -ne 1 ] || [ ! -e "$$1" ]; then echo "stage $$d: need one input, got: $$*" >&2; exit 1; fi; mkdir -p "$$(dirname "$$d")"; ln -s "$$1" "$$d"; echo "$$d" >> /tmp/.staged; }
        lnk() { ld=$$1; shift; for lf in "$$@"; do lnas "$$ld/$${lf##*/}" "$$lf"; done; }
        . ${run_item}/meta.env
        rm -rf ${dada2_stats} && mkdir -p ${dada2_stats} && cd ${dada2_stats}
        lnas "$${run}_2.dada.rds" ${den}/$${run}_2.dada.rds
        lnas "$${run}_1.dada.rds" ${den}/$${run}_1.dada.rds
        lnas "$${run}.ASVtable.rds" ${run_item}/$${run}.ASVtable.rds
        lnas "$${run}.mergers.rds" ${den}/$${run}.mergers.rds
        for s in $$samples; do lnk filter_and_trim_files ${dada2_filtntrim}/*/$${s}.filter_stats.tsv; done
        cat > /tmp/.command.sh <<'NF'
        #!/usr/bin/env Rscript
        suppressPackageStartupMessages(library(dada2))

        #combine filter_and_trim files
        for (data in list.files("./filter_and_trim_files", full.names=TRUE)){
            if (!exists("filter_and_trim")){ filter_and_trim <- read.csv(data, header=TRUE, sep="\t") }
            if (exists("filter_and_trim")){
                tempory <-read.csv(data, header=TRUE, sep="\t")
                filter_and_trim <-unique(rbind(filter_and_trim, tempory))
                rm(tempory)
            }
        }
        rownames(filter_and_trim) <- filter_and_trim$$ID
        filter_and_trim["ID"] <- NULL
        #write.table( filter_and_trim, file = "@run@.filter_and_trim.tsv", sep = "\t", row.names = TRUE, quote = FALSE, na = '')

        #read data
        dadaFs = readRDS("@run@_1.dada.rds")
        dadaRs = readRDS("@run@_2.dada.rds")
        mergers = readRDS("@run@.mergers.rds")
        nochim = readRDS("@run@.ASVtable.rds")

        #track reads through pipeline
        getN <- function(x) sum(getUniques(x))
        get_acc <- function(x) sum(x$$abundance[x$$accept])
        # filter_and_trim rownames end in '_1.fastq.gz', DADA2/seqtab rownames in '_1.filt.fastq.gz'; reduce both to the sample id
        normKey_ft <- function(x) sub(pattern = "(.*?)\\..*$$", replacement = "\\1", sub(pattern = "_1.fastq.gz$$", replacement = "", x))
        normKey_nc <- function(x) sub(pattern = ".filt.fastq.gz$$", replacement = "", sub(pattern = "_2.filt.fastq.gz$$", replacement = "", sub(pattern = "_1.filt.fastq.gz$$", replacement = "", x)))
        if ( nrow(filter_and_trim) == 1 ) {
            track <- cbind(filter_and_trim, getN(dadaFs), getN(dadaRs), getN(mergers), get_acc(mergers), rowSums(nochim))
        } else {
            # Merge on the sample key; a positional cbind mislabels counts when one sample name is a prefix of another
            ft_keys <- normKey_ft(rownames(filter_and_trim))
            samples <- normKey_nc(rownames(nochim))   # canonical sample order from the ASV table
            gN  <- function(x) as.numeric(unname(sapply(x, getN)))
            gNa <- function(x) as.numeric(unname(sapply(x, get_acc)))
            track <- data.frame(key = ft_keys, filter_and_trim, check.names = FALSE, stringsAsFactors = FALSE)
            track <- merge(track, data.frame(key = samples,
                    denoisedF      = gN(dadaFs),
                    denoisedR      = gN(dadaRs),
                    denoisedPairs  = gN(mergers),
                    merged         = gNa(mergers),
                    nonchim        = as.numeric(unname(rowSums(nochim))),
                    stringsAsFactors = FALSE),
                by = "key", all = TRUE, sort = FALSE)
            # keep the deterministic filter_and_trim row order
            track <- track[order(match(track$$key, ft_keys)), ]
            rownames(track) <- track$$key
            track$$key <- NULL
        }
        colnames(track) <- c("DADA2_input", "filtered", "denoisedF", "denoisedR", "denoisedPairs", "merged", "nonchim")
        rownames(track) <- sub(pattern = "_1.fastq.gz$$", replacement = "", rownames(track)) #this is when cutadapt is skipped!
        track <- cbind(sample = sub(pattern = "(.*?)\\..*$$", replacement = "\\1", rownames(track)), track)
        write.table( track, file = "@run@.stats.tsv", sep = "\t", row.names = FALSE, quote = FALSE, na = '')

        writeLines(c("\"NFCORE_AMPLISEQ:AMPLISEQ:DADA2_STATS\":", paste0("    R: ", paste0(R.Version()[c("major","minor")], collapse = ".")),paste0("    dada2: ", packageVersion("dada2")) ), "versions.yml")
        NF
        sed -i "s|@run@|$$run|g" /tmp/.command.sh
        Rscript /tmp/.command.sh
