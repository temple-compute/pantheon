        ssu_post          <- 'ssu_post/ASV_table.ssu.tsv'
        len_asv_pre       <- 'len_asv_pre/ASV_table.ssu.tsv'
        len_asv_post      <- 'len_asv_post/ASV_table.len.tsv'
        codons_pre        <- NULL
        codons_post       <- NULL
        len_itsx_pre      <- NULL
        len_itsx_post     <- NULL
        accept_pre        <- 'accept_pre/ASV_post_clustering_filtered.table.tsv'
        accept_post       <- 'accept_post/ASV_table.len.tsv'

        # One winning domain per ASV, by smallest non-NA e-value; the values themselves stay in barrnap's
        # own output. NA covers both "nothing significant" and "barrnap never ran" (see docs/output.md).
        chr_long <- tibble(asv_id = character(), field = character(), value = character())
        if (!is.null(barrnap_summary)) {
            evals <- read_tsv(barrnap_summary, show_col_types = FALSE)
            eval_cols <- setdiff(colnames(evals), c("ASV_ID", "eval_method"))
        } else {
            evals <- tibble()
        }
        # rowwise()/mutate() runs its block once even on zero rows, where c_across() gives a zero-length
        # vector and the names<- assignment fails. An ITS-only run leaves barrnap with zero hits.
        if (nrow(evals) > 0) {
            label <- evals |>
                rowwise() |>
                mutate(barrnap_domain = {
                    vals <- c_across(all_of(eval_cols))
                    names(vals) <- sub("_eval$$", "", eval_cols)
                    vals <- vals[!is.na(vals)]
                    if (length(vals) == 0) NA_character_ else names(vals)[which.min(vals)]
                }) |>
                ungroup() |>
                transmute(asv_id = ASV_ID, field = "barrnap_domain", value = barrnap_domain)
            chr_long <- bind_rows(chr_long, label)
        }

        # Booleans stack in their own long table: sharing one value column with the character data
        # above lets bind_rows() coerce them to 0/1 or strings, and that type reaches the Parquet output.
        lgl_long <- tibble(asv_id = character(), field = character(), value = logical())

        add_bool <- function(long, path, id_col, bool_col, field_name) {
            if (is.null(path)) return(long)
            df <- read_tsv(path, show_col_types = FALSE)
            bind_rows(long, tibble(asv_id = df[[id_col]], field = field_name, value = as.logical(df[[bool_col]])))
        }
        lgl_long <- lgl_long |>
            add_bool(decontam_details, "ID", "contaminant", "decontam_contaminant") |>
            add_bool(notcontam_details, "ID", "not.contaminant", "decontam_not_contaminant")

        # No filter emits a per-ASV boolean, only the table of survivors, so membership is diffed across
        # it. The ID column is taken positionally because its name differs between filters.
        add_filter_pass <- function(long, pre, post, field_name) {
            if (is.null(pre) || is.null(post)) return(long)
            pre_ids  <- read_tsv(pre,  show_col_types = FALSE)[[1]]
            post_ids <- read_tsv(post, show_col_types = FALSE)[[1]]
            bind_rows(long, tibble(asv_id = pre_ids, field = field_name, value = pre_ids %in% post_ids))
        }
        lgl_long <- lgl_long |>
            add_filter_pass(ssu_pre, ssu_post, "passed_ssu_filter") |>
            add_filter_pass(len_asv_pre, len_asv_post, "passed_length_filter_asv") |>
            add_filter_pass(codons_pre, codons_post, "passed_codon_filter") |>
            add_filter_pass(len_itsx_pre, len_itsx_post, "passed_length_filter_itsx") |>
            # Diffed across the whole chain rather than combined from the columns above: an ASV dropped
            # by an early filter is NA, not FALSE, in every later filter's column.
            add_filter_pass(accept_pre, accept_post, "ampliseq_accept")

        wide_chr <- chr_long |> pivot_wider(names_from = field, values_from = value)
        wide_lgl <- lgl_long |> pivot_wider(names_from = field, values_from = value)
        if (nrow(wide_chr) == 0) wide_chr <- tibble(asv_id = character())
        if (nrow(wide_lgl) == 0) wide_lgl <- tibble(asv_id = character())

        annotations <- full_join(wide_chr, wide_lgl, by = "asv_id")
        write_tsv(annotations, "ASV_annotations.tsv")

        writeLines(
            c(
                "\"NFCORE_AMPLISEQ:AMPLISEQ:BUILD_ASV_ANNOTATIONS\":",
                paste0("    R: ", paste0(R.Version()[c("major", "minor")], collapse = ".")),
                paste0("    r-dplyr: ", packageVersion("dplyr"))
            ),
            "versions.yml"
        )
        NF
        Rscript /tmp/.command.sh
        while read -r f; do rm -f "$$f"; done < /tmp/.staged
    target: *target

  - kind: horus_task
    id: summary_table_tax_qiime2
    name: SUMMARY_TABLE_TAXONOMY
    inputs: [*a_build_asv_annotations, *a_nfcore, *a_qiime2_classify]
    outputs: [*a_summary_table_tax_qiime2]
    resources: {cpus: 1, memory_gb: 1, walltime: "01:00:00"}
    executor: *rtables
    runtime:
      kind: command
      command: |
        set -eu
        export PYTHONNOUSERSITE=1 R_PROFILE_USER=/.Rprofile R_ENVIRON_USER=/.Renviron JULIA_DEPOT_PATH=/usr/local/share/julia
        export PATH="$$PATH:${nfcore}/bin"
        : > /tmp/.staged
        lnas() { d=$$1; shift; if [ $$# -ne 1 ] || [ ! -e "$$1" ]; then echo "stage $$d: need one input, got: $$*" >&2; exit 1; fi; mkdir -p "$$(dirname "$$d")"; ln -s "$$1" "$$d"; echo "$$d" >> /tmp/.staged; }
        lnk() { ld=$$1; shift; for lf in "$$@"; do lnas "$$ld/$${lf##*/}" "$$lf"; done; }
        rm -rf ${summary_table_tax_qiime2} && mkdir -p ${summary_table_tax_qiime2} && cd ${summary_table_tax_qiime2}
        lnas "ASV_annotations.tsv" ${build_asv_annotations}/ASV_annotations.tsv
        lnas "taxonomy.tsv" ${qiime2_classify}/taxonomy.tsv
        cat > /tmp/.command.sh <<'NF'
        #!/usr/bin/env Rscript
        suppressPackageStartupMessages({
            library(dplyr)
            library(tidyr)
            library(readr)
            library(purrr)
            library(stringr)
        })

        RANKS <- c("domain", "phylum", "class", "order", "family", "genus", "species")

        tax_raw <- read_tsv("taxonomy.tsv", show_col_types = FALSE)

        if ("QIIME2" == "QIIME2") {
            # QIIME2 gives one "d__X; p__Y; ..." string per ASV rather than named rank columns. Its
            # databases disagree on the top prefix -- SILVA and Greengenes2 write "d__", Greengenes 85
            # "k__" -- while all of them hold a domain there, so both land in "domain".
            prefix_to_rank <- c(d = "domain", k = "domain", p = "phylum", c = "class", o = "order", f = "family", g = "genus", s = "species")
            parse_taxon <- function(taxon) {
                out <- setNames(rep(NA_character_, length(RANKS)), RANKS)
                if (!is.na(taxon)) {
                    for (part in strsplit(taxon, "; ", fixed = TRUE)[[1]]) {
                        m <- regmatches(part, regexec("^([a-z])__(.*)$$", trimws(part)))[[1]]
                        if (length(m) == 3 && m[2] %in% names(prefix_to_rank)) {
                            val <- trimws(m[3])
                            if (nzchar(val)) out[[prefix_to_rank[[m[2]]]]] <- val
                        }
                    }
                }
                tibble::as_tibble(as.list(out))
            }
            parsed <- tax_raw[["Taxon"]] |> map(parse_taxon) |> list_rbind()
            tax <- bind_cols(tibble(asv_id = tax_raw[["Feature ID"]], confidence = tax_raw[["Confidence"]]), parsed)
        } else if ("QIIME2" == "PPLACE") {
            # FORMAT_PPLACETAX's string carries no rank names, so ranks are assigned by position.
            parsed <- tax_raw[["taxonomy"]] |>
                strsplit(";") |>
                map(function(v) {
                    v <- trimws(v)
                    length(v) <- length(RANKS)
                    tibble::as_tibble(as.list(setNames(v, RANKS)))
                }) |>
                list_rbind()
            tax <- bind_cols(tibble(asv_id = tax_raw[["ASV_ID"]], confidence = NA_real_), parsed)
        } else {
            # DADA2, SINTAX and VSEARCH-LCA already name their rank columns, PR2's non-standard names
            # included. The sequence and per-rank confidences are dropped: the first is recoverable from
            # asv_id, the second is DADA2-only and so not comparable across classifiers.
            tax <- tax_raw |>
                rename(asv_id = ASV_ID) |>
                select(-any_of("sequence")) |>
                select(-matches("_confidence$$")) |>
                rename_with(str_to_lower)

            # In a consolidated table (--consolidate_taxonomies), "classifier" and "database" are those
            # that won a given ASV, not the table's own.
            tax <- tax |> rename(any_of(c(source_classifier = "classifier", source_database = "database")))

            # DADA2_ADDSPECIES puts its exact matches in "Species_exact" and leaves "Species" out unless
            # assignTaxonomy's taxlevels had one. Many databases reach species through addSpecies alone,
            # so the two columns are folded into one "species".
            if (!"species" %in% colnames(tax) && "species_exact" %in% colnames(tax)) {
                tax <- tax |> rename(species = species_exact)
            } else if ("species" %in% colnames(tax) && "species_exact" %in% colnames(tax)) {
                tax <- tax |> mutate(species = coalesce(species, species_exact)) |> select(-species_exact)
            } else if (!"species" %in% colnames(tax)) {
                tax <- tax |> mutate(species = NA_character_)
            }
        }

        annotations <- read_tsv("ASV_annotations.tsv", show_col_types = FALSE)
        out <- left_join(tax, annotations, by = "asv_id")

        write_tsv(out, "ampliseq.taxonomy.QIIME2.greengenes85.tsv.gz")

        writeLines(
            c(
                "\"NFCORE_AMPLISEQ:AMPLISEQ:SUMMARY_TABLE_TAXONOMY\":",
                paste0("    R: ", paste0(R.Version()[c("major", "minor")], collapse = ".")),
                paste0("    r-dplyr: ", packageVersion("dplyr"))
            ),
            "versions.yml"
        )
        NF
        Rscript /tmp/.command.sh
        while read -r f; do rm -f "$$f"; done < /tmp/.staged
    target: *target

