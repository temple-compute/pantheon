  - kind: horus_task
    id: filter_samples
    name: FILTER_SAMPLES
    inputs: [*a_filter_len_asv, *a_nfcore, *a_reference]
    outputs: [*a_filter_samples]
    resources: {cpus: 1, memory_gb: 1, walltime: "01:00:00"}
    executor: *rbase
    runtime:
      kind: command
      command: |
        set -eu
        export PYTHONNOUSERSITE=1 R_PROFILE_USER=/.Rprofile R_ENVIRON_USER=/.Renviron JULIA_DEPOT_PATH=/usr/local/share/julia
        export PATH="$$PATH:${nfcore}/bin"
        : > /tmp/.staged
        lnas() { d=$$1; shift; if [ $$# -ne 1 ] || [ ! -e "$$1" ]; then echo "stage $$d: need one input, got: $$*" >&2; exit 1; fi; mkdir -p "$$(dirname "$$d")"; ln -s "$$1" "$$d"; echo "$$d" >> /tmp/.staged; }
        lnk() { ld=$$1; shift; for lf in "$$@"; do lnas "$$ld/$${lf##*/}" "$$lf"; done; }
        rm -rf ${filter_samples} && mkdir -p ${filter_samples} && cd ${filter_samples}
        lnas "input/Metadata.tsv" ${reference}/Metadata.tsv
        lnas "input/ASV_table.len.tsv" ${filter_len_asv}/ASV_table.len.tsv
        cat > /tmp/.command.sh <<'NF'
        #!/usr/bin/env Rscript

        # first column in meta has sample id
        meta <- read.table( "input/Metadata.tsv", header = TRUE, sep = "\t", stringsAsFactors = FALSE)
        # column names are sample ids, but first column is asv id
        abund <- read.table( "input/ASV_table.len.tsv", header = TRUE, sep = "\t", stringsAsFactors = FALSE)

        # samples that arent in both files are dropped
        meta_filtered <- meta[meta[,1] %in% colnames(abund)[2:length(colnames(abund))],]
        abund_filtered <- abund[,colnames(abund) %in% c( colnames(abund)[1], meta[,1] ) ]

        # write filtered data
        write.table(meta_filtered, file = "metadata.tsv", row.names = FALSE, col.names = TRUE, quote = FALSE, na = '', sep = "	")
        write.table(abund_filtered, file = "table.tsv", row.names = FALSE, col.names = TRUE, quote = FALSE, na = '', sep = "	")

        # error in case all samples were removed
        if ( nrow(meta_filtered) == 0 ) {
            stop("All samples were removed. That means no overlap between the metadata sample IDs and the abundance table sample IDs was found. Make sure that sample IDs match.")
        }

        # this is in case some samples were lost during preprocessing, i.e. samples in metadata but not in abundance table
        if ( nrow(meta) > nrow(meta_filtered) ) {
            log_message = paste("The metadata file rows were reduced from", nrow(meta), "to", nrow(meta_filtered),", because some samples were missing in the abundance table")
            write.table(log_message, file = paste0(log_message,".log"), row.names = FALSE, col.names = FALSE, quote = FALSE)
        }
        # this is in case some samples were not in metadata, i.e. only a subset of samples is entering downstream analysis
        if ( ncol(abund) > ncol(abund_filtered) ) {
            log_message = paste("Samples in the abundance file were reduced from", ncol(abund)-1, "to", ncol(abund_filtered)-1,", because the metadata did not contain all samples in the abundance table")
            write.table(log_message, file = paste0(log_message,".log"), row.names = FALSE, col.names = FALSE, quote = FALSE)
        }

        # versions
        writeLines(c("\"NFCORE_AMPLISEQ:AMPLISEQ:FILTER_SAMPLES\":", paste0("    R: ", paste0(R.Version()[c("major","minor")], collapse = ".")) ), "versions.yml")
        NF
        Rscript /tmp/.command.sh
        while read -r f; do rm -f "$$f"; done < /tmp/.staged
        rmdir input
    target: *target

  - kind: horus_task
    id: metadata_all
    name: METADATA_ALL
    inputs: [*a_filter_samples, *a_nfcore]
    outputs: [*a_metadata_all]
    resources: {cpus: 1, memory_gb: 1, walltime: "01:00:00"}
    executor: *dada2
