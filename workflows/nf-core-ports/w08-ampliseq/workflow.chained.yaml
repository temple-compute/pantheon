        lnk() { ld=$$1; shift; for lf in "$$@"; do lnas "$$ld/$${lf##*/}" "$$lf"; done; }
        rm -rf ${filter_seq_abund} && mkdir -p ${filter_seq_abund} && cd ${filter_seq_abund}
        lnas "ASV_post_clustering_filtered.fna" ${filter_clusters}/ASV_post_clustering_filtered.fna
        lnas "decontaminated.tsv" ${decontam}/decontaminated.tsv
        cat > /tmp/.command.sh <<'NF'
        #!/usr/bin/env Rscript

            #load packages
            suppressPackageStartupMessages(library(Biostrings))

            #read abundance file, first column is ASV_ID
            table <- read.table(file = 'decontaminated.tsv', sep = '	', comment.char = '', header=TRUE)
            colnames(table)[1] <- "ASV_ID"

            #read fasta file of ASV sequences
            seq <- readDNAStringSet("ASV_post_clustering_filtered.fna")
            seq <- data.frame(ID=names(seq), sequence=paste(seq))

            # filter
            filtered_table = table[table$$ASV_ID %in% seq$$ID,]
            filtered_seq = seq[seq$$ID %in% table$$ASV_ID,]

            # sort
            filtered_table <- filtered_table[order(filtered_table$$ASV_ID),]
            filtered_seq <- filtered_seq[order(filtered_seq$$ID),]

            #write
            write.table(filtered_table, file = "filtered_abundances.tsv", row.names=FALSE, sep="	", col.names = TRUE, quote = FALSE, na = '')
            write.table(data.frame(s = sprintf(">%s
        %s", filtered_seq$$ID, filtered_seq$$sequence)), file = 'filtered_sequences.fasta', col.names = FALSE, row.names = FALSE, quote = FALSE, na = '')

            # log retained features
            stats <- data.frame(
                file = list("decontaminated.tsv","ASV_post_clustering_filtered.fna"),
                input = list( nrow(table), nrow(seq) ),
                output = list( nrow(filtered_table), nrow(filtered_seq) ) )
            write.table(stats, file = "stats_features.tsv", row.names=FALSE, sep="	")

            # log retained counts
            stats <- as.data.frame( t( rbind( colSums(table[-1]), colSums(filtered_table[-1]) ) ) )
            stats$$ID <- rownames(stats)
            colnames(stats) <- c("input","output", "sample")
            write.table(stats, file = "stats_counts.tsv", row.names=FALSE, sep="	")

            writeLines(c("\"NFCORE_AMPLISEQ:AMPLISEQ:FILTER_SEQUENCES_ABUNDANCES\":", paste0("    R: ", paste0(R.Version()[c("major","minor")], collapse = ".")),paste0("    Biostrings: ", packageVersion("Biostrings")) ), "versions.yml")
        NF
        Rscript /tmp/.command.sh
        while read -r f; do rm -f "$$f"; done < /tmp/.staged
    target: *target

  - kind: horus_task
    id: barrnap
    name: BARRNAP
    inputs: [*a_filter_seq_abund, *a_nfcore]
    outputs: [*a_barrnap]
    resources: {cpus: 2, memory_gb: 3, walltime: "01:00:00"}
    executor: *barrnap
    runtime:
      kind: command
      command: |
        set -eu
        export PYTHONNOUSERSITE=1 R_PROFILE_USER=/.Rprofile R_ENVIRON_USER=/.Renviron JULIA_DEPOT_PATH=/usr/local/share/julia
        export PATH="$$PATH:${nfcore}/bin"
        : > /tmp/.staged
        lnas() { d=$$1; shift; if [ $$# -ne 1 ] || [ ! -e "$$1" ]; then echo "stage $$d: need one input, got: $$*" >&2; exit 1; fi; mkdir -p "$$(dirname "$$d")"; ln -s "$$1" "$$d"; echo "$$d" >> /tmp/.staged; }
        lnk() { ld=$$1; shift; for lf in "$$@"; do lnas "$$ld/$${lf##*/}" "$$lf"; done; }
        rm -rf ${barrnap} && mkdir -p ${barrnap} && cd ${barrnap}
        lnas "filtered_sequences.fasta" ${filter_seq_abund}/filtered_sequences.fasta
        cat > /tmp/.command.sh <<'NF'
        #!/usr/bin/env bash -C -e -u -o pipefail
        IFS=',' read -r -a kingdom <<< "bac,arc,mito,euk"

        for KINGDOM in "$${kingdom[@]}"
        do
            barrnap \
                --threads 2 \
                --quiet --reject 0.1 \
                --kingdom $$KINGDOM \
                --outseq Filtered.$${KINGDOM}.fasta \
                < filtered_sequences.fasta \
                > rrna.$${KINGDOM}.gff

            #this fails when processing an empty file, so it requires a workaround!
            if [ -s Filtered.$${KINGDOM}.fasta ]; then
                grep -h '>' Filtered.$${KINGDOM}.fasta | sed 's/^>//' | sed 's/:\+/\t/g' | awk '{print $$2}' | sort -u >$${KINGDOM}.matches.txt
            else
                touch $${KINGDOM}.matches.txt
            fi
        done

        cat <<-END_VERSIONS > versions.yml
        "NFCORE_AMPLISEQ:AMPLISEQ:BARRNAP":
            barrnap: $$(echo $$(barrnap --version 2>&1) | sed "s/^.*barrnap //g")
        END_VERSIONS
        NF
        bash -C -e -u -o pipefail /tmp/.command.sh
        while read -r f; do rm -f "$$f"; done < /tmp/.staged
    target: *target

