  - kind: horus_task
    id: dada2_taxonomy
    name: DADA2_TAXONOMY
    inputs: [*a_cutadapt_taxonomy, *a_filter_len_asv, *a_nfcore]
    outputs: [*a_dada2_taxonomy]
    resources: {cpus: 4, memory_gb: 15, walltime: "01:00:00"}
    executor: *dada2
    runtime:
      kind: command
      command: |
        set -eu
        export PYTHONNOUSERSITE=1 R_PROFILE_USER=/.Rprofile R_ENVIRON_USER=/.Renviron JULIA_DEPOT_PATH=/usr/local/share/julia
        export PATH="$$PATH:${nfcore}/bin"
        : > /tmp/.staged
        lnas() { d=$$1; shift; if [ $$# -ne 1 ] || [ ! -e "$$1" ]; then echo "stage $$d: need one input, got: $$*" >&2; exit 1; fi; mkdir -p "$$(dirname "$$d")"; ln -s "$$1" "$$d"; echo "$$d" >> /tmp/.staged; }
        lnk() { ld=$$1; shift; for lf in "$$@"; do lnas "$$ld/$${lf##*/}" "$$lf"; done; }
        rm -rf ${dada2_taxonomy} && mkdir -p ${dada2_taxonomy} && cd ${dada2_taxonomy}
        lnas "assignTaxonomy_gtdb_R07-RS207.trim.fasta.gz" ${cutadapt_taxonomy}/assignTaxonomy_gtdb_R07-RS207.trim.fasta.gz
        [ "$$(grep -c "^>" ${filter_len_asv}/ASV_seqs.len.fasta)" -le 10000 ] || { echo "more than 10000 ASVs: chunking not ported" >&2; exit 1; }
        cp ${filter_len_asv}/ASV_seqs.len.fasta ASV_seqs.len.1.fasta
        cat > /tmp/.command.sh <<'NF'
        #!/usr/bin/env Rscript
            suppressPackageStartupMessages(library(dada2))
            set.seed(100) # Initialize random number generator for reproducibility

            taxlevels <- c("Domain","Phylum","Class","Order","Family","Genus","Species")

            seq <- getSequences("ASV_seqs.len.1.fasta", collapse = TRUE, silence = FALSE)
            taxa <- assignTaxonomy(seq, "assignTaxonomy_gtdb_R07-RS207.trim.fasta.gz", taxLevels = taxlevels, minBoot = 50,tryRC = FALSE, multithread = 4, verbose=TRUE, outputBootstraps = TRUE)

            # (1) Make a data frame, add ASV_ID from seq
            tx <- data.frame(ASV_ID = names(seq), taxa, sequence = row.names(taxa$$tax), row.names = names(seq))

            # (2) Set confidence to the bootstrap for the most specific taxon, and expose
            # the per-rank bootstrap too (as a fractional confidence, one column per rank)
            # extract columns with taxonomic values
            tax <- tx[ , grepl( "tax." , names( tx ) ) ]
            # find first occurrence of NA
            res <- max.col(is.na(tax), ties = "first")
            # correct if no NA is present in column to NA
            if(any(res == 1)) is.na(res) <- (res == 1) & !is.na(tax[[1]])
            # find index of last entry before NA, which is the bootstrap value
            res <- res-1
            # if NA choose last entry
            res[is.na(res)] <- ncol(tax)
            # extract bootstrap values (0-100) and expose them per rank as fractional confidence (0-1)
            boot <- tx[ , grepl( "boot." , names( tx ) ) ]
            rank_confidence <- boot / 100
            colnames(rank_confidence) <- paste0(tolower(sub("boot.", "", colnames(boot))), "_confidence")
            tx <- cbind(tx, rank_confidence)
            boot$$last_tax <- res
            valid_boot <- apply(boot,1,function(x) x[x[length(x)]][1]/100 )
            # replace missing bootstrap values (NA) with 0
            valid_boot[is.na(valid_boot)] <- 0
            # add bootstrap values to column confidence
            tx$$confidence <- valid_boot

            # (3) Reorder columns before writing to file
            expected_order <- c("ASV_ID",paste0("tax.",taxlevels),"confidence",colnames(rank_confidence),"sequence")
            expected_order <- intersect(expected_order,colnames(tx))
            taxa_export <- subset(tx, select = expected_order)
            colnames(taxa_export) <- sub("tax.", "", colnames(taxa_export))
            rownames(taxa_export) <- names(seq)

            write.table(taxa_export, file = "ASV_seqs.len.1.ASV_tax.gtdb_R07-RS207.tsv", sep = "\t", row.names = FALSE, col.names = TRUE, quote = FALSE, na = '')

            # Save a version with rownames for addSpecies. Keep this a matrix: ASVs can share a sequence
            # (e.g. after ITS trimming), and a data.frame would rewrite the duplicate row name, which addSpecies() rejects as non-ACGT.
            taxa_export <- cbind( ASV_ID = tx$$ASV_ID, taxa$$tax, confidence = tx$$confidence, as.matrix(rank_confidence))
            saveRDS(taxa_export, "ASV_seqs.len.1.ASV_tax.gtdb_R07-RS207.rds")

            write.table('assignTaxonomy	minBoot = 50,tryRC = FALSE
        taxlevels	c("Domain","Phylum","Class","Order","Family","Genus","Species")
        seed	100', file = "assignTaxonomy.ASV_tax.gtdb_R07-RS207.args.txt", row.names = FALSE, col.names = FALSE, quote = FALSE, na = '')
            writeLines(c("\"NFCORE_AMPLISEQ:AMPLISEQ:DADA2_TAXONOMY_WF:DADA2_TAXONOMY\":", paste0("    R: ", paste0(R.Version()[c("major","minor")], collapse = ".")),paste0("    dada2: ", packageVersion("dada2")) ), "versions.yml")
        NF
        Rscript /tmp/.command.sh
        while read -r f; do rm -f "$$f"; done < /tmp/.staged
        cp ASV_seqs.len.1.ASV_tax.gtdb_R07-RS207.tsv ASV_tax.gtdb_R07-RS207.tsv  # collectFile of the chunks
    target: *target

  - kind: horus_task
    id: dada2_addspecies
    name: DADA2_ADDSPECIES
    inputs: [*a_dada2_taxonomy, *a_format_taxonomy, *a_nfcore]
    outputs: [*a_dada2_addspecies]
    resources: {cpus: 1, memory_gb: 15, walltime: "01:00:00"}
    executor: *dada2
    runtime:
      kind: command
      command: |
        set -eu
        export PYTHONNOUSERSITE=1 R_PROFILE_USER=/.Rprofile R_ENVIRON_USER=/.Renviron JULIA_DEPOT_PATH=/usr/local/share/julia
        export PATH="$$PATH:${nfcore}/bin"
        : > /tmp/.staged
        lnas() { d=$$1; shift; if [ $$# -ne 1 ] || [ ! -e "$$1" ]; then echo "stage $$d: need one input, got: $$*" >&2; exit 1; fi; mkdir -p "$$(dirname "$$d")"; ln -s "$$1" "$$d"; echo "$$d" >> /tmp/.staged; }
        lnk() { ld=$$1; shift; for lf in "$$@"; do lnas "$$ld/$${lf##*/}" "$$lf"; done; }
        rm -rf ${dada2_addspecies} && mkdir -p ${dada2_addspecies} && cd ${dada2_addspecies}
        lnas "addSpecies.fna" ${format_taxonomy}/addSpecies.fna
        lnas "ASV_seqs.len.1.ASV_tax.gtdb_R07-RS207.rds" ${dada2_taxonomy}/ASV_seqs.len.1.ASV_tax.gtdb_R07-RS207.rds
        cat > /tmp/.command.sh <<'NF'
        #!/usr/bin/env Rscript
            suppressPackageStartupMessages(library(dada2))
            set.seed(100) # Initialize random number generator for reproducibility

            #add "Species" if not already in taxlevels
            taxlevels <- c("Domain","Phylum","Class","Order","Family","Genus","Species")
            # per-rank confidence columns, derived from the *original* assignTaxonomy taxlevels,
            # before "Species" is force-appended below for the addSpecies output columns
            rank_confidence_cols_all <- paste0(tolower(taxlevels), "_confidence")
            if ( !"Species" %in% taxlevels ) { taxlevels <- c(taxlevels,"Species") }

            taxtable <- readRDS("ASV_seqs.len.1.ASV_tax.gtdb_R07-RS207.rds")
            rank_confidence_cols <- intersect(rank_confidence_cols_all, colnames(taxtable))

            #remove Species annotation from assignTaxonomy
            taxa_nospecies <- taxtable[,!colnames(taxtable) %in% 'Species']

            tx <- addSpecies(taxa_nospecies, "addSpecies.fna", n = 1e5,,tryRC = FALSE, verbose=TRUE)

            # Create a table with specified column order
            tmp <- data.frame(row.names(tx)) # To separate ASV_ID from sequence
            expected_order <- c("ASV_ID",taxlevels,"confidence",rank_confidence_cols)
            taxa <- as.data.frame( subset(tx, select = expected_order) )
            taxa$$sequence <- tmp[,1]
            row.names(taxa) <- row.names(tmp)

            #rename Species annotation to Species_exact
            colnames(taxa)[which(names(taxa) == "Species")] <- "Species_exact"

            #add Species annotation from assignTaxonomy again, after "Genus" column
            if ( "Species" %in% colnames(taxtable) ) {
                taxtable <- data.frame(taxtable)
                taxa_export <- data.frame(append(taxa, list(Species=taxtable$$Species), after=match("Genus", names(taxa))))
            } else {
                taxa_export <- taxa
            }

            write.table(taxa_export, file = "ASV_seqs.len.1.ASV_tax.gtdb_R07-RS207.species.tsv", sep = "\t", row.names = FALSE, col.names = TRUE, quote = FALSE, na = '')

            write.table('addSpecies	n = 1e5,,tryRC = FALSE
        taxlevels	c("Domain","Phylum","Class","Order","Family","Genus","Species")
        seed	100', file = "addSpecies_gtdb_R07-RS207.args.txt", row.names = FALSE, col.names = FALSE, quote = FALSE, na = '')
            writeLines(c("\"NFCORE_AMPLISEQ:AMPLISEQ:DADA2_TAXONOMY_WF:DADA2_ADDSPECIES\":", paste0("    R: ", paste0(R.Version()[c("major","minor")], collapse = ".")),paste0("    dada2: ", packageVersion("dada2")) ), "versions.yml")
        NF
        Rscript /tmp/.command.sh
        while read -r f; do rm -f "$$f"; done < /tmp/.staged
        cp ASV_seqs.len.1.ASV_tax.gtdb_R07-RS207.species.tsv ASV_tax_species.gtdb_R07-RS207.tsv  # collectFile of the chunks
    target: *target

