kind: horus_workflow
name: nf-core ampliseq chained

# Chained variant of workflow.yaml (gen_workflow.py --chained): the same
# tasks and commands, but maps over the same items in sequence (per sample:
# cutadapt, dada2_filtntrim; per run: dada2_err, dada2_denoising,
# dada2_rmchimera, dada2_stats; per ANCOM column: filtersamples_ancom,
# ancombc_asv, ancombc2_asv) set `chain: true`, so each item starts as soon
# as its own upstream slot is done, as Nextflow channels do. Needs
# horus-runtime >= 0.9.0.

# Native port of nf-core/ampliseq 3.1.0, the route `-profile test,docker`
# runs: Cutadapt, DADA2 (quality profiles, automatic truncation, filtering,
# error models, denoising, chimera removal), VSEARCH clustering, decontam,
# Barrnap SSU and length filters, DADA2 (GTDB R07-RS207) and QIIME2
# (Greengenes 85%) taxonomy, QIIME2 filtering, barplots, abundance tables,
# diversity, ANCOM-BC and ANCOM-BC2, phyloseq and TreeSummarizedExperiment
# objects, MultiQC and the summary report.
#
# Generated by scripts/gen_workflow.py from the harvested Nextflow run: each
# task runs the process's rendered .command.sh verbatim (ext.args and the
# test profile parameters as rendered), in the same image, with the same
# cpus/memory (the test profile caps processes at 4 cpus / 15 GB). Inputs
# are linked under the names Nextflow staged them as, the script runs with
# the pipeline's process.shell (bash -C -e -u -o pipefail) or Rscript from
# /tmp/.command.sh, and the links are removed again. Per-sample, per-run,
# per-direction and per-metadata-column steps are horus_map stages; their
# slot values are @NAME@ placeholders filled in from the slot's meta file.
#
# capacity: memory-based admission like Nextflow's local executor. The key
# is the target's location_id (local://<hostname>); set it to the host that
# runs the tasks, or the gate does not apply.

capacity:
  local://ubuntu-awow:
    cpus: 16
    memory_gb: 31
max_concurrency: 16

_target: &target
  kind: local

# Run on a remote node instead: point every task at this anchor.
# _target: &target
#   kind: ssh
#   host: bench-node.example.org
#   username: ubuntu
#   working_directory: /home/ubuntu/horus

# Containers (.command.run docker lines); `user: host` runs them as the
# calling user, as nf-core's `-u $(id -u):$(id -g)` does.
_img:
  barrnap: &barrnap {kind: docker, user: host, image: "quay.io/biocontainers/barrnap:0.9--hdfd78af_4"}
  biostrings: &biostrings {kind: docker, user: host, image: "quay.io/biocontainers/bioconductor-biostrings:2.58.0--r40h037d062_0"}
  coreutils: &coreutils {kind: docker, user: host, image: "community.wave.seqera.io/library/bash_coreutils_findutils_gawk_pruned:63fbf75c749fd019"}
  cutadapt: &cutadapt {kind: docker, user: host, image: "quay.io/biocontainers/cutadapt:5.2--py311haab0aaa_0"}
  dada2: &dada2 {kind: docker, user: host, image: "community.wave.seqera.io/library/bioconductor-dada2_r-base_r-digest_tbb:38acac09bac46f36"}
  decontam: &decontam {kind: docker, user: host, image: "community.wave.seqera.io/library/bioconductor-decontam_r-base:b0f82fb5ac5f1dc2"}
  duckdb: &duckdb {kind: docker, user: host, image: "community.wave.seqera.io/library/duckdb-cli:1.5.5--9c6d18d9f687a45d"}
  fastqc: &fastqc {kind: docker, user: host, image: "quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0"}
  multiqc: &multiqc {kind: docker, user: host, image: "community.wave.seqera.io/library/multiqc:1.35--c17fb751507e9dfc"}
  pandas: &pandas {kind: docker, user: host, image: "quay.io/biocontainers/pandas:1.1.5"}
  phyloseq: &phyloseq {kind: docker, user: host, image: "quay.io/biocontainers/bioconductor-phyloseq:1.50.0--r44hdfd78af_0"}
  python38: &python38 {kind: docker, user: host, image: "quay.io/biocontainers/python:3.8.3"}
  python39: &python39 {kind: docker, user: host, image: "quay.io/biocontainers/python:3.9"}
  qiime2: &qiime2 {kind: docker, user: host, image: "quay.io/qiime2/qiime2:2026.4"}
  rbase: &rbase {kind: docker, user: host, image: "quay.io/biocontainers/r-base:4.2.1"}
  rmarkdown: &rmarkdown {kind: docker, user: host, image: "quay.io/biocontainers/mulled-v2-b2ec1fea5791d428eebb8c8ea7409c350d31dada:a447f6b7a6afde38352b24c30ae9cd6e39df95c4-1"}
  rtables: &rtables {kind: docker, user: host, image: "community.wave.seqera.io/library/r-base_r-data.table_r-dplyr_r-dtplyr_pruned:a6608bc81b0e6546"}
  tse: &tse {kind: docker, user: host, image: "quay.io/biocontainers/bioconductor-treesummarizedexperiment:2.10.0--r43hdfd78af_0"}
  ubuntu: &ubuntu {kind: docker, user: host, image: "quay.io/nf-core/ubuntu:20.04"}
