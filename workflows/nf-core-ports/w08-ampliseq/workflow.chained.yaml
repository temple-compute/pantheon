            -i exported/feature-table.biom \
            -o "lvl@level@-@formula@.feature-table.tsv" \
            --to-tsv

        if [ $$(grep -v '^#' -c "lvl@level@-@formula@.feature-table.tsv") -lt 2 ]; then
            mkdir differentials
            echo @level@ > differentials/"WARNING Summing your data at taxonomic level @level@ produced less than two rows (taxa), ANCOMBC2 can't proceed -- did you specify a bad reference taxonomy?".txt
            mkdir visualizations
            echo @level@ > visualizations/"WARNING Summing your data at taxonomic level @level@ produced less than two rows (taxa), ANCOMBC2 can't proceed -- did you specify a bad reference taxonomy?".txt
        else
            qiime composition ancombc2 \
                --i-table "lvl@level@-@formula@.qza" \
                --m-metadata-file "metadata.tsv" \
                --p-reference-levels treatment1::b --p-p-adjust-method "holm" --p-prevalence-cutoff 0.1 --p-alpha 0.05 \
                --p-fixed-effects-formula '@formula@' \
                --o-ancombc2-output "lvl@level@-@formula@.differentials.qza" \
                --p-num-processes 4  \
                --verbose
            qiime tools export \
                --input-path "lvl@level@-@formula@.differentials.qza" \
                --output-path "Category-@formula@-level-@level@/differentials"

            # Generate tabular view of ANCOMBC2 output
            qiime composition tabulate \
                --i-data "lvl@level@-@formula@.differentials.qza" \
                --o-visualization "lvl@level@-@formula@.differentials.qzv"
            qiime tools export \
                --input-path "lvl@level@-@formula@.differentials.qzv" \
                --output-path "Category-@formula@-level-@level@/differentials"

            # Generate bar plot views of ANCOMBC2 output
            qiime composition ancombc2-visualizer \
                --i-data "lvl@level@-@formula@.differentials.qza" \
                --o-visualization "lvl@level@-@formula@.visualizer.qzv"
            # 'qiime tools export' does not produce a valid html
            mv "lvl@level@-@formula@.visualizer.qzv" "Category-@formula@-level-@level@/"

            # Generate volcano plot
            ancombc_volcanoplot.r \
                "Category-@formula@-level-@level@/differentials/lfc.jsonl" \
                "Category-@formula@-level-@level@/differentials/q.jsonl" \
                0.05 1 0 \
                "Category-@formula@-level-@level@/differentials/p.jsonl" \
                "Category-@formula@-level-@level@/differentials/se.jsonl" \
                "Category-@formula@-level-@level@/differentials/passed_ss.jsonl" \
                "lvl@level@-"
            mv *.volcano_plot.* "Category-@formula@-level-@level@/"
        fi

        cat <<-END_VERSIONS > versions.yml
        "NFCORE_AMPLISEQ:AMPLISEQ:QIIME2_ANCOM:ANCOMBC2_FORMULA_TAX":
            qiime2: $$( qiime --version | sed '1!d;s/.* //' )
        END_VERSIONS
        NF
        sed -i "s|@formula@|$$formula|g" /tmp/.command.sh
        sed -i "s|@level@|$$level|g" /tmp/.command.sh
        bash -C -e -u -o pipefail /tmp/.command.sh
        while read -r f; do rm -f "$$f"; done < /tmp/.staged
    target: *target

  - kind: horus_task
    id: tse_qiime2
    name: TREESUMMARIZEDEXPERIMENT
    inputs: [*a_filter_samples, *a_nfcore, *a_phyloseq_inasv, *a_phyloseq_intax_qiime2, *a_qiime2_tree]
    outputs: [*a_tse_qiime2]
    resources: {cpus: 2, memory_gb: 3, walltime: "01:00:00"}
    executor: *tse
    runtime:
      kind: command
      command: |
        set -eu
        export PYTHONNOUSERSITE=1 R_PROFILE_USER=/.Rprofile R_ENVIRON_USER=/.Renviron JULIA_DEPOT_PATH=/usr/local/share/julia
        export PATH="$$PATH:${nfcore}/bin"
        : > /tmp/.staged
        lnas() { d=$$1; shift; if [ $$# -ne 1 ] || [ ! -e "$$1" ]; then echo "stage $$d: need one input, got: $$*" >&2; exit 1; fi; mkdir -p "$$(dirname "$$d")"; ln -s "$$1" "$$d"; echo "$$d" >> /tmp/.staged; }
        lnk() { ld=$$1; shift; for lf in "$$@"; do lnas "$$ld/$${lf##*/}" "$$lf"; done; }
        rm -rf ${tse_qiime2} && mkdir -p ${tse_qiime2} && cd ${tse_qiime2}
        lnas "reformat_filtered-table.tsv" ${phyloseq_inasv}/reformat_filtered-table.tsv
        lnas "metadata.tsv" ${filter_samples}/metadata.tsv
        lnas "tree.nwk" ${qiime2_tree}/tree.nwk
        lnas "reformat_taxonomy.tsv" ${phyloseq_intax_qiime2}/reformat_taxonomy.tsv
        cat > /tmp/.command.sh <<'NF'
        #!/usr/bin/env Rscript

        suppressPackageStartupMessages(library(TreeSummarizedExperiment))

        # Read otu table. It must be in a SimpleList as a matrix where rows
        # represent taxa and columns samples.
        otu_mat  <- read.table("reformat_filtered-table.tsv", sep="\t", header=TRUE, row.names=1)
        otu_mat <- as.matrix(otu_mat)
        storage.mode(otu_mat) <- "integer"
        assays <- SimpleList(counts = otu_mat)
        # Read taxonomy table. Correct format for it is DataFrame.
        taxonomy_table  <- read.table("reformat_taxonomy.tsv", sep="\t", header=TRUE, row.names=1, comment.char = "")
        # per-rank confidences and the source classifier and database are not ranks
        taxonomy_table  <- taxonomy_table[, !grepl("_confidence$$", colnames(taxonomy_table)) & !colnames(taxonomy_table) %in% c("classifier", "database"), drop=FALSE]
        taxonomy_table <- DataFrame(taxonomy_table)

        # Match rownames between taxonomy table and abundance matrix.
        taxonomy_table <- taxonomy_table[match(rownames(otu_mat), rownames(taxonomy_table)), ]

        # Create TreeSE object.
        tse <- TreeSummarizedExperiment(
            assays = assays,
            rowData = taxonomy_table
        )

        # If taxonomy table contains sequences, move them to referenceSeq slot
        if (!is.null(rowData(tse)[["sequence"]])) {
            referenceSeq(tse) <- DNAStringSet( rowData(tse)[["sequence"]] )
            rowData(tse)[["sequence"]] <- NULL
        }

        # If provided, we add sample metadata as DataFrame object. rownames of
        # sample metadata must match with colnames of abundance matrix.
        if (file.exists("metadata.tsv")) {
            sample_meta  <- read.table("metadata.tsv", sep="\t", header=TRUE, row.names=1)
            sample_meta <- sample_meta[match(colnames(tse), rownames(sample_meta)), ]
            sample_meta  <- DataFrame(sample_meta)
            colData(tse) <- sample_meta
        }

        # If provided, we add phylogeny. The rownames in abundance matrix must match
        # with node labels in phylogeny.
        if (file.exists("tree.nwk")) {
            phylogeny <- ape::read.tree("tree.nwk")
            rowTree(tse) <- phylogeny
        }

        saveRDS(tse, file = paste0("qiime2", "_TreeSummarizedExperiment.rds"))

        # Version information
        writeLines(c("\"NFCORE_AMPLISEQ:AMPLISEQ:ROBJECT_WORKFLOW:TREESUMMARIZEDEXPERIMENT\":",
            paste0("    R: ", paste0(R.Version()[c("major","minor")], collapse = ".")),
            paste0("    TreeSummarizedExperiment: ", packageVersion("TreeSummarizedExperiment"))),
            "versions.yml"
        )
        NF
        Rscript /tmp/.command.sh
        while read -r f; do rm -f "$$f"; done < /tmp/.staged
    target: *target

