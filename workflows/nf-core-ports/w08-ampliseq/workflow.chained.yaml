        lnas 1/$${id}_1.fastq.gz ${reads}/$${id}/$${id}_1.fastq.gz
        lnas 2/$${id}_2.fastq.gz ${reads}/$${id}/$${id}_2.fastq.gz
        cat > /tmp/.command.sh <<'NF'
