artifacts:
  - {<<: *a_samplesheet, description: "--input: sample, fastq_1, fastq_2 and optional run, control, quant_reading (tab separated). Default: the test profile samplesheet (4 paired-end samples)."}
  - {<<: *a_nfcore, description: "nf-core/ampliseq 3.1.0 bin/ scripts and report assets (MIT)."}
  - {<<: *a_metadata_url, pattern: '[^"`$\\]*', description: "--metadata", value: "https://raw.githubusercontent.com/nf-core/test-datasets/ampliseq/samplesheets/Metadata.tsv"}
  - {<<: *a_dada_ref_urls, pattern: '[^"`$\\]*', description: "--dada_ref_taxonomy gtdb=R07-RS207 files, comma separated", value: "https://data.gtdb.ecogenomic.org/releases/release207/207.0/genomic_files_reps/bac120_ssu_reps_r207.tar.gz,https://data.gtdb.ecogenomic.org/releases/release207/207.0/genomic_files_reps/ar53_ssu_reps_r207.tar.gz"}
  - {<<: *a_qiime_ref_urls, pattern: '[^"`$\\]*', description: "--qiime_ref_taxonomy greengenes85 files, comma separated", value: "https://data.qiime2.org/2023.7/tutorials/training-feature-classifiers/85_otus.fasta,https://data.qiime2.org/2023.7/tutorials/training-feature-classifiers/85_otu_taxonomy.txt"}
  - {<<: *a_input_mirror, pattern: '[^"`$\\]*', description: "Folder searched for each input file by name before downloading it. Empty downloads everything.", value: ""}

tasks:
  - kind: horus_task
    id: stage_inputs
    name: Stage the reads, metadata and references
    inputs: [*a_dada_ref_urls, *a_input_mirror, *a_metadata_url, *a_qiime_ref_urls, *a_samplesheet]
    outputs: [*a_reads, *a_samples, *a_runs, *a_directions, *a_reference]
    executor: {kind: shell}
    runtime:
      kind: python_script
      script: scripts/stage_inputs.py
      python: python3 # stdlib only
      args: --samplesheet ${samplesheet} --metadata ${metadata_url} --ref ${dada_ref_urls} --ref ${qiime_ref_urls} --mirror ${input_mirror} --reads ${reads} --samples ${samples} --runs ${runs} --directions ${directions} --reference ${reference}
    target: *target

  - kind: horus_task
    id: format_taxonomy
    name: FORMAT_TAXONOMY
    inputs: [*a_dada_ref_urls, *a_nfcore, *a_reference]
    outputs: [*a_format_taxonomy]
    resources: {cpus: 1, memory_gb: 1, walltime: "01:00:00"}
    executor: *coreutils
    runtime:
      kind: command
      command: |
        set -eu
        export PYTHONNOUSERSITE=1 R_PROFILE_USER=/.Rprofile R_ENVIRON_USER=/.Renviron JULIA_DEPOT_PATH=/usr/local/share/julia
        export PATH="$$PATH:${nfcore}/bin"
        : > /tmp/.staged
        lnas() { d=$$1; shift; if [ $$# -ne 1 ] || [ ! -e "$$1" ]; then echo "stage $$d: need one input, got: $$*" >&2; exit 1; fi; mkdir -p "$$(dirname "$$d")"; ln -s "$$1" "$$d"; echo "$$d" >> /tmp/.staged; }
        lnk() { ld=$$1; shift; for lf in "$$@"; do lnas "$$ld/$${lf##*/}" "$$lf"; done; }
        rm -rf ${format_taxonomy} && mkdir -p ${format_taxonomy} && cd ${format_taxonomy}
        for f in $$(echo ${dada_ref_urls} | tr ',' ' '); do lnas $${f##*/} ${reference}/$${f##*/}; done
        cat > /tmp/.command.sh <<'NF'
        #!/usr/bin/env bash -C -e -u -o pipefail
        taxref_reformat_gtdb.sh \

        #Giving out information
        echo -e "--dada_ref_taxonomy: gtdb=R07-RS207\n" >ref_taxonomy.gtdb_R07-RS207.txt
        echo -e "Title: GTDB - Genome Taxonomy Database - Release R07-RS207\n" >>ref_taxonomy.gtdb_R07-RS207.txt
        echo -e "Citation: Parks DH, Chuvochina M, Waite DW, Rinke C, Skarshewski A, Chaumeil PA, Hugenholtz P. A standardized bacterial taxonomy based on genome phylogeny substantially revises the tree of life. Nat Biotechnol. 2018 Nov;36(10):996-1004. doi: 10.1038/nbt.4229. Epub 2018 Aug 27. PMID: 30148503.\n" >>ref_taxonomy.gtdb_R07-RS207.txt
        echo "All entries: [title:GTDB - Genome Taxonomy Database - Release R07-RS207, file:[https://data.gtdb.ecogenomic.org/releases/release207/207.0/genomic_files_reps/bac120_ssu_reps_r207.tar.gz, https://data.gtdb.ecogenomic.org/releases/release207/207.0/genomic_files_reps/ar53_ssu_reps_r207.tar.gz], citation:Parks DH, Chuvochina M, Waite DW, Rinke C, Skarshewski A, Chaumeil PA, Hugenholtz P. A standardized bacterial taxonomy based on genome phylogeny substantially revises the tree of life. Nat Biotechnol. 2018 Nov;36(10):996-1004. doi: 10.1038/nbt.4229. Epub 2018 Aug 27. PMID: 30148503., fmtscript:taxref_reformat_gtdb.sh, dbversion:GTDB R07-RS207 (https://data.gtdb.ecogenomic.org/releases/release207/207.0), taxlevels:Domain,Phylum,Class,Order,Family,Genus,Species]" >>ref_taxonomy.gtdb_R07-RS207.txt

        cat <<-END_VERSIONS > versions.yml
        "NFCORE_AMPLISEQ:AMPLISEQ:FORMAT_TAXONOMY":
