                --o-visualization "lvl@level@-@col@.differentials.qzv"
            qiime tools export \
                --input-path "lvl@level@-@col@.differentials.qzv" \
                --output-path "differentials/Category-@col@-level-@level@"

            # Generate bar plot views of ANCOM-BC output
            qiime composition da-barplot \
                --i-data "lvl@level@-@col@.differentials.qza" \
                --p-effect-size-threshold 2.0 --p-significance-threshold 1.0E-5 --p-label-limit 1000 \
                --o-visualization "lvl@level@-@col@.da_barplot.qzv"
            qiime tools export --input-path "lvl@level@-@col@.da_barplot.qzv" \
