  - kind: horus_map
    id: dada2_quality1
    name: DADA2_QUALITY1
    over: {input_id: directions, as: direction}
    max_concurrency: 16
    inputs: [*a_directions, *a_cutadapt, *a_nfcore]
    outputs: [*a_dada2_quality1]
    resources: {cpus: 2, memory_gb: 3, walltime: "01:00:00"}
    executor: *dada2
    runtime:
      kind: command
      command: |
        set -eu
        export PYTHONNOUSERSITE=1 R_PROFILE_USER=/.Rprofile R_ENVIRON_USER=/.Renviron JULIA_DEPOT_PATH=/usr/local/share/julia
        export PATH="$$PATH:${nfcore}/bin"
        : > /tmp/.staged
        lnas() { d=$$1; shift; if [ $$# -ne 1 ] || [ ! -e "$$1" ]; then echo "stage $$d: need one input, got: $$*" >&2; exit 1; fi; mkdir -p "$$(dirname "$$d")"; ln -s "$$1" "$$d"; echo "$$d" >> /tmp/.staged; }
        lnk() { ld=$$1; shift; for lf in "$$@"; do lnas "$$ld/$${lf##*/}" "$$lf"; done; }
        . ${direction}; n=1; [ $$direction = RV ] && n=2
        rm -rf ${dada2_quality1} && mkdir -p ${dada2_quality1} && cd ${dada2_quality1}
        lnk . ${cutadapt}/*/*.trimmed_$${n}.trim.fastq.gz
        cat > /tmp/.command.sh <<'NF'
        #!/usr/bin/env Rscript

            suppressPackageStartupMessages(library(dada2))
            suppressPackageStartupMessages(library(ShortRead))

            readfiles <- sort(list.files(".", pattern = ".fastq.gz", full.names = TRUE))

            #make list of number of sequences
            readfiles_length <- countLines(readfiles) / 4
            sum_readfiles_length <- sum(readfiles_length)

            #use only the first x files when read number gets above 2147483647, read numbers above that do not fit into an INT and crash the process!
            if ( sum_readfiles_length > 2147483647 ) {
                max_files = length(which(cumsum(readfiles_length) <= 2147483647 ))
                write.table(max_files, file = paste0("WARNING Only ",max_files," of ",length(readfiles)," files and ",sum(readfiles_length[1:max_files])," of ",sum_readfiles_length," reads were used for @direction@ plotQualityProfile.txt"), row.names = FALSE, col.names = FALSE, quote = FALSE, na = '')
                readfiles <- readfiles[1:max_files]
            } else {
                max_files <- length(readfiles)
                write.table(max_files, file = paste0(max_files," files were used for @direction@ plotQualityProfile.txt"), row.names = FALSE, col.names = FALSE, quote = FALSE, na = '')
            }

            plot <- plotQualityProfile(readfiles, n = 5e+04, aggregate = TRUE)
            data <- plot$$data

            # collect quality scores
            quality_scores <- unique( plot$$data$$Score )  |> sort()
            write.table(paste(quality_scores, sep='\n'), file = "@direction@_QualityScores.txt", row.names = FALSE, col.names = FALSE, quote = FALSE, na = '')

            #aggregate data for each sequencing cycle
            df <- data.frame(Cycle=character(), Count=character(), Median=character(), stringsAsFactors=FALSE)
            cycles <- sort(unique(data$$Cycle))
            for (cycle in cycles) {
                subdata <- data[data[, "Cycle"] == cycle, ]
                score <- list()
                #convert to list to calculate median
                for (j in 1:nrow(subdata)) {score <- unlist(c(score, rep(subdata$$Score[j], subdata$$Count[j])))}
                temp = data.frame(Cycle=cycle, Count=sum(subdata$$Count), Median=median(score), stringsAsFactors=FALSE)
                df <- rbind(df, temp)
            }

            #write output
            write.table( t(df), file = paste0("@direction@_qual_stats",".tsv"), sep = "	", row.names = TRUE, col.names = FALSE, quote = FALSE)
            pdf(paste0("@direction@_qual_stats",".pdf"))
            plot
            dev.off()
            svg(paste0("@direction@_qual_stats",".svg"))
            plot
            dev.off()

            write.table(paste0('plotQualityProfile	, n = 5e+04, aggregate = TRUE
        max_files	',max_files), file = "@direction@_plotQualityProfile.args.txt", row.names = FALSE, col.names = FALSE, quote = FALSE, na = '')
            writeLines(c("\"NFCORE_AMPLISEQ:AMPLISEQ:DADA2_PREPROCESSING:DADA2_QUALITY1\":", paste0("    R: ", paste0(R.Version()[c("major","minor")], collapse = ".")),paste0("    dada2: ", packageVersion("dada2")),paste0("    ShortRead: ", packageVersion("ShortRead")) ), "versions.yml")
        NF
        sed -i "s|@direction@|$$direction|g" /tmp/.command.sh
        Rscript /tmp/.command.sh
        while read -r f; do rm -f "$$f"; done < /tmp/.staged
    target: *target

