        lnk() { ld=$$1; shift; for lf in "$$@"; do lnas "$$ld/$${lf##*/}" "$$lf"; done; }
        . ${sample}/meta.env; trunc="$$(cat ${trunclen}/*/FW.trunc.txt), $$(cat ${trunclen}/*/RV.trunc.txt)"
