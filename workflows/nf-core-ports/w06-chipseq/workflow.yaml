    target: *target

  # ---------------------------------------------------------------- per IP sample (with its control)
  - kind: horus_map
    id: plotfingerprint
    name: DEEPTOOLS_PLOTFINGERPRINT
    over: {input_id: ips, as: ip}
    max_concurrency: 16
    inputs: [*a_ips, *a_clean, *a_clean_index, *a_fingerprint_bins]
    outputs: [*a_fingerprint]
    resources: *multi
    executor: *deeptools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${ip}); . ${ip}
        rm -rf ${fingerprint} && mkdir -p ${fingerprint} && cd ${fingerprint}
        for s in $$id $$control; do b=$$s.mLb.clN.sorted.bam; ln -s ${clean}/*/$$b .; ln -s ${clean_index}/*/$$b.bai .; done
        # params.fragment_size for single-end reads
        extend=""; [ $$single_end = true ] && extend="--extendReads 200"
        plotFingerprint \
            --skipZeros --numberOfSamples ${fingerprint_bins} --labels $$id $$control \
            $$extend \
            --bamfiles $$id.mLb.clN.sorted.bam $$control.mLb.clN.sorted.bam \
            --plotFile $${id}.mLb.clN.plotFingerprint.pdf \
            --outRawCounts $${id}.mLb.clN.plotFingerprint.raw.txt \
            --outQualityMetrics $${id}.mLb.clN.plotFingerprint.qcmetrics.txt \
            --numberOfProcessors ${task.resources.cpus}
        rm *.mLb.clN.sorted.bam *.mLb.clN.sorted.bam.bai
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: macs3_callpeak
    name: MACS3_CALLPEAK
    over: {input_id: ips, as: ip}
    max_concurrency: 16
    inputs: [*a_ips, *a_clean, *a_kmers]
    outputs: [*a_macs3]
    resources: *multi
    executor: *macs3
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${ip}); . ${ip}
        rm -rf ${macs3} && mkdir -p ${macs3} && cd ${macs3}
        for s in $$id $$control; do ln -s ${clean}/*/$$s.mLb.clN.sorted.bam .; done
        if [ $$single_end = true ]; then format=BAM; else format=BAMPE; fi
        gsize=$$(cat ${kmers}/kmers.txt)
        macs3 \
            callpeak \
            --keep-dup all --broad --broad-cutoff 0.1 \
            --gsize $$gsize \
            --format $$format \
            --name $$id \
            --treatment $$id.mLb.clN.sorted.bam \
            --control $$control.mLb.clN.sorted.bam
        rm *.mLb.clN.sorted.bam
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: filter_peaks
    name: Keep IP samples with peaks
    description: Drops IP samples whose MACS3 peak file is empty and groups the rest by antibody for the consensus peaks.
    inputs: [*a_decide_py, *a_ips, *a_macs3]
    outputs: [*a_peak_pass, *a_antibodies]
    executor: {kind: shell}
    runtime:
      kind: python_script
      script: scripts/decide.py
      python: python3 # stdlib only
      args: peaks --ips ${ips} --macs3 ${macs3} --suffix _peaks.broadPeak --peak-pass ${peak_pass} --antibodies ${antibodies}
    target: *target

  - kind: horus_map
    id: frip_score
    name: FRIP_SCORE
    over: {input_id: peak_pass, as: ip}
    max_concurrency: 16
    inputs: [*a_peak_pass, *a_clean, *a_macs3]
    outputs: [*a_frip]
    resources: *multi
    executor: *frip
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${ip})
        rm -rf ${frip} && mkdir -p ${frip} && cd ${frip}
        b=$${id}.mLb.clN.sorted.bam; p=$${id}_peaks.broadPeak
        ln -s ${clean}/*/$$b .; ln -s ${macs3}/*/$$p .
        READS_IN_PEAKS=$$(intersectBed -a $$b -b $$p -bed -c -f 0.20 | awk -F '\t' '{sum += $$NF} END {print sum}')
        samtools flagstat $$b > $$b.flagstat
        grep 'mapped (' $$b.flagstat | grep -v "primary" | awk -v a="$$READS_IN_PEAKS" -v OFS='\t' '{print "'$$id'", a/$$1}' > $${id}.FRiP.txt
        rm $$b $$p
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: multiqc_custom_peaks
    name: MULTIQC_CUSTOM_PEAKS
    over: {input_id: peak_pass, as: ip}
    max_concurrency: 16
    inputs: [*a_peak_pass, *a_macs3, *a_frip, *a_nfcore]
    outputs: [*a_peak_mqc]
    resources: *single
    executor: *nfubuntu
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${ip}); h=${nfcore}/assets/multiqc
        rm -rf ${peak_mqc} && mkdir -p ${peak_mqc} && cd ${peak_mqc}
        p=$${id}_peaks.broadPeak
        ln -s ${macs3}/*/$$p .; ln -s ${frip}/*/$${id}.FRiP.txt .; ln -s $$h/peak_count_header.txt .; ln -s $$h/frip_score_header.txt .
        cat $$p | wc -l | awk -v OFS='\t' '{ print "'$$id'", $$1 }' | cat peak_count_header.txt - > $${id}.peak_count_mqc.tsv
        cat frip_score_header.txt $${id}.FRiP.txt > $${id}.FRiP_mqc.tsv
        rm $$p $${id}.FRiP.txt peak_count_header.txt frip_score_header.txt
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: homer_annotatepeaks
    name: HOMER_ANNOTATEPEAKS
    over: {input_id: peak_pass, as: ip}
    max_concurrency: 16
    inputs: [*a_peak_pass, *a_macs3, *a_reference]
    outputs: [*a_homer]
    resources: *multi
    executor: *homer
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${ip}); . ${reference}/refs.env
        rm -rf ${homer} && mkdir -p ${homer} && cd ${homer}
        p=$${id}_peaks.broadPeak
        ln -s ${macs3}/*/$$p .; ln -s ${reference}/$$ref_fasta .; ln -s ${reference}/$$ref_gtf .
        annotatePeaks.pl \
            $$p \
            $$ref_fasta \
            -gid \
            -gtf $$ref_gtf \
            -cpu ${task.resources.cpus} \
            > $${id}_peaks.annotatePeaks.txt
        rm $$p $$ref_fasta $$ref_gtf
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  # Nextflow passes the peak files in arrival order; here they are sorted by name.
  - kind: horus_task
    id: plot_macs3_qc
    name: PLOT_MACS3_QC
    inputs: [*a_peak_pass, *a_macs3, *a_nfcore]
    outputs: [*a_macs3_qc]
    resources: *multi
    executor: *plotr
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        export PATH="${nfcore}/bin:$$PATH"
        rm -rf ${macs3_qc} && mkdir -p ${macs3_qc} && cd ${macs3_qc}
        ids=$$(ls ${peak_pass} | sort)
        for i in $$ids; do ln -s ${macs3}/*/$${i}_peaks.broadPeak .; done
        plot_macs3_qc.r \
            -i $$(for i in $$ids; do printf '%s,' $${i}_peaks.broadPeak; done | sed 's/,$$//') \
            -s $$(echo $$ids | tr ' ' ',') \
            -o ./ -p macs3_peak
        rm *_peaks.broadPeak
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: plot_homer_annotatepeaks
    name: PLOT_HOMER_ANNOTATEPEAKS
    inputs: [*a_peak_pass, *a_homer, *a_nfcore]
    outputs: [*a_homer_qc]
    resources: *multi
    executor: *plotr
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        export PATH="${nfcore}/bin:$$PATH"
        rm -rf ${homer_qc} && mkdir -p ${homer_qc} && cd ${homer_qc}
        ids=$$(ls ${peak_pass} | sort)
        for i in $$ids; do ln -s ${homer}/*/$${i}_peaks.annotatePeaks.txt .; done
        ln -s ${nfcore}/assets/multiqc/peak_annotation_header.txt .
        plot_homer_annotatepeaks.r \
            -i $$(for i in $$ids; do printf '%s,' $${i}_peaks.annotatePeaks.txt; done | sed 's/,$$//') \
            -s $$(echo $$ids | tr ' ' ',') \
            -p macs3_annotatePeaks \
            -o ./

        find ./ -type f -name "*summary.txt" -exec cat {} \; | cat peak_annotation_header.txt - > macs3_annotatePeaks.summary_mqc.tsv
        rm *_peaks.annotatePeaks.txt peak_annotation_header.txt
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  # ---------------------------------------------------------------- per antibody
  # ext.when: MACS3_CONSENSUS runs if the antibody has several groups or
  # replicates, DESEQ2_QC if it has both; otherwise the slot stays empty.
  - kind: horus_map
    id: macs3_consensus
    name: MACS3_CONSENSUS
    over: {input_id: antibodies, as: antibody}
    max_concurrency: 16
    inputs: [*a_antibodies, *a_macs3, *a_nfcore, *a_min_reps]
    outputs: [*a_consensus]
    resources: *long
    executor: *consensus
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        export PATH="${nfcore}/bin:$$PATH"
        ab=$$(basename ${antibody}); . ${antibody}
        rm -rf ${consensus} && mkdir -p ${consensus} && cd ${consensus}
        if [ $$multiple_groups = true ] || [ $$replicates_exist = true ]; then
        prefix=$${ab}.consensus_peaks
        set -- $$(for i in $$peaks; do echo $${i}_peaks.broadPeak; done | sort)
        for p in "$$@"; do ln -s ${macs3}/*/$$p .; done
        sort -T '.' -k1,1 -k2,2n "$$@" \
            | mergeBed -c 2,3,4,5,6,7,8,9 -o collapse,collapse,collapse,collapse,collapse,collapse,collapse,collapse > $${prefix}.txt

        macs3_merged_expand.py \
            $${prefix}.txt \
            $$(echo "$$@" | tr ' ' ',' | sed 's/_peaks.broadPeak//g') \
            $${prefix}.boolean.txt \
            --min_replicates ${min_reps_consensus} \
             \


        awk -v FS='\t' -v OFS='\t' 'FNR > 1 { print $$1, $$2, $$3, $$4, "0", "+" }' $${prefix}.boolean.txt > $${prefix}.bed

        echo -e "GeneID\tChr\tStart\tEnd\tStrand" > $${prefix}.saf
        awk -v FS='\t' -v OFS='\t' 'FNR > 1 { print $$4, $$1, $$2, $$3,  "+" }' $${prefix}.boolean.txt >> $${prefix}.saf

        plot_peak_intersect.r -i $${prefix}.boolean.intersect.txt -o $${prefix}.boolean.intersect.plot.pdf

        # Groovy turns the module's "\t" into a real tab
        printf '%s\t%s\n' $${prefix}.bed $${ab}/$${prefix}.bed > $${prefix}.antibody.txt
        rm "$$@"
        fi
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: homer_consensus
    name: HOMER_ANNOTATEPEAKS
    over: {input_id: antibodies, as: antibody}
    max_concurrency: 16
    inputs: [*a_antibodies, *a_consensus, *a_reference]
    outputs: [*a_homer_consensus]
    resources: *multi
    executor: *homer
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        ab=$$(basename ${antibody}); . ${reference}/refs.env
        rm -rf ${homer_consensus} && mkdir -p ${homer_consensus} && cd ${homer_consensus}
        p=$${ab}.consensus_peaks.bed
        if ls ${consensus}/*/$$p > /dev/null 2>&1; then
        ln -s ${consensus}/*/$$p .; ln -s ${reference}/$$ref_fasta .; ln -s ${reference}/$$ref_gtf .
        annotatePeaks.pl \
            $$p \
            $$ref_fasta \
            -gid \
            -gtf $$ref_gtf \
            -cpu ${task.resources.cpus} \
            > $${ab}.consensus_peaks.annotatePeaks.txt
        rm $$p $$ref_fasta $$ref_gtf
        fi
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: annotate_boolean_peaks
    name: ANNOTATE_BOOLEAN_PEAKS
    over: {input_id: antibodies, as: antibody}
    max_concurrency: 16
    inputs: [*a_antibodies, *a_consensus, *a_homer_consensus]
    outputs: [*a_boolean_annot]
    resources: *multi
    executor: *ubuntu
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        ab=$$(basename ${antibody}); prefix=$${ab}.consensus_peaks
        rm -rf ${boolean_annot} && mkdir -p ${boolean_annot} && cd ${boolean_annot}
        if ls ${homer_consensus}/*/$${prefix}.annotatePeaks.txt > /dev/null 2>&1; then
        ln -s ${consensus}/*/$${prefix}.boolean.txt .; ln -s ${homer_consensus}/*/$${prefix}.annotatePeaks.txt .
        cut -f2- $${prefix}.annotatePeaks.txt | awk 'NR==1; NR > 1 {print $$0 | "sort -T '.' -k1,1 -k2,2n"}' | cut -f6- > tmp.txt
        paste $${prefix}.boolean.txt tmp.txt > $${prefix}.boolean.annotatePeaks.txt
        rm tmp.txt $${prefix}.boolean.txt $${prefix}.annotatePeaks.txt
        fi
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  # Nextflow sorts the BAMs by work-dir path (random order); here by name.
  - kind: horus_map
    id: featurecounts
    name: SUBREAD_FEATURECOUNTS
    over: {input_id: antibodies, as: antibody}
    max_concurrency: 16
    inputs: [*a_antibodies, *a_consensus, *a_clean, *a_ips]
    outputs: [*a_featurecounts]
    resources: *multi
    executor: *subread
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        ab=$$(basename ${antibody}); . ${antibody}; prefix=$${ab}.consensus_peaks
        rm -rf ${featurecounts} && mkdir -p ${featurecounts} && cd ${featurecounts}
        if ls ${consensus}/*/$${prefix}.saf > /dev/null 2>&1; then
        single_end=$$(. ${ips}/$${bams%% *}; echo $$single_end)
        set -- $$(for i in $$bams; do echo $$i.mLb.clN.sorted.bam; done | sort)
        for b in "$$@"; do ln -s ${clean}/*/$$b .; done; ln -s ${consensus}/*/$${prefix}.saf .
        paired_end="-p"; [ $$single_end = true ] && paired_end=""
        featureCounts \
            -F SAF -O --fracOverlap 0.2 \
            $$paired_end \
            -T ${task.resources.cpus} \
            -a $${prefix}.saf \
            -s 0 \
            -o $${prefix}.featureCounts.txt \
            "$$@"
        rm "$$@" $${prefix}.saf
        fi
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: deseq2_qc
    name: DESEQ2_QC
    over: {input_id: antibodies, as: antibody}
    max_concurrency: 16
    inputs: [*a_antibodies, *a_featurecounts, *a_nfcore]
    outputs: [*a_deseq2]
    resources: *multi
    executor: *deseq2
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        export PATH="${nfcore}/bin:$$PATH"
        ab=$$(basename ${antibody}); . ${antibody}; prefix=$${ab}.consensus_peaks; h=${nfcore}/assets/multiqc
        rm -rf ${deseq2} && mkdir -p ${deseq2} && cd ${deseq2}
        if [ $$multiple_groups = true ] && [ $$replicates_exist = true ]; then
        # task.index: this antibody's place among the antibodies that run DESeq2
        index=$$(for f in $$(dirname ${antibody})/*; do (. $$f; [ $$multiple_groups = true ] && [ $$replicates_exist = true ] && basename $$f); done | sort | grep -nx "$$ab" | cut -d: -f1)
        ln -s ${featurecounts}/*/$${prefix}.featureCounts.txt .; ln -s $$h/deseq2_pca_header.txt .; ln -s $$h/deseq2_clustering_header.txt .
        deseq2_qc.r \
            --count_file $${prefix}.featureCounts.txt \
            --outdir ./ \
            --outprefix $$prefix \
            --cores ${task.resources.cpus} \
            --id_col 1 --sample_suffix '.mLb.clN.sorted.bam' --count_col 7 --vst TRUE

        sed "s/deseq2_pca/deseq2_pca_$$index/g" <deseq2_pca_header.txt >tmp.txt
        sed -i -e "s/DESeq2 /$$ab DESeq2 /g" tmp.txt
        cat tmp.txt $${prefix}.pca.vals.txt > $${prefix}.pca.vals_mqc.tsv

        sed "s/deseq2_clustering/deseq2_clustering_$$index/g" <deseq2_clustering_header.txt >tmp.txt
        sed -i -e "s/DESeq2 /$$ab DESeq2 /g" tmp.txt
        cat tmp.txt $${prefix}.sample.dists.txt > $${prefix}.sample.dists_mqc.tsv
        rm tmp.txt $${prefix}.featureCounts.txt deseq2_pca_header.txt deseq2_clustering_header.txt
        fi
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  # ---------------------------------------------------------------- reports
  - kind: horus_task
    id: igv
    name: IGV
    inputs: [*a_bigwig, *a_peak_pass, *a_macs3, *a_consensus, *a_reference, *a_nfcore]
    outputs: [*a_igv]
    resources: *single
    executor: *python
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        export PATH="${nfcore}/bin:$$PATH"
        . ${reference}/refs.env
        rm -rf ${igv} && mkdir -p ${igv} && cd ${igv}
        d=bwa/merged_library
        mkdir -p $$d/bigwig $$d/macs3/broad_peak/consensus mappings
        for f in ${bigwig}/*/*.bigWig; do ln -s $$f $$d/bigwig/; done
        for i in $$(ls ${peak_pass}); do ln -s ${macs3}/*/$${i}_peaks.broadPeak $$d/macs3/broad_peak/; done
        for f in ${consensus}/*/*.consensus_peaks.bed; do [ -e "$$f" ] && ln -s $$f $$d/macs3/broad_peak/consensus/; done
        for f in ${consensus}/*/*.antibody.txt; do [ -e "$$f" ] && ln -s $$f mappings/; done
        ln -s ${reference}/$$ref_fasta $$ref_fasta
        find * -type l -name "*.bigWig" -exec echo -e ""{}"\t0,0,178" \; > bigwig.igv.txt
        find * -type l -name "*Peak" -exec echo -e ""{}"\t0,0,178" \; > peaks.igv.txt
        # Avoid error when consensus not produced
        find * -type l -name "*.bed" -exec echo -e ""{}"\t0,0,178" \; | { grep "^bwa/merged_library/macs3/broad_peak/consensus/*" || test $$? = 1; } > consensus.igv.txt

        touch replace_paths.txt
        if [ -d "mappings" ]; then
            cat mappings/* > replace_paths.txt
        fi

        cat *.igv.txt > igv_files_orig.txt
        igv_files_to_session.py igv_session.xml igv_files_orig.txt replace_paths.txt ../../genome/$$ref_fasta --path_prefix '../../'
        rm -r bwa mappings; rm $$ref_fasta
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  # Links exactly the files nf-core/chipseq sends to MultiQC into the
  # folders its module stages them in (multiqc_config.yml path_filters match
  # on them). The workflow summary and software versions files come from
  # Nextflow run metadata and are left out.
  - kind: horus_task
    id: multiqc
    name: MULTIQC
    inputs:
      - *a_nfcore
      - *a_fastqc
      - *a_trimgalore
      - *a_lib_stats
      - *a_lib_flagstat
      - *a_lib_idxstats
      - *a_md_stats
      - *a_md_flagstat
      - *a_md_idxstats
      - *a_markdup
      - *a_clean_stats
      - *a_clean_flagstat
      - *a_clean_idxstats
      - *a_picard_metrics
      - *a_plotprofile
      - *a_plotheatmap
      - *a_fingerprint
      - *a_phantom
      - *a_phantom_mqc
      - *a_peak_mqc
      - *a_homer_qc
      - *a_macs3_qc
      - *a_featurecounts
      - *a_deseq2
      - *a_boolean_annot
      - *a_igv
    outputs: [*a_multiqc]
    resources: *multi
    executor: *multiqc
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${multiqc} && mkdir -p ${multiqc} && cd ${multiqc}
        stage() { d=$$1; shift; mkdir -p $$d; for f in "$$@"; do [ -e "$$f" ] && ln -s "$$f" $$d/ && echo "$$d/$$(basename $$f)" >> multiqc_inputs.txt; done; return 0; }
        ln -s ${nfcore}/assets/multiqc_config.yml .
        stage fastqc ${fastqc}/*/*_fastqc.zip
        stage trimgalore/fastqc ${trimgalore}/*/*_fastqc.zip
        stage trimgalore ${trimgalore}/*/*_trimming_report.txt
        stage alignment/library ${lib_stats}/*/*.stats ${lib_flagstat}/*/*.flagstat ${lib_idxstats}/*/*.idxstats
        stage alignment/merged_library/unfiltered ${md_stats}/*/*.stats ${md_flagstat}/*/*.flagstat ${md_idxstats}/*/*.idxstats
        stage alignment/merged_library/unfiltered/picard_metrics ${markdup}/*/*.metrics.txt
        stage alignment/merged_library/filtered ${clean_stats}/*/*.stats ${clean_flagstat}/*/*.flagstat ${clean_idxstats}/*/*.idxstats
        stage alignment/merged_library/filtered/picard_metrics ${picard_metrics}/*/*_metrics
        stage preseq
        stage deeptools ${plotprofile}/*/*.plotProfile.tab ${fingerprint}/*/*.plotFingerprint.raw.txt
        stage phantompeakqualtools ${phantom}/*/*.spp.out ${phantom_mqc}/*/*_mqc.tsv
        stage macs3/peaks ${peak_mqc}/*/*.FRiP_mqc.tsv ${peak_mqc}/*/*.peak_count_mqc.tsv
        stage macs3/annotation ${homer_qc}/*.summary_mqc.tsv
        stage macs3/featurecounts ${featurecounts}/*/*.featureCounts.txt.summary
        stage deseq2 ${deseq2}/*/*.pca.vals_mqc.tsv ${deseq2}/*/*.sample.dists_mqc.tsv
        multiqc \
            -f \
             \
             \
            .
        rm -r multiqc_config.yml fastqc trimgalore alignment preseq deeptools phantompeakqualtools macs3 deseq2
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

