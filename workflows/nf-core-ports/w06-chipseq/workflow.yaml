artifacts:
  - <<: *a_samplesheet
    description: >-
      nf-core/chipseq samplesheet (sample,fastq_1,fastq_2,replicate,antibody,control,control_replicate).
      Reads may be URLs or paths relative to the samplesheet. Default: the test
      profile samplesheet (two SPT5 time points, two replicates each, with input controls).
  - <<: *a_nfcore
    description: nf-core/chipseq 2.1.0 bin/ scripts and assets (MIT).
  - <<: *a_stage_py
    description: Fetches the reference and reads and writes the library and sample lists.
  - <<: *a_decide_py
    description: The pipeline's Groovy-side peak decisions as a script.
  - <<: *a_mirror
    description: >-
      Folder searched for each input file by name before downloading it (e.g. a
      local copy of the test data). Empty downloads everything.
    value: ""
    pattern: '[^"`$\\]*'
  - {<<: *a_fasta_url, pattern: '[^"`$\\]*', description: "--fasta (plain fasta)", value: "https://raw.githubusercontent.com/nf-core/test-datasets/cd022b097372b078a68d8afadb172ad7342fd91f/reference/genome.fa"}
  - {<<: *a_gtf_url, pattern: '[^"`$\\]*', description: "--gtf (plain GTF)", value: "https://raw.githubusercontent.com/nf-core/test-datasets/cd022b097372b078a68d8afadb172ad7342fd91f/reference/genes.gtf"}
  - {<<: *a_read_length, value: 50, min: 1, description: "--read_length (k-mer size for the MACS3 genome size)"}
  - {<<: *a_fingerprint_bins, value: 100, min: 1, description: "--fingerprint_bins"}
  - {<<: *a_min_reps, value: 1, min: 1, description: "--min_reps_consensus"}

tasks:
  # ---------------------------------------------------------------- inputs
  - kind: horus_task
    id: fetch_reference
    name: Fetch reference files
    description: Downloads the genome fasta and GTF (or copies them from the mirror).
    inputs: [*a_stage_py, *a_mirror, *a_fasta_url, *a_gtf_url]
    outputs: [*a_reference]
    executor: {kind: shell}
    runtime:
      kind: python_script
      script: scripts/stage_inputs.py
      python: python3 # stdlib only
      args: reference --fasta ${fasta_url} --gtf ${gtf_url} --mirror ${input_mirror} --out ${reference}
    target: *target

  - kind: horus_task
    id: samplesheet_check
    name: SAMPLESHEET_CHECK
    inputs: [*a_samplesheet, *a_nfcore]
    outputs: [*a_pipeline_info]
    resources: *single
    executor: *python
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        export PATH="${nfcore}/bin:$$PATH"
        rm -rf ${pipeline_info} && mkdir -p ${pipeline_info} && cd ${pipeline_info}
        ln -s ${samplesheet} $$(basename ${samplesheet})
        check_samplesheet.py \
            $$(basename ${samplesheet}) \
            samplesheet.valid.csv
        rm $$(basename ${samplesheet})
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: stage_samples
    name: Split the samplesheet into libraries
    description: Fetches each library's reads and writes the library, sample and IP lists.
    inputs: [*a_stage_py, *a_samplesheet, *a_pipeline_info, *a_mirror]
    outputs: [*a_reads, *a_libs, *a_samples, *a_ips]
    executor: {kind: shell}
    runtime:
      kind: python_script
      script: scripts/stage_inputs.py
      python: python3 # stdlib only
      args: >-
        samples --samplesheet ${pipeline_info}/samplesheet.valid.csv --origin ${samplesheet}
        --mirror ${input_mirror} --reads ${reads} --libs ${libs} --samples ${samples} --ips ${ips}
    target: *target

  # ---------------------------------------------------------------- genome
  - kind: horus_task
    id: gtf2bed
    name: GTF2BED
    inputs: [*a_reference, *a_nfcore]
    outputs: [*a_gene_bed]
    resources: *multi
    executor: *perl
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        export PATH="${nfcore}/bin:$$PATH"
        . ${reference}/refs.env
        rm -rf ${gene_bed} && mkdir -p ${gene_bed} && cd ${gene_bed}
        ln -s ${reference}/$$ref_gtf $$ref_gtf
        gtf2bed \
            $$ref_gtf \
            > $${ref_gtf%.*}.bed
        rm $$ref_gtf
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: getchromsizes
    name: CUSTOM_GETCHROMSIZES
    inputs: [*a_reference]
    outputs: [*a_chromsizes]
    resources: *single
    executor: *samtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${reference}/refs.env
        rm -rf ${chromsizes} && mkdir -p ${chromsizes} && cd ${chromsizes}
        ln -s ${reference}/$$ref_fasta $$ref_fasta
        samtools faidx $$ref_fasta
        cut -f 1,2 $$ref_fasta.fai > $$ref_fasta.sizes
        rm $$ref_fasta
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: blacklist_regions
    name: GENOME_BLACKLIST_REGIONS
    inputs: [*a_chromsizes]
    outputs: [*a_include_bed]
    resources: *single
    executor: *bedtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${include_bed} && mkdir -p ${include_bed} && cd ${include_bed}
        sizes=$$(basename ${chromsizes}/*.sizes)
        ln -s ${chromsizes}/$$sizes $$sizes
        awk '{print $$1, '0' , $$2}' OFS='\t' $$sizes > $${sizes%%.*}.include_regions.bed
        rm $$sizes
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: bwa_index
    name: BWA_INDEX
    inputs: [*a_reference]
    outputs: [*a_bwa_index]
    resources: *single
    executor: *bwa
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${reference}/refs.env
        rm -rf ${bwa_index} && mkdir -p ${bwa_index} && cd ${bwa_index}
        ln -s ${reference}/$$ref_fasta $$ref_fasta
        mkdir bwa
        bwa \
            index \
             \
            -p bwa/$${ref_fasta%.*} \
            $$ref_fasta
        rm $$ref_fasta
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: khmer
    name: KHMER_UNIQUEKMERS
    inputs: [*a_reference, *a_read_length]
    outputs: [*a_kmers]
    resources: *multi
    executor: *khmer
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${reference}/refs.env
        rm -rf ${kmers} && mkdir -p ${kmers} && cd ${kmers}
        ln -s ${reference}/$$ref_fasta $$ref_fasta
        unique-kmers.py \
            -k ${read_length} \
            -R report.txt \
             \
            $$ref_fasta

        grep ^number report.txt | sed 's/^.*:.[[:blank:]]//g' > kmers.txt
        rm $$ref_fasta
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  # ---------------------------------------------------------------- per library
  - kind: horus_map
    id: fastqc
    name: FASTQC
    over: {input_id: libs, as: lib}
    max_concurrency: 16
    inputs: [*a_libs, *a_reads]
    outputs: [*a_fastqc]
    resources: *multi
    executor: *fastqc
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${lib}); . ${lib}
        rm -rf ${fastqc} && mkdir -p ${fastqc} && cd ${fastqc}
        set -- $$(sed "s#^#${reads}/$$id/#" ${reads}/$$id/reads.txt)
        pairs=""; names=""; i=0
        for f in "$$@"; do
            i=$$((i + 1)); ln -s $$f $$(basename $$f)
            if [ $$# -eq 1 ]; then new=$${id}.$${f##*.}; else new=$${id}_$$i.$${f##*.}; fi
            pairs="$$pairs $$(basename $$f) $$new"; names="$$names $$new"
        done
        printf "%s %s\n" $$pairs | while read old_name new_name; do
            [ -f "$${new_name}" ] || ln -s $$old_name $$new_name
        done
        fastqc \
            --quiet \
            --threads ${task.resources.cpus} \
            --memory $$(( ${task.resources.memory_gb} * 1024 )) \
            $${names# }
        rm $$names; for f in "$$@"; do rm $$(basename $$f); done
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: trimgalore
    name: TRIMGALORE
    over: {input_id: libs, as: lib}
    max_concurrency: 16
    inputs: [*a_libs, *a_reads]
    outputs: [*a_trimgalore]
    resources: *multi
    executor: *trimgalore
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${lib}); . ${lib}
        rm -rf ${trimgalore} && mkdir -p ${trimgalore} && cd ${trimgalore}
        set -- $$(sed "s#^#${reads}/$$id/#" ${reads}/$$id/reads.txt)
        # --cores: task.cpus - 4 (paired) or - 3 (single), clamped to 1..8
        cores=$$(( ${task.resources.cpus} - 4 ))
        [ $$single_end = true ] && cores=$$(( ${task.resources.cpus} - 3 ))
        [ $$cores -lt 1 ] && cores=1
        [ $$cores -gt 8 ] && cores=8
        for f in "$$@"; do ln -s $$f $$(basename $$f); done
        if [ $$single_end = true ]; then
        [ ! -f  $${id}.fastq.gz ] && ln -s $$(basename $$1) $${id}.fastq.gz
        trim_galore \
            --fastqc \
            --cores $$cores \
            --gzip \
            $${id}.fastq.gz
        rm $${id}.fastq.gz
        else
        [ ! -f  $${id}_1.fastq.gz ] && ln -s $$(basename $$1) $${id}_1.fastq.gz
        [ ! -f  $${id}_2.fastq.gz ] && ln -s $$(basename $$2) $${id}_2.fastq.gz
        trim_galore \
            --fastqc \
            --cores $$cores \
            --paired \
            --gzip \
            $${id}_1.fastq.gz \
            $${id}_2.fastq.gz
        rm $${id}_1.fastq.gz $${id}_2.fastq.gz
        fi
        for f in "$$@"; do rm $$(basename $$f); done
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: bwa_mem
    name: BWA_MEM
    over: {input_id: libs, as: lib}
    max_concurrency: 16
    inputs: [*a_libs, *a_trimgalore, *a_bwa_index]
    outputs: [*a_bwa_mem]
    resources: *multi
    executor: *bwamem
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${lib}); . ${lib}
        rm -rf ${bwa_mem} && mkdir -p ${bwa_mem} && cd ${bwa_mem}
        if [ $$single_end = true ]; then set -- ${trimgalore}/*/$${id}_trimmed.fq.gz
        else set -- ${trimgalore}/*/$${id}_1_val_1.fq.gz ${trimgalore}/*/$${id}_2_val_2.fq.gz; fi
        for f in "$$@"; do ln -s $$f $$(basename $$f); done
        ln -s ${bwa_index}/bwa bwa
        INDEX=`find -L ./ -name "*.amb" | sed 's/\.amb$$//'`
        bwa mem \
            -M -R "@RG\tID:$${id}\tSM:$${sample}\tPL:ILLUMINA\tLB:$${id}\tPU:1" \
            -t ${task.resources.cpus} \
            $$INDEX \
            $$(for f in "$$@"; do basename $$f; done) \
            | samtools view -bhS -F 0x0100 -O BAM  --threads ${task.resources.cpus} -o $${id}.Lb.bam -
        rm bwa; for f in "$$@"; do rm $$(basename $$f); done
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
