        picard \
            -Xmx$$(( ${task.resources.memory_gb} * 1024 * 8 / 10 ))M \
            MarkDuplicates \
            --ASSUME_SORTED true --REMOVE_DUPLICATES false --VALIDATION_STRINGENCY LENIENT --TMP_DIR tmp \
            --INPUT $${id}.mLb.sorted.bam \
            --OUTPUT $${id}.mLb.mkD.sorted.bam \
            --REFERENCE_SEQUENCE $$ref_fasta \
            --METRICS_FILE $${id}.mLb.mkD.sorted.MarkDuplicates.metrics.txt
        rm $${id}.mLb.sorted.bam $$ref_fasta $$ref_fasta.fai; rm -rf tmp
