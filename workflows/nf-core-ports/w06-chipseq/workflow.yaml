        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample})
        rm -rf ${plotprofile} && mkdir -p ${plotprofile} && cd ${plotprofile}
        ln -s ${matrix}/*/$${id}.mLb.clN.computeMatrix.mat.gz .
        plotProfile \
             \
            --matrixFile $${id}.mLb.clN.computeMatrix.mat.gz \
