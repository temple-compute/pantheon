  - kind: horus_map
    id: collect_metrics
    name: PICARD_COLLECTMULTIPLEMETRICS
    over: {input_id: samples, as: sample}
    max_concurrency: 16
    inputs: [*a_samples, *a_clean, *a_reference, *a_chromsizes]
