        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${reference}/refs.env
        rm -rf ${picard_metrics} && mkdir -p ${picard_metrics} && cd ${picard_metrics}
        ln -s ${clean}/*/$${id}.mLb.clN.sorted.bam .; ln -s ${reference}/$$ref_fasta $$ref_fasta; ln -s ${chromsizes}/$$ref_fasta.fai .
        picard \
            -Xmx$$(( ${task.resources.memory_gb} * 1024 * 8 / 10 ))M \
            CollectMultipleMetrics \
            --VALIDATION_STRINGENCY LENIENT --TMP_DIR tmp \
            --INPUT $${id}.mLb.clN.sorted.bam \
            --OUTPUT $${id}.mLb.clN.sorted.CollectMultipleMetrics \
            --REFERENCE_SEQUENCE $$ref_fasta
        rm $${id}.mLb.clN.sorted.bam $$ref_fasta $$ref_fasta.fai; rm -rf tmp
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: phantompeakqualtools
    name: PHANTOMPEAKQUALTOOLS
    over: {input_id: samples, as: sample}
    max_concurrency: 16
    inputs: [*a_samples, *a_clean]
    outputs: [*a_phantom]
    resources: *multi
    executor: *phantom
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample})
        rm -rf ${phantom} && mkdir -p ${phantom} && cd ${phantom}
        ln -s ${clean}/*/$${id}.mLb.clN.sorted.bam .
        RUN_SPP=`which run_spp.R`
        Rscript --max-ppsize=500000 -e "library(caTools); source(\"$$RUN_SPP\")" -c="$${id}.mLb.clN.sorted.bam" -savp="$${id}.spp.pdf" -savd="$${id}.spp.Rdata" -out="$${id}.spp.out" -p=${task.resources.cpus}
        rm $${id}.mLb.clN.sorted.bam
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: phantompeakqualtools_mqc
    name: MULTIQC_CUSTOM_PHANTOMPEAKQUALTOOLS
    over: {input_id: samples, as: sample}
    max_concurrency: 16
    inputs: [*a_samples, *a_phantom, *a_nfcore]
    outputs: [*a_phantom_mqc]
    resources: *single
    executor: *rbase
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); h=${nfcore}/assets/multiqc
        rm -rf ${phantom_mqc} && mkdir -p ${phantom_mqc} && cd ${phantom_mqc}
        ln -s ${phantom}/*/$${id}.spp.out .; ln -s ${phantom}/*/$${id}.spp.Rdata .
        for f in spp_nsc_header.txt spp_rsc_header.txt spp_correlation_header.txt; do ln -s $$h/$$f .; done
        cp spp_correlation_header.txt $${id}.spp_correlation_mqc.tsv
        Rscript --max-ppsize=500000 -e "load('$${id}.spp.Rdata'); write.table(crosscorr\$$cross.correlation, file=\"$${id}.spp_correlation_mqc.tsv\", sep=",", quote=FALSE, row.names=FALSE, col.names=FALSE,append=TRUE)"

        awk -v OFS='\t' '{print "'$$id'", $$9}'  $${id}.spp.out | cat spp_nsc_header.txt - > $${id}.spp_nsc_mqc.tsv
        awk -v OFS='\t' '{print "'$$id'", $$10}' $${id}.spp.out | cat spp_rsc_header.txt - > $${id}.spp_rsc_mqc.tsv
        rm $${id}.spp.out $${id}.spp.Rdata spp_nsc_header.txt spp_rsc_header.txt spp_correlation_header.txt
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: genomecov
    name: BEDTOOLS_GENOMECOV
    over: {input_id: samples, as: sample}
    max_concurrency: 16
    inputs: [*a_samples, *a_clean, *a_clean_flagstat]
    outputs: [*a_genomecov]
    resources: *multi
    executor: *bedtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${genomecov} && mkdir -p ${genomecov} && cd ${genomecov}
        b=$${id}.mLb.clN.sorted.bam
        ln -s ${clean}/*/$$b .; ln -s ${clean_flagstat}/*/$$b.flagstat .
        # ext.args: -fs <fragment_size> for single-end reads
        if [ $$single_end = true ]; then pe=""; args="-fs 200"; else pe="-pc"; args=""; fi
        SCALE_FACTOR=$$(grep '[0-9] mapped (' $$b.flagstat | awk '{print 1000000/$$1}')
        echo $$SCALE_FACTOR > $${id}.mLB.clN.scale_factor.txt

        bedtools \
            genomecov \
            -ibam $$b \
            -bg \
            -scale $$SCALE_FACTOR \
            $$pe \
            $$args \
            | sort -T '.' -k1,1 -k2,2n > $${id}.mLB.clN.bedGraph
        rm $$b $$b.flagstat
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: bigwig
    name: UCSC_BEDGRAPHTOBIGWIG
    over: {input_id: samples, as: sample}
    max_concurrency: 16
    inputs: [*a_samples, *a_genomecov, *a_chromsizes]
    outputs: [*a_bigwig]
    resources: *single
    executor: *ucsc
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); sizes=$$(basename ${chromsizes}/*.sizes)
        rm -rf ${bigwig} && mkdir -p ${bigwig} && cd ${bigwig}
        ln -s ${genomecov}/*/$${id}.mLB.clN.bedGraph .; ln -s ${chromsizes}/$$sizes .
        bedGraphToBigWig \
            $${id}.mLB.clN.bedGraph \
            $$sizes \
            $${id}.mLb.clN.bigWig
        rm $${id}.mLB.clN.bedGraph $$sizes
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: computematrix
    name: DEEPTOOLS_COMPUTEMATRIX
    over: {input_id: samples, as: sample}
    max_concurrency: 16
    inputs: [*a_samples, *a_bigwig, *a_gene_bed]
    outputs: [*a_matrix]
    resources: *multi
    executor: *deeptools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); bed=$$(basename ${gene_bed}/*.bed)
        rm -rf ${matrix} && mkdir -p ${matrix} && cd ${matrix}
        ln -s ${bigwig}/*/$${id}.mLb.clN.bigWig .; ln -s ${gene_bed}/$$bed .
        computeMatrix \
            scale-regions --regionBodyLength 1000 --beforeRegionStartLength 3000 --afterRegionStartLength 3000 --missingDataAsZero --skipZeros --smartLabels \
            --regionsFileName $$bed \
            --scoreFileName $${id}.mLb.clN.bigWig \
            --outFileName $${id}.mLb.clN.computeMatrix.mat.gz \
            --outFileNameMatrix $${id}.mLb.clN.computeMatrix.vals.mat.tab \
            --numberOfProcessors ${task.resources.cpus}
        rm $${id}.mLb.clN.bigWig $$bed
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: plotprofile
    name: DEEPTOOLS_PLOTPROFILE
    over: {input_id: samples, as: sample}
    max_concurrency: 16
    inputs: [*a_samples, *a_matrix]
    outputs: [*a_plotprofile]
    resources: *multi
    executor: *deeptools
    runtime:
      kind: command
