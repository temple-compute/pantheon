  # BAMTOOLS_FILTER, then for paired-end samples SAMTOOLS_SORT -n,
  # BAM_REMOVE_ORPHANS and SAMTOOLS_SORT. Single-end samples come out of the
  # filter as the final .mLb.clN.sorted.bam; filter_sort copies that one.
  - kind: horus_map
    id: filter
    name: BAMTOOLS_FILTER
    over: {input_id: samples, as: sample}
    max_concurrency: 16
    inputs: [*a_samples, *a_markdup, *a_md_index, *a_include_bed, *a_nfcore]
    outputs: [*a_filter]
    resources: *multi
    executor: *bamtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${filter} && mkdir -p ${filter} && cd ${filter}
        b=$${id}.mLb.mkD.sorted.bam; bed=$$(basename ${include_bed}/*.bed)
        if [ $$single_end = true ]; then
            args="-F 0x004 -F 0x0400 -q 1"; prefix=$${id}.mLb.clN.sorted; config=bamtools_filter_se.json
        else
            args="-F 0x004 -F 0x0008 -f 0x001 -F 0x0400 -q 1"; prefix=$${id}.mLb.flT.sorted; config=bamtools_filter_pe.json
        fi
        ln -s ${markdup}/*/$$b .; ln -s ${md_index}/*/$$b.bai .; ln -s ${include_bed}/$$bed .; ln -s ${nfcore}/assets/$$config .
        samtools view \
            $$args \
            -L $$bed \
            -b $$b \
            | bamtools filter \
                -out $${prefix}.bam \
                -script $$config
        rm $$b $$b.bai $$bed $$config
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
