        ln -s ${filter}/*/$${id}.mLb.flT.sorted.bam .; ln -s ${reference}/$$ref_fasta $$ref_fasta
        samtools cat \
            --threads ${task.resources.cpus} \
            $${id}.mLb.flT.sorted.bam \
        | \
        samtools sort \
            -n \
            -T $${id}.mLb.flT.name_sorted \
            --threads ${task.resources.cpus} \
            --reference $$ref_fasta \
            -o $${id}.mLb.flT.name_sorted.bam \
