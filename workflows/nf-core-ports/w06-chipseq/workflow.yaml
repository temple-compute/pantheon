kind: horus_workflow
name: nf-core chipseq

# Native port of nf-core/chipseq 2.1.0, the route `-profile test,docker` runs:
# BWA alignment, Picard merge and MarkDuplicates, BAMTools filtering, Picard
# metrics, phantompeakqualtools, bigWigs and deepTools, MACS3 broad peaks with
# FRiP and HOMER annotation, consensus peaks with featureCounts and DESeq2 QC,
# an IGV session and MultiQC. Preseq is off, as in the test profile. Images,
# rendered command lines (ext.args from conf/modules.config) and per-process
# cpus/memory are the executed ones; the test profile caps every process at
# 2 cpus / 6 GB.
#
# Every command runs under `bash -euo pipefail`, the pipeline's process.shell:
# each command writes its script to /tmp/.command.sh and runs that with bash,
# as .command.run does. Inputs are linked into the output folder under the
# names Nextflow stages them with, the command runs there, and the links are
# removed, so tool headers and MultiQC sample names match.
#
# Per-library, per-sample, per-IP and per-antibody processes are horus_map
# stages over folders of meta files (bash-sourceable, named by id). Map slots
# are numbered, so every output file carries the id and a downstream stage
# finds its inputs as <upstream>/*/<id>.<suffix>. The empty-peaks filter and
# the consensus grouping are a decision task (scripts/decide.py).

max_concurrency: 16

_target: &target
  kind: local

# Run on a remote node instead: point every task at this anchor.
# _target: &target
#   kind: ssh
#   host: bench-node.example.org
#   username: ubuntu
#   working_directory: /home/ubuntu/horus

# Containers (.command.run docker lines); `user: host` runs them as the
# calling user, as nf-core's `-u $(id -u):$(id -g)` does.
_img:
  python: &python {kind: docker, user: host, image: "quay.io/biocontainers/python:3.8.3"}
  perl: &perl {kind: docker, user: host, image: "quay.io/biocontainers/perl:5.26.2"}
  samtools: &samtools {kind: docker, user: host, image: "quay.io/biocontainers/samtools:1.20--h50ea8bc_0"}
  bedtools: &bedtools {kind: docker, user: host, image: "quay.io/biocontainers/bedtools:2.30.0--hc088bd4_0"}
  bwa: &bwa {kind: docker, user: host, image: "quay.io/biocontainers/bwa:0.7.18--he4a0461_0"}
  khmer: &khmer {kind: docker, user: host, image: "quay.io/biocontainers/khmer:3.0.0a3--py37haa7609a_2"}
  fastqc: &fastqc {kind: docker, user: host, image: "quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0"}
  trimgalore: &trimgalore {kind: docker, user: host, image: "quay.io/biocontainers/trim-galore:0.6.7--hdfd78af_0"}
  bwamem: &bwamem {kind: docker, user: host, image: "quay.io/biocontainers/mulled-v2-fe8faa35dbf6dc65a0f7f5d4ea12e31a79f73e40:1bd8542a8a0b42e0981337910954371d0230828e-0"}
  picard: &picard {kind: docker, user: host, image: "quay.io/biocontainers/picard:3.2.0--hdfd78af_0"}
  bamtools: &bamtools {kind: docker, user: host, image: "quay.io/biocontainers/mulled-v2-0560a8046fc82aa4338588eca29ff18edab2c5aa:5687a7da26983502d0a8a9a6b05ed727c740ddc4-0"}
  orphans: &orphans {kind: docker, user: host, image: "quay.io/biocontainers/mulled-v2-57736af1eb98c01010848572c9fec9fff6ffaafd:402e865b8f6af2f3e58c6fc8d57127ff0144b2c7-0"}
  phantom: &phantom {kind: docker, user: host, image: "community.wave.seqera.io/library/phantompeakqualtools:1.2.2--f8026fe2526a5e18"}
  rbase: &rbase {kind: docker, user: host, image: "community.wave.seqera.io/library/r-base:4.3.3--14bb33ac537aea22"}
  ucsc: &ucsc {kind: docker, user: host, image: "quay.io/biocontainers/ucsc-bedgraphtobigwig:445--h954228d_0"}
  deeptools: &deeptools {kind: docker, user: host, image: "quay.io/biocontainers/deeptools:3.5.5--pyhdfd78af_0"}
  macs3: &macs3 {kind: docker, user: host, image: "quay.io/biocontainers/macs3:3.0.1--py311h0152c62_3"}
  frip: &frip {kind: docker, user: host, image: "quay.io/biocontainers/mulled-v2-8186960447c5cb2faa697666dc1e6d919ad23f3e:3127fcae6b6bdaf8181e21a26ae61231030a9fcb-0"}
  nfubuntu: &nfubuntu {kind: docker, user: host, image: "quay.io/nf-core/ubuntu:20.04"}
  homer: &homer {kind: docker, user: host, image: "quay.io/biocontainers/homer:4.11--pl526hc9558a2_3"}
  plotr: &plotr {kind: docker, user: host, image: "quay.io/biocontainers/mulled-v2-ad9dd5f398966bf899ae05f8e7c54d0fb10cdfa7:05678da05b8e5a7a5130e90a9f9a6c585b965afa-0"}
  consensus: &consensus {kind: docker, user: host, image: "quay.io/biocontainers/mulled-v2-2f48cc59b03027e31ead6d383fe1b8057785dd24:5d182f583f4696f4c4d9f3be93052811b383341f-0"}
  subread: &subread {kind: docker, user: host, image: "quay.io/biocontainers/subread:2.0.1--hed695b0_0"}
  ubuntu: &ubuntu {kind: docker, user: host, image: "docker.io/library/ubuntu:20.04"}
  deseq2: &deseq2 {kind: docker, user: host, image: "quay.io/biocontainers/mulled-v2-8849acf39a43cdd6c839a369a74c0adc823e2f91:ab110436faf952a33575c64dd74615a84011450b-0"}
  multiqc: &multiqc {kind: docker, user: host, image: "quay.io/biocontainers/multiqc:1.23--pyhdfd78af_0"}

# Labels after the test profile's max_cpus / max_memory (trace.txt cpus / memory).
_res:
  single: &single {cpus: 1, memory_gb: 6, walltime: "04:00:00"}
  multi: &multi {cpus: 2, memory_gb: 6, walltime: "04:00:00"}
  long: &long {cpus: 1, memory_gb: 6, walltime: "06:00:00"}

