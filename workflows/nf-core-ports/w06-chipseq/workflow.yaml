            --outFileNameData $${id}.mLb.clN.plotProfile.tab
        rm $${id}.mLb.clN.computeMatrix.mat.gz
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: plotheatmap
    name: DEEPTOOLS_PLOTHEATMAP
    over: {input_id: samples, as: sample}
    max_concurrency: 16
    inputs: [*a_samples, *a_matrix]
