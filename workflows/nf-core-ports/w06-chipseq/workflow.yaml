  # ---------------------------------------------------------------- per merged sample
  # One library: the module links it (ln -s); here it is copied, so the
  # folder holds no link into another task's output.
  - kind: horus_map
    id: merge
    name: PICARD_MERGESAMFILES
    over: {input_id: samples, as: sample}
    max_concurrency: 16
    inputs: [*a_samples, *a_lib_sort]
    outputs: [*a_merge]
    resources: *multi
    executor: *picard
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${merge} && mkdir -p ${merge} && cd ${merge}
        set -- $$(for l in $$libs; do echo $$l.Lb.sorted.bam; done | sort)
        if [ $$# -gt 1 ]; then
        for b in "$$@"; do ln -s ${lib_sort}/*/$$b .; done
        picard \
            -Xmx$$(( ${task.resources.memory_gb} * 1024 * 8 / 10 ))M \
            MergeSamFiles \
            --SORT_ORDER coordinate --VALIDATION_STRINGENCY LENIENT --TMP_DIR tmp \
            $$(printf -- '--INPUT %s ' "$$@") \
            --OUTPUT $${id}.mLb.sorted.bam
        rm "$$@"; rm -rf tmp
        else
        cp ${lib_sort}/*/$$1 $${id}.mLb.sorted.bam
        fi
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: markdup
    name: PICARD_MARKDUPLICATES
    over: {input_id: samples, as: sample}
