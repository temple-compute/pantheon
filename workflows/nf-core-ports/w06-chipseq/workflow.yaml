        samtools sort -n -@ ${task.resources.cpus} -o $${id}.mLb.clN.name.sorted.bam -T $${id}.mLb.clN.name.sorted $${id}.mLb.flT.name_sorted.bam
        bampe_rm_orphan.py $${id}.mLb.clN.name.sorted.bam $${id}.mLb.clN.bam --only_fr_pairs
