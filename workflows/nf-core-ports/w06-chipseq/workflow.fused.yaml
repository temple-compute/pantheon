      # DEEPTOOLS_PLOTHEATMAP
      . ${deeptools_profile}/computematrix/meta.env
      rm -rf ${deeptools_profile}/plotheatmap && mkdir -p ${deeptools_profile}/plotheatmap && cd ${deeptools_profile}/plotheatmap && cp ${deeptools_profile}/computematrix/meta.env .
      ln -s ${deeptools_profile}/computematrix/$${id}.mLb.clN.computeMatrix.mat.gz .
