    kind: local
- kind: horus_map
  id: annotate_boolean_peaks
  name: ANNOTATE_BOOLEAN_PEAKS
  over:
    input_id: homer_consensus
    as: antibody
  chain: true
  zip:
  - input_id: consensus
    as: consensus_item
  max_concurrency: 16
  inputs:
  - id: consensus
    name: Consensus peaks
    kind: folder
    path: results/bwa/merged_library/macs3/broad_peak/consensus/peaks/
  - id: homer_consensus
    name: HOMER consensus annotation
    kind: folder
    path: results/bwa/merged_library/macs3/broad_peak/consensus/annotation/
  outputs:
  - id: boolean_annot
    name: Annotated boolean consensus
    kind: folder
    path: results/bwa/merged_library/macs3/broad_peak/consensus/boolean/
  resources:
    cpus: 2
    memory_gb: 6
    walltime: 04:00:00
  executor:
    kind: docker
    user: host
    image: docker.io/library/ubuntu:20.04
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      . ${antibody}/meta.env; prefix=$${ab}.consensus_peaks
      rm -rf ${boolean_annot} && mkdir -p ${boolean_annot} && cd ${boolean_annot} && cp ${antibody}/meta.env .
      if ls ${antibody}/$${prefix}.annotatePeaks.txt > /dev/null 2>&1; then
      ln -s ${consensus_item}/$${prefix}.boolean.txt .; ln -s ${antibody}/$${prefix}.annotatePeaks.txt .
      cut -f2- $${prefix}.annotatePeaks.txt | awk 'NR==1; NR > 1 {print $$0 | "sort -T '.' -k1,1 -k2,2n"}' | cut -f6- > tmp.txt
      paste $${prefix}.boolean.txt tmp.txt > $${prefix}.boolean.annotatePeaks.txt
      rm tmp.txt $${prefix}.boolean.txt $${prefix}.annotatePeaks.txt
      fi
      NF
      exec bash -euo pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_map
  id: featurecounts
  name: SUBREAD_FEATURECOUNTS
  over:
    input_id: consensus
    as: antibody
  chain: true
  max_concurrency: 16
  inputs:
  - id: consensus
    name: Consensus peaks
    kind: folder
    path: results/bwa/merged_library/macs3/broad_peak/consensus/peaks/
  - id: clean_chain
    name: Filtered BAM sort, index and stats
    kind: folder
    path: results/bwa/merged_library/clean_chain/
  - id: ips
    name: IP samples
    kind: folder
    path: work/lists/ips/
  outputs:
  - id: featurecounts
    name: featureCounts
    kind: folder
    path: results/bwa/merged_library/macs3/broad_peak/consensus/featurecounts/
  resources:
    cpus: 2
    memory_gb: 6
    walltime: 04:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/subread:2.0.1--hed695b0_0
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      . ${antibody}/meta.env; prefix=$${ab}.consensus_peaks
      rm -rf ${featurecounts} && mkdir -p ${featurecounts} && cd ${featurecounts} && cp ${antibody}/meta.env .
      if ls ${antibody}/$${prefix}.saf > /dev/null 2>&1; then
      single_end=$$(. ${ips}/$${bams%% *}; echo $$single_end)
      set -- $$(for i in $$bams; do echo $$i.mLb.clN.sorted.bam; done | sort)
      for b in "$$@"; do ln -s ${clean_chain}/*/filter_sort/$$b .; done; ln -s ${antibody}/$${prefix}.saf .
      paired_end="-p"; [ $$single_end = true ] && paired_end=""
      featureCounts \
          -F SAF -O --fracOverlap 0.2 \
          $$paired_end \
          -T ${task.resources.cpus} \
          -a $${prefix}.saf \
          -s 0 \
          -o $${prefix}.featureCounts.txt \
          "$$@"
      rm "$$@" $${prefix}.saf
      fi
      NF
      exec bash -euo pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_map
  id: deseq2_qc
  name: DESEQ2_QC
  over:
    input_id: featurecounts
    as: antibody
  chain: true
  max_concurrency: 16
  inputs:
  - id: antibodies
    name: Antibodies
    kind: folder
    path: work/lists/antibodies/
  - id: featurecounts
    name: featureCounts
    kind: folder
    path: results/bwa/merged_library/macs3/broad_peak/consensus/featurecounts/
  - id: nfcore
    name: nf-core/chipseq files
    kind: folder
    path: nfcore/
  outputs:
  - id: deseq2
    name: DESeq2 QC
    kind: folder
    path: results/bwa/merged_library/macs3/broad_peak/consensus/deseq2/
  resources:
    cpus: 2
    memory_gb: 6
    walltime: 04:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/mulled-v2-8849acf39a43cdd6c839a369a74c0adc823e2f91:ab110436faf952a33575c64dd74615a84011450b-0
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      export PATH="${nfcore}/bin:$$PATH"
      . ${antibody}/meta.env; prefix=$${ab}.consensus_peaks; h=${nfcore}/assets/multiqc
      rm -rf ${deseq2} && mkdir -p ${deseq2} && cd ${deseq2} && cp ${antibody}/meta.env .
      if [ $$multiple_groups = true ] && [ $$replicates_exist = true ]; then
      # task.index: this antibody's place among the antibodies that run DESeq2
      index=$$(for f in ${antibodies}/*; do (. $$f; [ $$multiple_groups = true ] && [ $$replicates_exist = true ] && basename $$f); done | sort | grep -nx "$$ab" | cut -d: -f1)
      ln -s ${antibody}/$${prefix}.featureCounts.txt .; ln -s $$h/deseq2_pca_header.txt .; ln -s $$h/deseq2_clustering_header.txt .
      deseq2_qc.r \
          --count_file $${prefix}.featureCounts.txt \
          --outdir ./ \
          --outprefix $$prefix \
          --cores ${task.resources.cpus} \
          --id_col 1 --sample_suffix '.mLb.clN.sorted.bam' --count_col 7 --vst TRUE

      sed "s/deseq2_pca/deseq2_pca_$$index/g" <deseq2_pca_header.txt >tmp.txt
      sed -i -e "s/DESeq2 /$$ab DESeq2 /g" tmp.txt
      cat tmp.txt $${prefix}.pca.vals.txt > $${prefix}.pca.vals_mqc.tsv

      sed "s/deseq2_clustering/deseq2_clustering_$$index/g" <deseq2_clustering_header.txt >tmp.txt
      sed -i -e "s/DESeq2 /$$ab DESeq2 /g" tmp.txt
      cat tmp.txt $${prefix}.sample.dists.txt > $${prefix}.sample.dists_mqc.tsv
      rm tmp.txt $${prefix}.featureCounts.txt deseq2_pca_header.txt deseq2_clustering_header.txt
      fi
      NF
      exec bash -euo pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: igv
  name: IGV
  inputs:
  - id: bigwig
    name: bigWig
    kind: folder
    path: results/bwa/merged_library/bigwig/tracks/
  - id: peak_pass
    name: IP samples with peaks
    kind: folder
    path: work/lists/peak_pass/
  - id: macs3
    name: MACS3 peaks
    kind: folder
    path: results/bwa/merged_library/macs3/broad_peak/peaks/
  - id: consensus
    name: Consensus peaks
    kind: folder
    path: results/bwa/merged_library/macs3/broad_peak/consensus/peaks/
  - id: reference
    name: Reference files
    kind: folder
    path: work/reference/
  - id: nfcore
    name: nf-core/chipseq files
    kind: folder
    path: nfcore/
  outputs:
  - id: igv
    name: IGV session
    kind: folder
    path: results/igv/broad_peak/
  resources:
    cpus: 1
    memory_gb: 6
    walltime: 04:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/python:3.8.3
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      export PATH="${nfcore}/bin:$$PATH"
      . ${reference}/refs.env
      rm -rf ${igv} && mkdir -p ${igv} && cd ${igv}
      d=bwa/merged_library
      mkdir -p $$d/bigwig $$d/macs3/broad_peak/consensus mappings
      for f in ${bigwig}/*/*.bigWig; do ln -s $$f $$d/bigwig/; done
      for i in $$(ls ${peak_pass}); do ln -s ${macs3}/*/$${i}_peaks.broadPeak $$d/macs3/broad_peak/; done
      for f in ${consensus}/*/*.consensus_peaks.bed; do [ -e "$$f" ] && ln -s $$f $$d/macs3/broad_peak/consensus/; done
      for f in ${consensus}/*/*.antibody.txt; do [ -e "$$f" ] && ln -s $$f mappings/; done
      ln -s ${reference}/$$ref_fasta $$ref_fasta
      find * -type l -name "*.bigWig" -exec echo -e ""{}"\t0,0,178" \; > bigwig.igv.txt
      find * -type l -name "*Peak" -exec echo -e ""{}"\t0,0,178" \; > peaks.igv.txt
      # Avoid error when consensus not produced
      find * -type l -name "*.bed" -exec echo -e ""{}"\t0,0,178" \; | { grep "^bwa/merged_library/macs3/broad_peak/consensus/*" || test $$? = 1; } > consensus.igv.txt

      touch replace_paths.txt
      if [ -d "mappings" ]; then
          cat mappings/* > replace_paths.txt
      fi

      cat *.igv.txt > igv_files_orig.txt
      igv_files_to_session.py igv_session.xml igv_files_orig.txt replace_paths.txt ../../genome/$$ref_fasta --path_prefix '../../'
      rm -r bwa mappings; rm $$ref_fasta
      NF
      exec bash -euo pipefail /tmp/.command.sh
