# Generated by tools/gen_fused.py from workflow.chained.yaml; do not edit by hand.
# Same images and commands; 17 same-image per-item steps run as 4 maps:
# 40 tasks instead of 53.
kind: horus_workflow
name: nf-core chipseq chained fused
max_concurrency: 16
artifacts:
- id: samplesheet
  name: Samplesheet
  kind: file
  path: examples/samplesheet.csv
  description: 'nf-core/chipseq samplesheet (sample,fastq_1,fastq_2,replicate,antibody,control,control_replicate). Reads may be URLs or paths relative to the samplesheet. Default: the test profile samplesheet (two SPT5 time points, two replicates each, with input controls).'
- id: nfcore
  name: nf-core/chipseq files
  kind: folder
  path: nfcore/
  description: nf-core/chipseq 2.1.0 bin/ scripts and assets (MIT).
- id: stage_py
  name: Staging script
  kind: file
  path: scripts/stage_inputs.py
  description: Fetches the reference and reads and writes the library and sample lists.
- id: decide_py
  name: Decision script
  kind: file
  path: scripts/decide.py
  description: The pipeline's Groovy-side peak decisions as a script.
- id: input_mirror
  name: Local input mirror
  kind: string
  path: params/input_mirror.txt
  description: Folder searched for each input file by name before downloading it (e.g. a local copy of the test data). Empty downloads everything.
  value: ''
  pattern: '[^"`$\\]*'
- id: fasta_url
  name: Genome fasta
  kind: string
  path: params/fasta_url.txt
  pattern: '[^"`$\\]*'
  description: --fasta (plain fasta)
  value: https://raw.githubusercontent.com/nf-core/test-datasets/cd022b097372b078a68d8afadb172ad7342fd91f/reference/genome.fa
- id: gtf_url
  name: GTF
  kind: string
  path: params/gtf_url.txt
  pattern: '[^"`$\\]*'
  description: --gtf (plain GTF)
  value: https://raw.githubusercontent.com/nf-core/test-datasets/cd022b097372b078a68d8afadb172ad7342fd91f/reference/genes.gtf
- id: read_length
  name: Read length
  kind: number
  path: params/read_length.json
  value: 50
  min: 1
  description: --read_length (k-mer size for the MACS3 genome size)
- id: fingerprint_bins
  name: Fingerprint bins
  kind: number
  path: params/fingerprint_bins.json
  value: 100
  min: 1
  description: --fingerprint_bins
- id: min_reps_consensus
  name: Min replicates for consensus
  kind: number
  path: params/min_reps_consensus.json
  value: 1
  min: 1
  description: --min_reps_consensus
tasks:
- kind: horus_task
  id: fetch_reference
  name: Fetch reference files
  description: Downloads the genome fasta and GTF (or copies them from the mirror).
  inputs:
  - id: stage_py
    name: Staging script
    kind: file
    path: scripts/stage_inputs.py
  - id: input_mirror
    name: Local input mirror
    kind: string
    path: params/input_mirror.txt
  - id: fasta_url
    name: Genome fasta
    kind: string
    path: params/fasta_url.txt
  - id: gtf_url
    name: GTF
    kind: string
    path: params/gtf_url.txt
  outputs:
  - id: reference
    name: Reference files
    kind: folder
    path: work/reference/
  executor:
    kind: shell
  runtime:
    kind: python_script
    script: scripts/stage_inputs.py
    python: python3
    args: reference --fasta ${fasta_url} --gtf ${gtf_url} --mirror ${input_mirror} --out ${reference}
  target:
    kind: local
- kind: horus_task
  id: samplesheet_check
  name: SAMPLESHEET_CHECK
  inputs:
  - id: samplesheet
    name: Samplesheet
    kind: file
    path: examples/samplesheet.csv
  - id: nfcore
    name: nf-core/chipseq files
    kind: folder
    path: nfcore/
  outputs:
  - id: pipeline_info
    name: Checked samplesheet
    kind: folder
    path: results/pipeline_info/
  resources:
    cpus: 1
    memory_gb: 6
    walltime: 04:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/python:3.8.3
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      export PATH="${nfcore}/bin:$$PATH"
      rm -rf ${pipeline_info} && mkdir -p ${pipeline_info} && cd ${pipeline_info}
      ln -s ${samplesheet} $$(basename ${samplesheet})
      check_samplesheet.py \
          $$(basename ${samplesheet}) \
          samplesheet.valid.csv
      rm $$(basename ${samplesheet})
      NF
      exec bash -euo pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: stage_samples
  name: Split the samplesheet into libraries
  description: Fetches each library's reads and writes the library, sample and IP lists.
  inputs:
  - id: stage_py
    name: Staging script
    kind: file
    path: scripts/stage_inputs.py
  - id: samplesheet
    name: Samplesheet
    kind: file
    path: examples/samplesheet.csv
  - id: pipeline_info
    name: Checked samplesheet
    kind: folder
    path: results/pipeline_info/
  - id: input_mirror
    name: Local input mirror
    kind: string
    path: params/input_mirror.txt
  outputs:
  - id: reads
    name: Reads
    kind: folder
    path: work/reads/
  - id: libs
    name: Libraries
    kind: folder
    path: work/lists/libs/
  - id: samples
    name: Samples
    kind: folder
    path: work/lists/samples/
  - id: ips
    name: IP samples
    kind: folder
    path: work/lists/ips/
  executor:
    kind: shell
  runtime:
    kind: python_script
    script: scripts/stage_inputs.py
    python: python3
    args: samples --samplesheet ${pipeline_info}/samplesheet.valid.csv --origin ${samplesheet} --mirror ${input_mirror} --reads ${reads} --libs ${libs} --samples ${samples} --ips ${ips}
  target:
    kind: local
- kind: horus_task
  id: gtf2bed
  name: GTF2BED
  inputs:
  - id: reference
    name: Reference files
    kind: folder
    path: work/reference/
  - id: nfcore
    name: nf-core/chipseq files
    kind: folder
    path: nfcore/
  outputs:
  - id: gene_bed
    name: Gene BED
    kind: folder
    path: work/genome/gene_bed/
  resources:
    cpus: 2
    memory_gb: 6
    walltime: 04:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/perl:5.26.2
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      export PATH="${nfcore}/bin:$$PATH"
      . ${reference}/refs.env
      rm -rf ${gene_bed} && mkdir -p ${gene_bed} && cd ${gene_bed}
      ln -s ${reference}/$$ref_gtf $$ref_gtf
      gtf2bed \
          $$ref_gtf \
          > $${ref_gtf%.*}.bed
      rm $$ref_gtf
      NF
      exec bash -euo pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: getchromsizes
  name: CUSTOM_GETCHROMSIZES
  inputs:
  - id: reference
    name: Reference files
    kind: folder
    path: work/reference/
  outputs:
  - id: chromsizes
    name: Fasta index and chrom sizes
    kind: folder
    path: results/genome/
  resources:
    cpus: 1
    memory_gb: 6
    walltime: 04:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/samtools:1.20--h50ea8bc_0
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      . ${reference}/refs.env
      rm -rf ${chromsizes} && mkdir -p ${chromsizes} && cd ${chromsizes}
      ln -s ${reference}/$$ref_fasta $$ref_fasta
      samtools faidx $$ref_fasta
      cut -f 1,2 $$ref_fasta.fai > $$ref_fasta.sizes
      rm $$ref_fasta
      NF
      exec bash -euo pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: blacklist_regions
  name: GENOME_BLACKLIST_REGIONS
  inputs:
  - id: chromsizes
    name: Fasta index and chrom sizes
    kind: folder
    path: results/genome/
  outputs:
  - id: include_bed
    name: Include regions
    kind: folder
    path: work/genome/include_regions/
  resources:
    cpus: 1
    memory_gb: 6
    walltime: 04:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/bedtools:2.30.0--hc088bd4_0
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      rm -rf ${include_bed} && mkdir -p ${include_bed} && cd ${include_bed}
      sizes=$$(basename ${chromsizes}/*.sizes)
      ln -s ${chromsizes}/$$sizes $$sizes
      awk '{print $$1, '0' , $$2}' OFS='\t' $$sizes > $${sizes%%.*}.include_regions.bed
      rm $$sizes
      NF
      exec bash -euo pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: bwa_index
  name: BWA_INDEX
  inputs:
  - id: reference
    name: Reference files
    kind: folder
    path: work/reference/
  outputs:
  - id: bwa_index
    name: BWA index
    kind: folder
    path: work/genome/bwa_index/
  resources:
    cpus: 1
    memory_gb: 6
    walltime: 04:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/bwa:0.7.18--he4a0461_0
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      . ${reference}/refs.env
      rm -rf ${bwa_index} && mkdir -p ${bwa_index} && cd ${bwa_index}
      ln -s ${reference}/$$ref_fasta $$ref_fasta
      mkdir bwa
      bwa \
          index \
           \
          -p bwa/$${ref_fasta%.*} \
          $$ref_fasta
      rm $$ref_fasta
      NF
      exec bash -euo pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: khmer
  name: KHMER_UNIQUEKMERS
  inputs:
  - id: reference
    name: Reference files
    kind: folder
    path: work/reference/
  - id: read_length
    name: Read length
    kind: number
    path: params/read_length.json
  outputs:
  - id: kmers
    name: Unique k-mers
    kind: folder
    path: work/genome/khmer/
  resources:
    cpus: 2
    memory_gb: 6
    walltime: 04:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/khmer:3.0.0a3--py37haa7609a_2
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      . ${reference}/refs.env
      rm -rf ${kmers} && mkdir -p ${kmers} && cd ${kmers}
      ln -s ${reference}/$$ref_fasta $$ref_fasta
      unique-kmers.py \
          -k ${read_length} \
          -R report.txt \
           \
          $$ref_fasta

      grep ^number report.txt | sed 's/^.*:.[[:blank:]]//g' > kmers.txt
      rm $$ref_fasta
      NF
      exec bash -euo pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_map
  id: fastqc
  name: FASTQC
  over:
    input_id: libs
    as: lib
  max_concurrency: 16
  inputs:
  - id: libs
    name: Libraries
    kind: folder
    path: work/lists/libs/
  - id: reads
    name: Reads
    kind: folder
    path: work/reads/
  outputs:
  - id: fastqc
    name: FastQC
    kind: folder
    path: results/fastqc/
  resources:
    cpus: 2
    memory_gb: 6
    walltime: 04:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      id=$$(basename ${lib}); . ${lib}
      rm -rf ${fastqc} && mkdir -p ${fastqc} && cd ${fastqc}
      set -- $$(sed "s#^#${reads}/$$id/#" ${reads}/$$id/reads.txt)
      pairs=""; names=""; i=0
      for f in "$$@"; do
          i=$$((i + 1)); ln -s $$f $$(basename $$f)
          if [ $$# -eq 1 ]; then new=$${id}.$${f##*.}; else new=$${id}_$$i.$${f##*.}; fi
          pairs="$$pairs $$(basename $$f) $$new"; names="$$names $$new"
      done
      printf "%s %s\n" $$pairs | while read old_name new_name; do
          [ -f "$${new_name}" ] || ln -s $$old_name $$new_name
      done
      fastqc \
          --quiet \
          --threads ${task.resources.cpus} \
          --memory $$(( ${task.resources.memory_gb} * 1024 )) \
          $${names# }
      rm $$names; for f in "$$@"; do rm $$(basename $$f); done
      NF
      exec bash -euo pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_map
  id: trimgalore
  name: TRIMGALORE
  over:
    input_id: libs
    as: lib
  max_concurrency: 16
  inputs:
  - id: libs
    name: Libraries
    kind: folder
    path: work/lists/libs/
  - id: reads
    name: Reads
    kind: folder
    path: work/reads/
  outputs:
  - id: trimgalore
    name: TrimGalore
    kind: folder
    path: results/trimgalore/
  resources:
    cpus: 2
    memory_gb: 6
    walltime: 04:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/trim-galore:0.6.7--hdfd78af_0
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      id=$$(basename ${lib}); . ${lib}
      rm -rf ${trimgalore} && mkdir -p ${trimgalore} && cd ${trimgalore} && { echo id=$$id; cat ${lib}; } > meta.env
      set -- $$(sed "s#^#${reads}/$$id/#" ${reads}/$$id/reads.txt)
      # --cores: task.cpus - 4 (paired) or - 3 (single), clamped to 1..8
      cores=$$(( ${task.resources.cpus} - 4 ))
      [ $$single_end = true ] && cores=$$(( ${task.resources.cpus} - 3 ))
      [ $$cores -lt 1 ] && cores=1
      [ $$cores -gt 8 ] && cores=8
      for f in "$$@"; do ln -s $$f $$(basename $$f); done
      if [ $$single_end = true ]; then
      [ ! -f  $${id}.fastq.gz ] && ln -s $$(basename $$1) $${id}.fastq.gz
      trim_galore \
          --fastqc \
          --cores $$cores \
          --gzip \
          $${id}.fastq.gz
      rm $${id}.fastq.gz
      else
      [ ! -f  $${id}_1.fastq.gz ] && ln -s $$(basename $$1) $${id}_1.fastq.gz
      [ ! -f  $${id}_2.fastq.gz ] && ln -s $$(basename $$2) $${id}_2.fastq.gz
      trim_galore \
          --fastqc \
          --cores $$cores \
          --paired \
          --gzip \
          $${id}_1.fastq.gz \
          $${id}_2.fastq.gz
      rm $${id}_1.fastq.gz $${id}_2.fastq.gz
      fi
      for f in "$$@"; do rm $$(basename $$f); done
      NF
      exec bash -euo pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_map
  id: bwa_mem
  name: BWA_MEM
  over:
    input_id: trimgalore
    as: lib
  chain: true
  max_concurrency: 16
  inputs:
  - id: trimgalore
    name: TrimGalore
    kind: folder
    path: results/trimgalore/
  - id: bwa_index
    name: BWA index
    kind: folder
    path: work/genome/bwa_index/
  outputs:
  - id: bwa_mem
    name: BWA alignments
    kind: folder
    path: work/bwa/library/mem/
  resources:
    cpus: 2
    memory_gb: 6
    walltime: 04:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/mulled-v2-fe8faa35dbf6dc65a0f7f5d4ea12e31a79f73e40:1bd8542a8a0b42e0981337910954371d0230828e-0
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      . ${lib}/meta.env
      rm -rf ${bwa_mem} && mkdir -p ${bwa_mem} && cd ${bwa_mem} && cp ${lib}/meta.env .
      if [ $$single_end = true ]; then set -- ${lib}/$${id}_trimmed.fq.gz
      else set -- ${lib}/$${id}_1_val_1.fq.gz ${lib}/$${id}_2_val_2.fq.gz; fi
      for f in "$$@"; do ln -s $$f $$(basename $$f); done
      ln -s ${bwa_index}/bwa bwa
      INDEX=`find -L ./ -name "*.amb" | sed 's/\.amb$$//'`
      bwa mem \
          -M -R "@RG\tID:$${id}\tSM:$${sample}\tPL:ILLUMINA\tLB:$${id}\tPU:1" \
          -t ${task.resources.cpus} \
          $$INDEX \
          $$(for f in "$$@"; do basename $$f; done) \
          | samtools view -bhS -F 0x0100 -O BAM  --threads ${task.resources.cpus} -o $${id}.Lb.bam -
      rm bwa; for f in "$$@"; do rm $$(basename $$f); done
      NF
      exec bash -euo pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_map
  id: lib_chain
  name: Library BAM sort, index and stats
  description: Runs SAMTOOLS_SORT, SAMTOOLS_INDEX, SAMTOOLS_STATS, SAMTOOLS_FLAGSTAT, SAMTOOLS_IDXSTATS in turn (same image, same commands).
  over:
    input_id: bwa_mem
    as: lib
  chain: true
  max_concurrency: 16
  inputs:
  - id: bwa_mem
    name: BWA alignments
    kind: folder
    path: work/bwa/library/mem/
  - id: reference
    name: Reference files
    kind: folder
    path: work/reference/
  outputs:
  - id: lib_chain
    name: Library BAM sort, index and stats
    kind: folder
    path: work/bwa/library/lib_chain/
  resources:
    cpus: 2
    memory_gb: 6
    walltime: 04:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/samtools:1.20--h50ea8bc_0
  runtime:
    kind: command
    command: |
      cat > /tmp/.command1.sh <<'NF'
      # SAMTOOLS_SORT
      . ${lib}/meta.env; . ${reference}/refs.env
      rm -rf ${lib_chain}/lib_sort && mkdir -p ${lib_chain}/lib_sort && cd ${lib_chain}/lib_sort && cp ${lib}/meta.env .
      ln -s ${lib}/$${id}.Lb.bam .; ln -s ${reference}/$$ref_fasta $$ref_fasta
      samtools cat \
          --threads 2 \
          $${id}.Lb.bam \
      | \
      samtools sort \
           \
          -T $${id}.Lb.sorted \
          --threads 2 \
          --reference $$ref_fasta \
          -o $${id}.Lb.sorted.bam \
          -
      rm $${id}.Lb.bam $$ref_fasta
      NF
      cat > /tmp/.command2.sh <<'NF'
      # SAMTOOLS_INDEX
      . ${lib_chain}/lib_sort/meta.env
      rm -rf ${lib_chain}/lib_index && mkdir -p ${lib_chain}/lib_index && cd ${lib_chain}/lib_index && cp ${lib_chain}/lib_sort/meta.env .
      ln -s ${lib_chain}/lib_sort/$${id}.Lb.sorted.bam .
      samtools \
          index \
          -@ $$(( 2 - 1 )) \
           \
          $${id}.Lb.sorted.bam
      rm $${id}.Lb.sorted.bam
      NF
      cat > /tmp/.command3.sh <<'NF'
      # SAMTOOLS_STATS
      . ${lib_chain}/lib_index/meta.env; . ${reference}/refs.env
      rm -rf ${lib_chain}/lib_stats && mkdir -p ${lib_chain}/lib_stats && cd ${lib_chain}/lib_stats && cp ${lib_chain}/lib_index/meta.env .
      b=$${id}.Lb.sorted.bam
      ln -s ${lib_chain}/lib_sort/$$b .; ln -s ${lib_chain}/lib_index/$$b.bai .; ln -s ${reference}/$$ref_fasta $$ref_fasta
      samtools \
          stats \
          --threads 1 \
          --reference $$ref_fasta \
          $$b \
          > $$b.stats
      rm $$b $$b.bai $$ref_fasta
      NF
      cat > /tmp/.command4.sh <<'NF'
      # SAMTOOLS_FLAGSTAT
      . ${lib_chain}/lib_index/meta.env
      rm -rf ${lib_chain}/lib_flagstat && mkdir -p ${lib_chain}/lib_flagstat && cd ${lib_chain}/lib_flagstat && cp ${lib_chain}/lib_index/meta.env .
      b=$${id}.Lb.sorted.bam
      ln -s ${lib_chain}/lib_sort/$$b .; ln -s ${lib_chain}/lib_index/$$b.bai .
      samtools \
          flagstat \
          --threads 1 \
          $$b \
          > $$b.flagstat
      rm $$b $$b.bai
      NF
      cat > /tmp/.command5.sh <<'NF'
      # SAMTOOLS_IDXSTATS
      . ${lib_chain}/lib_index/meta.env
      rm -rf ${lib_chain}/lib_idxstats && mkdir -p ${lib_chain}/lib_idxstats && cd ${lib_chain}/lib_idxstats && cp ${lib_chain}/lib_index/meta.env .
      b=$${id}.Lb.sorted.bam
      ln -s ${lib_chain}/lib_sort/$$b .; ln -s ${lib_chain}/lib_index/$$b.bai .
      samtools \
          idxstats \
          --threads $$(( 1 - 1 )) \
          $$b \
          > $$b.idxstats
      rm $$b $$b.bai
      NF
      mkdir -p ${lib_chain}
      bash -euo pipefail /tmp/.command1.sh && bash -euo pipefail /tmp/.command2.sh && bash -euo pipefail /tmp/.command3.sh && bash -euo pipefail /tmp/.command4.sh && bash -euo pipefail /tmp/.command5.sh
  target:
    kind: local
- kind: horus_map
  id: merge
  name: PICARD_MERGESAMFILES
  over:
    input_id: samples
    as: sample
  max_concurrency: 16
  inputs:
  - id: samples
    name: Samples
    kind: folder
    path: work/lists/samples/
  - id: lib_chain
    name: Library BAM sort, index and stats
    kind: folder
    path: work/bwa/library/lib_chain/
  outputs:
  - id: merge
    name: Merged libraries
    kind: folder
    path: work/bwa/merged_library/merge/
  resources:
    cpus: 2
    memory_gb: 6
    walltime: 04:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/picard:3.2.0--hdfd78af_0
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      id=$$(basename ${sample}); . ${sample}
      rm -rf ${merge} && mkdir -p ${merge} && cd ${merge} && { echo id=$$id; cat ${sample}; } > meta.env
      set -- $$(for l in $$libs; do echo $$l.Lb.sorted.bam; done | sort)
      if [ $$# -gt 1 ]; then
      for b in "$$@"; do ln -s ${lib_chain}/*/lib_sort/$$b .; done
      picard \
          -Xmx$$(( ${task.resources.memory_gb} * 1024 * 8 / 10 ))M \
          MergeSamFiles \
          --SORT_ORDER coordinate --VALIDATION_STRINGENCY LENIENT --TMP_DIR tmp \
          $$(printf -- '--INPUT %s ' "$$@") \
          --OUTPUT $${id}.mLb.sorted.bam
      rm "$$@"; rm -rf tmp
      else
      cp ${lib_chain}/*/lib_sort/$$1 $${id}.mLb.sorted.bam
      fi
      NF
      exec bash -euo pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_map
  id: markdup
  name: PICARD_MARKDUPLICATES
  over:
    input_id: merge
    as: sample
