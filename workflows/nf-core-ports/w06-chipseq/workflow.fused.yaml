          --outFileNameMatrix $${id}.mLb.clN.plotHeatmap.mat.tab
      rm $${id}.mLb.clN.computeMatrix.mat.gz
      NF
      mkdir -p ${deeptools_profile}
      bash -euo pipefail /tmp/.command1.sh && bash -euo pipefail /tmp/.command2.sh && bash -euo pipefail /tmp/.command3.sh
