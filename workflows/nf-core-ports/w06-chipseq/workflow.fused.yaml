      rm -rf ${deeptools_profile}/computematrix && mkdir -p ${deeptools_profile}/computematrix && cd ${deeptools_profile}/computematrix && cp ${sample}/meta.env .
      ln -s ${sample}/$${id}.mLb.clN.bigWig .; ln -s ${gene_bed}/$$bed .
      computeMatrix \
          scale-regions --regionBodyLength 1000 --beforeRegionStartLength 3000 --afterRegionStartLength 3000 --missingDataAsZero --skipZeros --smartLabels \
          --regionsFileName $$bed \
          --scoreFileName $${id}.mLb.clN.bigWig \
          --outFileName $${id}.mLb.clN.computeMatrix.mat.gz \
          --outFileNameMatrix $${id}.mLb.clN.computeMatrix.vals.mat.tab \
          --numberOfProcessors 2
      rm $${id}.mLb.clN.bigWig $$bed
      NF
      cat > /tmp/.command2.sh <<'NF'
      # DEEPTOOLS_PLOTPROFILE
      . ${deeptools_profile}/computematrix/meta.env
      rm -rf ${deeptools_profile}/plotprofile && mkdir -p ${deeptools_profile}/plotprofile && cd ${deeptools_profile}/plotprofile && cp ${deeptools_profile}/computematrix/meta.env .
      ln -s ${deeptools_profile}/computematrix/$${id}.mLb.clN.computeMatrix.mat.gz .
      plotProfile \
           \
          --matrixFile $${id}.mLb.clN.computeMatrix.mat.gz \
          --outFileName $${id}.mLb.clN.plotProfile.pdf \
          --outFileNameData $${id}.mLb.clN.plotProfile.tab
      rm $${id}.mLb.clN.computeMatrix.mat.gz
      NF
