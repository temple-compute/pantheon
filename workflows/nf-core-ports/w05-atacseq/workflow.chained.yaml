        . ${lib}/meta.env
        rm -rf ${mlb_md_idxstats} && mkdir -p ${mlb_md_idxstats} && cd ${mlb_md_idxstats} && cp ${lib}/meta.env .
        bam=$${id}.mLb.mkD.sorted.bam
