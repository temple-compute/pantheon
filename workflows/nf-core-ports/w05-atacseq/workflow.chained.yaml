  - kind: horus_map
    id: mlb_fingerprint
    name: MERGED_LIBRARY_DEEPTOOLS_PLOTFINGERPRINT
    over: {input_id: mlb_clean_index, as: lib}
    chain: true
    zip: [{input_id: mlb_filter, as: mlb_filter_item}, {input_id: mlb_clean_sort, as: mlb_clean_sort_item}]
    max_concurrency: 16
    inputs: [*a_mlb_filter, *a_mlb_clean_sort, *a_mlb_clean_index, *a_fingerprint_bins, *a_fragment_size]
    outputs: [*a_mlb_fingerprint]
    resources: *multi
    executor: *deeptools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${lib}/meta.env
        rm -rf ${mlb_fingerprint} && mkdir -p ${mlb_fingerprint} && cd ${mlb_fingerprint} && cp ${lib}/meta.env .
        if [ $$single_end = true ]; then src=${mlb_filter_item}; else src=${mlb_clean_sort_item}; fi
        bam=$${id}.mLb.clN.sorted.bam
        ln -s $$src/$$bam $$bam; ln -s ${lib}/$$bam.bai $$bam.bai
        extend=''
        if [ $$single_end = true ] && [ ${fragment_size} -gt 0 ]; then extend="--extendReads ${fragment_size}"; fi
        prefix=$${id}.mLb.clN
        plotFingerprint \
            --skipZeros --numberOfSamples ${fingerprint_bins} --labels $${id}.mLb.clN \
            $$extend \
            --bamfiles $$bam \
