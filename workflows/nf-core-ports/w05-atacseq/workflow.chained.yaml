  trimgalore: &trimgalore {kind: docker, user: host, image: "quay.io/biocontainers/trim-galore:0.6.7--hdfd78af_0"}
  picard: &picard {kind: docker, user: host, image: "quay.io/biocontainers/picard:3.0.0--hdfd78af_1"}
  bamtools: &bamtools {kind: docker, user: host, image: "quay.io/biocontainers/mulled-v2-0560a8046fc82aa4338588eca29ff18edab2c5aa:5687a7da26983502d0a8a9a6b05ed727c740ddc4-0"}
