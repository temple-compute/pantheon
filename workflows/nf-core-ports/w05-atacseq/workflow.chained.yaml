  - kind: horus_map
    id: mlb_genomecov
    name: MERGED_LIBRARY_BAM_TO_BIGWIG BEDTOOLS_GENOMECOV
    over: {input_id: mlb_flagstat, as: lib}
    chain: true
    zip: [{input_id: mlb_filter, as: mlb_filter_item}, {input_id: mlb_clean_sort, as: mlb_clean_sort_item}]
    max_concurrency: 16
    inputs: [*a_mlb_filter, *a_mlb_clean_sort, *a_mlb_flagstat, *a_fragment_size]
    outputs: [*a_mlb_genomecov]
    resources: *multi
    executor: *bedtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${lib}/meta.env
        rm -rf ${mlb_genomecov} && mkdir -p ${mlb_genomecov} && cd ${mlb_genomecov} && cp ${lib}/meta.env .
        if [ $$single_end = true ]; then src=${mlb_filter_item}; else src=${mlb_clean_sort_item}; fi
        bam=$${id}.mLb.clN.sorted.bam
        ln -s $$src/$$bam $$bam; ln -s ${lib}/$$bam.flagstat $$bam.flagstat
        prefix=$${id}.mLb.clN
        if [ $$single_end = true ]; then pe=''; [ ${fragment_size} -gt 0 ] && args="-fs ${fragment_size}" || args=''; else pe='-pc'; args=''; fi
        SCALE_FACTOR=$$(grep '[0-9] mapped (' $$bam.flagstat | awk '{print 1000000/$$1}')
        echo $$SCALE_FACTOR > $${prefix}.scale_factor.txt

        bedtools \
            genomecov \
            -ibam $$bam \
            -bg \
            -scale $$SCALE_FACTOR \
            $$pe \
            $$args \
        > tmp.bg

        bedtools sort -i tmp.bg > $${prefix}.bedGraph
        rm tmp.bg $$bam $$bam.flagstat
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: mlb_bigwig
    name: MERGED_LIBRARY_BAM_TO_BIGWIG UCSC_BEDGRAPHTOBIGWIG
