        rm -rf ${mrp_stats} && mkdir -p ${mrp_stats} && cd ${mrp_stats} && cp ${rep}/meta.env .
        bam=$${id}.mRp.clN.sorted.bam
        ln -s ${mrp_markdup_item}/$$bam $$bam; ln -s ${rep}/$$bam.bai $$bam.bai; ln -s ${reference}/$$ref_fasta $$ref_fasta
        samtools \
            stats \
            --threads ${task.resources.cpus} \
            --reference $$ref_fasta \
            $$bam \
            > $$bam.stats
        rm $$bam $$bam.bai $$ref_fasta
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: mrp_flagstat
    name: MERGED_REPLICATE_MARKDUPLICATES_PICARD SAMTOOLS_FLAGSTAT
    over: {input_id: mrp_index, as: rep}
    chain: true
    zip: [{input_id: mrp_markdup, as: mrp_markdup_item}]
