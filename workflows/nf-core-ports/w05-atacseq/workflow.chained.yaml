  - kind: horus_map
    id: mlb_macs2
    name: MERGED_LIBRARY_CALL_ANNOTATE_PEAKS MACS2_CALLPEAK
    over: {input_id: mlb_clean_index, as: lib}
    chain: true
    zip: [{input_id: mlb_filter, as: mlb_filter_item}, {input_id: mlb_clean_sort, as: mlb_clean_sort_item}]
    max_concurrency: 16
    inputs: [*a_mlb_filter, *a_mlb_clean_sort, *a_mlb_clean_index, *a_gsize, *a_broad_cutoff]
    outputs: [*a_mlb_macs2]
    resources: *multi
    executor: *macs2
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${lib}/meta.env
        rm -rf ${mlb_macs2} && mkdir -p ${mlb_macs2} && cd ${mlb_macs2} && cp ${lib}/meta.env .
        if [ $$single_end = true ]; then src=${mlb_filter_item}; format=BAM; else src=${mlb_clean_sort_item}; format=BAMPE; fi
        bam=$${id}.mLb.clN.sorted.bam
        ln -s $$src/$$bam $$bam; ln -s ${lib}/$$bam.bai $$bam.bai
        macs2 \
            callpeak \
            --keep-dup all --nomodel --broad --broad-cutoff ${broad_cutoff} \
            --gsize $$(cat ${gsize}/kmers.txt) \
            --format $$format \
            --name $${id}.mLb.clN \
            --treatment $$bam \

        rm $$bam $$bam.bai
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  # Libraries whose peak file is empty drop out here (the pipeline's
  # `peaks.size() > 0` filter): their FRiP, peak QC, HOMER and ataqv slots stay empty.
  - kind: horus_map
    id: mlb_frip
    name: MERGED_LIBRARY_CALL_ANNOTATE_PEAKS FRIP_SCORE
    over: {input_id: mlb_macs2, as: lib}
    chain: true
    zip: [{input_id: mlb_filter, as: mlb_filter_item}, {input_id: mlb_clean_sort, as: mlb_clean_sort_item}]
    max_concurrency: 16
    inputs: [*a_mlb_filter, *a_mlb_clean_sort, *a_mlb_macs2]
    outputs: [*a_mlb_frip]
    resources: *multi
    executor: *frip
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${lib}/meta.env
        rm -rf ${mlb_frip} && mkdir -p ${mlb_frip} && cd ${mlb_frip} && cp ${lib}/meta.env .
        peak=$${id}.mLb.clN_peaks.broadPeak
        if [ -s $$(echo ${lib}/$$peak) ]; then
        if [ $$single_end = true ]; then src=${mlb_filter_item}; else src=${mlb_clean_sort_item}; fi
        bam=$${id}.mLb.clN.sorted.bam
        ln -s $$src/$$bam $$bam; ln -s ${lib}/$$peak $$peak
        READS_IN_PEAKS=$$(intersectBed -a $$bam -b $$peak -bed -c -f 0.20 | awk -F '\t' '{sum += $$NF} END {print sum}')
        samtools flagstat $$bam > $$bam.flagstat
        grep 'mapped (' $$bam.flagstat | grep -v "primary" | awk -v a="$$READS_IN_PEAKS" -v OFS='\t' '{print "'$$id'", a/$$1}' > $${id}.FRiP.txt
        rm $$bam $$peak
        fi
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: mlb_peaks_mqc
    name: MERGED_LIBRARY_CALL_ANNOTATE_PEAKS MULTIQC_CUSTOM_PEAKS
    over: {input_id: mlb_frip, as: lib}
    chain: true
    zip: [{input_id: mlb_macs2, as: mlb_macs2_item}]
    max_concurrency: 16
    inputs: [*a_mlb_macs2, *a_mlb_frip, *a_nfcore]
    outputs: [*a_mlb_peaks_mqc]
    resources: *single
    executor: *ubuntu
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${lib}/meta.env
        rm -rf ${mlb_peaks_mqc} && mkdir -p ${mlb_peaks_mqc} && cd ${mlb_peaks_mqc} && cp ${lib}/meta.env .
        peak=$${id}.mLb.clN_peaks.broadPeak
        if [ -s $$(echo ${mlb_macs2_item}/$$peak) ]; then
        prefix=$${id}.mLb.clN_peaks
        h1=merged_library_peak_count_header.txt; h2=merged_library_frip_score_header.txt
        ln -s ${mlb_macs2_item}/$$peak $$peak; ln -s ${lib}/$${id}.FRiP.txt $${id}.FRiP.txt
        ln -s ${nfcore}/assets/multiqc/$$h1 $$h1; ln -s ${nfcore}/assets/multiqc/$$h2 $$h2
        cat $$peak | wc -l | awk -v OFS='\t' '{ print "'$$prefix'", $$1 }' | cat $$h1 - > $${prefix}.count_mqc.tsv
        cat $$h2 $${id}.FRiP.txt > $${prefix}.FRiP_mqc.tsv
        rm $$peak $${id}.FRiP.txt $$h1 $$h2
        fi
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: mlb_homer
    name: MERGED_LIBRARY_CALL_ANNOTATE_PEAKS HOMER_ANNOTATEPEAKS
    over: {input_id: mlb_macs2, as: lib}
    chain: true
    max_concurrency: 16
    inputs: [*a_mlb_macs2, *a_reference]
    outputs: [*a_mlb_homer]
    resources: *multi
    executor: *homer
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${lib}/meta.env; . ${reference}/refs.env
        rm -rf ${mlb_homer} && mkdir -p ${mlb_homer} && cd ${mlb_homer} && cp ${lib}/meta.env .
        peak=$${id}.mLb.clN_peaks.broadPeak
        if [ -s $$(echo ${lib}/$$peak) ]; then
        ln -s ${lib}/$$peak $$peak; ln -s ${reference}/$$ref_fasta $$ref_fasta; ln -s ${reference}/$$ref_gtf $$ref_gtf
        annotatePeaks.pl \
            $$peak \
            $$ref_fasta \
            -gid \
            -gtf $$ref_gtf \
            -cpu ${task.resources.cpus} \
            > $${id}.mLb.clN_peaks.annotatePeaks.txt
        rm $$peak $$ref_fasta $$ref_gtf
        fi
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: mlb_ataqv
    name: MERGED_LIBRARY_ATAQV_ATAQV
    over: {input_id: mlb_macs2, as: lib}
    chain: true
    zip: [{input_id: mlb_markdup, as: mlb_markdup_item}, {input_id: mlb_md_index, as: mlb_md_index_item}]
    max_concurrency: 16
    inputs: [*a_mlb_markdup, *a_mlb_md_index, *a_mlb_macs2, *a_tss_bed, *a_autosomes, *a_mito_name]
    outputs: [*a_mlb_ataqv]
    resources: *multi
    executor: *ataqv
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${lib}/meta.env
        rm -rf ${mlb_ataqv} && mkdir -p ${mlb_ataqv} && cd ${mlb_ataqv} && cp ${lib}/meta.env .
        peak=$${id}.mLb.clN_peaks.broadPeak
        if [ -s $$(echo ${lib}/$$peak) ]; then
        bam=$${id}.mLb.mkD.sorted.bam
        tss=$$(cd ${tss_bed} && ls *.bed); auto=$$(cd ${autosomes} && ls *.txt)
        ln -s ${mlb_markdup_item}/$$bam $$bam; ln -s ${mlb_md_index_item}/$$bam.bai $$bam.bai; ln -s ${lib}/$$peak $$peak
        ln -s ${tss_bed}/$$tss $$tss; ln -s ${autosomes}/$$auto $$auto
        mito=''; [ -n ${mito_name} ] && mito="--mitochondrial-reference-name ${mito_name}"
        ataqv \
            --ignore-read-groups \
            $$mito \
            --peak-file $$peak \
            --tss-file $$tss \
             \
            --autosomal-reference-file $$auto \
            --metrics-file "$${id}.ataqv.json" \
            --threads ${task.resources.cpus} \
            --name $$id \
            NA \
            $$bam
        rm $$bam $$bam.bai $$peak $$tss $$auto
        fi
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  # ---------------------------------------------------------------- merged library, aggregates
  - kind: horus_task
    id: mlb_mkarv
    name: MERGED_LIBRARY_ATAQV_MKARV
    inputs: [*a_mlb_ataqv]
    outputs: [*a_mlb_mkarv]
    resources: *multi
    executor: *ataqv
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${mlb_mkarv} && mkdir -p ${mlb_mkarv} && cd ${mlb_mkarv}
        mkdir jsons && for f in ${mlb_ataqv}/*/*.ataqv.json; do ln -s $$f jsons/; done
        mkarv \
             \
            --concurrency ${task.resources.cpus} \
            --force \
            ./html/ \
            jsons/*
        rm -r jsons
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: mlb_macs2_qc
    name: MERGED_LIBRARY_CALL_ANNOTATE_PEAKS PLOT_MACS2_QC
    inputs: [*a_mlb_macs2, *a_nfcore]
    outputs: [*a_mlb_macs2_qc]
    resources: *multi
    executor: *plotr
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${mlb_macs2_qc} && mkdir -p ${mlb_macs2_qc} && cd ${mlb_macs2_qc}
        export PATH=${nfcore}/bin:$$PATH
        peaks=""
        for f in ${mlb_macs2}/*/*_peaks.broadPeak; do [ -s $$f ] && ln -s $$f . && peaks="$$peaks,$$(basename $$f)"; done
        peaks=$${peaks#,}
        plot_macs2_qc.r \
            -i $$peaks \
            -s $$(echo $$peaks | sed 's/_peaks\.broadPeak//g') \
            -o ./ -p macs2_peak.mLb.clN
        rm $$(echo $$peaks | tr , ' ')
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: mlb_homer_qc
    name: MERGED_LIBRARY_CALL_ANNOTATE_PEAKS PLOT_HOMER_ANNOTATEPEAKS
    inputs: [*a_mlb_homer, *a_nfcore]
    outputs: [*a_mlb_homer_qc]
    resources: *multi
    executor: *plotr
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${mlb_homer_qc} && mkdir -p ${mlb_homer_qc} && cd ${mlb_homer_qc}
        export PATH=${nfcore}/bin:$$PATH
        h=merged_library_peak_annotation_header.txt
        ln -s ${nfcore}/assets/multiqc/$$h $$h
        annos=""
        for f in ${mlb_homer}/*/*.annotatePeaks.txt; do ln -s $$f . && annos="$$annos,$$(basename $$f)"; done
        annos=$${annos#,}
        plot_homer_annotatepeaks.r \
            -i $$annos \
            -s $$(echo $$annos | sed 's/\.mLb\.clN_peaks\.annotatePeaks\.txt//g') \
            -p macs2_annotatePeaks.mLb.clN \
            -o ./

        find ./ -type f -name "*summary.txt" -exec cat {} \; | cat $$h - > macs2_annotatePeaks.mLb.clN.summary_mqc.tsv
        rm $$h $$(echo $$annos | tr , ' ')
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  # Consensus peaks, featureCounts and DESeq2 QC run only with more than one
  # peak file; otherwise their outputs stay empty.
  - kind: horus_task
    id: mlb_consensus
    name: MERGED_LIBRARY_CONSENSUS_PEAKS MACS2_CONSENSUS
    inputs: [*a_mlb_macs2, *a_nfcore, *a_min_reps]
    outputs: [*a_mlb_consensus]
    resources: *single
    executor: *consensus
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${mlb_consensus} && mkdir -p ${mlb_consensus} && cd ${mlb_consensus}
        export PATH=${nfcore}/bin:$$PATH
        for f in ${mlb_macs2}/*/*_peaks.broadPeak; do [ -s $$f ] && ln -s $$f .; done
        set -- $$(ls *_peaks.broadPeak 2>/dev/null | LC_ALL=C sort)
        if [ $$# -gt 1 ]; then
        prefix=consensus_peaks.mLb.clN
        sort -T '.' -k1,1 -k2,2n $$@ \
            | mergeBed -c 2,3,4,5,6,7,8,9 -o collapse,collapse,collapse,collapse,collapse,collapse,collapse,collapse > $${prefix}.txt

        macs2_merged_expand.py \
            $${prefix}.txt \
            $$(echo $$@ | tr ' ' , | sed 's/_peaks\.broadPeak//g') \
            $${prefix}.boolean.txt \
            --min_replicates ${min_reps_consensus} \


        awk -v FS='\t' -v OFS='\t' 'FNR > 1 { print $$1, $$2, $$3, $$4, "0", "+" }' $${prefix}.boolean.txt > $${prefix}.bed

        echo -e "GeneID\tChr\tStart\tEnd\tStrand" > $${prefix}.saf
        awk -v FS='\t' -v OFS='\t' 'FNR > 1 { print $$4, $$1, $$2, $$3,  "+" }' $${prefix}.boolean.txt >> $${prefix}.saf

        plot_peak_intersect.r -i $${prefix}.boolean.intersect.txt -o $${prefix}.boolean.intersect.plot.pdf
        fi
        rm -f *_peaks.broadPeak
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: mlb_cons_homer
    name: MERGED_LIBRARY_CONSENSUS_PEAKS HOMER_ANNOTATEPEAKS
    inputs: [*a_mlb_consensus, *a_reference]
    outputs: [*a_mlb_cons_homer]
    resources: *multi
    executor: *homer
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${reference}/refs.env
        rm -rf ${mlb_cons_homer} && mkdir -p ${mlb_cons_homer} && cd ${mlb_cons_homer}
        prefix=consensus_peaks.mLb.clN
        if [ -e ${mlb_consensus}/$$prefix.bed ]; then
        ln -s ${mlb_consensus}/$$prefix.bed $$prefix.bed; ln -s ${reference}/$$ref_fasta $$ref_fasta; ln -s ${reference}/$$ref_gtf $$ref_gtf
        annotatePeaks.pl \
            $$prefix.bed \
            $$ref_fasta \
            -gid \
            -gtf $$ref_gtf \
            -cpu ${task.resources.cpus} \
            > $$prefix.annotatePeaks.txt
        rm $$prefix.bed $$ref_fasta $$ref_gtf
        fi
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: mlb_counts
    name: MERGED_LIBRARY_CONSENSUS_PEAKS SUBREAD_FEATURECOUNTS
    inputs: [*a_mlb_consensus, *a_mlb_macs2, *a_mlb_filter, *a_mlb_clean_sort]
    outputs: [*a_mlb_counts]
    resources: *multi
    executor: *subread
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${mlb_counts} && mkdir -p ${mlb_counts} && cd ${mlb_counts}
        prefix=consensus_peaks.mLb.clN
        # BAMs of the libraries that have peaks
        bams=""
        for p in ${mlb_macs2}/*/*.mLb.clN_peaks.broadPeak; do
            [ -s $$p ] || continue
            b=$$(basename $$p .mLb.clN_peaks.broadPeak).mLb.clN.sorted.bam
            ln -s $$(ls ${mlb_filter}/*/$$b ${mlb_clean_sort}/*/$$b 2>/dev/null) $$b
            bams="$$bams $$b"
        done
        set -- $$bams
        if [ -e ${mlb_consensus}/$$prefix.saf ] && [ $$# -gt 1 ]; then
        ln -s ${mlb_consensus}/$$prefix.saf $$prefix.saf
        featureCounts \
            -F SAF -O --fracOverlap 0.2 \
            -p \
            -T ${task.resources.cpus} \
            -a $$prefix.saf \
            -s 0 \
            -o $$prefix.featureCounts.txt \
            $$@
        rm $$prefix.saf
        fi
        rm -f $$bams
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: mlb_deseq2
    name: MERGED_LIBRARY_CONSENSUS_PEAKS DESEQ2_QC
    inputs: [*a_mlb_counts, *a_nfcore]
    outputs: [*a_mlb_deseq2]
    resources: *multi
    executor: *deseq2
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${mlb_deseq2} && mkdir -p ${mlb_deseq2} && cd ${mlb_deseq2}
        export PATH=${nfcore}/bin:$$PATH
        counts=consensus_peaks.mLb.clN.featureCounts.txt
        if [ -e ${mlb_counts}/$$counts ]; then
        prefix=consensus_peaks.mLb.clN; id=consensus_peaks; index=1
        h1=merged_library_deseq2_pca_header.txt; h2=merged_library_deseq2_clustering_header.txt
        ln -s ${mlb_counts}/$$counts $$counts; ln -s ${nfcore}/assets/multiqc/$$h1 $$h1; ln -s ${nfcore}/assets/multiqc/$$h2 $$h2
        deseq2_qc.r \
            --count_file $$counts \
            --outdir ./ \
            --outprefix $$prefix \
            --cores ${task.resources.cpus} \
            --id_col 1 --sample_suffix '.mLb.clN.sorted.bam' --count_col 7 --vst TRUE

        sed "s/deseq2_pca/deseq2_pca_$$index/g" <$$h1 >tmp.txt
        sed -i -e "s/DESeq2 /$$id DESeq2 /g" tmp.txt
        cat tmp.txt $${prefix}.pca.vals.txt > $${prefix}.pca.vals_mqc.tsv

        sed "s/deseq2_clustering/deseq2_clustering_$$index/g" <$$h2 >tmp.txt
        sed -i -e "s/DESeq2 /$$id DESeq2 /g" tmp.txt
        cat tmp.txt $${prefix}.sample.dists.txt > $${prefix}.sample.dists_mqc.tsv
        rm tmp.txt $$counts $$h1 $$h2
        fi
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  # ---------------------------------------------------------------- merged replicate
  - kind: horus_map
    id: mrp_merge
    name: PICARD_MERGESAMFILES_REPLICATE
    over: {input_id: replicates, as: rep}
    max_concurrency: 16
    inputs: [*a_replicates, *a_mlb_filter, *a_mlb_clean_sort]
    outputs: [*a_mrp_merge]
    resources: *multi
    executor: *picard
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${rep}); . ${rep}
        rm -rf ${mrp_merge} && mkdir -p ${mrp_merge} && cd ${mrp_merge}
        { echo id=$$id; cat ${rep}; } > meta.env
        if [ $$single_end = true ]; then src=${mlb_filter}; else src=${mlb_clean_sort}; fi
        bams=$$(for l in $$libraries; do echo $$l.mLb.clN.sorted.bam; done | LC_ALL=C sort)
        for b in $$bams; do ln -s $$src/*/$$b $$b; done
        picard \
            -Xmx$$(( ${task.resources.memory_gb} * 1024 * 8 / 10 ))M \
            MergeSamFiles \
            --SORT_ORDER coordinate --VALIDATION_STRINGENCY LENIENT --TMP_DIR tmp \
            $$(printf -- '--INPUT %s ' $$bams) \
            --OUTPUT $${id}.mRp.sorted.bam
        rm -rf tmp $$bams
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: mrp_markdup
    name: MERGED_REPLICATE_MARKDUPLICATES_PICARD PICARD_MARKDUPLICATES
    over: {input_id: mrp_merge, as: rep}
    chain: true
    max_concurrency: 16
    inputs: [*a_mrp_merge, *a_reference, *a_chrom_sizes]
    outputs: [*a_mrp_markdup]
    resources: *multi
    executor: *picard
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${rep}/meta.env; . ${reference}/refs.env
        rm -rf ${mrp_markdup} && mkdir -p ${mrp_markdup} && cd ${mrp_markdup} && cp ${rep}/meta.env .
        ln -s ${rep}/$${id}.mRp.sorted.bam $${id}.mRp.sorted.bam
        ln -s ${reference}/$$ref_fasta $$ref_fasta; ln -s ${chrom_sizes}/$$ref_fasta.fai $$ref_fasta.fai
        picard \
            -Xmx$$(( ${task.resources.memory_gb} * 1024 * 8 / 10 ))M \
            MarkDuplicates \
            --ASSUME_SORTED true --REMOVE_DUPLICATES true --VALIDATION_STRINGENCY LENIENT --TMP_DIR tmp \
            --INPUT $${id}.mRp.sorted.bam \
            --OUTPUT $${id}.mRp.clN.sorted.bam \
            --REFERENCE_SEQUENCE $$ref_fasta \
            --METRICS_FILE $${id}.mRp.clN.sorted.MarkDuplicates.metrics.txt
        rm -rf tmp $${id}.mRp.sorted.bam $$ref_fasta $$ref_fasta.fai
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: mrp_index
    name: MERGED_REPLICATE_MARKDUPLICATES_PICARD SAMTOOLS_INDEX
    over: {input_id: mrp_markdup, as: rep}
