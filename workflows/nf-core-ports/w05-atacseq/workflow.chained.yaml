    target: *target

  - kind: horus_map
    id: mlb_filter
    name: BAMTOOLS_FILTER
    over: {input_id: mlb_md_index, as: lib}
    chain: true
    zip: [{input_id: mlb_markdup, as: mlb_markdup_item}]
    max_concurrency: 16
    inputs: [*a_mlb_markdup, *a_mlb_md_index, *a_include_bed, *a_nfcore]
    outputs: [*a_mlb_filter]
    resources: *multi
    executor: *bamtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${lib}/meta.env
        rm -rf ${mlb_filter} && mkdir -p ${mlb_filter} && cd ${mlb_filter} && cp ${lib}/meta.env .
        bam=$${id}.mLb.mkD.sorted.bam
        bed=$$(cd ${include_bed} && ls *.bed)
        ln -s ${mlb_markdup_item}/$$bam $$bam; ln -s ${lib}/$$bam.bai $$bam.bai; ln -s ${include_bed}/$$bed $$bed
        if [ $$single_end = true ]; then
            args='-F 0x004 -F 0x0400 -q 1'; prefix=$${id}.mLb.clN.sorted; config=bamtools_filter_se.json
        else
            args='-F 0x004 -F 0x0008 -f 0x001 -F 0x0400 -q 1'; prefix=$${id}.mLb.flT.sorted; config=bamtools_filter_pe.json
        fi
        ln -s ${nfcore}/assets/$$config $$config
        samtools view \
            $$args \
            -L $$bed \
            -b $$bam \
            | bamtools filter \
                -out $${prefix}.bam \
                -script $$config
        rm $$bam $$bam.bai $$bed $$config
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

