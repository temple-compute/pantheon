  homer: &homer {kind: docker, user: host, image: "quay.io/biocontainers/homer:4.11--pl526hc9558a2_3"}
  ataqv: &ataqv {kind: docker, user: host, image: "quay.io/biocontainers/ataqv:1.3.1--py310ha155cf9_1"}
