    max_concurrency: 16
    inputs: [*a_mrp_markdup]
    outputs: [*a_mrp_index]
    resources: *multi
    executor: *samtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${rep}/meta.env
        rm -rf ${mrp_index} && mkdir -p ${mrp_index} && cd ${mrp_index} && cp ${rep}/meta.env .
        bam=$${id}.mRp.clN.sorted.bam
        ln -s ${rep}/$$bam $$bam
        samtools \
            index \
            -@ $$(( ${task.resources.cpus} - 1 )) \
             \
            $$bam
        rm $$bam
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
