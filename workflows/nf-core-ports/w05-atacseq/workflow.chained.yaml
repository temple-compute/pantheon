kind: horus_workflow
name: nf-core atacseq chained

# Native port of nf-core/atacseq 2.1.2, the route `-profile test,docker` runs:
# BWA, library and replicate merging with Picard, BAM filtering, deepTools,
# MACS2 broad peaks, HOMER annotation, consensus peaks with featureCounts and
# DESeq2 QC, ataqv, IGV session and MultiQC. Preseq is off, as in the
# pipeline defaults. Images, rendered command lines (ext.args from
# conf/modules.config) and per-process cpus/memory are the executed ones; the
# test profile caps every process at 2 cpus / 6 GB.
#
# Every command runs under `bash -euo pipefail`, the pipeline's process.shell:
# each command writes its script to /tmp/.command.sh and runs that with bash,
# as .command.run does.
#
# Chained variant of workflow.yaml (scripts/gen_chained.py): same commands and
# outputs. Each item space (runs, libraries, replicate groups) has a head map
# (trimgalore, mlb_merge, mrp_merge) that writes meta.env into its slot: id
# plus the bash-sourceable meta (single_end, library, runs, libraries). Every
# later map of the space sets `chain: true` and iterates an upstream map of the
# same space, so a run or library moves to its next process as soon as its own
# slot is done, not when the whole map is. A body sources ${<item>}/meta.env
# and reads the upstream slot ${<item>}/, or a slot of another map of the space
# paired through `zip` (${<map>_item}/). Runs under min_trimmed_reads drop out
# with exit 10 (drop_exit_codes). The space changes stay barriers, as in
# Nextflow: grouping runs into libraries and libraries into replicate groups
# waits for every run (scripts/decide.py groups). Groovy branches that depend
# on one item (paired-end only steps, empty peak files) are guards inside the
# command, as in workflow.yaml: the slot then holds only meta.env. Every map
# keeps max_concurrency 16, above the item count (8 runs, 6 libraries, 2
# replicate groups), so no clone waits for a slot. Needs horus-runtime 0.9.0
# or later (horus_map chain, zip, drop_exit_codes).
#
# capacity: memory-based admission like Nextflow's local executor. The key
# is the target's location_id (local://<hostname>); set it to the host that
# runs the tasks, or the gate does not apply.

capacity:
  local://ubuntu-awow:
    cpus: 16
    memory_gb: 31
max_concurrency: 16

_target: &target
  kind: local

# Run on a remote node instead: point every task at this anchor.
# _target: &target
#   kind: ssh
#   host: bench-node.example.org
#   username: ubuntu
#   working_directory: /home/ubuntu/horus

# Containers (.command.run docker lines); `user: host` runs them as the
# calling user, as nf-core's `-u $(id -u):$(id -g)` does.
_img:
  python: &python {kind: docker, user: host, image: "quay.io/biocontainers/python:3.8.3"}
  ubuntu: &ubuntu {kind: docker, user: host, image: "quay.io/nf-core/ubuntu:20.04"}
  perl: &perl {kind: docker, user: host, image: "quay.io/biocontainers/perl:5.26.2"}
  samtools116: &samtools116 {kind: docker, user: host, image: "quay.io/biocontainers/samtools:1.16.1--h6899075_1"}
  samtools: &samtools {kind: docker, user: host, image: "quay.io/biocontainers/samtools:1.17--h00cdaf9_0"}
  bedtools: &bedtools {kind: docker, user: host, image: "quay.io/biocontainers/bedtools:2.30.0--hc088bd4_0"}
  bwa: &bwa {kind: docker, user: host, image: "quay.io/biocontainers/bwa:0.7.17--hed695b0_7"}
  bwamem: &bwamem {kind: docker, user: host, image: "quay.io/biocontainers/mulled-v2-fe8faa35dbf6dc65a0f7f5d4ea12e31a79f73e40:219b6c272b25e7e642ae3ff0bf0c5c81a5135ab4-0"}
