  - kind: horus_map
    id: lb_stats
    name: FASTQ_ALIGN_BWA SAMTOOLS_STATS
    over: {input_id: lb_index, as: run}
    chain: true
    zip: [{input_id: lb_sort, as: lb_sort_item}]
    max_concurrency: 16
    inputs: [*a_lb_sort, *a_lb_index, *a_reference]
    outputs: [*a_lb_stats]
    resources: *single
    executor: *samtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${run}/meta.env; . ${reference}/refs.env
        rm -rf ${lb_stats} && mkdir -p ${lb_stats} && cd ${lb_stats} && cp ${run}/meta.env .
        bam=$${id}.Lb.sorted.bam
        ln -s ${lb_sort_item}/$$bam $$bam; ln -s ${run}/$$bam.bai $$bam.bai; ln -s ${reference}/$$ref_fasta $$ref_fasta
        samtools \
            stats \
            --threads ${task.resources.cpus} \
