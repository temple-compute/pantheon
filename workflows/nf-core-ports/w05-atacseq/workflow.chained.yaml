artifacts:
  - <<: *a_samplesheet
    description: >-
      nf-core/atacseq samplesheet (sample,fastq_1,fastq_2,replicate). Reads may be
      URLs or paths relative to the samplesheet; rows sharing a sample and
      replicate are runs of one library. Default: the test profile samplesheet
      (8 runs, 6 libraries, 4 samples, paired- and single-end).
  - <<: *a_nfcore
    description: nf-core/atacseq 2.1.2 bin/ scripts and assets (MIT).
  - <<: *a_mirror
    description: >-
      Folder searched for each input file by name before downloading it (e.g. a
      local copy of the test data). Empty downloads everything.
    value: ""
    pattern: '[^"`$\\]*'
  - {id: fasta_url, name: Genome fasta, kind: string, path: params/fasta_url.txt, pattern: '[^"`$\\]*', description: "--fasta (plain)", value: "https://raw.githubusercontent.com/nf-core/test-datasets/atacseq/reference/genome.fa"}
  - {id: gtf_url, name: GTF, kind: string, path: params/gtf_url.txt, pattern: '[^"`$\\]*', description: "--gtf (plain)", value: "https://raw.githubusercontent.com/nf-core/test-datasets/atacseq/reference/genes.gtf"}
  - {<<: *a_min_trimmed, value: 10000, min: 0, description: "--min_trimmed_reads"}
  - {<<: *a_read_length, value: 50, min: 1, description: "--read_length (k-mer size for the MACS2 genome size)"}
  - {<<: *a_fragment_size, value: 200, min: 0, description: "--fragment_size (single-end read extension)"}
  - {<<: *a_fingerprint_bins, value: 100, min: 1, description: "--fingerprint_bins"}
  - {<<: *a_broad_cutoff, value: 0.1, min: 0, max: 1, description: "--broad_cutoff"}
  - {<<: *a_min_reps, value: 1, min: 1, description: "--min_reps_consensus"}
  - {<<: *a_mito_name, value: "MT", pattern: '[A-Za-z0-9_.]*', description: "--mito_name (empty keeps every chromosome)"}

tasks:
  # ---------------------------------------------------------------- inputs
  - kind: horus_task
    id: fetch_reference
    name: Fetch reference files
    description: Downloads the genome fasta and GTF (or copies them from the mirror).
    inputs:
      - *a_mirror
      - {id: fasta_url, name: Genome fasta, kind: string, path: params/fasta_url.txt}
      - {id: gtf_url, name: GTF, kind: string, path: params/gtf_url.txt}
    outputs: [*a_reference]
    executor: {kind: shell}
    runtime:
      kind: python_script
      script: scripts/stage_inputs.py
      python: python3 # stdlib only
      args: reference --fasta ${fasta_url} --gtf ${gtf_url} --mirror ${input_mirror} --out ${reference}
    target: *target

  - kind: horus_task
    id: samplesheet_check
    name: SAMPLESHEET_CHECK
    inputs: [*a_samplesheet, *a_nfcore]
    outputs: [*a_sheet_check]
    resources: *single
    executor: *python
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${sheet_check} && mkdir -p ${sheet_check} && cd ${sheet_check}
        export PATH=${nfcore}/bin:$$PATH
        s=$$(basename ${samplesheet})
        ln -s ${samplesheet} $$s
        check_samplesheet.py \
            $$s \
            samplesheet.valid.csv
        rm $$s
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: stage_reads
    name: Stage the reads of every run
    description: Fetches each run's reads and writes one meta file per run.
    inputs: [*a_sheet_check, *a_samplesheet, *a_mirror]
    outputs: [*a_reads, *a_runs]
    executor: {kind: shell}
    runtime:
      kind: python_script
      script: scripts/stage_inputs.py
      python: python3 # stdlib only
      args: >-
        reads --valid ${sheet_check}/samplesheet.valid.csv --samplesheet ${samplesheet}
        --mirror ${input_mirror} --reads ${reads} --runs ${runs}
    target: *target

  # ---------------------------------------------------------------- genome
  - kind: horus_task
    id: gene_bed
    name: GTF2BED
    inputs: [*a_reference, *a_nfcore]
    outputs: [*a_gene_bed]
    resources: *multi
    executor: *perl
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${reference}/refs.env
        rm -rf ${gene_bed} && mkdir -p ${gene_bed} && cd ${gene_bed}
        export PATH=${nfcore}/bin:$$PATH
        ln -s ${reference}/$$ref_gtf $$ref_gtf
        gtf2bed \
            $$ref_gtf \
            > $${ref_gtf%.*}.bed
        rm $$ref_gtf
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: tss_bed
    name: TSS_EXTRACT
    inputs: [*a_gene_bed]
    outputs: [*a_tss_bed]
    resources: *single
    executor: *ubuntu
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${tss_bed} && mkdir -p ${tss_bed} && cd ${tss_bed}
        bed=$$(cd ${gene_bed} && ls *.bed)
        ln -s ${gene_bed}/$$bed $$bed
        cat $$bed | awk -v FS='\t' -v OFS='\t' '{ if($$6=="+") $$3=$$2+1; else $$2=$$3-1; print $$1, $$2, $$3, $$4, $$5, $$6;}' > $${bed%.bed}.tss.bed
        rm $$bed
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: chrom_sizes
    name: CUSTOM_GETCHROMSIZES
    inputs: [*a_reference]
    outputs: [*a_chrom_sizes]
    resources: *single
    executor: *samtools116
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${reference}/refs.env
        rm -rf ${chrom_sizes} && mkdir -p ${chrom_sizes} && cd ${chrom_sizes}
        ln -s ${reference}/$$ref_fasta $$ref_fasta
        samtools faidx $$ref_fasta
        cut -f 1,2 $$ref_fasta.fai > $$ref_fasta.sizes
        rm $$ref_fasta
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: autosomes
    name: GET_AUTOSOMES
    inputs: [*a_chrom_sizes, *a_nfcore]
    outputs: [*a_autosomes]
    resources: *single
    executor: *python
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${autosomes} && mkdir -p ${autosomes} && cd ${autosomes}
        export PATH=${nfcore}/bin:$$PATH
        fai=$$(cd ${chrom_sizes} && ls *.fai)
        ln -s ${chrom_sizes}/$$fai $$fai
        get_autosomes.py \
            $$fai \
            $${fai%.fai}.autosomes.txt
        rm $$fai
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: include_bed
    name: GENOME_BLACKLIST_REGIONS
    description: No --blacklist, so the include regions are every chromosome but mito_name.
    inputs: [*a_chrom_sizes, *a_mito_name]
    outputs: [*a_include_bed]
    resources: *single
    executor: *bedtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${include_bed} && mkdir -p ${include_bed} && cd ${include_bed}
        sizes=$$(cd ${chrom_sizes} && ls *.sizes)
        ln -s ${chrom_sizes}/$$sizes $$sizes
        if [ -n ${mito_name} ]; then
        awk '{print $$1, '0' , $$2}' OFS='\t' $$sizes | awk '$$1 !~ /${mito_name}/ {print $$0}' > $${sizes%%.*}.include_regions.bed
        else
        awk '{print $$1, '0' , $$2}' OFS='\t' $$sizes  > $${sizes%%.*}.include_regions.bed
        fi
        rm $$sizes
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: bwa_index
    name: BWA_INDEX
    inputs: [*a_reference]
    outputs: [*a_bwa_index]
    resources: *single
    executor: *bwa
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${reference}/refs.env
        rm -rf ${bwa_index} && mkdir -p ${bwa_index} && cd ${bwa_index}
        ln -s ${reference}/$$ref_fasta $$ref_fasta
        mkdir bwa
        bwa \
            index \
             \
            -p bwa/$${ref_fasta%.*} \
            $$ref_fasta
        rm $$ref_fasta
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: gsize
    name: KHMER_UNIQUEKMERS
    inputs: [*a_reference, *a_read_length]
    outputs: [*a_gsize]
    resources: *multi
    executor: *khmer
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${reference}/refs.env
        rm -rf ${gsize} && mkdir -p ${gsize} && cd ${gsize}
        ln -s ${reference}/$$ref_fasta $$ref_fasta
        unique-kmers.py \
            -k ${read_length} \
            -R report.txt \
             \
            $$ref_fasta

        grep ^number report.txt | sed 's/^.*:.[[:blank:]]//g' > kmers.txt
        rm $$ref_fasta
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  # ---------------------------------------------------------------- reads
  - kind: horus_map
    id: fastqc
    name: FASTQC
    over: {input_id: runs, as: run}
    max_concurrency: 16
    inputs: [*a_runs, *a_reads]
    outputs: [*a_fastqc]
    resources: *multi
    executor: *fastqc
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${run}); . ${run}
        rm -rf ${fastqc} && mkdir -p ${fastqc} && cd ${fastqc}
        set -- $$(cat ${reads}/$$id/reads.txt)
        pairs=""; names=""; i=0
        for f in "$$@"; do
            i=$$((i + 1))
            ln -s ${reads}/$$id/$$f $$f
            if [ $$# -eq 1 ]; then new=$${id}.$${f##*.}; else new=$${id}_$$i.$${f##*.}; fi
            pairs="$$pairs $$f $$new"; names="$$names $$new"
        done
        printf "%s %s\n" $$pairs | while read old_name new_name; do
            [ -f "$${new_name}" ] || ln -s $$old_name $$new_name
        done

        fastqc \
            --quiet \
            --threads ${task.resources.cpus} \
            $${names# }
        rm $$names "$$@"
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: trimgalore
    name: TRIMGALORE
    over: {input_id: runs, as: run}
    max_concurrency: 16
    inputs: [*a_runs, *a_reads]
    outputs: [*a_trimgalore]
    resources: *multi
    executor: *trimgalore
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${run}); . ${run}
        rm -rf ${trimgalore} && mkdir -p ${trimgalore} && cd ${trimgalore}
        { echo id=$$id; cat ${run}; } > meta.env
        set -- $$(cat ${reads}/$$id/reads.txt)
        for f in "$$@"; do ln -s ${reads}/$$id/$$f $$f; done
        # cores: task.cpus - 4 (paired) or - 3 (single), within 1..8
        if [ $$single_end = true ]; then cores=$$(( ${task.resources.cpus} - 3 )); else cores=$$(( ${task.resources.cpus} - 4 )); fi
        [ $$cores -lt 1 ] && cores=1
        [ $$cores -gt 8 ] && cores=8
        if [ $$single_end = true ]; then
        [ ! -f  $${id}.fastq.gz ] && ln -s $$1 $${id}.fastq.gz
        trim_galore \
            --fastqc \
            --cores $$cores \
            --gzip \
            $${id}.fastq.gz
        rm $${id}.fastq.gz
        else
        [ ! -f  $${id}_1.fastq.gz ] && ln -s $$1 $${id}_1.fastq.gz
        [ ! -f  $${id}_2.fastq.gz ] && ln -s $$2 $${id}_2.fastq.gz
        trim_galore \
            --fastqc \
            --cores $$cores \
            --paired \
            --gzip \
            $${id}_1.fastq.gz \
            $${id}_2.fastq.gz
        rm $${id}_1.fastq.gz $${id}_2.fastq.gz
        fi
        rm -rf "?"  # FastQC's Java prefs dir: the host uid has no home in the image
        rm "$$@"
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: filter_trimmed
    name: Filter runs by trimmed reads
    description: Drops a run under min_trimmed_reads after trimming (exit 10).
    over: {input_id: trimgalore, as: run}
    chain: true
    drop_exit_codes: [10]
    max_concurrency: 16
    inputs: [*a_trimgalore, *a_min_trimmed]
    outputs: [*a_filter_trimmed]
    executor: {kind: shell}
    runtime:
      kind: python_script
      script: scripts/decide.py
      python: python3 # stdlib only
      args: trim-item --slot ${run} --min-trimmed-reads ${min_trimmed_reads} --out ${filter_trimmed}
    target: *target

  - kind: horus_task
    id: decide_groups
    name: Group libraries and replicates
    description: Groups the passing runs into libraries and libraries into replicate groups.
    inputs: [*a_filter_trimmed]
    outputs: [*a_libraries, *a_replicates]
    executor: {kind: shell}
    runtime:
      kind: python_script
      script: scripts/decide.py
      python: python3 # stdlib only
      args: groups --runs ${filter_trimmed} --libraries ${libraries} --replicates ${replicates}
    target: *target

  # ---------------------------------------------------------------- alignment, per run
  - kind: horus_map
    id: bwa_mem
    name: BWA_MEM
    over: {input_id: filter_trimmed, as: run}
    chain: true
    zip: [{input_id: trimgalore, as: trimgalore_item}]
    max_concurrency: 16
    inputs: [*a_filter_trimmed, *a_trimgalore, *a_bwa_index]
    outputs: [*a_bwa_mem]
    resources: *multi
    executor: *bwamem
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${run}/meta.env
        rm -rf ${bwa_mem} && mkdir -p ${bwa_mem} && cd ${bwa_mem} && cp ${run}/meta.env .
        if [ $$single_end = true ]; then set -- $${id}_trimmed.fq.gz; else set -- $${id}_1_val_1.fq.gz $${id}_2_val_2.fq.gz; fi
        for f in "$$@"; do ln -s ${trimgalore_item}/$$f $$f; done
        ln -s ${bwa_index}/bwa bwa
        INDEX=`find -L ./ -name "*.amb" | sed 's/\.amb$$//'`

        bwa mem \
            -M  -R '@RG\tID:'$${id}'\tSM:'$${library}'\tPL:ILLUMINA\tLB:'$${id}'\tPU:1' \
            -t ${task.resources.cpus} \
            $$INDEX \
            $$@ \
            | samtools view -bhS -F 0x0100 -O BAM --threads ${task.resources.cpus} -o $${id}.Lb.bam -
        rm bwa "$$@"
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: lb_sort
    name: FASTQ_ALIGN_BWA SAMTOOLS_SORT
    over: {input_id: bwa_mem, as: run}
    chain: true
    max_concurrency: 16
    inputs: [*a_bwa_mem]
    outputs: [*a_lb_sort]
    resources: *multi
    executor: *samtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${run}/meta.env
        rm -rf ${lb_sort} && mkdir -p ${lb_sort} && cd ${lb_sort} && cp ${run}/meta.env .
        ln -s ${run}/$${id}.Lb.bam $${id}.Lb.bam
        samtools sort \
             \
            -@ ${task.resources.cpus} \
            -o $${id}.Lb.sorted.bam \
            -T $${id}.Lb.sorted \
            $${id}.Lb.bam
        rm $${id}.Lb.bam
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

