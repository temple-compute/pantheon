        rm $$bam $$bam.bai
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: mrp_idxstats
    name: MERGED_REPLICATE_MARKDUPLICATES_PICARD SAMTOOLS_IDXSTATS
    over: {input_id: mrp_index, as: rep}
    chain: true
    zip: [{input_id: mrp_markdup, as: mrp_markdup_item}]
    max_concurrency: 16
    inputs: [*a_mrp_markdup, *a_mrp_index]
    outputs: [*a_mrp_idxstats]
    resources: *single
    executor: *samtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${rep}/meta.env
        rm -rf ${mrp_idxstats} && mkdir -p ${mrp_idxstats} && cd ${mrp_idxstats} && cp ${rep}/meta.env .
        bam=$${id}.mRp.clN.sorted.bam
        ln -s ${mrp_markdup_item}/$$bam $$bam; ln -s ${rep}/$$bam.bai $$bam.bai
        samtools \
            idxstats \
            --threads $$(( ${task.resources.cpus} - 1 )) \
            $$bam \
            > $$bam.idxstats
        rm $$bam $$bam.bai
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: mrp_genomecov
    name: MERGED_REPLICATE_BAM_TO_BIGWIG BEDTOOLS_GENOMECOV
    over: {input_id: mrp_flagstat, as: rep}
    chain: true
    zip: [{input_id: mrp_markdup, as: mrp_markdup_item}]
    max_concurrency: 16
    inputs: [*a_mrp_markdup, *a_mrp_flagstat, *a_fragment_size]
    outputs: [*a_mrp_genomecov]
    resources: *multi
    executor: *bedtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${rep}/meta.env
        rm -rf ${mrp_genomecov} && mkdir -p ${mrp_genomecov} && cd ${mrp_genomecov} && cp ${rep}/meta.env .
        bam=$${id}.mRp.clN.sorted.bam
        ln -s ${mrp_markdup_item}/$$bam $$bam; ln -s ${rep}/$$bam.flagstat $$bam.flagstat
        prefix=$${id}.mRp.clN
        if [ $$single_end = true ]; then pe=''; [ ${fragment_size} -gt 0 ] && args="-fs ${fragment_size}" || args=''; else pe='-pc'; args=''; fi
        SCALE_FACTOR=$$(grep '[0-9] mapped (' $$bam.flagstat | awk '{print 1000000/$$1}')
        echo $$SCALE_FACTOR > $${prefix}.scale_factor.txt

        bedtools \
            genomecov \
            -ibam $$bam \
            -bg \
            -scale $$SCALE_FACTOR \
            $$pe \
            $$args \
        > tmp.bg

        bedtools sort -i tmp.bg > $${prefix}.bedGraph
        rm tmp.bg $$bam $$bam.flagstat
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: mrp_bigwig
    name: MERGED_REPLICATE_BAM_TO_BIGWIG UCSC_BEDGRAPHTOBIGWIG
    over: {input_id: mrp_genomecov, as: rep}
    chain: true
    max_concurrency: 16
    inputs: [*a_mrp_genomecov, *a_chrom_sizes]
    outputs: [*a_mrp_bigwig]
    resources: *single
    executor: *ucsc
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${rep}/meta.env
        rm -rf ${mrp_bigwig} && mkdir -p ${mrp_bigwig} && cd ${mrp_bigwig} && cp ${rep}/meta.env .
        sizes=$$(cd ${chrom_sizes} && ls *.sizes)
        ln -s ${rep}/$${id}.mRp.clN.bedGraph $${id}.mRp.clN.bedGraph; ln -s ${chrom_sizes}/$$sizes $$sizes
        bedGraphToBigWig \
            $${id}.mRp.clN.bedGraph \
            $$sizes \
            $${id}.mRp.clN.bigWig
        rm $${id}.mRp.clN.bedGraph $$sizes
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: mrp_macs2
    name: MERGED_REPLICATE_CALL_ANNOTATE_PEAKS MACS2_CALLPEAK
    over: {input_id: mrp_index, as: rep}
    chain: true
    zip: [{input_id: mrp_markdup, as: mrp_markdup_item}]
    max_concurrency: 16
    inputs: [*a_mrp_markdup, *a_mrp_index, *a_gsize, *a_broad_cutoff]
    outputs: [*a_mrp_macs2]
    resources: *multi
    executor: *macs2
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${rep}/meta.env
        rm -rf ${mrp_macs2} && mkdir -p ${mrp_macs2} && cd ${mrp_macs2} && cp ${rep}/meta.env .
        if [ $$single_end = true ]; then format=BAM; else format=BAMPE; fi
        bam=$${id}.mRp.clN.sorted.bam
        ln -s ${mrp_markdup_item}/$$bam $$bam; ln -s ${rep}/$$bam.bai $$bam.bai
        macs2 \
            callpeak \
            --keep-dup all --nomodel --broad --broad-cutoff ${broad_cutoff} \
            --gsize $$(cat ${gsize}/kmers.txt) \
            --format $$format \
            --name $${id}.mRp.clN \
            --treatment $$bam \

        rm $$bam $$bam.bai
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: mrp_frip
    name: MERGED_REPLICATE_CALL_ANNOTATE_PEAKS FRIP_SCORE
    over: {input_id: mrp_macs2, as: rep}
    chain: true
    zip: [{input_id: mrp_markdup, as: mrp_markdup_item}]
    max_concurrency: 16
    inputs: [*a_mrp_markdup, *a_mrp_macs2]
    outputs: [*a_mrp_frip]
    resources: *multi
    executor: *frip
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${rep}/meta.env
        rm -rf ${mrp_frip} && mkdir -p ${mrp_frip} && cd ${mrp_frip} && cp ${rep}/meta.env .
        peak=$${id}.mRp.clN_peaks.broadPeak
        if [ -s $$(echo ${rep}/$$peak) ]; then
        bam=$${id}.mRp.clN.sorted.bam
        ln -s ${mrp_markdup_item}/$$bam $$bam; ln -s ${rep}/$$peak $$peak
        READS_IN_PEAKS=$$(intersectBed -a $$bam -b $$peak -bed -c -f 0.20 | awk -F '\t' '{sum += $$NF} END {print sum}')
        samtools flagstat $$bam > $$bam.flagstat
        grep 'mapped (' $$bam.flagstat | grep -v "primary" | awk -v a="$$READS_IN_PEAKS" -v OFS='\t' '{print "'$$id'", a/$$1}' > $${id}.FRiP.txt
        rm $$bam $$peak
        fi
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: mrp_peaks_mqc
    name: MERGED_REPLICATE_CALL_ANNOTATE_PEAKS MULTIQC_CUSTOM_PEAKS
    over: {input_id: mrp_frip, as: rep}
    chain: true
    zip: [{input_id: mrp_macs2, as: mrp_macs2_item}]
    max_concurrency: 16
    inputs: [*a_mrp_macs2, *a_mrp_frip, *a_nfcore]
    outputs: [*a_mrp_peaks_mqc]
    resources: *single
    executor: *ubuntu
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${rep}/meta.env
        rm -rf ${mrp_peaks_mqc} && mkdir -p ${mrp_peaks_mqc} && cd ${mrp_peaks_mqc} && cp ${rep}/meta.env .
        peak=$${id}.mRp.clN_peaks.broadPeak
        if [ -s $$(echo ${mrp_macs2_item}/$$peak) ]; then
        prefix=$${id}.mRp.clN_peaks
        h1=merged_replicate_peak_count_header.txt; h2=merged_replicate_frip_score_header.txt
        ln -s ${mrp_macs2_item}/$$peak $$peak; ln -s ${rep}/$${id}.FRiP.txt $${id}.FRiP.txt
        ln -s ${nfcore}/assets/multiqc/$$h1 $$h1; ln -s ${nfcore}/assets/multiqc/$$h2 $$h2
        cat $$peak | wc -l | awk -v OFS='\t' '{ print "'$$prefix'", $$1 }' | cat $$h1 - > $${prefix}.count_mqc.tsv
        cat $$h2 $${id}.FRiP.txt > $${prefix}.FRiP_mqc.tsv
        rm $$peak $${id}.FRiP.txt $$h1 $$h2
        fi
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: mrp_homer
    name: MERGED_REPLICATE_CALL_ANNOTATE_PEAKS HOMER_ANNOTATEPEAKS
    over: {input_id: mrp_macs2, as: rep}
    chain: true
    max_concurrency: 16
    inputs: [*a_mrp_macs2, *a_reference]
    outputs: [*a_mrp_homer]
    resources: *multi
    executor: *homer
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${rep}/meta.env; . ${reference}/refs.env
        rm -rf ${mrp_homer} && mkdir -p ${mrp_homer} && cd ${mrp_homer} && cp ${rep}/meta.env .
        peak=$${id}.mRp.clN_peaks.broadPeak
        if [ -s $$(echo ${rep}/$$peak) ]; then
        ln -s ${rep}/$$peak $$peak; ln -s ${reference}/$$ref_fasta $$ref_fasta; ln -s ${reference}/$$ref_gtf $$ref_gtf
        annotatePeaks.pl \
            $$peak \
            $$ref_fasta \
            -gid \
            -gtf $$ref_gtf \
            -cpu ${task.resources.cpus} \
            > $${id}.mRp.clN_peaks.annotatePeaks.txt
        rm $$peak $$ref_fasta $$ref_gtf
        fi
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  # ---------------------------------------------------------------- merged replicate, aggregates
  - kind: horus_task
    id: mrp_macs2_qc
    name: MERGED_REPLICATE_CALL_ANNOTATE_PEAKS PLOT_MACS2_QC
    inputs: [*a_mrp_macs2, *a_nfcore]
    outputs: [*a_mrp_macs2_qc]
    resources: *multi
    executor: *plotr
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${mrp_macs2_qc} && mkdir -p ${mrp_macs2_qc} && cd ${mrp_macs2_qc}
        export PATH=${nfcore}/bin:$$PATH
        peaks=""
        for f in ${mrp_macs2}/*/*_peaks.broadPeak; do [ -s $$f ] && ln -s $$f . && peaks="$$peaks,$$(basename $$f)"; done
        peaks=$${peaks#,}
        if [ -n "$$peaks" ]; then
        plot_macs2_qc.r \
            -i $$peaks \
            -s $$(echo $$peaks | sed 's/_peaks\.broadPeak//g') \
            -o ./ -p macs2_peak.mRp.clN
        rm $$(echo $$peaks | tr , ' ')
        fi
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: mrp_homer_qc
    name: MERGED_REPLICATE_CALL_ANNOTATE_PEAKS PLOT_HOMER_ANNOTATEPEAKS
    inputs: [*a_mrp_homer, *a_nfcore]
    outputs: [*a_mrp_homer_qc]
    resources: *multi
    executor: *plotr
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${mrp_homer_qc} && mkdir -p ${mrp_homer_qc} && cd ${mrp_homer_qc}
        export PATH=${nfcore}/bin:$$PATH
        annos=""
        for f in ${mrp_homer}/*/*.annotatePeaks.txt; do [ -e $$f ] && ln -s $$f . && annos="$$annos,$$(basename $$f)"; done
        annos=$${annos#,}
        if [ -n "$$annos" ]; then
        h=merged_replicate_peak_annotation_header.txt
        ln -s ${nfcore}/assets/multiqc/$$h $$h
        plot_homer_annotatepeaks.r \
            -i $$annos \
            -s $$(echo $$annos | sed 's/\.mRp\.clN_peaks\.annotatePeaks\.txt//g') \
            -p macs2_annotatePeaks.mRp.clN \
            -o ./

        find ./ -type f -name "*summary.txt" -exec cat {} \; | cat $$h - > macs2_annotatePeaks.mRp.clN.summary_mqc.tsv
        rm $$h $$(echo $$annos | tr , ' ')
        fi
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: mrp_consensus
    name: MERGED_REPLICATE_CONSENSUS_PEAKS MACS2_CONSENSUS
    inputs: [*a_mrp_macs2, *a_nfcore]
    outputs: [*a_mrp_consensus]
    resources: *single
    executor: *consensus
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${mrp_consensus} && mkdir -p ${mrp_consensus} && cd ${mrp_consensus}
        export PATH=${nfcore}/bin:$$PATH
        for f in ${mrp_macs2}/*/*_peaks.broadPeak; do [ -s $$f ] && ln -s $$f .; done
        set -- $$(ls *_peaks.broadPeak 2>/dev/null | LC_ALL=C sort)
        if [ $$# -gt 1 ]; then
        prefix=consensus_peaks.mRp.clN
        sort -T '.' -k1,1 -k2,2n $$@ \
            | mergeBed -c 2,3,4,5,6,7,8,9 -o collapse,collapse,collapse,collapse,collapse,collapse,collapse,collapse > $${prefix}.txt

        macs2_merged_expand.py \
            $${prefix}.txt \
            $$(echo $$@ | tr ' ' , | sed 's/_peaks\.broadPeak//g') \
            $${prefix}.boolean.txt \
             \


        awk -v FS='\t' -v OFS='\t' 'FNR > 1 { print $$1, $$2, $$3, $$4, "0", "+" }' $${prefix}.boolean.txt > $${prefix}.bed

        echo -e "GeneID\tChr\tStart\tEnd\tStrand" > $${prefix}.saf
        awk -v FS='\t' -v OFS='\t' 'FNR > 1 { print $$4, $$1, $$2, $$3,  "+" }' $${prefix}.boolean.txt >> $${prefix}.saf

        plot_peak_intersect.r -i $${prefix}.boolean.intersect.txt -o $${prefix}.boolean.intersect.plot.pdf
        fi
        rm -f *_peaks.broadPeak
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: mrp_cons_homer
    name: MERGED_REPLICATE_CONSENSUS_PEAKS HOMER_ANNOTATEPEAKS
    inputs: [*a_mrp_consensus, *a_reference]
    outputs: [*a_mrp_cons_homer]
    resources: *multi
    executor: *homer
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${reference}/refs.env
        rm -rf ${mrp_cons_homer} && mkdir -p ${mrp_cons_homer} && cd ${mrp_cons_homer}
        prefix=consensus_peaks.mRp.clN
        if [ -e ${mrp_consensus}/$$prefix.bed ]; then
        ln -s ${mrp_consensus}/$$prefix.bed $$prefix.bed; ln -s ${reference}/$$ref_fasta $$ref_fasta; ln -s ${reference}/$$ref_gtf $$ref_gtf
        annotatePeaks.pl \
            $$prefix.bed \
            $$ref_fasta \
            -gid \
            -gtf $$ref_gtf \
            -cpu ${task.resources.cpus} \
            > $$prefix.annotatePeaks.txt
        rm $$prefix.bed $$ref_fasta $$ref_gtf
        fi
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  # featureCounts on the library BAMs of every replicate group with peaks.
  - kind: horus_task
    id: mrp_counts
    name: MERGED_REPLICATE_CONSENSUS_PEAKS SUBREAD_FEATURECOUNTS
    inputs: [*a_mrp_consensus, *a_mrp_macs2, *a_replicates, *a_mlb_filter, *a_mlb_clean_sort]
    outputs: [*a_mrp_counts]
    resources: *multi
    executor: *subread
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${mrp_counts} && mkdir -p ${mrp_counts} && cd ${mrp_counts}
        prefix=consensus_peaks.mRp.clN
        bams=""
        for p in ${mrp_macs2}/*/*.mRp.clN_peaks.broadPeak; do
            [ -s $$p ] || continue
            libraries=$$(. ${replicates}/$$(basename $$p .mRp.clN_peaks.broadPeak); echo $$libraries)
            for l in $$libraries; do
                b=$$l.mLb.clN.sorted.bam
                ln -s $$(ls ${mlb_filter}/*/$$b ${mlb_clean_sort}/*/$$b 2>/dev/null) $$b
                bams="$$bams $$b"
            done
        done
        set -- $$bams
        if [ -e ${mrp_consensus}/$$prefix.saf ] && [ $$# -gt 1 ]; then
        ln -s ${mrp_consensus}/$$prefix.saf $$prefix.saf
        featureCounts \
            -F SAF -O --fracOverlap 0.2 \
            -p \
            -T ${task.resources.cpus} \
            -a $$prefix.saf \
            -s 0 \
            -o $$prefix.featureCounts.txt \
            $$@
        rm $$prefix.saf
        fi
        rm -f $$bams
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: mrp_deseq2
    name: MERGED_REPLICATE_CONSENSUS_PEAKS DESEQ2_QC
    inputs: [*a_mrp_counts, *a_nfcore]
    outputs: [*a_mrp_deseq2]
    resources: *multi
    executor: *deseq2
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${mrp_deseq2} && mkdir -p ${mrp_deseq2} && cd ${mrp_deseq2}
        export PATH=${nfcore}/bin:$$PATH
        counts=consensus_peaks.mRp.clN.featureCounts.txt
        if [ -e ${mrp_counts}/$$counts ]; then
        prefix=consensus_peaks.mRp.clN; id=consensus_peaks; index=1
        h1=merged_replicate_deseq2_pca_header.txt; h2=merged_replicate_deseq2_clustering_header.txt
        ln -s ${mrp_counts}/$$counts $$counts; ln -s ${nfcore}/assets/multiqc/$$h1 $$h1; ln -s ${nfcore}/assets/multiqc/$$h2 $$h2
        deseq2_qc.r \
            --count_file $$counts \
            --outdir ./ \
            --outprefix $$prefix \
            --cores ${task.resources.cpus} \
            --id_col 1 --sample_suffix '.mLb.clN.sorted.bam' --count_col 7 --vst TRUE

        sed "s/deseq2_pca/deseq2_pca_$$index/g" <$$h1 >tmp.txt
        sed -i -e "s/DESeq2 /$$id DESeq2 /g" tmp.txt
        cat tmp.txt $${prefix}.pca.vals.txt > $${prefix}.pca.vals_mqc.tsv

        sed "s/deseq2_clustering/deseq2_clustering_$$index/g" <$$h2 >tmp.txt
        sed -i -e "s/DESeq2 /$$id DESeq2 /g" tmp.txt
        cat tmp.txt $${prefix}.sample.dists.txt > $${prefix}.sample.dists_mqc.tsv
        rm tmp.txt $$counts $$h1 $$h2
        fi
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  # ---------------------------------------------------------------- reports
  - kind: horus_task
    id: igv
    name: IGV
    description: IGV session over the published bigWigs, peaks and consensus BEDs, with paths as in the Nextflow outdir.
    inputs: [*a_reference, *a_chrom_sizes, *a_mlb_bigwig, *a_mlb_macs2, *a_mlb_consensus, *a_mrp_bigwig, *a_mrp_macs2, *a_mrp_consensus, *a_nfcore]
    outputs: [*a_igv]
    resources: *single
    executor: *python
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${reference}/refs.env
        rm -rf ${igv} && mkdir -p ${igv} && cd ${igv}
        export PATH=${nfcore}/bin:$$PATH
        ln -s ${reference}/$$ref_fasta $$ref_fasta; ln -s ${chrom_sizes}/$$ref_fasta.fai $$ref_fasta.fai
        stage() { d=$$1; shift; mkdir -p $$d; for f in "$$@"; do [ -s "$$f" ] && ln -s "$$f" $$d/ || true; done; }
        stage bwa/merged_library/bigwig ${mlb_bigwig}/*/*.bigWig
        stage bwa/merged_library/macs2/broad_peak ${mlb_macs2}/*/*Peak
        stage bwa/merged_library/macs2/broad_peak/consensus ${mlb_consensus}/*.bed
        stage bwa/merged_replicate/bigwig ${mrp_bigwig}/*/*.bigWig
        stage bwa/merged_replicate/macs2/broad_peak ${mrp_macs2}/*/*Peak
        stage bwa/merged_replicate/macs2/broad_peak/consensus ${mrp_consensus}/*.bed
        find * -type l -name "*.bigWig" -exec echo -e ""{}"\t0,0,178" \; | { grep "^bwa/merged_library/bigwig" || test $$? = 1; } > mLb_bigwig.igv.txt
        find * -type l -name "*Peak" -exec echo -e ""{}"\t0,0,178" \; | { grep "^bwa/merged_library/macs2/broad_peak" || test $$? = 1; } > mLb_peaks.igv.txt
        find * -type l -name "*.bed" -exec echo -e ""{}"\t0,0,0" \; | { grep "^bwa/merged_library/macs2/broad_peak/consensus" || test $$? = 1; } > mLb_bed.igv.txt
        find * -type l -name "*.bigWig" -exec echo -e ""{}"\t0,0,178" \; | { grep "^bwa/merged_replicate/bigwig" || test $$? = 1; } > mRp_bigwig.igv.txt
        find * -type l -name "*Peak" -exec echo -e ""{}"\t0,0,178" \; | { grep "^bwa/merged_replicate/macs2/broad_peak" || test $$? = 1; } > mRp_peaks.igv.txt
        find * -type l -name "*.bed" -exec echo -e ""{}"\t0,0,0" \; | { grep "^bwa/merged_replicate/macs2/broad_peak/consensus" || test $$? = 1; } > mRp_bed.igv.txt

        cat *.txt > igv_files.txt
        igv_files_to_session.py igv_session.xml igv_files.txt ../../genome/$$ref_fasta --path_prefix '../../'
        rm -r bwa $$ref_fasta $$ref_fasta.fai
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  # MultiQC stages the same files under the same folders as the MULTIQC
  # module's inputs; multiqc_config.yml in the work dir is read by MultiQC.
  - kind: horus_task
    id: multiqc
    name: MULTIQC
    inputs:
      - *a_nfcore
      - *a_fastqc
      - *a_trimgalore
      - *a_lb_stats
      - *a_lb_flagstat
      - *a_lb_idxstats
      - *a_mlb_md_stats
      - *a_mlb_md_flagstat
      - *a_mlb_md_idxstats
      - *a_mlb_markdup
      - *a_mlb_stats
      - *a_mlb_flagstat
      - *a_mlb_idxstats
      - *a_mlb_cmm
      - *a_mlb_profile
      - *a_mlb_fingerprint
      - *a_mlb_peaks_mqc
      - *a_mlb_homer_qc
      - *a_mlb_counts
      - *a_mrp_stats
      - *a_mrp_flagstat
      - *a_mrp_idxstats
      - *a_mrp_markdup
      - *a_mrp_peaks_mqc
      - *a_mrp_homer_qc
      - *a_mrp_counts
      - *a_mlb_deseq2
      - *a_mrp_deseq2
      # not read: the pipeline's MULTIQC waits for these through the versions channel
      - *a_mlb_mkarv
      - *a_mlb_heatmap
      - *a_mlb_macs2_qc
      - *a_mrp_macs2_qc
      - *a_mlb_cons_homer
      - *a_mrp_cons_homer
      - *a_mrp_bigwig
      - *a_igv
    outputs: [*a_multiqc]
    resources: *multi
    executor: *multiqc
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${multiqc} && mkdir -p ${multiqc} && cd ${multiqc}
        stage() { d=$$1; shift; mkdir -p $$d; for f in "$$@"; do [ -e "$$f" ] && ln -s "$$f" $$d/ && echo "$$d/$$(basename $$f)" >> multiqc_inputs.txt || true; done; }
        ln -s ${nfcore}/assets/multiqc_config.yml multiqc_config.yml
        stage fastqc ${fastqc}/*/*.zip
        stage trimgalore/fastqc ${trimgalore}/*/*.zip
        stage trimgalore ${trimgalore}/*/*report.txt
        stage alignment/library ${lb_stats}/*/*.stats ${lb_flagstat}/*/*.flagstat ${lb_idxstats}/*/*.idxstats
        stage alignment/merged_library/unfiltered ${mlb_md_stats}/*/*.stats ${mlb_md_flagstat}/*/*.flagstat ${mlb_md_idxstats}/*/*.idxstats
        stage alignment/merged_library/unfiltered/picard_metrics ${mlb_markdup}/*/*.metrics.txt
        stage alignment/merged_library/filtered ${mlb_stats}/*/*.stats ${mlb_flagstat}/*/*.flagstat ${mlb_idxstats}/*/*.idxstats
        stage alignment/merged_library/filtered/picard_metrics ${mlb_cmm}/*/*_metrics
        stage preseq
        stage deeptools ${mlb_profile}/*/*.plotProfile.tab ${mlb_fingerprint}/*/*.raw.txt
        stage macs2/merged_library/peaks ${mlb_peaks_mqc}/*/*_mqc.tsv
        stage macs2/merged_library/annotation ${mlb_homer_qc}/*.summary_mqc.tsv
        stage macs2/merged_library/featurecounts ${mlb_counts}/*.featureCounts.txt.summary
