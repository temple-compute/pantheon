        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: lb_flagstat
    name: FASTQ_ALIGN_BWA SAMTOOLS_FLAGSTAT
    over: {input_id: lb_index, as: run}
    chain: true
    zip: [{input_id: lb_sort, as: lb_sort_item}]
