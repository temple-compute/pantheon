        ln -s ${lib}/$${id}.mLb.clN.bedGraph $${id}.mLb.clN.bedGraph; ln -s ${chrom_sizes}/$$sizes $$sizes
        bedGraphToBigWig \
            $${id}.mLb.clN.bedGraph \
            $$sizes \
            $${id}.mLb.clN.bigWig
        rm $${id}.mLb.clN.bedGraph $$sizes
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: mlb_mat_scale
    name: DEEPTOOLS_COMPUTEMATRIX_SCALE_REGIONS
    over: {input_id: mlb_bigwig, as: lib}
    chain: true
    max_concurrency: 16
    inputs: [*a_mlb_bigwig, *a_gene_bed]
    outputs: [*a_mlb_mat_scale]
    resources: *multi
    executor: *deeptools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${lib}/meta.env
        rm -rf ${mlb_mat_scale} && mkdir -p ${mlb_mat_scale} && cd ${mlb_mat_scale} && cp ${lib}/meta.env .
        bed=$$(cd ${gene_bed} && ls *.bed)
        ln -s ${lib}/$${id}.mLb.clN.bigWig $${id}.mLb.clN.bigWig; ln -s ${gene_bed}/$$bed $$bed
        prefix=$${id}.mLb.clN.scale_regions
        computeMatrix \
            scale-regions --regionBodyLength 1000 --beforeRegionStartLength 3000 --afterRegionStartLength 3000 --missingDataAsZero --skipZeros --smartLabels \
            --regionsFileName $$bed \
            --scoreFileName $${id}.mLb.clN.bigWig \
            --outFileName $${prefix}.computeMatrix.mat.gz \
            --outFileNameMatrix $${prefix}.computeMatrix.vals.mat.tab \
            --numberOfProcessors ${task.resources.cpus}
        rm $${id}.mLb.clN.bigWig $$bed
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: mlb_mat_ref
    name: DEEPTOOLS_COMPUTEMATRIX_REFERENCE_POINT
    over: {input_id: mlb_bigwig, as: lib}
    chain: true
    max_concurrency: 16
    inputs: [*a_mlb_bigwig, *a_tss_bed]
    outputs: [*a_mlb_mat_ref]
    resources: *multi
    executor: *deeptools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${lib}/meta.env
        rm -rf ${mlb_mat_ref} && mkdir -p ${mlb_mat_ref} && cd ${mlb_mat_ref} && cp ${lib}/meta.env .
        bed=$$(cd ${tss_bed} && ls *.bed)
        ln -s ${lib}/$${id}.mLb.clN.bigWig $${id}.mLb.clN.bigWig; ln -s ${tss_bed}/$$bed $$bed
        prefix=$${id}.mLb.clN.reference_point
        computeMatrix \
            reference-point --missingDataAsZero --skipZeros --smartLabels --upstream 3000 --downstream 3000 \
            --regionsFileName $$bed \
            --scoreFileName $${id}.mLb.clN.bigWig \
            --outFileName $${prefix}.computeMatrix.mat.gz \
            --outFileNameMatrix $${prefix}.computeMatrix.vals.mat.tab \
            --numberOfProcessors ${task.resources.cpus}
        rm $${id}.mLb.clN.bigWig $$bed
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  # plotProfile reads the scale-regions matrix under the reference_point
  # prefix and plotHeatmap the reverse, as conf/modules.config sets them.
  - kind: horus_map
    id: mlb_profile
    name: DEEPTOOLS_PLOTPROFILE
    over: {input_id: mlb_mat_scale, as: lib}
    chain: true
    max_concurrency: 16
