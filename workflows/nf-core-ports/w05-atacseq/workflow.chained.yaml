  # ---------------------------------------------------------------- merged library
  - kind: horus_map
    id: mlb_merge
    name: PICARD_MERGESAMFILES_LIBRARY
    over: {input_id: libraries, as: lib}
    max_concurrency: 16
    inputs: [*a_libraries, *a_lb_sort]
    outputs: [*a_mlb_merge]
    resources: *multi
    executor: *picard
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${lib}); . ${lib}
        rm -rf ${mlb_merge} && mkdir -p ${mlb_merge} && cd ${mlb_merge}
        { echo id=$$id; cat ${lib}; } > meta.env
        bams=$$(for r in $$runs; do echo $$r.Lb.sorted.bam; done | LC_ALL=C sort)
        for b in $$bams; do ln -s ${lb_sort}/*/$$b $$b; done
        set -- $$bams
        if [ $$# -gt 1 ]; then
        picard \
            -Xmx$$(( ${task.resources.memory_gb} * 1024 * 8 / 10 ))M \
            MergeSamFiles \
            --SORT_ORDER coordinate --VALIDATION_STRINGENCY LENIENT --TMP_DIR tmp \
            $$(printf -- '--INPUT %s ' "$$@") \
            --OUTPUT $${id}.mLb.sorted.bam
        rm -rf tmp
        else
        # Nextflow links the single BAM; a copy keeps the output folder self-contained.
        cp $$1 $${id}.mLb.sorted.bam
        fi
        rm $$bams
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: mlb_markdup
    name: MERGED_LIBRARY_MARKDUPLICATES_PICARD PICARD_MARKDUPLICATES
    over: {input_id: mlb_merge, as: lib}
    chain: true
    max_concurrency: 16
    inputs: [*a_mlb_merge, *a_reference, *a_chrom_sizes]
    outputs: [*a_mlb_markdup]
    resources: *multi
    executor: *picard
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${lib}/meta.env; . ${reference}/refs.env
        rm -rf ${mlb_markdup} && mkdir -p ${mlb_markdup} && cd ${mlb_markdup} && cp ${lib}/meta.env .
        ln -s ${lib}/$${id}.mLb.sorted.bam $${id}.mLb.sorted.bam
        ln -s ${reference}/$$ref_fasta $$ref_fasta; ln -s ${chrom_sizes}/$$ref_fasta.fai $$ref_fasta.fai
        picard \
            -Xmx$$(( ${task.resources.memory_gb} * 1024 * 8 / 10 ))M \
            MarkDuplicates \
            --ASSUME_SORTED true --REMOVE_DUPLICATES false --VALIDATION_STRINGENCY LENIENT --TMP_DIR tmp \
            --INPUT $${id}.mLb.sorted.bam \
            --OUTPUT $${id}.mLb.mkD.sorted.bam \
            --REFERENCE_SEQUENCE $$ref_fasta \
            --METRICS_FILE $${id}.mLb.mkD.sorted.MarkDuplicates.metrics.txt
        rm -rf tmp $${id}.mLb.sorted.bam $$ref_fasta $$ref_fasta.fai
        NF
        exec bash -euo pipefail /tmp/.command.sh
    target: *target

