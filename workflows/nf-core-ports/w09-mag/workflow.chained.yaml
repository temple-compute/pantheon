kind: horus_workflow
name: nf-core mag chained

# Native port of nf-core/mag 5.5.0, the route `-profile test,docker` runs:
# FastQC, fastp and Bowtie2 PhiX removal per run, CAT_FASTQ for multi-run
# samples, MEGAHIT and metaSPAdes per sample, QUAST and Prodigal per assembly,
# Bowtie2 mapping of every sample of a group to each assembly, MetaBAT2,
# MaxBin2 and SemiBin2 binning, SPLIT_FASTA of unbinned contigs, then BUSCO,
# QUAST, CAT, GTDB-Tk and Prokka on the bins, bin depths, the bin summary and
# MultiQC. Images, rendered command lines (ext.args from conf/modules.config
# and conf/test.config) and per-process cpus/memory are the executed ones; the
# test profile caps every process at 4 cpus / 15 GB.
#
# Every command runs under `bash -C -e -u -o pipefail`, the pipeline's
# process.shell: each command writes its script to /tmp/.command.sh and runs
# it with bash, as .command.run does. The executors set the pipeline's `env`
# block (PYTHONNOUSERSITE, R_PROFILE_USER, R_ENVIRON_USER, JULIA_DEPOT_PATH).
# Commands link their inputs into the output folder under the names Nextflow
# stages, run the rendered script, and remove the links.
#
# Per-run, per-sample and per-assembly steps are horus_map stages over folders
# of meta files written by stage_samples (bash-sourceable, named by the
# Nextflow tag). After binning, scripts/decide.py turns the channel logic
# (bin size filter, unbinned splits, post-binning sets, BUSCO filter for
# GTDB-Tk) into folders of item folders named by the Nextflow prefix. Map
# slots are numbered, so every output file carries its id and a downstream
# step finds it as <upstream>/*/<name>.
#
# Chained variant of workflow.yaml: same commands and outputs. Maps that share
# an item space set `chain: true` and iterate the upstream map's slots, so a
# clone starts as soon as its upstream item is done, not when the whole map
# is: fastp -> PhiX removal -> FastQC (per run); gunzip -> QUAST, Prodigal,
# Bowtie2 index (per assembly); contig depths -> CONVERT_DEPTHS -> MaxBin2 and
# contig depths -> MetaBAT2; the CAT bins and unbinned chains. A chained body
# reads only its own slot (${item}, or a slot of another map paired by `zip`),
# and takes the assembly or set name from the file names in it. The channel
# logic after binning stays in decision tasks (it joins items across maps).
# Needs a runtime with map chaining (horus_map chain, zip, drop_exit_codes).
#
# capacity: memory-based admission like Nextflow's local executor. The key is
# the target's location_id (local://<hostname>); set it to the host that runs
# the tasks, or the gate does not apply.

capacity:
  local://ubuntu-awow:
    cpus: 16
    memory_gb: 30
max_concurrency: 16

_target: &target
  kind: local

# Run on a remote node instead: point every task at this anchor.
# _target: &target
#   kind: ssh
#   host: bench-node.example.org
#   username: ubuntu
#   working_directory: /home/ubuntu/horus

# nextflow.config `env` block.
_env: &nfenv
  PYTHONNOUSERSITE: "1"
  R_PROFILE_USER: /.Rprofile
  R_ENVIRON_USER: /.Renviron
  JULIA_DEPOT_PATH: /usr/local/share/julia

# Containers (.command.run docker lines); `user: host` runs them as the
# calling user, as nf-core's `-u $(id -u):$(id -g)` does.
_img:
  coreutils: &coreutils {kind: docker, user: host, env: *nfenv, image: "community.wave.seqera.io/library/coreutils_grep_gzip_lbzip2_pruned:838ba80435a629f8"}
  fastqc: &fastqc {kind: docker, user: host, env: *nfenv, image: "quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0"}
  fastp: &fastp {kind: docker, user: host, env: *nfenv, image: "community.wave.seqera.io/library/fastp:1.0.1--c8b87fe62dcc103c"}
  bowtie2: &bowtie2 {kind: docker, user: host, env: *nfenv, image: "quay.io/biocontainers/bowtie2:2.4.2--py38h1c8e9b9_1"}
  bowtie2_samtools: &bowtie2_samtools {kind: docker, user: host, env: *nfenv, image: "quay.io/biocontainers/mulled-v2-ac74a7f02cebcfcc07d8e8d1d750af9c83b4d45a:577a697be67b5ae9b16f637fd723b8263a3898b3-0"}
