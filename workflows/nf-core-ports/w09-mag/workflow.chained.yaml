  spades: &spades {kind: docker, user: host, env: *nfenv, image: "community.wave.seqera.io/library/spades:4.1.0--77799c52e1d1054a"}
  quast: &quast {kind: docker, user: host, env: *nfenv, image: "quay.io/biocontainers/quast:5.0.2--py37pl526hb5aa323_2"}
  prodigal: &prodigal {kind: docker, user: host, env: *nfenv, image: "community.wave.seqera.io/library/prodigal_pigz:27b5cdb2d516f347"}
  metabat2_215: &metabat2_215 {kind: docker, user: host, env: *nfenv, image: "quay.io/biocontainers/metabat2:2.15--h986a166_1"}
  metabat2_217: &metabat2_217 {kind: docker, user: host, env: *nfenv, image: "quay.io/biocontainers/metabat2:2.17--hd498684_0"}
  bioawk: &bioawk {kind: docker, user: host, env: *nfenv, image: "quay.io/biocontainers/bioawk:1.0--hed695b0_5"}
  maxbin2: &maxbin2 {kind: docker, user: host, env: *nfenv, image: "quay.io/biocontainers/maxbin2:2.2.7--he1b5a44_2"}
  semibin: &semibin {kind: docker, user: host, env: *nfenv, image: "community.wave.seqera.io/library/semibin_igraph:fcb667d6c87bf3fd"}
  seqkit: &seqkit {kind: docker, user: host, env: *nfenv, image: "quay.io/biocontainers/seqkit:2.9.0--h9ee0642_0"}
  pybio: &pybio {kind: docker, user: host, env: *nfenv, image: "quay.io/biocontainers/mulled-v2-e25d1fa2bb6cbacd47a4f8b2308bd01ba38c5dd7:75310f02364a762e6ba5206fcd11d7529534ed6e-0"}
  busco: &busco {kind: docker, user: host, env: *nfenv, image: "community.wave.seqera.io/library/busco:6.1.0--6d1f7006d91892b3"}
  qsv: &qsv {kind: docker, user: host, env: *nfenv, image: "community.wave.seqera.io/library/qsv:5.1.0--9a6a0c23d3b279b5"}
