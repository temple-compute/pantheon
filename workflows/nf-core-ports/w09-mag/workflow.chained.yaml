  pigz: &pigz {kind: docker, user: host, env: *nfenv, image: "community.wave.seqera.io/library/findutils_pigz:c4dd5edc44402661"}
  prokka: &prokka {kind: docker, user: host, env: *nfenv, image: "community.wave.seqera.io/library/prokka_openjdk_parallel:f21b98bcef4c3579"}
  multiqc: &multiqc {kind: docker, user: host, env: *nfenv, image: "community.wave.seqera.io/library/multiqc:1.34--db7c73dae76bc9e6"}

