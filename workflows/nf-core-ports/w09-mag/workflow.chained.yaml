  c2m12: &c2m12 {cpus: 2, memory_gb: 12, walltime: "01:00:00"}
  c2m15: &c2m15 {cpus: 2, memory_gb: 15, walltime: "01:00:00"}
  c4m2: &c4m2 {cpus: 4, memory_gb: 2, walltime: "01:00:00"}
