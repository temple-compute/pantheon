artifacts:
  - <<: *a_samplesheet
    description: >-
      nf-core/mag samplesheet (sample,run,group,short_reads_platform,short_reads_1,
      short_reads_2,long_reads), paired short reads only. Reads may be URLs or paths
      relative to the samplesheet; rows sharing a sample are runs of one sample.
      Default: the test profile samplesheet (3 runs, 2 samples).
  - <<: *a_nfcore
    description: nf-core/mag 5.5.0 bin/ scripts, assets/multiqc_config.yml and the PhiX reference (MIT).
  - <<: *a_mirror
    description: >-
      Folder searched for each input file by name before downloading it (e.g. a
      local copy of the test data). Empty downloads everything.
    value: ""
    pattern: '[^"`$\\]*'
  - {<<: *a_busco_url, pattern: '[^"`$\\]*', description: "--busco_db (.tar.gz)", value: "https://raw.githubusercontent.com/nf-core/test-datasets/mag/databases/busco/bacteria_odb10.2024-01-08.tar.gz"}
  - {<<: *a_busco_lineage, pattern: '[A-Za-z0-9_.-]+', description: "--busco_db_lineage", value: "bacteria_odb10"}
  - {<<: *a_cat_url, pattern: '[^"`$\\]*', description: "--cat_db (.tar.gz with db/ and tax/)", value: "https://raw.githubusercontent.com/nf-core/test-datasets/mag/databases/cat/minigut_cat.tar.gz"}
  - {<<: *a_gtdb_url, pattern: '[^"`$\\]*', description: "--gtdb_db (.tar.gz)", value: "https://raw.githubusercontent.com/nf-core/test-datasets/mag/databases/gtdbtk/gtdbtk_mockup_r232_20260507.tar.gz"}
  - {<<: *a_min_len_unbinned, value: 1, min: 1, description: "--min_length_unbinned_contigs"}
  - {<<: *a_max_unbinned, value: 2, min: 1, description: "--max_unbinned_contigs"}
  - {<<: *a_bin_min, value: 0, min: 0, description: "--bin_min_size (bp)"}
  - {<<: *a_bin_max, value: 0, min: 0, description: "--bin_max_size (bp); 0 for no maximum"}
  - {<<: *a_gtdb_comp, value: 0.01, min: 0, max: 100, description: "--gtdbtk_min_completeness (BUSCO % complete)"}
  - {<<: *a_gtdb_cont, value: 10.0, min: 0, max: 100, description: "--gtdbtk_max_contamination (BUSCO % duplicated)"}

tasks:
  # ---------------------------------------------------------------- inputs
  - kind: horus_task
    id: stage_samples
    name: Split the samplesheet
    description: Downloads the reads per run and writes the run, sample, assembly and mapping lists.
    inputs: [*a_samplesheet, *a_mirror]
    outputs: [*a_reads, *a_runs, *a_samples, *a_multi_run, *a_assemblies, *a_aligns]
    executor: {kind: shell}
    runtime:
      kind: python_script
      script: scripts/stage_inputs.py
      python: python3 # stdlib only
      args: >-
        samples --samplesheet ${samplesheet} --mirror ${input_mirror} --reads ${reads} --runs ${runs}
        --samples ${samples} --multi-run ${multi_run} --assemblies ${assemblies} --aligns ${aligns}
    target: *target

  - kind: horus_task
    id: fetch_databases
    name: Fetch databases
    description: Downloads the BUSCO, CAT and GTDB-Tk database archives.
    inputs: [*a_busco_url, *a_cat_url, *a_gtdb_url, *a_mirror]
    outputs: [*a_dbs]
    executor: {kind: shell}
    runtime:
      kind: python_script
      script: scripts/stage_inputs.py
      python: python3 # stdlib only
      args: databases --out ${dbs} --mirror ${input_mirror} ${busco_db_url} ${cat_db_url} ${gtdb_db_url}
    target: *target

  - kind: horus_task
    id: busco_untar
    name: BUSCO_UNTAR
    inputs: [*a_dbs, *a_busco_url, *a_busco_lineage]
    outputs: [*a_busco_db]
    resources: *c1m6
    executor: *coreutils
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        f=$$(basename ${busco_db_url}); lineage=${busco_db_lineage}
        rm -rf ${busco_db} && mkdir -p ${busco_db} && cd ${busco_db}
        ln -s ${dbs}/$$f $$f
        mkdir -p busco_db/lineages/$$lineage

        ## Ensures --strip-components only applied when top level of tar contents is a directory
        ## If just files or multiple directories, place all in prefix
        if [[ $$(tar -taf $$f | grep -o -P "^.*?\/" | uniq | wc -l) -eq 1 ]]; then
            tar \
                -C busco_db/lineages/$$lineage --strip-components 1 \
                -xavf \
                 \
                $$f \

        else
            tar \
                -C busco_db/lineages/$$lineage \
                -xavf \
                 \
                $$f \

        fi
        rm $$f
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: cat_untar
    name: CATPACK_DB_UNTAR
    inputs: [*a_dbs, *a_cat_url]
    outputs: [*a_cat_db]
    resources: *c1m6
    executor: *coreutils
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        f=$$(basename ${cat_db_url})
        rm -rf ${cat_db} && mkdir -p ${cat_db} && cd ${cat_db}
        ln -s ${dbs}/$$f $$f
        mkdir -p ./cat_db

        ## Ensures --strip-components only applied when top level of tar contents is a directory
        ## If just files or multiple directories, place all in prefix
        if [[ $$(tar -taf $$f | grep -o -P "^.*?\/" | uniq | wc -l) -eq 1 ]]; then
            tar \
                -C ./cat_db --strip-components 1 \
                -xavf \
                 \
                $$f \

        else
            tar \
                -C ./cat_db \
                -xavf \
                 \
                $$f \

        fi
        rm $$f
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: gtdb_prep
    name: GTDBTK_DB_PREPARATION
    inputs: [*a_dbs, *a_gtdb_url]
    outputs: [*a_gtdb_db]
    resources: *c1m7
    executor: *coreutils
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        f=$$(basename ${gtdb_db_url})
        rm -rf ${gtdb_db} && mkdir -p ${gtdb_db} && cd ${gtdb_db}
        ln -s ${dbs}/$$f $$f
        mkdir database
        tar -xzf $$f -C database --strip 1
        rm $$f
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # -------------------------------------------------- short read QC per run
  # FASTQC_RAW: reads are linked as <id>_run<run>_raw_<n>.gz, as the module does.
  - kind: horus_map
    id: fastqc_raw
    name: FASTQC_RAW
    over: {input_id: runs, as: item}
    max_concurrency: 16
    inputs: [*a_runs, *a_reads]
    outputs: [*a_fastqc_raw]
    resources: *c2m12
    executor: *fastqc
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${item}; rid=$$(basename ${item})
        mem=$$(( ${task.resources.memory_gb} * 1024 / ${task.resources.cpus} ))
        [ $$mem -gt 10000 ] && mem=10000
        [ $$mem -lt 100 ] && mem=100
        rm -rf ${fastqc_raw} && mkdir -p ${fastqc_raw}/1 ${fastqc_raw}/2 && cd ${fastqc_raw}
        ln -s ${reads}/$$rid/$$r1 1/$$r1; ln -s ${reads}/$$rid/$$r2 2/$$r2
        printf "%s %s\n" 1/$$r1 $${rid}_raw_1.gz 2/$$r2 $${rid}_raw_2.gz | while read old_name new_name; do
            [ -f "$${new_name}" ] || ln -s $$old_name $$new_name
        done

        fastqc \
            --quiet \
            --threads ${task.resources.cpus} \
            --memory $$mem \
            $${rid}_raw_1.gz $${rid}_raw_2.gz
        rm -r 1 2 $${rid}_raw_1.gz $${rid}_raw_2.gz
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: fastp
    name: FASTP
    over: {input_id: runs, as: item}
    max_concurrency: 16
    inputs: [*a_runs, *a_reads]
    outputs: [*a_fastp]
    resources: *c4m8
    executor: *fastp
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${item}; p=$$(basename ${item})_fastp
        rm -rf ${fastp} && mkdir -p ${fastp} && cd ${fastp}
        ln -s ${reads}/$$(basename ${item})/$$r1 $$r1; ln -s ${reads}/$$(basename ${item})/$$r2 $$r2
        [ ! -f  $${p}_1.fastq.gz ] && ln -sf $$r1 $${p}_1.fastq.gz
        [ ! -f  $${p}_2.fastq.gz ] && ln -sf $$r2 $${p}_2.fastq.gz
        fastp \
            --in1 $${p}_1.fastq.gz \
            --in2 $${p}_2.fastq.gz \
            --out1 $${p}_1.fastp.fastq.gz \
            --out2 $${p}_2.fastp.fastq.gz \
            --json $${p}.fastp.json \
            --html $${p}.fastp.html \
             \
             \
             \
            --thread ${task.resources.cpus} \
            --detect_adapter_for_pe \
            -q 15 --cut_front --cut_tail --cut_mean_quality 15 --length_required 15 \
            2>| >(tee $${p}.fastp.log >&2)
        wait
        rm $$r1 $$r2 $${p}_1.fastq.gz $${p}_2.fastq.gz
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: phix_build
    name: BOWTIE2_PHIX_REMOVAL_BUILD
    inputs: [*a_nfcore]
    outputs: [*a_phix_index]
    resources: *c1m7
    executor: *bowtie2
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${phix_index} && mkdir -p ${phix_index} && cd ${phix_index}
        ln -s ${nfcore}/assets/data/GCA_002596845.1_ASM259684v1_genomic.fna.gz .
        mkdir bowtie
        bowtie2-build --threads ${task.resources.cpus} GCA_002596845.1_ASM259684v1_genomic.fna.gz GCA_002596845
        rm GCA_002596845.1_ASM259684v1_genomic.fna.gz
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: phix_align
    name: BOWTIE2_PHIX_REMOVAL_ALIGN
    over: {input_id: fastp, as: item}
    chain: true
    max_concurrency: 16
    inputs: [*a_runs, *a_fastp, *a_phix_index]
    outputs: [*a_phix]
    resources: *c4m2
    executor: *bowtie2
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rid=$$(basename ${item}/*.fastp.json .fastp.json); rid=$${rid%_fastp}; p=$${rid}_phix_removed
        rm -rf ${phix} && mkdir -p ${phix} && cd ${phix}
        for f in ${phix_index}/*.bt2 ${item}/$${rid}_fastp_[12].fastp.fastq.gz; do ln -s $$f $$(basename $$f); done
        INDEX=`find -L ./ -name "*.rev.1.bt2" | sed "s/\.rev.1.bt2$$//"`
        [ -z "$$INDEX" ] && INDEX=`find -L ./ -name "*.rev.1.bt2l" | sed "s/\.rev.1.bt2l$$//"`
        [ -z "$$INDEX" ] && echo "Bowtie2 index files not found" 1>&2 && exit 1

        bowtie2 -p ${task.resources.cpus}                 -x $$INDEX                 -1 "$${rid}_fastp_1.fastp.fastq.gz" -2 "$${rid}_fastp_2.fastp.fastq.gz"                                  --un-conc-gz $${p}.unmapped_%.fastq.gz                 --al-conc-gz $${p}.mapped_%.fastq.gz                 1> /dev/null                 2> $${p}.bowtie2.log
        if [ N = "Y" ] ; then
            gunzip -c $${p}.mapped_1.fastq.gz | awk '{if(NR%4==1) print substr($$0, 2)}' | LC_ALL=C sort > $${p}.mapped_1.read_ids.txt
            gunzip -c $${p}.mapped_2.fastq.gz | awk '{if(NR%4==1) print substr($$0, 2)}' | LC_ALL=C sort > $${p}.mapped_2.read_ids.txt
        fi
        rm -f $${p}.mapped_*.fastq.gz
        rm *.bt2 $${rid}_fastp_[12].fastp.fastq.gz
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: fastqc_trimmed
    name: FASTQC_TRIMMED
    over: {input_id: phix, as: item}
    chain: true
    max_concurrency: 16
    inputs: [*a_runs, *a_phix]
    outputs: [*a_fastqc_trimmed]
    resources: *c2m12
    executor: *fastqc
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rid=$$(basename ${item}/*_phix_removed.bowtie2.log _phix_removed.bowtie2.log); p=$${rid}_phix_removed.unmapped
        mem=$$(( ${task.resources.memory_gb} * 1024 / ${task.resources.cpus} ))
        [ $$mem -gt 10000 ] && mem=10000
        [ $$mem -lt 100 ] && mem=100
        rm -rf ${fastqc_trimmed} && mkdir -p ${fastqc_trimmed}/1 ${fastqc_trimmed}/2 && cd ${fastqc_trimmed}
        ln -s ${item}/$${p}_1.fastq.gz 1/; ln -s ${item}/$${p}_2.fastq.gz 2/
        printf "%s %s\n" 1/$${p}_1.fastq.gz $${rid}_trimmed_1.gz 2/$${p}_2.fastq.gz $${rid}_trimmed_2.gz | while read old_name new_name; do
            [ -f "$${new_name}" ] || ln -s $$old_name $$new_name
        done

        fastqc \
            --quiet \
            --threads ${task.resources.cpus} \
            --memory $$mem \
            $${rid}_trimmed_1.gz $${rid}_trimmed_2.gz
        rm -r 1 2 $${rid}_trimmed_1.gz $${rid}_trimmed_2.gz
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # CAT_FASTQ: runs in samplesheet row order (Nextflow: arrival order).
  - kind: horus_map
    id: cat_fastq
    name: CAT_FASTQ
    over: {input_id: multi_run, as: item}
    max_concurrency: 16
    inputs: [*a_multi_run, *a_phix]
    outputs: [*a_cat_fastq]
    resources: *c1m6
    executor: *coreutils
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${item}
        rm -rf ${cat_fastq} && mkdir -p ${cat_fastq} && cd ${cat_fastq}
        n=0; r1=""; r2=""
        for rid in $$runs; do
            mkdir input$$((n + 1)) input$$((n + 2))
            ln -s ${phix}/*/$${rid}_phix_removed.unmapped_1.fastq.gz input$$((n + 1))/
            ln -s ${phix}/*/$${rid}_phix_removed.unmapped_2.fastq.gz input$$((n + 2))/
            r1="$$r1 input$$((n + 1))/$${rid}_phix_removed.unmapped_1.fastq.gz"
            r2="$$r2 input$$((n + 2))/$${rid}_phix_removed.unmapped_2.fastq.gz"
            n=$$((n + 2))
        done
        cat $$r1 > $${id}_1.merged.fastq.gz
        cat $$r2 > $${id}_2.merged.fastq.gz
        rm -r input*
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # ---------------------------------------------------- assembly per sample
  # Reads per sample: CAT_FASTQ output for multi-run samples, else the run's
  # PhiX-removed reads (SHORTREAD_PREPROCESSING skip_cat branch).
  - kind: horus_map
    id: megahit
    name: MEGAHIT
    over: {input_id: samples, as: item}
    max_concurrency: 16
    inputs: [*a_samples, *a_phix, *a_cat_fastq]
    outputs: [*a_megahit]
    resources: *c1m15
    executor: *megahit
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${item}
        rm -rf ${megahit} && mkdir -p ${megahit} && cd ${megahit}
        if [ $$merged = true ]; then set -- ${cat_fastq}/*/$${id}_[12].merged.fastq.gz
        else set -- ${phix}/*/$${runs}_phix_removed.unmapped_[12].fastq.gz; fi
        for f in "$$@"; do ln -s $$f $$(basename $$f); done
        megahit \
            -m $$(( ${task.resources.memory_gb} * 1073741824 )) \
            -t ${task.resources.cpus} \
            -1 $$(basename $$1) -2 $$(basename $$2) \
            --out-prefix MEGAHIT-$$id

        pigz \
            --no-name \
            -p ${task.resources.cpus} \
             \
            megahit_out/*.fa \
            megahit_out/intermediate_contigs/*.fa

        mv megahit_out/* .
        rmdir megahit_out
        for f in "$$@"; do rm $$(basename $$f); done
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: spades
    name: METASPADES
    over: {input_id: samples, as: item}
    max_concurrency: 16
    inputs: [*a_samples, *a_phix, *a_cat_fastq]
    outputs: [*a_spades]
    resources: *c1m15
    executor: *spades
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${item}; prefix=SPAdes-$$id
        rm -rf ${spades} && mkdir -p ${spades} && cd ${spades}
        if [ $$merged = true ]; then set -- ${cat_fastq}/*/$${id}_[12].merged.fastq.gz
        else set -- ${phix}/*/$${runs}_phix_removed.unmapped_[12].fastq.gz; fi
        for f in "$$@"; do ln -s $$f $$(basename $$f); done
        spades.py \
            --meta \
            --threads ${task.resources.cpus} \
            --memory ${task.resources.memory_gb} \
             \
            -1 $$(basename $$1) -2 $$(basename $$2)   \
            -o ./
        mv spades.log $$prefix.spades.log

        if [ -f scaffolds.fasta ]; then
            mv scaffolds.fasta $$prefix.scaffolds.fa
            gzip -n $$prefix.scaffolds.fa
        fi
        if [ -f contigs.fasta ]; then
            mv contigs.fasta $$prefix.contigs.fa
            gzip -n $$prefix.contigs.fa
        fi
        if [ -f transcripts.fasta ]; then
            mv transcripts.fasta $$prefix.transcripts.fa
            gzip -n $$prefix.transcripts.fa
        fi
        if [ -f assembly_graph_with_scaffolds.gfa ]; then
            mv assembly_graph_with_scaffolds.gfa $$prefix.assembly.gfa
            gzip -n $$prefix.assembly.gfa
        fi

        if [ -f gene_clusters.fasta ]; then
            mv gene_clusters.fasta $$prefix.gene_clusters.fa
            gzip -n $$prefix.gene_clusters.fa
        fi

        if [ -f warnings.log ]; then
            mv warnings.log $$prefix.warnings.log
        fi
        for f in "$$@"; do rm $$(basename $$f); done
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # ------------------------------------------------------ per assembly
  - kind: horus_map
    id: gunzip
    name: GUNZIP_SHORTREAD_ASSEMBLIES
    over: {input_id: assemblies, as: item}
    max_concurrency: 16
    inputs: [*a_assemblies, *a_megahit, *a_spades]
    outputs: [*a_gunzip]
    resources: *c1m6
    executor: *coreutils
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${item}; f=$$assembler-$$id.$$ext.fa
        rm -rf ${gunzip} && mkdir -p ${gunzip} && cd ${gunzip}
        if [ $$assembler = MEGAHIT ]; then ln -s ${megahit}/*/$$f.gz .; else ln -s ${spades}/*/$$f.gz .; fi
        # Not calling gunzip itself because it creates files
        # with the original group ownership rather than the
        # default one for that user / the work directory
        gzip \
            -cd \
             \
            $$f.gz \
            > $$f
        rm $$f.gz
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: quast
    name: QUAST
    over: {input_id: gunzip, as: item}
    chain: true
    max_concurrency: 16
    inputs: [*a_assemblies, *a_gunzip]
    outputs: [*a_quast]
    resources: *c1m7
    executor: *quast
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        f=$$(basename ${item}/*.fa .fa); ext=$${f##*.}; aid=$${f%.*}; assembler=$${aid%%-*}; id=$${aid#*-}
        rm -rf ${quast} && mkdir -p ${quast} && cd ${quast}
        ln -s ${item}/$$aid.$$ext.fa .
        metaquast.py --threads "${task.resources.cpus}" --rna-finding --max-ref-number 0 -l "$$aid" "$$aid.$$ext.fa" -o "QUAST"
        cp QUAST/report.tsv QUAST/report_rawassemblies.tsv
        rm $$aid.$$ext.fa
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: prodigal
    name: PRODIGAL
    over: {input_id: gunzip, as: item}
    chain: true
    max_concurrency: 16
    inputs: [*a_assemblies, *a_gunzip]
    outputs: [*a_prodigal]
    resources: *c1m4
    executor: *prodigal
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        f=$$(basename ${item}/*.fa .fa); ext=$${f##*.}; aid=$${f%.*}; assembler=$${aid%%-*}; id=$${aid#*-}; p=$${aid}_prodigal
        rm -rf ${prodigal} && mkdir -p ${prodigal} && cd ${prodigal}
        ln -s ${item}/$$aid.$$ext.fa .
        pigz -cdf $$aid.$$ext.fa | prodigal \
            -p meta \
            -f gff \
            -d "$$p.fna" \
            -o "$$p.gff" \
            -a "$$p.faa" \
            -s "$${p}_all.txt"

        pigz -nm $$p.fna
        pigz -nm $$p.gff
        pigz -nm $$p.faa
        pigz -nm $${p}_all.txt
        rm $$aid.$$ext.fa
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # Index files are named bt2_index_base.* for every assembly, so each slot
  # keeps them under <assembly id>/.
  - kind: horus_map
    id: bt2_build
    name: BOWTIE2_ASSEMBLY_BUILD
    over: {input_id: gunzip, as: item}
    chain: true
    max_concurrency: 16
    inputs: [*a_assemblies, *a_gunzip]
    outputs: [*a_bt2_build]
    resources: *c1m7
    executor: *bowtie2
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        f=$$(basename ${item}/*.fa .fa); ext=$${f##*.}; aid=$${f%.*}; assembler=$${aid%%-*}; id=$${aid#*-}
        rm -rf ${bt2_build} && mkdir -p ${bt2_build}/$$aid && cd ${bt2_build}/$$aid
        ln -s ${item}/$$aid.$$ext.fa .
        mkdir bowtie
        bowtie2-build --threads ${task.resources.cpus} $$aid.$$ext.fa "bt2_index_base"
        rm $$aid.$$ext.fa
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: bt2_align
    name: BOWTIE2_ASSEMBLY_ALIGN
    over: {input_id: aligns, as: item}
    max_concurrency: 16
    inputs: [*a_aligns, *a_samples, *a_gunzip, *a_bt2_build, *a_phix, *a_cat_fastq]
    outputs: [*a_bt2_align]
    resources: *c4m12
    executor: *bowtie2_samtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${item}; aid=$$assembler-$$id; p=$$(basename ${item})
        merged=$$(. ${samples}/$$reads_id; echo $$merged); runs=$$(. ${samples}/$$reads_id; echo $$runs)
        rm -rf ${bt2_align} && mkdir -p ${bt2_align} && cd ${bt2_align}
        if [ $$merged = true ]; then set -- ${cat_fastq}/*/$${reads_id}_[12].merged.fastq.gz
        else set -- ${phix}/*/$${runs}_phix_removed.unmapped_[12].fastq.gz; fi
        for f in "$$@" ${gunzip}/*/$$aid.$$ext.fa ${bt2_build}/*/$$aid/bt2_index_base.*; do ln -s $$f $$(basename $$f); done
        INDEX=`find -L ./ -name "*.rev.1.bt2l" -o -name "*.rev.1.bt2" | sed 's/.rev.1.bt2l//' | sed 's/.rev.1.bt2//'`
        bowtie2 \
            -p "${task.resources.cpus}" \
            -x $$INDEX \
             \
            -1 "$$(basename $$1)" -2 "$$(basename $$2)" \
            2> "$$p.bowtie2.log" |         samtools view -@ "${task.resources.cpus}" -bS |         samtools sort -@ "${task.resources.cpus}" -o "$$p.bam"
        samtools index "$$p.bam"

        if [ $$p = "$$aid-$$id" ] ; then
            mv "$$p.bowtie2.log" "$$aid.bowtie2.log"
        fi
        for f in "$$@" $$aid.$$ext.fa bt2_index_base.*; do rm $$(basename $$f); done
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # BAM order: Nextflow passes an assembly's BAMs in mapping finish order; this
  # port uses reverse name order, which is that order for the test data.
  - kind: horus_map
    id: depths
    name: METABAT2_JGISUMMARIZEBAMCONTIGDEPTHS_SHORTREAD
    over: {input_id: assemblies, as: item}
    max_concurrency: 16
    inputs: [*a_assemblies, *a_aligns, *a_bt2_align]
    outputs: [*a_depths]
    resources: *c4m15
    executor: *metabat2_215
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${item}; aid=$$assembler-$$id
        rm -rf ${depths} && mkdir -p ${depths} && cd ${depths}
        bams=$$(for a in $$(ls ${aligns} | sort -r); do (. ${aligns}/$$a; [ "$$assembler-$$id" = "$$aid" ] && echo $$a.bam || true); done)
        for b in $$bams; do ln -s ${bt2_align}/*/$$b ${bt2_align}/*/$$b.bai .; done
        export OMP_NUM_THREADS=${task.resources.cpus}

        jgi_summarize_bam_contig_depths \
            --outputDepth $$aid-depth.txt \
             \
            $$bams

        bgzip --threads ${task.resources.cpus} $$aid-depth.txt
        for b in $$bams; do rm $$b $$b.bai; done
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: convert_depths
    name: CONVERT_DEPTHS
    over: {input_id: depths, as: item}
    chain: true
    zip: [{input_id: gunzip, as: asm}]
    max_concurrency: 16
    inputs: [*a_assemblies, *a_gunzip, *a_depths]
    outputs: [*a_convert_depths]
    resources: *c1m7
    executor: *bioawk
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        f=$$(basename ${asm}/*.fa .fa); ext=$${f##*.}; aid=$${f%.*}; assembler=$${aid%%-*}; id=$${aid#*-}
        rm -rf ${convert_depths} && mkdir -p ${convert_depths} && cd ${convert_depths}
        ln -s ${asm}/$$aid.$$ext.fa ${item}/$$aid-depth.txt.gz .
        # Write one abundance file per read set in a single streaming pass. The depth
        # file is never decompressed to disk: on shared/object-backed work dirs the
        # plaintext copy and one full read per column are prohibitively slow.
        gzip -cd $$aid-depth.txt.gz | bioawk -t '
            NR == 1 {
                n_abund = int((NF - 3) / 2)
                for (i = 1; i <= n_abund; i++) {
                    name = $$(i * 2 + 2)
                    sub(/\.bam$$/, "", name)
                    abund[i] = name ".abund"
                }
                next
            }
            {
                for (i = 1; i <= n_abund; i++) {
                    print $$1, $$(i * 2 + 2) > (abund[i])
                }
            }
        '
        rm $$aid.$$ext.fa $$aid-depth.txt.gz
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: metabat2
    name: METABAT2_METABAT2
    over: {input_id: depths, as: item}
    chain: true
    zip: [{input_id: gunzip, as: asm}]
    max_concurrency: 16
    inputs: [*a_assemblies, *a_gunzip, *a_depths]
    outputs: [*a_metabat2]
    resources: *c4m15
    executor: *metabat2_217
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        f=$$(basename ${asm}/*.fa .fa); ext=$${f##*.}; aid=$${f%.*}; assembler=$${aid%%-*}; id=$${aid#*-}; prefix=$$assembler-MetaBAT2-$$id
        rm -rf ${metabat2} && mkdir -p ${metabat2}/input_bins && cd ${metabat2}
        ln -s ${asm}/$$aid.$$ext.fa input_bins/; ln -s ${item}/$$aid-depth.txt.gz .
        gzip -d -f $$aid-depth.txt.gz

        metabat2 \
            -m 1500 --unbinned --seed 1 \
            -i input_bins/$$aid.$$ext.fa \
            -a $$aid-depth.txt \
            -t ${task.resources.cpus} \
            --saveCls \
            -o $$prefix

        gzip -cn $$prefix > $$prefix.tsv.gz
        find . -maxdepth 1 -name "*.fa" -type f | xargs -t -n 1 bgzip -@ ${task.resources.cpus}
        rm -r input_bins $$aid-depth.txt
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # base.config: MAXBIN2 errorStrategy ignores exit 1 and 255 (no bins).
  - kind: horus_map
    id: maxbin2
    name: MAXBIN2
    over: {input_id: convert_depths, as: item}
    chain: true
    zip: [{input_id: gunzip, as: asm}]
    max_concurrency: 16
    drop_exit_codes: [1, 255]
    inputs: [*a_assemblies, *a_aligns, *a_gunzip, *a_convert_depths]
    outputs: [*a_maxbin2]
    resources: *c4m15
    executor: *maxbin2
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        f=$$(basename ${asm}/*.fa .fa); ext=$${f##*.}; aid=$${f%.*}; assembler=$${aid%%-*}; id=$${aid#*-}; prefix=$$assembler-MaxBin2-$$id; f=$$aid.$$ext.fa
        rm -rf ${maxbin2} && mkdir -p ${maxbin2} && cd ${maxbin2}
        abunds=$$(for a in $$(ls ${aligns} | sort); do (. ${aligns}/$$a; [ "$$assembler-$$id" = "$$aid" ] && echo $$a.abund || true); done)
        n=0; args=""
        for a in $$abunds; do
            ln -s ${item}/$$a .
            n=$$((n + 1)); [ $$n = 1 ] && args="-abund $$a" || args="$$args -abund$$n $$a"
        done
        ln -s ${asm}/$$f .
        mkdir input/ && mv $$f input/
        run_MaxBin.pl \
            -contig input/$$f \
            $$args \
            -thread ${task.resources.cpus} \
             \
            -out $$prefix

        gzip *.fasta *.noclass *.tooshort *log *.marker

        # use the .fa extension for the bins
        for file in *.fasta.gz; do
            mv $${file} $${file%.fasta.gz}.fa.gz
        done
        rm -r input $$abunds
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: semibin
    name: SEMIBIN_SINGLEEASYBIN
    over: {input_id: assemblies, as: item}
    max_concurrency: 16
    inputs: [*a_assemblies, *a_aligns, *a_gunzip, *a_bt2_align]
    outputs: [*a_semibin]
    resources: *c4m15
    executor: *semibin
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${item}; aid=$$assembler-$$id; prefix=$$assembler-SemiBin2-$$id
        rm -rf ${semibin} && mkdir -p ${semibin} && cd ${semibin}
        bams=$$(for a in $$(ls ${aligns} | sort -r); do (. ${aligns}/$$a; [ "$$assembler-$$id" = "$$aid" ] && echo $$a.bam || true); done)
        for b in $$bams; do ln -s ${bt2_align}/*/$$b .; done
        ln -s ${gunzip}/*/$$aid.$$ext.fa .
        SemiBin2 \
             \
            single_easy_bin \
            --input-fasta $$aid.$$ext.fa \
            --input-bam $$bams \
            --tag-output $$prefix \
            --output $$prefix \
            -t ${task.resources.cpus} \
            --random-seed 1 --min-len 1500 --compression gz --engine cpu --sequencing-type short_reads

        # move final bins to "bins" folder
        mv ./$$prefix/output_bins/ bins/
        # rename log with prefix
        mv ./$$prefix/SemiBinRun.log $$prefix.SemiBinRun.log
        rm $$bams $$aid.$$ext.fa
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # ---------------------------------------------------- binning results
  - kind: horus_task
    id: binsets
    name: Collect bins and unbinned contigs
    description: BINNING's bins (per binner and assembly) and unbinned contigs, as item folders.
    inputs: [*a_assemblies, *a_metabat2, *a_maxbin2, *a_semibin]
    outputs: [*a_binsets, *a_unbinsets]
    executor: {kind: shell}
    runtime:
      kind: python_script
      script: scripts/decide.py
      python: python3 # stdlib only
      args: >-
        binsets --assemblies ${assemblies} --metabat2 ${metabat2} --maxbin2 ${maxbin2} --semibin ${semibin}
        --binsets ${binsets} --unbinsets ${unbinsets}
    target: *target

  - kind: horus_map
    id: seqkit
    name: SEQKIT_STATS
    over: {input_id: binsets, as: item}
    max_concurrency: 16
    inputs: [*a_binsets]
    outputs: [*a_seqkit]
    resources: *c1m1
    executor: *seqkit
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        prefix=$$(basename ${item})
        rm -rf ${seqkit} && mkdir -p ${seqkit} && cd ${seqkit}
        bins=$$(cd ${item} && ls *.fa.gz)
        for b in $$bins; do ln -s ${item}/$$b .; done
        seqkit stats \
            --tabular \
            --threads ${task.resources.cpus} \
            --all \
            $$bins > "$$prefix.tsv"
        rm $$bins
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: split_fasta
    name: SPLIT_FASTA
    over: {input_id: unbinsets, as: item}
    max_concurrency: 16
    inputs: [*a_unbinsets, *a_nfcore, *a_min_len_unbinned, *a_max_unbinned]
    outputs: [*a_split_fasta]
    resources: *c2m12
    executor: *pybio
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        export PATH=${nfcore}/bin:$$PATH
        rm -rf ${split_fasta} && mkdir -p ${split_fasta} && cd ${split_fasta}
        f=$$(cd ${item} && ls | grep -v '^meta.env$$')
        ln -s ${item}/$$f .
        # save unbinned contigs above thresholds into individual files, dump others in one file
        split_fasta.py $$f ${min_length_unbinned_contigs} ${max_unbinned_contigs} 1500

        gzip *.fa
        rm $$f
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: postbinning
    name: Post-binning sets
    description: >-
      Bin size filter on the SeqKit stats, then the bins and split unbinned
      contigs that BUSCO, QUAST, CAT, GTDB-Tk, Prokka and the depth tables run on,
      and the contig to bin map.
    inputs: [*a_binsets, *a_unbinsets, *a_seqkit, *a_split_fasta, *a_bin_min, *a_bin_max]
    outputs: [*a_post, *a_post_bins, *a_post_unbins, *a_bins, *a_depthsets, *a_contig_map]
    executor: {kind: shell}
    runtime:
      kind: python_script
      script: scripts/decide.py
      python: python3 # stdlib only
      args: >-
        postbinning --binsets ${binsets} --unbinsets ${unbinsets} --seqkit ${seqkit} --split-fasta ${split_fasta}
        --bin-min-size ${bin_min_size} --bin-max-size ${bin_max_size} --post ${post} --post-bins ${post_bins}
        --post-unbins ${post_unbins} --bins ${bins} --depthsets ${depthsets} --contig-map ${contig_map}
    target: *target

  # ---------------------------------------------------- bin QC
  - kind: horus_map
    id: busco
    name: BUSCO_BUSCO
    over: {input_id: post, as: item}
    max_concurrency: 16
    inputs: [*a_post, *a_busco_db, *a_busco_lineage]
    outputs: [*a_busco]
    resources: *c4m15
    executor: *busco
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${item}/meta.env; p=$$id-${busco_db_lineage}-busco
        rm -rf ${busco} && mkdir -p ${busco}/tmp_input && cd ${busco}
        ln -s ${busco_db}/busco_db busco_db
        for b in $$(cd ${item} && ls *.gz); do ln -s ${item}/$$b tmp_input/; done
        export BUSCO_BBTOOLS_MEMORY=3g

        # Fix Augustus for Apptainer
        ENV_AUGUSTUS=/opt/conda/etc/conda/activate.d/augustus.sh
        set +u
        if [ -z "$${AUGUSTUS_CONFIG_PATH}" ] && [ -f "$${ENV_AUGUSTUS}" ]; then
            source "$${ENV_AUGUSTUS}"
        fi
        set -u

        # If the augustus config directory is not writable, then copy to writeable area
        if [ ! -w "$${AUGUSTUS_CONFIG_PATH}" ]; then
            # Create writable tmp directory for augustus
            AUG_CONF_DIR=$$( mktemp -d -p $$PWD )
            cp -r $$AUGUSTUS_CONFIG_PATH/* $$AUG_CONF_DIR
            export AUGUSTUS_CONFIG_PATH=$$AUG_CONF_DIR
            echo "New AUGUSTUS_CONFIG_PATH=$${AUGUSTUS_CONFIG_PATH}"
        fi

        # Ensure the input is uncompressed
        INPUT_SEQS=input_seqs
        mkdir "$$INPUT_SEQS"
        cd "$$INPUT_SEQS"
        for FASTA in ../tmp_input/*; do
            if [ "$${FASTA##*.}" == 'gz' ]; then
                gzip -cdf "$$FASTA" > $$( basename "$$FASTA" .gz )
            else
                ln -s "$$FASTA" .
            fi
        done
        cd ..

        busco \
            --cpu ${task.resources.cpus} \
            --in "$$INPUT_SEQS" \
            --out $$p \
            --mode genome \
            --lineage_dataset ${busco_db_lineage} \
            --download_path busco_db \
             \
            --offline

        # clean up
        rm -rf "$$INPUT_SEQS"
        rm -fr ./*-busco/*/auto_lineage ./*-busco/*/**/{miniprot,hmmer,.bbtools}_output ./*-busco/*/prodigal_output/predicted_genes/tmp/ ./*-busco/*/tmp/
        # find and remove broken symlinks from the cleanup
        find . -xtype l -delete

        # Move files to avoid staging/publishing issues
        grep -v 'Run failed; check logs' $$p/batch_summary.txt > $$p.batch_summary.txt
        mv $$p/*/short_summary.*.{json,txt} . || echo "Short summaries were not available: No genes were found."
        mv $$p/logs/busco.log $$p.log

        if grep -q 'Run failed; check logs' $$p/batch_summary.txt; then
            grep 'Run failed; check logs' $$p/batch_summary.txt > $$p.batch_summary.failed.txt
        fi
        rm -r busco_db tmp_input
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: quast_bins
    name: QUAST_BINS
    over: {input_id: post, as: item}
    max_concurrency: 16
    inputs: [*a_post]
    outputs: [*a_quast_bins]
    resources: *c1m2
    executor: *quast
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        prefix=$$(basename ${item})
        rm -rf ${quast_bins} && mkdir -p ${quast_bins} && cd ${quast_bins}
        list=$$(cd ${item} && ls *.gz)
        for b in $$list; do ln -s ${item}/$$b .; done
        BINS=$$(echo "$$(echo $$list)" | sed 's/[][]//g')
        IFS=', ' read -r -a bins <<< "$$BINS"
        for bin in "$${bins[@]}"; do
            metaquast.py --threads "${task.resources.cpus}" --max-ref-number 0 --rna-finding --gene-finding -l "$${bin}" "$${bin}" -o "QUAST/$${bin}"
            if ! [ -f "QUAST/$$prefix-quast_summary.tsv" ]; then
                cp "QUAST/$${bin}/transposed_report.tsv" "QUAST/$$prefix-quast_summary.tsv"
            else
                tail -n +2 "QUAST/$${bin}/transposed_report.tsv" >> "QUAST/$$prefix-quast_summary.tsv"
            fi
        done
        rm $$list
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # CONCAT_QUAST_SUMMARY: summaries sorted by file name, as the pipeline does.
  - kind: horus_task
    id: concat_quast
    name: CONCAT_QUAST_SUMMARY
    inputs: [*a_quast_bins]
    outputs: [*a_concat_quast]
    resources: *c1m6
    executor: *qsv
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${concat_quast} && mkdir -p ${concat_quast} && cd ${concat_quast}
        n=0; files=""
        for f in $$(ls ${quast_bins}/*/QUAST/*-quast_summary.tsv | awk -F/ '{print $$NF "\t" $$0}' | sort | cut -f2); do
            n=$$((n + 1)); mkdir -p inputs/in$$n; ln -s $$f inputs/in$$n/; files="$$files inputs/in$$n/$$(basename $$f)"
        done
        export QSV_SKIP_FORMAT_CHECK=1

        qsv \
            cat \
            rowskey \
             \
            -o quast_bin_summary.tsv \
            $$files
        rm -r inputs
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # CONCAT_BUSCO_TSV: Nextflow concatenates in arrival order; this port uses
  # the BUSCO map's slot order.
  - kind: horus_task
    id: concat_busco
    name: CONCAT_BUSCO_TSV
    inputs: [*a_busco]
    outputs: [*a_concat_busco]
    resources: *c1m1
    executor: *qsv
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${concat_busco} && mkdir -p ${concat_busco} && cd ${concat_busco}
        n=0; files=""
        for f in $$(ls -d ${busco}/*/ | sort -V); do
            for s in $$f*-busco.batch_summary.txt; do
                n=$$((n + 1)); mkdir -p inputs/in$$n; ln -s $$s inputs/in$$n/; files="$$files inputs/in$$n/$$(basename $$s)"
            done
        done
        export QSV_SKIP_FORMAT_CHECK=1

        qsv \
            cat \
            rowskey \
            --delimiter $$'\t' \
            -o busco_summary.tsv \
            $$files
        rm -r inputs
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # ---------------------------------------------------- GTDB-Tk
  - kind: horus_task
    id: gtdb_filter
    name: Bins for GTDB-Tk
    description: Keeps the bins whose BUSCO completeness and duplication pass the GTDB-Tk thresholds.
    inputs: [*a_busco, *a_post, *a_gtdb_comp, *a_gtdb_cont]
    outputs: [*a_gtdb_sets, *a_discarded]
    executor: {kind: shell}
    runtime:
      kind: python_script
      script: scripts/decide.py
      python: python3 # stdlib only
      args: >-
        gtdb --busco ${busco} --post ${post} --min-completeness ${gtdbtk_min_completeness}
        --max-contamination ${gtdbtk_max_contamination} --out ${gtdb_sets} --discarded ${discarded}
    target: *target

  - kind: horus_map
    id: gtdbtk
    name: GTDBTK_CLASSIFYWF
    over: {input_id: gtdb_sets, as: item}
    max_concurrency: 16
    inputs: [*a_gtdb_sets, *a_gtdb_db]
    outputs: [*a_gtdbtk]
    resources: *c2m15
    executor: *gtdbtk
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        prefix=$$(basename ${item})
        rm -rf ${gtdbtk} && mkdir -p ${gtdbtk}/bins && cd ${gtdbtk}
        dbs=$$(ls ${gtdb_db}/database)
        for d in $$dbs; do ln -s ${gtdb_db}/database/$$d .; done
        for b in $$(cd ${item} && ls *.gz); do ln -s ${item}/$$b bins/; done
        export GTDBTK_DATA_PATH="$$(find -L markers masks metadata mrca_red msa pplacer radii skani split taxonomy -name 'metadata' -type d -exec dirname {} \;)"

        if [ "--scratch_dir pplacer_tmp" != "" ] ; then
            mkdir pplacer_tmp
        fi

        gtdbtk classify_wf \
            --extension gz --min_perc_aa 10 --min_af 0.65 --pplacer_cpus 1 -f --place_species \
            --genome_dir bins \
            --prefix "$$prefix" \
            --out_dir $$prefix \
            --cpus ${task.resources.cpus} \
            --scratch_dir pplacer_tmp

        mv $$prefix/gtdbtk.log "$$prefix/$$prefix.log"
        mv $$prefix/gtdbtk.warnings.log "$$prefix/$$prefix.warnings.log"
        rm -r bins $$dbs
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: gtdbtk_summary
    name: GTDBTK_SUMMARY
    inputs: [*a_gtdbtk, *a_discarded, *a_nfcore]
    outputs: [*a_gtdbtk_summary]
    resources: *c1m7
    executor: *pandas
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        export PATH=${nfcore}/bin:$$PATH
        rm -rf ${gtdbtk_summary} && mkdir -p ${gtdbtk_summary} && cd ${gtdbtk_summary}
        summaries=""
        for f in ${gtdbtk}/*/*/classify/*.summary.tsv; do [ -e "$$f" ] || continue; ln -s $$f .; summaries="$$summaries $$(basename $$f)"; done
        discarded=$$(cat ${discarded})
        summary_gtdbtk.py --extension gz $${discarded:+--qc_discarded_bins $$discarded} $${summaries:+--summaries $$summaries}   --out gtdbtk_summary.tsv
        [ -z "$$summaries" ] || rm $$summaries
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # ---------------------------------------------------- depths
  - kind: horus_map
    id: mag_depths
    name: MAG_DEPTHS
    over: {input_id: depthsets, as: item}
    max_concurrency: 16
    inputs: [*a_depthsets, *a_depths, *a_nfcore]
    outputs: [*a_mag_depths]
    resources: *c1m15
    executor: *pybio
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        export PATH=${nfcore}/bin:$$PATH
        . ${item}/meta.env
        rm -rf ${mag_depths} && mkdir -p ${mag_depths} && cd ${mag_depths}
        bins=$$(cd ${item} && ls *.gz)
        for b in $$bins; do ln -s ${item}/$$b .; done
        ln -s ${depths}/*/$$assembler-$$id-depth.txt.gz .
        get_mag_depths.py --bins $$bins \
                        --depths $$assembler-$$id-depth.txt.gz \
                        --assembler $$assembler \
                        --id $$id \
                        --binner $$binner
        rm $$bins $$assembler-$$id-depth.txt.gz
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # DEPTHS collectFile: the bin depth tables of each sample's assemblies in
  # one file per sample id, keeping one header.
  - kind: horus_task
    id: mag_depths_summary
    name: MAG_DEPTHS_SUMMARY
    inputs: [*a_depthsets, *a_mag_depths, *a_nfcore]
    outputs: [*a_mag_depths_summary]
    resources: *c1m7
    executor: *pandas
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        export PATH=${nfcore}/bin:$$PATH
        rm -rf ${mag_depths_summary} && mkdir -p ${mag_depths_summary}/collect && cd ${mag_depths_summary}/collect
        for s in $$(ls ${depthsets}); do
            (. ${depthsets}/$$s/meta.env
             f=$$(ls ${mag_depths}/*/$$assembler-$$binner-$$id-binDepths.tsv)
             if [ -e $$id ]; then tail -n +2 $$f >> $$id; else cat $$f > $$id; fi)
        done
        ids=$$(ls)
        cd ..
        for i in $$ids; do ln -s collect/$$i $$i; done
        get_mag_depths_summary.py --depths $$ids                             --out "bin_depths_summary.tsv"
        rm -r collect $$ids
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # ---------------------------------------------------- CAT
  - kind: horus_map
    id: catpack_bins
    name: CATPACK_BINS
    over: {input_id: post_bins, as: item}
    max_concurrency: 16
    inputs: [*a_post_bins, *a_cat_db]
    outputs: [*a_catpack_bins]
    resources: *c4m15
    executor: *catpack
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${item}/meta.env; prefix=$$assembler-$$binner-$$id
        rm -rf ${catpack_bins} && mkdir -p ${catpack_bins}/bins && cd ${catpack_bins}
        ln -s ${cat_db}/cat_db/db db; ln -s ${cat_db}/cat_db/tax tax
        for b in $$(cd ${item} && ls *.gz); do ln -s ${item}/$$b bins/; done
        if true; then
            mkdir input_bins
            for f in bins/*.fa.gz; do
                gunzip -c "$$f" > "input_bins/$$(basename "$$f" .gz)"
            done
        fi

        CAT_pack bins \
            -n ${task.resources.cpus} \
            -b input_bins/ \
            -d db \
            -t tax \
            -s .fa \
             \
             \
            -o $$prefix-bins \
            --no_stars
        rm -r bins input_bins db tax
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: catpack_names_bins
    name: CATPACK_ADDNAMES_BINS
    over: {input_id: catpack_bins, as: item}
    chain: true
    max_concurrency: 16
    inputs: [*a_post_bins, *a_catpack_bins, *a_cat_db]
    outputs: [*a_catpack_names_bins]
    resources: *c1m6
    executor: *cat
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        prefix=$$(basename ${item}/*-bins.bin2classification.txt -bins.bin2classification.txt)
        rm -rf ${catpack_names_bins} && mkdir -p ${catpack_names_bins} && cd ${catpack_names_bins}
        ln -s ${cat_db}/cat_db/tax tax; ln -s ${item}/$$prefix-bins.bin2classification.txt .
        CAT_pack add_names \
            --only_official \
            -i $$prefix-bins.bin2classification.txt \
            -t tax \
            -o $$prefix-bins_bin2classification.names.txt
        rm tax $$prefix-bins.bin2classification.txt
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: catpack_summary_bins
    name: CATPACK_SUMMARISE_BINS
    over: {input_id: catpack_names_bins, as: item}
    chain: true
    max_concurrency: 16
    inputs: [*a_post_bins, *a_catpack_names_bins]
    outputs: [*a_catpack_summary_bins]
    resources: *c1m6
    executor: *catpack
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        prefix=$$(basename ${item}/*-bins_bin2classification.names.txt -bins_bin2classification.names.txt)
        rm -rf ${catpack_summary_bins} && mkdir -p ${catpack_summary_bins} && cd ${catpack_summary_bins}
        ln -s ${item}/$$prefix-bins_bin2classification.names.txt .
        CAT_pack summarise \
             \
            -i $$prefix-bins_bin2classification.names.txt \
             \
            -o $$prefix-bins_summary.txt
        rm $$prefix-bins_bin2classification.names.txt
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: concat_unbins
    name: CONCAT_UNBINS
    over: {input_id: post_unbins, as: item}
    max_concurrency: 16
    inputs: [*a_post_unbins]
    outputs: [*a_concat_unbins]
    resources: *c2m12
    executor: *pigz
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${item}/meta.env; prefix=$$assembler-$$binner-$$id
        rm -rf ${concat_unbins} && mkdir -p ${concat_unbins}/to_concatenate && cd ${concat_unbins}
        for b in $$(cd ${item} && ls *.gz); do ln -s ${item}/$$b to_concatenate/; done
        while IFS= read -r -d $$'\0' file; do
                pigz -cd -p ${task.resources.cpus} $$file \
                    >> $$prefix-unbins.fasta
            done < <( find to_concatenate/ -mindepth 1 -print0 | sort -z )
        rm -r to_concatenate
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: catpack_unbins
    name: CATPACK_UNBINS
    over: {input_id: concat_unbins, as: item}
    chain: true
    max_concurrency: 16
    inputs: [*a_post_unbins, *a_concat_unbins, *a_cat_db]
    outputs: [*a_catpack_unbins]
    resources: *c4m15
    executor: *catpack
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        prefix=$$(basename ${item}/*-unbins.fasta -unbins.fasta)
        rm -rf ${catpack_unbins} && mkdir -p ${catpack_unbins} && cd ${catpack_unbins}
        ln -s ${cat_db}/cat_db/db db; ln -s ${cat_db}/cat_db/tax tax; ln -s ${item}/$$prefix-unbins.fasta .
        # CAT_pack does not support gzipped input, so decompress any gzipped contigs.
        contigs_fastas=""
        for f in $$prefix-unbins.fasta; do
            if [[ "$$f" == *.gz ]]; then
                gunzip -c "$$f" > "$$(basename "$$f" .gz)"
                contigs_fastas="$${contigs_fastas} $$(basename "$$f" .gz)"
            else
                contigs_fastas="$${contigs_fastas} $$f"
            fi
        done

        CAT_pack contigs \
            --nproc ${task.resources.cpus} \
            --contigs_fasta $${contigs_fastas## } \
            --database_folder db \
            --taxonomy_folder tax \
            --out_prefix $$prefix-unbins \
             \
             \
            --no_stars
        rm db tax $$prefix-unbins.fasta
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: catpack_names_unbins
    name: CATPACK_ADDNAMES_UNBINS
    over: {input_id: catpack_unbins, as: item}
    chain: true
    max_concurrency: 16
    inputs: [*a_post_unbins, *a_catpack_unbins, *a_cat_db]
    outputs: [*a_catpack_names_unbins]
    resources: *c1m6
    executor: *cat
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        prefix=$$(basename ${item}/*-unbins.contig2classification.txt -unbins.contig2classification.txt)
        rm -rf ${catpack_names_unbins} && mkdir -p ${catpack_names_unbins} && cd ${catpack_names_unbins}
        ln -s ${cat_db}/cat_db/tax tax; ln -s ${item}/$$prefix-unbins.contig2classification.txt .
        CAT_pack add_names \
            --only_official \
            -i $$prefix-unbins.contig2classification.txt \
            -t tax \
            -o $$prefix-unbins_contig2classification.names.txt
        rm tax $$prefix-unbins.contig2classification.txt
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: catpack_summary_unbins
    name: CATPACK_SUMMARISE_UNBINS
    over: {input_id: catpack_names_unbins, as: item}
    chain: true
    zip: [{input_id: concat_unbins, as: cu}]
    max_concurrency: 16
    inputs: [*a_post_unbins, *a_catpack_names_unbins, *a_concat_unbins]
    outputs: [*a_catpack_summary_unbins]
    resources: *c1m6
    executor: *catpack
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        prefix=$$(basename ${item}/*-unbins_contig2classification.names.txt -unbins_contig2classification.names.txt)
        rm -rf ${catpack_summary_unbins} && mkdir -p ${catpack_summary_unbins} && cd ${catpack_summary_unbins}
        ln -s ${item}/$$prefix-unbins_contig2classification.names.txt ${cu}/$$prefix-unbins.fasta .
        CAT_pack summarise \
             \
            -i $$prefix-unbins_contig2classification.names.txt \
            -c $$prefix-unbins.fasta \
            -o $$prefix-unbins_summary.txt
        rm $$prefix-unbins_contig2classification.names.txt $$prefix-unbins.fasta
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # ---------------------------------------------------- annotation
  - kind: horus_map
    id: prokka
    name: PROKKA
    over: {input_id: bins, as: item}
    max_concurrency: 16
    inputs: [*a_bins]
    outputs: [*a_prokka]
    resources: *c2m4
    executor: *prokka
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${item}/meta.env
        rm -rf ${prokka} && mkdir -p ${prokka} && cd ${prokka}
        ln -s ${item}/$$bin_id.fa.gz .
        gunzip -c $$bin_id.fa.gz > $$bin_id.fa

        prokka \
            --metagenome --fast \
            --cpus ${task.resources.cpus} \
            --prefix $$bin_id \
             \
             \
            $$bin_id.fa

        rm $$bin_id.fa
        rm $$bin_id.fa.gz
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # ---------------------------------------------------- summaries
  # bat_summary.tsv is CATPACK's collectFile (keepHeader, sort: 'deep').
  - kind: horus_task
    id: bin_summary
    name: BIN_SUMMARY
    inputs: [*a_mag_depths_summary, *a_concat_quast, *a_gtdbtk_summary, *a_catpack_names_bins, *a_concat_busco, *a_nfcore]
    outputs: [*a_bin_summary]
    resources: *c1m7
    executor: *pandas
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        export PATH=${nfcore}/bin:$$PATH
        rm -rf ${bin_summary} && mkdir -p ${bin_summary} && cd ${bin_summary}
        first=1
        for f in $$(for n in ${catpack_names_bins}/*/*-bins_bin2classification.names.txt; do printf '%s\t%s\n' "$$(cat $$n | tr '\n\t' '\1\2')" "$$n"; done | LC_ALL=C sort | cut -f2); do
            if [ $$first = 1 ]; then cat $$f; first=0; else tail -n +2 $$f; fi
        done > bat_summary.tsv
        ln -s ${mag_depths_summary}/bin_depths_summary.tsv ${concat_quast}/quast_bin_summary.tsv ${gtdbtk_summary}/gtdbtk_summary.tsv ${concat_busco}/busco_summary.tsv .
        combine_tables.py         --depths_summary bin_depths_summary.tsv         --quast_summary quast_bin_summary.tsv         --gtdbtk_summary gtdbtk_summary.tsv         --cat_summary bat_summary.tsv         --busco_summary busco_summary.tsv                                    --out bin_summary.tsv
        rm bin_depths_summary.tsv quast_bin_summary.tsv gtdbtk_summary.tsv busco_summary.tsv
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # MULTIQC: the pipeline's MultiQC inputs, each in its own numbered folder as
  # Nextflow stages them. The software versions, workflow summary and methods
  # files come from Nextflow run metadata and are not part of the port.
  - kind: horus_task
    id: multiqc
    name: MULTIQC
    inputs: [*a_nfcore, *a_fastqc_raw, *a_fastp, *a_phix, *a_fastqc_trimmed, *a_quast, *a_bt2_align, *a_quast_bins, *a_prokka, *a_busco, *a_gtdbtk_summary]
    outputs: [*a_multiqc]
    resources: *c1m15
    executor: *multiqc
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${multiqc} && mkdir -p ${multiqc}/1 && cd ${multiqc}
        ln -s ${nfcore}/assets/multiqc_config.yml 1/
        n=1
        for f in ${fastqc_raw}/*/*_fastqc.zip ${fastp}/*/*.fastp.json ${phix}/*/*_phix_removed.bowtie2.log \
                 ${fastqc_trimmed}/*/*_fastqc.zip ${quast}/*/QUAST/report_rawassemblies.tsv ${bt2_align}/*/*.bowtie2.log \
                 ${quast_bins}/*/QUAST/*.gz ${prokka}/*/*/*.txt ${busco}/*/short_summary.*.txt ${gtdbtk_summary}/gtdbtk_summary.tsv; do
            [ -e "$$f" ] || continue
            n=$$((n + 1)); mkdir $$n; ln -s $$f $$n/
        done
        multiqc \
            --force \
             \
            --config 1/multiqc_config.yml \
             \
             \
             \
             \
            .
        rm -r [0-9]*
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

