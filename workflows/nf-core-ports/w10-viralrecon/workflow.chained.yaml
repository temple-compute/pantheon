  - kind: horus_map
    id: mosdepth_amplicon
    name: MOSDEPTH_AMPLICON
    over: {input_id: filter_mapped, as: sample}
    chain: true
    zip: [{input_id: trim_sort, as: trim_sort_item}, {input_id: trim_index, as: trim_index_item}]
    max_concurrency: 16
    inputs: [*a_filter_mapped, *a_trim_sort, *a_trim_index, *a_collapsed]
    outputs: [*a_mosdepth_amplicon]
    resources: *high
    executor: *mosdepth
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${sample}/meta.env; bed=$$(ls ${primer_collapsed})
        rm -rf ${mosdepth_amplicon} && mkdir -p ${mosdepth_amplicon} && cd ${mosdepth_amplicon}
        ln -s ${trim_sort_item}/$${id}.ivar_trim.sorted.bam ${trim_index_item}/$${id}.ivar_trim.sorted.bam.bai ${primer_collapsed}/$$bed .
        mosdepth \
            --threads ${task.resources.cpus} \
            --by $$bed \
            --fast-mode --use-median --thresholds 0,1,10,50,100,500 \
            $${id} \
            $${id}.ivar_trim.sorted.bam
        rm $${id}.ivar_trim.sorted.bam $${id}.ivar_trim.sorted.bam.bai $$bed
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
