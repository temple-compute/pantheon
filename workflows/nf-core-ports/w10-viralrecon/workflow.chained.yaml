kind: horus_workflow
name: nf-core viralrecon chained

# Native port of nf-core/viralrecon 3.0.0, the route `-profile test,docker`
# runs: Illumina amplicon (ARTIC V1) SARS-CoV-2 reads through fastp, Kraken2,
# Bowtie2, iVar primer trimming and variant calling, SnpEff/SnpSift, Freyja,
# a BCFtools consensus with Nextclade, Pangolin and QUAST, and SPAdes plus
# Unicycler assemblies with Bandage, ABACAS, BLAST and QUAST, then MultiQC.
# Images, rendered command lines (ext.args from conf/modules_illumina.config)
# and per-process cpus/memory are the executed ones; the test profile caps
# every process at 4 cpus / 15 GB.
#
# Every command runs under `bash -C -e -u -o pipefail`, the shell of every
# rendered .command.sh: wave images link /bin/sh to dash, so each command
# writes its script to /tmp/.command.sh and runs that with bash.
#
# Chained variant of workflow.yaml: same commands and outputs, one item
# space. cat_fastq maps over the sample meta files and writes each slot's
# meta.env (id, single_end); every other per-sample map sets `chain: true`
# and iterates cat_fastq or a filter map, so a sample moves to its next
# process as soon as its own upstream slots are done, not when the whole
# map is. A body sources ${sample}/meta.env and reads the slot of each
# upstream map paired through `zip` (${<map>_item}/). The pipeline's Groovy
# filters (reads left after fastp, min mapped reads, non-empty iVar tables)
# are the filter_* maps, which drop a sample with exit 10
# (drop_exit_codes); decide_fastp and decide_mapped still write the fail
# tables for MultiQC. Inputs are linked into the task folder under the
# names Nextflow stages, the verbatim command runs, and the links are
# removed. Every map keeps max_concurrency 16, above the item count (3
# samples in the test profile), so no clone waits for a map slot. Needs
# horus-runtime 0.9.0 or later (horus_map chain, zip, drop_exit_codes).
#
# capacity: memory-based admission like Nextflow's local executor. The key
# is the target's location_id (local://<hostname>); set it to the host that
# runs the tasks, or the gate does not apply.

capacity:
  local://ubuntu-awow:
    cpus: 16
    memory_gb: 31
max_concurrency: 16

_target: &target
  kind: local

# Run on a remote node instead: point every task at this anchor.
# _target: &target
#   kind: ssh
#   host: bench-node.example.org
#   username: ubuntu
#   working_directory: /home/ubuntu/horus

