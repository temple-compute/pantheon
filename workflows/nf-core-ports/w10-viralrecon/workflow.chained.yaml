  # ---------------------------------------------------------------- iVar variants
  - kind: horus_map
    id: ivar_variants
    name: IVAR_VARIANTS
    over: {input_id: filter_mapped, as: sample}
    chain: true
    zip: [{input_id: trim_sort, as: trim_sort_item}]
    max_concurrency: 16
    inputs: [*a_filter_mapped, *a_trim_sort, *a_fasta, *a_gff, *a_chromsizes]
    outputs: [*a_ivar_variants]
    resources: *high
    executor: *ivar
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${sample}/meta.env; fa=$$(ls ${fasta}); gff_file=$$(ls ${gff})
        rm -rf ${ivar_variants} && mkdir -p ${ivar_variants} && cd ${ivar_variants}
        ln -s ${trim_sort_item}/$${id}.ivar_trim.sorted.bam ${fasta}/$$fa ${chromsizes}/$$fa.fai ${gff}/$$gff_file .
        samtools \
            mpileup \
            --ignore-overlaps --count-orphans --no-BAQ --max-depth 0 --min-BQ 0 \
            --reference $$fa \
            $${id}.ivar_trim.sorted.bam \
            | ivar \
                variants \
                -t 0.25 -q 20 -m 10 \
                -g $$gff_file \
                -r $$fa \
                -p $${id}
        rm $${id}.ivar_trim.sorted.bam $$fa $$fa.fai $$gff_file
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: filter_ivar
    name: Filter samples with variants
    description: Drops a sample whose iVar variants table has no rows (exit 10).
    over: {input_id: filter_mapped, as: sample}
    chain: true
    zip: [{input_id: ivar_variants, as: ivar_variants_item}]
    drop_exit_codes: [10]
    max_concurrency: 16
    inputs: [*a_filter_mapped, *a_ivar_variants]
    outputs: [*a_filter_ivar]
    executor: {kind: shell}
    runtime:
      kind: python_script
      script: scripts/decide.py
      python: python3 # stdlib only
      args: item --check ivar --meta ${sample}/meta.env --data ${ivar_variants_item} --out ${filter_ivar}
    target: *target

  - kind: horus_map
    id: ivar_vcf
    name: IVAR_VARIANTS_TO_VCF
    over: {input_id: filter_ivar, as: sample}
    chain: true
    zip: [{input_id: ivar_variants, as: ivar_variants_item}]
    max_concurrency: 16
    inputs: [*a_filter_ivar, *a_ivar_variants, *a_fasta, *a_nfcore]
    outputs: [*a_ivar_vcf]
    resources: *single
    executor: *ivar2vcf
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${sample}/meta.env; fa=$$(ls ${fasta}); export PATH=${nfcore}/bin:$$PATH
        rm -rf ${ivar_vcf} && mkdir -p ${ivar_vcf} && cd ${ivar_vcf}
        ln -s ${ivar_variants_item}/$${id}.tsv ${fasta}/$$fa ${nfcore}/assets/headers/ivar_variants_header_mqc.txt .
        ivar_variants_to_vcf.py \
            $${id}.tsv \
            $${id}.vcf \
            --fasta $$fa \
            --ignore_strand_bias \
            > $${id}.variant_counts.log

        cat ivar_variants_header_mqc.txt $${id}.variant_counts.log > $${id}.variant_counts_mqc.tsv
        rm $${id}.tsv $$fa ivar_variants_header_mqc.txt
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: vcf_sort
    name: BCFTOOLS_SORT
    over: {input_id: filter_ivar, as: sample}
    chain: true
    zip: [{input_id: ivar_vcf, as: ivar_vcf_item}]
    max_concurrency: 16
    inputs: [*a_filter_ivar, *a_ivar_vcf]
    outputs: [*a_vcf_sort]
    resources: *high
    executor: *bcftools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${sample}/meta.env
        rm -rf ${vcf_sort} && mkdir -p ${vcf_sort} && cd ${vcf_sort}
        ln -s ${ivar_vcf_item}/$${id}.vcf ${ivar_vcf_item}/$${id}_all_hap.vcf .
        bcftools \
            sort \
            --output $${id}.vcf.gz \
            --temp-dir . \
            --output-type z \
            $${id}.vcf $${id}_all_hap.vcf
        rm $${id}.vcf $${id}_all_hap.vcf
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: vcf_tbi
    name: TABIX_TABIX
    over: {input_id: filter_ivar, as: sample}
    chain: true
    zip: [{input_id: vcf_sort, as: vcf_sort_item}]
    max_concurrency: 16
    inputs: [*a_filter_ivar, *a_vcf_sort]
    outputs: [*a_vcf_tbi]
    resources: *single
    executor: *htslib
    runtime:
      kind: command
      command: |
