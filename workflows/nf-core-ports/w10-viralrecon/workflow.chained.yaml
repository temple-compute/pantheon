        . ${sample}/meta.env
        rm -rf ${uni_blastn} && mkdir -p ${uni_blastn} && cd ${uni_blastn}
        ln -s ${uni_scaffolds_item}/$${id}.scaffolds.fa ${blast_db}/null .
        DB=`find -L ./ -name "*.nal" | sed 's/\.nal$$//'`
        if [ -z "$$DB" ]; then
            DB=`find -L ./ -name "*.nin" | sed 's/\.nin$$//'`
        fi
        echo Using $$DB

        blastn \
            -num_threads ${task.resources.cpus} \
            -db $$DB \
            -query $${id}.scaffolds.fa \
            -outfmt '6 stitle staxids std slen qlen qcovs' \
            -out $${id}.txt
        rm $${id}.scaffolds.fa null
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: uni_filter
    name: FILTER_BLASTN (Unicycler)
    over: {input_id: filter_fastp, as: sample}
    chain: true
    zip: [{input_id: uni_blastn, as: uni_blastn_item}]
    max_concurrency: 16
    inputs: [*a_filter_fastp, *a_uni_blastn, *a_nfcore]
    outputs: [*a_uni_filter]
    resources: *low
    executor: *ubuntu
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${sample}/meta.env
        rm -rf ${uni_filter} && mkdir -p ${uni_filter} && cd ${uni_filter}
        ln -s ${uni_blastn_item}/$${id}.txt ${nfcore}/assets/headers/blast_outfmt6_header.txt ${nfcore}/assets/headers/blast_filtered_outfmt6_header.txt .
        cat blast_outfmt6_header.txt $${id}.txt > $${id}.results.blastn.txt
        awk 'BEGIN{OFS="\t";FS="\t"}{print $$0,$$6/$$16,$$6/$$15}' $${id}.txt | awk 'BEGIN{OFS="\t";FS="\t"} $$16 > 200 && $$18 > 0.7 && $$1 !~ /phage/ {print $$0}' > tmp.out
        cat blast_filtered_outfmt6_header.txt tmp.out > $${id}.filter.blastn.txt
        rm $${id}.txt blast_outfmt6_header.txt blast_filtered_outfmt6_header.txt tmp.out
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: uni_quast
    name: QUAST (Unicycler)
    inputs: [*a_uni_scaffolds, *a_fasta, *a_gff]
    outputs: [*a_uni_quast]
    resources: *high
    executor: *quast
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        fa=$$(ls ${fasta}); gff_file=$$(ls ${gff})
        rm -rf ${uni_quast} && mkdir -p ${uni_quast} && cd ${uni_quast}
        ln -s ${uni_scaffolds}/*/*.scaffolds.fa ${fasta}/$$fa ${gff}/$$gff_file .
        quast.py \
            --output-dir quast.unicycler \
            -r $$fa \
            --features $$gff_file \
            --threads ${task.resources.cpus} \
            $$(ls *.scaffolds.fa)

        ln -s quast.unicycler/report.tsv quast.unicycler.tsv
        [ -f  quast.unicycler/contigs_reports/all_alignments_transcriptome.tsv ] && ln -s quast.unicycler/contigs_reports/all_alignments_transcriptome.tsv quast.unicycler_transcriptome.tsv
        [ -f  quast.unicycler/contigs_reports/misassemblies_report.tsv         ] && ln -s quast.unicycler/contigs_reports/misassemblies_report.tsv quast.unicycler_misassemblies.tsv
        [ -f  quast.unicycler/contigs_reports/unaligned_report.tsv             ] && ln -s quast.unicycler/contigs_reports/unaligned_report.tsv quast.unicycler_unaligned.tsv
        rm *.scaffolds.fa $$fa $$gff_file
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # ---------------------------------------------------------------- MultiQC
  # Links exactly the files the pipeline sends to MULTIQC into numbered
  # folders. The software versions, workflow summary and methods sections
  # come from Nextflow run metadata and are not produced here. The unused
  # inputs mirror Nextflow, where MULTIQC waits on every process through the
  # versions channel.
  - kind: horus_task
    id: multiqc
    name: MULTIQC
    inputs:
      - *a_nfcore
      - *a_fastqc_raw
      - *a_fastp
      - *a_mqc_fastp
      - *a_kraken2
      - *a_cutadapt
      - *a_bowtie2
      - *a_sort_flagstat
      - *a_mqc_mapped
      - *a_trim_flagstat
      - *a_ivar_vcf
      - *a_freyja_demix
      - *a_mosdepth_genome
      - *a_plot_amplicon
      - *a_snpeff_ann
      - *a_vcf_stats
      - *a_mqc_clade
      - *a_quast_consensus
      - *a_pangolin
      - *a_spades_quast
      - *a_uni_quast
      - *a_fastqc_trim
      - *a_fastqc_cutadapt
      - *a_picard
      - *a_plot_genome
      - *a_freyja_boot
      - *a_snpeff_stats
      - *a_snpsift
      - *a_long_table
      - *a_base_density
      - *a_spades_bandage
      - *a_spades_abacas
      - *a_spades_filter
      - *a_uni_bandage
      - *a_uni_abacas
      - *a_uni_filter
      - *a_sort_stats
      - *a_sort_idxstats
      - *a_trim_stats
      - *a_trim_idxstats
    outputs: [*a_multiqc]
    resources: *single
    executor: *multiqc
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        export PATH=${nfcore}/bin:$$PATH
        rm -rf ${multiqc_out} && mkdir -p ${multiqc_out} && cd ${multiqc_out}
        n=0
        stage() { for f in "$$@"; do [ -e "$$f" ] || continue; n=$$((n + 1)); mkdir $$n; ln -s "$$f" $$n/; done; }
        stage ${fastqc_raw}/*/*_fastqc.zip
        stage ${fastp}/*/*.fastp.json
        stage ${mqc_fastp}/fail_mapped_reads_mqc.tsv
        stage ${kraken2}/*/*.kraken2.report.txt
        stage ${cutadapt}/*/*.cutadapt.log
        stage ${bowtie2}/*/*.bowtie2.log
        stage ${sort_flagstat}/*/*.sorted.bam.flagstat
        stage ${mqc_mapped}/fail_mapped_samples_mqc.tsv
        stage ${trim_flagstat}/*/*.flagstat
        stage ${ivar_vcf}/*/*.variant_counts_mqc.tsv
        stage ${freyja_demix}/*/*.tsv
        stage ${mosdepth_genome}/*/*.mosdepth.global.dist.txt
        stage ${plot_amplicon}/all_samples.mosdepth.heatmap.tsv
        stage ${snpeff_ann}/*/*.snpeff.csv
        stage ${vcf_stats}/*/*.bcftools_stats.txt
        stage ${mqc_clade}/nextclade_clade_mqc.tsv
        stage ${quast_consensus}/quast.consensus
        stage ${pangolin}/*/*.pangolin.csv
        stage ${spades_quast}/quast.spades
        stage ${uni_quast}/quast.unicycler
        find . -mindepth 2 -maxdepth 2 | sort -V > /tmp/multiqc_inputs.txt
        ln -s ${nfcore}/assets/multiqc_config_illumina.yml .

        ## Run MultiQC once to parse tool logs
        multiqc \
            --force \
            -k yaml \
            --config multiqc_config_illumina.yml \
            .

        ## Parse YAML files dumped by MultiQC to obtain metrics
        multiqc_to_custom_csv.py --platform illumina

        ## Manually remove files that we don't want in the report
        if grep -q ">skip_assembly<" multiqc_report.html; then
            rm -f *assembly_metrics_mqc.csv
        fi

        if grep -q ">skip_variants<" multiqc_report.html; then
            rm -f *variants_metrics_mqc.csv
        fi

        rm -f variants/report.tsv

        ## Run MultiQC a second time
            multiqc \
            --force \
            -e general_stats --ignore *nextclade_clade_mqc.tsv \
            --config multiqc_config_illumina.yml \
            .
        rm -r $$(seq 1 $$n) multiqc_config_illumina.yml
        mv /tmp/multiqc_inputs.txt .
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

