        rm -rf ${picard} && mkdir -p ${picard} && cd ${picard}
        ln -s ${trim_sort_item}/$${id}.ivar_trim.sorted.bam ${trim_index_item}/$${id}.ivar_trim.sorted.bam.bai ${fasta}/$$fa .
        picard \
            -Xmx$$(( ${task.resources.memory_gb} * 1024 * 8 / 10 ))M \
            CollectMultipleMetrics \
            --VALIDATION_STRINGENCY LENIENT --TMP_DIR tmp \
            --INPUT $${id}.ivar_trim.sorted.bam \
            --OUTPUT $${id}.CollectMultipleMetrics \
            --REFERENCE_SEQUENCE $$fa
        rm -rf tmp $${id}.ivar_trim.sorted.bam $${id}.ivar_trim.sorted.bam.bai $$fa
        NF
