  - kind: horus_map
    id: bed_mask
    name: MAKE_BED_MASK
    over: {input_id: filter_ivar, as: sample}
    chain: true
    zip: [{input_id: vcf_filter, as: vcf_filter_item}, {input_id: trim_sort, as: trim_sort_item}]
    max_concurrency: 16
    inputs: [*a_filter_ivar, *a_vcf_filter, *a_trim_sort, *a_fasta, *a_nfcore]
    outputs: [*a_bed_mask]
    resources: *single
    executor: *bedmask
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${sample}/meta.env; fa=$$(ls ${fasta}); export PATH=${nfcore}/bin:$$PATH
        rm -rf ${bed_mask} && mkdir -p ${bed_mask} && cd ${bed_mask}
        ln -s ${vcf_filter_item}/$${id}.filtered.vcf.gz ${trim_sort_item}/$${id}.ivar_trim.sorted.bam ${fasta}/$$fa .
        samtools \
            mpileup \
            -a --ignore-overlaps --count-orphans --no-BAQ --max-depth 0 --min-BQ 0 \
            --reference $$fa \
            $${id}.ivar_trim.sorted.bam \
            | awk -v OFS='\t' '{print $$1, $$2-1, $$2, $$4}' | awk '$$4 < 10' > lowcov_positions.txt

        make_bed_mask.py \
            $${id}.filtered.vcf.gz \
            lowcov_positions.txt \
            $${id}.coverage.masked.bed
        rm -f $${id}.filtered.vcf.gz $${id}.ivar_trim.sorted.bam $$fa $$fa.fai lowcov_positions.txt
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

