        [ -f  quast.consensus/contigs_reports/misassemblies_report.tsv         ] && ln -s quast.consensus/contigs_reports/misassemblies_report.tsv quast.consensus_misassemblies.tsv
        [ -f  quast.consensus/contigs_reports/unaligned_report.tsv             ] && ln -s quast.consensus/contigs_reports/unaligned_report.tsv quast.consensus_unaligned.tsv
