        rm -rf ${trim_sort} && mkdir -p ${trim_sort} && cd ${trim_sort}
        ln -s ${ivar_trim_item}/$${id}.ivar_trim.bam ${fasta}/$$fa .
        samtools cat \
            $${id}.ivar_trim.bam \
        | \
        samtools sort \
            -T $${id}.ivar_trim.sorted \
            --threads ${task.resources.cpus} \
            --reference $$fa \
            -o $${id}.ivar_trim.sorted.bam \
            -
        rm $${id}.ivar_trim.bam $$fa
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

