    resources: *high
    executor: *rplots
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        export PATH=${nfcore}/bin:$$PATH
        rm -rf ${plot_genome} && mkdir -p ${plot_genome} && cd ${plot_genome}
        ln -s ${mosdepth_genome}/*/*.regions.bed.gz .
        plot_mosdepth_regions.r \
            --input_files $$(ls *.regions.bed.gz | paste -sd,) \
            --output_dir ./ \
            --output_suffix mosdepth \
            --input_suffix .regions.bed.gz
        rm *.regions.bed.gz
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

