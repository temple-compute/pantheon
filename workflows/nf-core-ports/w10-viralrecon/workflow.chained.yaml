artifacts:
  - *a_samplesheet
  - *a_nfcore
  - {id: input_mirror, name: Local input mirror, description: "Folder searched by file name before downloading a reference file or read; empty downloads everything.", kind: string, path: params/input_mirror.txt, value: ""}
  - {id: min_mapped_reads, name: Min mapped reads, description: "Samples with this many mapped reads or fewer stop after alignment (--min_mapped_reads).", kind: number, path: params/min_mapped_reads.json, value: 1000}
