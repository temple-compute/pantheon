    over: {input_id: filter_ivar, as: sample}
    chain: true
    zip: [{input_id: snpeff_bgzip, as: snpeff_bgzip_item}]
    max_concurrency: 16
    inputs: [*a_filter_ivar, *a_snpeff_bgzip]
    outputs: [*a_snpsift]
    resources: *high
    executor: *snpsift
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${sample}/meta.env
        rm -rf ${snpsift} && mkdir -p ${snpsift} && cd ${snpsift}
        ln -s ${snpeff_bgzip_item}/$${id}.snpeff.vcf.gz .
        SnpSift \
            -Xmx${task.resources.memory_gb}g \
            extractFields \
            -s "," \
            -e "." \
            $${id}.snpeff.vcf.gz \
            CHROM POS REF ALT \
            "ANN[*].GENE" "ANN[*].GENEID" \
            "ANN[*].IMPACT" "ANN[*].EFFECT" \
            "ANN[*].FEATURE" "ANN[*].FEATUREID" \
            "ANN[*].BIOTYPE" "ANN[*].RANK" "ANN[*].HGVS_C" \
            "ANN[*].HGVS_P" "ANN[*].CDNA_POS" "ANN[*].CDNA_LEN" \
            "ANN[*].CDS_POS" "ANN[*].CDS_LEN" "ANN[*].AA_POS" \
            "ANN[*].AA_LEN" "ANN[*].DISTANCE" "EFF[*].EFFECT" \
            "EFF[*].FUNCLASS" "EFF[*].CODON" "EFF[*].AA" "EFF[*].AA_LEN" \
            > $${id}.snpsift.txt
        rm $${id}.snpeff.vcf.gz
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

