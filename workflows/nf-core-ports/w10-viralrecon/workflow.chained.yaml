  - {id: fasta_url, name: Genome fasta, kind: string, path: params/fasta_url.txt, value: "https://github.com/nf-core/test-datasets/raw/viralrecon/genome/MN908947.3/GCA_009858895.3_ASM985889v3_genomic.200409.fna.gz"}
  - {id: gff_url, name: Genome GFF, kind: string, path: params/gff_url.txt, value: "https://github.com/nf-core/test-datasets/raw/viralrecon/genome/MN908947.3/GCA_009858895.3_ASM985889v3_genomic.200409.gff.gz"}
  - {id: primer_bed_url, name: Primer BED, description: "ARTIC nCoV-2019 V1 (--primer_set artic --primer_set_version 1).", kind: string, path: params/primer_bed_url.txt, value: "https://github.com/artic-network/artic-ncov2019/raw/master/primer_schemes/nCoV-2019/V1/nCoV-2019.primer.bed"}
  - {id: kraken2_db_url, name: Kraken2 database, kind: string, path: params/kraken2_db_url.txt, value: "https://raw.githubusercontent.com/nf-core/test-datasets/viralrecon/genome/kraken2/kraken2_hs22.tar.gz"}
  - {id: nextclade_dataset_url, name: Nextclade dataset, kind: string, path: params/nextclade_dataset_url.txt, value: "https://github.com/nf-core/test-datasets/raw/viralrecon/genome/MN908947.3/nextclade_sars-cov-2_MN908947_2024-10-17--16_48_48Z.tar.gz"}

tasks:
  # ---------------------------------------------------------------- inputs
  - kind: horus_task
    id: fetch_reference
    name: Fetch reference files
    description: Downloads the genome fasta and GFF, primer BED, Kraken2 database and Nextclade dataset (or copies them from the mirror).
    inputs:
      - *a_mirror
      - {id: fasta_url, name: Genome fasta, kind: string, path: params/fasta_url.txt}
      - {id: gff_url, name: Genome GFF, kind: string, path: params/gff_url.txt}
      - {id: primer_bed_url, name: Primer BED, kind: string, path: params/primer_bed_url.txt}
      - {id: kraken2_db_url, name: Kraken2 database, kind: string, path: params/kraken2_db_url.txt}
      - {id: nextclade_dataset_url, name: Nextclade dataset, kind: string, path: params/nextclade_dataset_url.txt}
    outputs: [*a_reference]
    executor: {kind: shell}
    runtime:
      kind: python_script
      script: scripts/stage_inputs.py
      python: python3 # stdlib only
      args: >-
        reference --fasta ${fasta_url} --gff ${gff_url} --primer_bed ${primer_bed_url}
        --kraken2_db ${kraken2_db_url} --nextclade_dataset ${nextclade_dataset_url}
        --mirror ${input_mirror} --out ${reference}
    target: *target

  - kind: horus_task
    id: stage_samples
    name: Split the samplesheet into samples
    description: Fetches each sample's reads and writes one meta file per sample, merging runs as the samplesheet check does.
    inputs: [*a_samplesheet, *a_mirror]
    outputs: [*a_reads, *a_samples]
    executor: {kind: shell}
    runtime:
      kind: python_script
      script: scripts/stage_inputs.py
      python: python3 # stdlib only
      args: samples --samplesheet ${samplesheet} --mirror ${input_mirror} --reads ${reads} --samples ${samples}
    target: *target

  # ---------------------------------------------------------------- genome
  - kind: horus_task
    id: gunzip_fasta
    name: GUNZIP_FASTA
    inputs: [*a_reference]
    outputs: [*a_fasta]
    resources: *single
    executor: *coreutils
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${reference}/refs.env
        rm -rf ${fasta} && mkdir -p ${fasta} && cd ${fasta}
        ln -s ${reference}/$$ref_fasta .
        gzip \
            -cd \
            $$ref_fasta \
            > $${ref_fasta%.gz}
        rm $$ref_fasta
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: gunzip_gff
    name: GUNZIP_GFF
    inputs: [*a_reference]
    outputs: [*a_gff]
    resources: *single
    executor: *coreutils
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${reference}/refs.env
        rm -rf ${gff} && mkdir -p ${gff} && cd ${gff}
        ln -s ${reference}/$$ref_gff .
        gzip \
            -cd \
            $$ref_gff \
            > $${ref_gff%.gz}
        rm $$ref_gff
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: untar_kraken2_db
    name: UNTAR_KRAKEN2_DB
    inputs: [*a_reference]
    outputs: [*a_kraken2_db]
    resources: *single
    executor: *coreutils
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${reference}/refs.env
        rm -rf ${kraken2_db} && mkdir -p ${kraken2_db} && cd ${kraken2_db}
        ln -s ${reference}/$$ref_kraken2_db .
        db=$${ref_kraken2_db%.tar.gz}
        mkdir $$db
        if [[ $$(tar -taf $$ref_kraken2_db | grep -o -P "^.*?\/" | uniq | wc -l) -eq 1 ]]; then
            tar -C $$db --strip-components 1 -xavf $$ref_kraken2_db --no-same-owner
        else
            tar -C $$db -xavf $$ref_kraken2_db --no-same-owner
        fi
        rm $$ref_kraken2_db
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: untar_nextclade_db
    name: UNTAR_NEXTCLADE_DB
    inputs: [*a_reference]
    outputs: [*a_nextclade_db]
    resources: *single
    executor: *coreutils
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${reference}/refs.env
        rm -rf ${nextclade_db} && mkdir -p ${nextclade_db} && cd ${nextclade_db}
        ln -s ${reference}/$$ref_nextclade_dataset .
        db=$${ref_nextclade_dataset%.tar.gz}
        mkdir $$db
        if [[ $$(tar -taf $$ref_nextclade_dataset | grep -o -P "^.*?\/" | uniq | wc -l) -eq 1 ]]; then
            tar -C $$db --strip-components 1 -xavf $$ref_nextclade_dataset --no-same-owner
        else
            tar -C $$db -xavf $$ref_nextclade_dataset --no-same-owner
        fi
        rm $$ref_nextclade_dataset
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: collapse_primers
    name: COLLAPSE_PRIMERS
    inputs: [*a_reference, *a_nfcore]
    outputs: [*a_collapsed]
    resources: *high
    executor: *python313
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${reference}/refs.env; export PATH=${nfcore}/bin:$$PATH
        rm -rf ${primer_collapsed} && mkdir -p ${primer_collapsed} && cd ${primer_collapsed}
        ln -s ${reference}/$$ref_primer_bed .
        collapse_primer_bed.py \
            --left_primer_suffix _LEFT \
            --right_primer_suffix _RIGHT \
            $$ref_primer_bed \
            $${ref_primer_bed%.bed}.collapsed.bed
        rm $$ref_primer_bed
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: getchromsizes
    name: CUSTOM_GETCHROMSIZES
    inputs: [*a_fasta]
    outputs: [*a_chromsizes]
    resources: *single
    executor: *samtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        fa=$$(ls ${fasta})
        rm -rf ${chromsizes} && mkdir -p ${chromsizes} && cd ${chromsizes}
        ln -s ${fasta}/$$fa .
        samtools faidx $$fa
        cut -f 1,2 $$fa.fai > $$fa.sizes
        rm $$fa
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # BEDTOOLS_GETFASTA runs with an empty meta, hence the "null" prefix.
  - kind: horus_task
    id: getfasta
    name: BEDTOOLS_GETFASTA
    inputs: [*a_reference, *a_fasta]
    outputs: [*a_primer_fasta]
    resources: *single
    executor: *bedtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${reference}/refs.env; fa=$$(ls ${fasta})
        rm -rf ${primer_fasta} && mkdir -p ${primer_fasta} && cd ${primer_fasta}
        ln -s ${reference}/$$ref_primer_bed ${fasta}/$$fa .
        bedtools \
            getfasta \
            -s -nameOnly \
            -fi $$fa \
            -bed $$ref_primer_bed \
            -fo null.fa
        rm $$fa $$ref_primer_bed
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: prepare_primer_fasta
    name: PREPARE_PRIMER_FASTA
    inputs: [*a_primer_fasta]
    outputs: [*a_adapters]
    resources: *low
    executor: *ubuntu
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${adapters} && mkdir -p ${adapters} && cd ${adapters}
        sed -r '/^[ACTGactg]+$$/ s/^/X/g' ${primer_fasta}/null.fa > adapters.sub.fa
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: makeblastdb
    name: BLAST_MAKEBLASTDB
    inputs: [*a_fasta]
    outputs: [*a_blast_db]
    resources: *high
    executor: *makeblastdb
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        fa=$$(ls ${fasta})
        rm -rf ${blast_db} && mkdir -p ${blast_db} && cd ${blast_db}
        ln -s ${fasta}/$$fa .
        makeblastdb \
            -in $$fa \
            -out null/$$fa \
            -parse_seqids -dbtype nucl
        rm $$fa
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: bowtie2_build
    name: BOWTIE2_BUILD
    inputs: [*a_fasta]
    outputs: [*a_bowtie2_idx]
    resources: *high
    executor: *bowtie2
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        fa=$$(ls ${fasta})
        rm -rf ${bowtie2_idx} && mkdir -p ${bowtie2_idx} && cd ${bowtie2_idx}
        ln -s ${fasta}/$$fa .
        mkdir bowtie2
        bowtie2-build --seed 1 --threads ${task.resources.cpus} $$fa bowtie2/$${fa%.*}
        rm $$fa
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: snpeff_build
    name: SNPEFF_BUILD
    inputs: [*a_fasta, *a_gff]
    outputs: [*a_snpeff_db]
    resources: *low
    executor: *snpeff
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        fa=$$(ls ${fasta}); gff_file=$$(ls ${gff}); base=$${fa%.*}
        rm -rf ${snpeff_db} && mkdir -p ${snpeff_db} && cd ${snpeff_db}
        cp ${fasta}/$$fa ${gff}/$$gff_file .
        mkdir -p snpeff_db/genomes/
        cd snpeff_db/genomes/
        ln -s ../../$$fa $$base.fa

        cd ../../
        mkdir -p snpeff_db/$$base/
        cd snpeff_db/$$base/
        ln -s ../../$$gff_file genes.gff

        cd ../../
        echo "$$base.genome : $$base" > snpeff.config

        snpEff \
            -Xmx${task.resources.memory_gb}g \
            build \
            -config snpeff.config \
            -dataDir ./snpeff_db \
            -gff3 \
            -v \
            $$base
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # Downloads the current barcodes, as the pipeline does without
  # --freyja_barcodes: results follow the barcode release of the run day.
  - kind: horus_task
    id: freyja_update
    name: FREYJA_UPDATE
    outputs: [*a_freyja_db]
    resources: *single
    executor: *freyja
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        rm -rf ${freyja_db} && mkdir -p ${freyja_db} && cd ${freyja_db}
        freyja \
            update \
            --outdir .
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # Same for pangolin-data without --pango_database.
  - kind: horus_task
    id: pangolin_updatedata
    name: PANGOLIN_UPDATEDATA
    outputs: [*a_pangolin_db]
    resources: *single
    executor: *pangolin
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        export XDG_CACHE_HOME=/tmp/.cache
        rm -rf ${pangolin_db} && mkdir -p ${pangolin_db} && cd ${pangolin_db}
        mkdir -p pangolin_db

        pangolin \
            --update-data \
            --threads ${task.resources.cpus} \
            --datadir pangolin_db
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # ---------------------------------------------------------------- read QC
  # CAT_FASTQ runs for every sample in 3.0.0: reads are staged as input<n>/,
  # R1 files (odd positions) and R2 files (even positions) concatenated.
  - kind: horus_map
    id: cat_fastq
    name: CAT_FASTQ
    description: Writes each sample's meta.env, the head of the chain.
    over: {input_id: samples, as: sample}
    max_concurrency: 16
    inputs: [*a_samples, *a_reads]
    outputs: [*a_cat_fastq]
    resources: *single
    executor: *coreutils
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        id=$$(basename ${sample}); . ${sample}
        rm -rf ${cat_fastq} && mkdir -p ${cat_fastq} && cd ${cat_fastq}
        { echo id=$$id; cat ${sample}; } > meta.env
        i=0; r1=""; r2=""
        while read f; do
            i=$$((i + 1)); mkdir input$$i; ln -s ${reads}/$$id/$$f input$$i/
            if [ $$single_end = true ] || [ $$((i % 2)) -eq 1 ]; then r1="$$r1 input$$i/$$f"; else r2="$$r2 input$$i/$$f"; fi
        done < ${reads}/$$id/reads.txt
        if [ $$single_end = true ]; then
            cat $$r1 > $${id}.merged.fastq.gz
        else
            cat $$r1 > $${id}_1.merged.fastq.gz
            cat $$r2 > $${id}_2.merged.fastq.gz
        fi
        rm -r $$(seq -f input%g 1 $$i)
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: fastqc_raw
    name: FASTQC_RAW
    over: {input_id: cat_fastq, as: sample}
    chain: true
    max_concurrency: 16
    inputs: [*a_cat_fastq]
    outputs: [*a_fastqc_raw]
    resources: *high
    executor: *fastqc
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${sample}/meta.env
        rm -rf ${fastqc_raw} && mkdir -p ${fastqc_raw} && cd ${fastqc_raw}
        if [ $$single_end = true ]; then
            ln -s ${sample}/$${id}.merged.fastq.gz .
            pairs="$${id}.merged.fastq.gz $${id}.gz"; names="$${id}.gz"
        else
            ln -s ${sample}/$${id}_[12].merged.fastq.gz .
            pairs="$${id}_1.merged.fastq.gz $${id}_1.gz $${id}_2.merged.fastq.gz $${id}_2.gz"; names="$${id}_1.gz $${id}_2.gz"
        fi
        mem=$$(( ${task.resources.memory_gb} * 1024 / ${task.resources.cpus} ))
        printf "%s %s\n" $$pairs | while read old_name new_name; do
            [ -f "$${new_name}" ] || ln -s $$old_name $$new_name
        done

        fastqc \
            --quiet \
            --threads ${task.resources.cpus} \
            --memory $$mem \
            $$names
        rm $$names $${id}*.merged.fastq.gz
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: fastp
    name: FASTP
    over: {input_id: cat_fastq, as: sample}
    chain: true
    max_concurrency: 16
    inputs: [*a_cat_fastq]
    outputs: [*a_fastp]
    resources: *high
    executor: *fastp
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${sample}/meta.env
        rm -rf ${fastp} && mkdir -p ${fastp} && cd ${fastp}
        if [ $$single_end = true ]; then
        ln -s ${sample}/$${id}.merged.fastq.gz .
        [ ! -f  $${id}.fastq.gz ] && ln -sf $${id}.merged.fastq.gz $${id}.fastq.gz

        fastp \
            --in1 $${id}.fastq.gz \
            --out1 $${id}.fastp.fastq.gz \
            --thread ${task.resources.cpus} \
            --json $${id}.fastp.json \
            --html $${id}.fastp.html \
            --cut_front --cut_tail --trim_poly_x --cut_mean_quality 30 --qualified_quality_phred 30 --unqualified_percent_limit 10 --length_required 50 \
            2>| >(tee $${id}.fastp.log >&2)
        else
        ln -s ${sample}/$${id}_[12].merged.fastq.gz .
        [ ! -f  $${id}_1.fastq.gz ] && ln -sf $${id}_1.merged.fastq.gz $${id}_1.fastq.gz
        [ ! -f  $${id}_2.fastq.gz ] && ln -sf $${id}_2.merged.fastq.gz $${id}_2.fastq.gz
        fastp \
            --in1 $${id}_1.fastq.gz \
            --in2 $${id}_2.fastq.gz \
            --out1 $${id}_1.fastp.fastq.gz \
            --out2 $${id}_2.fastp.fastq.gz \
            --json $${id}.fastp.json \
            --html $${id}.fastp.html \
            --thread ${task.resources.cpus} \
            --detect_adapter_for_pe \
            --cut_front --cut_tail --trim_poly_x --cut_mean_quality 30 --qualified_quality_phred 30 --unqualified_percent_limit 10 --length_required 50 \
            2>| >(tee $${id}.fastp.log >&2)
        fi
        wait
        rm $${id}*.merged.fastq.gz; find . -maxdepth 1 -type l -name "$${id}*.fastq.gz" -delete
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_task
    id: decide_fastp
    name: Filter samples with reads after fastp
    description: Writes fail_mapped_reads_mqc.tsv for the samples fastp left no reads for; filter_fastp drops them.
    inputs: [*a_samples, *a_fastp]
    outputs: [*a_fastp_pass, *a_mqc_fastp]
    executor: {kind: shell}
    runtime:
      kind: python_script
      script: scripts/decide.py
      python: python3 # stdlib only
      args: fastp --samples ${samples} --fastp ${fastp} --out ${fastp_pass} --fail-tsv ${mqc_fastp}/fail_mapped_reads_mqc.tsv
    target: *target

  - kind: horus_map
    id: filter_fastp
    name: Filter samples with reads after fastp
    description: Drops a sample fastp left no reads for (exit 10).
    over: {input_id: cat_fastq, as: sample}
    chain: true
    zip: [{input_id: fastp, as: fastp_item}]
    drop_exit_codes: [10]
    max_concurrency: 16
    inputs: [*a_cat_fastq, *a_fastp]
    outputs: [*a_filter_fastp]
    executor: {kind: shell}
    runtime:
      kind: python_script
      script: scripts/decide.py
      python: python3 # stdlib only
      args: item --check fastp --meta ${sample}/meta.env --data ${fastp_item} --out ${filter_fastp}
    target: *target

  - kind: horus_map
    id: fastqc_trim
    name: FASTQC_TRIM
    over: {input_id: filter_fastp, as: sample}
    chain: true
    zip: [{input_id: fastp, as: fastp_item}]
    max_concurrency: 16
    inputs: [*a_filter_fastp, *a_fastp]
    outputs: [*a_fastqc_trim]
    resources: *high
    executor: *fastqc
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${sample}/meta.env
        rm -rf ${fastqc_trim} && mkdir -p ${fastqc_trim} && cd ${fastqc_trim}
        if [ $$single_end = true ]; then
            ln -s ${fastp_item}/$${id}.fastp.fastq.gz .
            pairs="$${id}.fastp.fastq.gz $${id}.gz"; names="$${id}.gz"
        else
            ln -s ${fastp_item}/$${id}_[12].fastp.fastq.gz .
            pairs="$${id}_1.fastp.fastq.gz $${id}_1.gz $${id}_2.fastp.fastq.gz $${id}_2.gz"; names="$${id}_1.gz $${id}_2.gz"
        fi
        mem=$$(( ${task.resources.memory_gb} * 1024 / ${task.resources.cpus} ))
        printf "%s %s\n" $$pairs | while read old_name new_name; do
            [ -f "$${new_name}" ] || ln -s $$old_name $$new_name
        done

        fastqc \
            --quiet \
            --threads ${task.resources.cpus} \
            --memory $$mem \
            $$names
        rm $$names $${id}*.fastp.fastq.gz
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # --kraken2_assembly_host_filter (default true): the unclassified reads go
  # to the assembly branch; variant calling uses the fastp reads.
  - kind: horus_map
    id: kraken2
    name: KRAKEN2_KRAKEN2
    over: {input_id: filter_fastp, as: sample}
    chain: true
    zip: [{input_id: fastp, as: fastp_item}]
    max_concurrency: 16
    inputs: [*a_filter_fastp, *a_fastp, *a_kraken2_db]
    outputs: [*a_kraken2]
    resources: *high
    executor: *kraken2
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${sample}/meta.env
        rm -rf ${kraken2} && mkdir -p ${kraken2} && cd ${kraken2}
        db=$$(ls ${kraken2_db}); ln -s ${kraken2_db}/$$db .
        if [ $$single_end = true ]; then
        ln -s ${fastp_item}/$${id}.fastp.fastq.gz .
        kraken2 \
            --db $$db \
            --threads ${task.resources.cpus} \
            --report $${id}.kraken2.report.txt \
            --gzip-compressed \
            --unclassified-out $${id}.unclassified.fastq \
            --classified-out $${id}.classified.fastq \
            --output $${id}.kraken2.classifiedreads.txt \
            --report-zero-counts \
            $${id}.fastp.fastq.gz
        else
        ln -s ${fastp_item}/$${id}_[12].fastp.fastq.gz .
        kraken2 \
            --db $$db \
            --threads ${task.resources.cpus} \
            --report $${id}.kraken2.report.txt \
            --gzip-compressed \
            --unclassified-out $${id}.unclassified#.fastq \
            --classified-out $${id}.classified#.fastq \
            --output $${id}.kraken2.classifiedreads.txt \
            --paired \
            --report-zero-counts \
            $${id}_1.fastp.fastq.gz $${id}_2.fastp.fastq.gz
        fi

        pigz -p ${task.resources.cpus} *.fastq
        rm $$db $${id}*.fastp.fastq.gz
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  # ---------------------------------------------------------------- alignment
  - kind: horus_map
    id: bowtie2_align
    name: BOWTIE2_ALIGN
    over: {input_id: filter_fastp, as: sample}
    chain: true
    zip: [{input_id: fastp, as: fastp_item}]
    max_concurrency: 16
    inputs: [*a_filter_fastp, *a_fastp, *a_bowtie2_idx, *a_fasta]
    outputs: [*a_bowtie2]
    resources: *high
    executor: *bowtie2
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${sample}/meta.env
        rm -rf ${bowtie2} && mkdir -p ${bowtie2} && cd ${bowtie2}
        ln -s ${bowtie2_idx}/bowtie2 ${fasta}/$$(ls ${fasta}) .
        if [ $$single_end = true ]; then ln -s ${fastp_item}/$${id}.fastp.fastq.gz .; else ln -s ${fastp_item}/$${id}_[12].fastp.fastq.gz .; fi
        INDEX=`find -L ./ -name "*.rev.1.bt2" | sed "s/\.rev.1.bt2$$//"`
        [ -z "$$INDEX" ] && INDEX=`find -L ./ -name "*.rev.1.bt2l" | sed "s/\.rev.1.bt2l$$//"`
        [ -z "$$INDEX" ] && echo "Bowtie2 index files not found" 1>&2 && exit 1
        if [ $$single_end = true ]; then reads="-U $${id}.fastp.fastq.gz"; else reads="-1 $${id}_1.fastp.fastq.gz -2 $${id}_2.fastp.fastq.gz"; fi

        bowtie2 \
            -x $$INDEX \
            $$reads \
            --threads ${task.resources.cpus} \
            --local --very-sensitive-local --seed 1 \
            2>| >(tee $${id}.bowtie2.log >&2) \
            | samtools view -F4 -bhS --threads ${task.resources.cpus}  -o $${id}.bam -
        wait
        rm bowtie2 $$(ls ${fasta}) $${id}*.fastp.fastq.gz
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: sort
    name: SAMTOOLS_SORT
    over: {input_id: filter_fastp, as: sample}
    chain: true
    zip: [{input_id: bowtie2, as: bowtie2_item}]
    max_concurrency: 16
    inputs: [*a_filter_fastp, *a_bowtie2, *a_fasta]
    outputs: [*a_sort]
    resources: *high
    executor: *samtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${sample}/meta.env; fa=$$(ls ${fasta})
        rm -rf ${sort} && mkdir -p ${sort} && cd ${sort}
        ln -s ${bowtie2_item}/$${id}.bam ${fasta}/$$fa .
        samtools cat \
            $${id}.bam \
        | \
        samtools sort \
            -T $${id}.sorted \
            --threads ${task.resources.cpus} \
            --reference $$fa \
            -o $${id}.sorted.bam \
            -
        rm $${id}.bam $$fa
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: sort_index
    name: SAMTOOLS_INDEX
