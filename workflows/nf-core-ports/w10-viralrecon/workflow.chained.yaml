  # ---------------------------------------------------------------- BAM QC
  - kind: horus_map
    id: picard
    name: PICARD_COLLECTMULTIPLEMETRICS
    over: {input_id: filter_mapped, as: sample}
    chain: true
    zip: [{input_id: trim_sort, as: trim_sort_item}, {input_id: trim_index, as: trim_index_item}]
    max_concurrency: 16
    inputs: [*a_filter_mapped, *a_trim_sort, *a_trim_index, *a_fasta]
