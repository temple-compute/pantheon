        ln -s ${vcf_filter_item}/$${id}.filtered.vcf.gz ${filter_tbi_item}/$${id}.filtered.vcf.gz.tbi ${maskfasta_item}/$${id}.masked.fa .
        cat $${id}.masked.fa \
            | bcftools \
                consensus \
                $${id}.filtered.vcf.gz \
                > $${id}.fa
        rm $${id}.filtered.vcf.gz $${id}.filtered.vcf.gz.tbi $${id}.masked.fa
