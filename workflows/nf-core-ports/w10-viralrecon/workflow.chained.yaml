        rm -rf ${spades_blastn} && mkdir -p ${spades_blastn} && cd ${spades_blastn}
        ln -s ${spades_scaffolds_item}/$${id}.scaffolds.fa ${blast_db}/null .
        DB=`find -L ./ -name "*.nal" | sed 's/\.nal$$//'`
        if [ -z "$$DB" ]; then
            DB=`find -L ./ -name "*.nin" | sed 's/\.nin$$//'`
        fi
        echo Using $$DB

        blastn \
            -num_threads ${task.resources.cpus} \
            -db $$DB \
            -query $${id}.scaffolds.fa \
            -outfmt '6 stitle staxids std slen qlen qcovs' \
            -out $${id}.txt
        rm $${id}.scaffolds.fa null
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: spades_filter
    name: FILTER_BLASTN (SPAdes)
    over: {input_id: filter_fastp, as: sample}
    chain: true
    zip: [{input_id: spades_blastn, as: spades_blastn_item}]
    max_concurrency: 16
    inputs: [*a_filter_fastp, *a_spades_blastn, *a_nfcore]
    outputs: [*a_spades_filter]
    resources: *low
    executor: *ubuntu
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${sample}/meta.env
        rm -rf ${spades_filter} && mkdir -p ${spades_filter} && cd ${spades_filter}
        ln -s ${spades_blastn_item}/$${id}.txt ${nfcore}/assets/headers/blast_outfmt6_header.txt ${nfcore}/assets/headers/blast_filtered_outfmt6_header.txt .
        cat blast_outfmt6_header.txt $${id}.txt > $${id}.results.blastn.txt
        awk 'BEGIN{OFS="\t";FS="\t"}{print $$0,$$6/$$16,$$6/$$15}' $${id}.txt | awk 'BEGIN{OFS="\t";FS="\t"} $$16 > 200 && $$18 > 0.7 && $$1 !~ /phage/ {print $$0}' > tmp.out
        cat blast_filtered_outfmt6_header.txt tmp.out > $${id}.filter.blastn.txt
        rm $${id}.txt blast_outfmt6_header.txt blast_filtered_outfmt6_header.txt tmp.out
        NF
