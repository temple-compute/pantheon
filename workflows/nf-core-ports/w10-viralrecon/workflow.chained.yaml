  # ---------------------------------------------------------------- assembly
  - kind: horus_map
    id: cutadapt
    name: CUTADAPT
    over: {input_id: filter_fastp, as: sample}
    chain: true
    zip: [{input_id: kraken2, as: kraken2_item}]
    max_concurrency: 16
    inputs: [*a_filter_fastp, *a_kraken2, *a_adapters]
    outputs: [*a_cutadapt]
    resources: *high
    executor: *cutadapt
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${sample}/meta.env
        rm -rf ${cutadapt} && mkdir -p ${cutadapt} && cd ${cutadapt}
        ln -s ${kraken2_item}/$${id}.unclassified*.fastq.gz ${adapters}/adapters.sub.fa .
        if [ $$single_end = true ]; then
        cutadapt \
            -Z \
            --cores ${task.resources.cpus} \
            --overlap 5 --minimum-length 30 --error-rate 0.1 \
            -g file:adapters.sub.fa \
            -o $${id}.primer_trim.trim.fastq.gz \
            $${id}.unclassified.fastq.gz \
            > $${id}.primer_trim.cutadapt.log
        else
        cutadapt \
            -Z \
            --cores ${task.resources.cpus} \
            --overlap 5 --minimum-length 30 --error-rate 0.1 \
            -g file:adapters.sub.fa -G file:adapters.sub.fa \
            -o $${id}.primer_trim_1.trim.fastq.gz -p $${id}.primer_trim_2.trim.fastq.gz \
            $${id}.unclassified_1.fastq.gz $${id}.unclassified_2.fastq.gz \
            > $${id}.primer_trim.cutadapt.log
        fi
        rm $${id}.unclassified*.fastq.gz adapters.sub.fa
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: fastqc_cutadapt
    name: FASTQC
    over: {input_id: filter_fastp, as: sample}
    chain: true
    zip: [{input_id: cutadapt, as: cutadapt_item}]
    max_concurrency: 16
    inputs: [*a_filter_fastp, *a_cutadapt]
    outputs: [*a_fastqc_cutadapt]
    resources: *high
    executor: *fastqc
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${sample}/meta.env
        rm -rf ${fastqc_cutadapt} && mkdir -p ${fastqc_cutadapt} && cd ${fastqc_cutadapt}
        ln -s ${cutadapt_item}/$${id}.primer_trim*.trim.fastq.gz .
        if [ $$single_end = true ]; then
            pairs="$${id}.primer_trim.trim.fastq.gz $${id}.primer_trim.gz"; names="$${id}.primer_trim.gz"
        else
            pairs="$${id}.primer_trim_1.trim.fastq.gz $${id}.primer_trim_1.gz $${id}.primer_trim_2.trim.fastq.gz $${id}.primer_trim_2.gz"
            names="$${id}.primer_trim_1.gz $${id}.primer_trim_2.gz"
        fi
        mem=$$(( ${task.resources.memory_gb} * 1024 / ${task.resources.cpus} ))
        printf "%s %s\n" $$pairs | while read old_name new_name; do
            [ -f "$${new_name}" ] || ln -s $$old_name $$new_name
        done

        fastqc \
            --quiet \
            --threads ${task.resources.cpus} \
            --memory $$mem \
            $$names
        rm $$names $${id}.primer_trim*.trim.fastq.gz
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: spades
    name: SPADES
    over: {input_id: filter_fastp, as: sample}
    chain: true
    zip: [{input_id: cutadapt, as: cutadapt_item}]
    max_concurrency: 16
    inputs: [*a_filter_fastp, *a_cutadapt]
    outputs: [*a_spades]
    resources: *high
    executor: *spades
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${sample}/meta.env
        rm -rf ${spades} && mkdir -p ${spades} && cd ${spades}
        ln -s ${cutadapt_item}/$${id}.primer_trim*.trim.fastq.gz .
        if [ $$single_end = true ]; then reads="-s $${id}.primer_trim.trim.fastq.gz"
        else reads="-1 $${id}.primer_trim_1.trim.fastq.gz -2 $${id}.primer_trim_2.trim.fastq.gz"; fi
        spades.py \
            --rnaviral \
            --threads ${task.resources.cpus} \
            --memory ${task.resources.memory_gb} \
            $$reads   \
            -o ./
        mv spades.log $${id}.spades.log

        if [ -f scaffolds.fasta ]; then
            mv scaffolds.fasta $${id}.scaffolds.fa
            gzip -n $${id}.scaffolds.fa
        fi
        if [ -f contigs.fasta ]; then
            mv contigs.fasta $${id}.contigs.fa
            gzip -n $${id}.contigs.fa
        fi
        if [ -f transcripts.fasta ]; then
            mv transcripts.fasta $${id}.transcripts.fa
            gzip -n $${id}.transcripts.fa
        fi
        if [ -f assembly_graph_with_scaffolds.gfa ]; then
            mv assembly_graph_with_scaffolds.gfa $${id}.assembly.gfa
            gzip -n $${id}.assembly.gfa
        fi

        if [ -f gene_clusters.fasta ]; then
            mv gene_clusters.fasta $${id}.gene_clusters.fa
            gzip -n $${id}.gene_clusters.fa
        fi

        if [ -f warnings.log ]; then
            mv warnings.log $${id}.warnings.log
        fi
        rm $${id}.primer_trim*.trim.fastq.gz
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

