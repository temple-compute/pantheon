    outputs: [*a_filter_mapped]
    executor: {kind: shell}
    runtime:
      kind: python_script
      script: scripts/decide.py
      python: python3 # stdlib only
      args: item --check mapped --min-mapped-reads ${min_mapped_reads} --meta ${sample}/meta.env --data ${sort_flagstat_item} --out ${filter_mapped}
    target: *target

  - kind: horus_map
    id: ivar_trim
    name: IVAR_TRIM
    over: {input_id: filter_mapped, as: sample}
    chain: true
    zip: [{input_id: sort, as: sort_item}, {input_id: sort_index, as: sort_index_item}]
    max_concurrency: 16
    inputs: [*a_filter_mapped, *a_sort, *a_sort_index, *a_reference]
    outputs: [*a_ivar_trim]
    resources: *high
    executor: *ivar
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
        . ${sample}/meta.env; . ${reference}/refs.env
        rm -rf ${ivar_trim} && mkdir -p ${ivar_trim} && cd ${ivar_trim}
        ln -s ${sort_item}/$${id}.sorted.bam ${sort_index_item}/$${id}.sorted.bam.bai ${reference}/$$ref_primer_bed .
        ivar trim \
            -m 30 -q 20 -e \
            -i $${id}.sorted.bam \
            -b $$ref_primer_bed \
            -p $${id}.ivar_trim \
            > $${id}.ivar_trim.ivar.log
        rm $${id}.sorted.bam $${id}.sorted.bam.bai $$ref_primer_bed
        NF
        exec bash -C -e -u -o pipefail /tmp/.command.sh
    target: *target

  - kind: horus_map
    id: trim_sort
    name: SAMTOOLS_SORT (primer-trimmed)
    over: {input_id: filter_mapped, as: sample}
    chain: true
    zip: [{input_id: ivar_trim, as: ivar_trim_item}]
    max_concurrency: 16
    inputs: [*a_filter_mapped, *a_ivar_trim, *a_fasta]
    outputs: [*a_trim_sort]
    resources: *high
    executor: *samtools
    runtime:
      kind: command
      command: |
        cat > /tmp/.command.sh <<'NF'
