# Generated by tools/gen_fused.py from workflow.chained.yaml; do not edit by hand.
# Same images and commands; 12 same-image per-item steps run as 3 maps:
# 79 tasks instead of 88.
kind: horus_workflow
name: nf-core viralrecon chained fused
capacity:
  local://ubuntu-awow:
    cpus: 16
    memory_gb: 31
max_concurrency: 16
artifacts:
- id: samplesheet
  name: Samplesheet
  kind: file
  path: examples/samplesheet.csv
- id: nfcore
  name: nf-core/viralrecon files
  kind: folder
  path: nfcore/
- id: input_mirror
  name: Local input mirror
  description: Folder searched by file name before downloading a reference file or read; empty downloads everything.
  kind: string
  path: params/input_mirror.txt
  value: ''
- id: min_mapped_reads
  name: Min mapped reads
  description: Samples with this many mapped reads or fewer stop after alignment (--min_mapped_reads).
  kind: number
  path: params/min_mapped_reads.json
  value: 1000
- id: freyja_repeats
  name: Freyja bootstrap repeats
  description: freyja boot --nb (--freyja_repeats; the test profile sets 10).
  kind: number
  path: params/freyja_repeats.json
  value: 10
- id: fasta_url
  name: Genome fasta
  kind: string
  path: params/fasta_url.txt
  value: https://github.com/nf-core/test-datasets/raw/viralrecon/genome/MN908947.3/GCA_009858895.3_ASM985889v3_genomic.200409.fna.gz
- id: gff_url
  name: Genome GFF
  kind: string
  path: params/gff_url.txt
  value: https://github.com/nf-core/test-datasets/raw/viralrecon/genome/MN908947.3/GCA_009858895.3_ASM985889v3_genomic.200409.gff.gz
- id: primer_bed_url
  name: Primer BED
  description: ARTIC nCoV-2019 V1 (--primer_set artic --primer_set_version 1).
  kind: string
  path: params/primer_bed_url.txt
  value: https://github.com/artic-network/artic-ncov2019/raw/master/primer_schemes/nCoV-2019/V1/nCoV-2019.primer.bed
- id: kraken2_db_url
  name: Kraken2 database
  kind: string
  path: params/kraken2_db_url.txt
  value: https://raw.githubusercontent.com/nf-core/test-datasets/viralrecon/genome/kraken2/kraken2_hs22.tar.gz
- id: nextclade_dataset_url
  name: Nextclade dataset
  kind: string
  path: params/nextclade_dataset_url.txt
  value: https://github.com/nf-core/test-datasets/raw/viralrecon/genome/MN908947.3/nextclade_sars-cov-2_MN908947_2024-10-17--16_48_48Z.tar.gz
tasks:
- kind: horus_task
  id: fetch_reference
  name: Fetch reference files
  description: Downloads the genome fasta and GFF, primer BED, Kraken2 database and Nextclade dataset (or copies them from the mirror).
  inputs:
  - id: input_mirror
    name: Local input mirror
    kind: string
    path: params/input_mirror.txt
  - id: fasta_url
    name: Genome fasta
    kind: string
    path: params/fasta_url.txt
  - id: gff_url
    name: Genome GFF
    kind: string
    path: params/gff_url.txt
  - id: primer_bed_url
    name: Primer BED
    kind: string
    path: params/primer_bed_url.txt
  - id: kraken2_db_url
    name: Kraken2 database
    kind: string
    path: params/kraken2_db_url.txt
  - id: nextclade_dataset_url
    name: Nextclade dataset
    kind: string
    path: params/nextclade_dataset_url.txt
  outputs:
  - id: reference
    name: Reference files
    kind: folder
    path: work/reference/
  executor:
    kind: shell
  runtime:
    kind: python_script
    script: scripts/stage_inputs.py
    python: python3
    args: reference --fasta ${fasta_url} --gff ${gff_url} --primer_bed ${primer_bed_url} --kraken2_db ${kraken2_db_url} --nextclade_dataset ${nextclade_dataset_url} --mirror ${input_mirror} --out ${reference}
  target:
    kind: local
- kind: horus_task
  id: stage_samples
  name: Split the samplesheet into samples
  description: Fetches each sample's reads and writes one meta file per sample, merging runs as the samplesheet check does.
  inputs:
  - id: samplesheet
    name: Samplesheet
    kind: file
    path: examples/samplesheet.csv
  - id: input_mirror
    name: Local input mirror
    kind: string
    path: params/input_mirror.txt
  outputs:
  - id: reads
    name: Reads
    kind: folder
    path: work/reads/
  - id: samples
    name: Samples
    kind: folder
    path: work/samples/
  executor:
    kind: shell
  runtime:
    kind: python_script
    script: scripts/stage_inputs.py
    python: python3
    args: samples --samplesheet ${samplesheet} --mirror ${input_mirror} --reads ${reads} --samples ${samples}
  target:
    kind: local
- kind: horus_task
  id: gunzip_fasta
  name: GUNZIP_FASTA
  inputs:
  - id: reference
    name: Reference files
    kind: folder
    path: work/reference/
  outputs:
  - id: fasta
    name: Genome fasta
    kind: folder
    path: work/genome/fasta/
  resources:
    cpus: 1
    memory_gb: 6
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: community.wave.seqera.io/library/coreutils_grep_gzip_lbzip2_pruned:838ba80435a629f8
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      . ${reference}/refs.env
      rm -rf ${fasta} && mkdir -p ${fasta} && cd ${fasta}
      ln -s ${reference}/$$ref_fasta .
      gzip \
          -cd \
          $$ref_fasta \
          > $${ref_fasta%.gz}
      rm $$ref_fasta
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: gunzip_gff
  name: GUNZIP_GFF
  inputs:
  - id: reference
    name: Reference files
    kind: folder
    path: work/reference/
  outputs:
  - id: gff
    name: Genome GFF
    kind: folder
    path: work/genome/gff/
  resources:
    cpus: 1
    memory_gb: 6
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: community.wave.seqera.io/library/coreutils_grep_gzip_lbzip2_pruned:838ba80435a629f8
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      . ${reference}/refs.env
      rm -rf ${gff} && mkdir -p ${gff} && cd ${gff}
      ln -s ${reference}/$$ref_gff .
      gzip \
          -cd \
          $$ref_gff \
          > $${ref_gff%.gz}
      rm $$ref_gff
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: untar_kraken2_db
  name: UNTAR_KRAKEN2_DB
  inputs:
  - id: reference
    name: Reference files
    kind: folder
    path: work/reference/
  outputs:
  - id: kraken2_db
    name: Kraken2 database
    kind: folder
    path: work/genome/kraken2_db/
  resources:
    cpus: 1
    memory_gb: 6
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: community.wave.seqera.io/library/coreutils_grep_gzip_lbzip2_pruned:838ba80435a629f8
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      . ${reference}/refs.env
      rm -rf ${kraken2_db} && mkdir -p ${kraken2_db} && cd ${kraken2_db}
      ln -s ${reference}/$$ref_kraken2_db .
      db=$${ref_kraken2_db%.tar.gz}
      mkdir $$db
      if [[ $$(tar -taf $$ref_kraken2_db | grep -o -P "^.*?\/" | uniq | wc -l) -eq 1 ]]; then
          tar -C $$db --strip-components 1 -xavf $$ref_kraken2_db --no-same-owner
      else
          tar -C $$db -xavf $$ref_kraken2_db --no-same-owner
      fi
      rm $$ref_kraken2_db
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: untar_nextclade_db
  name: UNTAR_NEXTCLADE_DB
  inputs:
  - id: reference
    name: Reference files
    kind: folder
    path: work/reference/
  outputs:
  - id: nextclade_db
    name: Nextclade dataset
    kind: folder
    path: work/genome/nextclade_db/
  resources:
    cpus: 1
    memory_gb: 6
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: community.wave.seqera.io/library/coreutils_grep_gzip_lbzip2_pruned:838ba80435a629f8
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      . ${reference}/refs.env
      rm -rf ${nextclade_db} && mkdir -p ${nextclade_db} && cd ${nextclade_db}
      ln -s ${reference}/$$ref_nextclade_dataset .
      db=$${ref_nextclade_dataset%.tar.gz}
      mkdir $$db
      if [[ $$(tar -taf $$ref_nextclade_dataset | grep -o -P "^.*?\/" | uniq | wc -l) -eq 1 ]]; then
          tar -C $$db --strip-components 1 -xavf $$ref_nextclade_dataset --no-same-owner
      else
          tar -C $$db -xavf $$ref_nextclade_dataset --no-same-owner
      fi
      rm $$ref_nextclade_dataset
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: collapse_primers
  name: COLLAPSE_PRIMERS
  inputs:
  - id: reference
    name: Reference files
    kind: folder
    path: work/reference/
  - id: nfcore
    name: nf-core/viralrecon files
    kind: folder
    path: nfcore/
  outputs:
  - id: primer_collapsed
    name: Collapsed primer BED
    kind: folder
    path: work/genome/primer_collapsed/
  resources:
    cpus: 4
    memory_gb: 15
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/python:3.13
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      . ${reference}/refs.env; export PATH=${nfcore}/bin:$$PATH
      rm -rf ${primer_collapsed} && mkdir -p ${primer_collapsed} && cd ${primer_collapsed}
      ln -s ${reference}/$$ref_primer_bed .
      collapse_primer_bed.py \
          --left_primer_suffix _LEFT \
          --right_primer_suffix _RIGHT \
          $$ref_primer_bed \
          $${ref_primer_bed%.bed}.collapsed.bed
      rm $$ref_primer_bed
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: getchromsizes
  name: CUSTOM_GETCHROMSIZES
  inputs:
  - id: fasta
    name: Genome fasta
    kind: folder
    path: work/genome/fasta/
  outputs:
  - id: chromsizes
    name: Fasta index and sizes
    kind: folder
    path: work/genome/chromsizes/
  resources:
    cpus: 1
    memory_gb: 6
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/samtools:1.22.1--h96c455f_0
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      fa=$$(ls ${fasta})
      rm -rf ${chromsizes} && mkdir -p ${chromsizes} && cd ${chromsizes}
      ln -s ${fasta}/$$fa .
      samtools faidx $$fa
      cut -f 1,2 $$fa.fai > $$fa.sizes
      rm $$fa
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: getfasta
  name: BEDTOOLS_GETFASTA
  inputs:
  - id: reference
    name: Reference files
    kind: folder
    path: work/reference/
  - id: fasta
    name: Genome fasta
    kind: folder
    path: work/genome/fasta/
  outputs:
  - id: primer_fasta
    name: Primer fasta
    kind: folder
    path: work/genome/primer_fasta/
  resources:
    cpus: 1
    memory_gb: 6
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/bedtools:2.31.1--hf5e1c6e_0
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      . ${reference}/refs.env; fa=$$(ls ${fasta})
      rm -rf ${primer_fasta} && mkdir -p ${primer_fasta} && cd ${primer_fasta}
      ln -s ${reference}/$$ref_primer_bed ${fasta}/$$fa .
      bedtools \
          getfasta \
          -s -nameOnly \
          -fi $$fa \
          -bed $$ref_primer_bed \
          -fo null.fa
      rm $$fa $$ref_primer_bed
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: prepare_primer_fasta
  name: PREPARE_PRIMER_FASTA
  inputs:
  - id: primer_fasta
    name: Primer fasta
    kind: folder
    path: work/genome/primer_fasta/
  outputs:
  - id: adapters
    name: Cutadapt primer fasta
    kind: folder
    path: work/genome/adapters/
  resources:
    cpus: 2
    memory_gb: 12
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/nf-core/ubuntu:24.04
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      rm -rf ${adapters} && mkdir -p ${adapters} && cd ${adapters}
      sed -r '/^[ACTGactg]+$$/ s/^/X/g' ${primer_fasta}/null.fa > adapters.sub.fa
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: makeblastdb
  name: BLAST_MAKEBLASTDB
  inputs:
  - id: fasta
    name: Genome fasta
    kind: folder
    path: work/genome/fasta/
  outputs:
  - id: blast_db
    name: BLAST database
    kind: folder
    path: work/genome/blast_db/
  resources:
    cpus: 4
    memory_gb: 15
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/blast:2.16.0--h66d330f_5
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      fa=$$(ls ${fasta})
      rm -rf ${blast_db} && mkdir -p ${blast_db} && cd ${blast_db}
      ln -s ${fasta}/$$fa .
      makeblastdb \
          -in $$fa \
          -out null/$$fa \
          -parse_seqids -dbtype nucl
      rm $$fa
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: bowtie2_build
  name: BOWTIE2_BUILD
  inputs:
  - id: fasta
    name: Genome fasta
    kind: folder
    path: work/genome/fasta/
  outputs:
  - id: bowtie2_idx
    name: Bowtie2 index
    kind: folder
    path: work/genome/bowtie2/
  resources:
    cpus: 4
    memory_gb: 15
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: community.wave.seqera.io/library/bowtie2_htslib_samtools_pigz:edeb13799090a2a6
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      fa=$$(ls ${fasta})
      rm -rf ${bowtie2_idx} && mkdir -p ${bowtie2_idx} && cd ${bowtie2_idx}
      ln -s ${fasta}/$$fa .
      mkdir bowtie2
      bowtie2-build --seed 1 --threads ${task.resources.cpus} $$fa bowtie2/$${fa%.*}
      rm $$fa
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: snpeff_build
  name: SNPEFF_BUILD
  inputs:
  - id: fasta
    name: Genome fasta
    kind: folder
    path: work/genome/fasta/
  - id: gff
    name: Genome GFF
    kind: folder
    path: work/genome/gff/
  outputs:
  - id: snpeff_db
    name: SnpEff database
    kind: folder
    path: work/genome/snpeff/
  resources:
    cpus: 2
    memory_gb: 12
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/snpeff:5.0--hdfd78af_1
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      fa=$$(ls ${fasta}); gff_file=$$(ls ${gff}); base=$${fa%.*}
      rm -rf ${snpeff_db} && mkdir -p ${snpeff_db} && cd ${snpeff_db}
      cp ${fasta}/$$fa ${gff}/$$gff_file .
      mkdir -p snpeff_db/genomes/
      cd snpeff_db/genomes/
      ln -s ../../$$fa $$base.fa

      cd ../../
      mkdir -p snpeff_db/$$base/
      cd snpeff_db/$$base/
      ln -s ../../$$gff_file genes.gff

      cd ../../
      echo "$$base.genome : $$base" > snpeff.config

      snpEff \
          -Xmx${task.resources.memory_gb}g \
          build \
          -config snpeff.config \
          -dataDir ./snpeff_db \
          -gff3 \
          -v \
          $$base
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: freyja_update
  name: FREYJA_UPDATE
  outputs:
  - id: freyja_db
    name: Freyja barcodes
    kind: folder
    path: results/variants/freyja/freyja_db/
  resources:
    cpus: 1
    memory_gb: 6
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/freyja:2.0.1--pyhdfd78af_0
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      rm -rf ${freyja_db} && mkdir -p ${freyja_db} && cd ${freyja_db}
      freyja \
          update \
          --outdir .
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_task
  id: pangolin_updatedata
  name: PANGOLIN_UPDATEDATA
  outputs:
  - id: pangolin_db
    name: Pangolin data
    kind: folder
    path: work/genome/pangolin_db/
  resources:
    cpus: 1
    memory_gb: 6
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: community.wave.seqera.io/library/pangolin-data_pangolin_pip_snakemake:7987089a2a044e70
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      export XDG_CACHE_HOME=/tmp/.cache
      rm -rf ${pangolin_db} && mkdir -p ${pangolin_db} && cd ${pangolin_db}
      mkdir -p pangolin_db

      pangolin \
          --update-data \
          --threads ${task.resources.cpus} \
          --datadir pangolin_db
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_map
  id: cat_fastq
  name: CAT_FASTQ
  description: Writes each sample's meta.env, the head of the chain.
  over:
    input_id: samples
    as: sample
  max_concurrency: 16
  inputs:
  - id: samples
    name: Samples
    kind: folder
    path: work/samples/
  - id: reads
    name: Reads
    kind: folder
    path: work/reads/
  outputs:
  - id: cat_fastq
    name: Merged reads
    kind: folder
    path: work/cat_fastq/
  resources:
    cpus: 1
    memory_gb: 6
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: community.wave.seqera.io/library/coreutils_grep_gzip_lbzip2_pruned:838ba80435a629f8
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      id=$$(basename ${sample}); . ${sample}
      rm -rf ${cat_fastq} && mkdir -p ${cat_fastq} && cd ${cat_fastq}
      { echo id=$$id; cat ${sample}; } > meta.env
      i=0; r1=""; r2=""
      while read f; do
          i=$$((i + 1)); mkdir input$$i; ln -s ${reads}/$$id/$$f input$$i/
          if [ $$single_end = true ] || [ $$((i % 2)) -eq 1 ]; then r1="$$r1 input$$i/$$f"; else r2="$$r2 input$$i/$$f"; fi
      done < ${reads}/$$id/reads.txt
      if [ $$single_end = true ]; then
          cat $$r1 > $${id}.merged.fastq.gz
      else
          cat $$r1 > $${id}_1.merged.fastq.gz
          cat $$r2 > $${id}_2.merged.fastq.gz
      fi
      rm -r $$(seq -f input%g 1 $$i)
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_map
  id: fastqc_raw
  name: FASTQC_RAW
  over:
    input_id: cat_fastq
    as: sample
  chain: true
  max_concurrency: 16
  inputs:
  - id: cat_fastq
    name: Merged reads
    kind: folder
    path: work/cat_fastq/
  outputs:
  - id: fastqc_raw
    name: FastQC raw
    kind: folder
    path: results/fastqc/raw/
  resources:
    cpus: 4
    memory_gb: 15
    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0
  runtime:
    kind: command
    command: |
      cat > /tmp/.command.sh <<'NF'
      . ${sample}/meta.env
      rm -rf ${fastqc_raw} && mkdir -p ${fastqc_raw} && cd ${fastqc_raw}
      if [ $$single_end = true ]; then
          ln -s ${sample}/$${id}.merged.fastq.gz .
          pairs="$${id}.merged.fastq.gz $${id}.gz"; names="$${id}.gz"
      else
          ln -s ${sample}/$${id}_[12].merged.fastq.gz .
          pairs="$${id}_1.merged.fastq.gz $${id}_1.gz $${id}_2.merged.fastq.gz $${id}_2.gz"; names="$${id}_1.gz $${id}_2.gz"
      fi
      mem=$$(( ${task.resources.memory_gb} * 1024 / ${task.resources.cpus} ))
      printf "%s %s\n" $$pairs | while read old_name new_name; do
          [ -f "$${new_name}" ] || ln -s $$old_name $$new_name
      done

      fastqc \
          --quiet \
          --threads ${task.resources.cpus} \
          --memory $$mem \
          $$names
      rm $$names $${id}*.merged.fastq.gz
      NF
      exec bash -C -e -u -o pipefail /tmp/.command.sh
  target:
    kind: local
- kind: horus_map
  id: fastp
  name: FASTP
  over:
    input_id: cat_fastq
    as: sample
  chain: true
  max_concurrency: 16
  inputs:
  - id: cat_fastq
    name: Merged reads
    kind: folder
    path: work/cat_fastq/
  outputs:
  - id: fastp
