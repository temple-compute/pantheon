  id: sort_chain
  name: SAMTOOLS sort, index and stats
  description: Runs SAMTOOLS_SORT, SAMTOOLS_INDEX, SAMTOOLS_STATS, SAMTOOLS_FLAGSTAT, SAMTOOLS_IDXSTATS in turn (same image, same commands).
  over:
    input_id: filter_fastp
    as: sample
  chain: true
  zip:
  - input_id: bowtie2
    as: bowtie2_item
  max_concurrency: 16
