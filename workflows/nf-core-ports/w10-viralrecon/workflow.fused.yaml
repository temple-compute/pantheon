    walltime: 01:00:00
  executor:
    kind: docker
    user: host
    image: quay.io/biocontainers/samtools:1.22.1--h96c455f_0
  runtime:
    kind: command
    command: |
      cat > /tmp/.command1.sh <<'NF'
      # SAMTOOLS_SORT
      . ${sample}/meta.env; fa=$$(ls ${fasta})
      rm -rf ${sort_chain}/sort && mkdir -p ${sort_chain}/sort && cd ${sort_chain}/sort
      ln -s ${bowtie2_item}/$${id}.bam ${fasta}/$$fa .
      samtools cat \
          $${id}.bam \
      | \
      samtools sort \
          -T $${id}.sorted \
          --threads 4 \
          --reference $$fa \
          -o $${id}.sorted.bam \
          -
      rm $${id}.bam $$fa
      NF
      cat > /tmp/.command2.sh <<'NF'
      # SAMTOOLS_INDEX
      . ${sample}/meta.env
      rm -rf ${sort_chain}/sort_index && mkdir -p ${sort_chain}/sort_index && cd ${sort_chain}/sort_index
      ln -s ${sort_chain}/sort/$${id}.sorted.bam .
      samtools \
          index \
          -@ 2 \
          $${id}.sorted.bam
      rm $${id}.sorted.bam
      NF
      cat > /tmp/.command3.sh <<'NF'
      # SAMTOOLS_STATS
      . ${sample}/meta.env; fa=$$(ls ${fasta})
      rm -rf ${sort_chain}/sort_stats && mkdir -p ${sort_chain}/sort_stats && cd ${sort_chain}/sort_stats
      ln -s ${sort_chain}/sort/$${id}.sorted.bam ${sort_chain}/sort_index/$${id}.sorted.bam.bai ${fasta}/$$fa .
      samtools \
          stats \
          --threads 1 \
          --reference $$fa \
          $${id}.sorted.bam \
          > $${id}.sorted.bam.stats
      rm $${id}.sorted.bam $${id}.sorted.bam.bai $$fa
      NF
      cat > /tmp/.command4.sh <<'NF'
      # SAMTOOLS_FLAGSTAT
      . ${sample}/meta.env
      rm -rf ${sort_chain}/sort_flagstat && mkdir -p ${sort_chain}/sort_flagstat && cd ${sort_chain}/sort_flagstat
      ln -s ${sort_chain}/sort/$${id}.sorted.bam ${sort_chain}/sort_index/$${id}.sorted.bam.bai .
      samtools \
          flagstat \
          --threads 1 \
          $${id}.sorted.bam \
          > $${id}.sorted.bam.flagstat
      rm $${id}.sorted.bam $${id}.sorted.bam.bai
      NF
      cat > /tmp/.command5.sh <<'NF'
      # SAMTOOLS_IDXSTATS
      . ${sample}/meta.env
      rm -rf ${sort_chain}/sort_idxstats && mkdir -p ${sort_chain}/sort_idxstats && cd ${sort_chain}/sort_idxstats
      ln -s ${sort_chain}/sort/$${id}.sorted.bam ${sort_chain}/sort_index/$${id}.sorted.bam.bai .
      samtools \
          idxstats \
          --threads $$(( 1 - 1 )) \
          $${id}.sorted.bam \
          > $${id}.sorted.bam.idxstats
      rm $${id}.sorted.bam $${id}.sorted.bam.bai
      NF
      mkdir -p ${sort_chain}
      bash -C -e -u -o pipefail /tmp/.command1.sh && bash -C -e -u -o pipefail /tmp/.command2.sh && bash -C -e -u -o pipefail /tmp/.command3.sh && bash -C -e -u -o pipefail /tmp/.command4.sh && bash -C -e -u -o pipefail /tmp/.command5.sh
  target:
    kind: local
